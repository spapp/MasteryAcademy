[alembic]
script_location = alembic
# Puts the backend folder on the import path so env.py can import `app` when run as the `alembic` command.
prepend_sys_path = .
# The URL comes from DATABASE_URL (see alembic/env.py).

[loggers]
keys = root
[handlers]
keys = console
[formatters]
keys = generic
[logger_root]
level = WARN
handlers = console
[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic
[formatter_generic]
format = %(levelname)s %(name)s %(message)s
