# Render blueprint: one web service built from backend/Dockerfile and one PostgreSQL database.
# In Render: New > Blueprint, pick this repository. Plans and region can be changed in the dashboard.
# Both plans are free: the web service sleeps after 15 idle minutes (the first request then takes about a minute),
# and a free Render Postgres database expires 30 days after creation. Courses are reloaded from the image on every start,
# so an expired database loses only the AI usage counts. Move both to paid plans for an always-on server.
services:
  - type: web
    name: mastery-academy-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    healthCheckPath: /v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Asked for once when the blueprint is created; stored only in Render, never in the repository.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_KEY
        sync: false
      - key: AI_DAILY_LIMIT
        value: "100"
      - key: AI_MONTHLY_CAP_USD
        value: "5"
      - key: DATABASE_URL
        fromDatabase:
          name: mastery-academy-db
          property: connectionString

databases:
  - name: mastery-academy-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"
