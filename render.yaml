# Render blueprint: one web service built from backend/Dockerfile and one PostgreSQL database.
# In Render: New > Blueprint, pick this repository. Plans and region can be changed in the dashboard.
services:
  - type: web
    name: mastery-academy-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: starter
    region: singapore
    healthCheckPath: /v1/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true
      # Asked for once when the blueprint is created; stored only in Render, never in the repository.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: APP_KEY
        sync: false
      - key: AI_DAILY_LIMIT
        value: "100"
      - key: AI_MONTHLY_CAP_USD
        value: "5"
      - key: DATABASE_URL
        fromDatabase:
          name: mastery-academy-db
          property: connectionString

databases:
  - name: mastery-academy-db
    plan: basic-256mb
    region: singapore
    postgresMajorVersion: "16"
