function animCode(){const d=R.dur,sec=(d/1000).toFixed(2),e=R.ease,sp=e==='spring';
  if(R.tab==='swiftui')return `// A state change, animated
withAnimation(${sp?'.spring(response: '+sec+', dampingFraction: 0.8)':'.'+({linear:'linear','ease-in':'easeIn','ease-out':'easeOut','ease-in-out':'easeInOut'})[e]+'(duration: '+sec+')'}) {
    quantity += 1
}
// Navigation: let NavigationStack use the system push. Do not re-time it to match a prototype.
path.append(Route.product(id))
// Honour Reduce Motion
@Environment(\\.accessibilityReduceMotion) var reduceMotion`;
  if(R.tab==='compose')return `// A state change, animated
val width by animateDpAsState(
    targetValue = if (quantity > 0) 96.dp else 64.dp,
    animationSpec = ${sp?'spring(dampingRatio = 0.8f, stiffness = Spring.StiffnessMediumLow)':'tween(durationMillis = '+d+', easing = '+({linear:'LinearEasing','ease-in':'FastOutLinearInEasing','ease-out':'LinearOutSlowInEasing','ease-in-out':'FastOutSlowInEasing'})[e]+')'}
)
// Navigation: Navigation Compose supplies default transitions; override per destination only when the design system asks for it.
navController.navigate("product/$id")`;
  return `// A state change, animated
AnimatedContainer(
  duration: const Duration(milliseconds: ${d}),
  curve: ${sp?'Curves.easeOutBack,   // or drive a SpringSimulation for a true spring':'Curves.'+({linear:'linear','ease-in':'easeIn','ease-out':'easeOut','ease-in-out':'easeInOut'})[e]+','}
  width: quantity > 0 ? 96 : 64,
  child: child,
)
// Navigation: MaterialPageRoute and CupertinoPageRoute give each platform its own push.
Navigator.of(context).push(MaterialPageRoute(builder: (_) => ProductPage(id: id)));
// Honour reduced motion
final reduce = MediaQuery.disableAnimationsOf(context);`}
V.prototyping=()=>{
  main.innerHTML=`<div class="wrap">${head('Module 16','Prototyping: design that moves','A prototype connects frames so that a static file behaves like an app. For an engineer it is the nearest thing to a spec for navigation, state and motion, and it needs reading as carefully as the screens.')}
  <section class="cols"><div class="panel"><h2>The parts of an interaction</h2>${list(['<b>Hotspot:</b> the layer the user acts on.','<b>Trigger:</b> what the user does. On tap is the common one; there are also drag, press, hover and after delay.','<b>Action:</b> what happens. Navigate to a frame, go back, open or close an overlay, scroll to a layer, change a component to another variant, set a variable.','<b>Destination:</b> where the action lands.','<b>Animation:</b> how it gets there. Type, direction, easing curve and a duration from 1 ms to 10 s.','<b>Flow:</b> a set of connected frames with a starting point. One file can hold several flows.'])}<p class="note">Trigger and action names are from memory; open the Prototype tab in a file to see the current list.</p></div>
  <div class="panel"><h2>Why it exists</h2><p>Screens side by side do not show order, back behaviour or what an Add button does to the rest of the screen. A prototype can be put in front of a user before any code exists, which is the cheapest point to find out that a flow is confusing. It also answers the questions a developer otherwise has to ask one at a time.</p></div></section>
  <section class="panel"><h2>Play the flow</h2><p>Blue outlines are hotspots. Tap them to move through Home, Listing, Product, Basket, Checkout and Confirmed. Change the animation on the left and tap again.</p>
  <div id="pflow"></div>${fcLegend}
  <div class="split"><div class="plain">
    <div class="ctlgrp"><b>Animation</b>${seg(R,'anim',[['instant','Instant'],['dissolve','Dissolve'],['movein','Move in'],['push','Push'],['slidein','Slide in']])}</div>
    <div class="ctlgrp"><b>Easing</b>${seg(R,'ease',[['linear','Linear'],['ease-in','Ease in'],['ease-out','Ease out'],['ease-in-out','Ease in and out'],['spring','Spring']])}</div>
    ${rng(R,'dur','Duration',50,1200,50,' ms')}${chk(R,'hot','Show hotspots')}
    <div class="row"><button type="button" class="btn" id="prestart">Restart flow</button></div>
    <p class="note" id="plast"></p><p class="note">Variable: <code>basketCount</code> = <b id="pvar">0</b></p></div>
   <div class="plain"><div class="stage"><div class="device" style="padding:0;overflow:hidden;border-radius:26px"><div id="pstage" style="position:relative;width:260px;height:440px;overflow:hidden"></div></div><small>Original teaching flow, not a real app</small></div>${simNote}</div></div>
  <h3>Interactions on this frame</h3><div class="tablewrap"><table><thead><tr><th>Hotspot</th><th>Trigger</th><th>Action</th><th>Destination or value</th></tr></thead><tbody id="pints"></tbody></table></div></section>
  <section class="panel"><h2>User flow first, prototype flow second</h2><p>The chart above is a <b>prototype flow</b>: frames and the connections between them. Before any frames exist, a designer draws a <b>user flow</b>: the steps and decisions a person goes through, including the ones that go wrong. This is the checkout as a user flow. Note the two branches the prototype above does not have: not signed in, and payment failed.</p>${userFlow()}<p>When you are handed screens, sketch this chart yourself. Every diamond needs a designed outcome on each exit, and every “no” branch is a screen or state someone has to build.</p></section>
  <section class="panel"><h2>Smart Animate, and why layer names matter</h2><p>Smart Animate looks for layers with the same name and place in the hierarchy in both frames and animates the difference in position, size, opacity, rotation and fill. A layer that has no match dissolves in instead. Tap the button below, then untick the box and tap again.</p>
  <div class="split"><div class="plain">${chk(R,'match','Layer names match in both frames')}<p class="note" id="smsg2"></p></div><div class="stage" style="padding:40px 12px"><div id="smart" role="button" tabindex="0" style="cursor:pointer"></div><small>Add button, then stepper</small></div></div>
  <p class="note">Checked against Figma Help on 10 Nov 2026: matching uses name and hierarchy; animated properties are scale, position, opacity, rotation and fill; drop and inner shadows and overlay actions are not smart-animated; unsupported cases fall back to a dissolve. Source: <a href="https://help.figma.com/hc/en-us/articles/360039818874-Smart-animate-layers-between-frames" target="_blank" rel="noopener">Smart animate layers between frames</a>.</p></section>
  <section class="panel"><div class="row" style="justify-content:space-between"><h2>The motion spec in code</h2>${seg(R,'tab',[['swiftui','SwiftUI'],['compose','Compose'],['flutter','Flutter']])}</div><div id="pcode"></div><p class="note">Uses the easing and duration chosen above. Not compiled here. “Spring” in the player is approximated with a curve that overshoots; native springs are defined by stiffness and damping, not duration.</p></section>
  <section class="panel"><h2>From prototype action to code</h2><div class="tablewrap"><table><thead><tr><th>Figma action</th><th>SwiftUI</th><th>Compose</th><th>Flutter</th></tr></thead><tbody>
  ${[['Navigate to','NavigationStack: path.append()','navController.navigate()','Navigator.push() or your router’s push'],['Back','dismiss() or path.removeLast()','navController.popBackStack()','Navigator.pop()'],['Open overlay','.sheet / .fullScreenCover / .alert','ModalBottomSheet / Dialog','showModalBottomSheet / showDialog'],['Close overlay','dismiss()','onDismissRequest state change','Navigator.pop()'],['Change to (variant)','@State change inside the view','state change, AnimatedContent','setState, AnimatedSwitcher'],['Scroll to','ScrollViewReader.scrollTo()','LazyListState.animateScrollToItem()','Scrollable.ensureVisible()'],['Set variable','@State / @Observable model','mutableStateOf / ViewModel state','setState / your state holder'],['Conditional','if in the action or view model','if in the event handler','if in the handler or bloc']].map(r=>'<tr>'+r.map((c,i)=>'<td>'+(i?'<code>'+esc(c)+'</code>':c)+'</td>').join('')+'</tr>').join('')}</tbody></table></div></section>
  <section class="cols">
   <div class="panel"><h2>What a prototype is not</h2>${list(['<b>Not a timing spec for navigation.</b> A 300 ms Push in Figma is a stand-in for “push”. Use the platform’s own transition unless motion tokens say otherwise.','<b>Not real state.</b> Prototype variables reset on restart and know nothing about network, failure or loading.','<b>Not every path.</b> Usually only the happy path is wired. Ask what happens on error, empty and back from each screen.','<b>Not the back stack.</b> “Back” returns to the previous frame shown. Real apps need a decision about what back means after checkout.'])}</div>
   <div class="panel"><h2>Build this flow in Figma</h2>${list(['Lay the six frames out left to right and name them.','Open the Prototype tab. Select the search bar, drag its connection handle to Listing. Set On tap, Navigate to, Push, Ease out, 300 ms.','Give each Back control the Back action, not a Navigate to the previous frame, so it works from any entry point.','Create a number variable <code>basketCount</code>. On Add, use Set variable to <code>basketCount + 1</code>. Bind the bar’s visibility and text to it.','On Checkout, add a conditional: if <code>basketCount &gt; 0</code> navigate, else show the message.','Draw the coupons sheet as its own frame and connect it with Open overlay, positioned at the bottom, with a background scrim.','Check the flow starting point is on Home, then present it and run it on a phone.'])}<p class="note">Variables, expressions and conditionals in prototypes have had plan limits. I could not confirm the current rule from the help page, so check your team’s plan.</p></div>
   <div class="panel"><h2>Good and bad</h2>${list(['<b>Bad:</b> every transition is a 600 ms Smart Animate. It feels slow by the third tap.','<b>Good:</b> quick transitions for frequent actions, around 200 to 300 ms, and one longer moment where it matters, such as order placed.','<b>Bad:</b> duplicate frames for basket with 0, 1, 2 and 3 items. <b>Good:</b> one frame and a variable.','<b>Bad:</b> hotspots only on the happy path, so the tester gets stuck. <b>Good:</b> Back works everywhere.'])}</div>
   <div class="panel"><h2>Platform notes</h2>${list(['<b>iOS:</b> push slides in from the trailing edge with an interactive swipe back; sheets come from the bottom. Springs are the default feel.','<b>Android:</b> Material motion uses shared-axis, fade-through and container transforms, with predictive back previews on recent versions. Durations sit roughly between 100 and 500 ms.','<b>Flutter:</b> the page route decides the transition. <code>MaterialPageRoute</code> adapts per platform through the theme’s page transitions; <code>CupertinoPageRoute</code> gives the iOS push and swipe back.','<b>All:</b> when the user turns on reduced motion, replace movement with a fade or nothing.'])}</div>
   <div class="panel"><h2>Common mistakes when reading a prototype</h2>${list(['Copying a prototype’s navigation duration into code.','Assuming a Smart Animate between two frames means a shared-element transition is required. Ask; it is often just the easiest thing to prototype.','Missing overlays because they live as separate frames off to the side.','Not checking which flow you are in when a file has several starting points.','Treating a variable in the prototype as the data model.'])}</div>
   <div class="panel"><h2>Exercise</h2><p>Take a flow you built recently. Write its interactions as rows of hotspot, trigger, action, destination, the way the table above does. Mark every row where the app does something the design never specified. Those rows are the questions a prototype would have answered.</p></div></section>
  ${quiz('prototyping',[{q:'A prototype uses Push, ease out, 300 ms between Listing and Product. What do you implement on iOS?',o:['A custom transition timed to exactly 300 ms','The standard NavigationStack push','A cross-fade, it is simpler'],a:1,why:'The prototype is saying “push”. The platform’s own push brings the right timing and the swipe back for free.'},{q:'In a Smart Animate transition one layer fades in instead of morphing. The likely cause?',o:['The duration is too short','Its name or place in the hierarchy differs between the two frames','Smart Animate does not support text'],a:1,why:'Matching is by name and hierarchy. An unmatched layer dissolves into view.'},{q:'Why give a Back control the Back action instead of Navigate to the previous frame?',o:['It animates faster','It returns to wherever the user came from, so it works from every entry point','Figma requires it'],a:1,why:'Navigate to hardcodes one destination. Back follows the history, as a real back stack does.'}])}
  <section class="panel"><h2>Interview questions</h2>${qa([['What can a prototype tell you that static screens cannot?','Order, back behaviour, what is tappable, what changes in place versus what navigates, overlays, and the intended feel of motion.'],['How do you decide a duration for an animation?','By distance and frequency: small, frequent changes are quick, around 100 to 200 ms; larger moves and screen changes a little longer; rarely above half a second. Then check it with reduced motion on.'],['When is a shared-element transition worth building?','When it preserves context for the user, such as a product image growing into the detail screen, and the platform supports it without fighting navigation. It is not worth it only because the prototype tool made it easy.']])}</section>
  ${doneBtn('prototyping')}</div>`;
  const st=document.getElementById('pstage'),reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;

V.flows=()=>{
  main.innerHTML=`<div class="wrap">${head('Module 8','User flows and information architecture','Two maps come before any screen. A user flow is the path through one task, with every fork. Information architecture is where everything in the app lives and how you get to it. Most “the design missed a case” problems are a missing branch on one of these maps.')}
  <section class="cols"><div class="panel"><h2>Three kinds of flow diagram</h2>${list(['<b>Task flow:</b> one straight path for one task, no decisions. Good for explaining the happy path.','<b>User flow:</b> the same task with decisions and alternate paths. This is the one engineers need.','<b>Wireflow:</b> a user flow where each step is a small wireframe of the screen. Useful once the layout matters.','<b>Journey map:</b> wider than the app. What the person is doing, thinking and feeling before, during and after, including waiting for the delivery.'])}</div>
  <div class="panel"><h2>Why they exist</h2><p>Drawing screens first hides the forks. A flow forces the questions early: what if the user is not signed in, the address is not served, an item went out of stock while they browsed, the payment fails. Each fork costs a minute on a diagram and days if it is found during testing.</p>${fcLegend}</div></section>
  <section class="panel"><h2>Build the checkout flow, one fork at a time</h2><p>Start from the happy path. Switch on each real-world case and watch what it adds.</p>
  <div class="row">${chk(U,'stock','An item went out of stock')}${chk(U,'sign','User may not be signed in')}${chk(U,'serv','Address may not be serviceable')}${chk(U,'pay','Payment can fail')}</div>
  <div id="ufc"></div><div class="meters" id="ucount"></div><p class="note" id="umsg"></p></section>
  <section class="cols"><div class="panel"><h2>Good and bad flows</h2>${list(['<b>Bad:</b> a diamond with one exit. If there is no “no” branch, it is not a decision yet.','<b>Bad:</b> a branch that ends in mid-air. Every path ends at a goal, a recoverable state or back in the flow.','<b>Bad:</b> steps named after screens (“Screen 4”). <b>Good:</b> named after what the user does.','<b>Good:</b> one flow per task. A single chart for the whole app becomes unreadable.','<b>Good:</b> system steps shown too (stock check, payment result), because they decide what the user sees next.'])}</div>
  <div class="panel"><h2>What each shape means for code</h2>${list(['A <b>rectangle</b> is a screen or a state of one: a route, or a case in your view state.','A <b>diamond</b> is a condition in a view model or bloc, usually driven by an API response. Ask which response field decides it.','A <b>dashed box</b> is an overlay or inline state: a sheet, a dialog, a banner. No new route.','A <b>back arrow</b> is a back-stack decision. After “Order confirmed”, back should not return to Payment.','An arrow <b>into the middle</b> of a flow is a deep link or a notification entry. Ask which screens can be opened cold.'])}</div></section>
  <section class="panel"><h2>Information architecture: where things live</h2><p>IA is the grouping and labelling of everything in the app. On mobile it shows up as the tab bar and what sits under each tab. Compare two structures for the same grocery app. The node holding Orders is highlighted.</p>
  <div class="row">${seg(U,'model',[['4','4 tabs, Orders under Account'],['5','5 tabs, Orders is a tab']])}</div><div id="usite"></div>
  <div class="tablewrap"><table><thead><tr><th>Task, starting on Home</th><th>4 tabs</th><th>5 tabs</th></tr></thead><tbody id="utaps"></tbody></table></div>
  <p class="note">Tap counts are for this teaching sitemap. Fewer taps is not automatically better: a fifth tab adds a choice to every screen (Hick’s Law) and takes the Basket out of the bar. Decide by how often people do the task. Tracking an order happens after every purchase; changing notification settings almost never.</p></section>
  <section class="cols"><div class="panel"><h2>Navigation models</h2>${list(['<b>Flat:</b> a few top-level sections switched with tabs. Each tab keeps its own stack.','<b>Hierarchical:</b> drill down from list to detail and come back. Used inside each tab.','<b>Hub and spoke:</b> everything starts from one home screen and returns to it. Common in simple utility apps.','<b>Modal:</b> a self-contained task that sits above the structure, such as checkout or sign in, with a clear close or cancel.','Most apps combine them: flat at the top, hierarchical inside, modal for tasks.'])}</div>
  <div class="panel"><h2>On each platform</h2>${list(['<b>iOS:</b> tab bar for top-level sections, up to five on iPhone; a navigation stack per tab; sheets for modal tasks.','<b>Android:</b> navigation bar for three to five destinations on phones, a rail or drawer on larger screens; back is a system gesture and must make sense from every screen.','<b>Flutter:</b> <code>NavigationBar</code> with a separate navigator per tab; a routing package such as go_router keeps tab stacks and deep links together.','On all three, switching tabs should keep each tab’s place, and tapping the current tab again usually returns to its root.'])}</div></section>
  <section class="panel"><h2>Card sorting: let users do the grouping</h2><p>In a card sort, people group items in the way that makes sense to them, and you look at where they agree and disagree. Try it: tap an item, then tap the group you would expect to find it in.</p><div id="ucs" class="plain"></div><p class="note">The “suggested” grouping is this lesson’s, not research data. In a real study you would run this with 15 or more people and read the items they split on as the finding.</p></section>
  <section class="panel"><h2>From sitemap to routes</h2><p>The sitemap is the first draft of your route table. Each tab is a navigation root, each child is a destination, and each parameter in a route is something a deep link must be able to supply.</p>${code(`// SwiftUI: one stack per tab, typed destinations
enum Route: Hashable { case listing(categoryID: String), product(id: String), order(id: String) }
TabView {
    NavigationStack(path: $homePath) {
        HomeView().navigationDestination(for: Route.self) { route in destination(for: route) }
    }.tabItem { Label("Home", systemImage: "house") }
}

// Jetpack Compose: a graph per tab
NavHost(navController, startDestination = "home") {
    composable("home") { HomeScreen() }
    composable("product/{id}") { entry -> ProductScreen(entry.arguments?.getString("id")) }
    navigation(startDestination = "account/root", route = "account") {

// Flutter with go_router
GoRoute(path: '/account', builder: (c, s) => const AccountPage(), routes: [

]),`)}<p class="note">Illustrative and not compiled. Screen names are assumed.</p></section>
  <section class="cols"><div class="panel"><h2>Draw it yourself</h2>${list(['Use FigJam, a whiteboard or paper. The tool does not matter; the forks do.','Write the task as one sentence: “Pay for my basket and get a delivery time.”','Lay the happy path left to right as rectangles named by what the user does.','At each step ask “what could be different here?” and add a diamond for each real answer.','Give every “no” exit somewhere to go, and decide where back leads from it.','Mark entry points: where can a notification or a link drop someone into this flow?','Count the rectangles and dashed boxes. That is the list of screens and states the design must contain.'])}</div>
  <div class="panel"><h2>Common mistakes</h2>${list(['Reviewing screens without ever seeing the flow, then finding the forks in QA.','Structuring the app like the company’s org chart instead of the user’s tasks.','Labels only insiders understand. “My Benefits” instead of “Offers”.','Hiding a frequent task three levels down because it did not fit a tab.','Forgetting that a deep link skips the path, so the destination must work without the screens before it.'])}</div>
  <div class="panel"><h2>Exercise</h2><p>Pick a flow in your app that has had production bugs. Draw its user flow from the code, not the design: every condition that changes what the user sees becomes a diamond. Compare it with the screens in Figma and list the branches that have no design. Bring that list to the next design review.</p></div></section>
  ${quiz('flows',[{q:'A flow has a diamond “Payment successful?” with only a “yes” arrow. What is missing?',o:['A colour for the diamond','The “no” exit and where it leads','A wireframe of the payment screen'],a:1,why:'A decision with one exit is an unanswered question. The failure path is a state someone must design and build.'},{q:'Users track an order after every purchase, but Orders sits under Account, three taps away. What does IA thinking suggest?',o:['Leave it; fewer tabs are always better','Bring the frequent task closer: a tab, or a tracking card on Home','Add a tutorial explaining where Orders is'],a:1,why:'Depth should follow frequency. Frequent tasks earn a shallow place; rare ones can sit deeper.'},{q:'In a card sort, half the participants put “Wallet” under Account and half under Checkout. What do you conclude?',o:['The study failed','The item has two natural homes, so make it reachable from both or rename it','Pick Account, it had the first vote'],a:1,why:'Disagreement is the finding. It tells you where users will look, which may be more than one place.'}])}
  <section class="panel"><h2>Interview questions</h2>${qa([['What is the difference between a user flow and a sitemap?','A user flow is one task over time, with decisions. A sitemap is the static structure: what exists and what sits under what. You need both; a flow travels through the sitemap.'],['How would you decide what goes in the tab bar?','List the top tasks by frequency and importance, group them into three to five sections users would name the same way, and test the labels. Everything else lives under those sections or in search.'],['A push notification opens the order tracking screen directly. What does that change?','The screen cannot assume the user came through Orders. It needs its own data loading, a sensible back destination, and to work when the user is signed out or the order no longer exists.']])}</section>
  ${doneBtn('flows')}</div>`;

    document.getElementById('ucount').innerHTML=`<div class="meter"><span>Screens on the happy path</span><b>4</b></div><div class="meter"><span>Decisions</span><b>${f.dec}</b></div><div class="meter"><span>Extra screens or states to design</span><b>${f.dec}</b></div>`;

    const chip=i=>`<button type="button" class="btn" data-cs="${i}" aria-pressed="${U.sel===i}" style="padding:5px 10px;font-weight:500;font-size:13px;${U.sel===i?'border-color:var(--accent);background:var(--accent-soft)':''}">${CSI[i]}</button>`;
    const pool=CSI.map((t,i)=>i).filter(i=>U.a[i]==null),n=CSI.length-pool.length;let res='';
    if(!pool.length){const ok=CSI.filter((t,i)=>CSS[i].includes(U.a[i])).length,amb=CSI.filter((t,i)=>CSS[i].length>1);res=`<p><b>${ok} of ${CSI.length}</b> match the suggested grouping. ${amb.length} items have more than one defensible home: ${amb.join(', ')}. If your answer differed on those, you are not wrong; those are the items a real study would flag.</p>`}
    document.getElementById('ucs').innerHTML=`<div class="row">${pool.map(chip).join('')||'<span style="color:var(--ink-2)">All items sorted.</span>'}</div><div class="cols" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))">${CSG.map((g,gi)=>`<div data-grp="${gi}" style="border:1.5px dashed ${U.sel!=null?'var(--accent)':'var(--line)'};border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:92px;cursor:${U.sel!=null?'pointer':'default'}"><b>${g}</b>${CSI.map((t,i)=>i).filter(i=>U.a[i]===gi).map(chip).join('')}</div>`).join('')}</div><div class="row"><span>${n} of ${CSI.length} sorted${U.sel!=null?' · now tap a group for “'+CSI[U.sel]+'”':''}</span><button type="button" class="btn" id="csreset">Start again</button></div>${res}`};
  bind(U,draw,e=>{const c=e.target.closest('[data-cs]');if(c){U.sel=U.sel===+c.dataset.cs?null:+c.dataset.cs;draw();return}
    const g=e.target.closest('[data-grp]');if(g&&U.sel!=null){U.a[U.sel]=+g.dataset.grp;U.sel=null;draw();return}
    if(e.target.id==='csreset'){U.a={};U.sel=null;draw()}});draw();
};

const Q={mode:'side',op:50,fpad:false,fwt:false,fcol:false,frad:false,fgap:false,dev:3,theme:2,text:3,loc:2,states:4,tab:'ios'};

function qaCode(){if(Q.tab==='ios')return `// iOS with the open-source swift-snapshot-testing library (API written from memory; check its README)

V.designqa=()=>{
  main.innerHTML=`<div class="wrap">${head('Module 34 · with the compare tool from module 33','Design QA and visual regression','Design QA asks one question: does what we built match what was designed, in every state that matters? Visual regression asks the follow-up: did today’s change alter a screen nobody meant to touch?')}
  <section class="cols"><div class="panel"><h2>Two different checks</h2>${list(['<b>Design QA</b> compares the build with the design. A person does it, usually the designer and the developer together, before release.','<b>Visual regression</b> compares the build with <i>yesterday’s build</i>. A machine does it on every pull request, using stored reference images.','The reference image goes by different names: <b>snapshot</b> on iOS, <b>screenshot</b> on Android, <b>golden</b> in Flutter. Same idea.','Design QA finds “this was never right”. Visual regression finds “this used to be right”.'])}</div>
  <div class="panel"><h2>Why it exists</h2><p>A shared padding token changes from 16 to 12 for one screen and forty other screens shift with it. Unit tests pass, because no logic changed. Only a comparison of pixels catches it. Without one, the bug is found by a user or by the designer scrolling through the app a week later.</p></div></section>
  <section class="panel"><h2>Compare a build against its design</h2><p>The built card has five deviations from the design. Use the three views to find them, then fix each one. This is the same job as holding a device screenshot over a Figma frame.</p>
  <div class="split"><div class="plain"><div class="ctlgrp"><b>View</b>${seg(Q,'mode',[['side','Side by side'],['overlay','Overlay'],['diff','Difference']])}${rng(Q,'op','Overlay opacity',0,100,5,'%')}</div>
   <div class="ctlgrp"><b>Fix in the build</b>${QF.map(f=>chk(Q,f[0],f[1])).join('')}</div><p class="note" id="qmsg"></p></div>
   <div class="plain"><div class="stage" style="padding:28px 12px"><div id="qstage"></div><small id="qcap"></small></div>${simNote}</div></div>
  <div class="tablewrap"><table><thead><tr><th>Property</th><th>Design</th><th>Build</th><th>Verdict</th><th>Likely cause</th></tr></thead><tbody id="qrows"></tbody></table></div>
  <p class="note">This table compares properties, because both cards are drawn by this page. A real tool compares pixels and only tells you <i>where</i> they differ; finding the property is your job.</p></section>
  <section class="panel"><h2>Pixel-perfect has limits</h2>${list(['<b>Text never matches exactly.</b> Figma, iOS, Android and Flutter each shape and antialias text slightly differently. A one-pixel shimmer on glyph edges is expected.','<b>Accessibility wins.</b> If matching the frame means fixed heights that clip at large text sizes, the frame loses.','<b>So does localisation.</b> A label that fits in English and overflows in German is a layout to fix, not a pixel to match.','<b>And platform behaviour.</b> A native control that looks slightly different from the mock but behaves correctly is usually the right call. Raise it; do not silently rebuild the control.','Match exactly: spacing, sizes, radii, colours, type styles, alignment. Match in spirit: text rendering, system controls, shadows.'])}</section>
  <section class="panel"><h2>How visual regression runs in CI</h2>${(()=>fc(680,200,[{id:'a',x:60,y:50,t:'Pull request|opened',s:'p',w:96},{id:'b',x:180,y:50,t:'Render|snapshots'},{id:'c',x:305,y:50,t:'Compare with|reference',w:104},{id:'d',x:435,y:50,t:'Any diff?',s:'d',h:62},{id:'e',x:600,y:50,t:'Checks pass',s:'p'},{id:'f',x:435,y:150,t:'Intended|change?',s:'d',w:112,h:62},{id:'g',x:305,y:150,t:'Fix the code'},{id:'h',x:600,y:150,t:'Update reference,|designer reviews',w:128}],[{a:'a',b:'b'},{a:'b',b:'c'},{a:'c',b:'d'},{a:'d',b:'e',l:'no'},{a:'d',b:'f',l:'yes'},{a:'f',b:'g',l:'no'},{a:'f',b:'h',l:'yes'},{a:'g',b:'b',d:1,l:'re-run'},{a:'h',b:'e'}]))()}
  <p>The important box is the bottom right one. A changed reference image is a design change and should be reviewed like one: the pull request shows the old image, the new image and the difference, and someone who knows the design approves it. Updating references just to make the check pass defeats the test.</p></section>
  <section class="panel"><div class="row" style="justify-content:space-between"><h2>The test on each platform</h2>${seg(Q,'tab',[['ios','iOS'],['android','Android'],['flutter','Flutter']])}</div><div id="qcode"></div><p class="note">Not compiled here. Library APIs for iOS and Android are from memory and change between versions.</p></section>
  <section class="panel"><h2>How many snapshots?</h2><p>Every axis you test multiplies the count. Set the axes for one component.</p>
  <div class="split"><div class="plain">${rng(Q,'dev','Device widths',1,5,1)}${rng(Q,'theme','Themes (light, dark)',1,2,1)}${rng(Q,'text','Text sizes',1,4,1)}${rng(Q,'loc','Locales or directions',1,4,1)}${rng(Q,'states','Component states',1,8,1)}</div><div class="plain" id="qmat"></div></div></section>
  <section class="cols"><div class="panel"><h2>Why snapshot tests flake</h2>${list(['<b>Different machines:</b> antialiasing and font rendering differ between macOS versions, GPUs and CI images. Record and verify on the same kind of machine.','<b>Fonts not loaded:</b> the test falls back to a system or placeholder font.','<b>Animation and time:</b> a spinner mid-turn, a blinking cursor, “2 minutes ago”. Freeze them.','<b>Network images:</b> replace with local fixtures.','<b>Shadows and blurs:</b> often rendered differently per platform version. Allow a small tolerance or leave them out of the component under test.'])}</div>
  <div class="panel"><h2>A manual design QA pass</h2>${list(['Same device size as the frame, real build, real data where possible.','Screenshot each state and overlay it on the frame at 50%.','Walk the checklist: spacing, alignment, type, colour, radius, icons, states.','Then the things a frame cannot show: 200% text, dark, RTL, long content, slow network, keyboard open.','Then VoiceOver or TalkBack through the screen once.','Log each finding with both images, the property and the expected value.'])}</div>
  <div class="panel"><h2>Good and bad</h2>${list(['<b>Bad:</b> full-screen snapshots of every screen with live data. Every content change fails the suite.','<b>Good:</b> component-level snapshots with fixed fixtures, plus a few key screens.','<b>Bad:</b> a 5% tolerance to stop flakes. A wrong colour on a small button is under 1% of the pixels.','<b>Good:</b> fix the cause of the flake and keep tolerance near zero.','<b>Bad:</b> “LGTM” on 200 changed reference images. <b>Good:</b> small changes, reviewed by someone who can say yes for design.'])}</div>
  <div class="panel"><h2>Exercise</h2><p>Pick one component you own. Write a snapshot or golden test for its default state and one for large text in dark mode. Then change its padding by 2 and run the tests. Look at the failure output and note how long it takes you to get from “image differs” to “padding”.</p></div></section>
  ${quiz('designqa',[{q:'A pull request only renames a variable, yet 30 golden images changed. What is the most likely explanation?',o:['The rename changed layout','The references were recorded on a different machine or with different fonts than CI uses','Golden tests are random'],a:1,why:'A no-op code change with mass diffs points at the environment: rendering or fonts differ between record and verify.'},{q:'The build’s text looks one pixel softer than Figma on every glyph. What do you do?',o:['Log a bug for each text layer','Treat it as expected rendering difference and check size, weight and line height instead','Switch the app to images of text'],a:1,why:'Each renderer antialiases differently. Verify the type properties; do not chase glyph edges.'},{q:'What should happen when a snapshot changes on purpose?',o:['Raise the tolerance until it passes','Update the reference and have the image change reviewed','Delete the test'],a:1,why:'The reference is the spec for that state. Changing it is a design change and needs a reviewer.'}])}
  <section class="panel"><h2>Interview questions</h2>${qa([['What is the difference between a golden test and a UI test?','A golden test renders a view and compares pixels with a stored image; it checks appearance. A UI test drives the app and asserts on behaviour or element presence. Goldens are fast and catch visual drift; UI tests catch broken flows.'],['How do you keep a snapshot suite from becoming noise?','Test components, not whole screens; fix data, time and fonts; record and verify in the same environment; keep tolerance tight; and make reference changes a reviewed part of the pull request.'],['Where does design QA sit in the release process?','Per feature before merge, by the developer with an overlay; with the designer before release on a real device; and automatically on every pull request through visual regression for anything already approved.']])}</section>
  ${doneBtn('designqa')}</div>`;
  const draw=()=>{const st=document.getElementById('qstage'),left=QF.filter(f=>!Q[f[0]]);
    if(Q.mode==='side')st.innerHTML=`<div class="row" style="align-items:flex-start;justify-content:center;gap:20px"><div class="plain" style="align-items:center"><span class="eyebrow">Design</span>${qaCard(false)}</div><div class="plain" style="align-items:center"><span class="eyebrow">Build</span>${qaCard(true)}</div></div>`;
    else st.innerHTML=`<div style="position:relative;background:#fff;padding:16px;border-radius:6px;isolation:isolate">${qaCard(false)}<div style="position:absolute;left:16px;top:16px;${Q.mode==='overlay'?`opacity:${Q.op/100}`:'mix-blend-mode:difference'}">${qaCard(true)}</div></div>`;
    document.getElementById('qcap').textContent=Q.mode==='side'?'Side by side: easy to read, hard to spot a 4 px shift.':Q.mode==='overlay'?'Overlay: the build sits on the design. Move the opacity back and forth and watch for edges that jump.':'Difference: black means identical pixels. Anything lit is a mismatch.';
    document.getElementById('qmsg').textContent=left.length?`${left.length} of 5 deviations still in the build.`:'The build matches. In Difference view the card is now solid black.';
    document.getElementById('qrows').innerHTML=QF.map(f=>`<tr><td>${f[1]}</td><td>${f[2]}</td><td>${Q[f[0]]?f[2]:f[3]}</td><td><span class="st ${Q[f[0]]?'ok':'no'}" style="font:700 10.5px var(--f-mono)">${Q[f[0]]?'MATCH':'BUG'}</span></td><td>${Q[f[0]]?'':f[4]}</td></tr>`).join('')+'<tr><td>Text edge rendering</td><td>Figma</td><td>Device</td><td><span class="st info" style="font:700 10.5px var(--f-mono)">EXPECTED</span></td><td>Different text renderers. Not a bug.</td></tr>';

const N={ease:'ease-out',dur:300,k:180,c:14,reduce:false,tab:'swiftui',kind:'curve',qty:0};
const NE={linear:['Linear',[0,0,1,1]],'ease-in':['Ease in',[.42,0,1,1]],'ease-out':['Ease out',[0,0,.58,1]],'ease-in-out':['Ease in and out',[.42,0,.58,1]],emph:['Emphasised',[.2,0,0,1]]};
const nBez=k=>`cubic-bezier(${NE[k][1].join(',')})`;
function springSim(){const k=N.k,c=N.c,dt=1/240,pts=[];let x=0,v=0,t=0,settle=0;
  while(t<3){const a=-k*(x-1)-c*v;v+=a*dt;x+=v*dt;t+=dt;pts.push(x);if(Math.abs(x-1)>.004||Math.abs(v)>.02)settle=t}
  const T=Math.min(3,Math.max(.25,settle));return{pts:pts.slice(0,Math.ceil(T*240)),T,zeta:c/(2*Math.sqrt(k)),resp:2*Math.PI/Math.sqrt(k),peak:Math.max(...pts)}}
function motionCode(){const d=N.dur,sec=(d/1000).toFixed(2),b=NE[N.ease][1],s=springSim(),z=s.zeta.toFixed(2),rp=s.resp.toFixed(2),sp=N.kind==='spring';
  if(N.tab==='swiftui')return sp?`// stiffness ${N.k}, damping ${N.c}, mass 1  →  response ${rp} s, damping fraction ${z}
withAnimation(.spring(response: ${rp}, dampingFraction: ${Math.min(1,s.zeta).toFixed(2)})) {
    isExpanded.toggle()
}
// or attach it to a value
.animation(.spring(response: ${rp}, dampingFraction: ${Math.min(1,s.zeta).toFixed(2)}), value: quantity)
// Newer SwiftUI also offers .spring(duration:bounce:) and presets such as .snappy and .bouncy.`:`withAnimation(${N.ease==='linear'?'.linear':N.ease==='ease-in'?'.easeIn':N.ease==='ease-out'?'.easeOut':N.ease==='ease-in-out'?'.easeInOut':'.timingCurve('+b.join(', ')+','}${N.ease==='emph'?' duration: '+sec+')':'(duration: '+sec+')'}) {
    isExpanded.toggle()
}
// Honour Reduce Motion
@Environment(\\.accessibilityReduceMotion) private var reduceMotion
withAnimation(reduceMotion ? .none : .easeOut(duration: ${sec})) { isExpanded.toggle() }`;
  if(N.tab==='compose')return sp?`// stiffness ${N.k}, damping ratio ${z}
val offset by animateDpAsState(
    targetValue = if (expanded) 120.dp else 0.dp,
    animationSpec = spring(dampingRatio = ${z}f, stiffness = ${N.k}f),
    label = "offset"
)`:`val offset by animateDpAsState(
    targetValue = if (expanded) 120.dp else 0.dp,
    animationSpec = tween(durationMillis = ${d}, easing = ${N.ease==='linear'?'LinearEasing':'CubicBezierEasing('+b.map(v=>v+'f').join(', ')+')'}),

AnimatedVisibility(visible = expanded, enter = fadeIn() + expandVertically(), exit = fadeOut() + shrinkVertically()) { Details() }

final spring = SpringDescription(mass: 1, stiffness: ${N.k}, damping: ${N.c});

  duration: const Duration(milliseconds: ${d}),

)
// Honour reduced motion
final reduce = MediaQuery.disableAnimationsOf(context);
// duration: reduce ? Duration.zero : const Duration(milliseconds: ${d})`}

  main.innerHTML=`<div class="wrap">${head('Module 24','Animations and microinteractions','Motion on a phone has three honest jobs: confirm that a touch landed, show where something came from or went, and make waiting feel shorter. Anything that does none of these is decoration, and decoration gets old by the tenth time.')}
  <section class="cols"><div class="panel"><h2>The vocabulary</h2>${list(['<b>Duration:</b> how long it takes. Most interface motion sits between 100 and 400 ms.','<b>Easing:</b> how speed changes over that time. Real objects accelerate and slow down; linear motion looks mechanical.','<b>Spring:</b> motion defined by physics (stiffness, damping) instead of a fixed duration. It can overshoot and settle, and it can be interrupted smoothly.','<b>Transition:</b> how one screen or state replaces another.','<b>Microinteraction:</b> a small, single-purpose response: a button press, a like, a quantity change.','<b>Haptic:</b> a tap you feel. It pairs with motion to confirm an action.'])}</div>

  <section class="panel"><h2>Four microinteractions</h2><div class="row">${chk(N,'reduce','Reduce motion')}<span style="color:var(--ink-2);font-size:13px">Turn it on and replay each one to see the reduced version.</span></div>
  <div class="cols" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))">
   <div class="panel"><h3>Press feedback</h3><div class="stage" style="padding:24px 8px"><button type="button" id="mi-press" style="border:0;border-radius:10px;background:#17703D;color:#fff;font-weight:700;padding:12px 22px;cursor:pointer">Pay ₹320</button></div><p style="font-size:13px">A quick dip in scale tells the thumb it landed, before anything loads. About 100 to 150 ms. Reduced: a brief dim instead.</p></div>
   <div class="panel"><h3>Add becomes a stepper</h3><div class="stage" style="padding:24px 8px"><div id="mi-add" role="button" tabindex="0" style="cursor:pointer"></div></div><p style="font-size:13px">The button grows into the stepper, so the eye keeps track of one object. Reduced: swap in place with a short fade.</p></div>
   <div class="panel"><h3>Spinner versus skeleton</h3><div class="stage" style="padding:12px 8px"><div class="row" style="gap:10px;align-items:flex-start"><div id="mi-spin" style="width:96px"></div><div id="mi-skel" style="width:96px"></div></div><button type="button" class="btn" id="mi-load" style="padding:4px 10px;font-size:12px">Reload</button></div><p style="font-size:13px">Both wait 1.2 s. The skeleton shows the shape of what is coming and nothing jumps when it arrives. Reduced: static placeholders.</p></div>
   <div class="panel"><h3>Toast</h3><div class="stage" style="padding:12px 8px"><div style="position:relative;width:170px;height:110px;border-radius:12px;background:var(--surface);border:1px solid var(--line);overflow:hidden"><button type="button" class="btn" id="mi-toast" style="margin:12px;padding:4px 10px;font-size:12px">Add item</button><div id="mi-t" style="position:absolute;left:8px;right:8px;bottom:8px;background:var(--ink);color:var(--surface);border-radius:8px;padding:8px;font-size:12px;opacity:0">Added to basket</div></div></div><p style="font-size:13px">Enters from the edge it lives on, eases out, leaves faster than it came. Reduced: fade only.</p></div>
  </div></section>
  <section class="panel"><h2>Duration by size of change</h2><div class="tablewrap"><table><thead><tr><th>Change</th><th>Typical duration</th><th>Easing</th></tr></thead><tbody>
  <tr><td>Press, toggle, checkbox, small fade</td><td>100 to 150 ms</td><td>Ease out</td></tr><tr><td>Element entering: toast, chip, expanding row</td><td>200 to 300 ms</td><td>Ease out (starts fast, settles)</td></tr><tr><td>Element leaving</td><td>150 to 200 ms</td><td>Ease in (accelerates away)</td></tr><tr><td>Sheet, dialog, screen transition</td><td>300 to 400 ms</td><td>Ease in and out, or the platform default</td></tr><tr><td>Moving between two on-screen positions</td><td>250 to 400 ms, longer for longer distances</td><td>Ease in and out, or a spring</td></tr></tbody></table></div>
  <p class="note">These are working ranges from common practice, not quotes from a guideline. Material publishes duration and easing tokens, and Apple’s guidance leans on system springs; check both before fixing motion tokens for a product.</p></section>
  <section class="cols">
   <div class="panel"><h2>Platform toolkit</h2>${list(['<b>SwiftUI:</b> <code>withAnimation</code>, <code>.animation(_:value:)</code>, <code>.transition</code>, <code>matchedGeometryEffect</code> for shared elements, <code>.sensoryFeedback</code> for haptics.','<b>UIKit:</b> <code>UIView.animate</code>, <code>UIViewPropertyAnimator</code> for interruptible motion, <code>UIImpactFeedbackGenerator</code>.','<b>Compose:</b> <code>animate*AsState</code>, <code>AnimatedVisibility</code>, <code>AnimatedContent</code>, <code>updateTransition</code>, shared element transitions, <code>LocalHapticFeedback</code>.','<b>Flutter:</b> implicit <code>Animated*</code> widgets, <code>AnimationController</code> with <code>Tween</code> and <code>Curve</code>, <code>Hero</code>, <code>AnimatedSwitcher</code>, <code>HapticFeedback</code>.'])}</div>
   <div class="panel"><h2>Motion accessibility</h2>${list(['Some people get dizzy or nauseous from large movement, zooms and parallax. The system setting exists for them.','<b>iOS:</b> Reduce Motion, read with <code>accessibilityReduceMotion</code>.','<b>Android:</b> Remove animations sets animator duration scale to zero.','<b>Flutter:</b> <code>MediaQuery.disableAnimationsOf(context)</code>.','Reduce, do not remove: keep feedback, swap movement for a fade, stop anything that loops or auto-plays.','Never convey information by motion alone.'])}</div>
   <div class="panel"><h2>Engineering implications</h2>${list(['A frame is about 16.7 ms at 60 Hz and 8.3 ms at 120 Hz. Animate transform and opacity; avoid animating layout, which recalculates every frame.','Animations must be interruptible. A user who taps again mid-animation should not wait for it to finish.','Motion needs tokens too: a small set of durations and curves, so twelve screens do not ship twelve easings.','Complex vector animation (Lottie, Rive) is an asset with its own cost. Use it for moments, not for buttons.','Snapshot tests should freeze animations at a known frame.'])}</div>
   <div class="panel"><h2>Good and bad</h2>${list(['<b>Bad:</b> a 600 ms flourish on Add to basket, the most repeated action in the app.','<b>Good:</b> 150 ms of feedback there, and the flourish saved for Order placed.','<b>Bad:</b> linear easing on anything that moves.','<b>Bad:</b> a spinner replacing content that then jumps into place. <b>Good:</b> a skeleton with the final layout.','<b>Bad:</b> a looping animation next to text the user is trying to read.'])}</div>
   <div class="panel"><h2>Reading motion in a Figma prototype</h2>${list(['Note the trigger, the easing name and the duration for each interaction.','Ask which are intent (“this should feel bouncy”) and which are tool defaults.','For screen changes, use the platform transition unless a motion token says otherwise.','Ask what the reduced-motion version is. It is rarely drawn.'])}</div>
   <div class="panel"><h2>Exercise</h2><p>Record your app’s add-to-basket interaction in slow motion. Write down what moves, for how long and with what easing. Then decide for each piece: does it confirm, explain or shorten a wait? Remove one thing that does none of those, and add a reduced-motion path if there is none.</p></div></section>
  ${quiz('motion',[{q:'A toast slides in from the bottom. Which easing suits its entrance?',o:['Ease in: starts slow, ends fast','Ease out: starts fast, settles gently','Linear'],a:1,why:'Entering elements should arrive quickly and decelerate into place. Ease in suits exits.'},{q:'You raise a spring’s damping while keeping stiffness the same. What happens?',o:['It overshoots more','It overshoots less and settles with less bounce','It gets a longer fixed duration'],a:1,why:'Damping removes energy. Low damping bounces; around a damping ratio of 1 it settles without overshoot.'},{q:'The user has Reduce Motion on. What should the add-to-basket animation do?',o:['Play as normal, it is short','Disappear completely, including the confirmation','Keep the confirmation but swap movement for a fade or instant change'],a:2,why:'The setting asks for less movement, not less feedback.'}])}
  <section class="panel"><h2>Interview questions</h2>${qa([['When would you choose a spring over a duration and curve?','For anything driven by a gesture or likely to be interrupted, since a spring carries velocity and retargets smoothly, and for motion that should feel physical. A curve is fine for simple fades and fixed transitions.'],['How do you keep animations smooth?','Animate properties the compositor can handle (transform, opacity), keep per-frame work off the main thread where the platform allows, avoid layout changes each frame, profile on a low-end device, and keep durations short enough that dropped frames are not visible.'],['What belongs in a motion system?','A few named durations and easings or spring presets, rules for enter, exit and move, platform defaults for navigation, haptic pairing, and the reduced-motion alternative for each pattern.']])}</section>
  ${doneBtn('motion')}</div>`;
  const live=id=>document.getElementById(id);
  const curve=()=>{const b=NE[N.ease][1];live('ncurve').innerHTML=`<svg viewBox="0 0 150 132" width="100%" style="max-width:210px" role="img" aria-label="Easing curve"><rect x="20" y="10" width="100" height="100" style="fill:none;stroke:var(--line)"/><path d="M20,110 C${20+b[0]*100},${110-b[1]*100} ${20+b[2]*100},${110-b[3]*100} 120,10" style="fill:none;stroke:var(--accent);stroke-width:2.5"/><text x="70" y="126" text-anchor="middle" style="font:10px var(--f-mono);fill:var(--ink-2)">time →</text><text x="12" y="62" text-anchor="middle" transform="rotate(-90 12 62)" style="font:10px var(--f-mono);fill:var(--ink-2)">progress →</text></svg><p class="note"><code>${nBez(N.ease)}</code>. A steep part of the curve is fast movement; a flat part is slow.</p>`;
    live('nwhy').textContent={linear:'Linear moves at one speed and stops dead. Fine for a progress bar or a colour change, wrong for objects.','ease-in':'Ease in starts slowly and is fastest at the end. Use it for things leaving the screen.','ease-out':'Ease out starts at full speed and settles. It feels responsive, so it is the default for things entering and for feedback.','ease-in-out':'Ease in and out is slow at both ends. Use it for something moving between two places on screen.',emph:'Emphasised gets going quickly and takes a long time to settle. Material uses curves like this for larger, more expressive moves; the exact values here are from memory.'}[N.ease];
    live('nrace').querySelectorAll('[data-r]').forEach(r=>r.style.fontWeight=r.dataset.r===N.ease?700:400)};
  const spring=()=>{const s=springSim(),W=300,pts=s.pts.filter((p,i)=>i%3===0).map((p,i,a)=>`${(10+i/(a.length-1)*(W-20)).toFixed(1)},${(110-p*62.5).toFixed(1)}`).join(' ');
    live('nplot').innerHTML=`<svg viewBox="0 0 ${W} 122" width="100%" role="img" aria-label="Spring displacement over time" style="display:block;margin-top:10px"><line x1="10" y1="47.5" x2="${W-10}" y2="47.5" style="stroke:var(--measure);stroke-dasharray:4 3"/><line x1="10" y1="110" x2="${W-10}" y2="110" style="stroke:var(--line)"/><polyline points="${pts}" style="fill:none;stroke:var(--accent);stroke-width:2"/><text x="${W-10}" y="121" text-anchor="end" style="font:10px var(--f-mono);fill:var(--ink-2)">${s.T.toFixed(2)} s</text><text x="10" y="121" style="font:10px var(--f-mono);fill:var(--ink-2)">0</text></svg>`;
    const z=s.zeta;live('nsp').innerHTML=[['Damping ratio',z.toFixed(2)+' · '+(z<.95?'under-damped: it bounces':z<=1.05?'critically damped: fastest settle with no overshoot':'over-damped: no bounce, feels heavy')],['Overshoot',Math.max(0,(s.peak-1)*100).toFixed(0)+'%'],['Settles in about',s.T.toFixed(2)+' s'],['SwiftUI response',s.resp.toFixed(2)+' s']].map(r=>`<tr><td style="color:var(--ink-2)">${r[0]}</td><td>${r[1]}</td></tr>`).join('');return s};
  const fire=()=>{const s=springSim(),box=live('nbox'),dist=box.parentElement.clientWidth-66,t0=performance.now();N.run=t0;
    const step=now=>{if(N.run!==t0||!document.body.contains(box))return;const i=Math.min(s.pts.length-1,Math.floor((now-t0)/1000*240));box.style.transform=`translateX(${(s.pts[i]*dist).toFixed(1)}px)`;if(i<s.pts.length-1)requestAnimationFrame(step);else box.style.transform=`translateX(${dist}px)`};
    box.style.transform='translateX(0)';requestAnimationFrame(step)};
  const addBtn=(anim)=>{const el=live('mi-add'),q=N.qty>0,w=q?112:76;const old=el.firstElementChild?el.firstElementChild.offsetWidth:w;
    el.innerHTML=`<div style="display:flex;align-items:center;justify-content:center;gap:14px;height:40px;width:${w}px;border-radius:10px;background:#17703D;color:#fff;font-weight:700;overflow:hidden;white-space:nowrap">${q?`<span>−</span><span>${N.qty}</span><span>+</span>`:'Add'}</div>`;
    if(anim&&old!==w){const d=el.firstElementChild;N.reduce?d.animate([{opacity:.3},{opacity:1}],{duration:120}):d.animate([{width:old+'px'},{width:w+'px'}],{duration:260,easing:'cubic-bezier(.3,1.35,.5,1)'})}};
  const load=()=>{const sp=live('mi-spin'),sk=live('mi-skel'),box='border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:8px;height:74px;display:flex;flex-direction:column;gap:6px;font-size:11px',bar=w=>`<i style="display:block;height:9px;border-radius:5px;background:var(--line);width:${w}%"></i>`,done=`<b>Fresh offers</b><span>20% off fruit</span><span>Free delivery</span>`;N.load=(N.load||0)+1;const id=N.load;
    sp.innerHTML=`<div style="${box};align-items:center;justify-content:center">${N.reduce?'Loading…':'<i id="mi-ring" style="width:20px;height:20px;border-radius:50%;border:2.5px solid var(--accent);border-right-color:transparent;display:block"></i>'}</div>`;
    sk.innerHTML=`<div style="${box}" id="mi-bars">${bar(70)+bar(90)+bar(80)}</div>`;
    if(!N.reduce){live('mi-ring').animate([{transform:'rotate(0)'},{transform:'rotate(360deg)'}],{duration:700,iterations:Infinity});live('mi-bars').animate([{opacity:1},{opacity:.45},{opacity:1}],{duration:1000,iterations:Infinity})}
    setTimeout(()=>{if(N.load!==id||!document.body.contains(sp))return;sp.innerHTML=`<div style="${box}">${done}</div>`;sk.innerHTML=`<div style="${box}">${done}</div>`},1200)};
  const upd=k=>{if(k==='ease'||k==='dur'){curve()}if(k==='k'||k==='c'){spring()}live('ncode').innerHTML=code(motionCode())};
  live('nrace').innerHTML=Object.entries(NE).map(([k,v])=>`<div data-r="${k}" style="display:grid;grid-template-columns:118px minmax(0,1fr);gap:8px;align-items:center;font-size:13px"><span>${v[0]}</span><div style="position:relative;height:22px;border-radius:11px;background:var(--surface-2);border:1px solid var(--line)"><i data-dot="${k}" style="position:absolute;left:1px;top:1px;width:18px;height:18px;border-radius:50%;background:var(--accent);display:block"></i></div></div>`).join('');
  bind(N,upd,e=>{const id=e.target.id;
    if(id==='nplay'){main.querySelectorAll('[data-dot]').forEach(d=>{const dist=d.parentElement.clientWidth-22;d.animate([{transform:'translateX(0)'},{transform:`translateX(${dist}px)`}],{duration:N.dur,easing:nBez(d.dataset.dot),fill:'forwards'})});return}
    if(e.target.closest('#nstage')){fire();return}
    if(id==='mi-press'){e.target.animate(N.reduce?[{opacity:1},{opacity:.65},{opacity:1}]:[{transform:'scale(1)'},{transform:'scale(.94)'},{transform:'scale(1)'}],{duration:150,easing:'ease-out'});return}

    if(id==='mi-load'){load();return}
    if(id==='mi-toast'){const t=live('mi-t');N.reduce?t.animate([{opacity:0},{opacity:1,offset:.1},{opacity:1,offset:.9},{opacity:0}],{duration:2000}):t.animate([{opacity:0,transform:'translateY(130%)'},{opacity:1,transform:'translateY(0)',offset:.13,easing:'ease-in'},{opacity:1,transform:'translateY(0)',offset:.9,easing:'ease-in'},{opacity:0,transform:'translateY(130%)'}],{duration:2000,easing:'ease-out'})}});
  curve();spring();addBtn(false);load();live('ncode').innerHTML=code(motionCode());
};

function ecomCode(){if(E.tab==='swiftui')return `// One type for everything a screen can show
enum ScreenState<Content> {
    case loading
    case content(Content)
    case empty(title: String, action: String)
    case error(message: String)
}

struct BasketScreen: View {
    @State private var model = BasketModel()
    var body: some View {
        switch model.state {
        case .loading:                  BasketSkeleton()
        case .content(let basket):      BasketList(basket: basket)
        case .empty(let title, let a):  EmptyStateView(title: title, actionTitle: a) { model.startShopping() }
        case .error(let message):       ErrorStateView(message: message) { Task { await model.reload() } }
        }
    }
}`;
  if(E.tab==='compose')return `// One type for everything a screen can show
sealed interface ScreenState<out T> {
    data object Loading : ScreenState<Nothing>
    data class Content<T>(val data: T) : ScreenState<T>
    data class Empty(val title: String, val action: String) : ScreenState<Nothing>
    data class Error(val message: String) : ScreenState<Nothing>
}

@Composable
fun BasketScreen(viewModel: BasketViewModel) {
    val state by viewModel.state.collectAsStateWithLifecycle()
    when (val s = state) {
        ScreenState.Loading    -> BasketSkeleton()
        is ScreenState.Content -> BasketList(s.data)
        is ScreenState.Empty   -> EmptyState(s.title, s.action, onAction = viewModel::startShopping)
        is ScreenState.Error   -> ErrorState(s.message, onRetry = viewModel::reload)
    }
}`;
  return `// One type for everything a screen can show (Dart 3 sealed classes)
sealed class ScreenState<T> { const ScreenState(); }
class Loading<T> extends ScreenState<T> { const Loading(); }
class Content<T> extends ScreenState<T> { const Content(this.data); final T data; }
class Empty<T> extends ScreenState<T> { const Empty(this.title, this.action); final String title, action; }
class Failure<T> extends ScreenState<T> { const Failure(this.message); final String message; }

Widget build(BuildContext context) {
  return switch (state) {
    Loading()                       => const BasketSkeleton(),
    Content(:final data)            => BasketList(basket: data),
    Empty(:final title, :final action) => EmptyState(title: title, action: action, onAction: onStartShopping),
    Failure(:final message)         => ErrorState(message: message, onRetry: onReload),
  };
}`}

  <p class="note">These are original teaching layouts built from common grocery and shopping patterns. They are not the designs of BigBasket or any other company.</p>
  <section class="panel"><h2>The journey</h2><div id="eflow"></div>
   <div class="row">${seg(E,'scr',EK.map(k=>[k,ES[k].t]))}</div></section>

  <section class="cols">
   <div class="panel"><h2>Patterns that repeat across screens</h2>${list(['<b>The basket is always one tap away:</b> a tab, a sticky bar or both.','<b>Add becomes a stepper in place</b> on every card, row and detail screen, and they all stay in sync.','<b>Price is always shown the same way:</b> selling price first and bold, MRP struck through, discount in text.','<b>The primary action sits at the bottom</b> and says what it does, with the amount where money is involved.','<b>The delivery promise travels with the user:</b> Home, product, basket and checkout all restate when it arrives.','<b>Trust rises toward payment:</b> fewer distractions, clearer totals, no surprises added at the last step.'])}</div>
   <div class="panel"><h2>User goal versus business goal</h2>${list(['They usually agree: a fast reorder is good for both.','Where they pull apart, the design shows it: a sponsored product above the best match, an upsell between basket and checkout, a pre-ticked add-on.','A good screen serves the business goal without making the user’s goal slower. A banner below the Buy again rail does; one above the search bar does not.','As the engineer, you often see the conflict first, in a ticket. Naming it is part of the job.'])}</div>
   <div class="panel"><h2>Common mistakes</h2>${list(['Designing only the content state, then inventing the other three in code.','An empty state that is a dead end, with no action.','A full-screen error for a failure that affects one section.','Different price formats on listing and product screens.','A payment failure that does not say whether money was taken.','Totals that change between basket and payment without explanation.'])}</div>
   <div class="panel"><h2>Exercise</h2><p>Pick one of the eleven screens in an app you work on. Fill in the same sheet this lesson uses: user goal, business goal, the first four things in the hierarchy, and what loading, empty and error look like. Where your app has no answer for a state, check what the code does today. That is the current design, whether anyone chose it or not.</p></div></section>
  ${quiz('ecom',[{q:'The basket is empty. What should the empty state contain?',o:['Just the text “Empty”','A short message and an action that gets the user shopping again','A full-screen advertisement'],a:1,why:'An empty state is a moment to guide. Without an action it is a dead end.'},{q:'One recommendations rail on Home fails to load. What is the right response?',o:['A full-screen error with Retry','Hide or inline-retry that rail and show the rest of Home','Keep a spinner there forever'],a:1,why:'Failures should be as small as their cause. The rest of the screen still works.'},{q:'A payment fails. What must the message say first?',o:['An error code','Whether money was taken, then what to do next','“Something went wrong”'],a:1,why:'The user’s first fear is being charged. Answer that, then offer retry or another method.'}])}
  <section class="panel"><h2>Interview questions</h2>${qa([['Walk me through designing a product listing screen.','Start from the goal (compare and add several), set the hierarchy (title and filters, cards with price and Add, a persistent basket bar), define card content and the four states, then responsiveness, accessibility labels, pagination and out-of-stock handling.'],['How do you keep quantity in sync across listing, product and basket?','One basket source of truth that every surface observes, optimistic updates with rollback, and a single stepper component so behaviour is identical everywhere.'],['Where do upsells belong in a checkout flow?','Before the commitment point, in the basket, clearly optional and never pre-selected. After the user taps Checkout the job is to finish, so nothing new should compete with it.']])}</section>
  ${doneBtn('ecom')}</div>`;

     <div><span class="eyebrow">Information hierarchy</span><ol style="margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:3px">${s.hier.map(h=>'<li>'+h+'</li>').join('')}</ol></div>
