  <section class="panel"><h2>A style is mostly four token groups</h2><p>This is the useful way for an engineer to see a style. If shape, depth, colour and type are tokens, most of a restyle is a new set of values, and the components stay as they are.</p><div class="tablewrap"><table><thead><tr><th>Style</th><th>Shape</th><th>Depth</th><th>Colour</th><th>Type</th></tr></thead><tbody>${SY.map((s,i)=>`<tr><td><b>${i+1}. ${s.n}</b></td>${s.tok.map(t=>'<td>'+t+'</td>').join('')}</tr>`).join('')}</tbody></table></div></section>
  <section class="cols">
   <div class="panel"><h2>How they relate</h2>${list(['<b>Skeuomorphism → Flat → Material</b> is the main historical line: imitate real objects, strip everything away, then add back just enough depth to show hierarchy.','<b>Glassmorphism → Liquid Glass:</b> the frosted-panel trend, then Apple’s system-level version, which adds refraction and motion and is drawn by the OS.','<b>Neumorphism and Claymorphism</b> are soft-3D reactions to flat design.','<b>Brutalism → Neo-Brutalism</b>: the raw original, then a friendlier, colourful version.','<b>Minimalism and Maximalism</b> are attitudes more than styles; either can be combined with the others.','<b>Y2K, Retro and Cyberpunk</b> are themes that borrow an era or a fiction.','<b>Bento and Editorial</b> are layout-led: they are about arrangement more than surface.'])}</div>
   <div class="panel"><h2>Choosing one</h2>${list(['Start from the product and the user, not from what is trending.','Daily-use tools need calm: flat, material or minimal. Loud styles suit short visits.','Check the style against contrast and target-size rules before falling for it.','Ask what it costs to build and theme on every platform you ship.','Most real apps are flat or Material at the core, with one borrowed idea, such as a glass overlay or a bento home screen.'])}</div>
   <div class="panel"><h2>On each platform</h2>${list(['<b>iOS</b> has its own house style, with translucent materials built in. Glass-like surfaces are native there; Material is not.','<b>Android</b> ships Material 3. Styles that need blur or double shadows cost extra.','<b>Flutter</b> draws everything itself, so any style is possible, and all the accessibility work is yours.','Whatever the style, keep platform behaviour: back, sheets, text scaling, focus.'])}</div>
   <div class="panel"><h2>Common mistakes</h2>${list(['Picking a style from a showcase shot that never had real content in it.','Mixing three styles on one screen.','Applying a trend to the whole app instead of one surface.','Forgetting dark mode: several of these styles have no obvious dark version.','Treating Material as a look. It is a system with rules for behaviour.'])}</div>
   <div class="panel"><h2>Exercise</h2><p>Open five apps on your phone and name the style of each using this list, then name the one borrowed idea each uses. For your own app, write its four token groups in one line each. Then pick a style from this page that would suit one campaign screen, and list which tokens would change and which components would not.</p></div></section>
  ${quiz('styles',[{q:'A card is the same colour as its background and is defined only by a light shadow on one side and a dark one on the other. Which style?',o:['Glassmorphism','Neumorphism','Flat Design'],a:1,why:'Paired light and dark shadows on a single-colour surface are the mark of neumorphism, and the cause of its contrast problem.'},{q:'Thick black outlines, bright flat colours and a solid shadow with no blur. Which style?',o:['Neo-Brutalism','Skeuomorphism','Claymorphism'],a:0,why:'Neo-brutalism keeps brutalism’s bluntness but adds colour, outlines and a hard offset shadow.'},{q:'Which style is hardest to guarantee text contrast for, and why?',o:['Flat Design, because it has no shadows','Glassmorphism, because the panel’s effective colour depends on what is behind it','Editorial, because it uses serif type'],a:1,why:'A translucent surface changes with its background, so contrast cannot be checked once and trusted everywhere.'}])}
  <section class="panel"><h2>Interview questions</h2>${qa([['What is the difference between a design style and a design system?','A style is a visual language: how surfaces, depth, colour and type look. A system is the full set of tokens, components, patterns and rules. A system can be re-skinned in a different style; a style on its own tells you nothing about behaviour.'],['Why did interfaces move from skeuomorphism to flat design?','Users no longer needed real-world metaphors to understand touch screens, textures did not scale across many screen sizes and densities, and flat assets were lighter and easier to theme. Flat then lost some clarity about what is tappable, which is why subtle depth came back.'],['A designer proposes neumorphism for a banking app. What do you raise?','Control boundaries have very low contrast, so tappable elements and states are hard to see; it needs two shadows per element on every platform; dark mode and high-contrast modes are difficult. Suggest keeping it to one decorative surface.']])}</section>

V.swiftui=()=>{
  main.innerHTML=`<div class="wrap">${head('Module 28','SwiftUI layout, the whole toolbox','Every layout container SwiftUI gives you, each with a picture, the code, the Figma idea it corresponds to and when to choose it. Start with the three-step rule, play with a stack, then use the catalogue as a reference.')}
  <section class="panel"><h2>How SwiftUI lays anything out</h2>${fc(700,90,[{id:'a',x:110,y:45,t:'1 · Parent proposes|a size to the child',w:170,s:'p'},{id:'b',x:350,y:45,t:'2 · Child chooses|its own size',w:170},{id:'c',x:590,y:45,t:'3 · Parent places|the child',w:170,s:'p'}],[{a:'a',b:'b'},{a:'b',b:'c'}])}
  ${list(['The parent cannot force a size. <code>.frame(width: 100)</code> is a new parent that proposes 100; a child such as an Image without <code>.resizable()</code> may ignore it.','Views fall into three habits: <b>hug</b> their content (Text, Button), <b>expand</b> to fill what is offered (Color, Spacer, GeometryReader, shapes), or follow their children (stacks).','Each modifier wraps the view in a new one, which is why order changes the result.','Figma’s Hug, Fill and Fixed are these same three habits, chosen by hand.'])}</section>
  <section class="panel"><h2>Stack playground</h2><div class="split"><div class="plain"><div class="ctlgrp"><b>Container</b>${seg(SLS,'ax',[['V','VStack'],['H','HStack'],['Z','ZStack']])}</div>${rng(SLS,'sp','Spacing',0,24,2)}<div class="ctlgrp"><b>Alignment</b>${seg(SLS,'al',[['leading','Leading / top'],['center','Center'],['trailing','Trailing / bottom']])}</div><div id="slpc"></div></div>
   <div class="plain"><div class="stage" style="padding:22px 10px"><div id="slpp"></div><small>Three children of different sizes</small></div>${simNote}</div></div></section>
  <section class="panel"><h2>The catalogue</h2><div id="slnav" class="plain"></div></section>
  <section class="panel" id="slbody"></section>
  <section class="panel"><h2>Which container?</h2><div class="tablewrap"><table><thead><tr><th>You need</th><th>Use</th><th>Not</th></tr></thead><tbody>
  ${[['A few views in a row or column','HStack / VStack','LazyHStack / LazyVStack (laziness has a cost for small content)'],['A long feed of custom cards','ScrollView + LazyVStack','VStack (builds everything up front)'],['Settings, orders, addresses','List','A hand-built list (you lose swipe, edit and accessibility)'],['A product grid','LazyVGrid with adaptive columns','Nested HStacks in a VStack'],['A small aligned table','Grid','LazyVGrid'],['A badge on a view','overlay','ZStack (changes the size)'],['A sticky bottom bar','safeAreaInset','ZStack plus manual padding'],['Row on wide, column on narrow','ViewThatFits or AnyLayout','GeometryReader with if/else'],['A fraction of the container','containerRelativeFrame','GeometryReader'],['Chips that wrap','A custom Layout','GeometryReader arithmetic']].map(r=>'<tr><td>'+r[0]+'</td><td><code>'+r[1]+'</code></td><td>'+r[2]+'</td></tr>').join('')}</tbody></table></div></section>
  <section class="cols"><div class="panel"><h2>State that drives layout</h2><div class="tablewrap"><table><tbody>${[['@State','A value this view owns: is the sheet open, the quantity in a stepper.'],['@Binding','A reference to state owned by a parent, so a child can change it.'],['@Observable class','A model shared by several views; views re-render when the properties they read change.'],['@Environment','Values handed down the tree: size class, colour scheme, Dynamic Type size, your theme.']].map(r=>`<tr><td><code>${r[0]}</code></td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div><p>Layout in SwiftUI is a function of state. Changing the state inside <code>withAnimation</code> animates the layout change.</p></div>
  <div class="panel"><h2>Common mistakes</h2>${list(['GeometryReader as the first tool. It fills all space and breaks hug sizing.','A VStack with hundreds of rows inside a ScrollView.','Fixed frames on text, which clip at large Dynamic Type sizes.','Spacing put on children with padding instead of on the stack.','Left and right in your head. SwiftUI says leading and trailing, and mirrors for right-to-left.','Nested scroll views in the same direction.'])}</div>
  <div class="panel"><h2>Exercise</h2><p>Take one screen from your app’s Figma file. Label every frame with the SwiftUI container from this catalogue you would use for it, and write the reason in three words. Then build only the containers with coloured rectangles as children, and check it at the largest text size and in landscape before adding any real content.</p></div></section>
  <p class="note">Code here is written to be idiomatic and has not been compiled. Minimum iOS versions are from memory; check them against Apple’s documentation before relying on one.</p>
  ${quiz('swiftui',[{q:'A product feed has thousands of custom cards. Which container?',o:['VStack in a ScrollView','LazyVStack in a ScrollView','Grid'],a:1,why:'LazyVStack creates rows only as they appear. VStack and Grid build everything at once.'},{q:'A cart badge must sit on the corner of an icon without changing the icon’s size. Which tool?',o:['ZStack','overlay(alignment:)','HStack with negative spacing'],a:1,why:'An overlay takes its size from the view it decorates, so the icon’s layout is unaffected.'},{q:'A price row should become a column when the text is too large to fit. What is the cleanest way?',o:['GeometryReader and compare widths','ViewThatFits with an HStack then a VStack','Reduce the font size'],a:1,why:'ViewThatFits picks the first arrangement that fits, with no measuring code.'}])}
  <section class="panel"><h2>Interview questions</h2>${qa([['Explain SwiftUI’s layout process.','The parent proposes a size, the child returns the size it wants, and the parent positions it. Modifiers are views too, so each one takes part in that negotiation, which is why modifier order matters.'],['VStack versus LazyVStack versus List?','VStack builds all children immediately and suits small content. LazyVStack builds on demand inside a ScrollView and suits long custom feeds. List adds row reuse, separators, swipe actions, sections and edit mode, and suits standard list screens.'],['Why avoid GeometryReader, and what replaces it?','It expands to fill offered space, which breaks content-sized layouts and behaves oddly in scroll views. containerRelativeFrame, ViewThatFits, AnyLayout with size classes, and the Layout protocol cover most cases more safely.']])}</section>
  ${doneBtn('swiftui')}</div>`;
  const live=id=>document.getElementById(id);
  const play=()=>{const A=SLS.ax,al=SLS.al,m={leading:'flex-start',center:'center',trailing:'flex-end'}[al],kids=[slB('A','width:70px;height:26px;padding:0;display:grid;place-items:center'),slB('B','width:110px;height:40px;padding:0;display:grid;place-items:center'),slB('C','width:44px;height:54px;padding:0;display:grid;place-items:center')];
    live('slpp').innerHTML=A==='Z'?slF(`<div style="display:grid;height:130px;place-items:${al==='leading'?'start':al==='trailing'?'end':'center'}">${[slB('C','grid-area:1/1;width:150px;height:110px;opacity:.5'),slB('B','grid-area:1/1;width:100px;height:70px;opacity:.75'),slB('A','grid-area:1/1;width:50px;height:30px;padding:0;display:grid;place-items:center')].join('')}</div>`):slF(`<div style="display:flex;flex-direction:${A==='V'?'column':'row'};gap:${SLS.sp}px;align-items:${m}">${kids.join('')}</div>`);
    const an=A==='V'?'.'+al:A==='H'?{leading:'.top',center:'.center',trailing:'.bottom'}[al]:{leading:'.topLeading',center:'.center',trailing:'.bottomTrailing'}[al];
    live('slpc').innerHTML=code(`${A}Stack(alignment: ${an}${A==='Z'?'':', spacing: '+SLS.sp}) {\n    A()\n    B()\n    C()\n}${A==='Z'?'\n// ZStack has no spacing: children share the same space.':''}`)};
  const cat=()=>{const s=SL.find(x=>x.k===SLS.k),i=SL.indexOf(s);
    live('slnav').innerHTML=SLG.map((g,gi)=>`<div class="row" style="gap:6px"><span class="eyebrow" style="min-width:150px">${g}</span>${SL.filter(x=>x.g===gi).map(x=>`<button type="button" class="btn" data-sl="${x.k}" aria-pressed="${x.k===s.k}" style="padding:4px 10px;font-size:13px;font-weight:500;${x.k===s.k?'background:var(--accent);color:var(--on-accent);border-color:var(--accent)':''}">${x.n}</button>`).join('')}</div>`).join('');
    live('slbody').innerHTML=`<div class="row" style="justify-content:space-between"><h2>${s.n}</h2><span class="chip">${SLG[s.g]} · ${i+1} of ${SL.length}</span></div><p class="lede">${s.what}</p><div class="split" style="grid-template-columns:minmax(0,280px) minmax(0,1fr)"><div class="stage" style="padding:18px 8px">${s.prev()}</div><div class="plain">${code(s.code)}<div class="tablewrap"><table><tbody><tr><td style="color:var(--ink-2);white-space:nowrap">In Figma</td><td>${s.fig}</td></tr><tr><td style="color:var(--ink-2);white-space:nowrap">Good to know</td><td>${s.tip}</td></tr></tbody></table></div></div></div><div class="row"><button type="button" class="btn" id="slprev">‹ Previous</button><button type="button" class="btn" id="slnext">Next ›</button></div>`};
  bind(SLS,play,e=>{const t=e.target.closest('[data-sl]'),i=SL.findIndex(x=>x.k===SLS.k);
    if(t){SLS.k=t.dataset.sl;cat();return}
    if(e.target.id==='slprev'){SLS.k=SL[(i+SL.length-1)%SL.length].k;cat()}if(e.target.id==='slnext'){SLS.k=SL[(i+1)%SL.length].k;cat()}});
  play();cat();
};

{k:'padbox',g:0,p:'padframe',n:'Padding, SizedBox and Container',what:'Padding adds space, SizedBox fixes a size, Container combines padding, size and decoration.',fig:'Padding on a frame; Fixed, Hug and Fill sizing.',code:`Padding(

{k:'slivers',g:1,p:'inset',n:'CustomScrollView and slivers',what:'One scroll view made of different scrolling pieces: an app bar, a grid, a list.',fig:'A screen where a header collapses and several sections scroll together.',code:`CustomScrollView(

{k:'gridview',g:2,p:'lazygrid',n:'GridView.builder',what:'A lazy scrolling grid.',fig:'Auto Layout with wrap, or a layout grid with N columns.',code:`GridView.builder(

{k:'lb',g:3,p:'fits',n:'LayoutBuilder',what:'Gives you the constraints from the parent so you can choose a layout.',fig:'Two variants of a component, wide and compact.',code:`LayoutBuilder(

{k:'bp',g:3,p:'sizeclass',n:'Breakpoints with MediaQuery',what:'Switch structure at chosen widths. Flutter has no built-in size classes.',fig:'Phone and tablet frames of the same screen.',code:`final width = MediaQuery.sizeOf(context).width;

function catView(c){const st=c.st,items=c.items;
  main.innerHTML=`<div class="wrap">${head(c.mod,c.title,c.lede)}
  <section class="panel"><h2>${c.ruleTitle}</h2>${fc(700,90,[{id:'a',x:110,y:45,t:c.steps[0],w:180,s:'p'},{id:'b',x:350,y:45,t:c.steps[1],w:180},{id:'c',x:590,y:45,t:c.steps[2],w:180,s:'p'}],[{a:'a',b:'b'},{a:'b',b:'c'}])}${list(c.rules)}</section>
  <section class="panel"><h2>Playground</h2><div class="split"><div class="plain"><div class="ctlgrp"><b>Container</b>${seg(st,'ax',c.axes)}</div>${rng(st,'sp','Spacing',0,24,2)}<div class="ctlgrp"><b>Alignment</b>${seg(st,'al',[['leading','Start / top'],['center','Center'],['trailing','End / bottom']])}</div><div id="ctpc"></div></div>
   <div class="plain"><div class="stage" style="padding:22px 10px"><div id="ctpp"></div><small>Three children of different sizes</small></div>${simNote}</div></div></section>
  <section class="panel"><h2>The catalogue</h2><div id="ctnav" class="plain"></div></section>
  <section class="panel" id="ctbody"></section>
  <section class="panel"><h2>Which one?</h2><div class="tablewrap"><table><thead><tr><th>You need</th><th>Use</th><th>Not</th></tr></thead><tbody>${c.pick.map(r=>'<tr><td>'+r[0]+'</td><td><code>'+r[1]+'</code></td><td>'+r[2]+'</td></tr>').join('')}</tbody></table></div></section>
  <section class="panel"><h2>The same idea on three platforms</h2><div class="tablewrap"><table><thead><tr><th>Idea</th><th>SwiftUI</th><th>Compose</th><th>Flutter</th></tr></thead><tbody>${[['Column','VStack','Column','Column'],['Row','HStack','Row','Row'],['Layers','ZStack','Box','Stack'],['Flexible gap','Spacer()','Spacer + weight','Spacer / Expanded'],['Lazy list','LazyVStack / List','LazyColumn','ListView.builder'],['Lazy grid','LazyVGrid','LazyVerticalGrid','GridView.builder'],['Wrapping row','custom Layout','FlowRow','Wrap'],['Read available space','GeometryReader','BoxWithConstraints','LayoutBuilder'],['Pick what fits','ViewThatFits','BoxWithConstraints + if','LayoutBuilder + if'],['Bars and insets','safeAreaInset','Scaffold + innerPadding','Scaffold + SafeArea'],['Bottom sheet','.sheet + detents','ModalBottomSheet','showModalBottomSheet'],['Navigation stack','NavigationStack','NavHost','Navigator / go_router']].map(r=>'<tr><td>'+r[0]+'</td>'+r.slice(1).map((x,i)=>`<td${i===c.col?' style="font-weight:600"':''}><code>${x}</code></td>`).join('')+'</tr>').join('')}</tbody></table></div></section>
  <section class="cols"><div class="panel"><h2>State that drives layout</h2><div class="tablewrap"><table><tbody>${c.state.map(r=>`<tr><td><code>${r[0]}</code></td><td>${r[1]}</td></tr>`).join('')}</tbody></table></div></div>
  <div class="panel"><h2>Common mistakes</h2>${list(c.mistakes)}</div>
  <div class="panel"><h2>Exercise</h2><p>${c.exercise}</p></div></section>
  <p class="note">${c.note}</p>
  ${quiz(c.id,c.quiz)}
  <section class="panel"><h2>Interview questions</h2>${qa(c.qa)}</section>
  ${doneBtn(c.id)}</div>`;
  const live=id=>document.getElementById(id);
  const play=()=>{const A=st.ax,al=st.al,m={leading:'flex-start',center:'center',trailing:'flex-end'}[al];
    live('ctpp').innerHTML=A==='Z'?slF(`<div style="display:grid;height:130px;place-items:${al==='leading'?'start':al==='trailing'?'end':'center'}">${slB('C','grid-area:1/1;width:150px;height:110px;opacity:.5')+slB('B','grid-area:1/1;width:100px;height:70px;opacity:.75')+slB('A','grid-area:1/1;width:50px;height:30px;padding:0;display:grid;place-items:center')}</div>`):slF(`<div style="display:flex;flex-direction:${A==='V'?'column':'row'};gap:${st.sp}px;align-items:${m}">${slB('A','width:70px;height:26px;padding:0;display:grid;place-items:center')+slB('B','width:110px;height:40px;padding:0;display:grid;place-items:center')+slB('C','width:44px;height:54px;padding:0;display:grid;place-items:center')}</div>`);
    live('ctpc').innerHTML=code(c.playCode(st))};
  const cat=()=>{const s=items.find(x=>x.k===st.k),i=items.indexOf(s);
    live('ctnav').innerHTML=SLG.map((g,gi)=>`<div class="row" style="gap:6px"><span class="eyebrow" style="min-width:150px">${g}</span>${items.filter(x=>x.g===gi).map(x=>`<button type="button" class="btn" data-ct="${x.k}" aria-pressed="${x.k===s.k}" style="padding:4px 10px;font-size:13px;font-weight:500;${x.k===s.k?'background:var(--accent);color:var(--on-accent);border-color:var(--accent)':''}">${x.n}</button>`).join('')}</div>`).join('');
    live('ctbody').innerHTML=`<div class="row" style="justify-content:space-between"><h2>${s.n}</h2><span class="chip">${SLG[s.g]} · ${i+1} of ${items.length}</span></div><p class="lede">${s.what}</p><div class="split" style="grid-template-columns:minmax(0,280px) minmax(0,1fr)"><div class="stage" style="padding:18px 8px">${SL.find(x=>x.k===s.p).prev()}</div><div class="plain">${code(s.code)}<div class="tablewrap"><table><tbody><tr><td style="color:var(--ink-2);white-space:nowrap">In Figma</td><td>${s.fig}</td></tr><tr><td style="color:var(--ink-2);white-space:nowrap">Good to know</td><td>${s.tip}</td></tr></tbody></table></div></div></div><div class="row"><button type="button" class="btn" id="ctprev">‹ Previous</button><button type="button" class="btn" id="ctnext">Next ›</button></div>`};
  bind(st,play,e=>{const t=e.target.closest('[data-ct]'),i=items.findIndex(x=>x.k===st.k);
    if(t){st.k=t.dataset.ct;cat();return}
    if(e.target.id==='ctprev'){st.k=items[(i+items.length-1)%items.length].k;cat()}if(e.target.id==='ctnext'){st.k=items[(i+1)%items.length].k;cat()}});
  play();cat()}
V.compose=()=>catView({id:'compose',st:CLS,items:CL,col:1,mod:'Module 30',title:'Jetpack Compose layout, the whole toolbox',lede:'Every layout composable you are likely to need, each with a picture, the code, the Figma idea it corresponds to and when to choose it.',
  ruleTitle:'How Compose lays anything out',steps:['1 · Parent passes|constraints (min and max)','2 · Child measures itself,|exactly once','3 · Parent places|the child'],
  rules:['Constraints are a minimum and maximum width and height. A child must pick a size inside them.','Each child is measured once per pass. That single pass is why deep Compose trees stay fast, and why you cannot measure, look, and measure again without special tools.','Modifiers are applied in order and each one wraps what follows, so <code>padding</code> before <code>background</code> differs from the reverse.','Default is wrap content (Hug). <code>fillMaxWidth</code> is Fill; <code>size</code> and <code>height</code> are Fixed.'],
  axes:[['V','Column'],['H','Row'],['Z','Box']],
  playCode:s=>s.ax==='V'?`Column(\n    verticalArrangement = Arrangement.spacedBy(${s.sp}.dp),\n    horizontalAlignment = Alignment.${({leading:'Start',center:'CenterHorizontally',trailing:'End'})[s.al]}\n) {\n    A()\n    B()\n    C()\n}`:s.ax==='H'?`Row(\n    horizontalArrangement = Arrangement.spacedBy(${s.sp}.dp),\n    verticalAlignment = Alignment.${({leading:'Top',center:'CenterVertically',trailing:'Bottom'})[s.al]}\n) {\n    A()\n    B()\n    C()\n}`:`Box(contentAlignment = Alignment.${({leading:'TopStart',center:'Center',trailing:'BottomEnd'})[s.al]}) {\n    C()\n    B()\n    A()\n}\n// Box has no spacing: children share the same space.`,
  pick:[['A few items in a line','Column / Row','LazyColumn / LazyRow'],['A long feed','LazyColumn with keys','Column + verticalScroll'],['A product grid','LazyVerticalGrid','Rows inside a LazyColumn'],['A badge on an icon','BadgedBox, or Box + align','Offsets by hand'],['A sticky bottom bar','Scaffold bottomBar','A Box with manual padding'],['Chips that wrap','FlowRow','A custom Layout'],['Phone versus tablet structure','Window size classes','Checking the device type'],['A component that adapts to its own width','BoxWithConstraints','Reading the screen size'],['Truncate one text, keep another','weight(1f) on the one that gives way','Fixed widths']],
  state:[['remember { mutableStateOf() }','State owned by this composable.'],['State hoisting','Pass the value down and an event up; the composable becomes stateless and reusable.'],['ViewModel + StateFlow','Screen state that survives configuration changes, collected with collectAsStateWithLifecycle.'],['CompositionLocal','Values handed down the tree: theme, density, layout direction, your spacing tokens.']],
  mistakes:['A LazyColumn inside a vertically scrolling Column: it crashes with infinite height constraints.','No keys on lazy items, so state and animations jump between rows.','Ignoring Scaffold’s innerPadding.','Hardcoded dp for text sizes instead of sp.','Padding on the list instead of contentPadding, which clips content at the edges.','BoxWithConstraints in every list row.'],
  exercise:'Take one screen from your Figma file and label each frame with the composable from this catalogue you would use. Build only the containers with coloured boxes as children. Check it at the largest font scale, in landscape and in split-screen before adding real content.',
  note:'Code is written to be idiomatic and has not been compiled. Compose and Material 3 APIs change between releases; the adaptive-layout and window-size-class signatures in particular are from memory.',
  quiz:[{q:'A screen shows a header, then a list of 500 orders, all scrolling together. What is the right structure?',o:['Column with verticalScroll containing a LazyColumn','One LazyColumn with the header as its first item','A Column of 500 rows'],a:1,why:'One lazy list with the header as an item stays lazy and avoids nesting scrollables in the same direction.'},{q:'In a Row, the title must ellipsize and the price must always show in full. How?',o:['Give the price weight(1f)','Give the title weight(1f) and leave the price unweighted','Fixed widths on both'],a:1,why:'Unweighted children are measured first and keep their size; the weighted one takes the remainder and ellipsizes.'},{q:'Why does a lazy list need a key for each item?',o:['To make it scroll faster on first load','So Compose can keep item state and animate moves when the data changes','Keys are required by Kotlin'],a:1,why:'Without keys, state is tied to position, so it jumps to the wrong row when items are inserted or reordered.'}],
  qa:[['How does Compose measure and place children?','A parent passes constraints down, each child measures itself once and returns a size, and the parent places it. The single-pass rule keeps layout cost linear in tree depth.'],['When would you write a custom Layout composable?','When the built-in containers cannot express the arrangement, for example a radial layout or a special wrap rule. You provide a measure policy that measures children and places them.'],['How do you adapt a Compose screen to tablets and foldables?','Use window size classes to change structure, the adaptive scaffolds for navigation and list-detail, and keep components themselves width-driven so they work in any pane.']]});
V.flutterlayout=()=>catView({id:'flutterlayout',st:FLS,items:FL2,col:2,mod:'Module 32',title:'Flutter layout, the whole toolbox',lede:'Every layout widget you are likely to need, each with a picture, the code, the Figma idea it corresponds to and when to choose it.',
  ruleTitle:'How Flutter lays anything out',steps:['1 · Constraints|go down','2 · Sizes|go up','3 · Parent sets|the position'],
  rules:['A widget receives constraints (minimum and maximum width and height) from its parent and must choose a size within them.','A widget does not know or decide its own position; the parent does.','<b>Tight</b> constraints give one allowed size; <b>loose</b> ones give a maximum; <b>unbounded</b> ones, in a scroll direction, give infinity.','Most layout errors come from unbounded constraints: a ListView in a Column, or Expanded inside a scroll view. The fix is to bound the size, not to guess a number.'],

V.platforms=()=>{
  main.innerHTML=`<div class="wrap">${head('Modules 18, 19, 20 · partial','One pattern, three platforms','Pick a pattern. Each column shows what the platform expects and the smallest code that produces it. The label under the title says whether a difference is a platform convention or a choice your product gets to make.')}
  <div class="row">${seg(PL,'topic',Object.entries(PTOP).map(([k,v])=>[k,v.t]))}</div><div id="pl" class="plain"></div>
  <section class="cols"><div class="panel"><h2>Why native controls are worth it on iOS</h2>${list(['They pick up Dynamic Type, VoiceOver labels, dark mode and RTL without extra work.','They update when the system’s look changes, as it did with the 2025 redesign, without a rebuild of your own components.','Users already know how they behave, including long-press and keyboard shortcuts.'])}</div><div class="panel"><h2>Material, Cupertino or your own in Flutter</h2>${list(['<b>Material everywhere:</b> least work, one look. Fine for many products, but dialogs, switches and back navigation should still feel right on iOS.','<b>Adaptive:</b> <code>.adaptive</code> constructors (Switch, Slider, AlertDialog, CircularProgressIndicator) for the controls users notice most.','<b>Custom design system:</b> your own components on top of Flutter’s primitives. Most brand-heavy apps do this; you then own accessibility and platform behaviour yourself.'])}</div></section>
  <p class="note">Eight patterns are covered. Still to add from the brief: toolbars, menus, lists, forms, haptics, SF Symbols, snackbars, navigation drawers, elevation, motion, and UIKit and Android XML versions of each. Guideline details were written from memory and should be checked against the current HIG, Material and Flutter docs before you rely on them.</p>
  ${quiz('platforms',[{q:'Your designer puts the confirming dialog button on the left on both platforms. What do you raise?',o:['Nothing, consistency across platforms matters most','That Android places the confirming action last at the end, and iOS has its own order, so users of each expect different positions','That dialogs are not allowed on Android'],a:1,why:'Button order in system-style dialogs is a platform convention users rely on.'},{q:'In Flutter, what does AlertDialog.adaptive do?',o:['Resizes for tablets','Shows a Cupertino-style dialog on iOS and macOS and a Material one elsewhere','Adds dark mode'],a:1,why:'Adaptive constructors choose the platform look at runtime.'},{q:'Minimum touch target sizes are…',o:['44 pt on iOS, 48 dp on Android','48 pt on iOS, 44 dp on Android','40 on both'],a:0,why:'Apple recommends 44 by 44 pt; Material recommends 48 by 48 dp.'}])}
  ${doneBtn('platforms')}</div>`;
  const draw=()=>{const t=PTOP[PL.topic],col=(n,o)=>`<div class="panel"><h3>${n}</h3>${o.m?`<div class="device" style="padding:10px;border-radius:14px">${o.m}</div>`:''}${list(o.f)}${code(o.c)}</div>`;

const FL={contrast:['Low contrast','The delivery line is pale grey on white, around 2:1. Use the secondary text colour that passes 4.5:1.'],target:['Tiny touch target','The close control is about 16 px. Keep the glyph small if you like, but give it a 44 pt / 48 dp hit area.'],spacing:['Inconsistent spacing','Gaps between the rows are 6, 14 and 9. Pick one value from the scale.'],align:['Misalignment','The second price is indented and breaks the right edge the others form.'],primary:['Two primary actions','“Checkout” and “Share basket” are both filled and the same weight. One action leads; the other becomes outlined or text.'],label:['Icon with no label','The heart has no text and, in code, would have no accessibility label. A screen reader says “button”.'],error:['Unhelpful error','“Error 422” says nothing about what went wrong or what to do. Say what happened and offer the fix.']};
const RV={found:{},fixed:false};
V.review=()=>{
  main.innerHTML=`<div class="wrap">${head('Module 38','Design review simulator','This basket screen has seven planted problems. Tap anything that looks wrong. This is the skill that moves you from implementing a design to reviewing one.')}
  <section class="split"><div class="panel"><p id="rvc"></p><div id="rvl" class="plain"></div><div class="row"><button type="button" class="btn" id="rvfix">Show the corrected screen</button><button type="button" class="btn" id="rvreset">Start again</button></div></div>
  <div class="stage"><div class="device" style="width:auto"><div class="rv" id="rv"></div></div><small>Original teaching example. Tap on the screen to flag an issue.</small></div></section>
  <section class="panel"><h2>How to run a real review</h2>${list(['Start with the task: what is the user here to do, and is the path to it obvious?','Then structure: hierarchy, grouping, one primary action.','Then detail: spacing on the scale, alignment, type styles from the system.','Then states: loading, empty, error, disabled, long text, large text, dark, RTL.','Then accessibility: contrast, targets, labels, focus order.','Phrase findings as a problem and its effect on the user. Offer a fix, do not demand one.'])}</section>
  ${doneBtn('review')}</div>`;
  const draw=()=>{const f=RV.fixed,fd=k=>RV.found[k]?' found':'';
    document.getElementById('rv').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b style="font:700 18px var(--f-display)">Basket</b><span data-flaw="target" class="${fd('target').trim()}" style="${f?'width:44px;height:44px;display:grid;place-items:center':'font-size:10px;padding:1px 3px'}" role="button" aria-label="Close">✕</span></div>
    <div data-flaw="contrast" class="${fd('contrast').trim()}" style="color:${f?'var(--m-mute)':'#C4C8D0'};margin-bottom:10px">Delivery today, 6 to 8 pm</div>
    <div data-flaw="spacing" class="${fd('spacing').trim()}" style="display:flex;flex-direction:column">
      <div class="it" style="margin-bottom:${f?8:6}px"><span style="flex:1">Alphonso Mango · 1 kg</span><b>₹249</b></div>
      <div class="it" style="margin-bottom:${f?8:14}px"><span style="flex:1">Robusta Banana · 6 pcs</span><b data-flaw="align" class="${fd('align').trim()}" style="${f?'':'margin-inline-end:18px'}">₹42</b></div>
      <div class="it" style="margin-bottom:${f?8:9}px"><span style="flex:1">Toned Milk · 500 ml</span><span data-flaw="label" class="${fd('label').trim()}" role="button" style="padding:0 6px">${f?'♡ Save':'♡'}</span><b>₹29</b></div></div>
    <div data-flaw="error" class="${fd('error').trim()}" style="color:#B3261E;margin:6px 0 12px">${f?'Toned Milk is out of stock for this slot. Remove it or pick a later slot.':'Error 422'}</div>
    <div data-flaw="primary" class="${fd('primary').trim()}" style="display:flex;gap:8px"><span style="flex:1;background:#17703D;color:#fff;border-radius:8px;padding:11px;text-align:center;font-weight:700">Checkout · ₹320</span><span style="flex:1;border-radius:8px;padding:11px;text-align:center;font-weight:700;${f?'border:1px solid #17703D;color:#17703D':'background:#17703D;color:#fff'}">Share basket</span></div>`;
    const n=Object.keys(RV.found).length;document.getElementById('rvc').innerHTML=`<b style="font:700 26px var(--f-display)">${n} / 7</b> found${f?' · showing the corrected screen':''}`;
    document.getElementById('rvl').innerHTML=Object.keys(FL).map(k=>RV.found[k]||f?`<p><b>${FL[k][0]}.</b> ${FL[k][1]}</p>`:'').join('')||'<p style="color:var(--ink-2)">Nothing flagged yet.</p>'};
  main.oninput=null;main.onclick=e=>{const x=e.target.closest('[data-flaw]');if(x){RV.found[x.dataset.flaw]=true;draw();return}
    if(e.target.id==='rvfix'){RV.fixed=!RV.fixed;e.target.textContent=RV.fixed?'Show the flawed screen':'Show the corrected screen';draw()}
    if(e.target.id==='rvreset'){RV.found={};RV.fixed=false;document.getElementById('rvfix').textContent='Show the corrected screen';draw()}};
  draw();
};

const IQ=[
['UI fundamentals','What is visual hierarchy and how do you create it?','The order in which the eye reads a screen. You create it with size, weight, colour, position and spacing, using as few of them as possible per step.','Point at a screen and say what is read first, second and third. Is that the intended order?'],
['UI fundamentals','What is the difference between an affordance and a signifier?','An affordance is what an object lets you do; a signifier is the cue that tells you. A flat text label can be tappable (affordance) and give no hint of it (missing signifier).','How do you signal tappability without a button shape?'],
['UX fundamentals','How would you find out why users abandon checkout?','Look at funnel analytics for the step with the drop, watch session recordings or run five usability sessions on that step, form a hypothesis, then test a change with an A/B test.','What would you measure besides conversion?'],
['UX fundamentals','What is progressive disclosure?','Showing only what is needed now and revealing the rest on demand. A delivery instructions field hidden behind “Add a note” is an example.','When does hiding options hurt?'],
['Color theory','Why should colour not be the only way to convey state?','Colour vision differences, bright sunlight and greyscale modes all remove it. Pair colour with text, an icon or a shape.','Give an example from an order-tracking screen.'],
['Color theory','How does a dark theme differ from an inverted light theme?','Dark surfaces use steps of dark grey for elevation, accents get lighter and less saturated, and pure white text is softened. Inversion gets contrast and depth wrong.','How does Material express elevation in dark theme?'],
['Typography','Line height versus leading versus paragraph spacing?','Line height is baseline to baseline. Leading is the extra space added to the font’s natural line. Paragraph spacing is the gap between paragraphs. Figma exposes line height and paragraph spacing.','Why might the same line height look different on iOS and Android?'],
['Typography','How do you support Dynamic Type with a custom font?','Scale the custom size with the system curve: UIFontMetrics in UIKit, a relativeTo text style or ScaledMetric in SwiftUI. Then test at the largest accessibility size.','What do you do when the layout breaks at that size?'],
['Layout','Why an 8 point grid?','It gives a small set of spacing values that scale to whole pixels at 1x, 2x and 3x and produces visible rhythm. A 4 point half-step covers tight cases such as icon padding.','When would you break the grid?'],
['Layout','What is the difference between responsive and adaptive?','Responsive: one layout that stretches and reflows with width. Adaptive: different layouts or components chosen at breakpoints, such as a navigation bar on phones and a rail on tablets.','How do Compose window size classes fit in?'],
['Figma','Frame versus group?','A frame has its own size, constraints, layout grid, Auto Layout and clipping. A group is only a selection wrapper sized by its children. Use frames for anything that maps to a view.','What goes wrong at handoff when a design is all groups?'],
['Figma','What do constraints do?','They decide how a layer moves or stretches when its parent frame resizes: pin left, right, both, centre or scale. Inside Auto Layout, sizing modes replace them, except for absolutely positioned children.','How do constraints map to iOS Auto Layout constraints?'],
['Auto Layout','Hug, fill and fixed?','Hug sizes a frame to its children. Fill makes a child take the remaining space in its parent. Fixed is an explicit number. A parent cannot hug on an axis where a child is filling.','Why can a parent not hug while a child fills?'],
['Auto Layout','When do you use absolute position inside Auto Layout?','For a child that should not take part in the flow, such as a badge on a corner or a close button over an image.','What is the code equivalent on each platform?'],
['Components','Variant versus component property?','Variants are separate designs grouped as one component set and chosen by property values. Boolean, text and instance-swap properties change one component without multiplying variants.','How many variants does a button with 3 sizes, 4 styles and 5 states need, and how do properties reduce that?'],
['Components','How should a Figma component map to code?','One component set to one code component; variant properties to enum parameters; boolean and text properties to parameters; instance swap to a slot. Names should match.','What do you do when the Figma API of a component does not match the code API?'],
['Variables','Variable versus style?','A variable holds a single value (colour, number, string, boolean) and can have modes. A style is a saved bundle such as a text style or effect. Styles can reference variables.','Where would you still use a style?'],
['Variables','Why have a semantic layer?','It separates the value from its job, so themes and brands change the mapping without touching components.','How many layers is too many?'],
['Design systems','What belongs in a design system besides components?','Foundations (colour, type, spacing, motion), patterns, content guidelines, accessibility rules, documentation, a contribution process and versioning.','Who decides when a one-off becomes a system component?'],
['Design systems','How do you keep Figma and code in sync?','A single token source with generated platform files, matching component names and APIs, Code Connect or similar mapping, visual regression tests and a shared changelog.','What breaks first when they drift?'],
['Apple HIG','When do you use a sheet versus a push?','Push for moving deeper in a hierarchy. Sheet for a self-contained task or a brief choice that the user completes or cancels.','When is a full-screen cover right?'],
['Apple HIG','What is the safe area?','The region not covered by bars, the home indicator, the sensor housing or rounded corners. Backgrounds may extend past it; content and controls should not.','How does it change in landscape?'],
['Material Design','What is dynamic colour?','On Android 12 and later, Material can derive the app’s colour scheme from the user’s wallpaper. Roles stay the same; values come from the system.','When should a brand opt out?'],
['Material Design','How does Material 3 show elevation?','Mainly through tonal surface colours (surface container levels), with shadows used sparingly.','How does that differ from iOS?'],
['Flutter','Material, Cupertino or custom?','Material by default; adaptive constructors for controls users notice; a custom system for strong brands. Decide per component, not once for the app.','What does a custom component need to do for accessibility?'],
['Flutter','How do constraints work in Flutter?','Constraints go down, sizes go up, the parent sets position. A widget cannot choose a size outside its parent’s constraints.','Why does a ListView inside a Column throw?'],
['Accessibility','What does a product card need for a screen reader?','One focusable element or a sensible order, a label with name, quantity, price and discount, a button role and label for the action, and no separate stop on decorative images.','How do you test this on each platform?'],
['Accessibility','What is reduced motion and how do you honour it?','A system setting for people who are affected by motion. Replace large movement with a fade or no animation; keep essential feedback.','Where do you read the setting on iOS, Android and Flutter?'],
['Design handoff','What do you check before starting on a new screen?','Every state (loading, empty, error, long text), component and token names, spacing as Auto Layout values, assets and export settings, interaction notes, and open questions written as comments.','What do you do when a state is missing?'],
['Animations','When should an interface animation use ease out, and when ease in?','Ease out for things entering or responding to a touch: they start fast, so the interface feels immediate, and settle gently. Ease in for things leaving, which accelerate away. Ease in and out for movement between two on-screen positions.','What would you use for a gesture-driven drag that the user releases mid-way?'],
['Animations','How do you respect a user’s reduced-motion setting?','Read the system setting, keep the feedback, and replace movement, zoom and parallax with a fade or an instant change. Stop looping and auto-playing motion. Never remove the confirmation itself.','Where is the setting read on iOS, Android and Flutter?'],
['Responsive design','How do you make one screen work from a small phone to a tablet?','Let content set sizes instead of fixing them, define breakpoints by available width and not by device, change structure at those widths (columns, a side pane, a navigation rail), and test with large text and long content at each.','What changes at a breakpoint besides the number of columns?'],
['Responsive design','What breaks first when the user doubles their text size?','Fixed-height containers clip, single-line rows overflow, and side-by-side layouts run out of width. The fixes are heights that hug content, rows that wrap or stack, and truncation only where the full text is available elsewhere.','How would you test this before release?'],
['Visual QA','What is a golden test?','A test that renders a widget or screen and compares the image with a stored reference. Flutter calls them golden tests; iOS and Android use snapshot or screenshot tests. They catch unintended visual changes in CI.','Why do goldens flake across machines?']];
