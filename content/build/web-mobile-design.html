<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>Mobile Design & Figma Academy</title>
<meta charset="utf-8">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: a design-tool workspace. Layers-style rail on the left, a canvas on the right; measurements are drawn the way a redline spec draws them. */
:root{
  --canvas:#ECEEF3; --surface:#FFFFFF; --surface-2:#F5F6FA; --ink:#14161D; --ink-2:#5A6072; --line:#D5D9E3;
  --accent:#2B55E6; --on-accent:#FFFFFF; --accent-soft:#E3E9FF; --measure:#D01C83; --measure-soft:rgba(208,28,131,.16);
  --good:#177A45; --warn:#9A6200; --bad:#C02B2B; --code-bg:#F1F3F8;
  --f-display:"Bricolage Grotesque","Space Grotesk",system-ui,sans-serif;
  --f-body:"Instrument Sans",Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark; --canvas:#17191F; --surface:#22252D; --surface-2:#2A2E38; --ink:#ECEEF4; --ink-2:#A3A9BA; --line:#3A3F4C;
  --accent:#8AA4FF; --on-accent:#0E1330; --accent-soft:#2A335C; --measure:#FF72BC; --measure-soft:rgba(255,114,188,.2);
  --good:#5BD08F; --warn:#F0B64A; --bad:#FF8080; --code-bg:#1B1E25;
}}
:root[data-theme="dark"]{
  color-scheme:dark; --canvas:#17191F; --surface:#22252D; --surface-2:#2A2E38; --ink:#ECEEF4; --ink-2:#A3A9BA; --line:#3A3F4C;
  --accent:#8AA4FF; --on-accent:#0E1330; --accent-soft:#2A335C; --measure:#FF72BC; --measure-soft:rgba(255,114,188,.2);
  --good:#5BD08F; --warn:#F0B64A; --bad:#FF8080; --code-bg:#1B1E25;
}
*{box-sizing:border-box}
body{background:var(--canvas);color:var(--ink);font:15px/1.55 var(--f-body)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--canvas)}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;line-height:1.15;margin:0}
h1{font-size:clamp(28px,4.4vw,42px);font-weight:700;letter-spacing:-.02em}
h2{font-size:22px;font-weight:700;letter-spacing:-.01em}
h3{font-size:16px;font-weight:700}
p{margin:0;max-width:68ch}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto;border-right:1px solid var(--line);padding:18px 10px 18px max(12px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:2px;background:var(--canvas)}
.brand{font:700 17px/1.15 var(--f-display);padding:4px 8px 14px}
.brand small{display:block;font:400 11px var(--f-mono);color:var(--measure);margin-top:6px}
.rail a{display:flex;gap:8px;align-items:center;padding:7px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:14px;white-space:nowrap}
.rail a::before{content:"";width:9px;height:9px;border:1.5px solid var(--ink-2);border-radius:2px;flex:none}
.rail a.done::before{background:var(--good);border-color:var(--good)}
.rail a[aria-current]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rail a[aria-current]::before{border-color:var(--accent)}
.rail .grp{font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding:14px 8px 4px}
main{padding-block:28px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
.wrap{max-width:1080px;margin:0 auto;display:flex;flex-direction:column;gap:28px;padding-inline:clamp(0px,2vw,20px)}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  .rail{position:sticky;height:auto;flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px));z-index:9;gap:4px}
  .rail .brand,.rail .grp{display:none}
}
.eyebrow{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--measure)}
.lede{font-size:17px;color:var(--ink-2)}
.head{display:flex;flex-direction:column;gap:10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.plain{display:flex;flex-direction:column;gap:10px}
.cols{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.split{display:grid;gap:16px;grid-template-columns:minmax(0,300px) minmax(0,1fr)}
@media (max-width:1120px){.split{grid-template-columns:minmax(0,1fr)!important}}
ul.tight{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;max-width:70ch}
.chip{display:inline-flex;align-items:center;gap:5px;font:600 10.5px var(--f-mono);letter-spacing:.04em;text-transform:uppercase;padding:3px 7px;border-radius:4px;border:1px solid var(--line);color:var(--ink-2);white-space:nowrap}
.chip.live{color:var(--good);border-color:var(--good)} .chip.part{color:var(--warn);border-color:var(--warn)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 14px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--accent)} .btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;font-size:13px;border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.ctl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;font-size:13px;align-items:center}
.ctl input[type=range]{grid-column:1/-1;width:100%;accent-color:var(--accent)}
.ctl output{font:12px var(--f-mono);color:var(--measure);font-variant-numeric:tabular-nums}
.ctlgrp{display:flex;flex-direction:column;gap:10px}
.ctlgrp>b{font:600 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.check{display:flex;gap:8px;align-items:center;font-size:13px}
pre{margin:0;background:var(--code-bg);border:1px solid var(--line);border-radius:8px;padding:14px;overflow-x:auto;font:12.5px/1.6 var(--f-mono);tab-size:2}
pre .cm{color:var(--ink-2)}
code{font:.92em var(--f-mono);background:var(--code-bg);padding:1px 4px;border-radius:3px}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 10.5px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.note{font-size:13px;color:var(--ink-2);border-left:2px solid var(--measure);padding-left:10px;max-width:72ch}
.stage{background:var(--surface-2);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:16px 16px;border:1px solid var(--line);border-radius:10px;padding:20px 12px;display:flex;flex-direction:column;align-items:safe center;gap:10px;overflow-x:auto;min-width:0}
.stage>small{font:11px var(--f-mono);color:var(--ink-2);text-align:center}
/* mock device: an app screen, so it carries its own palette */
.device{--m-bg:#F2F3F5;--m-card:#FFFFFF;--m-ink:#16181D;--m-mute:#6B7080;--m-line:#E1E4EA;background:var(--m-bg);color:var(--m-ink);border:2px solid #2B2E38;border-radius:22px;padding:14px 10px;font-family:var(--f-body);flex:none;max-width:none}
.device.dark{--m-bg:#101216;--m-card:#1D2027;--m-ink:#F1F2F5;--m-mute:#9DA3B2;--m-line:#30343E}
.pgrid{display:grid;gap:10px}
.pc{display:flex;position:relative;min-width:0}
.pc .body{display:flex;flex-direction:column;min-width:0;flex:1}
.pc .img{position:relative;border-radius:8px;overflow:hidden;flex:none;display:grid;place-items:center}
.pc .badge{position:absolute;top:6px;inset-inline-start:6px;background:#B3261E;color:#fff;font:700 10px var(--f-body);padding:2px 6px;border-radius:4px}
.pc .ttl{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.25}
.pc .unit{color:var(--m-mute);line-height:1.2}
.pc .foot{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.pc .mrp{color:var(--m-mute);text-decoration:line-through;line-height:1.1}
.pc .price{font-weight:700;line-height:1.1}
.pc .add{border:0;border-radius:8px;font-weight:700;padding:0 14px;cursor:pointer;display:flex;align-items:center;gap:10px}
.pc .add span{cursor:pointer;padding:0 2px}
.gp{flex:none;position:relative}
.ov .gp{background:repeating-linear-gradient(45deg,#D01C83 0 1.5px,transparent 1.5px 5px)}
.ov .gp i{position:absolute;inset:0;display:grid;place-items:center;font:600 9px var(--f-mono);font-style:normal;color:#fff}
.ov .gp i b{background:#D01C83;padding:0 3px;border-radius:2px;font-weight:600}
.tree{font:12.5px/1.9 var(--f-mono);white-space:pre;overflow-x:auto}
.tree b{color:var(--accent);font-weight:600} .tree em{color:var(--measure);font-style:normal}
.audit{display:flex;flex-direction:column;gap:8px;margin:0;padding:0;list-style:none}
.audit li{display:grid;grid-template-columns:54px minmax(0,1fr);gap:10px;font-size:13.5px;align-items:start}
.audit .st{font:700 10.5px var(--f-mono);padding:3px 0;text-align:center;border-radius:4px;border:1px solid}
.st.ok{color:var(--good)} .st.no{color:var(--bad)} .st.info{color:var(--ink-2)}
.audit small{display:block;color:var(--ink-2)}
/* dashboard */
.meters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.meter{display:flex;flex-direction:column;gap:6px}
.meter b{font:700 26px var(--f-display);font-variant-numeric:tabular-nums}
.meter .bar{height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden;border:1px solid var(--line)}
.meter .bar i{display:block;height:100%;background:var(--accent)}
.journey{display:flex;flex-wrap:wrap;gap:6px 4px;font:12px var(--f-mono);color:var(--ink-2)}
.journey span::after{content:"→";margin-left:4px;color:var(--measure)} .journey span:last-child::after{content:""}
.mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,236px),1fr));gap:10px}
.mod{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px;text-decoration:none;color:var(--ink)}
.mod:hover{border-color:var(--accent)}
.mod .n{font:11px var(--f-mono);color:var(--ink-2)}
.mod strong{font:700 15px/1.2 var(--f-display)}
.mod .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.stagehd{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
/* quiz */
.q{display:flex;flex-direction:column;gap:8px}
.q .opts{display:flex;flex-direction:column;gap:6px}
.q .opts button{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:8px 12px;cursor:pointer}
.q .opts button.right{border-color:var(--good);color:var(--good);font-weight:600}
.q .opts button.wrong{border-color:var(--bad);color:var(--bad)}
.q .why{font-size:13.5px;color:var(--ink-2)}
details{border-bottom:1px solid var(--line);padding:10px 0}
details summary{cursor:pointer;font-weight:600}
details>div{padding-top:8px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2);max-width:72ch}
/* fundamentals mock */
.fx{width:300px;font-size:13px;display:flex;flex-direction:column;gap:9px}
.fx .ttl{font-size:13px}.fx .blk{background:var(--m-card);padding:9px;border-radius:3px;display:flex;flex-direction:column;gap:9px}
.fx .ln{display:flex;gap:14px}.fx .ln span:first-child{flex:none;width:118px}
.fx .cta{border:0;padding:9px;border-radius:2px;background:#BFE3CC;color:#F4FFF7;font-weight:600}
.fx .alt{border:0;padding:9px;border-radius:14px;background:#1F8A4C;color:#fff}
.fx .tot{font-size:13px}
.fx.h .ttl{font:700 20px var(--f-display)}.fx.h .tot{font-weight:700;font-size:16px}.fx.h .lab{color:var(--m-mute);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.fx.p{gap:16px}.fx.p .blk{gap:4px}
.fx.a .ln{justify-content:space-between}.fx.a .ln span:first-child{width:auto}.fx.a .ln span:last-child{font-variant-numeric:tabular-nums}
.fx.c .cta{background:#17703D;color:#fff}
.fx.s .blk,.fx.s .cta,.fx.s .alt{border-radius:10px}.fx.s .alt{background:transparent;color:#17703D;border:1px solid #17703D}
/* review mock */
.rv{width:320px;display:flex;flex-direction:column;font-size:13px}
.rv [data-flaw]{cursor:pointer;border-radius:4px}
.rv [data-flaw].found{outline:2px solid #D01C83;outline-offset:2px}
.rv .it{background:var(--m-card);border-radius:8px;padding:10px;display:flex;gap:10px;align-items:center}
.sw{height:54px;border-radius:6px;display:flex;align-items:flex-end;padding:5px;font:600 10px var(--f-mono);min-width:0}
.swrow{display:grid;grid-template-columns:repeat(auto-fit,minmax(54px,1fr));gap:6px}
.phone{width:240px;height:440px;position:relative;overflow:hidden;padding:0;display:flex;flex-direction:column}
.phone .sb{height:34px;flex:none;display:flex;justify-content:space-between;align-items:center;padding:0 16px;font:600 11px var(--f-mono)}
.phone .list{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:6px;padding:0 10px}
.phone .list div{background:var(--m-card);border-radius:6px;padding:9px;font-size:12px;flex:none}
.phone .cta{background:#17703D;color:#fff;text-align:center;font-weight:700;padding:12px;margin:0 10px;border-radius:8px;font-size:13px;flex:none}
.phone .hi{height:22px;flex:none;display:grid;place-items:center}.phone .hi::after{content:"";width:90px;height:4px;border-radius:2px;background:var(--m-ink)}
.phone .kb{height:150px;flex:none;background:#C9CDD6;display:grid;place-items:center;font:11px var(--f-mono);color:#333}
.phone .zone{position:absolute;left:0;right:0;background:repeating-linear-gradient(45deg,rgba(208,28,131,.5) 0 2px,transparent 2px 6px);pointer-events:none}
.pm{border:1px solid var(--m-line);background:var(--m-card);border-radius:10px;padding:10px;font-size:12px;width:100%;display:flex;flex-direction:column;gap:8px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<div class="shell">
  <nav class="rail" id="rail" aria-label="Academy sections"></nav>
  <main id="main"></main>
</div>
<script>
"use strict";
/* ---------- storage + helpers ---------- */
const KEY='mda.v1';
let S={done:{},quiz:{},days:{}};
try{const r=JSON.parse(localStorage.getItem(KEY)||'null');if(r)S=Object.assign(S,r)}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const main=document.getElementById('main'),rail=document.getElementById('rail');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const code=s=>'<pre>'+esc(s.trim()).replace(/(\/\/.*)$/gm,'<span class="cm">$1</span>')+'</pre>';
const hex2rgb=h=>{h=h.replace('#','');return[0,2,4].map(i=>parseInt(h.substr(i,2),16))};
const lum=h=>{const[r,g,b]=hex2rgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b};
const contrast=(a,b)=>{const x=lum(a),y=lum(b);return(Math.max(x,y)+.05)/(Math.min(x,y)+.05)};
const hsl2hex=(h,s,l)=>{h=((h%360)+360)%360;s/=100;l/=100;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>{const v=l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return Math.round(v*255).toString(16).padStart(2,'0')};return('#'+f(0)+f(8)+f(4)).toUpperCase()};
const onColor=h=>contrast(h,'#FFFFFF')>=contrast(h,'#14161D')?'#FFFFFF':'#14161D';
const rng=(st,k,label,min,max,step,u='')=>`<label class="ctl"><span>${label}</span><output>${st[k]}${u}</output><input type="range" id="c-${k}" data-k="${k}" data-u="${u}" min="${min}" max="${max}" step="${step}" value="${st[k]}"></label>`;
const seg=(st,k,opts)=>`<div class="seg" role="group">${opts.map(([v,l])=>`<button type="button" data-seg="${k}" data-v="${v}" aria-pressed="${String(st[k])===String(v)}">${l}</button>`).join('')}</div>`;
const chk=(st,k,label)=>`<label class="check"><input type="checkbox" id="c-${k}" data-k="${k}" ${st[k]?'checked':''}>${label}</label>`;
function bind(st,update,onClick){
  main.oninput=e=>{const t=e.target,k=t.dataset.k;if(!k)return;
    st[k]=t.type==='checkbox'?t.checked:t.type==='range'?+t.value:t.value;
    const o=t.parentElement.querySelector('output');if(o)o.textContent=t.value+(t.dataset.u||'');update(k)};
  main.onclick=e=>{const b=e.target.closest('[data-seg]');
    if(b){st[b.dataset.seg]=b.dataset.v;b.parentElement.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));update(b.dataset.seg);return}
    if(onClick)onClick(e)};
}
/* ---------- quiz ---------- */
let QZ={};
function quiz(id,qs){QZ={id,qs,ans:{}};
  return `<section class="panel"><h2>Check yourself</h2>${qs.map((q,i)=>`<div class="q" id="q-${i}"><b>${i+1}. ${q.q}</b><div class="opts">${q.o.map((o,j)=>`<button type="button" data-qi="${i}" data-oi="${j}">${o}</button>`).join('')}</div><div class="why" hidden></div></div>`).join('')}<p class="note" id="qscore">${S.quiz[id]!=null?'Best so far: '+S.quiz[id]+' of '+qs.length:'Answer all '+qs.length+' to record a score.'}</p></section>`}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-qi]');
  if(b){const i=+b.dataset.qi,j=+b.dataset.oi,q=QZ.qs[i];if(QZ.ans[i]!=null)return;QZ.ans[i]=j;
    const box=document.getElementById('q-'+i);box.querySelectorAll('button').forEach((x,n)=>{if(n===q.a)x.classList.add('right');else if(n===j)x.classList.add('wrong')});
    const w=box.querySelector('.why');w.hidden=false;w.textContent=q.why;
    if(Object.keys(QZ.ans).length===QZ.qs.length){const sc=QZ.qs.filter((q,n)=>QZ.ans[n]===q.a).length;S.quiz[QZ.id]=Math.max(S.quiz[QZ.id]||0,sc);save();document.getElementById('qscore').textContent='Score: '+sc+' of '+QZ.qs.length+'. Best: '+S.quiz[QZ.id]+'.'}
    return}
  const d=e.target.closest('[data-done]');
  if(d){const k=d.dataset.done;S.done[k]=!S.done[k];save();d.textContent=S.done[k]?'Completed ✓ (undo)':'Mark lesson complete';drawRail()}
});
const doneBtn=k=>`<div class="row"><button type="button" class="btn primary" data-done="${k}">${S.done[k]?'Completed ✓ (undo)':'Mark lesson complete'}</button></div>`;
const head=(eye,t,lede)=>`<header class="head"><span class="eyebrow">${eye}</span><h1>${t}</h1><p class="lede">${lede}</p></header>`;
const simNote='<p class="note">Educational simulator. This is not the Figma editor and does not read any Figma file; it imitates the behaviour so you can see the rules.</p>';
const list=a=>'<ul class="tight">'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
const qa=a=>a.map(([q,an])=>`<details><summary>${q}</summary><div>${an}</div></details>`).join('');

/* ---------- module catalogue ---------- */
const STAGES=['Understand design','Learn Figma','Platform guidelines','Systems and craft','Implement in code','Validate','Practise and track'];
// [n,title,stage,status(L live,P partial,O outline),route,topics]
const MODS=[

  return row(r1>=4.5,'Add button label against its fill',`${r1.toFixed(2)}:1. WCAG AA asks 4.5:1 for text this size.`)
  +row(r3>=3,'Add button fill against the card',`${r3.toFixed(2)}:1. A control needs 3:1 against what surrounds it to be seen as a control.`)
  +row(r2>=4.5,'Unit and MRP text against the card',`${r2.toFixed(2)}:1 for the muted grey on ${cardBg}.`)
  +row(A.btn>=44,'Touch target on iOS',`Button is ${A.btn} pt tall. Apple’s guidance is at least 44 by 44 pt. A shorter visual is fine if the hit area is enlarged.`)
  +row(A.btn>=48,'Touch target on Android and Flutter',`Button is ${A.btn} dp tall. Material asks for 48 by 48 dp. Compose and Flutter Material buttons pad the hit area for you; custom ones do not.`)
  +row(small>=11,'Smallest text',`MRP renders at ${small.toFixed(1)} pt. Below about 11 pt becomes hard to read on a phone.`)
  +row(null,'Text scaling',`Preview is at ${Math.round(A.scale*100)}%. Push it to 200% and turn on the long title: the footer wraps instead of clipping because the row is allowed to wrap. A fixed-height card would cut the price off.`)
  +row(null,'What a screen reader should say',`“${p.t}, ${p.u}, ${p.p} rupees, was ${p.m} rupees, ${Math.round((p.m-p.p)/p.m*100)} percent off. Add, button.” The discount must be in the label, not only in the red badge colour.`)}
V.autolayout=()=>{
  main.innerHTML=`<div class="wrap">${head('Module 13 · first complete lesson','Auto Layout, then SwiftUI, Compose and Flutter','One product card. Move a spacing, type or colour control and watch four things change together: the layout, the redline overlay, the layer tree and the code for each platform.')}
  <section class="plain"><h2>Why Auto Layout exists</h2><p>Before Auto Layout a Figma frame was a list of boxes at fixed x and y. Change one label and you nudged every box below it by hand. Auto Layout replaces coordinates with rules: a direction, a gap between children, padding around them and a sizing mode for each child. That is the same idea as a stack in SwiftUI, a Row or Column in Compose and Flutter, and Flexbox on the web, which is why a frame built with Auto Layout is far easier to implement than one drawn freehand.</p></section>
  <section class="split">
    <div class="panel">
      <div class="ctlgrp"><b>Auto Layout</b>${seg(A,'dir',[['V','Vertical'],['H','Horizontal']])}${rng(A,'pad','Padding',0,24,1)}${rng(A,'gap','Gap between items',0,24,1)}${rng(A,'radius','Corner radius',0,24,1)}${rng(A,'img','Image height (fixed)',64,160,4)}</div>
      <div class="ctlgrp"><b>Typography</b>${rng(A,'ts','Title size',11,20,1)}${seg(A,'tw',[['400','Regular'],['500','Medium'],['600','Semibold'],['700','Bold']])}${rng(A,'ps','Price size',12,22,1)}</div>
      <div class="ctlgrp"><b>Colour and control</b><label class="check"><input type="color" id="c-brand" data-k="brand" value="${A.brand}">Action colour</label>${rng(A,'btn','Add button height',24,52,2)}</div>
      <div class="ctlgrp"><b>Device preview</b>${rng(A,'w','Screen width',280,620,10)}${rng(A,'scale','Text scale',0.85,2,0.05,'×')}${chk(A,'long','Long product titles')}${chk(A,'rtl','Right-to-left')}${chk(A,'dark','Dark theme')}${chk(A,'ov','Show padding and gap overlay')}</div>
      <div class="row"><button type="button" class="btn" id="messy">Load a messy card</button><button type="button" class="btn" id="clean">Load the clean card</button></div>
    </div>
    <div class="plain">
      <div class="stage"><div class="device" id="dev"></div><small id="devcap"></small></div>
      ${simNote}
    </div>
  </section>
  <section class="cols"><div class="panel"><h2>Component hierarchy</h2><div class="tree" id="tree"></div><p class="note">Blue is the layer name you would give it in Figma. Pink is the Auto Layout setting on that layer.</p></div>
  <div class="panel"><h2>Accessibility review</h2><ul class="audit" id="audit"></ul></div></section>
  <section class="panel"><div class="row" style="justify-content:space-between"><h2>The same card in code</h2>${seg(A,'tab',[['swiftui','SwiftUI'],['compose','Jetpack Compose'],['flutter','Flutter']])}</div><div id="code"></div><p class="note">The numbers in this code come from the controls above. The snippets are written to be idiomatic but have not been compiled here; <code>Product</code>, <code>AddButton</code> and <code>DiscountBadge</code> are assumed to exist.</p></section>
  <section class="panel"><h2>How each Figma setting maps</h2><div class="tablewrap"><table><thead><tr><th>Figma Auto Layout</th><th>SwiftUI</th><th>Compose</th><th>Flutter</th><th>CSS Flexbox</th></tr></thead><tbody>
  ${[['Vertical / Horizontal','VStack / HStack','Column / Row','Column / Row','flex-direction'],['Gap between items','spacing:','Arrangement.spacedBy()','SizedBox, or spacing:','gap'],['Gap = Auto','Spacer()','Arrangement.SpaceBetween','MainAxisAlignment.spaceBetween','justify-content: space-between'],['Padding','.padding()','Modifier.padding()','Padding / EdgeInsets','padding'],['Hug contents','default behaviour','default (wrap content)','MainAxisSize.min','width: auto'],['Fill container','.frame(maxWidth: .infinity)','fillMaxWidth() / weight(1f)','Expanded / double.infinity','flex: 1 / align-self: stretch'],['Fixed size','.frame(width:height:)','Modifier.size()','SizedBox','width / height'],['Min and max size','.frame(minWidth:maxWidth:)','widthIn(min, max)','ConstrainedBox','min-width / max-width'],['Absolute position','ZStack or .overlay(alignment:)','Box + Modifier.align()','Stack + Positioned','position: absolute'],['Wrap','custom Layout (no built-in wrapping stack)','FlowRow','Wrap','flex-wrap: wrap']].map(r=>'<tr>'+r.map((c,i)=>'<td>'+(i?'<code>'+esc(c)+'</code>':c)+'</td>').join('')+'</tr>').join('')}
  </tbody></table></div>
  <h3>Where the models differ</h3>${list(['<b>Modifier order.</b> In SwiftUI and Compose, padding then background paints behind the padding; background then padding does not. Figma has one padding per frame and no order to get wrong.','<b>Who decides size.</b> Flutter passes constraints down and sizes up. A <code>Column</code> inside a scroll view gets unbounded height, so <code>Expanded</code> throws. Figma never has an unbounded axis.','<b>Text does not scale in Figma.</b> A frame drawn at 14 px stays 14 px. On a phone the user’s text size multiplies it, so every Hug height in the design is a minimum, never a fixed number.','<b>Units.</b> Figma px at 1x equal iOS points, Android dp and Flutter logical pixels. Font sizes are sp on Android so they follow the system font scale.','<b>Leading and trailing.</b> Figma has left and right. Code should use leading and trailing (start and end) so the card mirrors in Arabic or Hebrew. Toggle right-to-left above to see it.'])}</section>
  <section class="cols">
    <div class="panel"><h2>Build it in Figma</h2>${list(['Draw the image rectangle, title, unit, price, MRP and Add button as loose layers.','Select price and MRP, press <b>Shift + A</b>. Set vertical, gap 2. Name it <code>PriceStack</code>.','Select PriceStack and the button, Shift + A, horizontal, then set gap to <b>Auto</b>. Name it <code>FooterRow</code> and set width to Fill.','Select everything, Shift + A, vertical, gap 8, padding 12. Name it <code>ProductCard</code>.','Set the image to Fill width, Fixed height. Set the title to Fill width with a two-line truncation.','Place the discount badge on the image and switch it to absolute position, pinned top-left.','Stretch the card wider and narrower. Nothing should overlap or leave a hole. Then turn it into a component.'])}</div>
    <div class="panel"><h2>Common mistakes</h2>${list(['Gap values that are not on the spacing scale (7, 11, 13). The messy preset shows how that reads.','Fixed height on a card that contains text. It clips at larger text sizes.','Using spacer rectangles in Figma instead of gap and padding. The developer then has to guess which is which.','Hardcoding <code>.system(size:)</code> or logical-pixel font sizes with no scaling path.','A 28 pt Add button with no enlarged hit area.','Matching Figma left and right literally, so the card does not mirror in RTL.'])}</div>
    <div class="panel"><h2>Engineering implications</h2>${list(['Each named Auto Layout frame is a candidate for one reusable view or widget. If the tree above reads cleanly, the code will too.','Padding, gap and radius should arrive as tokens, not literals, so a spacing change is one edit per platform.','A grid of these cards must not assume equal heights. Long titles and large text make them uneven; decide whether rows align to the tallest card.','The Add to stepper swap changes width. Reserve the wider width or the price will jump.'])}</div>
    <div class="panel"><h2>Design QA checklist</h2><div id="qa" class="plain"></div></div>
  </section>
  <section class="panel"><h2>Hands-on exercise</h2><p>Load the messy card. Without pressing the clean preset, fix it using only the sliders until every accessibility row that can pass does pass and every spacing value is a multiple of 4. Then rebuild the same card in Figma from a blank frame using the steps above, and compare your layer tree with the one on this page.</p></section>
  ${quiz('autolayout',[{q:'In Figma, the footer row has gap set to Auto. What is the SwiftUI equivalent?',o:['HStack(spacing: 0)','An HStack with a Spacer() between the two children','.frame(maxWidth: .infinity) on both children'],a:1,why:'Auto gap pushes children to the ends, which is what a Spacer does. In Compose and Flutter it is SpaceBetween.'},{q:'A card has Hug height in Figma and contains a two-line title. What should the implementation do?',o:['Give the card the exact height shown in Figma','Let content set the height and treat the Figma height as a minimum','Truncate the title to one line so the height always matches'],a:1,why:'Text scales with the user’s font size. A fixed height clips; Hug means the content decides.'},{q:'The design shows a 32 pt tall Add button. What is the right call on iOS?',o:['Ship it at 32 pt, the design is the source of truth','Make it 44 pt tall even though it changes the look','Keep the 32 pt visual and extend the tappable area to 44 pt'],a:2,why:'The visual size is a design decision; the hit area is a usability floor. You can satisfy both.'}])}
  <section class="panel"><h2>Interview questions</h2>${qa([['How does Figma Auto Layout differ from Flexbox?','Close in spirit: direction, gap, padding, alignment, wrap. Differences: Figma has no flex-grow ratios (children are hug, fill or fixed), no flex-basis, and absolute children stay inside the frame’s bounds. Fill among several siblings splits space evenly.'],['Why can a Flutter Column overflow when the same Figma frame looks fine?','Figma frames grow to hug content. A Column gets a maximum height from its parent; if the children need more it reports overflow. The fix is a scrollable parent, Flexible children or less content, not a smaller font.'],['When would you refuse to match a design pixel for pixel?','When matching would break Dynamic Type, localisation, RTL or minimum touch targets. The spec is intent; the platform’s accessibility behaviour is a requirement.']])}</section>
  ${doneBtn('autolayout')}</div>`;
  const dev=document.getElementById('dev');
  const QA=['Padding and gap match the tokens, measured on a device and not by eye','Card checked at 320 pt width and at the widest phone','Text scale 200%: nothing clipped, price still visible','Long title truncates at two lines with an ellipsis','Right-to-left: badge and button mirror','Dark theme: contrast rows still pass','Add to stepper swap does not shift the price','VoiceOver and TalkBack read title, unit, price, discount, action'];
  const tree=()=>{const H=A.dir==='H';return `<b>ProductCard</b>  <em>${H?'horizontal':'vertical'} · padding ${A.pad} · gap ${A.gap} · radius ${A.radius} · W fill · H hug</em>
├─ <b>ImageWrap</b>  <em>${H?`fixed ${A.img} × ${A.img}`:`W fill · H fixed ${A.img}`}</em>
│  ├─ Image
│  └─ <b>DiscountBadge</b>  <em>absolute · top-leading 6</em>
└─ <b>Body</b>  <em>vertical · gap ${A.gap} · W fill</em>
   ├─ <b>TitleBlock</b>  <em>vertical · gap ${Math.max(2,Math.round(A.gap/2))}</em>
   │  ├─ Title  <em>${A.ts}/${A.tw} · max 2 lines</em>
   │  └─ Unit
   └─ <b>FooterRow</b>  <em>horizontal · gap Auto · align centre</em>
      ├─ <b>PriceStack</b>  <em>vertical · gap 2 · hug</em>
      │  ├─ Price  <em>${A.ps}/700</em>
      │  └─ MRP
      └─ <b>AddButton</b>  <em>H fixed ${A.btn} · variant: add | stepper</em>`};
  const draw=k=>{const H=A.dir==='H',cols=H?1:A.w>=520?3:2;
    dev.style.width=A.w+'px';dev.className='device'+(A.dark?' dark':'');dev.dir=A.rtl?'rtl':'ltr';
    dev.innerHTML=`<div class="pgrid" style="grid-template-columns:repeat(${cols},minmax(0,1fr))">${PRODUCTS.slice(0,H?3:cols*2).map((p,i)=>cardHTML(i)).join('')}</div>`;
    document.getElementById('devcap').textContent=`${A.w} pt wide · ${cols} column${cols>1?'s':''} · text ${Math.round(A.scale*100)}% · ${A.rtl?'RTL':'LTR'}`;
    document.getElementById('tree').innerHTML=tree();
    document.getElementById('audit').innerHTML=auditA();
    document.getElementById('code').innerHTML=code(A.tab==='swiftui'?swiftCode():A.tab==='compose'?composeCode():flutterCode())};
  document.getElementById('qa').innerHTML=QA.map((q,i)=>`<label class="check"><input type="checkbox" id="qa-${i}">${q}</label>`).join('');
  const setAll=o=>{Object.assign(A,o);['pad','gap','radius','img','ts','ps','btn'].forEach(k=>{const el=document.getElementById('c-'+k);el.value=A[k];el.parentElement.querySelector('output').textContent=A[k]});document.getElementById('c-brand').value=A.brand;draw()};
  bind(A,draw,e=>{const q=e.target.closest('[data-q]');
    if(q){const i=q.dataset.q;A.qty[i]=Math.max(0,(A.qty[i]||0)+(+q.dataset.d));draw();return}
    if(e.target.id==='messy')setAll({pad:5,gap:13,radius:3,img:76,ts:11,ps:13,btn:26,brand:'#8FD3A8'});
    if(e.target.id==='clean')setAll({pad:12,gap:8,radius:12,img:104,ts:14,ps:16,btn:44,brand:'#17703D'})});
  draw();
};

/* ---------- fundamentals ---------- */
const F={h:false,p:false,a:false,c:false,s:false,f:false};
V.fundamentals=()=>{
  const fixes=[['h','Hierarchy','The title, the section labels and the total all had the same size and weight, so the eye had no starting point. Now the screen title leads, labels recede and the total is the heaviest number.','Bend it when everything on screen really is equal, such as a settings list.'],['p','Proximity','Every line was 9 px from the next, so address, items and bill read as one list. Tight spacing inside a group and wide spacing between groups shows what belongs together without drawing a single line.','Bend it in dense data tables, where even rhythm helps scanning.'],['a','Alignment','Amounts started at a fixed offset and formed a ragged edge. Right-aligned tabular figures let you compare digits column by column.','Centre alignment is fine for a single short message, such as an empty state.'],['c','Contrast','The pay button was pale green on paler green, about 1.3:1. The most important control on the screen was the hardest thing to see.','Low contrast is right for a disabled control, as long as it is not the only cue.'],['s','Consistency','Three corner radii and two filled buttons competing. One radius, one primary action, a quieter secondary.','Break consistency on purpose to flag something destructive or new.'],['f','Feedback and clarity','“Continue” does not say what happens next. “Pay ₹1,240 with UPI” names the action, the amount and the method before the tap.','Short generic labels are fine mid-flow when the next step is obvious and reversible.']];
  main.innerHTML=`<div class="wrap">${head('Modules 1 and 2','UI, UX and the principles underneath','UI is what the screen looks like and how its controls are drawn. UX is whether a person can get their job done and how it feels to do it. They fail independently.')}
  <section class="cols"><div class="panel"><h2>The words, plainly</h2>${list(['<b>UI design:</b> layout, colour, type, the controls themselves.','<b>UX design:</b> the path from intent to outcome. Can the user find it, understand it, finish it, recover from a mistake.','<b>Interaction design:</b> what happens on tap, drag, wait and error.','<b>Visual design:</b> hierarchy and style that make the structure readable.','<b>Product design:</b> all of the above plus deciding what to build and why.','<b>Usability:</b> how easily a specific person completes a specific task.','<b>Accessibility:</b> usability for people who see, hear, move or think differently from the designer.','<b>Design thinking:</b> understand the problem, try cheap versions, test, repeat.'])}</div>
  <div class="panel"><h2>Who pulls on one screen</h2><p>Take the pay button on a grocery checkout.</p>${list(['<b>UX</b> wants the amount and method on the button so there are no surprises.','<b>UI</b> wants one clear primary action that fits at every text size.','<b>Engineering</b> needs a loading state, a disabled state while the request is in flight and a retry path.','<b>Business</b> wants the default payment method to be the cheapest one to process.'])}<p>A good screen is the one where all four can live with the answer.</p></div></section>
  <section class="panel"><h2>Fix a checkout, one principle at a time</h2><p>This summary screen is wrong in six ways. Switch each fix on and read what changed.</p>
  <div class="split"><div class="plain">${fixes.map(f=>chk(F,f[0],f[1])).join('')}<div class="row"><button type="button" class="btn" id="fall">Fix everything</button><button type="button" class="btn" id="fnone">Break it again</button></div><p class="note" id="fcount"></p></div>
  <div class="plain"><div class="stage"><div class="device" style="width:auto"><div class="fx" id="fx"></div></div><small>Original teaching example, not a real app’s screen</small></div></div></div>
  <div id="fwhy" class="plain"></div></section>
  <section class="cols"><div class="panel"><h2>Two laws worth knowing by name</h2>${list(['<b>Fitts’s Law:</b> bigger and closer targets are faster to hit. It is why the primary action sits at the bottom of a phone, near the thumb, and why 44 pt and 48 dp minimums exist.','<b>Hick’s Law:</b> more choices mean a slower decision. Six payment methods shown at once are slower than the last-used one plus “more options”.'])}</div>
  <div class="panel"><h2>On iOS, Android and Flutter</h2>${list(['<b>iOS:</b> primary action is often a full-width button above the home indicator or a trailing bar button; destructive actions use the destructive role.','<b>Android:</b> filled button for the highest-emphasis action, tonal or outlined for the next. A FAB is for the screen’s main creation action, which a checkout does not have.','<b>Flutter:</b> <code>FilledButton</code>, <code>FilledButton.tonal</code>, <code>OutlinedButton</code>, <code>TextButton</code> carry the same emphasis ladder as Material 3.'])}</div>
  <div class="panel"><h2>Exercise</h2><p>Screenshot the checkout of an app you use. Mark one example of each of the six principles, done well or badly. For the worst one, write what you would change and what it would cost engineering.</p></div></section>
  ${quiz('fundamentals',[{q:'A pay button looks polished but says “Continue”, and users hesitate. What kind of problem is this?',o:['A UI problem: the button needs a stronger colour','A UX problem: the outcome of the tap is unclear','An engineering problem: the tap is slow'],a:1,why:'The visual is fine. The user cannot predict what happens, which is a clarity and feedback failure.'},{q:'Which change communicates grouping without adding any lines or boxes?',o:['Proximity: less space inside groups, more between them','Contrast: darker text','Consistency: the same radius everywhere'],a:0,why:'Spacing alone tells the eye what belongs together.'},{q:'Why is the main action usually at the bottom of a phone screen?',o:['Hick’s Law','Fitts’s Law','Gestalt closure'],a:1,why:'It is closer to the thumb and can be made wide, so it is faster and easier to hit.'}])}
  <section class="panel"><h2>Interview questions</h2>${qa([['Give an example of good UI with poor UX.','A beautifully styled address form that validates only on submit and clears the fields on error. Each control looks right; the task is painful.'],['How do you decide what the primary action on a screen is?','Ask what the user came to this screen to do and what the business needs them to do. If those differ, that is a product conversation, not a styling one. There should be exactly one filled, highest-contrast action.']])}</section>
  ${doneBtn('fundamentals')}</div>`;
  const fx=document.getElementById('fx');
  const draw=()=>{fx.className='fx '+Object.keys(F).filter(k=>F[k]).join(' ');
    fx.innerHTML=`<div class="ttl">Checkout</div><div class="blk"><span class="lab">Deliver to</span><span>Home, 14 Lake View Road, Bengaluru</span><span class="lab">Slot</span><span>Today, 6 to 8 pm</span></div><div class="blk"><span class="lab">Bill</span><div class="ln"><span>Items (7)</span><span>₹1,198</span></div><div class="ln"><span>Delivery</span><span>₹30</span></div><div class="ln"><span>Handling</span><span>₹12</span></div><div class="ln tot"><span>To pay</span><span>₹1,240</span></div></div><button type="button" class="cta">${F.f?'Pay ₹1,240 with UPI':'Continue'}</button><button type="button" class="alt">${F.f?'Change payment method':'Other'}</button>`;
    const n=Object.values(F).filter(Boolean).length;document.getElementById('fcount').textContent=n+' of 6 problems fixed.';
    document.getElementById('fwhy').innerHTML=fixes.filter(f=>F[f[0]]).map(f=>`<p><b>${f[1]}.</b> ${f[2]} <span style="color:var(--ink-2)">${f[3]}</span></p>`).join('')||'<p style="color:var(--ink-2)">Nothing fixed yet.</p>'};
  bind(F,draw,e=>{if(e.target.id==='fall'||e.target.id==='fnone'){const v=e.target.id==='fall';Object.keys(F).forEach(k=>{F[k]=v;document.getElementById('c-'+k).checked=v});draw()}});draw();
};

/* ---------- colour ---------- */
const C={h:148,s:62,l:28,fg:'#FFFFFF',bg:'#17703D',harm:'analogous'};
V.color=()=>{
  main.innerHTML=`<div class="wrap">${head('Module 3 · with part of module 23','Colour you can defend','Pick a base colour, see the palette it implies, then test whether text on it can be read. The contrast number is the part most designs get wrong.')}
  <section class="split"><div class="panel"><div class="ctlgrp"><b>Base colour (HSL)</b>${rng(C,'h','Hue',0,359,1,'°')}${rng(C,'s','Saturation',0,100,1,'%')}${rng(C,'l','Lightness',5,95,1,'%')}</div><div class="ctlgrp"><b>Harmony</b>${seg(C,'harm',[['complementary','Complementary'],['analogous','Analogous'],['triadic','Triadic'],['split','Split']])}</div><p class="note">Hue is the position on the colour wheel, saturation is how vivid, lightness is how close to white or black. HEX and RGB describe the same colour as red, green and blue amounts; HSL is easier to reason about when you want “the same colour, lighter”.</p></div>
  <div class="panel"><h3>Harmony</h3><div class="swrow" id="harm"></div><h3>Tonal scale from this hue</h3><div class="swrow" id="scale"></div><p class="note">Design systems name these steps (green-50 to green-900) and call them primitive tokens. Light themes usually take the action colour from around 600; dark themes take it from around 300 so it still stands out on a dark surface.</p></div></section>
  <section class="panel"><h2>Contrast checker</h2><div class="row"><label class="check"><input type="color" id="c-fg" data-k="fg" value="${C.fg}">Text</label><label class="check"><input type="color" id="c-bg" data-k="bg" value="${C.bg}">Background</label><button type="button" class="btn" id="usebase">Use base colour as background</button></div><div id="cres" class="cols"></div>
  <p class="note">WCAG AA: 4.5:1 for normal text, 3:1 for large text (about 18 pt regular or 14 pt bold and above) and for the visible boundary of controls and icons. AAA raises text to 7:1. Opacity counts: 60% black on white is a grey, and the grey is what gets measured.</p></section>
  <section class="cols"><div class="panel"><h2>Good and bad</h2>${list(['<b>Bad:</b> red and green as the only difference between “out of stock” and “in stock”. About one man in twelve cannot tell them apart. <b>Good:</b> colour plus a word or icon.','<b>Bad:</b> brand colour used for links, prices, badges and buttons. <b>Good:</b> one colour means “you can tap this”.','<b>Bad:</b> dark mode made by inverting. <b>Good:</b> dark surfaces in steps, with lighter, less saturated accents.'])}</div>
  <div class="panel"><h2>Semantic colours</h2><p>Name colours by job, not by look: <code>color-action-primary</code>, <code>color-text-secondary</code>, <code>color-feedback-error</code>. The job stays the same in light and dark; the value behind it changes. The Tokens lesson lets you watch that happen.</p>${list(['<b>iOS</b> ships semantic colours such as <code>label</code>, <code>secondaryLabel</code> and <code>systemBackground</code> that adapt on their own.','<b>Material 3</b> defines roles such as <code>primary</code>, <code>onPrimary</code>, <code>surface</code>, <code>onSurfaceVariant</code>, and can derive them from the wallpaper on Android 12 and later.','<b>Flutter</b> exposes the same roles on <code>ColorScheme</code>; <code>ColorScheme.fromSeed</code> builds a full set from one colour.'])}</div></section>
  <section class="panel"><h2>This colour as a token on each platform</h2><div id="ccode"></div></section>
  <section class="panel"><h2>Exercise</h2><p>Find a base colour whose 600 step passes 4.5:1 with white text and whose 300 step passes 4.5:1 on a #17191F background. Write down the two hex values: you have just chosen a light and a dark value for one semantic token.</p></section>
  ${quiz('color',[{q:'White text on your brand green measures 3.4:1. Where may you use it?',o:['Anywhere, it is over 3','Only for large text and for icons or control boundaries','Nowhere'],a:1,why:'3:1 is the bar for large text and non-text UI. Body-size text needs 4.5:1.'},{q:'Why are semantic tokens better than using green-600 directly in a button?',o:['They compile faster','The button keeps the right colour when the theme or brand changes','Figma requires them'],a:1,why:'The component points at a role; each theme decides which primitive fills that role.'},{q:'A discount is shown only by turning the price red. What is missing?',o:['A second cue such as “24% off” text','A brighter red','An animation'],a:0,why:'Colour must not be the only carrier of meaning.'}])}
  ${doneBtn('color')}</div>`;

    document.getElementById('ccode').innerHTML=code(`// SwiftUI: put light and dark values in an asset catalog colour set
Color("action/primary")

// UIKit: resolves again when the trait collection changes
let actionPrimary = UIColor { traits in
    traits.userInterfaceStyle == .dark ? UIColor(named: "green-300")! : UIColor(named: "green-600")!
}

// Jetpack Compose

val LightColors = lightColorScheme(primary = Green600, onPrimary = Color.White)

// Android XML: res/values/colors.xml and res/values-night/colors.xml
<color name="action_primary">#${x}</color>

// Flutter
static const green600 = Color(0xFF${x});
final theme = ThemeData(colorScheme: ColorScheme.fromSeed(seedColor: green600));`)};
  bind(C,draw,e=>{if(e.target.id==='usebase'){C.bg=hsl2hex(C.h,C.s,C.l);document.getElementById('c-bg').value=C.bg.toLowerCase();draw()}});draw();

const T={size:17,weight:'400',lh:1.4,track:0,scale:1,width:300,text:'en'};
const IOS=[['Large Title',34],['Title 1',28],['Title 2',22],['Title 3',20],['Headline',17],['Body',17],['Callout',16],['Subheadline',15],['Footnote',13],['Caption 1',12],['Caption 2',11]];
const M3=[['Display Large',57],['Display Medium',45],['Display Small',36],['Headline Large',32],['Headline Medium',28],['Headline Small',24],['Title Large',22],['Title Medium',16],['Title Small',14],['Body Large',16],['Body Medium',14],['Body Small',12],['Label Large',14],['Label Medium',12],['Label Small',11]];
V.type=()=>{
  const TXT={en:'Fresh vegetables delivered in 10 minutes. Order before 8 pm for same-day delivery to your door.',de:'Lebensmittellieferung mit Zustellbenachrichtigung und Rückerstattungsmöglichkeit innerhalb von vierzehn Tagen.',hi:'ताज़ी सब्ज़ियाँ दस मिनट में आपके घर। आज की डिलीवरी के लिए रात आठ बजे से पहले ऑर्डर करें।'};
  main.innerHTML=`<div class="wrap">${head('Module 4','Typography that survives real users','Type carries most of a mobile screen. Change the settings, then change the user’s text size and the language, and see which choices hold up.')}
  <section class="split"><div class="panel"><div class="ctlgrp"><b>Text style</b>${rng(T,'size','Font size',10,40,1,' pt')}${seg(T,'weight',[['400','Regular'],['500','Medium'],['600','Semibold'],['700','Bold']])}${rng(T,'lh','Line height',1,2,0.05,'×')}${rng(T,'track','Letter spacing',-0.05,0.2,0.01,' em')}</div><div class="ctlgrp"><b>Conditions</b>${rng(T,'scale','User text size',0.85,2,0.05,'×')}${rng(T,'width','Container width',200,420,10,' pt')}${seg(T,'text',[['en','English'],['de','German'],['hi','Hindi']])}</div></div>
  <div class="plain"><div class="stage" style="align-items:flex-start"><div class="cols" style="width:100%"><div class="pm" id="tfixed"></div><div class="pm" id="tscaled"></div></div><small>Left ignores the user’s text size, as a hardcoded size does. Right follows it.</small></div><div class="panel" id="tnear"></div></div></section>
  <section class="cols"><div class="panel"><h2>The vocabulary</h2>${list(['<b>Typeface</b> is the design (San Francisco, Roboto). <b>Font</b> is one style of it (SF Pro Text Semibold).','<b>Line height</b> is the distance from one baseline to the next. Body text reads well around 1.3 to 1.5 times the size; headings tighter.','<b>Tracking</b> (letter spacing) is spacing across a whole run. <b>Kerning</b> is the adjustment between a specific pair such as A and V.','<b>Baseline</b> is the line letters sit on. Align mixed sizes on the baseline, not on their boxes.','<b>Hierarchy</b> comes from size, weight and colour. Use two of the three at most for each step.'])}</div>
  <div class="panel"><h2>Why hardcoded sizes fail</h2><p>Figma shows text at one size. On a phone the user picks a multiplier in system settings, and on iOS the largest accessibility sizes go well past 200%. A fixed 12 pt caption stays 12 pt for someone who asked for larger text. Use the platform’s text styles, or a custom size attached to one.</p>${list(['<b>iOS:</b> text styles such as <code>.body</code> scale on their own; custom sizes need <code>@ScaledMetric</code> or <code>UIFontMetrics</code>.','<b>Android:</b> font sizes in <code>sp</code> follow the font scale; <code>dp</code> does not.','<b>Flutter:</b> <code>Text</code> applies <code>MediaQuery.textScalerOf(context)</code> by default. Do not clamp it to 1.0 to protect a layout.'])}</div></section>
  <section class="panel"><h2>Platform type scales</h2><div class="cols"><div class="tablewrap"><table><thead><tr><th>iOS text style</th><th>Size at default</th></tr></thead><tbody>${IOS.map(r=>`<tr><td>${r[0]}</td><td>${r[1]} pt</td></tr>`).join('')}</tbody></table></div><div class="tablewrap"><table><thead><tr><th>Material 3 role (also Flutter TextTheme)</th><th>Size</th></tr></thead><tbody>${M3.map(r=>`<tr><td>${r[0]}</td><td>${r[1]} sp</td></tr>`).join('')}</tbody></table></div></div><p class="note">iOS uses San Francisco and Android defaults to Roboto. Flutter’s <code>TextTheme</code> uses the Material names in camelCase: <code>bodyLarge</code>, <code>titleMedium</code>, <code>labelSmall</code>. Sizes listed from memory; confirm against the current HIG and Material pages.</p></section>
  <section class="cols"><div class="panel"><h2>Common mistakes</h2>${list(['Seven sizes on one screen. Three or four is usually enough.','Line height copied as a pixel value, so it does not grow with the text.','Truncating a price or an error message. Truncate names; wrap anything the user must read.','Designing only in English. German runs about a third longer; Hindi needs more line height for marks above and below the line.','All caps with no extra letter spacing.'])}</div><div class="panel"><h2>Exercise</h2><p>Set 13 pt Regular with 1.2 line height and switch to Hindi at 1.5× text size in a 240 pt container. Note what breaks. Then find the smallest changes that make all three languages comfortable at 1× and at 2×.</p></div></section>
  ${quiz('type',[{q:'Which Android unit should a font size use?',o:['dp','sp','px'],a:1,why:'sp follows the user’s font scale; dp only follows screen density.'},{q:'A custom 15 pt title in SwiftUI must grow with Dynamic Type. What do you use?',o:['.font(.system(size: 15))','@ScaledMetric(relativeTo: .subheadline) for the size','.minimumScaleFactor(0.5)'],a:1,why:'A fixed system size does not scale. ScaledMetric ties your number to a text style’s scaling curve.'},{q:'Which text is safest to truncate?',o:['The amount to pay','A validation error','A long product name with the full name on the detail screen'],a:2,why:'Truncate only what is recoverable elsewhere and not needed to decide or act.'}])}
  ${doneBtn('type')}</div>`;
  const draw=()=>{const st=m=>`font-size:${T.size*m}px;font-weight:${T.weight};line-height:${T.lh};letter-spacing:${T.track}em;margin:0;max-width:none`;
    const box=(id,l,m)=>{document.getElementById(id).style.maxWidth=T.width+'px';document.getElementById(id).innerHTML=`<span class="eyebrow">${l}</span><p style="${st(m)}">${TXT[T.text]}</p>`};
    box('tfixed','Hardcoded · '+T.size+' pt',1);box('tscaled','Scales · '+(T.size*T.scale).toFixed(1)+' pt',T.scale);
    const near=(arr)=>arr.slice().sort((a,b)=>Math.abs(a[1]-T.size)-Math.abs(b[1]-T.size))[0];const i=near(IOS),m=near(M3);
    document.getElementById('tnear').innerHTML=`<h3>Nearest platform styles for ${T.size} pt</h3><p>iOS: <b>${i[0]}</b> (${i[1]} pt). Material and Flutter: <b>${m[0]}</b> (${m[1]} sp). ${i[1]===T.size&&m[1]===T.size?'Exact on both.':'If the design’s size is within a point of a system style, ask the designer whether the system style is acceptable. You get scaling and platform consistency for free.'}</p><p>Line height ${T.lh}× of ${T.size} is ${(T.lh*T.size).toFixed(1)} pt. ${T.lh<1.2?'That is tight for more than one line.':T.lh>1.7?'That is loose; lines start to drift apart.':''}</p>`};
  bind(T,draw);draw();
};

const P={grid:8,snap:false,show:true,a:13,b:7,c:18,val:16,safe:true,kb:false,avoid:true};
V.spacing=()=>{
  main.innerHTML=`<div class="wrap">${head('Module 5','Spacing, grids and the edges of the screen','Spacing is the cheapest way to make a screen look designed. Three tools: a scale, a unit that means the same thing on every density, and respect for the parts of the screen the system owns.')}
  <section class="panel"><h2>Why a spacing scale</h2><p>These three gaps were chosen by eye. They are close to each other but not equal, which the eye reads as a mistake, not as a decision. Snap them to a scale and the card settles.</p>
  <div class="split"><div class="plain"><div class="ctlgrp">${rng(P,'a','Padding around the card',2,28,1)}${rng(P,'b','Gap: image to text',2,28,1)}${rng(P,'c','Gap: text to button',2,28,1)}</div>${seg(P,'grid',[['4','4 pt grid'],['8','8 pt grid']])}${chk(P,'snap','Snap values to the grid')}${chk(P,'show','Show grid')}<p class="note" id="pmsg"></p></div>
  <div class="stage"><div class="device" style="width:230px" id="pdev"></div><small>Pink numbers are what the layout is using</small></div></div>
  <p>In Figma these are the frame’s padding and gap in Auto Layout. In code they should be tokens: <code>space-2 = 8</code>, <code>space-3 = 12</code>, <code>space-4 = 16</code>. A 4 pt base with most values on multiples of 8 is the common choice because it divides cleanly at 1x, 2x and 3x.</p></section>
  <section class="panel"><h2>One number, many pixels</h2><div class="split"><div class="plain">${rng(P,'val','Value in the design',1,64,1)}<p class="note">A Figma frame at 1x uses the same unit as iOS points, Android dp and Flutter logical pixels. You never multiply by hand; the platform does. You do need to supply images at each scale, or use vectors.</p></div><div class="tablewrap"><table><thead><tr><th>Screen</th><th>Scale</th><th>Physical pixels</th></tr></thead><tbody id="ptab"></tbody></table></div></div>
  ${list(['<b>pt</b> (iOS), <b>dp</b> (Android) and Flutter’s <b>logical pixel</b> are all density-independent.','<b>sp</b> is dp multiplied by the user’s font scale. Use it for text only.','<b>px</b> is a physical pixel. You meet it in hairlines (1 px = 1/scale pt) and image assets.','In Flutter, <code>MediaQuery.devicePixelRatioOf(context)</code> gives the scale.'])}</section>
  <section class="panel"><h2>Safe areas and the keyboard</h2><div class="split"><div class="plain">${chk(P,'safe','Respect safe area')}${chk(P,'kb','Keyboard is showing')}${chk(P,'avoid','Layout avoids the keyboard')}<p class="note" id="smsg"></p>${code(`// SwiftUI: safe area is respected by default
content.safeAreaInset(edge: .bottom) { PayButton() }

// Compose (edge-to-edge)
Scaffold(bottomBar = { PayButton(Modifier.navigationBarsPadding().imePadding()) }) { ... }

// Flutter
Scaffold(body: SafeArea(child: list), bottomNavigationBar: SafeArea(child: PayButton()))
// Scaffold resizes for the keyboard unless resizeToAvoidBottomInset is false`)}</div>
  <div class="stage"><div class="device phone" id="sdev"></div><small>Hatched zones belong to the system</small></div></div></section>
  <section class="cols"><div class="panel"><h2>Common mistakes</h2>${list(['Reading spacing off a screenshot instead of the Auto Layout values.','Hardcoding a status bar height. It differs by device and changes with cutouts and Dynamic Island.','A bottom button pinned to the screen edge, sitting under the home indicator or gesture bar.','Different screen margins on different screens of the same app.'])}</div><div class="panel"><h2>Exercise</h2><p>Open any screen you built this month. Write down every distinct spacing value in it. If there are more than six, or any is not on your scale, find out whether the design or the implementation introduced it.</p></div></section>
  ${quiz('spacing',[{q:'A design says 16. How many physical pixels is that on an xxhdpi Android phone?',o:['16','32','48'],a:2,why:'xxhdpi is 3x, so 16 dp is 48 px. You still write 16.dp.'},{q:'What does “respect the safe area” protect against?',o:['Content hidden behind the notch, status bar or home indicator','Slow scrolling','Low contrast'],a:0,why:'The safe area is the part of the screen not covered by system UI or hardware cutouts.'},{q:'Gaps of 7, 13 and 18 on one card are a problem mainly because…',o:['Odd numbers render blurry','They look like accidents and cannot be expressed as tokens','Figma does not allow them'],a:1,why:'Near-equal but unequal spacing reads as error, and off-scale values multiply across a codebase.'}])}
  ${doneBtn('spacing')}</div>`;
  const draw=()=>{const g=+P.grid,sn=v=>P.snap?Math.max(g,Math.round(v/g)*g):v,a=sn(P.a),b=sn(P.b),c=sn(P.c);
    const gp=(n)=>`<div class="gp" style="height:${n}px;background:repeating-linear-gradient(45deg,#D01C83 0 1.5px,transparent 1.5px 5px)"><i style="position:absolute;inset:0;display:grid;place-items:center;font:600 9px var(--f-mono);font-style:normal"><b style="background:#D01C83;color:#fff;padding:0 3px;border-radius:2px">${n}</b></i></div>`;
    document.getElementById('pdev').innerHTML=`<div style="background:${P.show?`linear-gradient(var(--m-card),var(--m-card)) content-box,repeating-linear-gradient(45deg,#D01C83 0 1.5px,var(--m-card) 1.5px 5px) padding-box`:'var(--m-card)'};padding:${a}px;border-radius:12px;display:flex;flex-direction:column"><div style="height:96px;border-radius:8px;background:#F6B93B33;display:grid;place-items:center">${fruit('#F6B93B')}</div>${gp(b)}<div style="font-weight:600;font-size:14px">Alphonso Mango</div><div style="font-size:12px;color:var(--m-mute)">1 kg · ₹249</div>${gp(c)}<div style="background:#17703D;color:#fff;text-align:center;font-weight:700;border-radius:8px;padding:10px;font-size:13px">Add</div></div>`;
    const off=[a,b,c].filter(v=>v%g).length;document.getElementById('pmsg').textContent=off?`${off} of 3 values are off the ${g} pt grid (${a}, ${b}, ${c}).`:`All three values sit on the ${g} pt grid (${a}, ${b}, ${c}).`;

    document.getElementById('smsg').textContent=(!P.safe?'Without the safe area the first row sits under the clock and the button sits on the home indicator. ':'')+(P.kb&&!P.avoid?'The keyboard now covers the pay button, so the user cannot finish. ':'')+(P.safe&&!(P.kb&&!P.avoid)?'Content and the primary action are clear of system areas.':'')};

/* ---------- tokens ---------- */
const K={g600:'#17703D',g300:'#7FD6A2',n900:'#16181D',n50:'#F4F5F7',mode:'light'};
V.tokens=()=>{
  main.innerHTML=`<div class="wrap">${head('Module 15','Primitive, semantic, component','A token is a named design decision. Three layers keep a rebrand or a dark theme from becoming a search-and-replace job.')}
  <section class="cols">
   <div class="panel"><h2>1 · Primitives</h2><p>Raw values with no meaning attached. Change one and follow it to the right.</p>${[['g600','green-600'],['g300','green-300'],['n900','neutral-900'],['n50','neutral-50']].map(([k,l])=>`<label class="check"><input type="color" id="c-${k}" data-k="${k}" value="${K[k]}"><code>${l}</code></label>`).join('')}</div>
   <div class="panel"><h2>2 · Semantic</h2><p>A role, pointing at a different primitive in each mode.</p>${seg(K,'mode',[['light','Light mode'],['dark','Dark mode']])}<div class="tablewrap"><table><tbody id="ksem"></tbody></table></div></div>
   <div class="panel"><h2>3 · Component</h2><p>A component’s parts, pointing at roles.</p><div class="tablewrap"><table><tbody id="kcmp"></tbody></table></div><div id="kprev"></div></div>
  </section>
  <section class="panel"><h2>What a design tool hands to code</h2><div id="kjson"></div><p class="note">In Figma, primitives and semantics are variables in collections, and light and dark are modes of the semantic collection. An export in a token JSON format like this is input to a build step (Style Dictionary is a common one) that writes Swift, Kotlin, XML and Dart. Not every token type converts directly: gradients, shadows and composite text styles usually need custom transforms or hand-mapping. The format shown is illustrative.</p></section>
  <section class="cols"><div class="panel"><h2>Per platform</h2>${list(['<b>SwiftUI / UIKit:</b> colour sets in an asset catalog with Any and Dark appearances, or generated <code>Color</code> extensions.','<b>Compose:</b> generated <code>lightColorScheme</code> and <code>darkColorScheme</code>, plus a <code>CompositionLocal</code> for tokens Material does not have.','<b>Android XML:</b> <code>values/</code> and <code>values-night/</code> resources.','<b>Flutter:</b> <code>ColorScheme</code> plus a <code>ThemeExtension</code> for custom roles.'])}</div><div class="panel"><h2>Common mistakes</h2>${list(['Components that reference primitives directly, so dark mode needs per-component overrides.','Semantic names that describe a look (<code>color-green-button</code>) instead of a job.','A component token for every property of every component. Add that layer only where a component has to differ from the role.','Editing generated token files by hand; the next export overwrites the change.'])}</div><div class="panel"><h2>Exercise</h2><p>Switch to dark mode and change green-300 until the button label passes contrast. Notice you did not touch the button. Then list which tokens a “festive red” brand theme would need to change and at which layer.</p></div></section>
  ${quiz('tokens',[{q:'Dark mode needs a lighter button colour. Which layer do you edit?',o:['The primitive green-600','The semantic token’s dark-mode value','The button component'],a:1,why:'The role keeps its name; its dark value points at a different primitive.'},{q:'What is a Figma variable mode?',o:['A plugin','A second set of values for the same variables, such as dark or a brand','A prototype transition'],a:1,why:'One collection, several modes; a frame picks which mode it renders in.'},{q:'Can every Figma token be exported straight into production code?',o:['Yes, always','No, some types need a transform step or manual mapping','Only on Android'],a:1,why:'Colours and numbers travel well; composite values such as shadows and text styles often need custom handling.'}])}
  ${doneBtn('tokens')}</div>`;
  const draw=()=>{const d=K.mode==='dark',sem={'color-action-primary':d?['green-300',K.g300]:['green-600',K.g600],'color-on-action':d?['neutral-900',K.n900]:['neutral-50',K.n50],'color-surface':d?['neutral-900',K.n900]:['neutral-50',K.n50],'color-text':d?['neutral-50',K.n50]:['neutral-900',K.n900]};
    const dot=h=>`<span style="display:inline-block;width:12px;height:12px;border-radius:3px;background:${h};border:1px solid var(--line);vertical-align:-1px"></span>`;
    document.getElementById('ksem').innerHTML=Object.entries(sem).map(([k,v])=>`<tr><td><code>${k}</code></td><td>→ ${dot(v[1])} <code>${v[0]}</code></td></tr>`).join('');
    document.getElementById('kcmp').innerHTML=[['button-primary-background','color-action-primary'],['button-primary-label','color-on-action'],['card-background','color-surface']].map(r=>`<tr><td><code>${r[0]}</code></td><td>→ ${dot(sem[r[1]][1])} <code>${r[1]}</code></td></tr>`).join('');
    const r=contrast(sem['color-on-action'][1],sem['color-action-primary'][1]);
    document.getElementById('kprev').innerHTML=`<div style="background:${sem['color-surface'][1]};color:${sem['color-text'][1]};border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px"><b>Alphonso Mango · ₹249</b><span style="background:${sem['color-action-primary'][1]};color:${sem['color-on-action'][1]};border-radius:8px;padding:10px;text-align:center;font-weight:700">Add to basket</span></div><p class="note">Button label contrast in ${K.mode} mode: ${r.toFixed(2)}:1, ${r>=4.5?'passes':'fails'} 4.5:1.</p>`;
    document.getElementById('kjson').innerHTML=code(`{
  "color": {
    "green":   { "600": { "$type": "color", "$value": "${K.g600}" }, "300": { "$type": "color", "$value": "${K.g300}" } },
    "neutral": { "900": { "$type": "color", "$value": "${K.n900}" }, "50":  { "$type": "color", "$value": "${K.n50}" } },
    "action":  { "primary": { "$value": "{color.green.${d?'300':'600'}}" } }   // ${K.mode} mode
  },
  "button": { "primary": { "background": { "$value": "{color.action.primary}" } } }
}`)};
  bind(K,draw);draw();
};

/* ---------- components and variants ---------- */

V.components=()=>{
  main.innerHTML=`<div class="wrap">${head('Module 14','Components and variants','A component is a design you draw once and reuse. Its properties are the same thing as the parameters of a view or widget, so reading a component well tells you most of the API you are about to write.')}
  <section class="cols"><div class="panel"><h2>The parts</h2>${list(['<b>Main component:</b> the single source. Edit it and every copy follows.','<b>Instance:</b> a linked copy placed in a screen. You can override some things on it (text, fills, nested instances) but not its structure.','<b>Variants:</b> several versions of one component grouped as a <b>component set</b>, picked by property values such as Style = Primary, Size = Large.','<b>Component properties:</b> four kinds. <b>Variant</b> picks a version, <b>boolean</b> shows or hides a layer, <b>text</b> edits a label, <b>instance swap</b> replaces a nested component such as an icon.','<b>Nested component:</b> a component used inside another, like an icon inside a button.'])}</div>
  <div class="panel"><h2>Why it exists</h2><p>Without components, forty screens hold forty hand-drawn buttons and a radius change means forty edits, some of which get missed. With them the designer changes one thing, and you can tell from the layer name which code component a layer is. Detached or hand-drawn copies in a file are the design equivalent of copy-pasted code.</p></div></section>
  <section class="panel"><h2>A button component set</h2><p>The left column is what Figma’s right-hand panel shows when you select an instance. Each control is labelled with its property kind.</p>
  <div class="split"><div class="plain">
    <div class="ctlgrp"><b>Variant · Style</b>${seg(B,'style',[['primary','Primary'],['secondary','Secondary'],['ghost','Ghost']])}</div>
    <div class="ctlgrp"><b>Variant · Size</b>${seg(B,'size',[['s','Small'],['m','Medium'],['l','Large']])}</div>
    <div class="ctlgrp"><b>Variant · State</b>${seg(B,'state',[['default','Default'],['pressed','Pressed'],['disabled','Disabled'],['loading','Loading']])}</div>
    <div class="ctlgrp"><b>Boolean · Show icon</b>${chk(B,'icon','Show icon')}</div>
    <div class="ctlgrp"><b>Instance swap · Icon</b>${seg(B,'glyph',[['plus','Plus'],['heart','Heart'],['arrow','Arrow']])}</div>
    <div class="ctlgrp"><b>Text · Label</b><input type="text" id="c-label" data-k="label" value="${esc(B.label)}" maxlength="28" style="padding:7px 9px;border:1px solid var(--line);border-radius:6px;background:var(--surface)"></div>
  </div>

  <section class="panel"><div class="row" style="justify-content:space-between"><h2>The same component as code</h2>${seg(B,'tab',[['swiftui','SwiftUI'],['compose','Jetpack Compose'],['flutter','Flutter']])}</div><div id="bcode"></div>
  <h3>The one place the mapping is not one to one</h3><p>In Figma, <b>State</b> is a variant property because a static file has to draw each state. In code only some states are parameters. <b>Pressed</b> happens at runtime while a finger is down; <b>Disabled</b> usually comes from the platform’s enabled flag; <b>Loading</b> is a real parameter. Do not add a <code>state:</code> enum to your code component just because Figma has one.</p>
  <p class="note">Snippets follow the selections above and have not been compiled here. Helper types such as <code>AppButtonStyle</code> are assumed.</p></section>
  <section class="panel"><h2>Main component, instances, overrides</h2><p>Three instances of one button. Edit the main component and all three change. The second has a text override and the third hides its icon; those survive the edit because an override only replaces the one property it touches.</p>
  <div class="split"><div class="plain"><div class="ctlgrp"><b>Edit the main component</b>${rng(B,'radius','Corner radius',0,24,1)}<label class="check"><input type="color" id="c-color" data-k="color" value="${B.color}">Fill colour</label></div>${chk(B,'ovr','Keep instance overrides')}<p class="note">Untick to see what “Reset all changes” does to an instance in Figma: overrides go and it matches the main component again.</p></div>
  <div class="stage"><div id="binst" class="row" style="justify-content:center"></div><small>Main component at the left, then two instances with overrides</small></div></div></section>
  <section class="panel"><h2>Why properties beat more variants</h2><div class="split"><div class="plain">${rng(B,'nStyle','Styles',1,5,1)}${rng(B,'nSize','Sizes',1,4,1)}${rng(B,'nState','States',1,6,1)}</div><div id="bcount" class="plain"></div></div></section>
  <section class="cols">
    <div class="panel"><h2>Build it in Figma</h2>${list(['Draw one button with Auto Layout: horizontal, centred, padding 14, gap 7. Place an icon component inside.','Select it and create a component (the four-diamond button in the toolbar).','In the right panel add a variant, then rename the property from “Property 1” to <code>Style</code> with values Primary, Secondary, Ghost.','Add <code>Size</code> and <code>State</code> the same way. Figma lays the variants out inside a dashed component set.','Select the icon layer and create a <b>boolean</b> property from its visibility, named <code>Show icon</code>.','Select the icon instance and create an <b>instance swap</b> property named <code>Icon</code>. Set preferred values to your icon set.','Select the label and create a <b>text</b> property named <code>Label</code>.','Drag an instance into a screen and check that every property appears and nothing needs a detach.'])}</div>
    <div class="panel"><h2>Naming</h2>${list(['Use the same names in Figma and code: <code>Style</code> ↔ <code>kind</code> or <code>style</code>, <code>Primary</code> ↔ <code>.primary</code>. Agree on the list once with the designer.','Slash names group components in the assets panel: <code>Button/Primary</code>, <code>Icon/Plus</code>.','Property values in Title Case, booleans phrased as questions or “Show …”.','Avoid names that describe looks (<code>Green button</code>). Looks change; roles do not.'])}</div>
    <div class="panel"><h2>Good and bad</h2>${list(['<b>Bad:</b> a variant for every label (“Add”, “Buy now”, “Checkout”). <b>Good:</b> one text property.','<b>Bad:</b> icon on and icon off as variants, doubling the set. <b>Good:</b> a boolean.','<b>Bad:</b> detached instances on screens. They stop updating and look like one-off designs to the developer.','<b>Bad:</b> a product card with the price baked in. <b>Good:</b> text properties for title, unit and price, and a nested Add button instance.'])}</div>

    <div class="panel"><h2>Engineering implications</h2>${list(['The property list is a draft API. Review it before the component is used on forty screens, as you would review a public interface.','A component set with a missing combination (Ghost + Loading, say) is an undefined state in code. Ask rather than guess.','If Code Connect or a similar mapping is set up in the file, Dev Mode can show your real component call for an instance. Check your team’s plan and setup before relying on it.','When the Figma component and the code component disagree, fix the names first; most handoff mistakes start there.'])}</div>
    <div class="panel"><h2>Exercise</h2><p>Open a product card in a file you are implementing. Write down its properties and their kinds. Then write the constructor or initialiser you would give that component in code, and note every place the two lists differ. Take those differences to the designer.</p></div>
  </section>
  ${quiz('components',[{q:'A button needs an optional leading icon. Which property keeps the component set smallest?',o:['A variant: Icon = Yes / No','A boolean property on the icon layer','A second component called Button With Icon'],a:1,why:'A boolean toggles a layer inside each variant, so the number of variants does not double.'},{q:'You edit the main component’s corner radius. An instance has a text override. What happens to that instance?',o:['Nothing changes; overrides freeze the instance','The radius updates and the text override stays','The text resets to the main component’s label'],a:1,why:'An override replaces only the property it touches. Everything else still follows the main component.'},{q:'Figma has State = Pressed as a variant. What is the right code equivalent?',o:['A pressed: Bool parameter the caller sets','Runtime interaction state read inside the component’s style','A separate PressedButton component'],a:1,why:'Callers never set pressed. The platform reports it while the finger is down.'}])}
  <section class="panel"><h2>Interview questions</h2>${qa([['When would you use a variant instead of a boolean property?','When the change affects structure or several layers at once, such as a different layout per size. A boolean is for showing or hiding one layer.'],['What happens when an instance is detached?','It becomes ordinary layers with no link to the main component, so it stops receiving updates. It is sometimes done to explore, but shipping screens should not contain detached copies of system components.'],['A design uses a button combination that does not exist in the component set. What do you do?','Treat it as a question, not a spec. Either the set is missing a variant, which is a design system change, or the screen is wrong. Building a one-off in code hides the problem.']])}</section>
  ${doneBtn('components')}</div>`;
