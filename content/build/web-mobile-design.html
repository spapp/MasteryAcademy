V.gestures=()=>{
  main.innerHTML=`<div class="wrap">${head('Module 25','Gestures and navigation','Gestures are the fastest controls on a phone and the least visible. Nothing on screen says “swipe me”. Designing them well means deciding what each touch means, making it discoverable, and always leaving another way to do the same thing.')}
  <section class="cols"><div class="panel"><h2>The standard set</h2>${list(['<b>Tap:</b> activate. The only gesture every user knows to try.','<b>Double tap:</b> zoom or like. Costs a delay on single tap, because the system must wait to see if a second tap comes.','<b>Long press:</b> secondary actions, context menus, reorder.','<b>Swipe:</b> a quick flick with direction. Row actions, dismiss, next page.','<b>Drag:</b> the content follows the finger. Sliders, sheets, reordering.','<b>Pinch and rotate:</b> two fingers. Maps and images.','<b>Edge swipe:</b> starts at the screen edge. Mostly owned by the system: back, home, app switcher.','<b>Pull to refresh:</b> drag down at the top of a list.'])}</div>
  <div class="panel"><h2>The problem with gestures</h2>${list(['<b>Invisible.</b> A swipe action nobody finds is a feature nobody has.','<b>Easy to trigger by accident,</b> especially near edges and in scrolling lists.','<b>Unequal.</b> Not everyone can swipe, pinch or hold. Screen reader and switch users cannot perform path gestures the same way.','<b>Contested.</b> The same drag could be a scroll, a row swipe, a carousel or the system back gesture.','So the rule: a gesture is a shortcut. The visible control is the real interface.'])}</div></section>
  <section class="panel"><h2>What the recogniser sees</h2><p>Touch the pad: tap, double tap, hold, swipe or drag. The system decides which gesture it was from three numbers: how far the finger moved, for how long, and how fast. Change the thresholds and try the same touch again.</p>
  <div class="split"><div class="plain">${rng(G,'lp','Long press after',200,1000,50,' ms')}${rng(G,'slop','Touch slop (movement still counted as “not moved”)',2,40,1,' px')}<p class="note">Slop is why a slightly shaky tap is still a tap. Platform defaults are small (around 8 to 10 points) with a long-press time of about half a second; exact values are from memory.</p><div><b id="gname" style="font:700 22px var(--f-display)">Waiting for a touch</b><p id="gwhy" style="color:var(--ink-2)">Nothing recognised yet.</p></div><ol id="glog" style="margin:0;padding-left:20px;font:12px/1.7 var(--f-mono);color:var(--ink-2)"></ol></div>
   <div class="plain"><div id="gpad" style="position:relative;height:230px;border-radius:12px;background:var(--surface-2);border:1.5px dashed var(--ink-2);touch-action:none;user-select:none;-webkit-user-select:none;cursor:pointer;overflow:hidden;display:grid;place-items:center"><span style="color:var(--ink-2);pointer-events:none;text-align:center;padding:0 12px">Tap, double tap, hold, swipe or drag here</span><i id="gdot" style="position:absolute;left:0;top:0;width:30px;height:30px;margin:-15px 0 0 -15px;border-radius:50%;background:var(--accent);opacity:0;pointer-events:none"></i></div>${simNote}</div></div></section>
  <section class="panel"><h2>Who gets the touch?</h2><p>When a finger lands, several recognisers are listening. This is roughly the order in which the question is settled.</p>
  ${fc(720,275,[{id:'a',x:58,y:50,t:'Touch|down',s:'p',w:84},{id:'b',x:190,y:50,t:'Moved past|slop?',s:'d',w:120,h:66},{id:'c',x:345,y:50,t:'Started at|screen edge?',s:'d',w:126,h:66},{id:'e',x:500,y:50,t:'Mostly|horizontal?',s:'d',w:118,h:66},{id:'f',x:650,y:50,t:'Row swipe|or carousel',w:104},{id:'g',x:345,y:155,t:'System back|gesture',w:104},{id:'h',x:500,y:155,t:'Vertical|scroll'},{id:'i',x:190,y:155,t:'Held long|enough?',s:'d',w:116,h:62},{id:'j',x:58,y:155,t:'Long press',w:84},{id:'k',x:190,y:245,t:'Tap'}],[{a:'a',b:'b'},{a:'b',b:'c',l:'yes'},{a:'c',b:'e',l:'no'},{a:'e',b:'f',l:'yes'},{a:'c',b:'g',l:'yes'},{a:'e',b:'h',l:'no'},{a:'b',b:'i',l:'no'},{a:'i',b:'j',l:'yes'},{a:'i',b:'k',l:'no'}])}
  <p>Two things follow. A horizontal carousel inside a vertically scrolling page works because the axis decides. A horizontal carousel that reaches the screen edge fights the back gesture, and the system usually wins.</p></section>
  <section class="panel"><h2>Swipe to remove, done properly</h2><p>Drag a row to the left. Let go before 40% and it springs back; past 40% it is removed, with Undo. Then turn off the visible button and ask how a new user would discover this.</p>
  <div class="split"><div class="plain">${chk(G,'alt','Show a visible remove button on each row')}<div class="row"><button type="button" class="btn" id="greset">Restore rows</button></div><ul class="audit" id="gaud"></ul></div>
   <div class="plain"><div class="stage"><div class="device" style="width:290px;padding:14px 12px;display:flex;flex-direction:column;gap:8px;font-size:13px"><b style="font:700 18px var(--f-display)">Basket</b><div id="grows" style="display:flex;flex-direction:column;gap:8px;min-height:140px"></div><div id="gundo" role="status" style="min-height:34px"></div></div><small>Drag with a mouse or a finger</small></div></div></div></section>
  <section class="panel"><div class="row" style="justify-content:space-between"><h2>The same row in code</h2>${seg(G,'tab',[['swiftui','SwiftUI'],['compose','Compose'],['flutter','Flutter']])}</div><div id="gcode"></div><p class="note">Not compiled here. Each one includes the non-gesture route for assistive technology.</p></section>
  <section class="panel"><h2>The thumb zone</h2><div class="split"><div class="plain">${seg(G,'hand',[['right','Right hand'],['left','Left hand']])}<p>Held in one hand, a large phone has an easy arc near the bottom corner on the thumb’s side and a hard corner diagonally opposite. That is why primary actions and tab bars sit at the bottom, and why a Back button in the top-leading corner needs a gesture as its partner.</p><p class="note">An approximation for teaching. Real reach depends on hand size, phone size and grip, and many people use two hands. The zones are labelled, not only coloured.</p></div><div class="stage"><div id="gthumb"></div><small>One-handed reach</small></div></div></section>
  <section class="panel"><h2>System gestures you must not fight</h2><div class="tablewrap"><table><thead><tr><th></th><th>iOS</th><th>Android (gesture navigation)</th></tr></thead><tbody>
  <tr><td>Back</td><td>Swipe from the leading edge inside a navigation stack; drag a sheet down to dismiss</td><td>Swipe inward from the left or right edge; recent versions can preview the destination during the swipe (predictive back)</td></tr>
  <tr><td>Home</td><td>Swipe up from the bottom edge</td><td>Swipe up from the bottom edge</td></tr>
  <tr><td>App switcher</td><td>Swipe up and pause</td><td>Swipe up and hold</td></tr>
  <tr><td>System panels</td><td>Notifications from the top; Control Centre from the top-trailing corner</td><td>Notifications and quick settings from the top</td></tr>
  <tr><td>If you need the edge</td><td><code>.defersSystemGestures(on:)</code> asks for a second swipe before the system acts</td><td><code>Modifier.systemGestureExclusion()</code> for small areas; read gesture insets before placing draggable controls</td></tr></tbody></table></div>
  <p class="note">From memory; confirm against current platform docs. In Flutter, <code>MediaQuery.systemGestureInsetsOf(context)</code> reports the areas the system claims.</p></section>
  <section class="panel"><h2>Gesture to code</h2><div class="tablewrap"><table><thead><tr><th>Gesture</th><th>SwiftUI</th><th>Compose</th><th>Flutter</th></tr></thead><tbody>
  ${[['Tap','Button, .onTapGesture','Modifier.clickable','InkWell, GestureDetector(onTap:)'],['Long press','.contextMenu, .onLongPressGesture','Modifier.combinedClickable(onLongClick =)','onLongPress:'],['Drag','DragGesture()','pointerInput { detectDragGestures }, Modifier.draggable','onPanUpdate:, Draggable'],['Row swipe','.swipeActions','SwipeToDismissBox','Dismissible'],['Pull to refresh','.refreshable','PullToRefreshBox','RefreshIndicator'],['Pinch','MagnifyGesture()','detectTransformGestures','InteractiveViewer, onScaleUpdate:'],['Back','NavigationStack handles it','BackHandler, PredictiveBackHandler','PopScope']].map(r=>'<tr>'+r.map((c,i)=>'<td>'+(i?'<code>'+esc(c)+'</code>':c)+'</td>').join('')+'</tr>').join('')}</tbody></table></div><p class="note">Names from memory; some were renamed in recent releases (for example the pinch gesture in SwiftUI and pull-to-refresh in Material 3).</p></section>
  <section class="cols">
   <div class="panel"><h2>Accessibility</h2>${list(['WCAG asks that anything done with a path or multi-finger gesture can also be done with a single tap, and that dragging has a non-drag alternative.','Expose row actions as accessibility custom actions so VoiceOver and TalkBack users can reach them.','Do not put the only route to an action behind a long press.','Targets still need 44 pt or 48 dp, including the handles of sheets and sliders.','Prefer Undo over “Are you sure?” for reversible actions. It is faster for everyone and safer for accidental swipes.'])}</div>
   <div class="panel"><h2>Making gestures discoverable</h2>${list(['Show part of the next item at the edge of a carousel.','A grabber on a sheet. A handle on a reorderable row.','A visible button that does the same thing; people learn the swipe later.','A one-time hint animation, not a tutorial overlay.','Follow the platform: users already expect swipe-to-delete in lists and pull-to-refresh at the top.'])}</div>
   <div class="panel"><h2>Good and bad</h2>${list(['<b>Bad:</b> swipe left to delete and swipe right to add, with no buttons.','<b>Good:</b> buttons for both; swipe as an accelerator.','<b>Bad:</b> a custom drawer opened by an edge swipe on iOS, where that edge means Back.','<b>Bad:</b> a destructive full swipe with no undo.','<b>Bad:</b> a map inside a scrolling page that traps the scroll. <b>Good:</b> require two fingers on the map or give it its own screen.'])}</div>
   <div class="panel"><h2>Engineering implications</h2>${list(['Nested scrollables need a rule for who scrolls first. Test the inner one at its limits.','Gesture-driven motion should track the finger one to one, then hand its velocity to a spring on release.','Cancel is a real outcome: an incoming call or a system gesture ends your drag without a normal release.','On Android, back must work from every screen; with predictive back, opt in and test custom transitions.','Gestures are hard to cover in UI tests. Keep the logic (threshold reached, action fired) testable without the touch.'])}</div>
   <div class="panel"><h2>In Figma</h2>${list(['Prototypes offer a drag trigger and tap-like triggers; most other gestures cannot be expressed and need an annotation.','Ask for each gesture: threshold, what happens on partial drag, the visible alternative, and the accessibility action name.','A static frame of a half-swiped row is worth more than a paragraph.'])}</div>
   <div class="panel"><h2>Exercise</h2><p>List every gesture in one flow of your app beyond tap. For each write: how a new user would discover it, the visible alternative, what VoiceOver or TalkBack exposes, and what it conflicts with. Any row with an empty cell is a finding.</p></div></section>
  ${quiz('gestures',[{q:'Why does enabling double tap on an element make its single tap feel slower?',o:['Double tap uses more memory','The system must wait to see whether a second tap arrives before acting on the first','Single taps are disabled'],a:1,why:'The recogniser cannot know a tap is single until the double-tap window has passed.'},{q:'A basket row can be removed only by swiping. What is the main problem?',o:['Swipes are slow','It is undiscoverable and unavailable to people who cannot perform the swipe','It uses too much battery'],a:1,why:'A gesture should be a shortcut to something that also has a visible, single-tap route.'},{q:'Your full-width image carousel conflicts with the iOS back swipe. Best fix?',o:['Disable the back gesture on that screen','Inset the carousel’s drag area from the edge, or let the page indicator and taps move it','Make users long-press before swiping'],a:1,why:'The edge belongs to the system. Keep custom horizontal drags away from it and offer another way to page.'}])}
  <section class="panel"><h2>Interview questions</h2>${qa([['How does a scroll view inside a swipeable row decide which gesture wins?','After the finger passes the touch slop, the dominant axis decides: vertical movement goes to the scroll view, horizontal to the row. Recognisers can also require another to fail first, or run simultaneously if told to.'],['When is a confirmation dialog better than undo?','When the action cannot be reversed or has consequences outside the app: placing an order, deleting an account, sending money. For reversible changes undo is faster and safer.'],['How would you support Android predictive back in a custom flow?','Opt in, route back handling through the platform’s back APIs so the system can preview, make custom transitions follow the gesture progress, and make sure in-app state (unsaved form, open sheet) is handled before navigation.']])}</section>
  ${doneBtn('gestures')}</div>`;
  const live=id=>document.getElementById(id),pad=live('gpad'),dot=live('gdot');let p=null,lpT=null,lastUp=0;
  const say=(n,w,quiet)=>{live('gname').textContent=n;live('gwhy').textContent=w;if(!quiet){G.log.unshift(n+' · '+w);G.log=G.log.slice(0,5);live('glog').innerHTML=G.log.map(l=>'<li>'+l+'</li>').join('')}};
  const at=e=>{const r=pad.getBoundingClientRect();dot.style.transform=`translate(${e.clientX-r.left}px,${e.clientY-r.top}px)`;dot.style.opacity=.55};
  pad.addEventListener('pointerdown',e=>{try{pad.setPointerCapture(e.pointerId)}catch(x){}p={x:e.clientX,y:e.clientY,t:performance.now(),moved:false,lp:false};at(e);clearTimeout(lpT);lpT=setTimeout(()=>{if(p&&!p.moved){p.lp=true;say('Long press',`held ${G.lp} ms, moved less than the ${G.slop} px slop`)}},G.lp)});
  pad.addEventListener('pointermove',e=>{if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;at(e);if(!p.moved&&Math.hypot(dx,dy)>G.slop){p.moved=true;clearTimeout(lpT)}if(p.moved&&!p.lp)say('Dragging…',`${Math.round(dx)}, ${Math.round(dy)} px from where the finger landed`,true)});
  const end=e=>{if(!p)return;clearTimeout(lpT);dot.style.opacity=0;const now=performance.now(),dx=e.clientX-p.x,dy=e.clientY-p.y,dist=Math.hypot(dx,dy),dt=Math.max(1,now-p.t),v=dist/dt*1000;
    if(p.lp){}else if(!p.moved){if(now-lastUp<300){say('Double tap','second tap arrived within 300 ms of the first');lastUp=0}else{say('Tap',`${Math.round(dt)} ms, moved ${Math.round(dist)} px, inside the ${G.slop} px slop`);lastUp=now}}
    else{const dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'down':'up');v>450?say('Swipe '+dir,`${Math.round(dist)} px in ${Math.round(dt)} ms, about ${Math.round(v)} px/s`):say('Drag '+dir,`${Math.round(dist)} px at about ${Math.round(v)} px/s, too slow to count as a swipe`)}p=null};
  pad.addEventListener('pointerup',end);pad.addEventListener('pointercancel',()=>{if(p){clearTimeout(lpT);dot.style.opacity=0;say('Cancelled','the system took the touch away');p=null}});
  const box=live('grows');let s=null;
  const rows=()=>{box.innerHTML=G.rows.map((r,i)=>`<div data-row="${i}" style="position:relative;overflow:hidden;border-radius:8px;background:#B3261E;touch-action:pan-y;user-select:none;-webkit-user-select:none"><span data-lab style="position:absolute;right:10px;top:0;bottom:0;display:flex;align-items:center;color:#fff;font-weight:700;font-size:12px">Remove</span><div data-front style="background:var(--m-card);padding:6px 6px 6px 10px;min-height:44px;display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:grab"><span>${r}</span>${G.alt?`<button type="button" data-del="${i}" aria-label="Remove ${r}" style="border:0;background:transparent;color:var(--m-mute);width:44px;height:36px;font-size:15px;cursor:pointer;border-radius:6px">✕</button>`:''}</div></div>`).join('')||'<span style="color:var(--m-mute)">Basket is empty.</span>';
    live('gundo').innerHTML=G.undo?`<div style="background:var(--m-ink);color:var(--m-bg);border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px"><span>Removed ${G.undo.t.split(' · ')[0]}</span><button type="button" id="gundob" style="border:0;background:transparent;color:inherit;font-weight:700;text-decoration:underline;cursor:pointer;padding:4px">Undo</button></div>`:'';
    const r=(ok,t)=>`<li><span class="st ${ok?'ok':'no'}">${ok?'GOOD':'ISSUE'}</span><div>${t}</div></li>`;
    live('gaud').innerHTML=r(G.alt,G.alt?'Each row has a visible, tappable remove button. The swipe is a shortcut.':'Swipe is the only way to remove. A new user has no clue, and someone who cannot swipe has no route.')+r(true,'The row follows the finger and springs back below the threshold, so a stray swipe costs nothing.')+r(true,'Removal offers Undo instead of asking for confirmation first.')};
  const remove=i=>{G.undo={i,t:G.rows[i]};G.rows.splice(i,1);rows()};
  box.addEventListener('pointerdown',e=>{if(e.target.closest('[data-del]'))return;const row=e.target.closest('[data-row]');if(!row)return;try{box.setPointerCapture(e.pointerId)}catch(x){}s={row,front:row.querySelector('[data-front]'),lab:row.querySelector('[data-lab]'),x:e.clientX,y:e.clientY,w:row.offsetWidth,act:false,dx:0}});
  box.addEventListener('pointermove',e=>{if(!s)return;const dx=e.clientX-s.x,dy=e.clientY-s.y;if(!s.act){if(Math.hypot(dx,dy)<G.slop)return;if(Math.abs(dy)>Math.abs(dx)){s=null;return}s.act=true;s.front.style.transition='none'}s.dx=Math.min(0,dx);s.front.style.transform=`translateX(${s.dx}px)`;s.lab.textContent=-s.dx>s.w*.4?'Release to remove':'Remove'});
  const rel=()=>{if(!s)return;const t=s;s=null;if(t.act&&-t.dx>t.w*.4)remove(+t.row.dataset.row);else{t.front.style.transition='transform .2s ease-out';t.front.style.transform=''}};
  box.addEventListener('pointerup',rel);box.addEventListener('pointercancel',rel);
  const upd=()=>{rows();live('gthumb').innerHTML=thumbZone();live('gcode').innerHTML=code(gestCode())};
  bind(G,k=>{if(k==='lp'||k==='slop')return;upd()},e=>{const d=e.target.closest('[data-del]');if(d){remove(+d.dataset.del);return}
    if(e.target.id==='gundob'&&G.undo){G.rows.splice(G.undo.i,0,G.undo.t);G.undo=null;rows()}
    if(e.target.id==='greset'){G.rows=['Alphonso Mango · 1 kg','Toned Milk · 500 ml','Brown Eggs · 6 pcs'];G.undo=null;rows()}});
  upd();
};

V.figma2=()=>{
  main.innerHTML=`<div class="wrap">${head('Module 11','Figma, the next layer','The features that turn a file of screens into a system: styles, layout grids, effects, image fills, and libraries that push changes into every file that uses them. Components have their own lesson.')}
  <p class="note">The panels below are an educational simulator, not the Figma editor.</p>
  <section class="panel"><h2>Styles: name a look once, use it everywhere</h2><p>A style is a saved set of properties with a name. Four of the five text layers below use the style <code>Title/Medium</code>. Edit the style and they all follow. The fifth was typed by hand to look the same.</p>
  <div class="split"><div class="plain"><div class="ctlgrp"><b>Edit the style Title/Medium</b>${rng(I,'ts','Size',14,28,1)}${seg(I,'tw',[['500','Medium'],['600','Semibold'],['700','Bold']])}<label class="check"><input type="color" id="c-tc" data-k="tc" value="${I.tc}">Colour</label></div><p class="note" id="istyle"></p></div>
   <div class="stage"><div class="device" style="width:260px;padding:14px;display:flex;flex-direction:column;gap:10px" id="isty"></div></div></div>
  <div class="tablewrap"><table><thead><tr><th></th><th>Style</th><th>Variable</th></tr></thead><tbody><tr><td>Holds</td><td>A bundle: a text style is font, size, weight, line height and spacing together; an effect style is a set of shadows</td><td>One value: a colour, a number, a string or a boolean</td></tr><tr><td>Modes</td><td>No</td><td>Yes: light and dark, brands, densities</td></tr><tr><td>Kinds</td><td>Text, colour, effect, layout grid</td><td>Colour, number, string, boolean</td></tr><tr><td>In code</td><td>A text style or a shadow preset in your theme</td><td>A token</td></tr><tr><td>Together</td><td colspan="2">A text style can take its size from a number variable, and a colour style can point at a colour variable.</td></tr></tbody></table></div></section>
  <section class="panel"><h2>Layout grids: the invisible columns</h2><p>A layout grid is a guide on a frame. Designers place content on its columns so screens share margins and rhythm. It never exports; it shows up in your code as a screen margin and a gap.</p>
  <div class="split"><div class="plain">${rng(I,'cols','Columns',2,6,1)}${rng(I,'mar','Margin',8,32,2)}${rng(I,'gut','Gutter',4,24,2)}${rng(I,'gw','Frame width',300,430,10)}${chk(I,'showg','Show grid')}<div class="tablewrap"><table><tbody id="igt"></tbody></table></div></div>
   <div class="stage"><div class="device" id="igrid" style="padding:0;position:relative;overflow:hidden;border-radius:18px"></div><small>Type “stretch”: columns flex with the frame; margin and gutter stay fixed</small></div></div>
  ${list(['<b>Columns</b> for horizontal structure, <b>rows</b> for vertical rhythm, a square <b>grid</b> for pixel alignment (an 8-point square grid is common).','A phone layout often uses 4 columns; tablets 8 or 12. Treat these as conventions, not rules.','In code: margin becomes the screen’s horizontal padding, gutter becomes the gap in your grid or row, and a card that spans two of four columns is half the content width minus half a gutter. You do not compute columns by hand; a lazy grid or flex layout does it.'])}</section>
  <section class="panel"><h2>Libraries: how a change reaches every file</h2><p>A library is a file whose components, styles and variables are published for other files to use. Changes do not flow instantly: they are published, then each consuming file accepts them. Walk through it.</p>
  ${fc(720,100,[{id:'a',x:70,y:50,t:'Edit main|component',s:'p',w:108},{id:'b',x:215,y:50,t:'Publish|library'},{id:'c',x:360,y:50,t:'“Update|available”',w:104},{id:'d',x:505,y:50,t:'Review the|changes'},{id:'e',x:650,y:50,t:'Instances|update',s:'p'}],[{a:'a',b:'b'},{a:'b',b:'c'},{a:'c',b:'d'},{a:'d',b:'e'}])}
  <div class="cols"><div class="panel"><h3>Library file</h3><div class="stage" style="padding:20px 8px" id="ilibA"></div><div class="row"><button type="button" class="btn" id="iedit">Edit the main button</button><button type="button" class="btn" id="ipub">Publish</button></div></div>
   <div class="panel"><h3>Your screen file</h3><div class="stage" style="padding:20px 8px" id="ilibB"></div><div class="row"><button type="button" class="btn" id="iacc">Review and update</button><button type="button" class="btn" id="irst">Start again</button></div></div></div>
  <p id="ilibmsg"></p>
  ${list(['An instance override (the second button’s label here) survives the update.','A <b>detached</b> instance never gets the update. That is why detaching is costly.','For you: when a design “changed overnight”, check whether a library update was accepted. The version history shows it.','The code equivalent is a dependency bump: the design library released, and each app decides when to take it.'])}</section>

  <p class="note">Not compiled here. Android’s elevation shadows are drawn by the system from a light source, so their shape and darkness are not fully yours to set. Agree on elevation levels with design instead of copying blur values. Shadows also cost rendering time in long lists.</p></section>
  <section class="cols"><div class="panel"><h2>Image fills</h2><p>An image in Figma is a fill on a shape, with a mode that says what happens when the shape and the picture have different proportions.</p>${seg(I,'fit',[['fill','Fill'],['fit','Fit'],['stretch','Stretch']])}<div class="stage" style="padding:12px"><div id="ifit"></div></div><p id="ifitw" style="font-size:13.5px"></p></div>
  <div class="panel"><h2>Clipping and masks</h2>${list(['<b>Clip content</b> on a frame hides anything outside its bounds. It is how rounded cards crop their images.','A <b>mask</b> uses one layer’s shape to reveal the layers above it.','In code both are a clip: <code>.clipShape</code>, <code>Modifier.clip</code>, <code>ClipRRect</code>.','A frame without Clip content may show overflow in Figma that your clipped view will hide. Ask which is intended.'])}</div>
  <div class="panel"><h2>Plugins and widgets</h2>${list(['<b>Plugins</b> run inside a file and automate work: contrast checkers, icon sets, content generators, token exporters.','<b>Widgets</b> live on the canvas for everyone: voting, checklists, status boards.','A plugin can read the whole file, and some send data to a server. Check your company’s policy before running one on work files.','For developers the useful ones export tokens, check accessibility and map components to code.'])}</div></section>
  <section class="cols"><div class="panel"><h2>Common mistakes</h2>${list(['Text that looks like a style but is not one. It will not follow the next change.','Colour styles and colour variables both in use, for the same things.','A layout grid on some screens and not others, so margins drift.','Accepting a library update without reviewing it, then finding forty screens moved.','Copying a shadow’s numbers into code on Android and expecting a match.'])}</div>
  <div class="panel"><h2>What to check in a file you receive</h2>${list(['Select a text layer: is there a style name?','Select a filled layer: is there a variable or style on the fill?','Select a screen frame: is there a layout grid, and what are margin and gutter?','Open the assets panel: which libraries are attached?','Any instance showing a detached or overridden mark?'])}</div>
  <div class="panel"><h2>Exercise</h2><p>In real Figma: make text styles for title, body and caption and apply them to a screen. Add a 4-column grid with 16 margins. Put a button component in a second file, publish it as a library (on a plan that allows it), use it in the first file, change it, publish and accept the update. Note every step that surprised you.</p></div></section>
  ${quiz('figma2',[{q:'A designer changes the Title style and one heading on your screen does not change. Why?',o:['Figma is slow to sync','That heading was styled by hand and is not using the style','Styles only apply to new layers'],a:1,why:'Only layers that reference the style follow it. A look-alike set by hand is disconnected.'},{q:'A library’s button was changed yesterday but your file still shows the old one. What is the likely state?',o:['The library was edited but not published, or the update has not been accepted in your file','The file is corrupted','Instances never update'],a:0,why:'Changes travel in two steps: publish from the library, then accept in each consuming file.'},{q:'The design’s card shadow is X 0, Y 4, blur 12, spread 2. On Android with elevation, what do you do?',o:['Match every number exactly','Pick the closest elevation level and confirm it with design','Remove the shadow'],a:1,why:'Elevation shadows are system-drawn. Agree on levels; do not chase the exact blur and spread.'}])}

const ZDP={addon:['Pre-ticked add-on','<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" checked disabled> Add delivery protection · ₹29</label><div style="margin-top:8px"><b>To pay ₹337</b></div>','<label style="display:flex;gap:6px;align-items:center"><input type="checkbox" disabled> Add delivery protection · ₹29</label><div style="margin-top:8px"><b>To pay ₹308</b></div>','The default does the choosing. Most people do not change defaults, which is exactly why this works and why it is unfair. Honest version: off by default.'],shame:['Confirmshaming','<b>Get 10% off your first order?</b><div style="margin-top:8px;display:flex;flex-direction:column;gap:6px"><span style="background:#17703D;color:#fff;border-radius:8px;padding:8px;text-align:center;font-weight:700">Yes, sign me up</span><span style="text-align:center;color:var(--m-mute);font-size:11px">No, I like paying full price</span></div>','<b>Get 10% off your first order?</b><div style="margin-top:8px;display:flex;flex-direction:column;gap:6px"><span style="background:#17703D;color:#fff;border-radius:8px;padding:8px;text-align:center;font-weight:700">Sign up</span><span style="text-align:center;border:1px solid var(--m-mute);border-radius:8px;padding:7px">Not now</span></div>','The decline option is written to make the user feel foolish, and is styled to be missed. Honest version: neutral words and a visible button.'],urgent:['Fake urgency','<b>Alphonso Mango · ₹249</b><div style="color:#B3261E;font-weight:700;margin-top:6px">Only 2 left! Offer ends in 04:59</div><div style="color:var(--m-mute);font-size:11px">(the timer restarts every visit)</div>','<b>Alphonso Mango · ₹249</b><div style="margin-top:6px">In stock · offer valid until Sunday</div>','Scarcity and loss aversion push people to act fast. If the scarcity is invented it is a lie. Honest version: real stock and a real end date, or nothing.'],cost:['Hidden cost at the last step','<div style="display:flex;justify-content:space-between"><span>Items</span><span>₹278</span></div><div style="display:flex;justify-content:space-between;color:#B3261E"><span>Handling (new on this screen)</span><span>₹35</span></div><div style="display:flex;justify-content:space-between;font-weight:700"><span>To pay</span><span>₹313</span></div>','<div style="color:var(--m-mute);font-size:11px">Shown from the basket onwards:</div><div style="display:flex;justify-content:space-between"><span>Items</span><span>₹278</span></div><div style="display:flex;justify-content:space-between"><span>Handling</span><span>₹35</span></div><div style="display:flex;justify-content:space-between;font-weight:700"><span>To pay</span><span>₹313</span></div>','A fee that appears only at payment exploits the effort already spent (sunk cost). Honest version: every charge visible from the first total.']};
V.psych=()=>{
  main.innerHTML=`<div class="wrap">${head('Module 6','Design psychology','A handful of findings about attention, memory and decision-making explain most design rules. Two of them you can measure on yourself in this lesson, in under a minute each.')}
  <section class="panel"><h2>Fitts’s Law: bigger and closer is faster</h2><p>Tap <b>Start</b>, then tap the target as fast as you can. Six rounds with different sizes and distances. Your times are plotted against how hard each target was to hit.</p>
  <div id="zfit" style="position:relative;height:150px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none"></div>
  <div class="cols" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))"><div id="zfitres" class="plain"></div><div class="plain">${list(['Time grows with the <b>index of difficulty</b>, log₂(distance ÷ width + 1). Halving a target’s size costs about as much as doubling its distance.','This is why primary actions are full-width at the bottom, why 44 pt and 48 dp minimums exist, and why a tiny ✕ in the far corner is slow and error-prone.','Screen edges help with a mouse but not with a thumb: a finger cannot be “stopped” by the bezel.'])}</div></div>
  <p class="note">An informal demo, not a controlled experiment. A mouse, a trackpad and a thumb give different numbers.</p></section>
  <section class="panel"><h2>Hick’s Law: more choices, slower decisions</h2><p>Press <b>Ready</b>, read the word, then tap it in the grid. Eight rounds with 2, 4, 8 or 16 options.</p>
  <div id="zhk" class="plain" style="min-height:170px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);padding:14px;align-items:center;justify-content:center"></div>
  <div class="cols" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))"><div id="zhkres" class="plain"></div><div class="plain">${list(['Decision time rises with the logarithm of the number of options, so going from 2 to 4 costs about as much as going from 8 to 16.','It applies to choices among things you must read and compare. A long alphabetical list you can jump into is different.','In practice: show the last-used payment method plus “more”, not six methods; one primary action per screen; group and label long menus.'])}</div></div>
  <p class="note">This demo mixes searching with choosing, so it overstates the pure effect. The direction is what matters.</p></section>
  <section class="panel"><h2>How long is too long to wait?</h2><p>Set a delay and a kind of feedback, then press the button and notice how it feels.</p>
  <div class="split"><div class="plain">${rng(Z,'delay','Response delay',0,3000,100,' ms')}<div class="ctlgrp"><b>Feedback while waiting</b>${seg(Z,'fb',[['none','Nothing'],['press','Pressed state'],['prog','Progress']])}</div><p id="zdwhy"></p></div>
   <div class="stage" style="padding:30px 12px"><button type="button" id="zadd" style="border:0;border-radius:10px;background:#17703D;color:#fff;font-weight:700;padding:12px 24px;min-width:170px;cursor:pointer">Add to basket</button><small id="zdcap">Not pressed yet</small></div></div>
  <div class="tablewrap"><table><thead><tr><th>Delay</th><th>How it feels</th><th>What to do</th></tr></thead><tbody><tr><td>Up to about 100 ms</td><td>Instant. The user feels they caused it directly</td><td>Nothing extra; show the pressed state</td></tr><tr><td>Up to about 400 ms</td><td>Responsive. Attention holds (often called the Doherty threshold)</td><td>Pressed state is enough</td></tr><tr><td>Around 1 second</td><td>Noticeable. The flow of thought is interrupted</td><td>Show that something is happening</td></tr><tr><td>Several seconds</td><td>Attention drifts</td><td>Progress, a skeleton, or let the user carry on and finish in the background</td></tr></tbody></table></div><p class="note">The 0.1 s, 1 s and 10 s limits come from long-standing response-time research popularised by Jakob Nielsen; the figures are rules of thumb.</p></section>
  <section class="panel"><h2>Cognitive load and progressive disclosure</h2><p>Working memory holds only a few things at once, closer to four chunks than the often-quoted seven. Every visible option is something to read and reject. Progressive disclosure shows what most people need and keeps the rest one tap away.</p>
  <div class="row">${chk(Z,'pd','Use progressive disclosure')}</div><div class="split"><div class="stage"><div class="device" style="width:250px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:12px" id="zpd"></div></div><div class="plain" id="zpdw"></div></div></section>
  <section class="panel"><h2>Persuasion and where it becomes a dark pattern</h2><p>The same psychology that helps users can be turned against them. Pick a pattern, then switch to the honest version.</p>
  <div class="row">${seg(Z,'dp',Object.entries(ZDP).map(([k,v])=>[k,v[0]]))}${chk(Z,'honest','Show the honest version')}</div>
  <div class="split"><div class="stage"><div class="device" style="width:250px;padding:14px;font-size:12.5px;line-height:1.4" id="zdp"></div></div><div class="plain"><p id="zdpw"></p>${list(['A fair test: would the user be upset if they understood exactly what the screen was doing?','As the engineer you are often the last person to see it before it ships. Raising it is part of the job.','Several countries now regulate these patterns in consumer law; your legal or policy team will know which apply.'])}</div></div></section>
  <section class="panel"><h2>The short list worth knowing by name</h2><div class="tablewrap"><table><thead><tr><th>Principle</th><th>In plain words</th><th>In a shopping app</th></tr></thead><tbody>
  ${[['Jakob’s Law','People expect your app to work like the others they use','Basket icon top right or in the tab bar; swipe to delete in lists'],['Chunking (Miller)','Grouped information is easier to hold','98765 43210, not 9876543210; a one-time code in two groups'],['Serial position','First and last items are remembered best','Most important tabs at the two ends of the tab bar'],['Von Restorff (isolation)','The thing that differs gets noticed','One filled primary button among outlined ones'],['Goal gradient','Effort rises as the goal gets closer','“Add ₹21 more for free delivery” with a progress bar'],['Peak–end rule','An experience is judged by its peak and its end','A clear, pleasant order-confirmed screen'],['Zeigarnik effect','Unfinished tasks stay in mind','“Complete your profile”, a saved basket'],['Anchoring','The first number seen frames the rest','MRP struck through beside the selling price'],['Loss aversion','Losses weigh more than equal gains','“Your slot is held for 5 minutes”, only if true'],['Tesler’s Law','Complexity does not vanish; someone must absorb it','Detect the city from the pincode instead of asking for both'],['Postel’s Law','Accept input liberally, output it strictly','Take a phone number with spaces or +91 and clean it in code']].map(r=>'<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>').join('')}</tbody></table></div></section>
  <section class="cols"><div class="panel"><h2>Affordances and signifiers</h2>${list(['An <b>affordance</b> is what something lets you do. A <b>signifier</b> is the cue that tells you.','On a flat screen almost everything is tappable in principle, so signifiers do the work: a filled shape, an underline, a chevron, a shadow, a handle.','Missing signifier: a tappable card that looks like plain text. False signifier: bold blue text that is not a link.','Feedback closes the loop: after the tap, something must visibly change.'])}</div>
  <div class="panel"><h2>Error prevention beats error messages</h2>${list(['<b>Constrain:</b> a date picker cannot produce 31 February.','<b>Default well:</b> last address, last payment method.','<b>Confirm only the irreversible;</b> offer undo for everything else.','<b>Slips versus mistakes:</b> a slip is the right intention, wrong action (fat finger); a mistake is the wrong intention (misunderstood the screen). Slips need bigger targets and undo; mistakes need clearer design.'])}</div>
  <div class="panel"><h2>For the engineer</h2>${list(['Optimistic updates buy you the “instant” band: show the result, reconcile with the server after.','Target size is a psychology requirement, not a style choice. Enforce it in the component.','Defaults are decisions. A default in code that nobody chose is still a design.','Remember the last choice. Recognition is easier than recall, and re-entering is the most expensive option.'])}</div>
  <div class="panel"><h2>On each platform</h2>${list(['<b>iOS:</b> minimum 44 pt targets; system controls carry familiar signifiers and haptics for feedback.','<b>Android:</b> 48 dp targets; ripple gives immediate press feedback; Material components keep spacing between targets.','<b>Flutter:</b> Material widgets pad small controls to 48 by default; custom <code>GestureDetector</code>s do not, so check them.','Jakob’s Law applies per platform: users compare your app with other apps on the same phone.'])}</div>
  <div class="panel"><h2>Common misuse</h2>${list(['“Seven plus or minus two” used to cap menus at seven. It is about memory, not about how many items can be on a screen.','Hick’s Law used to justify hiding everything behind menus, which trades decision time for search time.','Citing a law to end a discussion. They are tendencies; test with real users.','Using persuasion principles without asking whether the user would agree if they saw how it worked.'])}</div>
  <div class="panel"><h2>Exercise</h2><p>Open your app’s checkout. Find one example each of: a default that helps the user, a default that helps the business, a place where Hick’s Law is respected, a target that Fitts’s Law would flag, and a wait with no feedback. For the weakest of the five, write the change you would propose and what it would cost to build.</p></div></section>
  ${quiz('psych',[{q:'A close button is 20 pt wide in the top corner of a tall sheet. Which law predicts it will be slow and error-prone?',o:['Hick’s Law','Fitts’s Law','Jakob’s Law'],a:1,why:'Small and far from the thumb means a high index of difficulty. Enlarge the hit area or add a swipe-down to dismiss.'},{q:'A payment screen shows six methods with equal weight. What does Hick’s Law suggest?',o:['Show the last-used method first and put the rest behind “more options”','Add icons to all six','Make all six smaller so they fit'],a:0,why:'Fewer visible choices means a faster decision; the rest stay one tap away.'},{q:'An add-on is ticked by default and raises the total. Why is this a dark pattern?',o:['Checkboxes are bad design','It relies on people not changing defaults, to make them pay for something they did not choose','It slows the screen down'],a:1,why:'It uses the default effect against the user. The honest version is unticked.'}])}
  <section class="panel"><h2>Interview questions</h2>${qa([['How would you apply Fitts’s Law to a mobile screen?','Put frequent and primary actions within easy thumb reach and make them large; keep destructive actions smaller or further away but still above the minimum target; give small visuals a larger hit area.'],['When does progressive disclosure hurt?','When the hidden thing is needed by most users, or when discovering it costs more than seeing it would have. Disclosure should follow frequency of use.'],['Where is the line between persuasion and a dark pattern?','Persuasion helps a user do what they already want, with true information. A dark pattern works only because the user does not notice or understand it: hidden costs, forced defaults, fake scarcity, obstructed cancellation.']])}</section>
  ${doneBtn('psych')}</div>`;
  const live=id=>document.getElementById(id);
  const fitDraw=()=>{const F=Z.fit,st=live('zfit'),W=st.clientWidth||600,av=W-110;let h=`<button type="button" id="zfs" style="position:absolute;left:14px;top:53px;width:54px;height:44px;border-radius:8px;border:1.5px solid var(--ink-2);background:var(--surface);cursor:pointer;font-weight:600">Start</button>`;
    if(F.i>=0&&F.i<6&&F.armed){const[w,d]=ZFT[F.i];h+=`<button type="button" id="zft" aria-label="Target" style="position:absolute;left:${41+d*av-w/2}px;top:${75-w/2}px;width:${w}px;height:${w}px;border-radius:50%;border:0;background:var(--accent);cursor:pointer"></button>`}
    h+=`<small style="position:absolute;right:10px;bottom:6px;font:11px var(--f-mono);color:var(--ink-2)">${F.i>=6?'Done. Press Start to run again.':F.armed?'Round '+(F.i+1)+' of 6: tap the dot':'Round '+(Math.max(0,F.i)+1)+' of 6: press Start'}</small>`;st.innerHTML=h;
    const R=F.res;if(!R.length){live('zfitres').innerHTML='<p style="color:var(--ink-2)">No rounds yet.</p>';return}
    const mx=Math.max(...R.map(r=>r.t),400),pt=R.map(r=>`<circle cx="${Math.min(284,36+Math.max(0,r.id-1)/4.5*248)}" cy="${130-r.t/mx*110}" r="5" style="fill:var(--accent)"/>`).join(''),s=R.slice().sort((a,b)=>a.id-b.id);
    live('zfitres').innerHTML=`<svg viewBox="0 0 300 160" width="100%" style="max-width:340px" role="img" aria-label="Time against index of difficulty"><line x1="30" y1="130" x2="290" y2="130" style="stroke:var(--line)"/><line x1="30" y1="15" x2="30" y2="130" style="stroke:var(--line)"/>${pt}<text x="160" y="152" text-anchor="middle" style="font:10px var(--f-mono);fill:var(--ink-2)">harder to hit →</text><text x="12" y="75" text-anchor="middle" transform="rotate(-90 12 75)" style="font:10px var(--f-mono);fill:var(--ink-2)">time →</text></svg><div class="tablewrap"><table><thead><tr><th>Size</th><th>Distance</th><th>Difficulty</th><th>Time</th></tr></thead><tbody>${s.map(r=>`<tr><td>${r.w}</td><td>${Math.round(r.d)}</td><td>${r.id.toFixed(2)}</td><td>${Math.round(r.t)} ms</td></tr>`).join('')}</tbody></table></div>${R.length>=6?`<p>Easiest target: <b>${Math.round(s[0].t)} ms</b>. Hardest: <b>${Math.round(s[5].t)} ms</b>. ${F.miss?F.miss+' missed tap'+(F.miss>1?'s':'')+', which small targets also cause.':''}</p>`:''}`};
  live('zfit').addEventListener('click',e=>{const F=Z.fit,id=e.target.id;
    if(id==='zfs'){if(F.i>=6||F.i<0){F.i=0;F.res=[];F.miss=0}F.armed=true;F.t0=performance.now();fitDraw();return}
    if(id==='zft'){const[w,d]=ZFT[F.i],D=d*((live('zfit').clientWidth||600)-110);F.res.push({w,d:D,id:Math.log2(D/w+1),t:performance.now()-F.t0});F.i++;F.armed=false;fitDraw();return}
    if(F.armed)F.miss++});
  const hkDraw=()=>{const H=Z.hk,st=live('zhk');
    if(H.i<0||H.i>=8||!H.armed)st.innerHTML=`<button type="button" class="btn primary" id="zhr">${H.i>=8?'Run again':'Ready'}</button><small style="font:11px var(--f-mono);color:var(--ink-2)">${H.i>=8?'Done.':'Round '+(Math.max(0,H.i)+1)+' of 8'}</small>`;
    else st.innerHTML=`<div>Find: <b style="font:700 20px var(--f-display)">${H.word}</b></div><div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%;max-width:420px">${H.opts.map(o=>`<button type="button" class="btn" data-hk="${o}" style="padding:8px 2px;font-weight:500">${o}</button>`).join('')}</div>`;
    const by={};H.res.forEach(r=>(by[r.n]=by[r.n]||[]).push(r.t));const ns=Object.keys(by).map(Number).sort((a,b)=>a-b);
    if(!ns.length){live('zhkres').innerHTML='<p style="color:var(--ink-2)">No rounds yet.</p>';return}
    const avg=n=>by[n].reduce((a,b)=>a+b,0)/by[n].length,mx=Math.max(...ns.map(avg));
    live('zhkres').innerHTML=ns.map(n=>`<div style="display:grid;grid-template-columns:86px minmax(0,1fr) 64px;gap:8px;align-items:center;font-size:13px"><span>${n} options</span><div style="height:14px;border-radius:7px;background:var(--surface-2);border:1px solid var(--line)"><i style="display:block;height:100%;border-radius:7px;background:var(--accent);width:${avg(n)/mx*100}%"></i></div><span style="font:12px var(--f-mono);text-align:right">${Math.round(avg(n))} ms</span></div>`).join('')+(H.i>=8?`<p>${H.err?H.err+' wrong tap'+(H.err>1?'s':'')+'. ':''}Compare 2 options with 16: that gap is what every extra choice on a screen costs.</p>`:'')};
  live('zhk').addEventListener('click',e=>{const H=Z.hk,o=e.target.dataset.hk;
    if(e.target.id==='zhr'){if(H.i>=8||H.i<0){H.i=0;H.res=[];H.err=0}const n=ZHN[H.i],pool=ZW.slice().sort(()=>Math.random()-.5).slice(0,n);H.opts=pool;H.word=pool[Math.floor(Math.random()*n)];H.armed=true;hkDraw();H.t0=performance.now();return}
    if(o&&H.armed){if(o===H.word){H.res.push({n:ZHN[H.i],t:performance.now()-H.t0});H.i++;H.armed=false;hkDraw()}else H.err++}});
  const misc=()=>{live('zdwhy').textContent=(Z.delay<=100?'Feels instant.':Z.delay<=400?'Feels responsive.':Z.delay<=1000?'You notice the wait.':'Long enough for attention to wander.')+' '+({none:Z.delay>300?'With no feedback the user cannot tell whether the tap registered, and often taps again.':'At this speed feedback hardly matters.',press:'The pressed state answers “did it register?” immediately, whatever the server does.',prog:'Progress tells the user the app is working. Worth it once the wait passes about a second.'})[Z.fb];
    const d=ZDP[Z.dp];live('zdp').innerHTML=d[Z.honest?2:1];live('zdpw').innerHTML=`<b>${d[0]}.</b> ${d[3]}`;
    const row=t=>`<div style="background:var(--m-card);border-radius:6px;padding:7px 9px;display:flex;justify-content:space-between"><span>${t}</span><span style="color:var(--m-mute)">›</span></div>`,all=['Sort by','Price range','Brand','Offers','Pack size','Rating','Organic','Country of origin','Delivery speed','New arrivals','Dietary','Seller','Availability','Shelf life'],shown=Z.pd?all.slice(0,4):all;
    live('zpd').innerHTML=`<b style="font:700 16px var(--f-display)">Filters</b>${shown.map(row).join('')}${Z.pd?'<div style="color:#17703D;font-weight:700;padding:4px 2px">More filters (10)</div>':''}`;
    live('zpdw').innerHTML=`<div class="meters"><div class="meter"><span>Options to read before acting</span><b>${shown.length}</b></div></div><p>${Z.pd?'The four filters most people use are visible. The rest are one tap away and cost nothing until wanted.':'Fourteen options of equal weight. Most users want one of the first four, but must scan all of them to be sure.'}</p><p class="note">Which four? Not a guess: usage data decides. Disclosure by frequency helps; disclosure by whim hides things people need.</p>`};
  let dt=null;
  bind(Z,misc,e=>{if(e.target.id!=='zadd')return;const b=e.target,cap=live('zdcap');clearTimeout(dt);b.textContent=Z.fb==='prog'?'Adding…':'Add to basket';b.style.opacity=Z.fb==='none'?1:.7;b.style.transform=Z.fb==='none'?'':'scale(.97)';cap.textContent=Z.fb==='none'?'…':'Working';
    dt=setTimeout(()=>{if(!document.body.contains(b))return;b.textContent='Added ✓';b.style.opacity=1;b.style.transform='';cap.textContent='Responded after '+Z.delay+' ms';dt=setTimeout(()=>{if(document.body.contains(b))b.textContent='Add to basket'},1200)},Z.delay)});
  Z.fit={i:-1,res:[],miss:0};Z.hk={i:-1,res:[],err:0};fitDraw();hkDraw();misc();
};

/* ---------- fifteen UI design styles ---------- */
const SYS={k:'min'};
const SY=[
{k:'min',n:'Minimalism',one:'Only what is needed, with space doing the work.',bg:'background:#FFFFFF',card:'padding:6px;color:#111',img:'background:#F4F4F4',ttl:'font:500 15px var(--f-body)',sub:'color:#777',price:'font-weight:500',btn:'border-bottom:1.5px solid #111;font-weight:500;padding:2px 0',c:['#111111','#FFFFFF','#111111','#FFFFFF','#111111'],tok:['Square or slight radius','None','One neutral, one accent at most','One family, two weights'],traits:['Generous whitespace','Very few colours','Hierarchy from size and position only'],use:'Content-first products: reading, finance, premium retail.',risk:'Controls can stop looking like controls. A text link with no shape needs a clear signifier.',code:'Cheapest to build. Spacing tokens matter more than anything else; get the scale right.'},
{k:'max',n:'Maximalism',one:'More is more: pattern, colour and type all at full volume.',bg:'background:repeating-linear-gradient(45deg,#FF5FA2 0 14px,#FFD23F 14px 28px,#3BCEAC 28px 42px)',card:'background:#FFF275;border:4px solid #6A0DAD;border-radius:18px;padding:12px;transform:rotate(-2deg);color:#3D0066',img:'background:radial-gradient(circle,#FF9F1C,#FF5FA2);border-radius:50% 20% 50% 20%',ttl:'font:italic 700 18px Georgia,serif',sub:'color:#6A0DAD;font-weight:700',price:'font:700 17px var(--f-display);background:#3BCEAC;padding:0 6px;border-radius:4px',btn:'background:#6A0DAD;color:#FFF275;font-weight:700;padding:6px 14px;border-radius:999px;border:2px dashed #FFF275',c:['#3D0066','#FFF275','#FFF275','#6A0DAD'],tok:['Mixed, irregular','Layering and overlap','Many saturated hues','Several families together'],traits:['Clashing colour on purpose','Patterns, stickers, rotation','Every area decorated'],use:'Campaigns, festivals, youth brands, a sale landing page.',risk:'High cognitive load. Hard to keep a clear primary action, and tiring in a tool people use daily.',code:'Many one-off assets and transforms. Hard to express as a small token set; budget for custom work per screen.'},
{k:'glass',n:'Glassmorphism',one:'Frosted, translucent panels floating over a colourful background.',bg:'background:radial-gradient(circle at 20% 20%,#FF8FB1 0 25%,transparent 45%),radial-gradient(circle at 85% 75%,#7BDFF2 0 25%,transparent 45%),linear-gradient(135deg,#6A5AE0,#B15DFF)',card:'background:rgba(255,255,255,.2);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.45);border-radius:18px;padding:14px;color:#fff',img:'background:rgba(255,255,255,.22);border-radius:12px',ttl:'font:600 15px var(--f-body)',sub:'color:rgba(255,255,255,.8)',price:'font-weight:700',btn:'background:rgba(255,255,255,.3);border:1px solid rgba(255,255,255,.6);padding:5px 14px;border-radius:999px;font-weight:600',c:['#FFFFFF','#9B8AE8','#FFFFFF','#A99AEC','#CFC6F5'],tok:['Large radius','Background blur plus a light border','Translucent white over vivid colour','Clean sans, often white'],traits:['Background blur','Semi-transparent fill','Thin light border as an edge'],use:'Overlays, media controls, widgets, system-like surfaces.',risk:'Contrast depends on whatever is behind the panel, so it can pass on one screen and fail on the next.',code:'iOS: materials such as .ultraThinMaterial. Flutter: BackdropFilter. Android: blur needs API 31 or later, with a fallback. Blur is costly in scrolling lists.'},
{k:'neu',n:'Neumorphism',one:'Soft shapes pushed out of, or pressed into, a single-colour surface.',bg:'background:#E0E5EC',card:'background:#E0E5EC;border-radius:20px;padding:14px;box-shadow:8px 8px 16px #B8BEC9,-8px -8px 16px #FFFFFF;color:#4A5568',img:'border-radius:14px;box-shadow:inset 4px 4px 8px #B8BEC9,inset -4px -4px 8px #FFFFFF',ttl:'font:600 15px var(--f-body)',sub:'color:#8A94A6',price:'font-weight:700',btn:'padding:6px 16px;border-radius:12px;box-shadow:4px 4px 8px #B8BEC9,-4px -4px 8px #FFFFFF;font-weight:700;color:#4A5568',c:['#4A5568','#E0E5EC','#4A5568','#E0E5EC','#E0E5EC'],tok:['Large, soft radius','Two shadows: one light, one dark','One muted colour for everything','Quiet sans'],traits:['Element and background share one colour','Paired light and dark shadows','Pressed states use inset shadows'],use:'Small showcase pieces: a calculator, a smart-home control.',risk:'Buttons have almost no contrast against their surroundings, so people cannot tell what is tappable. The check on the right shows it.',code:'Needs two shadows per element. Fine in Flutter and CSS; awkward on Android where elevation gives one system shadow.'},
{k:'clay',n:'Claymorphism',one:'Puffy, rounded, toy-like shapes that look moulded from clay.',bg:'background:#FDE2E4',card:'background:#CDB4FF;border-radius:28px;padding:14px;box-shadow:0 14px 24px rgba(120,80,200,.35),inset 0 -6px 10px rgba(90,50,170,.25),inset 0 6px 10px rgba(255,255,255,.55);color:#2D1B55',img:'background:#FFE5A8;border-radius:20px;box-shadow:inset 0 -4px 6px rgba(0,0,0,.08),inset 0 4px 6px rgba(255,255,255,.6)',ttl:'font:700 15px var(--f-display)',sub:'color:#4B367C',price:'font-weight:700',btn:'background:#FF8FAB;color:#4A0F24;font-weight:700;padding:7px 16px;border-radius:999px;box-shadow:0 5px 8px rgba(200,60,100,.35),inset 0 -3px 4px rgba(160,30,70,.25),inset 0 3px 4px rgba(255,255,255,.5)',c:['#2D1B55','#CDB4FF','#4A0F24','#FF8FAB'],tok:['Very large radius','Outer shadow plus inner highlight and shade','Pastels','Rounded, friendly'],traits:['Inflated 3D look','Inner and outer shadows together','Pastel palette'],use:'Kids, education, onboarding illustrations, playful fintech.',risk:'Can read as childish for serious tasks. Inner shadows eat into space for text.',code:'Three shadows per element. Inner shadows are not native on Android or in SwiftUI before recent versions; often faked with gradients or images.'},
{k:'brut',n:'Brutalism',one:'Raw and undecorated, like an unstyled page from the early web.',bg:'background:#FFFFFF',card:'border:2px solid #000;padding:8px;color:#000;font-family:Courier New,monospace',img:'background:#C0C0C0;border:1px solid #000',ttl:'font:700 15px Courier New,monospace;text-transform:uppercase',sub:'color:#000',price:'font-weight:700',btn:'color:#0000EE;text-decoration:underline;font-weight:700',c:['#000000','#FFFFFF','#0000EE','#FFFFFF','#0000EE'],tok:['Zero radius','None','Black, white, default link blue','System or monospace'],traits:['Default fonts and colours','Visible structure, hard borders','No polish, on purpose'],use:'Art, fashion and portfolio sites that want to stand out.',risk:'Looks broken to many users. Trust matters in commerce, so it is rare there.',code:'Trivial to build, but it fights every platform component. Almost never used in native apps.'},
{k:'neob',n:'Neo-Brutalism',one:'Brutalism made friendly: thick outlines, hard shadows, bright flat colour.',bg:'background:#FFE66D',card:'background:#fff;border:3px solid #000;border-radius:10px;padding:12px;box-shadow:6px 6px 0 #000;color:#000',img:'background:#A0E7E5;border:3px solid #000;border-radius:6px',ttl:'font:700 16px var(--f-display)',sub:'color:#000',price:'font:700 16px var(--f-display)',btn:'background:#FF6B9D;border:3px solid #000;box-shadow:3px 3px 0 #000;padding:4px 14px;font-weight:700;border-radius:6px;color:#000',c:['#000000','#FFFFFF','#000000','#FF6B9D','#000000'],tok:['Small radius, thick stroke','Hard offset shadow, no blur','Bright flats with black','Bold grotesque'],traits:['Black outlines on everything','Solid shadow offset to one side','High contrast'],use:'Startups, creator tools, landing pages, playful products.',risk:'Heavy borders compete with content in dense screens. Contrast is usually excellent, which is its strength.',code:'Easy everywhere: a border and a second rectangle behind as the shadow. No blur, so it is cheap to render.'},
{k:'skeu',n:'Skeuomorphism',one:'Controls that imitate real materials and objects.',bg:'background:repeating-linear-gradient(90deg,#7A4B2A 0 6px,#8A5A36 6px 14px)',card:'background:linear-gradient(#FBF4E2,#EFE3C4);border-radius:10px;padding:12px;border:1px dashed #A38B5C;box-shadow:0 6px 12px rgba(0,0,0,.45),inset 0 1px 0 #fff;color:#3B2A14',img:'background:linear-gradient(#fff,#E9E2D0);border-radius:6px;box-shadow:inset 0 2px 5px rgba(0,0,0,.3)',ttl:'font:700 15px Georgia,serif;text-shadow:0 1px 0 #fff',sub:'color:#6B5637',price:'font:700 15px Georgia,serif',btn:'background:linear-gradient(#6FCB5F,#2E8B2E);color:#fff;font-weight:700;padding:6px 16px;border-radius:8px;border:1px solid #1F6A1F;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 2px 3px rgba(0,0,0,.4);text-shadow:0 -1px 0 rgba(0,0,0,.4)',c:['#3B2A14','#F5ECD3','#FFFFFF','#4EAB46','#1F6A1F'],tok:['Follows the real object','Gradients, bevels, highlights','Material textures','Often serif or engraved'],traits:['Textures such as wood, paper, leather','Glossy, bevelled buttons','Real-world metaphors'],use:'Music and audio tools, games, instruments, where the metaphor teaches the control.',risk:'Dates quickly and scales badly across screen sizes. Decoration can bury the content.',code:'Mostly image assets and layered gradients. Expensive to theme, to localise and to keep sharp at every density.'},
{k:'flat',n:'Flat Design',one:'No depth at all: solid colour, simple shapes, clear type.',bg:'background:#ECF0F1',card:'background:#FFFFFF;padding:12px;color:#2C3E50',img:'background:#F1C40F',ttl:'font:600 15px var(--f-body)',sub:'color:#7F8C8D',price:'font-weight:700',btn:'background:#2ECC71;color:#fff;font-weight:700;padding:6px 16px;border-radius:4px',c:['#2C3E50','#FFFFFF','#FFFFFF','#2ECC71'],tok:['Square or small radius','None','Solid, saturated blocks','Simple sans'],traits:['No shadows, gradients or textures','Colour blocks separate areas','Simple icons'],use:'Almost anything. It is the base most modern product UI grew from.',risk:'With no depth, it can be unclear what is tappable. Popular flat palettes also fail contrast with white text, as the check shows.',code:'The cheapest style to implement and to theme. Maps directly onto colour and spacing tokens.'},
{k:'mat',n:'Material Design',one:'Google’s system: flat surfaces arranged in layers with meaningful elevation and motion.',bg:'background:#F3EDF7',card:'background:#FFFBFE;border-radius:12px;padding:12px;box-shadow:0 1px 3px rgba(0,0,0,.3),0 4px 8px 3px rgba(0,0,0,.15);color:#1C1B1F',img:'background:#EADDFF;border-radius:8px',ttl:'font:500 16px Roboto,var(--f-body)',sub:'color:#49454F',price:'font-weight:500',btn:'background:#6750A4;color:#fff;font:500 14px Roboto,var(--f-body);padding:8px 20px;border-radius:999px',c:['#1C1B1F','#FFFBFE','#FFFFFF','#6750A4'],tok:['Defined shape scale','Elevation levels and tonal surfaces','Colour roles: primary, surface, on-surface','A fixed type scale'],traits:['A full system, not only a look','Elevation shows hierarchy','Colour roles and dynamic colour'],use:'Android apps, and cross-platform apps that want a ready-made, accessible system.',risk:'Can look generic if used with defaults. On iOS, unadapted Material controls feel foreign.',code:'Built in: Compose Material 3 and Flutter’s Material widgets. On iOS you would be rebuilding it.'},
{k:'bento',n:'Bento UI',one:'Content arranged in a grid of rounded tiles of different sizes, like a lunch box.',bg:'background:#EDEDF0',card:'background:#fff;border-radius:16px;padding:10px;color:#16181D',img:'background:#FBE9BD;border-radius:12px',ttl:'font:700 14px var(--f-body)',sub:'color:#6B7080',price:'font-weight:700',btn:'background:#17703D;color:#fff;border-radius:12px;padding:5px 12px;font-weight:700',c:['#16181D','#FFFFFF','#FFFFFF','#17703D'],tok:['Large radius on every tile','Flat or very light','Each tile its own tone','Big numbers, short labels'],traits:['Modular tiles in one grid','Each tile holds one idea','Tiles vary in size by importance'],use:'Dashboards, feature overviews, home screens, widgets.',risk:'Reading order is unclear when tiles are equal in weight. Needs a rule for how the grid reflows on narrow screens.',code:'A grid with items spanning rows and columns. Compose and Flutter need a staggered or custom grid; decide the phone layout first.'},
{k:'y2k',n:'Y2K Design',one:'Turn-of-the-millennium optimism: chrome, bubbles, gloss and candy colour.',bg:'background:linear-gradient(135deg,#C9F0FF,#F6C6FF 50%,#C6FFE0)',card:'background:linear-gradient(160deg,#FFFFFF,#D9E8FF 55%,#F3D1FF);border:2px solid #7AA7FF;border-radius:26px;padding:12px;box-shadow:0 0 0 3px #fff,0 8px 18px rgba(120,120,255,.4);color:#3A2E8C',img:'background:radial-gradient(circle at 30% 25%,#fff,#B8F1FF 45%,#7AA7FF);border-radius:40px',pre:'<div style="font-size:11px;color:#C2188F;font-weight:700">✦ fresh ✦ new ✦</div>',ttl:'font:700 16px var(--f-display);letter-spacing:.02em',sub:'color:#6C5FD3',price:'font-weight:700',btn:'background:linear-gradient(#FF9BE6,#FF4FC3);color:#fff;font-weight:700;padding:6px 16px;border-radius:999px;border:1px solid #fff;box-shadow:inset 0 6px 6px rgba(255,255,255,.55),0 2px 6px rgba(255,79,195,.5)',c:['#3A2E8C','#E6E4FF','#FFFFFF','#FF6FD0'],tok:['Bubbles and pills','Gloss highlights, glows','Iridescent pastels, chrome','Rounded or techno display'],traits:['Glossy highlights on buttons','Metallic and iridescent gradients','Stars, sparkles, bubbles'],use:'Fashion, music, Gen Z campaigns, nostalgia pieces.',risk:'White text on glossy pink or silver often fails contrast. A trend look that will date.',code:'Layered gradients and inner highlights. Doable in code, but usually ends up as image assets.'},
{k:'retro',n:'Retro Design',one:'Borrowed from past decades: warm faded colour, stripes and vintage type.',bg:'background:#F3E2C0',card:'background:#FFF6DF;border:2px solid #5B3A1E;border-bottom-width:6px;border-radius:14px;padding:12px;color:#5B3A1E',img:'background:repeating-linear-gradient(180deg,#E9B44C 0 14px,#E4572E 14px 28px,#76B041 28px 42px);border-radius:10px',ttl:'font:700 17px Georgia,serif',sub:'color:#8A5A2B',price:'font:700 16px Georgia,serif',btn:'background:#C8553D;color:#FFF6DF;font:700 14px Georgia,serif;padding:6px 16px;border-radius:999px',c:['#5B3A1E','#FFF6DF','#FFF6DF','#C8553D'],tok:['Rounded, chunky','Flat, or a solid lower edge','Mustard, rust, olive, cream','Serif or display from the era'],traits:['Muted warm palette','Stripes, sunbursts, grain','Type that names a decade'],use:'Food and drink, cafés, craft brands, anything selling warmth.',risk:'Display typefaces hurt legibility at small sizes. Cream-on-mustard pairs often fail contrast.',code:'Mostly palette and type, so it tokenises well. Custom fonts need licensing and a Dynamic Type plan.'},
{k:'cyber',n:'Cyberpunk',one:'A dark, high-tech future: neon on black, glitches and grids.',bg:'background:linear-gradient(rgba(0,255,240,.08) 1px,transparent 1px) 0 0/14px 14px,linear-gradient(90deg,rgba(0,255,240,.08) 1px,transparent 1px) 0 0/14px 14px,#0A0A12',card:'background:#12121F;border:1px solid #00FFF0;box-shadow:0 0 12px rgba(0,255,240,.6),inset 0 0 12px rgba(255,0,170,.15);padding:12px;color:#E6FBFF;font-family:var(--f-mono)',img:'background:linear-gradient(135deg,#1B0033,#3D0066);border:1px solid #FF00AA',ttl:'font:700 14px var(--f-mono);text-transform:uppercase;color:#00FFF0;text-shadow:0 0 6px #00FFF0',sub:'color:#FF6AD5',price:'font:700 15px var(--f-mono);color:#FFE600',btn:'border:1px solid #FF00AA;color:#FF00AA;padding:5px 12px;font:700 12px var(--f-mono);text-transform:uppercase;box-shadow:0 0 8px rgba(255,0,170,.7)',c:['#00FFF0','#12121F','#FF00AA','#12121F','#FF00AA'],tok:['Sharp or cut corners','Neon glow instead of shadow','Black with cyan, magenta, yellow','Monospace or techno'],traits:['Neon glows on dark','Grids, scan lines, glitches','Angular, technical shapes'],use:'Games, crypto, developer tools, sci-fi media.',risk:'Glows and glitch animation tire the eyes and can trouble motion-sensitive users. Neon on black passes contrast but vibrates.',code:'Glow is a coloured blur shadow: fine in Flutter and SwiftUI, harder on Android. Glitch effects need shaders or pre-rendered animation.'},
{k:'edit',n:'Editorial Design',one:'Typography-focused and layout-driven, like a magazine spread.',bg:'background:#F7F5F0',card:'padding:8px 6px 6px;color:#111;border-top:2px solid #111',img:'background:#D9D6CF;filter:grayscale(1)',pre:'<div style="display:flex;justify-content:space-between;font:600 9px var(--f-body);letter-spacing:.14em;text-transform:uppercase"><span>Seasonal</span><span>No. 01</span></div>',ttl:'font:400 26px/1.02 Georgia,Times New Roman,serif;letter-spacing:-.02em',sub:'color:#555;font:italic 12px Georgia,serif',price:'font:400 15px Georgia,serif',btn:'font:600 10px var(--f-body);letter-spacing:.14em;text-transform:uppercase;border-bottom:1px solid #111;padding-bottom:2px',c:['#111111','#F7F5F0','#111111','#F7F5F0','#111111'],tok:['Square; rules instead of boxes','None','Near-monochrome, photography leads','Large serif display with small sans labels'],traits:['Big expressive headlines','A strict column grid with asymmetry','Thin rules, small caps labels, numbers'],use:'Publishing, fashion, portfolios, long-form content, brand stories.',risk:'Large type leaves little room on a phone and breaks at big text sizes or long translations.',code:'Type scale and grid are everything. Needs careful line-height, truncation and Dynamic Type testing.'},
{k:'liquid',n:'Liquid Glass (iOS 26)',one:'Apple’s system material from the 2025 releases: clear, glass-like controls that float above content and bend the light behind them.',bg:'background:radial-gradient(circle at 15% 15%,#FFD36E 0 18%,transparent 42%),radial-gradient(circle at 85% 30%,#FF7EB3 0 18%,transparent 44%),radial-gradient(circle at 50% 95%,#5EE7DF 0 20%,transparent 50%),linear-gradient(160deg,#3A7BD5,#6C4AB6)',card:'background:linear-gradient(135deg,rgba(255,255,255,.34),rgba(255,255,255,.12));-webkit-backdrop-filter:blur(10px) saturate(1.8);backdrop-filter:blur(10px) saturate(1.8);border:1px solid rgba(255,255,255,.55);border-radius:26px;padding:14px;color:#fff;box-shadow:inset 0 1px 1px rgba(255,255,255,.8),inset 0 -1px 1px rgba(255,255,255,.25),0 8px 24px rgba(0,0,0,.18)',img:'background:rgba(255,255,255,.18);border-radius:18px',ttl:'font:600 15px -apple-system,var(--f-body);text-shadow:0 1px 2px rgba(0,0,0,.25)',sub:'color:rgba(255,255,255,.85)',price:'font-weight:700',btn:'background:rgba(10,132,255,.78);border:1px solid rgba(255,255,255,.5);color:#fff;padding:6px 16px;border-radius:999px;font-weight:600;box-shadow:inset 0 1px 1px rgba(255,255,255,.6)',bar:'margin:0 20px;border-radius:999px',row:'background:rgba(255,255,255,.94);color:#16181D;border:0;border-radius:18px;box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none;text-shadow:none',c:['#FFFFFF','#7FA6C9','#FFFFFF','#3B8FE8','#3B8FE8'],tok:['Capsules and concentric rounded corners','Refraction, moving highlights, blur; controls float','Clear or tinted glass that takes colour from the content behind','System font, bolder and left-aligned'],traits:['Navigation and controls sit in a floating glass layer above the content','The glass refracts and reflects, with highlights that respond to motion','Tab bars and toolbars shrink, expand or merge as you scroll'],use:'Apps on iOS 26 and the matching iPad, Mac, Watch and TV releases. It is meant for the control and navigation layer, not for content itself.',risk:'Legibility over busy or bright content. The system adapts for Reduce Transparency and Increase Contrast; a hand-made imitation will not.',code:'SwiftUI: the glassEffect modifier, GlassEffectContainer and the glass button styles; standard bars and sheets adopt it when built with the current SDK. Android and Flutter have no equivalent: a blur imitation lacks the refraction and costs performance, so do not fake it there. API names from memory; check Apple’s documentation.'}];
function styCard(s,sm){const w=sm?150:210,ih=sm?54:84,fr=c=>fruit(c).replace('width="56%"','width="'+(sm?40:58)+'"'),pad=sm?12:22;
  if(s.k==='bento')return `<div style="${s.bg};padding:${pad}px;border-radius:12px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;width:${w}px;font:13px var(--f-body);color:#16181D"><div style="grid-column:1/-1;background:#FBE9BD;border-radius:16px;height:${ih}px;display:grid;place-items:center">${fr('#F6B93B')}</div><div style="background:#fff;border-radius:16px;padding:10px;grid-row:span 2"><b>Alphonso Mango</b><div style="color:#6B7080;font-size:11px">1 kg</div></div><div style="background:#16181D;color:#fff;border-radius:16px;padding:10px;font-weight:700">₹249</div><div style="background:#17703D;color:#fff;border-radius:16px;padding:10px;font-weight:700;text-align:center">Add</div></div></div>`;
  return `<div style="${s.bg};padding:${pad}px;border-radius:12px"><div style="width:${w}px;display:flex;flex-direction:column;gap:7px;font:13px var(--f-body);${s.card}"><div style="height:${ih}px;display:grid;place-items:center;overflow:hidden;${s.img}">${fr(s.k==='cyber'?'#00FFF0':'#F6B93B')}</div>${s.pre||''}<div style="${s.ttl}">Alphonso Mango</div><div style="font-size:11px;${s.sub}">1 kg</div><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><span style="${s.price}">₹249</span><span style="${s.btn}">Add</span></div></div></div>`}
function styPhone(s){const cd=(s.card||'').replace(/transform:[^;]+;?/,''),row=(n,p)=>`<div style="${cd};${s.row||''};padding:8px;display:flex;gap:8px;align-items:center"><div style="width:38px;height:38px;flex:none;${s.img||''}"></div><div style="flex:1;min-width:0"><div style="${s.ttl};font-size:13px;line-height:1.2">${n}</div><div style="${s.price};font-size:12px">₹${p}</div></div><span style="${s.btn};font-size:11px">Add</span></div>`;
  return `<div style="${s.bg};width:236px;height:430px;border-radius:28px;border:2px solid #2B2E38;overflow:hidden;display:flex;flex-direction:column;padding:14px 10px 10px;gap:9px;font:12px var(--f-body)"><div style="${cd};padding:9px 10px"><div style="${s.ttl};font-size:17px;line-height:1.15">Fruits</div><div style="font-size:10px;${s.sub}">48 items · delivery in 15 min</div></div>${row('Alphonso Mango',249)+row('Robusta Banana',42)+row('Hybrid Tomato',28)}<div style="${cd};${s.bar||''};padding:9px 8px;display:flex;justify-content:space-around;font-size:10.5px;font-weight:600;margin-top:auto"><span>Home</span><span>Search</span><span>Basket</span></div></div>`}
V.styles=()=>{
  main.innerHTML=`<div class="wrap">${head('Extra lesson · goes with module 2','UI design styles, on a card and on a phone','A style is a recognisable way of dressing the same interface. Here one product card, and one phone screen, wear fifteen classic styles plus Apple’s Liquid Glass, so you can see what actually changes: shape, depth, colour and type. The content and the layout never do.')}
  <section class="panel"><h2>One card, sixteen styles</h2><div class="row">${seg(SYS,'k',SY.map((s,i)=>[s.k,(i+1)+' '+s.n]))}</div>
  <div class="split" style="grid-template-columns:minmax(0,300px) minmax(0,1fr)"><div class="plain"><div class="stage" style="padding:16px 8px" id="sybig"></div><ul class="audit" id="syaud"></ul>${simNote}</div><div class="plain" id="syinfo"></div></div></section>
  <section class="panel"><h2>The same style on a phone screen</h2><p>A card is easy to restyle. A whole screen is the real test: header, list rows and a tab bar all have to work in the style, at phone size. This mock follows the style selected above. For Liquid Glass only the header and tab bar are glass and the rows stay solid, because the material is meant for controls, not content.</p>
  <div class="split" style="grid-template-columns:minmax(0,300px) minmax(0,1fr)"><div class="stage" style="padding:16px 8px"><div id="syphone"></div><small id="sypcap"></small></div>
   <div class="plain">${list(['<b>Small screens punish decoration.</b> Borders, shadows and glows that look fine on one card repeat on every row.','<b>Text over a styled surface must stay readable outdoors,</b> at large text sizes and in dark mode.','<b>Bars are the hardest part.</b> A tab bar has to stay obvious and tappable in any style; watch how each one handles it.','<b>Performance is part of the style.</b> Blur and layered shadows on every list row cost frames while scrolling.','<b>The platform already has a style.</b> Anything you add sits next to system sheets, keyboards and alerts that you cannot restyle.'])}</div></div>
  <h3>The house styles of mobile platforms</h3><div class="tablewrap"><table><thead><tr><th>Design language</th><th>What it looks like</th><th>What it means for your build</th></tr></thead><tbody>
  ${[['iOS 7 to iOS 18','Flat, light, type-led. Thin icons, blurred translucent bars, content edge to edge.','The look most existing iOS apps were designed for. Apps not rebuilt with the newer SDK keep it.'],['Liquid Glass (iOS 26 onward)','Floating glass bars and controls that refract the content behind; rounder, concentric shapes; tab bars that shrink on scroll.','Standard SwiftUI and UIKit controls pick it up when built with the current SDK. Custom bars and backgrounds behind bars are where apps need rework.'],['Material You / Material 3','Tonal surfaces, colour roles, dynamic colour from the wallpaper, large rounded shapes.','Native in Compose and Flutter. Decide whether your brand colour or the user’s wallpaper wins.'],['Material 3 Expressive','The 2025 evolution: springier motion, bolder shapes and more emphasised type.','Arrives through newer Material component versions; check what your library version includes.'],['Samsung One UI','Android with large headers and controls pushed to the lower half for one-handed reach.','Your app still uses your own components there, but system dialogs and the keyboard will look like One UI.'],['A custom brand system','The company’s own tokens and components, used on every platform.','What most large shopping apps do. Platform behaviour stays native; the look is the brand’s.']].map(r=>'<tr><td><b>'+r[0]+'</b></td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>').join('')}</tbody></table></div>
  <p class="note">Written from memory, not checked against Apple’s or Google’s current pages. Liquid Glass is a material the system draws; the mock here is a CSS approximation with no real refraction.</p></section>
