r editor for autocomplete, a checker such as `mypy` or `pyright` to find bugs before running, and frameworks such as FastAPI and Pydantic to validate data.\n\nIn backend code, write hints on every function signature. They are how a large Python codebase stays understandable."}, {"t": "bridge", "title": "", "text": "With hints and a checker turned on, Python feels much closer to Swift or Dart. `str | None` is `String?`. `list[int]` is `[Int]` / `List\u003cint>`. The difference: nothing stops the program from running with a wrong type unless a tool checks it."}, {"t": "code", "lang": "python", "title": "", "code": "from typing import Literal, TypedDict\n\nStatus = Literal[\"placed\", \"packed\", \"shipped\", \"delivered\"]\n\nclass OrderRow(TypedDict):\n    id: int\n    status: Status\n    coupon: str | None\n\ndef next_status(current: Status) -> Status | None:\n    flow: list[Status] = [\"placed\", \"packed\", \"shipped\", \"delivered\"]\n    position = flow.index(current)\n    return flow[position + 1] if position + 1 \u003c len(flow) else None\n\ndef discount(order: OrderRow, table: dict[str, int]) -> int:\n    code = order[\"coupon\"]\n    if code is None:          # the checker now knows code is str below\n        return 0\n    return table.get(code, 0)\n\nrow: OrderRow = {\"id\": 184, \"status\": \"packed\", \"coupon\": \"FIRST50\"}\nprint(next_status(row[\"status\"]), discount(row, {\"FIRST50\": 50}))", "web": 1}, {"t": "flow", "title": "Who reads the hints", "lanes": [{"name": "", "nodes": [{"n": "Type hints in code"}, {"a": ""}, {"n": "Editor: autocomplete and red squiggles"}]}, {"name": "", "nodes": [{"n": "Type hints in code"}, {"a": ""}, {"n": "mypy / pyright in CI: fail the build on a mismatch"}]}, {"name": "", "nodes": [{"n": "Type hints in code"}, {"a": ""}, {"n": "Pydantic / FastAPI: validate real data at run time"}]}, {"name": "", "nodes": [{"n": "Type hints in code"}, {"a": ""}, {"n": "Interpreter: ignores them"}]}]}, {"t": "pitfalls", "title": "", "items": ["Believing hints are enforced. `def f(x: int)` happily accepts a string unless a checker or Pydantic is involved.", "Sprinkling `Any` everywhere, which turns checking off.", "Not handling the `None` branch of an optional value."]}, {"t": "deep", "title": "Generics, protocols and types that catch real bugs", "text": "Hints become powerful when they describe relationships, not just single values.\n\nA **generic** function keeps the link between what goes in and what comes out: \"a list of T in, a T out\". A **Protocol** describes what an object must be able to do, without requiring inheritance. `NewType` creates distinct types for values that are all integers underneath, so passing a user id where an order id is expected becomes an error. A union of small classes with a literal `kind` field, handled with `match` and `assert_never`, makes the checker prove you covered every case.\n\nThe sample below is checked by `mypy --strict` every time this page is built, and it also runs."}, {"t": "code", "lang": "python", "title": "Checked with `mypy --strict`", "code": "from collections.abc import Callable, Iterable\nfrom dataclasses import dataclass, field\nfrom typing import Final, Literal, NewType, Protocol, Self, assert_never\n\nUserId = NewType(\"UserId\", int)          # same as int at run time, different to the checker\nOrderId = NewType(\"OrderId\", int)\nMAX_ITEMS: Final = 20                    # cannot be reassigned\n\ndef first[T](items: Iterable[T], default: T) -> T:          # generic: T is decided per call\n    for item in items:\n        return item\n    return default\n\nclass HasPrice(Protocol):                # anything with a price property qualifies\n    @property\n    def price(self) -> int: ...\n\n@dataclass(frozen=True)\nclass Item:\n    sku: str\n    price: int\n\ndef total[P: HasPrice](items: list[P]) -> int:\n    return sum(item.price for item in items)\n\n@dataclass(frozen=True)\nclass Paid:\n    reference: str\n    kind: Literal[\"paid\"] = \"paid\"\n\n@dataclass(frozen=True)\nclass Declined:\n    reason: str\n    kind: Literal[\"declined\"] = \"declined\"\n\nPaymentResult = Paid | Declined\n\ndef describe(result: PaymentResult) -> str:\n    match result:\n        case Paid(reference=reference):\n            return f\"paid, ref {reference}\"\n        case Declined(reason=reason):\n            return f\"declined: {reason}\"\n        case _:\n            assert_never(result)         # adding a third class makes this a type error\n\ndef logged[**P, R](func: Callable[P, R]) -> Callable[P, R]:   # a decorator that keeps the signature\n    def wrapper(*args: P.args, **kwargs: P.kwargs) -> R:\n        print(f\"calling {func.__name__}\")\n        return func(*args, **kwargs)\n    return wrapper\n\n@logged\ndef delivery_fee(amount: int, member: bool = False) -> int:\n    return 0 if member or amount >= 500 else 40\n\n@dataclass\nclass Query:\n    clauses: list[str] = field(default_factory=list)\n    def where(self, clause: str) -> Self:                    # Self: works for subclasses too\n        self.clauses.append(clause)\n        return self\n\ndef load_order(user: UserId, order: OrderId) -> str:\n    return f\"order {order} of user {user}\"\n\nprint(first([Item(\"milk\", 62)], Item(\"none\", 0)).sku, first([], 0), total([Item(\"milk\", 62), Item(\"ghee\", 540)]))\nprint(describe(Paid(\"TXN-9\")), \"|\", describe(Declined(\"insufficient funds\")))\nprint(delivery_fee(300), Query().where(\"city = 'blr'\").where(\"total > 500\").clauses, MAX_ITEMS)\nprint(load_order(UserId(7), OrderId(184)))\n# load_order(OrderId(184), UserId(7))    \u003c- mypy: incompatible type \"OrderId\"; expected \"UserId\""}, {"t": "flow", "title": "What the checker proves in `describe`", "lanes": [{"name": "", "nodes": [{"n": "result: Paid | Declined"}, {"a": ""}, {"n": "case Paid"}, {"a": "handled"}, {"n": "remaining type: Declined"}]}, {"name": "", "nodes": [{"n": "remaining type: Declined"}, {"a": ""}, {"n": "case Declined"}, {"a": "handled"}, {"n": "remaining type: Never"}]}, {"name": "", "nodes": [{"n": "remaining type: Never"}, {"a": ""}, {"n": "assert_never accepts it"}, {"a": ""}, {"n": "All cases covered"}]}]}, {"t": "table", "title": "Tools in this sample", "rows": [["Feature", "Use it for"], ["`def f[T](...)`", "Functions that work for any type and preserve it"], ["`Protocol`", "\"Anything that has these methods\", no base class needed"], ["`NewType`", "Ids and units that must not be mixed up"], ["`Literal`", "A fixed set of allowed strings or numbers"], ["A union + `match` + `assert_never`", "Results with different shapes, exhaustively handled"], ["`Callable[P, R]` with `[**P, R]`", "Decorators that preserve the wrapped signature"], ["`Self`", "Methods that return their own instance, for chaining"], ["`Final`", "Constants"]]}, {"t": "quiz", "title": "", "items": [["Are type hints enforced at run time?", "No. They are metadata. Static checkers enforce them before running, and libraries such as Pydantic choose to enforce them on data."], ["What is `Optional[str]`?", "The same as `str | None`: the value is either a string or `None`."], ["What is the difference between `TypedDict`, `dataclass` and a Pydantic model?", "`TypedDict` only describes the shape of a plain dict for the checker. A dataclass is a real class with typed fields and no validation. A Pydantic model validates and converts data when it is created."], ["What is a generic function?", "A function with a type parameter, so one definition works for many types while the checker tracks which type each call uses."], ["Protocol versus abstract base class?", "A Protocol is satisfied by any class with the right members, checked structurally. An ABC requires explicit inheritance and can also provide shared code and block instantiation."], ["What is `NewType` for?", "Creating a distinct type for the checker over an existing one, at no run-time cost, to prevent mixing values such as user ids and order ids."], ["How do you get exhaustiveness checking in Python?", "Use a union of types or a `Literal`, handle each case, and call `assert_never` on the remainder. The checker reports an error if a case is missing."], ["What does `mypy --strict` add?", "It disallows untyped functions and implicit `Any`, among other checks, so the whole module is actually verified."]]}]}]}, {"name": "Stage 4 · Advanced", "sub": "The parts that separate seniors from juniors", "lessons": [{"id": "py-gen", "title": "Iterators and generators", "level": "Advanced", "mins": "30 min", "blocks": [{"t": "plain", "title": "", "text": "An **iterator** hands out values one at a time when asked. A **generator** is the easy way to write one: a function that uses `yield`. Each `yield` pauses the function and hands a value to the caller. The function resumes from that line when the next value is requested.\n\nThe benefit is memory. A generator never holds the whole result, so it can work through a file or a database table far bigger than RAM."}, {"t": "analogy", "title": "", "text": "A list is a printed book: all pages exist at once. A generator is a storyteller: the next sentence exists only when you ask for it."}, {"t": "bridge", "title": "", "text": "`yield` in a `def` is Dart's `sync*` function with `yield`, and Swift's `AsyncStream` idea without the async part. A lazy Swift `sequence` is the same concept."}, {"t": "code", "lang": "python", "title": "", "code": "def read_orders(lines):\n    for line in lines:                # could be a 10 GB file\n        order_id, city, total = line.split(\",\")\n        yield {\"id\": int(order_id), \"city\": city, \"total\": int(total)}\n\ndef only_city(orders, city):\n    for order in orders:\n        if order[\"city\"] == city:\n            yield order\n\ndef batches(items, size):\n    batch = []\n    for item in items:\n        batch.append(item)\n        if len(batch) == size:\n            yield batch\n            batch = []\n    if batch:\n        yield batch\n\nlines = [\"1,blr,300\", \"2,del,90\", \"3,blr,760\", \"4,blr,120\", \"5,mum,50\"]\npipeline = batches(only_city(read_orders(lines), \"blr\"), size=2)\nfor group in pipeline:                # nothing ran until this loop asked\n    print([o[\"id\"] for o in group])", "web": 1}, {"t": "steps", "title": "A generator pauses and resumes", "steps": [{"c": "`gen = read_orders(lines)` creates the generator. No line of the body has run.", "cols": [["Generator state", ["created"]], ["Caller received", []]]}, {"c": "The loop asks for a value. The body runs to the first `yield` and pauses there.", "cols": [["Generator state", ["paused at yield (order 1)"]], ["Caller received", ["order 1"]]]}, {"c": "The loop asks again. The body resumes after the `yield`, loops and pauses at the next one.", "cols": [["Generator state", ["paused at yield (order 2)"]], ["Caller received", ["order 1", "order 2"]]]}, {"c": "When the body ends, Python raises `StopIteration` and the `for` loop ends quietly.", "cols": [["Generator state", ["finished"]], ["Caller received", ["order 1", "order 2", "order 3", "order 4", "order 5"]]]}]}, {"t": "flow", "title": "A lazy pipeline", "lanes": [{"name": "", "nodes": [{"n": "File lines"}, {"a": ""}, {"n": "read_orders (parse)"}, {"a": ""}, {"n": "only_city (filter)"}, {"a": ""}, {"n": "batches (group by 2)"}, {"a": ""}, {"n": "for loop pulls one batch at a time"}]}]}, {"t": "real", "title": "", "text": "Exporting two million orders to CSV: a generator reads 1,000 rows from the database, yields them, and the web framework streams them to the client. Memory stays at 1,000 rows instead of two million. The same shape streams tokens from a language model later in this track."}, {"t": "pitfalls", "title": "", "items": ["Looping over a generator twice. It is used up after the first pass.", "Calling `len()` on a generator. It has no length. Convert with `list()` only if it is small.", "Forgetting that nothing runs until something consumes it."]}, {"t": "deep", "title": "The iterator protocol, `yield from` and `itertools`", "text": "A `for` loop is built on two methods. It calls `iter(x)` to get an iterator, then calls `next()` on it until `StopIteration` is raised. Any object that implements `__iter__` and `__next__` works in a loop. A generator is Python writing those two methods for you.\n\n`yield from other` hands control to another generator until it is exhausted, which lets you split one generator into several. `itertools` is a toolbox of fast, lazy building blocks: slice, chain, group and batch a stream without loading it.\n\nAn **async generator** (`async def` with `yield`) is the same idea for data that arrives over time, consumed with `async for`. You used one for server-sent events."}, {"t": "code", "lang": "python", "title": "", "code": "import itertools, sys\n\nclass Countdown:                         # the protocol written by hand\n    def __init__(self, start): self.current = start\n    def __iter__(self): return self\n    def __next__(self):\n        if self.current \u003c= 0:\n            raise StopIteration\n        self.current -= 1\n        return self.current + 1\n\nprint(list(Countdown(3)))\nit = iter([10, 20])\nprint(next(it), next(it), next(it, \"empty\"))\n\ndef pages(total_pages):\n    for page in range(1, total_pages + 1):\n        yield [f\"order-{page}-{i}\" for i in range(2)]      # one API page at a time\n\ndef all_orders(total_pages):\n    for page in pages(total_pages):\n        yield from page                                    # flatten without a nested loop\n\nprint(list(itertools.islice(all_orders(1000), 5)))         # only 3 pages are ever fetched\n\nsquares_list = [n * n for n in range(100_000)]\nsquares_gen = (n * n for n in range(100_000))\nprint(sys.getsizeof(squares_list), \"bytes vs\", sys.getsizeof(squares_gen), \"bytes\")\n\norders = [(\"blr\", 300), (\"blr\", 760), (\"del\", 90), (\"mum\", 410), (\"mum\", 50)]\nfor city, group in itertools.groupby(orders, key=lambda o: o[0]):   # input must be sorted by key\n    print(city, sum(amount for _, amount in group))\nprint(list(itertools.batched(range(7), 3)), list(itertools.chain([1, 2], [3])))"}, {"t": "table", "title": "Lazy tools worth knowing", "rows": [["Tool", "Does"], ["`itertools.islice(it, n)`", "First n items of any iterator"], ["`itertools.chain(a, b)`", "One iterator after another"], ["`itertools.batched(it, n)`", "Groups of n (Python 3.12+)"], ["`itertools.groupby(it, key)`", "Consecutive items with the same key"], ["`zip(a, b)`, `enumerate(it)`", "Pair up, number"], ["`any(...)`, `all(...)`", "Stop at the first decisive item"]]}, {"t": "quiz", "title": "", "items": [["What is the difference between `return` and `yield`?", "`return` ends the function and gives back one value. `yield` pauses it, gives back a value and keeps local state so it can continue later."], ["What is the difference between an iterable and an iterator?", "An iterable can produce an iterator (`__iter__`). An iterator produces the values (`__next__`) and remembers its position. A list is iterable, a generator is an iterator."], ["Why use generators?", "Constant memory for large or endless data, and work is done only for values that are actually consumed."], ["What is the iterator protocol?", "An object is iterable if `__iter__` returns an iterator. An iterator has `__next__`, which returns the next value or raises `StopIteration`."], ["What does `yield from` do?", "It delegates to another iterable or generator, yielding each of its values, and returns that generator's return value."], ["Can you reuse a generator?", "No. Once exhausted it stays empty. Create a new one, or store the values in a list if you need several passes."], ["What is an async generator?", "A function defined with `async def` that contains `yield`. It can await between values and is consumed with `async for`."]]}]}, {"id": "py-deco", "title": "Decorators", "level": "Advanced", "mins": "30 min", "blocks": [{"t": "plain", "title": "", "text": "A decorator is a function that takes a function and returns a new one that wraps it. The `@name` line above a `def` applies it. It lets you add behaviour around many functions (timing, logging, retries, permission checks, caching) without editing each one.\n\nWeb frameworks are built on this. `@app.get(\"/orders\")` is a decorator that registers your function as the handler for a URL."}, {"t": "analogy", "title": "", "text": "Gift wrapping. The gift is unchanged, and the wrapper adds something before you reach it and after."}, {"t": "bridge", "title": "", "text": "Swift property wrappers and Dart annotations look similar, but a Python decorator is plain code that runs at definition time and replaces the function. Think \"higher-order function with special syntax\"."}, {"t": "code", "lang": "python", "title": "", "code": "import functools, time\n\ndef retry(times: int, delay: float = 0.0):\n    def decorator(func):\n        @functools.wraps(func)                 # keep the original name and docstring\n        def wrapper(*args, **kwargs):\n            for attempt in range(1, times + 1):\n                try:\n                    return func(*args, **kwargs)\n                except ConnectionError as err:\n                    print(f\"attempt {attempt} failed: {err}\")\n                    if attempt == times:\n                        raise\n                    time.sleep(delay)\n        return wrapper\n    return decorator\n\ncalls = {\"n\": 0}\n\n@retry(times=3)\ndef charge_card(amount: int) -> str:\n    calls[\"n\"] += 1\n    if calls[\"n\"] \u003c 3:\n        raise ConnectionError(\"gateway timeout\")\n    return f\"charged {amount}\"\n\nprint(charge_card(709), \"| name kept:\", charge_card.__name__)\n\n@functools.lru_cache(maxsize=256)             # a ready-made caching decorator\ndef delivery_zone(pincode: str) -> str:\n    print(\"slow lookup for\", pincode)\n    return \"zone-\" + pincode[:3]\n\ndelivery_zone(\"560103\"); delivery_zone(\"560103\")   # second call is served from cache"}, {"t": "flow", "title": "Calling a decorated function", "lanes": [{"name": "", "nodes": [{"n": "Caller calls charge_card(709)"}, {"a": ""}, {"n": "*wrapper runs first"}, {"a": ""}, {"n": "Calls the original function"}, {"a": ""}, {"n": "Failed?"}, {"a": "yes, tries left"}, {"n": "Wait and call again"}]}, {"name": "", "nodes": [{"n": "Calls the original function"}, {"a": ""}, {"n": "Succeeded"}, {"a": ""}, {"n": "wrapper returns the result"}, {"a": ""}, {"n": "Caller"}]}]}, {"t": "steps", "title": "What `@retry(times=3)` does at definition time", "steps": [{"c": "`retry(times=3)` runs and returns `decorator`.", "cols": [["Name charge_card points at", ["(not defined yet)"]]]}, {"c": "Python defines the original function, then calls `decorator(original)`.", "cols": [["Name charge_card points at", ["original function"]]]}, {"c": "`decorator` returns `wrapper`, and the name is rebound to it.", "cols": [["Name charge_card points at", ["wrapper (which holds the original inside)"]]]}]}, {"t": "pitfalls", "title": "", "items": ["Leaving out `functools.wraps`. The wrapped function loses its name and docstring, which breaks debugging and framework introspection.", "Retrying operations that are not safe to repeat, such as charging a card without an idempotency key.", "Caching a function whose result depends on something other than its arguments."]}, {"t": "deep", "title": "Stacking order, class-based decorators and built-in ones", "text": "When several decorators are stacked, they are **applied bottom to top** and **run top to bottom**. `@a` above `@b` above `def f` means `f = a(b(f))`. A call enters `a`'s wrapper first, then `b`'s, then the function.\n\nA decorator does not have to be a function. Any callable works, so a class with `__call__` can be a decorator that keeps state, such as a rate limiter. Python also ships decorators you will use constantly: `@property`, `@staticmethod`, `@classmethod`, `@dataclass`, `@functools.cache` and `@functools.wraps`."}, {"t": "code", "lang": "python", "title": "", "code": "import functools, time\n\ndef log(func):\n    @functools.wraps(func)\n    def wrapper(*args, **kwargs):\n        print(f\"  log: calling {func.__name__}{args}\")\n        result = func(*args, **kwargs)\n        print(f\"  log: {func.__name__} returned {result}\")\n        return result\n    return wrapper\n\ndef require_role(role):\n    def decorator(func):\n        @functools.wraps(func)\n        def wrapper(user, *args, **kwargs):\n            if role not in user[\"roles\"]:\n                raise PermissionError(f\"{user['name']} needs role {role}\")\n            return func(user, *args, **kwargs)\n        return wrapper\n    return decorator\n\n@log                      # outermost: runs first, sees the PermissionError too\n@require_role(\"support\")  # innermost: applied first\ndef refund(user, order_id):\n    return f\"refunded {order_id}\"\n\nprint(refund({\"name\": \"Asha\", \"roles\": [\"support\"]}, 184))\ntry:\n    refund({\"name\": \"Ravi\", \"roles\": []}, 185)\nexcept PermissionError as err:\n    print(\"denied:\", err)\n\nclass RateLimit:                               # a decorator with state\n    def __init__(self, calls: int, per_seconds: float):\n        self.calls, self.per, self.stamps = calls, per_seconds, []\n    def __call__(self, func):\n        @functools.wraps(func)\n        def wrapper(*args, **kwargs):\n            now = time.monotonic()\n            self.stamps = [t for t in self.stamps if now - t \u003c self.per]\n            if len(self.stamps) >= self.calls:\n                raise RuntimeError(\"rate limit exceeded\")\n            self.stamps.append(now)\n            return func(*args, **kwargs)\n        return wrapper\n\n@RateLimit(calls=2, per_seconds=1)\ndef send_otp(phone): return f\"otp sent to {phone}\"\n\nfor attempt in range(3):\n    try: print(send_otp(\"98xxxx\"))\n    except RuntimeError as err: print(\"blocked:\", err)", "web": 1}, {"t": "steps", "title": "A call through two stacked decorators", "steps": [{"c": "`refund(user, 184)` is called. The name `refund` is bound to `log`'s wrapper.", "cols": [["Now running", ["log wrapper"]], ["Printed", ["log: calling refund"]]]}, {"c": "The log wrapper calls what it wrapped, which is `require_role`'s wrapper. It checks the role.", "cols": [["Now running", ["require_role wrapper"]], ["Printed", ["log: calling refund"]]]}, {"c": "The role is present, so the original function runs.", "cols": [["Now running", ["refund (original)"]], ["Printed", ["log: calling refund"]]]}, {"c": "The value returns outward through both wrappers.", "cols": [["Now running", ["log wrapper"]], ["Printed", ["log: calling refund", "log: refund returned refunded 184"]]]}]}, {"t": "quiz", "title": "", "items": [["What is a decorator?", "A callable that receives a function and returns a replacement, usually a wrapper that runs extra code before or after calling the original. `@d` above `def f` means `f = d(f)`."], ["Why are there three nested functions in a decorator with arguments?", "The outer one takes the settings, the middle one takes the function and the inner one is the wrapper that takes the call's arguments."], ["What does `functools.wraps` do?", "It copies the name, docstring and other metadata from the original function onto the wrapper."], ["In what order do stacked decorators apply?", "The one closest to the function is applied first. At call time the outermost wrapper runs first. `@a @b def f` equals `f = a(b(f))`."], ["How do you write a decorator that takes arguments?", "Write a function that accepts the arguments and returns a decorator, which in turn returns the wrapper. Or use a class whose `__init__` takes the arguments and whose `__call__` takes the function."], ["Name real uses of decorators in a backend.", "Route registration, authentication and permission checks, caching, retries, timing and metrics, transactions and input validation."]]}]}, {"id": "py-ctx", "title": "Context managers", "level": "Advanced", "mins": "20 min", "blocks": [{"t": "plain", "title": "", "text": "A context manager is a setup and cleanup pair tied to a `with` block. The setup runs on entering the block and the cleanup runs on leaving it, **even if an exception is raised**. Files, database transactions, locks and timers are the classic uses."}, {"t": "bridge", "title": "", "text": "`with` is Swift's `defer` with a name and reuse, or `try / finally` in Dart packaged as an object."}, {"t": "code", "lang": "python", "title": "", "code": "import time\nfrom contextlib import contextmanager\n\n@contextmanager\ndef timed(label: str):\n    start = time.perf_counter()\n    try:\n        yield                              # the body of the with block runs here\n    finally:\n        print(f\"{label}: {(time.perf_counter() - start) * 1000:.1f} ms\")\n\nclass Transaction:\n    def __enter__(self):\n        print(\"BEGIN\")\n        return self\n    def __exit__(self, exc_type, exc, tb):\n        print(\"ROLLBACK\" if exc_type else \"COMMIT\")\n        return False                       # False: do not hide the exception\n\nwith timed(\"checkout\"):\n    with Transaction():\n        total = sum(range(1000))\n\ntry:\n    with Transaction():\n        raise ValueError(\"payment declined\")\nexcept ValueError as err:\n    print(\"handled:\", err)", "web": 1}, {"t": "flow", "title": "The `with` block", "lanes": [{"name": "", "nodes": [{"n": "Enter with"}, {"a": ""}, {"n": "__enter__ (setup)"}, {"a": ""}, {"n": "Body runs"}, {"a": ""}, {"n": "Error raised?"}, {"a": "no"}, {"n": "__exit__ commits"}]}, {"name": "", "nodes": [{"n": "Error raised?"}, {"a": "yes"}, {"n": "__exit__ rolls back"}, {"a": ""}, {"n": "Error continues upward"}]}]}, {"t": "real", "title": "", "text": "Placing an order writes three rows: the order, its items and the stock change. Wrapping the three writes in one transaction context manager means either all three are saved or none are. A crash halfway cannot leave an order with no items."}, {"t": "pitfalls", "title": "", "items": ["Returning `True` from `__exit__` by accident, which silently swallows the exception.", "Doing the cleanup after `yield` without `try / finally`. It is skipped when the body raises."]}, {"t": "deep", "title": "Several resources at once, and async context managers", "text": "Three situations go beyond a single `with`.\n\nWhen the **number of resources is not known in advance**, such as \"open every file in this list\", `contextlib.ExitStack` collects them and closes all of them in reverse order, even if opening the fifth one fails.\n\nWhen setup or cleanup must **await**, you need an async context manager: `__aenter__` / `__aexit__`, or `@asynccontextmanager`, used with `async with`. Database connections, HTTP clients and locks in async code all work this way.\n\nCleanup order is always **last opened, first closed**, like a stack of plates. That matters when one resource depends on another: the transaction must end before its connection is returned."}, {"t": "code", "lang": "python", "title": "", "code": "import asyncio, contextlib, io\n\nclass Resource:\n    def __init__(self, name, log, fail_on_open=False):\n        self.name, self.log, self.fail = name, log, fail_on_open\n    def __enter__(self):\n        if self.fail:\n            raise OSError(f\"cannot open {self.name}\")\n        self.log.append(f\"open {self.name}\")\n        return self\n    def __exit__(self, *exc):\n        self.log.append(f\"close {self.name}\")\n        return False\n\nlog: list[str] = []\nwith Resource(\"connection\", log), Resource(\"transaction\", log):\n    log.append(\"work\")\nprint(log)                                             # closed in reverse order\n\nlog = []\ntry:\n    with contextlib.ExitStack() as stack:              # a dynamic number of resources\n        for name in (\"a.csv\", \"b.csv\", \"c.csv\"):\n            stack.enter_context(Resource(name, log, fail_on_open=(name == \"c.csv\")))\nexcept OSError as err:\n    print(\"failed:\", err, \"| cleaned up:\", log)\n\n@contextlib.asynccontextmanager\nasync def db_connection(pool: list[str]):\n    conn = pool.pop()                                  # setup may await in real code\n    try:\n        yield conn\n    finally:\n        await asyncio.sleep(0)                         # cleanup may await too\n        pool.append(conn)\n\nasync def main() -> None:\n    pool = [\"conn-1\", \"conn-2\"]\n    lock = asyncio.Lock()\n    async with db_connection(pool) as conn, lock:      # async with: for awaitable setup and cleanup\n        print(\"using\", conn, \"| free in pool:\", len(pool))\n    print(\"returned | free in pool:\", len(pool))\n\nasyncio.run(main())\n\nbuffer = io.StringIO()\nwith contextlib.redirect_stdout(buffer):               # ready-made managers in the standard library\n    print(\"captured, not shown\")\nprint(\"captured text:\", buffer.getvalue().strip())"}, {"t": "steps", "title": "Opening three files when the third fails", "steps": [{"c": "`ExitStack` is entered. Its list of cleanups is empty.", "cols": [["Open resources", []], ["Cleanups registered", []]]}, {"c": "a.csv opens. Its close is registered.", "cols": [["Open resources", ["a.csv"]], ["Cleanups registered", ["close a.csv"]]]}, {"c": "b.csv opens.", "cols": [["Open resources", ["a.csv", "b.csv"]], ["Cleanups registered", ["close a.csv", "close b.csv"]]]}, {"c": "c.csv fails to open and raises. The stack runs its cleanups in reverse order.", "cols": [["Open resources", []], ["Cleanups registered", ["(ran: close b.csv", "then close a.csv)"]]]}, {"c": "The error continues to the caller. Nothing was left open.", "cols": [["Open resources", []], ["Cleanups registered", []]]}]}, {"t": "quiz", "title": "", "items": [["What guarantees does `with` give?", "The cleanup in `__exit__` runs however the block ends: normally, by exception, or by `return`."], ["How do you write a context manager without a class?", "Decorate a generator with `@contextlib.contextmanager`. Code before `yield` is the setup, code after it (in `finally`) is the cleanup."], ["In what order are multiple context managers exited?", "In reverse order of entry: the last one entered is exited first."], ["What is `ExitStack` for?", "Managing a number of context managers decided at run time, with guaranteed cleanup of all those already entered if a later one fails."], ["`with` versus `async with`?", "`async with` calls `__aenter__` and `__aexit__` and awaits them, so setup and cleanup can perform async I/O. It may only be used inside `async def`."], ["What do the three arguments of `__exit__` contain?", "The exception type, the exception instance and the traceback if the block raised, otherwise three `None` values."]]}]}, {"id": "py-gil", "title": "Threads, processes and the GIL", "level": "Advanced", "mins": "35 min", "blocks": [{"t": "plain", "title": "", "text": "There are two kinds of slow work. **I/O-bound** work spends its time waiting: for a database, a network call, a disk. **CPU-bound** work spends its time computing: resizing images, crunching numbers.\n\nStandard Python has a lock called the **GIL** (global interpreter lock). Only one thread can run Python code at a time. Threads still help with waiting, because a waiting thread releases the lock. Threads do not help with computing. For that you use several **processes**, each with its own interpreter and its own GIL."}, {"t": "analogy", "title": "", "text": "One kitchen, one knife. Many cooks can wait for ovens at the same time, but only the cook holding the knife can chop. More cooks do not make chopping faster. A second kitchen (a second process) does."}, {"t": "bridge", "title": "", "text": "Swift's GCD and Dart isolates are the comparison. Python threads are like GCD threads that can never actually run Swift code in parallel. Python processes are like Dart isolates: no shared memory, messages are copied between them."}, {"t": "code", "lang": "python", "title": "", "code": "import time\nfrom concurrent.futures import ThreadPoolExecutor, ProcessPoolExecutor\n\ndef fetch_price(sku: str) -> str:        # I/O-bound: mostly waiting\n    time.sleep(0.2)\n    return f\"{sku}:ok\"\n\ndef crunch(n: int) -> int:               # CPU-bound: mostly computing\n    return sum(i * i for i in range(n))\n\nif __name__ == \"__main__\":\n    skus = [f\"sku{i}\" for i in range(10)]\n    start = time.perf_counter()\n    with ThreadPoolExecutor(max_workers=10) as pool:\n        results = list(pool.map(fetch_price, skus))\n    print(f\"10 waits with threads: {time.perf_counter() - start:.2f}s (not 2.0s)\")\n\n    start = time.perf_counter()\n    with ProcessPoolExecutor(max_workers=4) as pool:\n        totals = list(pool.map(crunch, [300_000] * 4))\n    print(f\"4 crunches with processes: {time.perf_counter() - start:.2f}s\")"}, {"t": "steps", "title": "Two threads sharing the GIL", "steps": [{"c": "Thread A holds the GIL and runs Python code. Thread B is ready but must wait.", "cols": [["Holding the GIL", ["Thread A"]], ["Waiting for the GIL", ["Thread B"]], ["Waiting on network", []]]}, {"c": "Thread A starts a network call. It releases the GIL while it waits.", "cols": [["Holding the GIL", []], ["Waiting for the GIL", ["Thread B"]], ["Waiting on network", ["Thread A"]]]}, {"c": "Thread B takes the GIL and runs. The waits overlap, which is where the speed-up comes from.", "cols": [["Holding the GIL", ["Thread B"]], ["Waiting for the GIL", []], ["Waiting on network", ["Thread A"]]]}, {"c": "Thread A's response arrives. It queues for the GIL again.", "cols": [["Holding the GIL", ["Thread B"]], ["Waiting for the GIL", ["Thread A"]], ["Waiting on network", []]]}]}, {"t": "flow", "title": "Picking a tool", "lanes": [{"name": "", "nodes": [{"n": "Is the work mostly waiting?"}, {"a": "yes, few tasks"}, {"n": "Threads"}]}, {"name": "", "nodes": [{"n": "Is the work mostly waiting?"}, {"a": "yes, thousands of tasks"}, {"n": "asyncio (next lesson)"}]}, {"name": "", "nodes": [{"n": "Is the work mostly computing?"}, {"a": "yes"}, {"n": "Processes, or a library that releases the GIL (NumPy)"}]}, {"name": "", "nodes": [{"n": "Is it a long job?"}, {"a": ""}, {"n": "Background queue and worker (backend stage)"}]}]}, {"t": "real", "title": "", "text": "A product page needs price, stock and reviews from three internal services at 100 ms each. Called one after another the page takes 300 ms. Called together with threads or async it takes about 100 ms. Generating 5,000 invoice PDFs is CPU work: it goes to worker processes, not threads."}, {"t": "pitfalls", "title": "", "items": ["Expecting threads to speed up pure Python number crunching.", "Sharing a mutable object between threads without a lock. `x += 1` is not atomic.", "Forgetting the `if __name__ == \"__main__\":` guard with process pools on macOS and Windows."]}, {"t": "deep", "title": "Why the GIL exists, and a race you can run", "text": "The GIL exists because of reference counting. Every assignment changes an object's reference count. If two threads changed the same count at the same instant without protection, counts would be wrong and memory would be corrupted or leaked. One big lock made the interpreter simple and fast for single-threaded code, and made C extensions easy to write.\n\nA running thread gives up the GIL in two situations: when it starts blocking I/O, and after a time slice of about 5 milliseconds (the **switch interval**) so another thread gets a turn. Because that switch can land between any two bytecode instructions, the GIL does **not** make your own code thread-safe. `counter += 1` is three steps: read, add, store. A switch between them loses an update.\n\nHeavy C libraries such as NumPy, compression and hashing release the GIL while they work, so threads can run those in true parallel."}, {"t": "code", "lang": "python", "title": "", "code": "import sys, threading, time\n\ncounter = 0\nsafe_counter = 0\nlock = threading.Lock()\n\ndef unsafe_add(times):\n    global counter\n    for _ in range(times):\n        current = counter           # read\n        time.sleep(0)               # invite a thread switch at the worst moment\n        counter = current + 1       # store: may overwrite another thread's update\n\ndef safe_add(times):\n    global safe_counter\n    for _ in range(times):\n        with lock:                  # only one thread at a time in this block\n            current = safe_counter\n            time.sleep(0)\n            safe_counter = current + 1\n\nfor target in (unsafe_add, safe_add):\n    threads = [threading.Thread(target=target, args=(2000,)) for _ in range(4)]\n    for t in threads: t.start()\n    for t in threads: t.join()\n\nprint(\"expected 8000 | without lock:\", counter, \"| with lock:\", safe_counter)\nprint(\"switch interval:\", sys.getswitchinterval(), \"seconds\")\nprint(\"free-threaded build:\", not getattr(sys, \"_is_gil_enabled\", lambda: True)())"}, {"t": "steps", "title": "A lost update between two threads", "steps": [{"c": "Both threads want to add 1 to a counter that holds 5. Thread A reads it.", "cols": [["Thread A", ["read 5"]], ["Thread B", ["waiting"]], ["Counter", ["5"]]]}, {"c": "The interpreter switches threads before A stores its result. B reads the same value.", "cols": [["Thread A", ["paused", "holding 5"]], ["Thread B", ["read 5"]], ["Counter", ["5"]]]}, {"c": "B stores 6.", "cols": [["Thread A", ["paused", "holding 5"]], ["Thread B", ["stored 6"]], ["Counter", ["6"]]]}, {"c": "A resumes and stores 5 + 1. B's update is overwritten. Two increments, one result.", "cols": [["Thread A", ["stored 6"]], ["Thread B", ["done"]], ["Counter", ["6 (should be 7)"]]]}]}, {"t": "table", "title": "What releases the GIL", "rows": [["Activity", "GIL released", "Threads help"], ["Network and disk I/O, `time.sleep`", "Yes", "Yes"], ["NumPy maths, `hashlib`, `zlib`, image libraries", "Yes, inside the C code", "Yes"], ["Pure Python loops and arithmetic", "Only at switch intervals", "No"], ["`asyncio` coroutines", "Not relevant: one thread", "Not applicable"]]}, {"t": "quiz", "title": "", "items": [["What is the GIL?", "A lock in CPython that lets only one thread execute Python bytecode at a time. It keeps the interpreter's memory management simple and safe, at the cost of no parallel Python code within one process."], ["If there is a GIL, why use threads at all?", "A thread releases the GIL while it waits on I/O. So many network or disk waits can overlap, which is the common case in a backend."], ["Threading versus multiprocessing versus asyncio?", "Threads: I/O-bound work with blocking libraries. Multiprocessing: CPU-bound work, real parallelism, higher memory and copying cost. Asyncio: very many I/O-bound tasks in one thread with async libraries."], ["Is the GIL going away?", "Python 3.13 added an optional free-threaded build without the GIL, and work continues on it. The default build that most servers run still has the GIL, so the guidance above still applies."], ["Why does CPython have a GIL?", "To protect reference counts and interpreter state without fine-grained locks. It keeps single-threaded code fast and C extensions simple."], ["Does the GIL make my code thread-safe?", "No. It protects the interpreter, not your data. A thread switch can occur between the steps of a compound operation, so shared state still needs locks."], ["What is a race condition?", "A bug where the result depends on the timing of threads or tasks, typically a read-modify-write on shared data without synchronisation."], ["What is a deadlock and how do you avoid it?", "Two threads each hold a lock the other needs, so both wait forever. Avoid it by always acquiring locks in the same order, holding them briefly and using timeouts."], ["What is free-threaded Python?", "An optional build, available from Python 3.13, that removes the GIL so threads can run Python code in parallel. It is not yet the default, and libraries must support it."]]}]}, {"id": "py-async", "title": "async, await and the event loop", "level": "Advanced", "mins": "40 min", "blocks": [{"t": "plain", "title": "", "text": "`asyncio` runs many tasks in **one thread**. A task runs until it reaches an `await` on something slow. At that point it steps aside and the **event loop** runs another task. When the slow thing finishes, the loop resumes the first task from the line where it stopped.\n\nNothing runs in parallel. Tasks take turns, and the turns change only at `await`. That makes it cheap to hold thousands of open connections, which is exactly what a busy API or a streaming AI endpoint needs."}, {"t": "analogy", "title": "", "text": "One waiter, many tables. The waiter takes an order, hands it to the kitchen and serves another table instead of standing at the pass. A blocking call is the waiter standing still at the pass, and every table waits."}, {"t": "bridge", "title": "", "text": "The syntax matches Swift and Dart. A coroutine is a `Future` / async function result. `asyncio.gather` is `Future.wait` in Dart and `async let` or a task group in Swift. The event loop is the Dart event loop. The big difference from Swift: there is no thread pool behind it, so one blocking call freezes everything."}, {"t": "code", "lang": "python", "title": "", "code": "import asyncio, time\n\nasync def fetch(name: str, seconds: float) -> str:\n    print(f\"start {name}\")\n    await asyncio.sleep(seconds)          # stands in for a network call\n    print(f\"done  {name}\")\n    return name\n\nasync def product_page() -> None:\n    start = time.perf_counter()\n    price, stock, reviews = await asyncio.gather(\n        fetch(\"price\", 0.3), fetch(\"stock\", 0.2), fetch(\"reviews\", 0.3)\n    )\n    print(f\"all three in {time.perf_counter() - start:.2f}s\")\n\n    try:                                   # never wait forever on another service\n        async with asyncio.timeout(0.1):\n            await fetch(\"slow-recommendations\", 1.0)\n    except TimeoutError:\n        print(\"recommendations skipped\")\n\n    limit = asyncio.Semaphore(2)           # at most two at a time\n    async def limited(i: int) -> str:\n        async with limit:\n            return await fetch(f\"job{i}\", 0.05)\n    await asyncio.gather(*(limited(i) for i in range(4)))\n\nasyncio.run(product_page())"}, {"t": "steps", "title": "The event loop with three tasks", "steps": [{"c": "`gather` schedules three tasks. The loop picks the first.", "cols": [["Running now", ["price"]], ["Paused at await", []], ["Ready to resume", []]]}, {"c": "`price` reaches `await sleep` and steps aside. The loop starts `stock`, then `reviews`.", "cols": [["Running now", ["reviews"]], ["Paused at await", ["price", "stock"]], ["Ready to resume", []]]}, {"c": "All three are waiting. The loop sleeps until a timer fires. Total waiting overlaps.", "cols": [["Running now", ["(loop idle)"]], ["Paused at await", ["price", "stock", "reviews"]], ["Ready to resume", []]]}, {"c": "After 0.2 s the `stock` timer fires. The loop resumes it from its `await` line.", "cols": [["Running now", ["stock"]], ["Paused at await", ["price", "reviews"]], ["Ready to resume", []]]}, {"c": "After 0.3 s the other two are ready. They resume one after the other. `gather` returns all three results.", "cols": [["Running now", ["price"]], ["Paused at await", []], ["Ready to resume", ["reviews"]]]}]}, {"t": "flow", "title": "One request in an async server", "lanes": [{"name": "", "nodes": [{"n": "Request arrives"}, {"a": ""}, {"n": "Handler coroutine starts"}, {"a": ""}, {"n": "await database query"}, {"a": ""}, {"n": "*Loop serves other requests meanwhile"}, {"a": ""}, {"n": "Query result arrives"}, {"a": ""}, {"n": "Handler resumes"}, {"a": ""}, {"n": "Response sent"}]}]}, {"t": "pitfalls", "title": "", "items": ["Calling a blocking function inside `async def`: `time.sleep`, `requests.get`, a sync database driver. It freezes every request on that worker. Use the async version or `await asyncio.to_thread(func)`.", "Forgetting `await`. You get a coroutine object and a \"never awaited\" warning, and the work does not happen.", "Awaiting calls one by one when they could run together with `gather`.", "Launching 10,000 tasks at once against one service. Limit with a semaphore."]}, {"t": "deep", "title": "Tasks, cancellation, structured concurrency and blocking code", "text": "Calling an `async def` function does not run it. It returns a **coroutine object**. Something has to drive it: `await` runs it now and waits, while `asyncio.create_task` schedules it on the loop to run in the background and returns a **task** you can await or cancel later.\n\nA `TaskGroup` starts several tasks and guarantees that when the block ends, every task has finished or been cancelled. If one fails, the others are cancelled and the error is raised. This is **structured concurrency**: no task outlives the block that started it.\n\n**Cancellation** arrives as a `CancelledError` raised at the task's current `await`. Clean up in `finally` and let it propagate. For a blocking library with no async version, `asyncio.to_thread` runs it in a worker thread so the loop stays free."}, {"t": "code", "lang": "python", "title": "", "code": "import asyncio, time\n\nasync def fetch(name, seconds, fail=False):\n    try:\n        await asyncio.sleep(seconds)\n        if fail:\n            raise ConnectionError(f\"{name} is down\")\n        return name\n    except asyncio.CancelledError:\n        print(f\"  {name} cancelled, cleaning up\")\n        raise                                  # always re-raise cancellation\n\ndef legacy_blocking_lookup(pincode):           # a sync library call\n    time.sleep(0.2)\n    return f\"zone-{pincode[:3]}\"\n\nasync def main():\n    coro = fetch(\"never-awaited\", 0)\n    print(type(coro).__name__)                 # coroutine: nothing has run\n    coro.close()\n\n    task = asyncio.create_task(fetch(\"background\", 0.05))      # starts running now\n    print(\"task done yet?\", task.done())\n    print(await task)\n\n    try:\n        async with asyncio.TaskGroup() as group:               # all succeed or all are cancelled\n            group.create_task(fetch(\"price\", 0.3))\n            group.create_task(fetch(\"stock\", 0.1, fail=True))\n    except* ConnectionError as errors:\n        print(\"group failed:\", [str(e) for e in errors.exceptions])\n\n    results = await asyncio.gather(fetch(\"a\", 0.05), fetch(\"b\", 0.05, fail=True), return_exceptions=True)\n    print([r if isinstance(r, str) else type(r).__name__ for r in results])\n\n    start = time.perf_counter()\n    zone, _ = await asyncio.gather(asyncio.to_thread(legacy_blocking_lookup, \"560103\"), asyncio.sleep(0.2))\n    print(zone, f\"in {time.perf_counter() - start:.2f}s (loop was never blocked)\")\n\n    slow = asyncio.create_task(fetch(\"slow\", 5))\n    await asyncio.sleep(0.01)\n    slow.cancel()\n    try:\n        await slow\n    except asyncio.CancelledError:\n        print(\"caller saw the cancellation\")\n\nasyncio.run(main())"}, {"t": "steps", "title": "What the event loop really does", "steps": [{"c": "The loop keeps a queue of callbacks that are ready, and asks the operating system which sockets and timers have become ready.", "cols": [["Ready queue", ["task A", "task B"]], ["Waiting on OS (selector)", []], ["Timers", []]]}, {"c": "Task A runs until it awaits a database reply. The loop registers its socket with the OS and moves on.", "cols": [["Ready queue", ["task B"]], ["Waiting on OS (selector)", ["A's socket"]], ["Timers", []]]}, {"c": "Task B runs until `await asyncio.sleep(0.1)`. A timer is recorded. The ready queue is now empty.", "cols": [["Ready queue", []], ["Waiting on OS (selector)", ["A's socket"]], ["Timers", ["B in 100 ms"]]]}, {"c": "With nothing ready, the loop sleeps inside one OS call until a socket has data or the nearest timer is due. No CPU is used.", "cols": [["Ready queue", []], ["Waiting on OS (selector)", ["A's socket"]], ["Timers", ["B in 100 ms"]]]}, {"c": "The database replies. The OS wakes the loop, and task A goes back on the ready queue to continue after its `await`.", "cols": [["Ready queue", ["task A"]], ["Waiting on OS (selector)", []], ["Timers", ["B in 60 ms"]]]}]}, {"t": "table", "title": "Ways to run several things", "rows": [["Tool", "Behaviour on failure", "Use for"], ["`await a(); await b()`", "Stops at the first error", "Steps that depend on each other"], ["`asyncio.gather(a(), b())`", "Raises the first error, others keep running", "Independent calls, simple cases"], ["`gather(..., return_exceptions=True)`", "Returns errors as values", "Partial results are acceptable"], ["`async with TaskGroup()`", "Cancels the rest, raises an exception group", "The default for new code"], ["`asyncio.timeout(s)`", "Cancels the body and raises `TimeoutError`", "Every call to another service"], ["`asyncio.Semaphore(n)`", "n at a time", "Protecting a dependency"], ["`asyncio.to_thread(f)`", "Runs f in a thread", "Blocking libraries"]]}, {"t": "quiz", "title": "", "items": [["How does asyncio differ from threads?", "Asyncio runs tasks in one thread and switches only at `await`, so switches are explicit and cheap. Threads are switched by the operating system at any moment and cost more memory each."], ["What happens if you call blocking code in a coroutine?", "The event loop cannot switch away, so every other task waits. Run the blocking call in a thread with `asyncio.to_thread` or use an async library."], ["What is the difference between a coroutine and a task?", "Calling an `async def` returns a coroutine, which does nothing until awaited. A task wraps a coroutine and schedules it on the loop so it runs in the background."], ["When is async the wrong choice?", "For CPU-heavy work, and when the libraries you need have no async support. Async gives no speed-up to computation."], ["Coroutine versus task versus future?", "A coroutine is the object returned by calling an `async def` function and does nothing until driven. A task wraps a coroutine and runs it on the event loop. A future is a low-level placeholder for a result, and a task is a kind of future."], ["How does cancellation work in asyncio?", "`task.cancel()` causes `CancelledError` to be raised inside the task at its current await point. The task should clean up in `finally` and re-raise."], ["What is structured concurrency?", "Tasks are started inside a block that does not exit until all of them have finished, so no task leaks and errors are not lost. `asyncio.TaskGroup` provides it."], ["How do you call blocking code from async code?", "`await asyncio.to_thread(func, args)` runs it in a thread pool so the event loop is not blocked. Prefer a native async library when one exists."], ["How does the event loop know a socket is ready?", "It registers sockets with the operating system's readiness API (epoll on Linux, kqueue on macOS) through the `selectors` module and waits in one system call."]]}]}]}, {"name": "Stage 5 · Backend", "sub": "From a function to a deployed API", "lessons": [{"id": "py-http", "title": "HTTP, and calling other services", "level": "Intermediate", "mins": "30 min", "blocks": [{"t": "plain", "title": "", "text": "HTTP is the conversation between a client and a server. The client sends a **request**: a method (`GET`, `POST`, ...), a path, headers and sometimes a body. The server sends back a **response**: a status code, headers and a body, usually JSON.\n\nYou have been the client for years. As a backend developer you sit on the other side, and your server is also a client of other servers: payment gateways, inventory, AI models. `httpx` is the standard library for those outgoing calls."}, {"t": "bridge", "title": "", "text": "`httpx.Client` is your `URLSession` / Dio instance: create one, reuse it, set a base URL, default headers and a timeout. `raise_for_status()` is the check you write by hand on `HTTPURLResponse.statusCode`."}, {"t": "table", "title": "Status codes you will return every day", "rows": [["Code", "Meaning", "Typical use"], ["200 / 201 / 204", "OK / created / no content", "Success"], ["400 / 422", "Bad request / failed validation", "The client sent wrong data"], ["401 / 403", "Not logged in / not allowed", "Auth"], ["404 / 409", "Not found / conflict", "Missing order, out of stock"], ["429", "Too many requests", "Rate limit"], ["500 / 502 / 503 / 504", "Server bug / bad gateway / unavailable / timeout", "Your fault or a dependency's"]]}, {"t": "code", "lang": "python", "title": "", "code": "import httpx\n\ndef fake_inventory(request: httpx.Request) -> httpx.Response:   # stands in for a real service\n    if request.url.path == \"/stock/milk\":\n        return httpx.Response(200, json={\"sku\": \"milk\", \"available\": 12})\n    return httpx.Response(404, json={\"detail\": \"unknown sku\"})\n\nclient = httpx.Client(\n    base_url=\"https://inventory.internal\",\n    timeout=2.0,                                   # never call without a timeout\n    transport=httpx.MockTransport(fake_inventory), # remove this line to hit a real server\n)\n\nresponse = client.get(\"/stock/milk\", headers={\"Authorization\": \"Bearer demo\"})\nprint(response.status_code, response.headers[\"content-type\"], response.json()[\"available\"])\n\nmissing = client.get(\"/stock/ghee\")\ntry:\n    missing.raise_for_status()\nexcept httpx.HTTPStatusError as err:\n    print(\"inventory said:\", err.response.status_code, err.response.json())"}, {"t": "flow", "title": "One request, end to end", "lanes": [{"name": "", "nodes": [{"n": "Phone app"}, {"a": ""}, {"n": "DNS and TLS"}, {"a": ""}, {"n": "Load balancer"}, {"a": ""}, {"n": "*Your Python server"}, {"a": ""}, {"n": "Database or another service"}, {"a": ""}, {"n": "JSON response"}, {"a": ""}, {"n": "Phone app"}]}]}, {"t": "real", "title": "", "text": "Checkout calls the payment gateway. The gateway is slow today and takes 30 seconds. Without a timeout, every worker on your server ends up stuck waiting, and the whole API goes down because of someone else's outage. With `timeout=2.0`, a retry with backoff for safe requests, and a clear error to the user, your API stays up."}, {"t": "pitfalls", "title": "", "items": ["No timeout on outgoing calls. This is the most common cause of cascading outages.", "Retrying a `POST` that is not idempotent, which can charge a customer twice. Send an idempotency key.", "Creating a new client per request. Reuse one client so connections are pooled.", "Using blocking `requests` or `httpx.Client` inside `async def`. Use `httpx.AsyncClient` there."]}, {"t": "quiz", "title": "", "items": [["What is the difference between PUT and PATCH?", "PUT replaces the whole resource with the body you send. PATCH changes only the fields you send."], ["What does idempotent mean?", "Doing the request twice has the same effect as doing it once. GET, PUT and DELETE should be idempotent. POST usually is not, which is why retries need an idempotency key."], ["What is the difference between 401 and 403?", "401 means the server does not know who you are. 403 means it knows and you are not allowed."], ["Why reuse an HTTP client?", "It keeps a pool of open connections, so later requests skip the TCP and TLS handshakes."]]}]}, {"id": "py-fastapi", "title": "Your first API with FastAPI", "level": "Intermediate", "mins": "40 min", "blocks": [{"t": "plain", "title": "", "text": "FastAPI turns a Python function into an HTTP endpoint. A decorator gives the method and path. The function's parameters describe what the endpoint needs: values in the path, the query string or the JSON body. FastAPI reads the type hints, validates the incoming data and sends a 422 error by itself when it is wrong.\n\nIt also writes interactive documentation for you at `/docs`."}, {"t": "analogy", "title": "", "text": "FastAPI is the receptionist. It checks the visitor's form is filled in correctly, routes them to the right desk (your function) and hands back the reply in the right envelope."}, {"t": "bridge", "title": "", "text": "You have called endpoints like `POST /orders` from Dio. This is the other side of that call. The Pydantic model for the body is the same thing as your `Codable` request struct, used for decoding instead of encoding."}, {"t": "code", "lang": "python", "title": "", "code": "from fastapi import FastAPI, HTTPException\nfrom fastapi.testclient import TestClient\nfrom pydantic import BaseModel, Field\n\napp = FastAPI(title=\"Shop API\")\nORDERS: dict[int, dict] = {}          # stands in for a database\n\nclass OrderIn(BaseModel):\n    sku: str = Field(min_length=1)\n    qty: int = Field(gt=0, le=20)\n\nclass OrderOut(OrderIn):\n    id: int\n    status: str\n\n@app.get(\"/health\")\ndef health() -> dict:\n    return {\"ok\": True}\n\n@app.post(\"/orders\", response_model=OrderOut, status_code=201)\ndef create_order(body: OrderIn) -> dict:\n    order = {\"id\": len(ORDERS) + 1, \"status\": \"placed\", **body.model_dump()}\n    ORDERS[order[\"id\"]] = order\n    return order\n\n@app.get(\"/orders/{order_id}\", response_model=OrderOut)\ndef get_order(order_id: int) -> dict:\n    if order_id not in ORDERS:\n        raise HTTPException(status_code=404, detail=\"Order not found\")\n    return ORDERS[order_id]\n\nclient = TestClient(app)              # calls the app without starting a server\nprint(client.post(\"/orders\", json={\"sku\": \"milk\", \"qty\": 2}).json())\nprint(client.get(\"/orders/1\").status_code, client.get(\"/orders/99\").json())\nprint(client.post(\"/orders\", json={\"sku\": \"milk\", \"qty\": 0}).status_code)   # 422, no code written"}, {"t": "code", "lang": "bash", "title": "Run it for real", "code": "pip install \"fastapi[standard]\"\nfastapi dev main.py            # reloads on save, docs at http://127.0.0.1:8000/docs"}, {"t": "steps", "title": "Life of `POST /orders`", "steps": [{"c": "The server (uvicorn) receives raw bytes and parses the HTTP request.", "cols": [["Layer working", ["uvicorn"]], ["Data shape", ["bytes"]]]}, {"c": "FastAPI matches method and path to `create_order`.", "cols": [["Layer working", ["router"]], ["Data shape", ["path + JSON text"]]]}, {"c": "The body is validated against `OrderIn`. If `qty` is 0 the request stops here with a 422.", "cols": [["Layer working", ["Pydantic"]], ["Data shape", ["OrderIn object"]]]}, {"c": "Your function runs with a typed, trusted object.", "cols": [["Layer working", ["your code"]], ["Data shape", ["dict to return"]]]}, {"c": "The return value is filtered through `OrderOut` and turned into JSON.", "cols": [["Layer working", ["response model"]], ["Data shape", ["JSON", "status 201"]]]}]}, {"t": "flow", "title": "Request path", "lanes": [{"name": "", "nodes": [{"n": "Client"}, {"a": ""}, {"n": "uvicorn (ASGI server)"}, {"a": ""}, {"n": "Middleware"}, {"a": ""}, {"n": "Router"}, {"a": ""}, {"n": "Validation"}, {"a": ""}, {"n": "*Your function"}, {"a": ""}, {"n": "Response model"}, {"a": ""}, {"n": "Client"}]}]}, {"t": "pitfalls", "title": "", "items": ["Keeping state in a module-level dict in production. Each worker process has its own copy and it is lost on restart. Use a database.", "Returning database objects directly and leaking internal fields. Always set a `response_model`.", "Writing `async def` handlers that call blocking libraries. Use plain `def` (FastAPI runs it in a thread pool) or use async libraries."]}, {"t": "deep", "title": "Dependencies with cleanup, middleware, lifespan and background tasks", "text": "Four features carry most real FastAPI apps.\n\nA **dependency with `yield`** gives a resource to the handler and cleans it up afterwards, like a context manager. This is how each request gets its own database session that is always closed.\n\n**Middleware** wraps every request: it runs code before the handler and after it. Use it for request ids, timing and logging.\n\n**Lifespan** runs once when the server starts and once when it stops. Open shared resources there: the database pool, an HTTP client, a model client.\n\nA **background task** runs after the response has been sent. It is fine for small follow-up work. Anything that must not be lost belongs in a real queue."}, {"t": "code", "lang": "python", "title": "", "code": "import time, uuid\nfrom contextlib import asynccontextmanager\nfrom fastapi import BackgroundTasks, Depends, FastAPI, Request\nfrom fastapi.testclient import TestClient\n\nevents: list[str] = []\n\n@asynccontextmanager\nasync def lifespan(app: FastAPI):\n    app.state.pool = \"db-pool\"                 # open pools and clients once\n    events.append(\"startup\")\n    yield\n    events.append(\"shutdown\")                  # close them on the way out\n\napp = FastAPI(lifespan=lifespan)\n\n@app.middleware(\"http\")\nasync def request_context(request: Request, call_next):\n    request.state.request_id = uuid.uuid4().hex[:8]\n    start = time.perf_counter()\n    events.append(\"middleware before\")\n    response = await call_next(request)        # everything below runs inside this call\n    events.append(\"middleware after\")\n    response.headers[\"x-request-id\"] = request.state.request_id\n    response.headers[\"x-duration-ms\"] = f\"{(time.perf_counter() - start) * 1000:.1f}\"\n    return response\n\ndef get_session(request: Request):\n    events.append(\"session open\")\n    try:\n        yield {\"pool\": request.app.state.pool}  # the handler runs while we are paused here\n    finally:\n        events.append(\"session closed\")         # runs even if the handler raised\n\ndef current_user(request: Request) -> dict:\n    return {\"id\": int(request.headers.get(\"x-user-id\", 0))}\n\ndef send_receipt(order_id: int) -> None:\n    events.append(f\"receipt sent for {order_id}\")\n\n@app.post(\"/orders\", status_code=201)\ndef create_order(tasks: BackgroundTasks, session: dict = Depends(get_session), user: dict = Depends(current_user)):\n    events.append(f\"handler ran for user {user['id']} using {session['pool']}\")\n    tasks.add_task(send_receipt, 184)           # runs after the response is sent\n    return {\"id\": 184}\n\nwith TestClient(app) as client:                 # the with block triggers lifespan\n    response = client.post(\"/orders\", headers={\"x-user-id\": \"7\"})\n    print(response.status_code, response.json(), \"request id length:\", len(response.headers[\"x-request-id\"]))\nprint(events)"}, {"t": "steps", "title": "Order of execution for one request", "steps": [{"c": "Server start: lifespan code before `yield` runs once.", "cols": [["Running", ["lifespan startup"]], ["Events so far", ["startup"]]]}, {"c": "A request arrives. Middleware code before `call_next` runs.", "cols": [["Running", ["middleware (before)"]], ["Events so far", ["startup", "middleware before"]]]}, {"c": "Dependencies are resolved. `get_session` runs up to its `yield`.", "cols": [["Running", ["get_session (setup)"]], ["Events so far", ["...", "middleware before", "session open"]]]}, {"c": "The handler runs with its dependencies and returns.", "cols": [["Running", ["create_order"]], ["Events so far", ["...", "session open", "handler ran"]]]}, {"c": "Middleware code after `call_next` adds headers, and the response goes out.", "cols": [["Running", ["middleware (after)"]], ["Events so far", ["...", "handler ran", "middleware after"]]]}, {"c": "The background task runs. The client already has its response.", "cols": [["Running", ["send_receipt"]], ["Events so far", ["...", "middleware after", "receipt sent"]]]}, {"c": "The dependency resumes after its `yield` and cleans up. This is the order the sample prints on the installed FastAPI version; it has changed between versions, so never use the request's session inside a background task.", "cols": [["Running", ["get_session (cleanup)"]], ["Events so far", ["...", "receipt sent", "session closed"]]]}]}, {"t": "table", "title": "`def` or `async def`", "rows": [["Handler does", "Declare it as", "Why"], ["Awaits async libraries only", "`async def`", "Runs on the event loop"], ["Calls blocking libraries (sync DB driver, `requests`)", "`def`", "FastAPI runs it in a thread pool (about 40 threads)"], ["CPU-heavy work", "Neither: send to a worker or queue", "It would block a thread or the loop"]]}, {"t": "quiz", "title": "", "items": [["How does FastAPI know where a parameter comes from?", "A name that appears in the path is a path parameter. A simple type not in the path is a query parameter. A Pydantic model is the JSON body."], ["What is ASGI?", "The standard interface between async Python web apps and servers. Uvicorn is an ASGI server and FastAPI is an ASGI application. WSGI is the older, synchronous equivalent used by Flask and Django."], ["When do you use `def` and when `async def` for an endpoint?", "`async def` when everything inside is awaited async I/O. Plain `def` when you call blocking code, because FastAPI then runs it in a worker thread."], ["FastAPI versus Flask versus Django?", "FastAPI: async, typed, validation and docs built in, the usual pick for APIs and AI services. Flask: minimal and synchronous, you add everything. Django: a full framework with ORM, admin and auth, best for large database-driven products."], ["What is a dependency with `yield` used for?", "Setup and teardown around a request, typically a database session: code before `yield` provides the resource and code after it releases it, even on errors."], ["What is the difference between middleware and a dependency?", "Middleware wraps every request and works with the raw request and response. A dependency is declared per route, can return a value to the handler and can depend on other dependencies."], ["When are background tasks not enough?", "When the work must survive a crash or restart, needs retries or is heavy. They run in the same process after the response, so use a queue and worker for those."], ["What happens if a blocking call is made in an `async def` endpoint?", "It blocks the event loop, so every other request on that worker waits. Use a plain `def` endpoint or `asyncio.to_thread`."]]}]}, {"id": "py-pydantic", "title": "Validation with Pydantic", "level": "Intermediate", "mins": "25 min", "blocks": [{"t": "plain", "title": "", "text": "Never trust data from outside: a phone, another service, a file or a language model. Pydantic models describe the shape you expect. Creating a model from raw data **validates and converts** it. You either get a correct typed object or a precise list of what was wrong.\n\nThis one library sits at every boundary of a Python backend: request bodies, responses, settings and the structured output of AI models."}, {"t": "bridge", "title": "", "text": "It is `Codable` / `json_serializable` with rules attached: lengths, ranges, patterns and custom checks, plus automatic conversion such as `\"7\"` to `7` and an ISO string to `datetime`."}, {"t": "code", "lang": "python", "title": "", "code": "from datetime import datetime\nfrom pydantic import BaseModel, Field, ValidationError, field_validator\n\nclass Address(BaseModel):\n    pincode: str = Field(pattern=r\"^\\d{6}$\")\n    line1: str\n\nclass OrderRequest(BaseModel):\n    user_id: int\n    items: list[str] = Field(min_length=1)\n    address: Address\n    coupon: str | None = None\n    placed_at: datetime\n\n    @field_validator(\"coupon\")\n    @classmethod\n    def upper_coupon(cls, value: str | None) -> str | None:\n        return value.upper() if value else value\n\npayload = {\n    \"user_id\": \"7\", \"items\": [\"milk\"], \"coupon\": \"first50\",\n    \"address\": {\"pincode\": \"560103\", \"line1\": \"12 MG Road\"},\n    \"placed_at\": \"2026-11-10T09:30:00\",\n}\norder = OrderRequest.model_validate(payload)\nprint(order.user_id, type(order.user_id).__name__, order.coupon, order.placed_at.year)\nprint(order.model_dump_json())\n\ntry:\n    OrderRequest.model_validate({**payload, \"items\": [], \"address\": {\"pincode\": \"56\", \"line1\": \"x\"}})\nexcept ValidationError as err:\n    for problem in err.errors():\n        print(problem[\"loc\"], \"->\", problem[\"msg\"])"}, {"t": "flow", "title": "The trust boundary", "lanes": [{"name": "", "nodes": [{"n": "Untrusted JSON"}, {"a": ""}, {"n": "Pydantic model"}, {"a": ""}, {"n": "Valid?"}, {"a": "no"}, {"n": "422 with field-level errors"}]}, {"name": "", "nodes": [{"n": "Valid?"}, {"a": "yes"}, {"n": "Typed object"}, {"a": ""}, {"n": "Business code can assume it is correct"}]}]}, {"t": "real", "title": "", "text": "A phone on an old app version sends `qty` as the string \"2\" and leaves out a new field. Pydantic converts the string and applies the default for the missing field, so old and new app versions both work against one server. That is the backward compatibility problem you know from the client side, solved at the server."}, {"t": "pitfalls", "title": "", "items": ["Validating by hand with `if` chains scattered across the handler.", "Using one model for the request, the database row and the response. Keep them separate so internal fields never leak.", "Forgetting that validation costs CPU. Do it once at the boundary, not again in every function."]}, {"t": "deep", "title": "Cross-field rules, unions by a tag, strict mode and settings", "text": "Real request bodies need more than per-field checks.\n\nA **model validator** checks several fields together, for example \"wallet amount cannot exceed the order total\". A **discriminated union** picks the right model from a tag field such as `method`, the same idea as an enum with associated values. A **computed field** is derived from others and included in the output.\n\n`extra=\"forbid\"` rejects unknown fields, which blocks clients from sneaking in something like `isAdmin`. An **alias generator** lets your Python code use `snake_case` while the JSON uses `camelCase`. **Strict mode** turns off the friendly conversions, so the string `\"709\"` is no longer accepted for an integer.\n\n`pydantic-settings` applies the same validation to environment variables, which gives you typed, validated configuration at startup."}, {"t": "code", "lang": "python", "title": "", "code": "import os\nfrom typing import Annotated, Literal\nfrom pydantic import BaseModel, ConfigDict, Field, ValidationError, computed_field, model_validator\nfrom pydantic.alias_generators import to_camel\nfrom pydantic_settings import BaseSettings, SettingsConfigDict\n\nclass Card(BaseModel):\n    method: Literal[\"card\"]\n    last4: str = Field(pattern=r\"^\\d{4}$\")\n\nclass Upi(BaseModel):\n    method: Literal[\"upi\"]\n    vpa: str\n\nclass CashOnDelivery(BaseModel):\n    method: Literal[\"cod\"]\n\nPayment = Annotated[Card | Upi | CashOnDelivery, Field(discriminator=\"method\")]\n\nclass Checkout(BaseModel):\n    model_config = ConfigDict(alias_generator=to_camel, populate_by_name=True, extra=\"forbid\", frozen=True)\n\n    order_total: int = Field(gt=0)            # paise\n    wallet_used: int = Field(default=0, ge=0)\n    payment: Payment\n\n    @model_validator(mode=\"after\")\n    def wallet_within_total(self) -> \"Checkout\":\n        if self.wallet_used > self.order_total:\n            raise ValueError(\"walletUsed cannot exceed orderTotal\")\n        return self\n\n    @computed_field\n    @property\n    def amount_due(self) -> int:\n        return self.order_total - self.wallet_used\n\nbody = {\"orderTotal\": 70900, \"walletUsed\": 900, \"payment\": {\"method\": \"upi\", \"vpa\": \"asha@bank\"}}\ncheckout = Checkout.model_validate(body)\nprint(type(checkout.payment).__name__, checkout.amount_due, checkout.model_dump(by_alias=True))\n\nbad_bodies = {\n    \"unknown field\": {**body, \"isAdmin\": True},\n    \"wrong payment shape\": {**body, \"payment\": {\"method\": \"card\", \"vpa\": \"x\"}},\n    \"unknown method\": {**body, \"payment\": {\"method\": \"crypto\"}},\n    \"cross-field rule\": {**body, \"walletUsed\": 80000},\n}\nfor label, bad in bad_bodies.items():\n    try:\n        Checkout.model_validate(bad)\n    except ValidationError as err:\n        first = err.errors()[0]\n        print(f\"{label}: {'.'.join(str(p) for p in first['loc']) or '(model)'} -> {first['msg'][:60]}\")\n\ntry:\n    Checkout.model_validate({**body, \"orderTotal\": \"70900\"}, strict=True)\nexcept ValidationError as err:\n    print(\"strict mode:\", err.errors()[0][\"msg\"])\nprint(\"schema fields:\", list(Checkout.model_json_schema(mode=\"serialization\")[\"properties\"]))\n\nclass Settings(BaseSettings):\n    model_config = SettingsConfigDict(env_prefix=\"SHOP_\")\n    database_url: str\n    free_delivery_above: int = 500\n\nos.environ[\"SHOP_DATABASE_URL\"] = \"postgresql://localhost/shop\"\nos.environ[\"SHOP_FREE_DELIVERY_ABOVE\"] = \"750\"\nprint(Settings())"}, {"t": "flow", "title": "Validation order inside one model", "lanes": [{"name": "", "nodes": [{"n": "Raw dict"}, {"a": ""}, {"n": "Alias lookup (orderTotal to order_total)"}, {"a": ""}, {"n": "Each field: convert and check constraints"}, {"a": ""}, {"n": "Tag selects the payment model"}, {"a": ""}, {"n": "Model validator checks fields together"}, {"a": ""}, {"n": "Frozen, typed object"}]}]}, {"t": "table", "title": "Model configuration worth knowing", "rows": [["Setting", "Effect"], ["`extra=\"forbid\"`", "Unknown fields are an error instead of being ignored"], ["`frozen=True`", "Instances cannot be changed and are hashable"], ["`alias_generator=to_camel`", "JSON uses camelCase, Python uses snake_case"], ["`strict=True`", "No type conversion: `\"7\"` is not an `int`"], ["`from_attributes=True`", "Build a model from an ORM object's attributes"]]}, {"t": "quiz", "title": "", "items": [["What happens when validation fails in FastAPI?", "Pydantic raises `ValidationError`, and FastAPI converts it into a 422 response listing each field and the reason."], ["What is the difference between `model_dump()` and `model_dump_json()`?", "The first returns a Python dict. The second returns a JSON string."], ["Why keep request and response models separate?", "They change for different reasons. The request model protects you from bad input, and the response model stops internal fields such as password hashes from leaving the server."], ["Field validator versus model validator?", "A field validator checks or transforms one field. A model validator runs on the whole model and is used for rules that involve several fields."], ["What is a discriminated union?", "A union of models that share a literal tag field. Pydantic reads the tag and validates against exactly that model, which gives clear errors and good performance."], ["Why set `extra=\"forbid\"` on request models?", "To reject unexpected fields. It catches client mistakes early and prevents mass-assignment style attacks."], ["What is strict mode?", "Validation without type coercion. Values must already have the declared type."], ["How do you manage configuration with Pydantic?", "Declare a `BaseSettings` class from `pydantic-settings`. It reads environment variables, converts and validates them, and fails at startup if something is missing."]]}]}, {"id": "py-db", "title": "Databases, SQL and SQLAlchemy", "level": "Intermediate", "mins": "45 min", "blocks": [{"t": "plain", "title": "", "text": "A relational database (PostgreSQL in most Python backends) stores rows in tables and links tables with keys. **SQL** is the language for asking it questions. An **ORM** such as SQLAlchemy lets you work with Python classes and writes the SQL for you.\n\nLearn enough SQL to read what the ORM produces. When a page is slow, the cause is almost always a query."}, {"t": "bridge", "title": "", "text": "This is Core Data or `sqflite` / Drift, on a server shared by every user at once. That sharing is why **transactions** (all or nothing), **indexes** (fast lookup) and **connection pools** (reuse of connections) matter far more than on a phone."}, {"t": "code", "lang": "sql", "title": "The SQL underneath", "code": "CREATE TABLE orders (id SERIAL PRIMARY KEY, city TEXT NOT NULL, status TEXT NOT NULL);\nCREATE TABLE order_items (\n  id SERIAL PRIMARY KEY,\n  order_id INT NOT NULL REFERENCES orders(id),\n  sku TEXT NOT NULL, price INT NOT NULL\n);\nCREATE INDEX idx_orders_city ON orders(city);        -- makes WHERE city = ... fast\n\nSELECT o.city, COUNT(*) AS orders, SUM(i.price) AS revenue\nFROM orders o JOIN order_items i ON i.order_id = o.id\nWHERE o.status = 'delivered'\nGROUP BY o.city ORDER BY revenue DESC LIMIT 5;\n\nEXPLAIN ANALYZE SELECT * FROM orders WHERE city = 'blr';   -- shows whether the index is used"}, {"t": "code", "lang": "python", "title": "", "code": "from sqlalchemy import ForeignKey, create_engine, func, select\nfrom sqlalchemy.orm import DeclarativeBase, Mapped, Session, mapped_column, relationship\n\nclass Base(DeclarativeBase):\n    pass\n\nclass Order(Base):\n    __tablename__ = \"orders\"\n    id: Mapped[int] = mapped_column(primary_key=True)\n    city: Mapped[str] = mapped_column(index=True)\n    status: Mapped[str] = mapped_column(default=\"placed\")\n    items: Mapped[list[\"OrderItem\"]] = relationship(back_populates=\"order\", cascade=\"all, delete-orphan\")\n\nclass OrderItem(Base):\n    __tablename__ = \"order_items\"\n    id: Mapped[int] = mapped_column(primary_key=True)\n    order_id: Mapped[int] = mapped_column(ForeignKey(\"orders.id\"))\n    sku: Mapped[str]\n    price: Mapped[int]\n    order: Mapped[Order] = relationship(back_populates=\"items\")\n\nengine = create_engine(\"sqlite://\")          # in memory; production: postgresql+psycopg://...\nBase.metadata.create_all(engine)\n\nwith Session(engine) as session, session.begin():      # one transaction: all or nothing\n    session.add(Order(city=\"blr\", items=[OrderItem(sku=\"milk\", price=6200), OrderItem(sku=\"bread\", price=4500)]))\n    session.add(Order(city=\"del\", items=[OrderItem(sku=\"ghee\", price=54000)]))\n\nwith Session(engine) as session:\n    blr = session.scalars(select(Order).where(Order.city == \"blr\")).all()\n    print([(o.id, o.status, len(o.items)) for o in blr])\n    revenue = session.execute(\n        select(Order.city, func.sum(OrderItem.price)).join(OrderItem).group_by(Order.city)\n    ).all()\n    print([tuple(row) for row in revenue])"}, {"t": "flow", "title": "A query's journey", "lanes": [{"name": "", "nodes": [{"n": "Python code"}, {"a": ""}, {"n": "ORM builds SQL with parameters"}, {"a": ""}, {"n": "Connection from the pool"}, {"a": ""}, {"n": "PostgreSQL plans (index or full scan)"}, {"a": ""}, {"n": "Rows"}, {"a": ""}, {"n": "ORM builds objects"}, {"a": ""}, {"n": "Connection returned to pool"}]}]}, {"t": "steps", "title": "A transaction that fails halfway", "steps": [{"c": "BEGIN. Nothing is visible to other users yet.", "cols": [["Pending in transaction", []], ["Saved in database", []]]}, {"c": "INSERT the order row.", "cols": [["Pending in transaction", ["order 186"]], ["Saved in database", []]]}, {"c": "INSERT two item rows.", "cols": [["Pending in transaction", ["order 186", "item milk", "item bread"]], ["Saved in database", []]]}, {"c": "UPDATE stock fails: not enough milk. An exception is raised.", "cols": [["Pending in transaction", ["order 186", "item milk", "item bread", "!stock update failed"]], ["Saved in database", []]]}, {"c": "ROLLBACK. Every pending change is thrown away. No half-order exists.", "cols": [["Pending in transaction", []], ["Saved in database", ["(nothing from this request)"]]]}]}, {"t": "pitfalls", "title": "", "items": ["The **N+1 query**: load 50 orders, then touch `order.items` in a loop and fire 50 more queries. Load them together with `selectinload` or a join.", "Building SQL with string formatting. Always pass parameters, which the ORM does for you.", "No index on a column used in `WHERE` or `JOIN`. Fine with 1,000 rows, a 5 second query with 10 million.", "Changing tables by hand in production. Use a migration tool (Alembic) so every change is a reviewed, versioned file."]}, {"t": "deep", "title": "N+1 measured, isolation levels and how an index works", "text": "An index is usually a **B-tree**: a sorted, shallow tree. Finding one row among ten million takes three or four page reads instead of reading the whole ta
