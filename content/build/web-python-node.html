})();

/* Renders a run into an output element. Returns the result. */
async function runInto(el, lang, code) {
  el.hidden = false;
  el.innerHTML = '<div class="out-h"><span class="out-s">Starting…</span></div><pre class="out"></pre>';
  const status = $('.out-s', el), pre = $('.out', el);
  let chars = 0;
  const emit = (kind, text) => {
    if (kind === 'status') { status.textContent = text; return; }
    if (chars > 60000) return;
    chars += text.length;
    const span = document.createElement('span');
    if (kind === 'err') span.className = 'e';
    span.textContent = chars > 60000 ? '\n… output cut at 60,000 characters' : text;
    pre.appendChild(span);
  };
  const r = await PG.run(lang, code, emit);
  if (r.blocked) { pre.textContent = ''; status.textContent = 'Cannot run in the browser'; emit('err', r.note); return r; }
  if (r.note) emit('err', (pre.textContent && !pre.textContent.endsWith('\n') ? '\n' : '') + r.note + '\n');
  if (!pre.textContent) emit('out', '(no output)');
  status.textContent = (r.ok ? 'Finished' : 'Finished with an error') + (r.ms !== undefined ? ' in ' + (r.ms < 1000 ? Math.round(r.ms) + ' ms' : (r.ms / 1000).toFixed(1) + ' s') : '');
  status.className = 'out-s ' + (r.ok ? 'ok' : 'bad');
  return r;
}

const PG_EXAMPLES = {
  python: [
    ['Cart total', 'cart = [("milk", 62, 2), ("bread", 45, 1), ("ghee", 540, 1)]\n\ntotal = 0\nfor name, price, qty in cart:\n    line = price * qty\n    total += line\n    print(f"{name:<6} {line:>5}")\n\nfee = 0 if total >= 500 else 40\nprint("total", total, "delivery", fee)\n'],
    ['Group with a dict', 'from collections import Counter, defaultdict\n\norders = [("blr", 320), ("del", 90), ("blr", 760), ("mum", 410)]\n\nby_city = defaultdict(list)\nfor city, amount in orders:\n    by_city[city].append(amount)\n\nprint(dict(by_city))\nprint({city: sum(v) for city, v in by_city.items()})\nprint(Counter(city for city, _ in orders).most_common(1))\n'],
    ['Class and dataclass', 'from dataclasses import dataclass, field\n\n@dataclass(frozen=True)\nclass Item:\n    sku: str\n    price: int\n    qty: int = 1\n\n@dataclass\nclass Cart:\n    items: list = field(default_factory=list)\n\n    def add(self, item):\n        self.items.append(item)\n        return self\n\n    @property\n    def total(self):\n        return sum(i.price * i.qty for i in self.items)\n\ncart = Cart().add(Item("milk", 62, 2)).add(Item("bread", 45))\nprint(cart.total)\nprint(cart)\n'],
    ['Generator pipeline', 'def read(lines):\n    for line in lines:\n        order_id, city, total = line.split(",")\n        yield {"id": int(order_id), "city": city, "total": int(total)}\n\ndef only(orders, city):\n    for order in orders:\n        if order["city"] == city:\n            yield order\n\nlines = ["1,blr,300", "2,del,90", "3,blr,760"]\nfor order in only(read(lines), "blr"):\n    print(order)\n'],
    ['Decorator', 'import functools\n\ndef log_calls(func):\n    @functools.wraps(func)\n    def wrapper(*args, **kwargs):\n        print("calling", func.__name__, args)\n        result = func(*args, **kwargs)\n        print("returned", result)\n        return result\n    return wrapper\n\n@log_calls\ndef delivery_fee(total, member=False):\n    return 0 if member or total >= 500 else 40\n\ndelivery_fee(300)\ndelivery_fee(900)\n'],
    ['Errors', 'class OutOfStock(Exception):\n    pass\n\nstock = {"milk": 3}\n\ndef reserve(sku, qty):\n    if stock.get(sku, 0) < qty:\n        raise OutOfStock(f"{sku}: wanted {qty}, have {stock.get(sku, 0)}")\n    stock[sku] -= qty\n\ntry:\n    reserve("milk", 2)\n    reserve("milk", 5)\nexcept OutOfStock as err:\n    print("sorry:", err)\nfinally:\n    print("stock now", stock)\n'],
  ],
  js: [
    ['Array pipeline', 'const cart = [\n  { sku: "milk", price: 62, qty: 2, inStock: true },\n  { sku: "ghee", price: 540, qty: 1, inStock: false },\n  { sku: "bread", price: 45, qty: 1, inStock: true },\n];\n\nconst available = cart.filter((item) => item.inStock);\nconst total = available.reduce((sum, { price, qty }) => sum + price * qty, 0);\n\nconsole.log(available.map((item) => item.sku), total);\nconsole.log({ ...cart[0], qty: 5 });\n'],
    ['Closure', 'function makeCounter(start = 0) {\n  let count = start;\n  return { next: () => ++count, reset: () => (count = start) };\n}\n\nconst ids = makeCounter(183);\nconsole.log(ids.next(), ids.next(), ids.next());\nids.reset();\nconsole.log(ids.next());\n'],
    ['Event loop order', 'console.log("A  synchronous");\n\nsetTimeout(() => console.log("D  timer"), 0);\nPromise.resolve().then(() => console.log("C  promise (microtask)"));\nqueueMicrotask(() => console.log("C2 microtask"));\n\nconsole.log("B  still synchronous");\n'],
    ['Sequential vs parallel', 'const wait = (ms, value) => new Promise((resolve) => setTimeout(() => resolve(value), ms));\n\nlet start = Date.now();\nconst price = await wait(300, 62);\nconst stock = await wait(300, 12);\nconsole.log("one after another:", Date.now() - start, "ms", price, stock);\n\nstart = Date.now();\nconst both = await Promise.all([wait(300, 62), wait(300, 12)]);\nconsole.log("together:", Date.now() - start, "ms", both);\n'],
    ['Errors with async', 'class OutOfStock extends Error {\n  constructor(sku) { super(sku + " is out of stock"); this.name = "OutOfStock"; }\n}\n\nasync function reserve(sku) {\n  if (sku === "ghee") throw new OutOfStock(sku);\n  return "reserved " + sku;\n}\n\nfor (const sku of ["milk", "ghee"]) {\n  try {\n    console.log(await reserve(sku));\n  } catch (err) {\n    console.log(err.name, "-", err.message);\n  }\n}\n'],
    ['Debounce', 'function debounce(fn, waitMs) {\n  let timer;\n  return (...args) => {\n    clearTimeout(timer);\n    timer = setTimeout(() => fn(...args), waitMs);\n  };\n}\n\nconst search = debounce((text) => console.log("search for", text), 200);\nsearch("m");\nsearch("mi");\nsearch("milk"); // only this one runs\n'],
  ],
};
const PG_NAME = { python: 'Python', js: 'JavaScript' };
const pgState = { lang: 'python', back: null };
const pgLoad = lang => { try { return localStorage.getItem('pna-pg-' + lang); } catch (e) { return null; } };
const pgSave = (lang, code) => { try { localStorage.setItem('pna-pg-' + lang, code); } catch (e) {} };

function openInPlayground(lang, code, backId) {
  pgState.lang = lang; pgState.back = backId || null;
  pgSave(lang, code);
  history.pushState(null, '', '#playground');
  showPlayground(true);
}

function showPlayground(scroll) {
  view = 'pg';
  document.body.dataset.track = 'pg';
  document.body.classList.add('pg');
  const lang = pgState.lang;
  const code = pgLoad(lang) ?? PG_EXAMPLES[lang][0][1];
  const back = pgState.back && byId[pgState.back];
  $('#lesson').innerHTML =
    '<div class="crumb"><span>Playground</span>' + (back ? '<a href="#' + back.l.id + '">Back to “' + esc(back.l.title.replace(/`/g, '')) + '”</a>' : '') + '</div>' +
    '<h1>Playground</h1>' +
    '<div class="prose"><p>Write code, press Run and see the output. Nothing is installed and nothing leaves this page.</p></div>' +
    '<div class="pg-bar">' +
      '<div class="seg" role="group" aria-label="Language">' + Object.keys(PG_NAME).map(l => '<button type="button" class="seg-b" data-lang="' + l + '" aria-pressed="' + (l === lang) + '">' + PG_NAME[l] + '</button>').join('') + '</div>' +
      '<label class="pg-ex">Load an example <select id="pg-example"><option value="">Choose…</option>' + PG_EXAMPLES[lang].map((e, i) => '<option value="' + i + '">' + esc(e[0]) + '</option>').join('') + '</select></label>' +
    '</div>' +
    '<textarea id="pg-code" class="pg-code" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="Code editor"></textarea>' +
    '<div class="ctl"><button class="btn main" type="button" id="pg-run">Run</button><button class="btn" type="button" id="pg-stop">Stop</button><button class="btn" type="button" id="pg-clear">Clear output</button><small>' + (/Mac|iPhone|iPad/.test(navigator.platform) ? '⌘' : 'Ctrl') + ' + Enter also runs</small></div>' +
    '<div class="runout" id="pg-out"><div class="out-h"><span class="out-s">Output appears here</span></div><pre class="out"></pre></div>' +
    '<div class="b-pit"><div class="b-label">What this playground can and cannot do</div><ul>' +
      (lang === 'python'
        ? '<li>Python runs through Brython, a Python 3 interpreter written in JavaScript. The language itself works: functions, classes, dataclasses, generators, decorators, comprehensions, exceptions, f-strings.</li><li>It is not CPython. Threads, processes, files, sockets and packages such as FastAPI, NumPy or SQLAlchemy are not available here. Run those samples with <code>python3</code> on your Mac.</li><li>It is slower than real Python, and an endless loop freezes this tab because there is no Stop for Python.</li>'
        : '<li>JavaScript runs in your browser’s own engine, the same V8 family that Node.js uses. The language works fully, including <code>await</code> at the top level, promises and timers.</li><li>Node’s own modules do not exist in a browser: <code>node:fs</code>, <code>node:http</code>, <code>Buffer</code>, <code>express</code> and so on. Run those samples with <code>node</code> on your Mac.</li><li>A run is stopped after 8 seconds. Objects are printed in a simplified form, so nesting may look slightly different from Node.</li>') +
    '</ul></div>';
  const area = $('#pg-code');
  area.value = code;
  area.addEventListener('input', () => pgSave(lang, area.value));
  area.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) { e.preventDefault(); $('#pg-run').click(); }
    else if (e.key === 'Tab' && !e.shiftKey && !e.altKey && !e.metaKey && !e.ctrlKey) {
      e.preventDefault();
      const s = area.selectionStart, pad = lang === 'python' ? '    ' : '  ';
      area.setRangeText(pad, s, area.selectionEnd, 'end');
      pgSave(lang, area.value);
    }
  });
  $('#pg-run').onclick = async () => {
    if (PG.isBusy()) return;
    $('#pg-run').disabled = true;
    try { await runInto($('#pg-out'), lang, area.value); } finally { const b = $('#pg-run'); if (b) b.disabled = false; }
  };
  $('#pg-stop').onclick = () => PG.stop();
  $('#pg-stop').hidden = lang === 'python';
  $('#pg-clear').onclick = () => { $('#pg-out').innerHTML = '<div class="out-h"><span class="out-s">Output appears here</span></div><pre class="out"></pre>'; };
  $('#pg-example').onchange = e => {
    if (e.target.value === '') return;
    area.value = PG_EXAMPLES[lang][+e.target.value][1];
    pgSave(lang, area.value);
    e.target.value = '';
  };
  $('#lesson').querySelectorAll('[data-lang]').forEach(b => b.onclick = () => { pgState.lang = b.dataset.lang; pgState.back = null; showPlayground(false); });
  drawTabs();
  if (scroll) window.scrollTo(0, 0);
}

window.__academy = { PG, flat, show, runInto };
show(location.hash.slice(1), false);
