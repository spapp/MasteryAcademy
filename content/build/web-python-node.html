schema, so the static type and the run-time check share one source."], ["`parse` versus `safeParse`?", "`parse` returns the data or throws. `safeParse` returns an object with `success` and either `data` or `error`, with no exception."]]}]}, {"id": "node-db", "title": "PostgreSQL from Node", "level": "Intermediate", "mins": "40 min", "blocks": [{"t": "plain", "title": "", "text": "Node talks to PostgreSQL through a driver (`pg`) or through a layer on top of it. A **query builder or ORM** such as Prisma or Drizzle gives you typed queries generated from your schema.\n\nWhatever layer you choose, three things stay the same: use a **connection pool**, pass values as **parameters** and wrap multi-step writes in a **transaction**."}, {"t": "bridge", "title": "", "text": "The pool is like a shared `URLSession`: created once for the process and reused by every request. A transaction is `performBatchUpdates` for data: all the changes land together or none do."}, {"t": "code", "lang": "js", "title": "", "code": "import pg from \"pg\";\n\nconst pool = new pg.Pool({\n  connectionString: process.env.DATABASE_URL,\n  max: 10,                              // connections kept open by this process\n  idleTimeoutMillis: 30_000,\n});\n\nexport async function ordersForUser(userId, limit = 20) {\n  const { rows } = await pool.query(\n    \"SELECT id, status, total FROM orders WHERE user_id = $1 ORDER BY id DESC LIMIT $2\",\n    [userId, limit],                    // values travel separately from the SQL text\n  );\n  return rows;\n}\n\nexport async function placeOrder(userId, items) {\n  const client = await pool.connect();  // one connection for the whole transaction\n  try {\n    await client.query(\"BEGIN\");\n    const { rows: [order] } = await client.query(\n      \"INSERT INTO orders (user_id, status) VALUES ($1, 'placed') RETURNING id\",\n      [userId],\n    );\n    for (const item of items) {\n      const stock = await client.query(\n        \"UPDATE stock SET available = available - $2 WHERE sku = $1 AND available >= $2\",\n        [item.sku, item.qty],\n      );\n      if (stock.rowCount === 0) throw new Error(`out of stock: ${item.sku}`);\n      await client.query(\n        \"INSERT INTO order_items (order_id, sku, qty) VALUES ($1, $2, $3)\",\n        [order.id, item.sku, item.qty],\n      );\n    }\n    await client.query(\"COMMIT\");\n    return order.id;\n  } catch (err) {\n    await client.query(\"ROLLBACK\");     // nothing from this order is saved\n    throw err;\n  } finally {\n    client.release();                   // always give the connection back\n  }\n}"}, {"t": "code", "lang": "ts", "title": "The same read with Prisma", "code": "const orders = await prisma.order.findMany({\n  where: { userId },\n  orderBy: { id: \"desc\" },\n  take: 20,\n  include: { items: true },             // loads items in one extra query, not one per order\n});"}, {"t": "steps", "title": "Two customers, one last packet of milk", "steps": [{"c": "Stock is 1. Customers A and B both try to buy it in the same millisecond.", "cols": [["Stock row", ["available = 1"]], ["Customer A", ["BEGIN"]], ["Customer B", ["BEGIN"]]]}, {"c": "A runs `UPDATE ... WHERE available >= 1`. The row is locked and set to 0.", "cols": [["Stock row", ["available = 0 (locked by A)"]], ["Customer A", ["rowCount 1"]], ["Customer B", ["waiting for the lock"]]]}, {"c": "A commits. The lock is released.", "cols": [["Stock row", ["available = 0"]], ["Customer A", ["COMMIT", "order placed"]], ["Customer B", ["lock acquired"]]]}, {"c": "B's update re-checks the condition. `0 >= 1` is false, so no row changes.", "cols": [["Stock row", ["available = 0"]], ["Customer A", ["done"]], ["Customer B", ["rowCount 0"]]]}, {"c": "B's code sees `rowCount === 0`, throws and rolls back. Nobody is oversold.", "cols": [["Stock row", ["available = 0"]], ["Customer A", ["done"]], ["Customer B", ["ROLLBACK", "409 out of stock"]]]}]}, {"t": "flow", "title": "A query from an async handler", "lanes": [{"name": "", "nodes": [{"n": "await pool.query"}, {"a": ""}, {"n": "Borrow a connection"}, {"a": ""}, {"n": "Send SQL + parameters"}, {"a": ""}, {"n": "*Event loop serves other requests"}, {"a": ""}, {"n": "Rows arrive"}, {"a": ""}, {"n": "Connection returned"}, {"a": ""}, {"n": "Handler resumes"}]}]}, {"t": "table", "title": "Choosing a data layer", "rows": [["Tool", "What it is", "Trade-off"], ["`pg`", "Driver, you write SQL", "Full control, no type safety on rows"], ["Drizzle / Kysely", "Typed query builders", "SQL-shaped and typed, some learning curve"], ["Prisma", "Schema file, generated typed client, migrations", "Very productive, less control over complex SQL"]]}, {"t": "pitfalls", "title": "", "items": ["\"Read stock, check in JavaScript, then write.\" Two requests can both read 1 and both write. Put the condition in the `UPDATE` itself, as above.", "Using `pool.query` for the steps of a transaction. Each call may use a different connection. Use one client.", "Forgetting `client.release()` on an error path. The pool runs dry and every request hangs.", "Pool size times number of instances exceeding the database's connection limit."]}, {"t": "deep", "title": "Pool exhaustion, pagination and migrations", "text": "The most common production failure with a database in Node is not a slow query. It is an **exhausted pool**. Every instance has a fixed number of connections. A code path that takes a connection and does not give it back on an error leaks one per failure. When all are leaked, every new request waits for a connection that never comes, and the service hangs with no CPU load and no errors.\n\nTwo more topics come up constantly. **Pagination** with `OFFSET` gets slower as the page number grows, because the database still reads all skipped rows. **Keyset** (cursor) pagination asks for \"rows after this id\" and stays fast. **Migrations** are versioned files that change the schema step by step, applied in order by a tool and committed with the code."}, {"t": "code", "lang": "js", "title": "", "code": "import { setTimeout as sleep } from \"node:timers/promises\";\n\nfunction createPool(size) {                         // the essential behaviour of pg.Pool\n  let free = size;\n  const waiters = [];\n  return {\n    async connect() {\n      if (free > 0) free--;\n      else await new Promise((resolve) => waiters.push(resolve));\n      let released = false;\n      return { release() { if (released) return; released = true; const next = waiters.shift(); next ? next() : free++; } };\n    },\n    stats: () => ({ free, waiting: waiters.length }),\n  };\n}\n\nasync function leakyHandler(pool, fail) {\n  const client = await pool.connect();\n  await sleep(5);\n  if (fail) throw new Error(\"validation failed\");   // returns without releasing: a leaked connection\n  client.release();\n}\nasync function safeHandler(pool, fail) {\n  const client = await pool.connect();\n  try {\n    await sleep(5);\n    if (fail) throw new Error(\"validation failed\");\n  } finally {\n    client.release();                               // runs on success and on error\n  }\n}\n\nfor (const [name, handler] of [[\"leaky\", leakyHandler], [\"safe \", safeHandler]]) {\n  const pool = createPool(3);\n  await Promise.allSettled([1, 2, 3].map(() => handler(pool, true)));        // three failing requests\n  const next = handler(pool, false).then(() => \"served\");\n  const outcome = await Promise.race([next, sleep(100, \"HUNG: no free connection\")]);\n  console.log(name, \"handler ->\", outcome, pool.stats());\n}"}, {"t": "code", "lang": "sql", "title": "Keyset pagination", "code": "-- Slow on deep pages: reads and discards 100000 rows first\nSELECT id, total FROM orders WHERE user_id = $1 ORDER BY id DESC LIMIT 20 OFFSET 100000;\n\n-- Fast on every page: jumps to the position using the index on (user_id, id)\nSELECT id, total FROM orders WHERE user_id = $1 AND id \u003c $2 ORDER BY id DESC LIMIT 20;\n-- $2 is the last id of the previous page, returned to the client as the cursor"}, {"t": "steps", "title": "A leak draining a pool of three", "steps": [{"c": "All three connections are free.", "cols": [["Free connections", ["c1", "c2", "c3"]], ["Leaked", []], ["Requests waiting", []]]}, {"c": "A request fails validation after taking a connection, on a path with no `release()`.", "cols": [["Free connections", ["c2", "c3"]], ["Leaked", ["c1"]], ["Requests waiting", []]]}, {"c": "Two more failures of the same kind over the next hour.", "cols": [["Free connections", []], ["Leaked", ["c1", "c2", "c3"]], ["Requests waiting", []]]}, {"c": "Every following request waits for a connection. CPU is idle, the database is idle, and the API times out.", "cols": [["Free connections", []], ["Leaked", ["c1", "c2", "c3"]], ["Requests waiting", ["r4", "r5", "r6", "..."]]]}, {"c": "With `try / finally`, each failure returns its connection and the pool never drains.", "cols": [["Free connections", ["c1", "c2", "c3"]], ["Leaked", []], ["Requests waiting", []]]}]}, {"t": "table", "title": "Sizing the pool", "rows": [["Fact", "Consequence"], ["PostgreSQL allows a limited number of connections (often 100 to 500)", "Instances times pool size must stay below it"], ["One query uses one connection for its whole duration", "Slow queries reduce effective capacity"], ["A transaction pins one connection until commit", "Keep transactions short, no network calls inside them"], ["More connections than CPU cores on the database rarely helps", "Start with about 10 per instance and measure"], ["Many small instances or serverless functions", "Put a pooler such as PgBouncer in front"]]}, {"t": "quiz", "title": "", "items": [["Why use a connection pool?", "Opening a database connection is slow and the database allows a limited number. A pool keeps a few open and lends them to requests."], ["How do you prevent overselling under concurrency?", "Make the check and the change one atomic statement (`UPDATE ... WHERE available >= qty`) or lock the row with `SELECT ... FOR UPDATE` inside a transaction."], ["What is SQL injection and how do parameters stop it?", "Injection is user input being interpreted as SQL. With parameters the SQL text and the values are sent separately, so a value can never change the query's structure."], ["ORM versus raw SQL in Node?", "An ORM gives typed results, migrations and faster development for ordinary queries. Raw SQL gives full control for complex or performance-critical queries. Teams commonly mix them."], ["What happens when a connection pool is exhausted?", "New requests wait for a free connection, up to a timeout if one is configured. The service appears to hang without CPU load."], ["How do you guarantee a connection is released?", "Acquire it, then do all work inside `try` and call `release()` in `finally`. Or use a helper that takes a callback and releases for you."], ["Offset versus keyset pagination?", "Offset skips N rows, which the database must still read, so deep pages are slow and rows can shift between pages. Keyset filters by the last seen key using an index, so every page is equally fast and stable."], ["What is a database migration?", "A versioned, ordered change to the schema stored with the code and applied by a tool, so every environment reaches the same schema in the same way."], ["Why avoid long transactions?", "They hold a connection, hold locks that block other writers and delay cleanup of old row versions."]]}]}, {"id": "node-auth", "title": "Authentication with JWT", "level": "Advanced", "mins": "30 min", "blocks": [{"t": "plain", "title": "", "text": "The flow is the same in every language. Verify the user's credentials once, hand back a signed token, then verify that token on every request and load the user from it. In Node the token check lives in a middleware that runs before protected routes.\n\nPassword hashing must be slow on purpose and must not block the event loop, so use the asynchronous `scrypt` from the built-in `crypto` module (or `argon2` / `bcrypt` packages)."}, {"t": "bridge", "title": "", "text": "You have written the client half: store tokens securely, attach `Authorization: Bearer`, refresh on 401. This lesson is the half that issues and checks them."}, {"t": "code", "lang": "js", "title": "", "code": "import { randomBytes, scrypt, timingSafeEqual } from \"node:crypto\";\nimport { promisify } from \"node:util\";\nimport jwt from \"jsonwebtoken\";\n\nconst scryptAsync = promisify(scrypt);       // runs in the thread pool, not on the event loop\nconst SECRET = process.env.JWT_SECRET ?? \"local-demo-only-load-the-real-one-from-env\";\n\nasync function hashPassword(password) {\n  const salt = randomBytes(16);\n  const hash = await scryptAsync(password, salt, 64);\n  return `${salt.toString(\"hex\")}:${hash.toString(\"hex\")}`;\n}\nasync function verifyPassword(password, stored) {\n  const [saltHex, hashHex] = stored.split(\":\");\n  const hash = await scryptAsync(password, Buffer.from(saltHex, \"hex\"), 64);\n  return timingSafeEqual(hash, Buffer.from(hashHex, \"hex\"));\n}\n\nconst signAccess = (userId, expiresIn = \"15m\") => jwt.sign({ sub: String(userId) }, SECRET, { algorithm: \"HS256\", expiresIn });\n\nfunction requireAuth(req, res, next) {\n  const [scheme, token] = (req.headers.authorization ?? \"\").split(\" \");\n  if (scheme !== \"Bearer\" || !token) return res.status(401).json({ error: \"missing_token\" });\n  try {\n    const claims = jwt.verify(token, SECRET, { algorithms: [\"HS256\"] });   // always pin the algorithm\n    req.userId = Number(claims.sub);\n    next();\n  } catch (err) {\n    res.status(401).json({ error: err instanceof jwt.TokenExpiredError ? \"token_expired\" : \"invalid_token\" });\n  }\n}\n\nconst stored = await hashPassword(\"correct horse\");\nconsole.log(await verifyPassword(\"correct horse\", stored), await verifyPassword(\"wrong\", stored));\n\nconst fakeRes = () => ({ status(code) { this.code = code; return this; }, json(body) { console.log(this.code, body); } });\nconst token = signAccess(7);\nfor (const header of [`Bearer ${token}`, `Bearer ${signAccess(7, -10)}`, `Bearer ${token.slice(0, -2)}xx`, undefined]) {\n  const req = { headers: { authorization: header } };\n  requireAuth(req, fakeRes(), () => console.log(\"allowed, user\", req.userId));\n}"}, {"t": "flow", "title": "Token lifecycle", "lanes": [{"name": "", "nodes": [{"n": "Login (OTP or password)"}, {"a": ""}, {"n": "Access token 15 min + refresh token 30 days"}, {"a": ""}, {"n": "Requests carry the access token"}]}, {"name": "", "nodes": [{"n": "Access token expires"}, {"a": ""}, {"n": "401 token_expired"}, {"a": ""}, {"n": "App posts refresh token"}, {"a": ""}, {"n": "New access token (and a rotated refresh token)"}]}, {"name": "", "nodes": [{"n": "Logout or theft suspected"}, {"a": ""}, {"n": "Server revokes the refresh token"}, {"a": ""}, {"n": "No new access tokens"}]}]}, {"t": "table", "title": "Where to keep tokens", "rows": [["Client", "Access token", "Refresh token"], ["iOS / Android app", "Memory", "Keychain / Keystore"], ["Browser app", "Memory", "`HttpOnly`, `Secure`, `SameSite` cookie"], ["Server to server", "Short-lived, from a secret manager", "n/a"]]}, {"t": "pitfalls", "title": "", "items": ["Not pinning `algorithms` in `verify`. Accepting whatever the token header says has caused real breaches.", "Synchronous hashing (`scryptSync`, `bcrypt.hashSync`) in a handler. It blocks every request for about 100 ms per login.", "Storing sessions only in one server's memory, so a second instance does not recognise the user.", "Authenticating the user but forgetting to check they own the resource."]}, {"t": "deep", "title": "Server-side sessions, signed cookies, CSRF and roles", "text": "JWTs are one way to stay logged in. The older way, **sessions**, is often the better fit for web apps. The server creates a random session id, stores the session data itself (in Redis or a database) and gives the browser only the id in a cookie. Logging out or banning a user means deleting one record, which takes effect at once. That immediate revocation is exactly what plain JWTs lack.\n\nThe cookie is **signed** with a server secret so the server can detect tampering, and marked `HttpOnly` (JavaScript cannot read it), `Secure` (HTTPS only) and `SameSite` (not sent on most cross-site requests).\n\nBecause browsers attach cookies automatically, another site can trigger requests that carry your cookie. That is **CSRF**. The defence is `SameSite` plus a secret token that the page must send in a header, which a foreign site cannot read. APIs that authenticate with an `Authorization` header are not exposed to CSRF, since nothing attaches that header automatically."}, {"t": "code", "lang": "js", "title": "", "code": "import { createHmac, randomBytes, timingSafeEqual } from \"node:crypto\";\n\nconst SECRET = process.env.SESSION_SECRET ?? \"local-demo-only\";\nconst sessions = new Map();                                // production: Redis with an expiry\n\nconst mac = (value) => createHmac(\"sha256\", SECRET).update(value).digest(\"base64url\");\nconst sign = (value) => `${value}.${mac(value)}`;\nfunction unsign(signed) {\n  const dot = signed.lastIndexOf(\".\");\n  if (dot \u003c 0) return null;\n  const value = signed.slice(0, dot);\n  const given = Buffer.from(signed.slice(dot + 1));\n  const expected = Buffer.from(mac(value));\n  return given.length === expected.length && timingSafeEqual(given, expected) ? value : null;\n}\n\nfunction login(userId, roles) {\n  const id = randomBytes(16).toString(\"hex\");\n  const csrfToken = randomBytes(16).toString(\"hex\");\n  sessions.set(id, { userId, roles, csrfToken });\n  return { setCookie: `sid=${sign(id)}; HttpOnly; Secure; SameSite=Lax; Path=/; Max-Age=1209600`, csrfToken };\n}\n\nfunction authenticate(req) {\n  const cookies = Object.fromEntries((req.headers.cookie ?? \"\").split(\"; \").filter(Boolean).map((c) => c.split(/=(.*)/s).slice(0, 2)));\n  const id = cookies.sid && unsign(cookies.sid);\n  return id ? sessions.get(id) ?? null : null;\n}\n\nconst requireRole = (role) => (req) => {\n  const session = authenticate(req);\n  if (!session) return 401;\n  if (req.method !== \"GET\" && req.headers[\"x-csrf-token\"] !== session.csrfToken) return 403;   // CSRF check on writes\n  return session.roles.includes(role) ? 200 : 403;\n};\n\nconst { setCookie, csrfToken } = login(7, [\"support\"]);\nconst cookie = setCookie.split(\";\")[0];\nconsole.log(setCookie.replace(/sid=[^;]+/, \"sid=\u003cid>.\u003csignature>\"));\n\nconst refund = requireRole(\"support\");\nconst tampered = cookie.replace(/sid=./, \"sid=0\");\nconsole.log(\"valid session + csrf:\", refund({ method: \"POST\", headers: { cookie, \"x-csrf-token\": csrfToken } }));\nconsole.log(\"forged cross-site post:\", refund({ method: \"POST\", headers: { cookie } }));\nconsole.log(\"tampered cookie:\", refund({ method: \"POST\", headers: { cookie: tampered, \"x-csrf-token\": csrfToken } }));\nconsole.log(\"needs admin:\", requireRole(\"admin\")({ method: \"GET\", headers: { cookie } }));\n\nsessions.clear();                                           // logout everywhere: effective immediately\nconsole.log(\"after server-side logout:\", refund({ method: \"POST\", headers: { cookie, \"x-csrf-token\": csrfToken } }));"}, {"t": "steps", "title": "A cross-site request forgery, blocked", "steps": [{"c": "The user is logged in to shop.example. The browser holds its session cookie.", "cols": [["Browser cookie jar", ["sid (shop.example)"]], ["Request headers", []], ["Server decision", []]]}, {"c": "The user opens evil.example, which contains a hidden form that posts to shop.example/refund.", "cols": [["Browser cookie jar", ["sid (shop.example)"]], ["Request headers", ["cookie attached by the browser"]], ["Server decision", []]]}, {"c": "The forged request arrives with a valid cookie but no `x-csrf-token`. The evil page cannot read the token.", "cols": [["Browser cookie jar", ["sid (shop.example)"]], ["Request headers", ["cookie", "(no csrf token)"]], ["Server decision", ["403"]]]}, {"c": "With `SameSite=Lax` a modern browser would not even attach the cookie to that cross-site POST. Two layers of defence.", "cols": [["Browser cookie jar", ["sid (shop.example)"]], ["Request headers", ["(no cookie)"]], ["Server decision", ["401"]]]}]}, {"t": "table", "title": "Sessions or JWT", "rows": [["Question", "Server-side session", "JWT"], ["Where is the state", "On the server", "Inside the token"], ["Revoke immediately", "Delete the record", "Needs a blocklist or short expiry"], ["Lookup per request", "One read (Redis)", "None"], ["Works across many services", "Needs shared session store", "Any service with the key can verify"], ["Typical use", "Browser apps with cookies", "Mobile apps, service-to-service"]]}, {"t": "quiz", "title": "", "items": [["How does JWT verification work?", "The server recomputes the signature over the header and payload with its secret (or public key) and compares. It also checks claims such as `exp`. No database lookup is needed."], ["Sessions versus JWT?", "A session stores state on the server and the client holds an opaque id, so it is easy to revoke. A JWT is self-contained and stateless, so it scales easily but stays valid until it expires unless you add a revocation list."], ["Why short-lived access tokens plus refresh tokens?", "A stolen access token is useful for minutes only. The refresh token is used rarely, can be stored more securely and can be revoked."], ["Why must password hashing be asynchronous in Node?", "Hashing is deliberately CPU-heavy. Run synchronously, it would block the event loop for every other request."], ["How does session authentication work?", "After login the server stores session data under a random id and sends the id in a cookie. Each request presents the cookie and the server looks the session up."], ["What do `HttpOnly`, `Secure` and `SameSite` do on a cookie?", "`HttpOnly` hides it from JavaScript, limiting theft through XSS. `Secure` sends it only over HTTPS. `SameSite` stops it being sent on cross-site requests, limiting CSRF."], ["What is CSRF and how is it prevented?", "A malicious site causes the user's browser to send an authenticated request. Prevent it with `SameSite` cookies and a CSRF token the attacker cannot read, checked on state-changing requests."], ["What is XSS and why does it matter for tokens?", "Injected script running in your page. It can read anything JavaScript can, including tokens in `localStorage`, which is why session cookies should be `HttpOnly`."], ["When would you choose sessions over JWT?", "When you need instant revocation and have one backend or a shared store, typically a browser application."]]}]}, {"id": "node-arch", "title": "Structure, config, logging and request context", "level": "Advanced", "mins": "35 min", "blocks": [{"t": "plain", "title": "", "text": "A maintainable Node service separates three layers: **routes** deal with HTTP, **services** hold business rules and **repositories** talk to the database. Configuration is read from environment variables once at startup and validated, so a missing setting fails the deploy instead of the first request.\n\nLogs are JSON lines with a **request id** on every line, so one request can be followed through the system. `AsyncLocalStorage` carries that id through async calls without passing it as a parameter everywhere."}, {"t": "bridge", "title": "", "text": "The layering is the same idea as view, view model or bloc, and repository in a mobile app. `AsyncLocalStorage` is like a Swift task-local value or a Dart `Zone` value: data that follows the async call chain."}, {"t": "code", "lang": "text", "title": "Folder layout", "code": "src/\n  server.ts            # start listening, graceful shutdown\n  app.ts               # build the Express app: middleware + routers\n  config.ts            # read and validate process.env once\n  routes/orders.ts     # HTTP: parse, call service, respond\n  services/orders.ts   # rules: pricing, stock, state changes\n  repos/orders.ts      # SQL or ORM calls only\n  lib/logger.ts  lib/errors.ts\ntest/"}, {"t": "code", "lang": "js", "title": "", "code": "import { AsyncLocalStorage } from \"node:async_hooks\";\nimport { randomUUID } from \"node:crypto\";\nimport { setTimeout as sleep } from \"node:timers/promises\";\n\nfunction loadConfig(env) {                               // fail fast at startup\n  const missing = [\"DATABASE_URL\", \"JWT_SECRET\"].filter((key) => !env[key]);\n  if (missing.length) throw new Error(`Missing environment variables: ${missing.join(\", \")}`);\n  return Object.freeze({ databaseUrl: env.DATABASE_URL, port: Number(env.PORT ?? 3000), freeDeliveryAbove: Number(env.FREE_DELIVERY_ABOVE ?? 500) });\n}\ntry { loadConfig({}); } catch (err) { console.log(\"startup refused:\", err.message); }\nconst config = loadConfig({ DATABASE_URL: \"postgres://localhost/shop\", JWT_SECRET: \"x\" });\n\nconst context = new AsyncLocalStorage();\nconst log = (level, msg, fields = {}) =>\n  console.log(JSON.stringify({ level, msg, requestId: context.getStore()?.requestId, ...fields }));\n\nconst repo = { async findOrder(id) { log(\"debug\", \"db.query\", { table: \"orders\", id }); await sleep(20); return { id, total: 709 }; } };\nconst service = {\n  async orderSummary(id) {\n    const order = await repo.findOrder(id);\n    return { ...order, deliveryFee: order.total >= config.freeDeliveryAbove ? 0 : 40 };\n  },\n};\n\nasync function handle(path) {                            // what a request-id middleware does\n  return context.run({ requestId: randomUUID().slice(0, 8) }, async () => {\n    log(\"info\", \"request.start\", { path });\n    const body = await service.orderSummary(Number(path.split(\"/\").pop()));\n    log(\"info\", \"request.end\", { status: 200 });\n    return body;\n  });\n}\nconsole.log(await Promise.all([handle(\"/orders/184\"), handle(\"/orders/185\")]));   // ids never mix"}, {"t": "flow", "title": "Dependencies point inward", "lanes": [{"name": "", "nodes": [{"n": "Route"}, {"a": ""}, {"n": "Service"}, {"a": ""}, {"n": "Repository"}, {"a": ""}, {"n": "Database"}]}, {"name": "", "nodes": [{"n": "Config (validated at startup)"}, {"a": ""}, {"n": "Injected into services"}]}, {"name": "", "nodes": [{"n": "Request id middleware"}, {"a": ""}, {"n": "AsyncLocalStorage"}, {"a": ""}, {"n": "Every log line"}]}]}, {"t": "pitfalls", "title": "", "items": ["Reading `process.env` all over the codebase. Read it once in `config`.", "`console.log` of free text. Use a structured logger (`pino`) with levels, and never log tokens or personal data.", "Business rules inside route handlers, where a queue worker or a test cannot reuse them."]}, {"t": "quiz", "title": "", "items": [["Why validate configuration at startup?", "A missing or malformed setting stops the deploy immediately with a clear message, instead of failing some requests later."], ["What is AsyncLocalStorage?", "A store whose value follows an asynchronous call chain. Code anywhere in that chain can read it, which is how request ids reach log lines without being passed explicitly."], ["What goes in a route, a service and a repository?", "Route: HTTP parsing and response codes. Service: business rules and orchestration. Repository: persistence queries only."]]}]}, {"id": "node-test", "title": "Testing Node services", "level": "Advanced", "mins": "25 min", "blocks": [{"t": "plain", "title": "", "text": "Node has a test runner built in: `node:test` with `node:assert`. Vitest and Jest are popular alternatives with the same shape. `describe` groups tests, `it` defines one and `assert` checks the result.\n\nTest pure business functions directly. Test the HTTP layer by starting the app on a random port and calling it with `fetch`, or with the `supertest` package."}, {"t": "bridge", "title": "", "text": "`describe` / `it` map to `XCTestCase` classes and test methods, or `group` / `test` in Dart. `mock.method` is a spy. Starting the app on port 0 is the API equivalent of pumping a widget in a test harness."}, {"t": "code", "lang": "js", "title": "test/orders.test.js", "code": "import { describe, it, before, after, mock } from \"node:test\";\nimport assert from \"node:assert/strict\";\nimport express from \"express\";\n\nexport const deliveryFee = (total, { member = false } = {}) => (member || total >= 500 ? 0 : total >= 200 ? 20 : 40);\n\nfunction buildApp({ notifier }) {\n  const app = express();\n  app.use(express.json());\n  app.get(\"/fee\", (req, res) => {\n    const total = Number(req.query.total);\n    if (!Number.isFinite(total)) return res.status(422).json({ error: \"total must be a number\" });\n    res.json({ fee: deliveryFee(total) });\n  });\n  app.post(\"/orders\", async (req, res) => {\n    await notifier.send(req.body.userId, \"Order placed\");\n    res.status(201).json({ id: 1 });\n  });\n  return app;\n}\n\ndescribe(\"deliveryFee\", () => {\n  for (const [total, member, expected] of [[100, false, 40], [200, false, 20], [499, false, 20], [500, false, 0], [100, true, 0]]) {\n    it(`total ${total}, member ${member} -> ${expected}`, () => {\n      assert.equal(deliveryFee(total, { member }), expected);\n    });\n  }\n});\n\ndescribe(\"HTTP API\", () => {\n  let server, base;\n  const notifier = { send: mock.fn(async () => {}) };       // a fake that records calls\n\n  before(async () => {\n    server = buildApp({ notifier }).listen(0);\n    await new Promise((resolve) => server.once(\"listening\", resolve));\n    base = `http://127.0.0.1:${server.address().port}`;\n  });\n  after(() => server.close());\n\n  it(\"returns the fee\", async () => {\n    const response = await fetch(`${base}/fee?total=300`);\n    assert.equal(response.status, 200);\n    assert.deepEqual(await response.json(), { fee: 20 });\n  });\n\n  it(\"rejects a non-numeric total\", async () => {\n    assert.equal((await fetch(`${base}/fee?total=abc`)).status, 422);\n  });\n\n  it(\"notifies the user when an order is placed\", async () => {\n    await fetch(`${base}/orders`, { method: \"POST\", headers: { \"content-type\": \"application/json\" }, body: JSON.stringify({ userId: 7 }) });\n    assert.equal(notifier.send.mock.callCount(), 1);\n    assert.deepEqual(notifier.send.mock.calls[0].arguments, [7, \"Order placed\"]);\n  });\n});"}, {"t": "code", "lang": "bash", "title": "", "code": "node --test                          # runs every *.test.js\nnode --test --watch                  # rerun on change\nnode --test --experimental-test-coverage"}, {"t": "flow", "title": "Making code testable", "lanes": [{"name": "", "nodes": [{"n": "buildApp({ notifier, repo })"}, {"a": ""}, {"n": "In production: real notifier and database"}]}, {"name": "", "nodes": [{"n": "buildApp({ notifier, repo })"}, {"a": ""}, {"n": "In tests: fakes"}, {"a": ""}, {"n": "Fast, deterministic tests"}]}]}, {"t": "pitfalls", "title": "", "items": ["A module that creates its database connection on import. Tests cannot replace it. Pass dependencies into a factory function.", "A test that forgets `await`. It passes before the assertion runs.", "Tests sharing state in a database without cleanup, so they pass alone and fail together."]}, {"t": "quiz", "title": "", "items": [["Unit versus integration test?", "A unit test checks one function or module in isolation with fakes around it. An integration test checks several real parts together, such as a route, the service and a test database."], ["How do you test code that calls an external service?", "Inject the client as a dependency and pass a fake or mock in tests. Verify the real integration separately in a small number of tests against a sandbox."], ["What is `mock.fn`?", "A function that records how it was called, so a test can assert on the number of calls and their arguments."]]}]}]}, {"name": "Stage 4 · Real-time and scale", "sub": "Many users, slow work, limited CPU", "lessons": [{"id": "node-rt", "title": "Real-time: WebSockets and server-sent events", "level": "Advanced", "mins": "40 min", "blocks": [{"t": "plain", "title": "", "text": "Real-time means the server sends data without the client asking each time. This is what Node is best known for, because each open connection costs almost nothing while it is idle.\n\n**Server-sent events** are a one-way stream over normal HTTP, good for status updates and AI text. A **WebSocket** is a two-way connection, good for chat and live location."}, {"t": "bridge", "title": "", "text": "On the app side you would use `URLSessionWebSocketTask` or `web_socket_channel`. The server keeps a registry of open sockets grouped by a key such as order id (a \"room\") and writes to every socket in the room when something happens."}, {"t": "code", "lang": "js", "title": "Live rider location over WebSocket", "code": "import { once } from \"node:events\";\nimport { WebSocketServer, WebSocket } from \"ws\";\n\nconst wss = new WebSocketServer({ port: 0 });\nconst rooms = new Map();                               // orderId -> Set of sockets\n\nwss.on(\"connection\", (socket, request) => {\n  const orderId = new URL(request.url, \"http://x\").searchParams.get(\"order\");\n  if (!rooms.has(orderId)) rooms.set(orderId, new Set());\n  rooms.get(orderId).add(socket);\n\n  socket.on(\"message\", (data) => {                     // rider app sends its position\n    for (const peer of rooms.get(orderId)) {\n      if (peer !== socket && peer.readyState === WebSocket.OPEN) peer.send(data.toString());\n    }\n  });\n  socket.on(\"close\", () => rooms.get(orderId).delete(socket));\n});\n\nawait once(wss, \"listening\");\nconst url = `ws://127.0.0.1:${wss.address().port}/?order=184`;\nconst customer = new WebSocket(url);\nconst rider = new WebSocket(url);\nawait Promise.all([once(customer, \"open\"), once(rider, \"open\")]);\n\ncustomer.on(\"message\", (data) => console.log(\"customer app received\", JSON.parse(data.toString())));\nrider.send(JSON.stringify({ lat: 12.9716, lon: 77.5946, etaMinutes: 9 }));\nrider.send(JSON.stringify({ lat: 12.9721, lon: 77.5950, etaMinutes: 8 }));\n\nawait new Promise((resolve) => setTimeout(resolve, 100));\ncustomer.close(); rider.close(); wss.close();"}, {"t": "code", "lang": "js", "title": "Order status over server-sent events", "code": "import { createServer } from \"node:http\";\n\nconst STAGES = [\"placed\", \"packed\", \"out_for_delivery\", \"delivered\"];\nconst server = createServer((req, res) => {\n  res.writeHead(200, { \"content-type\": \"text/event-stream\", \"cache-control\": \"no-cache\", connection: \"keep-alive\" });\n  let step = 0;\n  const timer = setInterval(() => {\n    res.write(`event: status\\ndata: ${JSON.stringify({ orderId: 184, status: STAGES[step] })}\\n\\n`);\n    if (++step === STAGES.length) { clearInterval(timer); res.end(); }\n  }, 30);\n  req.on(\"close\", () => clearInterval(timer));          // client went away: stop working\n});\nawait new Promise((resolve) => server.listen(0, resolve));\n\nconst response = await fetch(`http://127.0.0.1:${server.address().port}/orders/184/events`);\nfor await (const chunk of response.body.pipeThrough(new TextDecoderStream())) {\n  for (const line of chunk.split(\"\\n\")) if (line.startsWith(\"data:\")) console.log(\"phone received\", JSON.parse(line.slice(5)));\n}\nserver.close();"}, {"t": "steps", "title": "Scaling WebSockets past one server", "steps": [{"c": "One server. Rider and customer are both connected to it. A message goes straight from one socket to the other.", "cols": [["Server 1 holds", ["rider socket", "customer socket"]], ["Server 2 holds", []], ["Redis pub/sub", []]]}, {"c": "A second server is added behind the load balancer. The customer reconnects and lands on server 2.", "cols": [["Server 1 holds", ["rider socket"]], ["Server 2 holds", ["customer socket"]], ["Redis pub/sub", []]]}, {"c": "The rider sends a position to server 1. Server 1 has no customer socket for this order. The message would be lost.", "cols": [["Server 1 holds", ["rider socket", "position update (nowhere to send)"]], ["Server 2 holds", ["customer socket"]], ["Redis pub/sub", []]]}, {"c": "Fix: server 1 publishes the update to a Redis channel named after the order.", "cols": [["Server 1 holds", ["rider socket"]], ["Server 2 holds", ["customer socket"]], ["Redis pub/sub", ["order:184 position update"]]]}, {"c": "Every server subscribes. Server 2 receives it and writes to the customer socket it holds.", "cols": [["Server 1 holds", ["rider socket"]], ["Server 2 holds", ["customer socket", "delivers update"]], ["Redis pub/sub", ["(delivered)"]]]}]}, {"t": "flow", "title": "Live tracking end to end", "lanes": [{"name": "", "nodes": [{"n": "Rider app"}, {"a": ""}, {"n": "WebSocket"}, {"a": ""}, {"n": "API instance A"}, {"a": ""}, {"n": "Redis publish \"order:184\""}, {"a": ""}, {"n": "API instance B (subscribed)"}, {"a": ""}, {"n": "WebSocket"}, {"a": ""}, {"n": "Customer app map"}]}]}, {"t": "table", "title": "Real-time checklist", "rows": [["Concern", "What to do"], ["Authentication", "Verify the token during the connection handshake, and check the user may join that room"], ["Dead connections", "Ping every 30 seconds, drop sockets that do not answer"], ["Reconnects", "Client retries with backoff, server sends current state first"], ["Many instances", "Pub/sub between instances (Redis, NATS, Kafka)"], ["Slow clients", "Cap the per-socket send buffer and drop or disconnect"]]}, {"t": "pitfalls", "title": "", "items": ["A room registry that only exists in one process, with more than one instance running.", "No authorisation on joining a room. Anyone could subscribe to any order id.", "Never removing closed sockets from the registry, which leaks memory.", "Sending every GPS tick. Throttle to what the screen can show, for example one update per second."]}, {"t": "deep", "title": "Heartbeats, reconnects and authentication on connect", "text": "A TCP connection can die without either side being told: a phone enters a tunnel, a proxy drops an idle link. The server would keep a dead socket forever. A **heartbeat** fixes that. The server pings every socket on a timer and terminates any that did not answer the previous ping.\n\nThe client's half is **reconnecting**: wait a little, try again, and wait longer after each failure, with random jitter so that ten thousand phones do not all reconnect in the same second after a deploy. After reconnecting, the client must ask for the current state, since it missed every event sent while it was away.\n\n**Authentication** happens once, during the HTTP upgrade request that opens the socket. Check the token there and refuse the upgrade if it is invalid. After that, check on every subscription that this user may see that order."}, {"t": "code", "lang": "js", "title": "", "code": "function backoffDelays({ baseMs = 500, maxMs = 30_000, attempts = 8, random = Math.random } = {}) {\n  return Array.from({ length: attempts }, (_, attempt) => {\n    const ceiling = Math.min(maxMs, baseMs * 2 ** attempt);\n    return Math.round(random() * ceiling);                 // \"full jitter\": anywhere from 0 to the ceiling\n  });\n}\nconsole.log(\"ceilings (ms):\", backoffDelays({ random: () => 1 }));\nconsole.log(\"with jitter  :\", backoffDelays());\n\nfunction replayOnReconnect(lastSeenEventId, serverLog) {  // what the server sends first after a reconnect\n  return serverLog.filter((event) => event.id > lastSeenEventId);\n}\nconst log = [{ id: 1, status: \"placed\" }, { id: 2, status: \"packed\" }, { id: 3, status: \"out_for_delivery\" }];\nconsole.log(\"client last saw event 1, missed:\", replayOnReconnect(1, log).map((e) => e.status));", "web": 1}, {"t": "code", "lang": "js", "title": "Heartbeat and authenticated upgrade with `ws`", "code": "import { createServer } from \"node:http\";\nimport { WebSocketServer } from \"ws\";\nimport jwt from \"jsonwebtoken\";\n\nconst server = createServer();\nconst wss = new WebSocketServer({ noServer: true });\n\nserver.on(\"upgrade\", (request, socket, head) => {          // authenticate before the socket exists\n  try {\n    const token = new URL(request.url, \"http://x\").searchParams.get(\"token\");\n    const claims = jwt.verify(token, process.env.JWT_SECRET, { algorithms: [\"HS256\"] });\n    wss.handleUpgrade(request, socket, head, (ws) => { ws.userId = Number(claims.sub); wss.emit(\"connection\", ws, request); });\n  } catch {\n    socket.write(\"HTTP/1.1 401 Unauthorized\\r\\n\\r\\n\");\n    socket.destroy();\n  }\n});\n\nwss.on(\"connection\", (ws) => {\n  ws.isAlive = true;\n  ws.on(\"pong\", () => { ws.isAlive = true; });             // the client's library answers pings itself\n});\n\nconst heartbeat = setInterval(() => {\n  for (const ws of wss.clients) {\n    if (!ws.isAlive) { ws.terminate(); continue; }         // no pong since the last round: dead\n    ws.isAlive = false;\n    ws.ping();\n  }\n}, 30_000);\nwss.on(\"close\", () => clearInterval(heartbeat));\nserver.listen(3000);"}, {"t": "steps", "title": "A phone loses signal and comes back", "steps": [{"c": "The phone is connected and has received events 1 and 2.", "cols": [["Phone", ["connected", "last event 2"]], ["Server", ["socket alive"]], ["Missed events", []]]}, {"c": "The phone enters a lift. No close frame is sent. The server still believes the socket is open.", "cols": [["Phone", ["no network"]], ["Server", ["socket looks alive"]], ["Missed events", []]]}, {"c": "An event is written to the dead socket. The next heartbeat gets no pong, and the round after that terminates it.", "cols": [["Phone", ["no network"]], ["Server", ["socket terminated", "removed from room"]], ["Missed events", ["3"]]]}, {"c": "The phone regains signal. Its client retries after a jittered delay and reconnects with its token and `lastEventId=2`.", "cols": [["Phone", ["reconnecting"]], ["Server", ["authenticates the upgrade"]], ["Missed events", ["3"]]]}, {"c": "The server replays everything after event 2, then continues with live events.", "cols": [["Phone", ["connected", "last event 3"]], ["Server", ["socket alive"]], ["Missed events", []]]}]}, {"t": "quiz", "title": "", "items": [["WebSocket versus HTTP?", "HTTP is one request and one response. A WebSocket starts as an HTTP request that is upgraded to a persistent two-way connection where either side can send at any time."], ["How do you scale WebSockets horizontally?", "Each instance keeps its own connections. A shared pub/sub layer broadcasts events to all instances, and each delivers to the sockets it holds. Sticky sessions help with reconnects but do not replace pub/sub."], ["When would you choose SSE over WebSocket?", "When data only flows from server to client: notifications, progress, status, AI text. SSE is plain HTTP, simpler to proxy, authenticate and reconnect."], ["Why is Node well suited to this?", "Idle connections cost a small amount of memory and no thread each, so one process can hold tens of thousands of them."], ["Why do WebSocket servers need heartbeats?", "A connection can break without a close frame. Pings detect sockets that no longer respond so the server can free them and stop sending."], ["How should a client reconnect?", "With exponential backoff and random jitter, capped at a maximum delay, and reset after a successful connection. On reconnect it should request missed events or the current state."], ["How do you authenticate a WebSocket?", "Validate a token during the HTTP upgrade request and reject the upgrade if it fails. Then authorise each room or topic subscription."], ["How do you avoid losing events during a disconnect?", "Give events increasing ids, keep a short history per topic, and have the client send the last id it saw so the server can replay the gap. Otherwise send a full snapshot."], ["What is the thundering herd problem here?", "After a server restart every client reconnects at once and overloads it. Jittered backoff and gradual rollout spread the reconnects."]]}]}, {"id": "node-queue", "title": "Caching, queues and background jobs", "level": "Advanced", "mins": "35 min", "blocks": [{"t": "plain", "title": "", "text": "Keep request handlers fast. Anything slow that the user does not have to wait for becomes a **job**: the handler puts a small message on a queue and answers at once, and a separate **worker** process does the work with retries.\n\nA **cache** stores the result of an expensive read for a short time. In Node both usually sit on Redis, with BullMQ as the queue library."}, {"t": "bridge", "title": "", "text": "The queue is a durable `OperationQueue` / `WorkManager`: work survives a crash and runs on another machine. The cache is a shared `NSCache` with expiry times."}, {"t": "code", "lang": "js", "title": "", "code": "import { setTimeout as sleep } from \"node:timers/promises\";\n\nfunction ttlCache(ttlMs) {\n  const store = new Map();\n  return async (key, load) => {\n    const hit = store.get(key);\n    if (hit && hit.expires > Date.now()) return hit.value;        // cache hit\n    const value = await load();                                   // cache miss: do the slow thing\n    store.set(key, { value, expires: Date.now() + ttlMs });\n    return value;\n  };\n}\nconst cached = ttlCache(60_000);\nconst slots = (pincode) => cached(`slots:${pincode}`, async () => { await sleep(120); return [\"7-9\", \"9-11\"]; });\nfor (let i = 0; i \u003c 2; i++) { const t = Date.now(); await slots(\"560103\"); console.log(\"slots in\", Date.now() - t, \"ms\"); }\n\nfunction createQueue({ concurrency, attempts, handler }) {       // what BullMQ gives you, minus persistence\n  const pending = [];\n  let running = 0;\n  let idle;\n  const done = new Promise((resolve) => (idle = resolve));\n  const pump = () => {\n    while (running \u003c concurrency && pending.length) {\n      const job = pending.shift();\n      running++;\n      handler(job.data)\n        .then(() => console.log(\"done  \", job.data.orderId))\n        .catch((err) => {\n          if (++job.tries \u003c attempts) { console.log(\"retry \", job.data.orderId, `(${err.message})`); pending.push(job); }\n          else console.log(\"failed\", job.data.orderId, \"-> dead-letter queue\");\n        })\n        .finally(() => { running--; pump(); if (!running && !pending.length) idle(); });\n    }\n  };\n  return { add: (data) => { pending.push({ data, tries: 0 }); pump(); }, done };\n}\n\nlet flaky = 0;\nconst invoices = createQueue({\n  concurrency: 2,\n  attempts: 3,\n  handler: async ({ orderId }) => {\n    await sleep(30);\n    if (orderId === 185 && flaky++ \u003c 1) throw new Error(\"pdf service timeout\");\n    if (orderId === 186) throw new Error(\"order has no address\");\n  },\n});\nfor (const orderId of [184, 185, 186]) invoices.add({ orderId });   // the API would return 202 right here\nawait invoices.done;"}, {"t": "code", "lang": "js", "title": "The same with BullMQ and Redis", "code": "import { Queue, Worker } from \"bullmq\";\n\nconst connection = { host: \"127.0.0.1\", port: 6379 };\nexport const invoiceQueue = new Queue(\"invoices\", { connection });\n\n// In the API process:\nawait invoiceQueue.add(\"send\", { orderId: 184 }, { attempts: 5, backoff: { type: \"exponential\", delay: 1000 }, jobId: \"invoice-184\" });\n\n// In a separate worker process:\nnew Worker(\"invoices\", async (job) => {\n  // build the PDF, email it; throwing makes BullMQ retry with backoff\n}, { connection, concurrency: 5 });"}, {"t": "flow", "title": "Place order with background work", "lanes": [{"name": "", "nodes": [{"n": "POST /orders"}, {"a": ""}, {"n": "Save order (transaction)"}, {"a": ""}, {"n": "Enqueue: invoice, push notification, analytics"}, {"a": ""}, {"n": "Respond 201 in 80 ms"}]}, {"name": "", "nodes": [{"n": "Worker process"}, {"a": ""}, {"n": "Take job"}, {"a": ""}, {"n": "Do work"}, {"a": ""}, {"n": "Failed?"}, {"a": "yes"}, {"n": "Retry with backoff"}, {"a": ""}, {"n": "Still failing"}, {"a": ""}, {"n": "Dead-letter queue + alert"}]}]}, {"t": "pitfalls", "title": "", "items": ["Jobs that are not idempotent. A retried \"charge card\" job charges twice. Use a job id and check \"already done\" first.", "Putting large payloads in the job. Store ids and load the data in the worker.", "Running workers inside the API process. A CPU-heavy job then slows every request.", "Unbounded in-memory caches. They become the memory leak. Cap the size or use Redis with expiry."]}, {"t": "deep", "title": "Single-flight, idempotent consumers and a sliding-window limiter", "text": "The same three reliability patterns from the Python track, in JavaScript, because you will be asked to write them.\n\n**Single-flight**: when many requests miss the cache for the same key at once, only the first runs the expensive load. The rest await the same promise. In JavaScript this is short, because a promise can be stored in a `Map` and awaited by any number of callers.\n\n**Idempotent consumer**: a queue delivers at least once, so a job can arrive twice. The consumer records each job id it has finished and skips repeats.\n\n**Sliding-window rate limiter**: allow at most N requests per user in the last M milliseconds, by keeping timestamps and dropping the old ones."}, {"t": "code", "lang": "js", "title": "", "code": "import { setTimeout as sleep } from \"node:timers/promises\";\n\nfunction singleFlight() {\n  const inFlight = new Map();\n  return (key, load) => {\n    if (!inFlight.has(key)) {\n      inFlight.set(key, load().finally(() => inFlight.delete(key)));   // store the promise itself\n    }\n    return inFlight.get(key);\n  };\n}\nlet queries = 0;\nconst once = singleFlight();\nconst loadSlots = async () => { queries++; await sleep(40); return [\"7-9\", \"9-11\"]; };\nconst answers = await Promise.all(Array.from({ length: 100 }, () => once(\"slots:560103\", loadSlots)));\nconsole.log(answers.length, \"requests,\", queries, \"database query\");\n\nconst processed = new Set();                               // production: a unique column or Redis SETNX\nlet emailsSent = 0;\nasync function sendInvoice(job) {\n  if (processed.has(job.id)) return \"skipped duplicate\";\n  processed.add(job.id);                                   // claim before the slow part\n  await sleep(10);\n  emailsSent++;\n  return \"sent\";\n}\nconsole.log(await Promise.all([{ id: \"inv-184\" }, { id: \"inv-184\" }, { id: \"inv-185\" }].map(sendInvoice)), \"| emails sent:\", emailsSent);\n\nfunction slidingWindow({ limit, windowMs }) {\n  const hits = new Map();                                  // userId -> timestamps\n  return (userId, now = Date.now()) => {\n    const recent = (hits.get(userId) ?? []).filter((t) => now - t \u003c windowMs);\n    if (recent.length >= limit) { hits.set(userId, recent); return { allowed: false, retryAfterMs: windowMs - (now - recent[0]) }; }\n    recent.push(now);\n    hits.set(userId, recent);\n    return { allowed: true };\n  };\n}\nconst allow = slidingWindow({ limit: 3, windowMs: 1000 });\nconst t0 = 1_000_000;\nconsole.log([0, 100, 200, 300, 1150].map((offset) => {\n  const result = allow(\"user-7\", t0 + offset);\n  return result.allowed ? `${offset}ms ok` : `${offset}ms 429 (retry in ${result.retryAfterMs}ms)`;\n}));"}, {"t": "steps", "title": "One hundred cache misses, one query", "steps": [{"c": "The cache entry for `slots:560103` has just expired. Request 1 arrives and finds nothing in flight.", "cols": [["In-flight map", []], ["Database queries running", ["0"]], ["Waiting requests", ["0"]]]}, {"c": "Request 1 starts the load and stores its promise in the map.", "cols": [["In-flight map", ["slots:560103 -> promise"]], ["Database queries running", ["1"]], ["Waiting requests", ["1"]]]}, {"c": "Requests 2 to 100 arrive while it runs. Each finds the promise and awaits it. No new query.", "cols": [["In-flight map", ["slots:560103 -> promise"]], ["Database queries running", ["1"]], ["Waiting requests", ["100"]]]}, {"c": "The query returns. The one promise resolves, all 100 requests continue, and the map entry is removed.", "cols": [["In-flight map", []], ["Database queries running", ["0"]], ["Waiting requests", ["0"]]]}]}, {"t": "table", "title": "Rate limiting algorithms", "rows": [["Algorithm", "How", "Trade-off"], ["Fixed window", "Count per calendar minute", "Simple, but allows a double burst at the boundary"], ["Sliding window", "Count requests in the last N seconds", "Accurate, stores timestamps"], ["Token bucket", "Tokens refill steadily, each request spends one", "Allows short bursts, smooth average"], ["Leaky bucket", "Queue drained at a fixed rate", "Smooths output, adds delay"]]}, {"t": "quiz", "title": "", "items": [["Why move work to a queue?", "Faster responses, retries with backoff when a dependency fails, control over concurrency, and the ability to scale workers separately from the API."], ["What does at-least-once delivery imply?", "A job may run more than once, so handlers must be idempotent: running twice has the same effect as running once."], ["What is a dead-letter queue?", "Where jobs go after exhausting their retries, so they can be inspected and replayed instead of being lost or retried forever."], ["Cache invalidation strategies?", "Expiry by time, deleting the key when the underlying data changes, and versioned keys. Choose based on how stale the data is allowed to be."], ["How do you implement single-flight in JavaScript?", "Keep a map from key to the in-progress promise. Callers for a key that is already loading return that promise, and the entry is deleted when it settles."], ["How do you make a queue consumer idempotent?", "Give every job a unique id and record completed ids atomically, for example with a unique database constraint or Redis `SET NX`. Skip jobs already recorded."], ["Where should rate-limit counters live when you have several instances?", "In a shared store such as Redis, updated atomically. In-memory counters would allow the limit once per instance."], ["Fixed window versus sliding window?", "A fixed window resets at boundaries, so a client can send a full quota just before and just after the boundary. A sliding window always looks at the most recent period and avoids that."]]}]}, {"id": "node-worker", "title": "CPU work: worker threads and cluster", "level": "Expert", "mins": "35 min", "blocks": [{"t": "plain", "title": "", "text": "The event loop is one thread. A calculation that takes 200 ms freezes the whole server for 200 ms. Node gives you two ways to use more CPU cores.\n\n**Worker threads** run JavaScript on additional threads inside the same process. Use them to move a heavy calculation off the main thread. **Cluster**, or simply running several copies of the process, puts one event loop on each core to serve more requests."}, {"t": "bridge", "title": "", "text": "A worker thread is a Dart isolate: its own memory and event loop, talking to the main thread through messages that are copied. Swift developers can think of an actor that lives on another thread and only accepts sendable values."}, {"t": "code", "lang": "js", "title": "", "code": "import { Worker } from \"node:worker_threads\";\n\nconst heavy = (n) => { let sum = 0; for (let i = 0; i \u003c n; i++) sum += i % 7; return sum; };\n\nconst workerSource = `\n  const { parentPort, workerData } = require(\"node:worker_threads\");\n  let sum = 0;\n  for (let i = 0; i \u003c workerData; i++) sum += i % 7;\n  parentPort.postMessage(sum);\n`;\nconst inWorker = (n) => new Promise((resolve, reject) => {\n  const worker = new Worker(workerSource, { eval: true, workerData: n });\n  worker.once(\"message\", resolve);\n  worker.once(\"error\", reject);\n});\n\nasync function measure(label, job) {\n  let heartbeats = 0;                                   // a timer that should fire every 10 ms\n  const timer = setInterval(() => heartbeats++, 10);\n  const start = Date.now();\n  await job();\n  clearInterval(timer);\n  console.log(`${label}: ${Date.now() - start} ms, event loop ticked ${heartbeats} times`);\n}\n\nconst N = 300_000_000;\nawait measure(\"on the main thread\", async () => heavy(N));        // server is frozen meanwhile\nawait measure(\"in a worker thread\", () => inWorker(N));           // server stays responsive"}, {"t": "steps", "title": "Main thread versus worker", "steps": [{"c": "A request needs a heavy calculation. Done on the main thread, the event loop cannot run anything else.", "cols": [["Main thread", ["computing..."]], ["Worker thread", []], ["Other requests", ["!waiting"]]]}, {"c": "With a worker, the main thread posts a message and is immediately free.", "cols": [["Main thread", ["free"]], ["Worker thread", ["computing..."]], ["Other requests", ["being served"]]]}, {"c": "The worker finishes and posts the result back. A callback on the main thread resolves the promise.", "cols": [["Main thread", ["sends the response"]], ["Worker thread", ["idle (return to pool)"]], ["Other requests", ["being served"]]]}]}, {"t": "flow", "title": "Which tool for which problem", "lanes": [{"name": "", "nodes": [{"n": "Short CPU burst (image resize, PDF, hashing)?"}, {"a": ""}, {"n": "Worker thread pool (`piscina`)"}]}, {"name": "", "nodes": [{"n": "Long job (minutes)?"}, {"a": ""}, {"n": "Queue + separate worker process"}]}, {"name": "", "nodes": [{"n": "More requests than one core can serve?"}, {"a": ""}, {"n": "More processes: cluster, PM2 or more containers"}]}, {"name": "", "nodes": [{"n": "Waiting on I/O?"}, {"a": ""}, {"n": "Nothing needed, the event loop already handles it"}]}]}, {"t": "table", "title": "Worker threads versus cluster versus child process", "rows": [["Tool", "Memory", "Shares", "Use"], ["Worker threads", "Shared process, separate heaps", "Can share `SharedArrayBuffer`", "CPU tasks inside one service"], ["Cluster / replicas", "Separate processes", "A listening port", "Serving more traffic on all cores"], ["Child process", "Separate process", "Nothing, pipes only", "Running another program (ffmpeg)"]]}, {"t": "pitfalls", "title": "", "items": ["Starting a new worker per request. Starting a thread costs milliseconds and megabytes. Keep a pool.", "Sending huge objects through `postMessage`. They are copied. Transfer an `ArrayBuffer` or share memory.", "Using worker threads for I/O. It adds overhead and no benefit.", "Running cluster inside a container that already has several replicas managed by the platform."]}, {"t": "deep", "title": "A worker pool, and real shared memory", "text": "Creating a thread costs time and memory, so production code keeps a fixed **pool** of workers and feeds them jobs through a queue. That is what libraries such as `piscina` do. The version below is small enough to read in a minute.\n\nWorkers normally share nothing. Messages are copied. The exception is `SharedArrayBuffer`: a block of memory several threads can read and write at once. That brings back the classic problem of two threads updating the same number. `Atomics` provides operations that complete as a single indivisible step. This is the same race you saw in the Python GIL lesson, now with real parallel threads."}, {"t": "code", "lang": "js", "title": "", "code": "import { Worker } from \"node:worker_threads\";\nimport { availableParallelism } from \"node:os\";\n\nconst TASK = `\n  const { parentPort } = require(\"node:worker_threads\");\n  parentPort.on(\"message\", ({ from, to }) => {\n    let primes = 0;\n    for (let n = Math.max(2, from); n \u003c to; n++) {\n      let isPrime = true;\n      for (let d = 2; d * d \u003c= n; d++) if (n % d === 0) { isPrime = false; break; }\n      if (isPrime) primes++;\n    }\n    parentPort.postMessage(primes);\n  });\n`;\n\nclass WorkerPool {\n  #idle = []; #queue = []; #workers = [];\n  constructor(size) {\n    for (let i = 0; i \u003c size; i++) {\n      const worker = new Worker(TASK, { eval: true });\n      worker.on(\"message\", (result) => { worker.job.resolve(result); this.#idle.push(worker); this.#next(); });\n      worker.on(\"error\", (err) => worker.job?.reject(err));\n      this.#workers.push(worker);\n      this.#idle.push(worker);\n    }\n  }\n  run(data) {\n    return new Promise((resolve, reject) => { this.#queue.push({ data, resolve, reject }); this.#next(); });\n  }\n  #next() {\n    if (!this.#idle.length || !this.#queue.length) return;\n    const worker = this.#idle.pop();\n    worker.job = this.#queue.shift();\n    worker.postMessage(worker.job.data);\n  }\n  close() { return Promise.all(this.#workers.map((w) => w.terminate())); }\n}\n\nconst LIMIT = 2_000_000, PARTS = 8;\nconst ranges = Array.from({ length: PARTS }, (_, i) => ({ from: (i * LIMIT) / PARTS, to: ((i + 1) * LIMIT) / PARTS }));\nfor (const size of [1, Math.min(4, availableParallelism())]) {\n  const pool = new WorkerPool(size);\n  const start = Date.now();\n  const counts = await Promise.all(ranges.map((range) => pool.run(range)));\n  console.log(`${size} worker(s): ${counts.reduce((a, b) => a + b)} primes in ${Date.now() - start} ms`);\n  await pool.close();\n}\n\nconst shared = new Int32Array(new SharedArrayBuffer(8));          // [0] plain, [1] atomic\nconst COUNTER = `\n  const { workerData, parentPort } = require(\"node:worker_threads\");\n  const cells = new Int32Array(workerData);\n  for (let i = 0; i \u003c 500000; i++) { cells[0] = cells[0] + 1; Atomics.add(cells, 1, 1); }\n  parentPort.postMessage(\"done\");\n`;\nawait Promise.all([1, 2, 3, 4].map(() => new Promise((resolve) => {\n  new Worker(COUNTER, { eval: true, workerData: shared.buffer }).once(\"message\", resolve);\n})));\nconsole.log(\"expected 2000000 | plain:\", shared[0], \"| Atomics.add:\", shared[1]);"}, {"t": "steps", "title": "A pool of two workers and five jobs", "steps": [{"c": "Five jobs arrive. Two start immediately. Three wait in the pool's queue.", "cols": [["Worker 1", ["job A"]], ["Worker 2", ["job B"]], ["Queue", ["C", "D", "E"]]]}, {"c": "Worker 2 finishes. Its promise resolves and it takes the next job at once.", "cols": [["Worker 1", ["job A"]], ["Worker 2", ["job C"]], ["Queue", ["D", "E"]]]}, {"c": "Worker 1 finishes and takes D.", "cols": [["Worker 1", ["job D"]], ["Worker 2", ["job C"]], ["Queue", ["E"]]]}, {"c": "The last job is taken. No thread was created or destroyed after startup.", "cols": [["Worker 1", ["job D"]], ["Worker 2", ["job E"]], ["Queue", []]]}]}, {"t": "table", "title": "Passing data to a worker", "rows": [["Method", "Cost", "Use for"], ["`postMessage(obj)`", "Copies the value (structured clone)", "Small to medium data"], ["`postMessage(buf, [buf])`", "Moves ownership, no copy. The sender loses access", "Large binary data"], ["`SharedArrayBuffer`", "No copy, both sides see changes", "Counters, large numeric arrays, with `Atomics`"]]}, {"t": "quiz", "title": "", "items": [["Is Node single-threaded?", "Your JavaScript runs on one main thread. Node itself uses more: the libuv thread pool for file and crypto work, and any worker threads you create."], ["Worker threads versus cluster?", "Worker threads add threads within one process for CPU-heavy tasks. Cluster starts several processes that share a port, to use every core for handling requests."], ["How do threads communicate?", "By messages with `postMessage`, which copies data using structured clone. Binary data can be transferred without copying or shared through `SharedArrayBuffer`."], ["When should work go to a queue instead of a worker thread?", "When it is long, must survive restarts, needs retries or should scale independently of the API."], ["Why use a worker pool instead of a worker per task?", "Starting a worker costs milliseconds and several megabytes. A pool reuses a fixed number of threads and queues extra work, which bounds CPU and memory use."], ["How many workers should a pool have?", "About the number of CPU cores available to the process, minus one for the main thread. More threads than cores adds switching cost without more throughput."], ["What is `SharedArrayBuffer`?", "A fixed block of memory that can be accessed from several threads at once without copying."], ["What is `Atomics` for?", "Reading and modifying shared memory as indivisible operations, and for waiting and notifying between threads, to avoid races on `SharedArrayBuffer` data."], ["What is a transferable object?", "An object such as an `ArrayBuffer` whose ownership can be moved to another thread without copying. It becomes unusable in the sending thread."]]}]}, {"id": "node-perf", "title": "Performance and memory leaks", "level": "Expert", "mins": "35 min", "blocks": [{"t": "plain", "title": "", "text": "Two numbers describe the health of a Node process. **Event loop delay** is how late callbacks run. If it climbs, something is blocking the loop. **Heap used** is how much memory your objects take. If it climbs steadily under constant load and never comes back down, you have a leak.\n\nV8 frees memory automatically with a garbage collector, but only for objects nothing refers to any more. A leak in JavaScript is always a reference you forgot about: a growing `Map`, an array, a listener, a closure."}, {"t": "bridge", "title": "", "text": "Leaks are the same idea as retain cycles and undisposed controllers in mobile apps, except the cause is usually an unbounded cache instead of a cycle. The heap snapshot in Chrome DevTools is Instruments' Allocations or the Dart DevTools memory view."}, {"t": "code", "lang": "js", "title": "", "code": "import { performance } from \"node:perf_hooks\";\nimport { setTimeout as sleep } from \"node:timers/promises\";\n\n// A probe that should tick every 10 ms. How late it runs is the event loop delay.\n// (Production: perf_hooks.monitorEventLoopDelay or your metrics library does this for you.)\nlet last = performance.now();\nlet worst = 0;\nconst probe = setInterval(() => {\n  const now = performance.now();\n  worst = Math.max(worst, now - last - 10);\n  last = now;\n}, 10);\n\nawait sleep(100);\nconst quiet = worst;\nworst = 0;\nconst end = performance.now() + 150;\nwhile (performance.now() \u003c end) { /* a synchronous loop: nothing else can run */ }\nawait sleep(30);\nclearInterval(probe);\nconsole.log(`loop delay when idle ${quiet.toFixed(1)} ms, after blocking ${worst.toFixed(0)} ms`);\n\nconst heapMb = () => Math.round(process.memoryUsage().heapUsed / 1e6);\nconst leaky = new Map();                                 // keyed by request id: grows forever\nfunction boundedCache(limit) {                           // least-recently-used, fixed size\n  const map = new Map();\n  return {\n    set(key, value) { map.delete(key); map.set(key, value); if (map.size > limit) map.delete(map.keys().next().value); },\n    get size() { return map.size; },\n  };\n}\nconst safe = boundedCache(1000);\nconst before = heapMb();\nfor (let id = 0; id \u003c 200_000; id++) {\n  const session = { id, cart: new Array(20).fill(\"item\") };\n  leaky.set(id, session);\n  safe.set(id, session);\n}\nconsole.log(`heap ${before} MB -> ${heapMb()} MB; leaky map holds ${leaky.size} entries, bounded cache ${safe.size}`);"}, {"t": "flow", "title": "Finding a memory leak", "lanes": [{"name": "", "nodes": [{"n": "Memory graph climbs for hours"}, {"a": ""}, {"n": "Take heap snapshot 1"}, {"a": ""}, {"n": "Apply load"}, {"a": ""}, {"n": "Take heap snapshot 2"}, {"a": ""}, {"n": "Compare: which object type grew?"}, {"a": ""}, {"n": "Follow its \"retainers\" to the Map, array or listener holding it"}, {"a": ""}, {"n": "Bound it or remove it"}]}]}, {"t": "flow", "title": "Finding a slow endpoint", "lanes": [{"name": "", "nodes": [{"n": "p95 latency rises"}, {"a": ""}, {"n": "Event loop delay high?"}, {"a": "yes"}, {"n": "CPU profile (`node --cpu-prof`)"}, {"a": ""}, {"n": "Hot function"}, {"a": ""}, {"n": "Make it async, cache it or move to a worker"}]}, {"name": "", "nodes": [{"n": "Event loop delay high?"}, {"a": "no"}, {"n": "Time is spent waiting"}, {"a": ""}, {"n": "Slow query or external call"}, {"a": ""}, {"n": "Index, cache, parallelise"}]}]}, {"t": "table", "title": "Usual suspects", "rows": [["Symptom", "Common cause"], ["Heap grows forever", "Unbounded `Map` cache, arrays of history, per-request listeners"], ["All requests slow at once", "Synchronous work on the event loop"], ["Only some requests slow", "A slow query, N+1 queries, a slow downstream service"], ["Out of memory on large exports", "Buffering instead of streaming"], ["Crash loop under load", "Unhandled rejection, pool exhaustion"]]}, {"t": "code", "lang": "bash", "title": "Tools", "code": "node --inspect src/server.js          # then open chrome://inspect for CPU and heap tools\nnode --cpu-prof src/server.js         # writes a .cpuprofile file\nnode --max-old-space-size=2048 src/server.js   # raise the heap limit (MB)\nnpx autocannon -c 100 -d 20 http://localhost:3000/health   # load test"}, {"t": "pitfalls", "title": "", "items": ["\"Caching\" in a module-level object keyed by user or request with no limit.", "Raising the heap limit instead of finding the leak. It only delays the crash.", "Benchmarking on a laptop with debug logging on and drawing conclusions."]}, {"t": "deep", "title": "Listener leaks, weak references and reading heap numbers", "text": "V8 divides the heap by age. New objects are created in the **young generation**, which is small and collected often and quickly. Objects that survive a couple of collections are moved to the **old generation**, which is large and collected less often. A request's temporary objects die young and cost almost nothing. A leak is something that keeps getting promoted to the old generation and is never released.\n\nThe leak you will most often meet in Node is a **listener leak**: code that adds a listener to a long-lived emitter for every request and never removes it. Each listener is a closure that holds its request's data.\n\nA `WeakMap` is the right tool for attaching extra data to objects you do not own. Its keys are held weakly, so an entry disappears when the key object is no longer used anywhere else."}, {"t": "code", "lang": "js", "title": "", "code": "import { EventEmitter } from \"node:events\";\nimport v8 from \"node:v8\";\n\nconst priceFeed = new EventEmitter();                 // lives for the whole process\npriceFeed.setMaxListeners(0);\n\nfunction leakyRequest(id) {\n  const cart = new Array(1000).fill(`item-${id}`);    // request data captured by the closure\n  priceFeed.on(\"change\", () => cart.length);          // never removed\n}\nfunction cleanRequest(id) {\n  const cart = new Array(1000).fill(`item-${id}`);\n  const onChange = () => cart.length;\n  priceFeed.on(\"change\", onChange);\n  return () => priceFeed.off(\"change\", onChange);     // call this when the request ends\n}\n\nfor (let id = 0; id \u003c 5000; id++) leakyRequest(id);\nconsole.log(\"after 5000 leaky requests:\", priceFeed.listenerCount(\"change\"), \"listeners\");\npriceFeed.removeAllListeners(\"change\");\nfor (let id = 0; id \u003c 5000; id++) cleanRequest(id)();   // each request cleans up after itself\nconsole.log(\"after 5000 clean requests:\", priceFeed.listenerCount(\"change\"), \"listeners\");\n\nconst metadata = new WeakMap();                       // extra data keyed by an object\nlet session = { userId: 7 };\nmetadata.set(session, { lastSeen: Date.now() });\nconsole.log(\"has metadata:\", metadata.has(session));\nsession = null;                                       // the entry can now be collected; a Map would keep it forever\n\nconst heap = v8.getHeapStatistics();\nconst mb = (bytes) => Math.round(bytes / 1e6);\nconsole.log(`heap used ${mb(heap.used_heap_size)} MB of limit ${mb(heap.heap_size_limit)} MB`);\nconsole.log(Object.entries(process.memoryUsage()).map(([k, v]) => `${k} ${mb(v)} MB`).join(\", \"));"}, {"t": "steps", "title": "An object's life in the V8 heap", "steps": [{"c": "A request creates temporary objects in the young generation.", "cols": [["Young generation", ["req", "cart", "strings"]], ["Old generation", []], ["Collected", []]]}, {"c": "The response is sent. Nothing refers to them. The next fast collection frees them.", "cols": [["Young generation", []], ["Old generation", []], ["Collected", ["req", "cart", "strings"]]]}, {"c": "Another request's cart is captured by a listener that is never removed. It survives collections.", "cols": [["Young generation", ["cart 2 (still referenced)"]], ["Old generation", []], ["Collected", []]]}, {"c": "Survivors are promoted to the old generation.", "cols": [["Young generation", []], ["Old generation", ["cart 2"]], ["Collected", []]]}, {"c": "This repeats for every request. The old generation grows until the process hits its limit and crashes.", "cols": [["Young generation", []], ["Old generation", ["cart 2", "cart 3", "cart 4", "..."]], ["Collected", []]]}]}, {"t": "table", "title": "Reading `process.memoryUsage()`", "rows": [["Field", "Meaning", "Watch for"], ["`rss`", "Total memory the process holds", "The number your container limit applies to"], ["`heapTotal`", "Heap reserved by V8", "Grows in steps"], ["`heapUsed`", "Heap occupied by live objects", "A steady climb under constant load is a leak"], ["`external`", "Memory of objects outside the heap, such as Buffers", "Large with file or network buffering"], ["`arrayBuffers`", "Part of `external` used by ArrayBuffers", "Streams and binary data"]]}, {"t": "quiz", "title": "", "items": [["What causes memory leaks in Node?", "References that are never released: unbounded caches and maps, global arrays, event listeners that are added and not removed, timers never cleared, and closures capturing large objects."], ["How do you detect that the event loop is blocked?", "Measure event loop delay with `monitorEventLoopDelay` or your metrics library, and take a CPU profile to find the synchronous code responsible."], ["How does garbage collection work in V8?", "New objects go in a small young generation that is collected often and quickly. Survivors move to the old generation, which is collected less often with mark-and-sweep. Only unreachable objects are freed."], ["How would you load test an API?", "Use a tool such as autocannon or k6 against a production-like environment, increase concurrency in steps, and watch p95 latency, error rate, event loop delay, CPU and database connections."], ["How does V8's garbage collector work?", "It is generational. A fast scavenger collects the small young generation often. Survivors are promoted to the old generation, which is collected by mark-and-sweep with compaction, less often and partly concurrently."], ["What is a listener leak and how do you prevent it?", "Listeners added repeatedly to a long-lived emitter and never removed, each retaining its closure. Remove them with `off` when the request ends, or use `once` for one-shot events. Watch `listenerCount` and the MaxListenersExceededWarning."], ["`Map` versus `WeakMap`?", "A `Map` holds its keys strongly and can be iterated. A `WeakMap` holds object keys weakly, cannot be iterated, and lets entries be collected once the key is unreachable elsewhere."], ["What is the difference between `rss` and `heapUsed`?", "`heapUsed` is JavaScript objects on the V8 heap. `rss` is everything the process holds, including the heap, Buffers, code and thread stacks."], ["What does the \"JavaScript heap out of memory\" error mean?", "The old generation reached V8's size limit and collection could not free enough. It usually indicates a leak or loading too much data at once. Raising `--max-old-space-size` only helps if the workload legitimately needs more."]]}]}]}, {"name": "Stage 5 · Production", "sub": "Secure, deployed, and with AI", "lessons": [{"id": "node-sec", "title": "Security checklist", "level": "Expert", "mins": "30 min", "blocks": [{"t": "plain", "title": "", "text": "Most breaches of Node services come from a short list of mistakes: trusting input, missing authorisation checks, leaked secrets and outdated dependencies. Security is mostly doing the ordinary things every time."}, {"t": "bridge", "title": "", "text": "Mobile apps are the untrusted side. Anything the app sends can be forged with a proxy tool, so every rule the app enforces in its UI must be enforced again on the server."}, {"t": "table", "title": "The checklist", "rows": [["Risk", "What it looks like", "Defence"], ["Broken object authorisation", "Change the id in the URL, read someone else's order", "Check ownership in every query: `WHERE id = $1 AND user_id = $2`"], ["Injection", "User input becomes SQL or a shell command", "Parameterised queries, never `exec` with input"], ["Missing validation", "Negative quantity, 10 MB string, extra `isAdmin: true` field", "Zod schemas on body, params and query, with size limits"], ["Secrets in code", "API key committed to git", "Environment variables or a secret manager, rotate if leaked"], ["Vulnerable dependencies", "A package three levels down has a known hole", "`npm audit`, automated update PRs, lock file"], ["Brute force and scraping", "A million OTP guesses", "Rate limit per user and IP, lock out, alert"], ["Verbose errors", "Stack trace in the response", "Generic message to the client, details in logs"], ["Denial of service", "Huge bodies, slow requests, bad regular expressions", "Body limits, timeouts, avoid backtracking-heavy regexes"]]}, {"t": "code", "lang": "js", "title": "", "code": "import express from \"express\";\nimport helmet from \"helmet\";\nimport { rateLimit } from \"express-rate-limit\";\n\nconst app = express();\napp.disable(\"x-powered-by\");\napp.use(helmet());                                         // safe default security headers\napp.use(express.json({ limit: \"100kb\" }));\napp.use(\"/auth\", rateLimit({ windowMs: 60_000, limit: 5 }));   // 5 login attempts a minute per IP\n\napp.patch(\"/users/me\", (req, res) => {\n  const { name, phone } = req.body;                        // pick allowed fields explicitly\n  // never: Object.assign(user, req.body)  -> lets a client set role or balance\n  res.json({ name, phone });\n});"}, {"t": "flow", "title": "Layers a request passes", "lanes": [{"name": "", "nodes": [{"n": "Internet"}, {"a": ""}, {"n": "TLS"}, {"a": ""}, {"n": "WAF / rate limit"}, {"a": ""}, {"n": "Authentication"}, {"a": ""}, {"n": "Validation"}, {"a": ""}, {"n": "*Authorisation (is it yours?)"}, {"a": ""}, {"n": "Business logic"}, {"a": ""}, {"n": "Parameterised query"}]}]}, {"t": "real", "title": "", "text": "A wallet endpoint accepts `{ \"amount\": -500 }` for a \"pay\" action because the app's UI never allows negative numbers and nobody validated on the server. The balance goes up instead of down. The fix is one line in a schema (`z.number().int().positive()`), and the lesson is that the UI is not a security control."}, {"t": "pitfalls", "title": "", "items": ["Trusting any header or field that says who the user is. Identity comes only from the verified token.", "CORS set to allow every origin with credentials on a cookie-based API.", "Logging request bodies that contain passwords, OTPs or card data.", "Running the container as root."]}, {"t": "deep", "title": "Four attacks you can run on your own machine", "text": "Reading about vulnerabilities is not the same as seeing one work. Each demo below is safe and local.\n\n**Prototype pollution**: a recursive merge copies a key named `__proto__` from JSON input and ends up writing onto `Object.prototype`. Every object in the process then has the attacker's property. This has turned \"update my profile\" endpoints into privilege escalation.\n\n**Regular expression denial of service (ReDoS)**: some patterns take exponential time on certain inputs. Since a regex runs on the main thread, one request can freeze the server for seconds or minutes.\n\n**Path traversal**: a file name such as `../../etc/passwd` escapes the folder you meant to serve.\n\n**Command injection**: building a shell command from user input lets the user append their own commands. Pass arguments as an array so they are never interpreted by a shell."}, {"t": "code", "lang": "js", "title": "", "code": "import path from \"node:path\";\nimport { execFile } from \"node:child_process\";\nimport {
