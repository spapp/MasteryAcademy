<style>

}

  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0c121b; --surface:#141c29; --sunk:#0f1722; --ink:#e3eaf5; --muted:#93a1b5; --line:#253247;
    --py:#7fb0f2; --py-2:#e8bd4a; --node:#7fca84; --both:#c59be0;
    --code-bg:#080d16; --warn:#f0b866; --warn-bg:#2a2112; --ok:#6fcf97;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0c121b; --surface:#141c29; --sunk:#0f1722; --ink:#e3eaf5; --muted:#93a1b5; --line:#253247;
  --py:#7fb0f2; --py-2:#e8bd4a; --node:#7fca84; --both:#c59be0;
  --code-bg:#080d16; --warn:#f0b866; --warn-bg:#2a2112; --ok:#6fcf97;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;margin:0}
body[data-track="node"]{--acc:var(--node)}
body[data-track="both"]{--acc:var(--both)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
code{font-family:var(--f-mono);font-size:.9em;background:var(--sunk);padding:.08em .35em;border-radius:4px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.top-in{max-width:1240px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;padding-block:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--f-display);font-weight:700;font-size:17px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-weight:500}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:6px 14px;cursor:pointer;font-weight:500;display:flex;gap:8px;align-items:center}
.tab i{width:9px;height:9px;border-radius:50%;display:inline-block}
.tab[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.count{margin-left:auto;color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}

.wrap{max-width:1240px;margin:0 auto;display:grid;grid-template-columns:290px minmax(0,1fr);gap:28px;padding-block:22px 60px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.side{align-self:start;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);max-height:calc(100vh - 90px);overflow:auto;padding-right:4px}
.side summary{display:none}
.search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:12px}
.stage-h{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--acc);margin:16px 0 2px;font-weight:600}
.stage-s{font-size:12.5px;color:var(--muted);margin-bottom:6px}
.nav a{display:flex;gap:8px;align-items:baseline;padding:5px 8px;border-radius:6px;color:var(--ink);text-decoration:none;font-size:14.5px;line-height:1.35}
.nav a:hover{background:var(--sunk)}
.nav a[aria-current="true"]{background:var(--acc);color:var(--surface)}
.nav .tick{flex:none;width:12px;font-size:12px;color:var(--ok)}
.nav a[aria-current="true"] .tick{color:inherit}
.nav code,h1 code{background:none;padding:0;font-size:.95em}

.lesson{min-width:0}
.crumb{font-size:13px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.pips{display:inline-flex;gap:3px;vertical-align:middle}
.pips b{width:14px;height:5px;border-radius:2px;background:var(--line)}
.pips b.on{background:var(--acc)}
h1{font-family:var(--f-display);font-size:clamp(25px,3.6vw,34px);line-height:1.15;letter-spacing:-.02em;margin:6px 0 18px;text-wrap:balance}
.blocks{display:flex;flex-direction:column;gap:22px}
.b-label{font-family:var(--f-display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.prose{max-width:68ch}
.prose p{margin:0 0 10px}
.prose ul{margin:0 0 10px;padding-left:20px}
.b-analogy{border-left:3px solid var(--acc);padding-left:14px;font-size:17px}
.b-bridge{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 16px}
.b-real{background:var(--sunk);border-radius:10px;padding:14px 16px}
.b-pit{background:var(--warn-bg);border-radius:10px;padding:12px 16px}
.b-pit .b-label{color:var(--warn)}
.b-deep{border-top:2px solid var(--acc);padding-top:14px;margin-top:10px}
.b-deep .b-label{color:var(--acc)}
.b-pit ul{margin:0;padding-left:20px;max-width:68ch}

.code{background:var(--code-bg);border-radius:10px;overflow:hidden}
.code-h{display:flex;justify-content:space-between;gap:12px;padding:7px 14px;color:var(--code-dim);font-family:var(--f-mono);font-size:12px;border-bottom:1px solid #1d2a3e}
.code-h button{background:none;border:0;color:var(--code-dim);cursor:pointer;font-family:var(--f-mono);font-size:12px}
.code-h button:hover{color:var(--code-ink)}
.code pre{margin:0;padding:14px;overflow-x:auto;color:var(--code-ink);font-family:var(--f-mono);font-size:13.5px;line-height:1.55;tab-size:4}
.c{color:var(--code-dim)} .s{color:var(--code-str)} .k{color:var(--code-kw)} .n{color:var(--code-num)} .d{color:var(--code-dec)}

.diagram{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;overflow-x:auto}
.lane{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0}
.lane + .lane{border-top:1px dashed var(--line);margin-top:6px;padding-top:12px}
.lane-n{flex:none;width:92px;font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.node{border:1.5px solid var(--acc);border-radius:8px;padding:6px 11px;font-size:14px;background:var(--bg);max-width:230px;line-height:1.3}
.node.q{border-style:dashed;border-radius:18px}
.node.hot{background:var(--acc);color:var(--surface)}
.node.bad{border-color:var(--warn);color:var(--warn)}
.arr{color:var(--muted);font-size:13px;display:flex;flex-direction:column;align-items:center;line-height:1.1}
.arr::after{content:"\2192";font-size:18px}
.arr span{font-size:11.5px;font-style:italic}

.stepper .cap{font-size:15.5px;min-height:3.2em;max-width:68ch}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:10px 0 12px}
.col{border:1px solid var(--line);border-radius:8px;padding:8px;min-height:92px;background:var(--bg)}
.col h4{margin:0 0 6px;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-family:var(--f-display)}
.chip{display:block;font-family:var(--f-mono);font-size:12.5px;background:var(--surface);border:1px solid var(--acc);border-radius:6px;padding:3px 7px;margin-bottom:5px;overflow-wrap:anywhere}
.ctl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--acc)}
.btn.main{background:var(--acc);color:var(--surface);border-color:var(--acc)}
.btn:disabled{opacity:.45;cursor:default}
.ctl small{color:var(--muted);font-variant-numeric:tabular-nums}

.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-family:var(--f-display);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
tr:last-child td{border-bottom:0}

.quiz details{border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-bottom:6px}
.quiz summary{cursor:pointer;padding:9px 14px;font-weight:500}
.quiz details p{margin:0;padding:0 14px 12px;color:var(--muted);max-width:70ch}
.foot{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-top:30px;padding-top:18px;border-top:1px solid var(--line)}
.empty{color:var(--muted);font-size:14px;padding:8px}
.codewrap{display:flex;flex-direction:column;gap:0}
.code-h .acts{display:flex;gap:14px;flex-wrap:wrap;justify-content:flex-end}
.code-h button.go{color:var(--code-str);font-weight:500}
.runout{background:var(--sunk);border:1px solid var(--line);border-radius:10px;margin-top:8px;overflow:hidden}
.out-h{padding:6px 14px;font-size:12.5px;color:var(--muted);border-bottom:1px solid var(--line);font-family:var(--f-mono)}
.out-s.ok{color:var(--ok)} .out-s.bad{color:var(--warn)}
.out{margin:0;padding:12px 14px;font-family:var(--f-mono);font-size:13.5px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere;max-height:420px;overflow:auto;color:var(--ink);min-height:1.5em}
.out .e{color:var(--warn)}
body.pg .wrap{grid-template-columns:minmax(0,1fr);max-width:940px}
body.pg .side{display:none}
body[data-track="pg"]{--acc:var(--py-2)}
.pg-bar{display:flex;gap:12px 20px;flex-wrap:wrap;align-items:center;margin:18px 0 10px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg-b{border:0;background:var(--surface);padding:7px 16px;cursor:pointer;font-weight:500}
.seg-b + .seg-b{border-left:1px solid var(--line)}
.seg-b[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.pg-ex{font-size:14px;color:var(--muted);display:flex;gap:8px;align-items:center}
.pg-ex select{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px;max-width:100%}
.pg-code{display:block;width:100%;min-height:300px;resize:vertical;background:var(--code-bg);color:var(--code-ink);border:0;border-radius:10px;padding:14px;font-family:var(--f-mono);font-size:14px;line-height:1.55;tab-size:4;margin-bottom:10px;white-space:pre;overflow:auto}
.crumb a{color:var(--acc)}


@media (max-width:860px){
  .wrap{grid-template-columns:minmax(0,1fr);gap:14px}
  .side{position:static;max-height:none;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0}
  .side summary{display:block;padding:10px 14px;font-weight:600;cursor:pointer}
  .side .side-in{padding:0 12px 12px;max-height:55vh;overflow:auto}
  .lane-n{width:100%}
  .count{margin-left:0}
}
@media (min-width:861px){ .side summary{display:none} }
</style>

<script type="application/json" id="data">{"tracks": [{"id": "py", "name": "Python", "tagline": "backend + AI", "stages": [{"name": "Stage 0 · Layman", "sub": "What it is, install it, run one line", "lessons": [{"id": "py-map", "title": "The whole path on one page", "level": "Layman", "mins": "5 min", "blocks": [{"t": "plain", "title": "", "text": "Python is a programming language that reads almost like English. You type instructions in a text file, and a program called the **interpreter** carries them out line by line.\n\nIt is the main language of AI work and one of the most common languages for backend servers. That is why this track goes in one straight line: the language first, then servers, then AI on top of the server.\n\nEach lesson has the same parts: the idea in plain words, how it maps to Swift or Dart, code you can run, a flow diagram, a real example, common mistakes and questions to test yourself."}, {"t": "analogy", "title": "", "text": "A mobile app is the shop counter. The backend is the kitchen behind the wall. Python is one of the languages kitchens are written in."}, {"t": "flow", "title": "The seven stages", "lanes": [{"name": "Layman", "nodes": [{"n": "Install"}, {"a": ""}, {"n": "Run a file"}, {"a": ""}, {"n": "Variables"}]}, {"name": "Beginner", "nodes": [{"n": "Types"}, {"a": ""}, {"n": "Conditions"}, {"a": ""}, {"n": "Loops"}, {"a": ""}, {"n": "Functions"}]}, {"name": "Data", "nodes": [{"n": "Lists"}, {"a": ""}, {"n": "Dicts"}, {"a": ""}, {"n": "Comprehensions"}]}, {"name": "Intermediate", "nodes": [{"n": "Modules"}, {"a": ""}, {"n": "Errors"}, {"a": ""}, {"n": "Files"}, {"a": ""}, {"n": "Classes"}, {"a": ""}, {"n": "Type hints"}]}, {"name": "Advanced", "nodes": [{"n": "Generators"}, {"a": ""}, {"n": "Decorators"}, {"a": ""}, {"n": "Context managers"}, {"a": ""}, {"n": "Threads vs async"}]}, {"name": "Backend", "nodes": [{"n": "HTTP"}, {"a": ""}, {"n": "FastAPI"}, {"a": ""}, {"n": "Database"}, {"a": ""}, {"n": "Auth"}, {"a": ""}, {"n": "Tests"}, {"a": ""}, {"n": "Deploy"}]}, {"name": "AI", "nodes": [{"n": "NumPy and pandas"}, {"a": ""}, {"n": "LLM API"}, {"a": ""}, {"n": "Streaming"}, {"a": ""}, {"n": "Tools"}, {"a": ""}, {"n": "RAG"}, {"a": ""}, {"n": "Evals"}]}]}, {"t": "table", "title": "Where a mobile developer already stands", "rows": [["You know (Swift / Dart)", "Python calls it", "Lesson"], ["`struct` / data class", "`@dataclass`, Pydantic model", "Classes, Pydantic"], ["`Codable` / `fromJson`", "Pydantic validation", "Pydantic"], ["`async` / `await`", "`async` / `await` with `asyncio`", "Async"], ["`URLSession` / Dio", "`httpx`", "HTTP client"], ["`protocol` / abstract class", "`Protocol`, duck typing", "Classes"], ["SwiftPM / pub", "`pip`, `uv`, `pyproject.toml`", "Setup"], ["XCTest / flutter_test", "`pytest`", "Testing"]]}, {"t": "real", "title": "", "text": "A grocery order goes: phone app, HTTP request, Python server (FastAPI), database, response. Later an AI feature is added, such as \"suggest what I forgot to add\". The same Python server calls a language model and streams the answer back to the phone. By the end of this track you can build each box in that chain."}, {"t": "quiz", "title": "", "items": [["Why learn Python instead of only Swift or Dart for backend and AI?", "Most AI libraries, model SDK examples and data tools are Python first, and frameworks like FastAPI make it a quick way to ship a backend. Swift and Dart have small server ecosystems by comparison."], ["What does the interpreter do?", "It reads your source file, compiles it to bytecode and executes that bytecode one instruction at a time. There is no separate build step that you run yourself."]]}]}, {"id": "py-setup", "title": "Install Python and make a project", "level": "Layman", "mins": "20 min", "blocks": [{"t": "plain", "title": "", "text": "Three tools are all you need at the start: the `python3` program, a **virtual environment** and a package installer.\n\nA virtual environment is a private folder of libraries for one project. Without it every project shares one global set of libraries and they break each other.\n\n`pip` is the installer that ships with Python. `uv` is a newer, much faster tool that does the same job and also creates the environment. Learn `pip` and `venv` first, because every tutorial and server uses them."}, {"t": "analogy", "title": "", "text": "A virtual environment is a separate toolbox per job. The plumber's wrench set never gets mixed with the electrician's."}, {"t": "bridge", "title": "", "text": "`venv` plays the role of the per-project `Pods/` or `.dart_tool/` folder. `requirements.txt` or `pyproject.toml` is your `Podfile` / `pubspec.yaml`. A lock file is `Podfile.lock` / `pubspec.lock`."}, {"t": "code", "lang": "bash", "title": "Create and use a project", "code": "python3 --version              # 3.12 or newer is a good target\nmkdir shop-api && cd shop-api\npython3 -m venv .venv          # make the private toolbox\nsource .venv/bin/activate      # switch this terminal to it\npip install httpx              # installs into .venv only\npip freeze > requirements.txt  # write down exact versions\npython main.py                 # run a file\ndeactivate                     # leave the environment"}, {"t": "flow", "title": "What \"pip install\" does", "lanes": [{"name": "", "nodes": [{"n": "pip install httpx"}, {"a": ""}, {"n": "Look up package on PyPI"}, {"a": ""}, {"n": "Download wheel file"}, {"a": ""}, {"n": "Copy into .venv/lib/site-packages"}, {"a": ""}, {"n": "`import httpx` now works"}]}]}, {"t": "real", "title": "", "text": "A teammate clones your repository. They run `python3 -m venv .venv`, activate it and run `pip install -r requirements.txt`. They now have the same library versions you have, so \"works on my machine\" bugs mostly disappear. The `.venv` folder itself is never committed to git."}, {"t": "pitfalls", "title": "", "items": ["Forgetting to activate the environment, then installing into the system Python. Check with `which python`: the path should contain `.venv`.", "Committing `.venv` to git. Add it to `.gitignore`.", "Naming your own file `random.py` or `json.py`. Python imports your file instead of the standard library one."]}, {"t": "quiz", "title": "", "items": [["What problem does a virtual environment solve?", "Two projects that need different versions of the same library. Each environment has its own site-packages folder, so they do not clash."], ["What is the difference between `pip install x` and `pip install -r requirements.txt`?", "The first installs one named package. The second installs every package listed in a file, usually with pinned versions, so the setup is repeatable."], ["What is PyPI?", "The public package index that pip downloads from. It is the Python equivalent of pub.dev or CocoaPods trunk."]]}]}, {"id": "py-run", "title": "How Python runs your code", "level": "Layman", "mins": "15 min", "blocks": [{"t": "plain", "title": "", "text": "When you run `python main.py`, Python does two things. First it translates your text into **bytecode**, a compact list of small instructions. Then a loop inside the interpreter runs those instructions one by one.\n\nThere is no compile step you wait for, and types are checked while the program runs. A typo in a line that never runs is never reported. That is why tests and type checkers matter more in Python than in Swift.\n\nThe **REPL** is Python's interactive prompt. Type `python3`, then type a line, and you get the answer straight away. Use it to try things."}, {"t": "bridge", "title": "", "text": "Swift and Dart (release mode) compile ahead of time to machine code, and the compiler rejects type errors before the app runs. Python is closer to Dart in debug mode: code is loaded and run directly, and mistakes show up at run time."}, {"t": "code", "lang": "python", "title": "", "code": "import dis\n\ndef total(price, qty):\n    return price * qty\n\nprint(total(40, 3))\ndis.dis(total)   # shows the bytecode the interpreter actually runs"}, {"t": "flow", "title": "From text to result", "lanes": [{"name": "", "nodes": [{"n": "main.py (text)"}, {"a": ""}, {"n": "Parser builds a tree"}, {"a": ""}, {"n": "Compiler makes bytecode"}, {"a": ""}, {"n": "*Interpreter loop runs it"}, {"a": ""}, {"n": "Output"}]}]}, {"t": "steps", "title": "What happens on `print(total(40, 3))`", "steps": [{"c": "Python reads the file and defines the function `total`. Nothing inside it runs yet.", "cols": [["Names", ["total"]], ["Call stack", ["module"]], ["Output", []]]}, {"c": "The call `total(40, 3)` starts. A new frame is pushed with its own local names.", "cols": [["Names", ["total", "price=40", "qty=3"]], ["Call stack", ["module", "total"]], ["Output", []]]}, {"c": "`price * qty` is computed and returned. The frame is removed.", "cols": [["Names", ["total"]], ["Call stack", ["module"]], ["Output", []]]}, {"c": "`print` receives 120 and writes it.", "cols": [["Names", ["total"]], ["Call stack", ["module"]], ["Output", ["120"]]]}]}, {"t": "pitfalls", "title": "", "items": ["Expecting Python to catch a wrong type before running. `total(\"a\", \"b\")` only fails when that line executes.", "Thinking `.pyc` files in `__pycache__` are something to edit. They are cached bytecode. Ignore them and keep them out of git."]}, {"t": "quiz", "title": "", "items": [["Is Python compiled or interpreted?", "Both in sequence. Source is compiled to bytecode, then the bytecode is interpreted by the CPython virtual machine. It is not compiled to machine code ahead of time."], ["What is CPython?", "The standard implementation of Python, written in C. When people say Python they almost always mean CPython."], ["What is the REPL good for?", "Trying a single expression or library call and seeing the result at once, without creating a file."]]}]}]}, {"name": "Stage 1 · Beginner", "sub": "The words of the language", "lessons": [{"id": "py-vars", "title": "Variables and basic types", "level": "Beginner", "mins": "20 min", "blocks": [{"t": "plain", "title": "", "text": "A variable is a name stuck on a value. You do not declare a type. The value carries its own type, and the name can be pointed at a different value later.\n\nThe basic types are `int` (whole number, any size), `float` (decimal), `str` (text), `bool` (`True` / `False`) and `None` (no value)."}, {"t": "analogy", "title": "", "text": "A variable is a sticky note with a name on it. You stick it on a box. You can peel it off and stick it on another box. The box, not the note, knows what is inside."}, {"t": "bridge", "title": "", "text": "There is no `let` versus `var` and no `final`. Every name can be reassigned. `None` is `nil` / `null`. There are no optionals in the language itself. Type hints (a later lesson) give you `str | None`, which reads like `String?`."}, {"t": "code", "lang": "python", "title": "", "code": "name = \"Asha\"            # str\nitems = 3                # int\nprice = 49.5             # float\nis_member = True         # bool\ncoupon = None            # no value yet\n\ntotal = items * price\nprint(f\"{name} pays {total:.2f}\")      # f-string: values inside { }\nprint(type(total), type(coupon))\n\nitems = \"three\"          # allowed: the name now points at a str\nprint(10 // 3, 10 % 3, 2 ** 10)        # floor divide, remainder, power", "web": 1}, {"t": "flow", "title": "Names point at objects", "lanes": [{"name": "", "nodes": [{"n": "name"}, {"a": ""}, {"n": "\"Asha\" (str object)"}]}, {"name": "", "nodes": [{"n": "total"}, {"a": ""}, {"n": "148.5 (float object)"}]}, {"name": "", "nodes": [{"n": "coupon"}, {"a": ""}, {"n": "None (the single None object)"}]}]}, {"t": "real", "title": "", "text": "Money should not be a `float`. `0.1 + 0.2` is `0.30000000000000004`. Backends store prices as whole paise in an `int`, or use `decimal.Decimal`. An order total is computed in paise and formatted to rupees only when shown."}, {"t": "pitfalls", "title": "", "items": ["Using `==` to compare with `None`. Write `if coupon is None`.", "Storing money in floats.", "Assuming `/` gives a whole number. `7 / 2` is `3.5`. Use `//` for whole division."]}, {"t": "deep", "title": "How Python stores values and frees memory", "text": "Every value is an **object** on the heap with three things: an identity (its address, `id(x)`), a type and a reference count. A variable is only a name bound to an object. Assignment never copies. It binds another name to the same object.\n\nObjects are either **immutable** (`int`, `float`, `str`, `tuple`, `frozenset`) or **mutable** (`list`, `dict`, `set`, most classes). \"Changing\" an immutable value builds a new object and rebinds the name. Changing a mutable one alters the object that every name sees.\n\nMemory is freed by **reference counting**: when the last reference disappears the object is released at once. Counting cannot free two objects that point at each other, so a second mechanism, the **cyclic garbage collector**, runs periodically to find such groups."}, {"t": "code", "lang": "python", "title": "", "code": "import gc, sys, weakref\n\na = [1, 2, 3]\nb = a\nprint(id(a) == id(b), a is b, sys.getrefcount(a) - 1)     # same object, two references\n\nn = 10\nbefore = id(n)\nn += 1                                 # int is immutable: a new object, the name is rebound\nprint(id(n) == before)\n\nitems = [1, 2]\nsame = id(items)\nitems += [3]                           # list is mutable: changed in place\nprint(id(items) == same)\n\nt = ([1, 2], \"x\")                      # an immutable tuple can hold a mutable list\nt[0].append(3)\nprint(t)\n\nclass Node:\n    def __init__(self, name):\n        self.name, self.other = name, None\n\nx, y = Node(\"x\"), Node(\"y\")\nx.other, y.other = y, x                # a reference cycle\nwatch = weakref.ref(x)                 # a weak reference does not keep the object alive\ndel x, y                               # refcounts never reach zero because of the cycle\nprint(\"still alive:\", watch() is not None)\ngc.collect()                           # the cycle collector finds and frees them\nprint(\"after gc:\", watch())"}, {"t": "steps", "title": "Reference counts on one list", "steps": [{"c": "`a = [1, 2, 3]` creates a list and binds the name `a` to it.", "cols": [["Names pointing at the list", ["a"]], ["Reference count", ["1"]]]}, {"c": "`b = a` binds a second name. Nothing is copied.", "cols": [["Names pointing at the list", ["a", "b"]], ["Reference count", ["2"]]]}, {"c": "`del a` removes one name. The object lives on.", "cols": [["Names pointing at the list", ["b"]], ["Reference count", ["1"]]]}, {"c": "`b = None` removes the last reference. The list is freed immediately.", "cols": [["Names pointing at the list", []], ["Reference count", ["0 (freed)"]]]}]}, {"t": "table", "title": "Mutable or immutable", "rows": [["Type", "Mutable", "Can be a dict key"], ["`int`, `float`, `bool`, `str`, `bytes`", "No", "Yes"], ["`tuple`, `frozenset`", "No", "Yes, if contents are hashable"], ["`list`, `dict`, `set`, `bytearray`", "Yes", "No"], ["Your own class", "Yes by default", "Yes (hashes by identity unless you define `__eq__`)"]]}, {"t": "quiz", "title": "", "items": [["What is dynamic typing?", "The type belongs to the value, not to the variable name. A name can refer to an int now and a str later, and type errors appear at run time."], ["What is the difference between `is` and `==`?", "`==` asks whether two values are equal. `is` asks whether two names point at the very same object. Use `is` for `None`, `True` and `False`."], ["How big can a Python int get?", "As big as memory allows. There is no overflow at 64 bits."], ["How does Python manage memory?", "Every object has a reference count and is freed as soon as it reaches zero. A generational cyclic garbage collector additionally finds groups of objects that reference each other and are otherwise unreachable."], ["What is the difference between mutable and immutable objects?", "A mutable object can be changed in place, so every name bound to it sees the change. An immutable one cannot, so any \"change\" creates a new object."], ["Why does `a = 256; b = 256; a is b` print True but large numbers may not?", "CPython pre-creates and reuses small integers from -5 to 256, so both names point at the same object. This is an implementation detail, which is why you compare values with `==`."], ["What is a weak reference?", "A reference that does not increase the reference count. It is used for caches and observers so they do not keep objects alive."]]}]}, {"id": "py-str", "title": "Strings in practice", "level": "Beginner", "mins": "20 min", "blocks": [{"t": "plain", "title": "", "text": "A string is text. Strings cannot be changed in place: every operation returns a new string. Most backend work is reading, cleaning and building strings, so a few methods carry a lot of weight."}, {"t": "bridge", "title": "", "text": "Slicing `s[0:3]` replaces Swift's index dance and Dart's `substring`. f-strings are string interpolation: `f\"{x}\"` is `\"\\(x)\"` in Swift and `\"$x\"` in Dart."}, {"t": "code", "lang": "python", "title": "", "code": "raw = \"  Tomato, onion ,POTATO  \"\nclean = [part.strip().lower() for part in raw.split(\",\")]\nprint(clean)                         # ['tomato', 'onion', 'potato']\nprint(\", \".join(clean).title())      # Tomato, Onion, Potato\n\norder_id = \"BB-2026-000184\"\nprint(order_id[:2], order_id[-6:])   # first two, last six\nprint(order_id.startswith(\"BB\"), \"2026\" in order_id)\nprint(order_id.replace(\"-\", \"\"))\nprint(f\"{'Total':\u003c10}{1234.5:>10.2f}\")   # padding and alignment", "web": 1}, {"t": "flow", "title": "Cleaning one field", "lanes": [{"name": "", "nodes": [{"n": "Raw input"}, {"a": ""}, {"n": "strip spaces"}, {"a": ""}, {"n": "lower case"}, {"a": ""}, {"n": "split on comma"}, {"a": ""}, {"n": "validate each part"}, {"a": ""}, {"n": "store"}]}]}, {"t": "real", "title": "", "text": "A user types a pincode as \" 560 103 \". The server strips spaces, checks it is six digits with `value.isdigit() and len(value) == 6`, and only then looks up delivery slots. Every text field coming from a phone gets this treatment."}, {"t": "pitfalls", "title": "", "items": ["Building a long string with `+=` inside a loop. Collect parts in a list and call `\"\".join(parts)`.", "Forgetting strings are immutable. `s.upper()` returns a new string, it does not change `s`.", "Building SQL with f-strings. This allows SQL injection. Always pass parameters separately (database lesson)."]}, {"t": "quiz", "title": "", "items": [["Why are strings immutable?", "So they can be shared safely and used as dictionary keys. Any change creates a new string object."], ["How do you reverse a string?", "With a slice that steps backwards: `s[::-1]`."], ["What does `\"a,b,,c\".split(\",\")` return?", "`['a', 'b', '', 'c']`. Empty pieces are kept when you pass a separator."]]}]}, {"id": "py-flow", "title": "Conditions and loops", "level": "Beginner", "mins": "25 min", "blocks": [{"t": "plain", "title": "", "text": "Python uses **indentation** to show which lines belong together. There are no curly braces. Four spaces is the standard.\n\n`if / elif / else` chooses a path. `for` walks over a collection. `while` repeats until a condition turns false. `break` leaves a loop early and `continue` skips to the next round."}, {"t": "bridge", "title": "", "text": "`for item in items` is the same as Swift's `for item in items` and Dart's `for (final item in items)`. There is no C-style `for (i = 0; ...)`. Use `range(n)` for counting and `enumerate(items)` when you need the index."}, {"t": "code", "lang": "python", "title": "", "code": "cart = [(\"milk\", 62, 2), (\"bread\", 45, 1), (\"ghee\", 540, 1)]\ntotal = 0\nfor index, (name, price, qty) in enumerate(cart, start=1):\n    line = price * qty\n    total += line\n    print(index, name, line)\n\nif total >= 500:\n    delivery = 0\nelif total >= 200:\n    delivery = 20\nelse:\n    delivery = 40\nprint(\"total\", total, \"delivery\", delivery)\n\nattempts = 0\nwhile attempts \u003c 3:\n    attempts += 1\n    if attempts == 2:\n        break               # stop early\nprint(\"stopped after\", attempts)", "web": 1}, {"t": "flow", "title": "Delivery fee decision", "lanes": [{"name": "", "nodes": [{"n": "Cart total"}, {"a": ""}, {"n": "total >= 500?"}, {"a": "yes"}, {"n": "Free delivery"}]}, {"name": "", "nodes": [{"n": "Cart total"}, {"a": ""}, {"n": "total >= 200?"}, {"a": "yes"}, {"n": "Fee 20"}]}, {"name": "", "nodes": [{"n": "Cart total"}, {"a": ""}, {"n": "otherwise"}, {"a": ""}, {"n": "Fee 40"}]}]}, {"t": "steps", "title": "The loop, round by round", "steps": [{"c": "Before the loop starts, `total` is 0.", "cols": [["Current item", []], ["total", ["0"]]]}, {"c": "Round 1: milk, 62 × 2 = 124 is added.", "cols": [["Current item", ["milk 62 x2"]], ["total", ["124"]]]}, {"c": "Round 2: bread, 45 × 1 = 45 is added.", "cols": [["Current item", ["bread 45 x1"]], ["total", ["169"]]]}, {"c": "Round 3: ghee, 540 × 1 = 540 is added. The list is finished, so the loop ends.", "cols": [["Current item", ["ghee 540 x1"]], ["total", ["709"]]]}]}, {"t": "pitfalls", "title": "", "items": ["Mixing tabs and spaces. Set your editor to insert four spaces.", "Changing a list while looping over it. Loop over a copy (`for x in items[:]`) or build a new list.", "Writing `for i in range(len(items))` then `items[i]`. Loop over the items directly."]}, {"t": "quiz", "title": "", "items": [["What values are treated as false in an `if`?", "`False`, `None`, zero, and empty containers such as `\"\"`, `[]`, `{}` and `set()`. Everything else is true."], ["What does `for ... else` do?", "The `else` block runs only if the loop finished without hitting `break`. It is useful for \"searched everything, found nothing\"."], ["What is the difference between `range(5)` and `[0, 1, 2, 3, 4]`?", "`range` produces numbers one at a time and stores only start, stop and step. The list holds all five numbers in memory."]]}]}, {"id": "py-func", "title": "Functions", "level": "Beginner", "mins": "30 min", "blocks": [{"t": "plain", "title": "", "text": "A function is a named block of code that takes inputs and returns an output. In Python functions are ordinary values: you can store one in a variable, pass it to another function and return it.\n\nArguments can be passed by position or by name. A parameter can have a default. `*args` collects extra positional arguments into a tuple, and `**kwargs` collects extra named ones into a dict."}, {"t": "bridge", "title": "", "text": "Python has no argument labels like Swift. Any parameter can be passed by name: `fee(total=300)`. A bare `*` in the parameter list forces everything after it to be named, which gives you Dart-style named parameters. `lambda x: x * 2` is a one-expression closure."}, {"t": "code", "lang": "python", "title": "", "code": "def delivery_fee(total, *, member=False, surge=1.0):\n    \"\"\"Return the fee in rupees. Arguments after * must be named.\"\"\"\n    if member or total >= 500:\n        return 0\n    return round(20 * surge)\n\nprint(delivery_fee(300))\nprint(delivery_fee(300, surge=1.5))\nprint(delivery_fee(300, member=True))\n\ndef log(event, *args, **kwargs):\n    print(event, args, kwargs)\n\nlog(\"order_placed\", 184, \"express\", city=\"Bengaluru\", items=7)\n\nprices = [62, 45, 540]\nprint(sorted(prices, key=lambda p: -p))      # a function passed as a value\nprint(list(map(lambda p: p * 2, prices)))", "web": 1}, {"t": "flow", "title": "One call", "lanes": [{"name": "", "nodes": [{"n": "Caller"}, {"a": ""}, {"n": "Arguments bound to parameter names"}, {"a": ""}, {"n": "New frame with local variables"}, {"a": ""}, {"n": "Body runs"}, {"a": ""}, {"n": "return value (or None)"}, {"a": ""}, {"n": "Frame discarded"}]}]}, {"t": "real", "title": "", "text": "Every backend endpoint is a function: it receives the request data as arguments and returns the response. A framework such as FastAPI calls your function for you when a matching URL arrives. Keeping the business rule (`delivery_fee`) in a plain function, separate from the web layer, makes it trivial to test."}, {"t": "pitfalls", "title": "", "items": ["A mutable default argument: `def add(item, cart=[])`. The list is created once and shared by every call. Use `cart=None` and create the list inside.", "Forgetting `return`. The function then returns `None`.", "Changing a list or dict that was passed in, when the caller did not expect it."]}, {"t": "deep", "title": "Scope, closures and the late-binding trap", "text": "When Python meets a name it searches four places in order, known as **LEGB**: the **L**ocal function, any **E**nclosing functions, the module's **G**lobals and the **B**uilt-ins. Assigning to a name inside a function makes it local to that function unless you declare `nonlocal` or `global`.\n\nA **closure** is an inner function that keeps access to variables of the enclosing function after that function has returned. Closures capture the **variable**, not its value at that moment. This causes the best-known Python trap: functions created in a loop all see the loop variable's final value."}, {"t": "code", "lang": "python", "title": "", "code": "total = 100                       # global\n\ndef outer():\n    total = 10                    # enclosing\n    def inner():\n        return total + 1          # found in the enclosing scope, not the global one\n    return inner()\nprint(outer(), total)\n\ndef make_counter():\n    count = 0\n    def increment():\n        nonlocal count            # without this line: UnboundLocalError\n        count += 1\n        return count\n    return increment\n\nnext_id = make_counter()\nprint(next_id(), next_id(), next_id.__closure__[0].cell_contents)\n\nhandlers = [lambda: n * 10 for n in range(3)]\nprint([h() for h in handlers])            # [20, 20, 20]: all share one variable n\n\nfixed = [lambda n=n: n * 10 for n in range(3)]   # a default argument captures the value now\nprint([h() for h in fixed])               # [0, 10, 20]\n\ndef broken():\n    print(total)                  # looks global, but the assignment below makes it local\n    total = 5\ntry:\n    broken()\nexcept UnboundLocalError as err:\n    print(\"UnboundLocalError:\", err)"}, {"t": "flow", "title": "Name lookup order", "lanes": [{"name": "", "nodes": [{"n": "Name used"}, {"a": ""}, {"n": "Local scope?"}, {"a": "no"}, {"n": "Enclosing function scopes?"}, {"a": "no"}, {"n": "Module globals?"}, {"a": "no"}, {"n": "Built-ins?"}, {"a": "no"}, {"n": "!NameError"}]}]}, {"t": "table", "title": "Argument kinds in one signature", "rows": [["Written as", "Meaning"], ["`def f(a, b)`", "Positional or keyword"], ["`def f(a, /, b)`", "Before `/`: positional only"], ["`def f(a, *, b)`", "After `*`: keyword only"], ["`def f(*args)`", "Extra positional arguments as a tuple"], ["`def f(**kwargs)`", "Extra keyword arguments as a dict"], ["`f(*items)`, `f(**options)`", "At a call site: unpack a sequence or dict into arguments"]]}, {"t": "quiz", "title": "", "items": [["What is the mutable default argument bug?", "Default values are evaluated once, when the function is defined. A default list or dict is shared between calls, so data leaks from one call to the next. Use `None` as the default and build the object inside the function."], ["What are `*args` and `**kwargs`?", "`*args` gathers extra positional arguments into a tuple. `**kwargs` gathers extra keyword arguments into a dict. They let a function accept any call shape, which wrappers and decorators rely on."], ["Does Python pass arguments by value or by reference?", "Neither exactly. It passes a reference to the object. Reassigning the parameter does not affect the caller, but mutating the object (appending to a list) does."], ["What is a closure?", "A function that remembers variables from the scope where it was created, even after that scope has finished."], ["What is the LEGB rule?", "The order in which Python resolves a name: Local, Enclosing function, Global (module), Built-in."], ["Why do closures created in a loop all return the same value?", "They capture the variable, which is looked up when the function is called. By then the loop has finished and the variable holds its last value. Bind the current value with a default argument or `functools.partial`."], ["What does `nonlocal` do?", "It tells Python that an assignment refers to a variable in an enclosing function's scope instead of creating a new local one."], ["What is a pure function and why prefer it?", "A function whose result depends only on its arguments and which changes nothing outside itself. It is easy to test, cache and run concurrently."]]}]}]}, {"name": "Stage 2 · Data", "sub": "The four containers you use every day", "lessons": [{"id": "py-list", "title": "Lists and tuples", "level": "Beginner", "mins": "25 min", "blocks": [{"t": "plain", "title": "", "text": "A **list** is an ordered, changeable sequence. A **tuple** is an ordered sequence that cannot be changed after creation. Use a list for \"many of the same kind of thing\" and a tuple for \"one record with fixed positions\".\n\nSlicing takes a piece: `items[start:stop:step]`. Unpacking splits a sequence into names in one line."}, {"t": "bridge", "title": "", "text": "`list` is `Array` / `List`. A tuple is a Swift tuple or a Dart record. Negative indexes count from the end: `items[-1]` is `items.last`."}, {"t": "code", "lang": "python", "title": "", "code": "slots = [\"7-9\", \"9-11\", \"11-13\", \"17-19\", \"19-21\"]\nslots.append(\"21-23\")\nslots.insert(0, \"6-7\")\nprint(slots[0], slots[-1], slots[1:3], slots[::2])\nprint(len(slots), \"9-11\" in slots, slots.index(\"17-19\"))\n\nfirst, *middle, last = slots          # unpacking with a star\nprint(first, len(middle), last)\n\npoint = (12.97, 77.59)                # tuple: latitude, longitude\nlat, lon = point\n\norders = [(\"A\", 320), (\"B\", 90), (\"C\", 760)]\norders.sort(key=lambda o: o[1], reverse=True)\nprint(orders[0])\na = [1, 2, 3]\nb = a            # same list, two names\nc = a.copy()     # a new list\nb.append(4)\nprint(a, c)      # [1, 2, 3, 4] [1, 2, 3]", "web": 1}, {"t": "steps", "title": "Two names, one list", "steps": [{"c": "`a = [1, 2, 3]` creates one list object.", "cols": [["Names", ["a"]], ["List object 1", ["1", "2", "3"]], ["List object 2", []]]}, {"c": "`b = a` does not copy. Both names point at the same object.", "cols": [["Names", ["a", "b (same object)"]], ["List object 1", ["1", "2", "3"]], ["List object 2", []]]}, {"c": "`c = a.copy()` creates a second, independent list.", "cols": [["Names", ["a", "b (same object)", "c (object 2)"]], ["List object 1", ["1", "2", "3"]], ["List object 2", ["1", "2", "3"]]]}, {"c": "`b.append(4)` changes object 1. `a` sees it. `c` does not.", "cols": [["Names", ["a", "b (same object)", "c (object 2)"]], ["List object 1", ["1", "2", "3", "4"]], ["List object 2", ["1", "2", "3"]]]}]}, {"t": "flow", "title": "Choosing a sequence", "lanes": [{"name": "", "nodes": [{"n": "Need to add or remove items?"}, {"a": "yes"}, {"n": "list"}]}, {"name": "", "nodes": [{"n": "Need to add or remove items?"}, {"a": "no, fixed record"}, {"n": "tuple"}]}, {"name": "", "nodes": [{"n": "Need fast \"is x in here\"?"}, {"a": ""}, {"n": "set (next lesson)"}]}]}, {"t": "pitfalls", "title": "", "items": ["`b = a` copies the reference, not the list. This is the opposite of Swift arrays, which are value types.", "`[[0] * 3] * 3` makes three references to the same inner list. Use `[[0] * 3 for _ in range(3)]`.", "`list.sort()` sorts in place and returns `None`. `sorted(list)` returns a new list."]}, {"t": "quiz", "title": "", "items": [["List versus tuple: when do you use each?", "A list for a collection that grows or changes. A tuple for a fixed group of values, as a dictionary key, or to signal \"do not modify\". Tuples are hashable when their contents are."], ["What is the cost of `x in some_list`?", "It scans the list, so it is O(n). A set or dict does the same check in O(1) on average."], ["What is the difference between a shallow and a deep copy?", "A shallow copy makes a new outer container that still points at the same inner objects. `copy.deepcopy` copies everything recursively."]]}]}, {"id": "py-dict", "title": "Dicts and sets", "level": "Beginner", "mins": "25 min", "blocks": [{"t": "plain", "title": "", "text": "A **dict** maps keys to values. It is the most used structure in backend Python because JSON objects become dicts. Lookup by key is fast no matter how large the dict is.\n\nA **set** is a collection of unique values with fast membership tests and set maths (union, intersection, difference)."}, {"t": "bridge", "title": "", "text": "`dict` is `Dictionary` / `Map`. `d.get(\"key\")` returns `None` when the key is missing, like optional subscript access in Swift. `d[\"key\"]` on a missing key raises `KeyError`, like a force unwrap."}, {"t": "code", "lang": "python", "title": "", "code": "from collections import Counter, defaultdict\n\nproduct = {\"id\": 4411, \"name\": \"Toor Dal\", \"price\": 189, \"tags\": [\"staples\"]}\nprint(product[\"name\"], product.get(\"discount\", 0))\nproduct[\"stock\"] = 25\nfor key, value in product.items():\n    print(key, \"=\", value)\n\norders = [(\"blr\", 320), (\"del\", 90), (\"blr\", 760), (\"mum\", 410)]\nby_city = defaultdict(list)\nfor city, amount in orders:\n    by_city[city].append(amount)\nprint(dict(by_city))\nprint(Counter(city for city, _ in orders).most_common(1))\n\nyesterday = {\"milk\", \"bread\", \"eggs\"}\ntoday = {\"milk\", \"curd\"}\nprint(yesterday & today, yesterday - today, yesterday | today)", "web": 1}, {"t": "flow", "title": "How a dict finds a key", "lanes": [{"name": "", "nodes": [{"n": "Key \"price\""}, {"a": ""}, {"n": "hash(\"price\") gives a number"}, {"a": ""}, {"n": "Number picks a slot in a table"}, {"a": ""}, {"n": "Slot holds key and value"}, {"a": ""}, {"n": "Return 189"}]}]}, {"t": "real", "title": "", "text": "\"Group orders by city\", \"count how many times each product was bought\" and \"which of these 5,000 product ids are out of stock\" are all one line with `defaultdict`, `Counter` and a set. Reaching for a nested loop instead turns a 10 millisecond job into a 10 second one."}, {"t": "pitfalls", "title": "", "items": ["Using a list as a dict key. Keys must be hashable: use a tuple.", "`d[\"missing\"]` crashing a request. Use `.get()` with a default for optional fields.", "Changing a dict while looping over it. Loop over `list(d.items())`."]}, {"t": "deep", "title": "Inside the hash table", "text": "A dict is a **hash table**. To store a key Python calls `hash(key)`, uses part of that number to choose a slot and stores the key and value there. To look a key up it does the same calculation and goes straight to the slot. That is why lookup time does not grow with the size of the dict.\n\nTwo different keys can land on the same slot. This is a **collision**. Python then probes other slots in a fixed pattern until it finds a free one. When the table is about two thirds full it is resized to keep collisions rare, which costs a full copy now and then.\n\nThis design explains the rules you have met. A key must be **hashable**, meaning its hash never changes during its life. Objects that compare equal must have the same hash. And if every key hashed to the same number, the dict would degrade into a slow list."}, {"t": "code", "lang": "python", "title": "", "code": "import timeit\n\nclass BadKey:\n    \"\"\"Every instance has the same hash: all keys collide.\"\"\"\n    def __init__(self, n): self.n = n\n    def __hash__(self): return 1\n    def __eq__(self, other): return self.n == other.n\n\nclass GoodKey(BadKey):\n    def __hash__(self): return hash(self.n)\n\ndef fill(kind, size):\n    return {kind(i): i for i in range(size)}\n\nfor kind in (GoodKey, BadKey):\n    seconds = timeit.timeit(lambda: fill(kind, 1000), number=3)\n    print(f\"{kind.__name__}: {seconds:.3f}s for 3 x 1000 inserts\")\n\nprint(hash(\"milk\") == hash(\"milk\"), hash((1, 2)) == hash((1, 2)))\ntry:\n    {[1, 2]: \"x\"}\nexcept TypeError as err:\n    print(\"TypeError:\", err)\n\nstock = {\"milk\": 3}\nkeys = stock.keys()               # a live view, not a copy\nstock[\"bread\"] = 4\nprint(list(keys), stock | {\"milk\": 9}, {**stock, \"eggs\": 12})", "web": 1}, {"t": "steps", "title": "Storing and finding a key", "steps": [{"c": "`d[\"milk\"] = 3`. Python computes `hash(\"milk\")` and takes its low bits to pick a slot.", "cols": [["Slots 0 to 7", ["-", "-", "-", "-", "-", "milk=3", "-", "-"]], ["Note", ["hash picks slot 5"]]]}, {"c": "`d[\"bread\"] = 4` hashes to slot 2.", "cols": [["Slots 0 to 7", ["-", "-", "bread=4", "-", "-", "milk=3", "-", "-"]], ["Note", ["no collision"]]]}, {"c": "`d[\"eggs\"] = 12` also hashes to slot 5, which is taken. A collision. Python probes the next slot in its sequence.", "cols": [["Slots 0 to 7", ["-", "-", "bread=4", "-", "-", "milk=3", "eggs=12", "-"]], ["Note", ["collision resolved by probing"]]]}, {"c": "Lookup of `\"eggs\"`: slot 5 holds a different key, so the same probe sequence is followed to slot 6.", "cols": [["Slots 0 to 7", ["-", "-", "bread=4", "-", "-", "milk=3", "eggs=12", "-"]], ["Note", ["found after 2 checks"]]]}, {"c": "More keys arrive and the table passes two thirds full. Python allocates a bigger table and re-inserts everything.", "cols": [["Slots 0 to 7", ["(table doubled to 16 slots)"]], ["Note", ["occasional resize keeps lookups fast"]]]}]}, {"t": "quiz", "title": "", "items": [["Why is dict lookup O(1)?", "The key is hashed to a number that points directly at a slot in a table, so no scan is needed. Collisions are handled internally and are rare on average."], ["What can be a dict key?", "Any hashable value: str, int, float, tuple of hashables, frozenset. Lists, dicts and sets cannot, because they can change."], ["Do dicts keep order?", "Yes. Since Python 3.7 a dict keeps keys in insertion order."], ["How do you remove duplicates from a list while keeping order?", "`list(dict.fromkeys(items))`. A set would remove duplicates but lose the order."], ["How is a dict implemented?", "As an open-addressing hash table. The key's hash selects a slot. Collisions are resolved by probing other slots, and the table grows when it gets too full."], ["What makes an object hashable?", "It has a `__hash__` that returns the same value for its whole life and an `__eq__` consistent with it: equal objects have equal hashes."], ["What is the worst-case lookup time of a dict?", "O(n), when many keys collide. With a good hash function the average is O(1)."], ["What is the time complexity of common list operations?", "Index and append are O(1). Insert or delete at the front and membership tests are O(n). Sorting is O(n log n)."]]}]}, {"id": "py-comp", "title": "Comprehensions", "level": "Beginner", "mins": "20 min", "blocks": [{"t": "plain", "title": "", "text": "A comprehension builds a list, dict or set from a loop in one expression. It reads as \"give me this, for each item in that, if a condition holds\". It is the idiomatic replacement for `map` and `filter`."}, {"t": "bridge", "title": "", "text": "`[p.price for p in items if p.in_stock]` is `items.filter { $0.inStock }.map { $0.price }` in Swift and `items.where((p) => p.inStock).map((p) => p.price).toList()` in Dart. The filter is written last but applied first."}, {"t": "code", "lang": "python", "title": "", "code": "cart = [\n    {\"name\": \"milk\", \"price\": 62, \"qty\": 2, \"in_stock\": True},\n    {\"name\": \"ghee\", \"price\": 540, \"qty\": 1, \"in_stock\": False},\n    {\"name\": \"bread\", \"price\": 45, \"qty\": 1, \"in_stock\": True},\n]\nnames = [item[\"name\"] for item in cart]\navailable = [item for item in cart if item[\"in_stock\"]]\nprice_by_name = {item[\"name\"]: item[\"price\"] for item in cart}\ntotal = sum(item[\"price\"] * item[\"qty\"] for item in available)   # generator: no list built\nprint(names, price_by_name, total)\nprint(any(not item[\"in_stock\"] for item in cart), all(item[\"qty\"] > 0 for item in cart))", "web": 1}, {"t": "flow", "title": "Reading order of a comprehension", "lanes": [{"name": "", "nodes": [{"n": "for item in cart"}, {"a": ""}, {"n": "if item is in stock?"}, {"a": "yes"}, {"n": "compute item name"}, {"a": ""}, {"n": "append to new list"}]}]}, {"t": "pitfalls", "title": "", "items": ["Nesting three loops in one comprehension. If it does not fit on one readable line, write a normal loop.", "Using a comprehension only for a side effect such as printing. Use a `for` loop.", "Building a huge list just to sum it. Drop the square brackets to get a generator."]}, {"t": "quiz", "title": "", "items": [["What is the difference between `[x for x in data]` and `(x for x in data)`?", "The first builds the whole list in memory. The second is a generator that produces one value at a time when asked."], ["When should you not use a comprehension?", "When the logic needs several statements, error handling or side effects. Readability wins over brevity."]]}]}]}, {"name": "Stage 3 · Intermediate", "sub": "Organising real programs", "lessons": [{"id": "py-mod", "title": "Modules, packages and imports", "level": "Intermediate", "mins": "25 min", "blocks": [{"t": "plain", "title": "", "text": "A **module** is one `.py` file. A **package** is a folder of modules. `import` runs the module once, caches it and gives you a name to reach what is inside.\n\nCode at the top level of a file runs at import time. The line `if __name__ == \"__main__\":` means \"only do this when the file is run directly, not when it is imported\"."}, {"t": "bridge", "title": "", "text": "A module is a Swift file or a Dart library, except nothing is visible until you import it by name. There is no `private` keyword. A leading underscore (`_helper`) is a convention meaning \"internal, do not use from outside\"."}, {"t": "code", "lang": "text", "title": "A typical backend layout", "code": "shop-api/\n  pyproject.toml\n  app/\n    __init__.py\n    main.py          # creates the web app\n    config.py        # settings from environment variables\n    routes/orders.py # URL handlers\n    services/pricing.py   # business rules, no web code\n    db/models.py     # tables\n  tests/test_pricing.py"}, {"t": "code", "lang": "python", "title": "", "code": "# app/services/pricing.py\nGST_RATE = 0.05\n\ndef with_tax(amount: int) -> int:\n    return round(amount * (1 + GST_RATE))\n\nif __name__ == \"__main__\":      # python -m app.services.pricing\n    print(with_tax(200))\n\n# app/routes/orders.py would then say:\n# from app.services.pricing import with_tax"}, {"t": "flow", "title": "What `import pricing` does", "lanes": [{"name": "", "nodes": [{"n": "import statement"}, {"a": ""}, {"n": "Already in sys.modules?"}, {"a": "yes"}, {"n": "Reuse cached module"}]}, {"name": "", "nodes": [{"n": "import statement"}, {"a": ""}, {"n": "Not cached"}, {"a": ""}, {"n": "Search folders in sys.path"}, {"a": ""}, {"n": "Run the file top to bottom"}, {"a": ""}, {"n": "Store in sys.modules"}, {"a": ""}, {"n": "Bind the name"}]}]}, {"t": "real", "title": "", "text": "Layers keep a backend changeable: routes know about HTTP, services know the business rules, the db layer knows SQL. A pricing rule change touches one file in `services/` and its test, and no web code."}, {"t": "pitfalls", "title": "", "items": ["Circular imports: `a.py` imports `b.py` which imports `a.py`. Move the shared piece into a third module.", "Doing slow work (database connections, network calls) at import time. Imports should only define things.", "`from module import *`. It hides where names come from."]}, {"t": "quiz", "title": "", "items": [["What does `if __name__ == \"__main__\":` do?", "`__name__` is `\"__main__\"` only in the file that was started directly. The guard lets a file be both an importable module and a runnable script."], ["How does Python find a module?", "It checks the cache `sys.modules`, then searches each folder in `sys.path`: the script's folder, installed packages in site-packages and the standard library."], ["What is the difference between absolute and relative imports?", "`from app.services import pricing` is absolute, from the project root. `from . import pricing` is relative to the current package. Absolute imports are clearer and preferred."]]}]}, {"id": "py-err", "title": "Errors and exceptions", "level": "Intermediate", "mins": "25 min", "blocks": [{"t": "plain", "title": "", "text": "When something goes wrong Python **raises** an exception. It travels up through the calling functions until some `try / except` catches it. If nothing does, the program stops and prints a traceback.\n\n`try` wraps the risky code, `except` handles a specific error type, `else` runs when there was no error, and `finally` always runs, which makes it the place for cleanup."}, {"t": "bridge", "title": "", "text": "`raise` is `throw`. `try / except` is `do / catch` in Swift and `try / on ... catch` in Dart. Functions are not marked `throws`: any call can raise, so you decide where it makes sense to catch."}, {"t": "code", "lang": "python", "title": "", "code": "class OutOfStock(Exception):\n    def __init__(self, sku: str, wanted: int, available: int):\n        super().__init__(f\"{sku}: wanted {wanted}, only {available} left\")\n        self.sku, self.available = sku, available\n\nSTOCK = {\"milk\": 3}\n\ndef reserve(sku: str, qty: int) -> None:\n    available = STOCK.get(sku, 0)\n    if qty > available:\n        raise OutOfStock(sku, qty, available)\n    STOCK[sku] = available - qty\n\ntry:\n    reserve(\"milk\", 2)\n    reserve(\"milk\", 5)\nexcept OutOfStock as err:\n    print(\"tell the user:\", err, \"| can offer\", err.available)\nexcept Exception as err:          # last resort, log and re-raise\n    print(\"unexpected\", err)\n    raise\nelse:\n    print(\"all reserved\")\nfinally:\n    print(\"stock now\", STOCK)", "web": 1}, {"t": "flow", "title": "Where an exception goes", "lanes": [{"name": "", "nodes": [{"n": "reserve() raises OutOfStock"}, {"a": ""}, {"n": "Caller has a matching except?"}, {"a": "no"}, {"n": "Goes up one more caller"}]}, {"name": "", "nodes": [{"n": "Caller has a matching except?"}, {"a": "yes"}, {"n": "Handler runs"}, {"a": ""}, {"n": "finally runs"}, {"a": ""}, {"n": "Program continues"}]}, {"name": "", "nodes": [{"n": "Nobody catches it"}, {"a": ""}, {"n": "!Traceback printed, request fails with 500"}]}]}, {"t": "real", "title": "", "text": "In a web server you rarely catch errors inside each function. Business code raises a specific exception such as `OutOfStock`. One central handler turns it into an HTTP 409 with a clear message. Anything unexpected becomes a 500, is logged with its traceback and never leaks internals to the phone."}, {"t": "pitfalls", "title": "", "items": ["A bare `except:` or `except Exception: pass` that swallows every error. The bug is still there, now it is invisible.", "Catching too high up and losing the context needed to fix the problem.", "Using exceptions for normal control flow in a hot loop."]}, {"t": "deep", "title": "The exception tree, chaining, groups and reading a traceback", "text": "Exceptions form a class tree. `except SomeError` also catches every subclass of it, so the order of your `except` clauses matters: put the most specific first. Your own errors should share one base class per application, with a subclass per situation. A central handler can then map any of them to an HTTP response.\n\n**Chaining** keeps the original error when you raise a more meaningful one: `raise AppError(...) from err` stores the low-level error as `__cause__`, and the traceback shows both.\n\nAn **exception group** carries several unrelated errors at once, for example every failed validation or every failed task in a `TaskGroup`. `except*` handles the members of one type and lets the rest continue upward.\n\nRead a **traceback** from the bottom. The last line is the error type and message. The lines above it are the call chain, most recent call last. The frame nearest the bottom that is in your own code is usually where to look."}, {"t": "code", "lang": "python", "title": "", "code": "import contextlib, io, logging, os\n\nclass AppError(Exception):\n    status, code = 500, \"internal\"\n\nclass NotFound(AppError):\n    status, code = 404, \"not_found\"\n\nclass OutOfStock(AppError):\n    status, code = 409, \"out_of_stock\"\n\ndef to_response(err: Exception) -> tuple[int, dict]:\n    if isinstance(err, AppError):                      # one handler for the whole family\n        return err.status, {\"error\": err.code, \"message\": str(err)}\n    return 500, {\"error\": \"internal\"}                  # never leak unknown errors\n\nfor err in (NotFound(\"order 99\"), OutOfStock(\"milk\"), ZeroDivisionError(\"bug\")):\n    print(to_response(err))\nprint([cls.__name__ for cls in KeyError.__mro__])\n\ndef parse_qty(raw: str) -> int:\n    try:\n        return int(raw)\n    except ValueError as err:\n        raise AppError(f\"quantity must be a number, got {raw!r}\") from err\n\ntry:\n    parse_qty(\"two\")\nexcept AppError as err:\n    print(\"error:\", err, \"| caused by:\", repr(err.__cause__))\n\ndef validate(order: dict) -> None:\n    problems: list[Exception] = []\n    if order.get(\"qty\", 0) \u003c= 0:\n        problems.append(ValueError(\"qty must be positive\"))\n    if \"sku\" not in order:\n        problems.append(KeyError(\"sku\"))\n    if problems:\n        raise ExceptionGroup(\"invalid order\", problems)\n\ntry:\n    validate({\"qty\": 0})\nexcept* ValueError as group:\n    print(\"value problems:\", [str(e) for e in group.exceptions])\nexcept* KeyError as group:\n    print(\"missing fields:\", [str(e) for e in group.exceptions])\n\nwith contextlib.suppress(FileNotFoundError):            # an expected, harmless failure\n    os.remove(\"/tmp/does-not-exist-184\")\n\nstream = io.StringIO()\nlogging.basicConfig(stream=stream, level=logging.INFO, format=\"%(levelname)s %(message)s\")\ntry:\n    {}[\"order_id\"]\nexcept KeyError:\n    logging.exception(\"failed to load order\")           # logs the message and the full traceback\nprint(stream.getvalue().splitlines()[0], \"|\", stream.getvalue().splitlines()[-1])"}, {"t": "table", "title": "The part of the built-in tree you meet most", "rows": [["Class", "Raised when"], ["`BaseException`", "Root. Includes `KeyboardInterrupt` and `SystemExit`, which you should not catch"], ["`Exception`", "Root of everything you normally handle"], ["`ValueError` / `TypeError`", "Right type but bad value / wrong type"], ["`LookupError` → `KeyError`, `IndexError`", "Missing dict key / list index out of range"], ["`AttributeError`", "Attribute does not exist, often on `None`"], ["`OSError` → `FileNotFoundError`, `PermissionError`, `TimeoutError`, `ConnectionError`", "The operating system refused"], ["`RuntimeError` → `RecursionError`, `NotImplementedError`", "General run-time failure"], ["`asyncio.CancelledError`", "A task was cancelled. Derives from `BaseException`"]]}, {"t": "steps", "title": "Reading a traceback bottom-up", "steps": [{"c": "Start at the last line: the exception type and message.", "cols": [["Line you are reading", ["KeyError: 'order_id'"]], ["What it tells you", ["a dict had no such key"]]]}, {"c": "Go up one frame: the exact line that raised.", "cols": [["Line you are reading", ["File \"orders.py\"", "line 42", "in load_order"]], ["What it tells you", ["where it happened"]]]}, {"c": "Keep going up until you leave library code and reach your own.", "cols": [["Line you are reading", ["File \"routes.py\"", "line 17", "in get_order"]], ["What it tells you", ["who called it", "with what"]]]}, {"c": "If you see \"The above exception was the direct cause of\", there are two errors. Read the first one too.", "cols": [["Line you are reading", ["(the earlier traceback above)"]], ["What it tells you", ["the original low-level failure"]]]}]}, {"t": "quiz", "title": "", "items": [["What is the difference between `except Exception` and a bare `except`?", "A bare `except` also catches `KeyboardInterrupt` and `SystemExit`, which you almost never want to swallow. `except Exception` leaves those alone."], ["When does `finally` run?", "Always: after success, after a handled error, after an unhandled error and even after a `return` inside the `try`."], ["What does `raise ... from err` do?", "It raises a new exception while keeping the original as its cause, so the traceback shows both."], ["What is EAFP?", "\"Easier to ask forgiveness than permission\": try the operation and handle the failure, instead of checking every condition first. It is the common Python style."], ["Why order `except` clauses from specific to general?", "The first matching clause wins, and a parent class matches all its subclasses. A general clause placed first would hide the specific ones."], ["What is exception chaining?", "Raising a new exception while attaching the original as its cause with `raise New(...) from original`. Both appear in the traceback."], ["What is an ExceptionGroup?", "An exception that bundles several exceptions. `except*` handles the members matching a type and re-raises the rest. Task groups raise them when several tasks fail."], ["What does `logging.exception` do?", "It logs at error level and appends the current exception's traceback. Call it inside an `except` block."], ["Why should you not catch `BaseException`?", "It includes `KeyboardInterrupt`, `SystemExit` and task cancellation, which must propagate so the program can stop or cancel cleanly."]]}]}, {"id": "py-file", "title": "Files, paths and JSON", "level": "Intermediate", "mins": "25 min", "blocks": [{"t": "plain", "title": "", "text": "`pathlib.Path` represents a file or folder. `open()` gives a file object, and wrapping it in `with` guarantees the file is closed even if an error happens.\n\nJSON is the format phones and servers use to talk. `json.loads` turns JSON text into dicts and lists, and `json.dumps` turns them back into text."}, {"t": "bridge", "title": "", "text": "`json.loads` is `JSONSerialization` / `jsonDecode`: you get loose dicts, not typed objects. The typed `Codable` / `fromJson` experience comes from Pydantic in the backend stage."}, {"t": "code", "lang": "python", "title": "", "code": "import csv, json, tempfile\nfrom pathlib import Path\n\nfolder = Path(tempfile.mkdtemp())\norders_file = folder / \"orders.json\"\n\norders = [{\"id\": 184, \"city\": \"blr\", \"total\": 709}, {\"id\": 185, \"city\": \"del\", \"total\": 90}]\norders_file.write_text(json.dumps(orders, indent=2))\n\nloaded = json.loads(orders_file.read_text())\nprint(loaded[0][\"city\"], orders_file.suffix, orders_file.exists())\n\nreport = folder / \"report.csv\"\nwith report.open(\"w\", newline=\"\") as handle:          # closed automatically\n    writer = csv.DictWriter(handle, fieldnames=[\"id\", \"city\", \"total\"])\n    writer.writeheader()\n    writer.writerows(loaded)\n\nwith report.open() as handle:\n    for line in handle:               # one line at a time: fine for huge files\n        print(line.strip())"}, {"t": "flow", "title": "JSON round trip", "lanes": [{"name": "", "nodes": [{"n": "Python dict"}, {"a": ""}, {"n": "json.dumps"}, {"a": ""}, {"n": "Text on the wire"}, {"a": ""}, {"n": "json.loads"}, {"a": ""}, {"n": "Python dict"}]}]}, {"t": "real", "title": "", "text": "A nightly job reads a 4 GB export of orders. Reading it with `read_text()` would load all 4 GB into memory. Looping over the file object reads one line at a time and keeps memory flat. The same idea, streaming, comes back in the HTTP and AI lessons."}, {"t": "pitfalls", "title": "", "items": ["Opening a file without `with` and forgetting to close it.", "Building paths with string `+`. Use `Path(...) / \"name\"`.", "Assuming JSON keeps types Python has but JSON does not: tuples become lists, `datetime` is not supported, dict keys become strings."]}, {"t": "quiz", "title": "", "items": [["Why use `with open(...)`?", "The file is closed when the block ends, even when an exception is raised inside it."], ["What is the difference between `json.load` and `json.loads`?", "`load` reads from a file object. `loads` reads from a string. The same pairing exists for `dump` and `dumps`."], ["How do you read a file too big for memory?", "Iterate over the file object line by line, or read fixed-size chunks, so only a small piece is in memory at a time."]]}]}, {"id": "py-class", "title": "Classes and dataclasses", "level": "Intermediate", "mins": "35 min", "blocks": [{"t": "plain", "title": "", "text": "A class bundles data with the functions that work on it. `__init__` sets up a new object and `self` is the object itself, written explicitly as the first parameter of every method.\n\nFor classes that mostly hold data, `@dataclass` writes `__init__`, `__repr__` and `__eq__` for you."}, {"t": "bridge", "title": "", "text": "All Python classes are reference types, like Swift `class`. There is no `struct`. A `@dataclass(frozen=True)` is the closest thing to an immutable Swift struct or a Dart class with `final` fields. `self` is `this` or Swift's `self`, but you must write it in the parameter list."}, {"t": "code", "lang": "python", "title": "", "code": "from dataclasses import dataclass, field\n\n@dataclass(frozen=True)\nclass Item:\n    sku: str\n    price: int          # paise\n    qty: int = 1\n\n    @property\n    def line_total(self) -> int:\n        return self.price * self.qty\n\n@dataclass\nclass Cart:\n    user_id: int\n    items: list[Item] = field(default_factory=list)   # a fresh list per cart\n\n    def add(self, item: Item) -> None:\n        self.items.append(item)\n\n    @property\n    def total(self) -> int:\n        return sum(i.line_total for i in self.items)\n\n    @classmethod\n    def empty_for(cls, user_id: int) -> \"Cart\":\n        return cls(user_id=user_id)\n\ncart = Cart.empty_for(7)\ncart.add(Item(\"milk\", 6200, 2))\ncart.add(Item(\"bread\", 4500))\nprint(cart.total, cart)\nprint(Item(\"milk\", 6200) == Item(\"milk\", 6200))     # value equality for free", "web": 1}, {"t": "flow", "title": "What `Cart.empty_for(7)` builds", "lanes": [{"name": "", "nodes": [{"n": "Class Cart (blueprint)"}, {"a": ""}, {"n": "cls(user_id=7)"}, {"a": ""}, {"n": "__init__ fills fields"}, {"a": ""}, {"n": "Object: user_id=7, items=[]"}, {"a": ""}, {"n": "cart.add(...) mutates that object"}]}]}, {"t": "code", "lang": "python", "title": "Inheritance and duck typing", "code": "from typing import Protocol\n\nclass Notifier(Protocol):\n    def send(self, user_id: int, text: str) -> None: ...\n\nclass PushNotifier:\n    def send(self, user_id: int, text: str) -> None:\n        print(f\"push to {user_id}: {text}\")\n\nclass SmsNotifier:\n    def send(self, user_id: int, text: str) -> None:\n        print(f\"sms to {user_id}: {text}\")\n\ndef order_shipped(notifier: Notifier, user_id: int) -> None:\n    notifier.send(user_id, \"Your order is on the way\")\n\nfor n in (PushNotifier(), SmsNotifier()):     # no shared base class needed\n    order_shipped(n, 7)", "web": 1}, {"t": "pitfalls", "title": "", "items": ["Forgetting `self` in a method signature or when reading a field.", "A class attribute that is a list (`items = []` at class level) is shared by every instance. Use `field(default_factory=list)`.", "Deep inheritance trees. Prefer small classes passed into each other (composition)."]}, {"t": "deep", "title": "Inheritance, `super()` and how attributes are found", "text": "A class can inherit from another and override its methods. `super()` calls the next class in line. With multiple inheritance \"next in line\" is defined by the **method resolution order (MRO)**, a single flat list Python computes for every class. You can print it with `ClassName.__mro__`.\n\nAn **abstract base class** declares methods that subclasses must provide, and refuses to be instantiated until they do. `__slots__` removes the per-instance dictionary, which saves memory when you create millions of small objects.\n\nAttribute lookup follows a fixed order: the instance's own dictionary first, then each class along the MRO. That is why an instance attribute hides a class attribute of the same name."}, {"t": "code", "lang": "python", "title": "", "code": "from abc import ABC, abstractmethod\n\nclass PaymentMethod(ABC):\n    fee_percent = 0.0                         # class attribute: shared default\n\n    def __init__(self, owner: str):\n        self.owner = owner\n\n    @abstractmethod\n    def charge(self, paise: int) -> str: ...\n\n    def total(self, paise: int) -> int:       # shared behaviour\n        return round(paise * (1 + self.fee_percent / 100))\n\nclass Card(PaymentMethod):\n    fee_percent = 1.8\n    def charge(self, paise: int) -> str:\n        return f\"card: {self.owner} pays {self.total(paise)}\"\n\nclass Upi(PaymentMethod):\n    def charge(self, paise: int) -> str:\n        return f\"upi: {self.owner} pays {self.total(paise)}\"\n\nclass Audited:\n    def charge(self, paise: int) -> str:\n        return \"[logged] \" + super().charge(paise)     # next class in the MRO\n\nclass AuditedCard(Audited, Card):\n    pass\n\nfor method in (Card(\"Asha\"), Upi(\"Asha\"), AuditedCard(\"Asha\")):\n    print(method.charge(10_000))\nprint([c.__name__ for c in AuditedCard.__mro__])\n\ntry:\n    PaymentMethod(\"x\")\nexcept TypeError as err:\n    print(\"TypeError:\", str(err)[:60])\n\ncard = Card(\"Ravi\")\ncard.fee_percent = 0                           # instance attribute hides the class one\nprint(card.total(10_000), Card.fee_percent, isinstance(card, PaymentMethod))\n\nclass Point:\n    __slots__ = (\"x\", \"y\")                     # no __dict__: smaller, and no stray attributes\n    def __init__(self, x, y): self.x, self.y = x, y\ntry:\n    Point(1, 2).z = 3\nexcept AttributeError as err:\n    print(\"AttributeError:\", err)"}, {"t": "flow", "title": "Where `obj.name` is looked up", "lanes": [{"name": "", "nodes": [{"n": "obj.name"}, {"a": ""}, {"n": "In the instance's own __dict__?"}, {"a": "no"}, {"n": "In the class?"}, {"a": "no"}, {"n": "In each parent along the MRO?"}, {"a": "no"}, {"n": "__getattr__ defined?"}, {"a": "no"}, {"n": "!AttributeError"}]}]}, {"t": "steps", "title": "`AuditedCard(\"Asha\").charge(10000)`", "steps": [{"c": "Python searches the MRO for `charge`: AuditedCard has none, Audited does.", "cols": [["MRO position", ["Audited"]], ["Output so far", []]]}, {"c": "`Audited.charge` calls `super().charge`. `super()` means \"next after Audited in this object's MRO\", which is Card.", "cols": [["MRO position", ["Card"]], ["Output so far", ["[logged]"]]]}, {"c": "`Card.charge` calls `self.total`. Not on Card, found on PaymentMethod. `self.fee_percent` resolves to Card's 1.8.", "cols": [["MRO position", ["PaymentMethod"]], ["Output so far", ["[logged]"]]]}, {"c": "The strings are joined on the way back up.", "cols": [["MRO position", ["done"]], ["Output so far", ["[logged] card: Asha pays 10180"]]]}]}, {"t": "quiz", "title": "", "items": [["What does `@dataclass` generate?", "`__init__`, `__repr__` and `__eq__` from the annotated fields. With `frozen=True` it also blocks assignment and makes instances hashable."], ["What is the difference between a class method, a static method and an instance method?", "An instance method receives the object (`self`). A class method receives the class (`cls`) and is often an alternative constructor. A static method receives neither and is just a function placed in the class."], ["What is duck typing?", "Code cares that an object has the needed method, not what class it is. `Protocol` lets a type checker verify that without inheritance."], ["What is `@property` for?", "It makes a method read like a field, so a computed value such as `total` is accessed without parentheses."], ["What is the MRO?", "The method resolution order: the linear order of classes Python searches for an attribute, computed with the C3 algorithm. `super()` follows it."], ["What does `super()` do in multiple inheritance?", "It delegates to the next class in the instance's MRO, which is not necessarily the parent of the class where it is written."], ["Class attribute versus instance attribute?", "A class attribute lives on the class and is shared. An instance attribute lives in the instance's `__dict__` and hides a class attribute of the same name."], ["When would you use `__slots__`?", "When creating very many instances of a small class: it removes the per-instance dict to save memory and speed up attribute access."], ["Composition versus inheritance?", "Inheritance says \"is a\" and couples the child to the parent's implementation. Composition says \"has a\" and passes collaborators in. Prefer composition unless there is a true is-a relationship."]]}]}, {"id": "py-dunder", "title": "Special methods", "level": "Intermediate", "mins": "20 min", "blocks": [{"t": "plain", "title": "", "text": "Methods with double underscores, such as `__len__` or `__eq__`, are hooks that Python calls for you. `len(x)` calls `x.__len__()`, `a + b` calls `a.__add__(b)` and `for i in x` calls `x.__iter__()`. Implementing them makes your own classes behave like built-in ones."}, {"t": "bridge", "title": "", "text": "This is operator overloading plus protocol conformance. `__repr__` is `CustomStringConvertible` / `toString()`, `__eq__` and `__hash__` are `Equatable` and `Hashable`, `__iter__` is `Sequence` / `Iterable`, `__getitem__` is `subscript` / `operator []`."}, {"t": "code", "lang": "python", "title": "", "code": "class Money:\n    def __init__(self, paise: int):\n        self.paise = paise\n    def __repr__(self) -> str:\n        return f\"Money({self.paise / 100:.2f})\"\n    def __add__(self, other: \"Money\") -> \"Money\":\n        return Money(self.paise + other.paise)\n    def __eq__(self, other: object) -> bool:\n        return isinstance(other, Money) and self.paise == other.paise\n    def __hash__(self) -> int:\n        return hash(self.paise)\n    def __lt__(self, other: \"Money\") -> bool:\n        return self.paise \u003c other.paise\n    def __bool__(self) -> bool:\n        return self.paise != 0\n\nprices = [Money(6200), Money(4500), Money(54000)]\nprint(sum(prices, Money(0)), max(prices), Money(100) == Money(100))\nprint({Money(100), Money(100)}, bool(Money(0)))", "web": 1}, {"t": "table", "title": "The ones worth knowing", "rows": [["Syntax you write", "Method Python calls"], ["`print(x)`, debugger", "`__repr__`, `__str__`"], ["`a == b`, key in dict", "`__eq__`, `__hash__`"], ["`len(x)`, `x[i]`, `i in x`", "`__len__`, `__getitem__`, `__contains__`"], ["`for i in x`", "`__iter__`, `__next__`"], ["`with x:`", "`__enter__`, `__exit__`"], ["`x()`", "`__call__`"], ["`await x`", "`__await__`"]]}, {"t": "flow", "title": "`a + b`", "lanes": [{"name": "", "nodes": [{"n": "Python sees a + b"}, {"a": ""}, {"n": "Calls a.__add__(b)"}, {"a": ""}, {"n": "Returns NotImplemented?"}, {"a": "yes"}, {"n": "Tries b.__radd__(a)"}]}, {"name": "", "nodes": [{"n": "Calls a.__add__(b)"}, {"a": ""}, {"n": "Result"}]}]}, {"t": "pitfalls", "title": "", "items": ["Defining `__eq__` without `__hash__`. The class becomes unhashable and cannot be a dict key or set member.", "Overloading operators for things that are not obviously arithmetic. It surprises readers."]}, {"t": "quiz", "title": "", "items": [["What is the difference between `__repr__` and `__str__`?", "`__repr__` is for developers and should be unambiguous. `__str__` is for end users. If only `__repr__` exists, `print` uses it."], ["Why must equal objects have equal hashes?", "Dicts and sets find an item by hash first, then compare with `==`. Two equal objects with different hashes would be treated as different keys."]]}]}, {"id": "py-types", "title": "Type hints", "level": "Intermediate", "mins": "25 min", "blocks": [{"t": "plain", "title": "", "text": "Type hints are notes that say what type a value should be. Python itself ignores them at run time. Tools read them: you
