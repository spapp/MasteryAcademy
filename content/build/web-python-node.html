ne at the top level throws. The fix is to move the shared piece into a third module.\n\nA package decides what can be imported from it through the `exports` field of its `package.json`."}, {"t": "code", "lang": "js", "title": "", "code": "import { mkdtemp, writeFile, rm } from \"node:fs/promises\";\nimport { tmpdir } from \"node:os\";\nimport path from \"node:path\";\nimport { pathToFileURL } from \"node:url\";\n\nconst dir = await mkdtemp(path.join(tmpdir(), \"modules-\"));\nconst file = (name, source) => writeFile(path.join(dir, name), source);\nconst load = (name) => import(pathToFileURL(path.join(dir, name)).href);\n\nawait file(\"counter.mjs\", `console.log(\"  counter.mjs evaluated\"); let count = 0; export const next = () => ++count;`);\nawait file(\"a.mjs\", `import { next } from \"./counter.mjs\"; export const fromA = next();`);\nawait file(\"b.mjs\", `import { next } from \"./counter.mjs\"; export const fromB = next();`);\nconst [a, b] = [await load(\"a.mjs\"), await load(\"b.mjs\")];\nconsole.log(\"one shared instance:\", a.fromA, b.fromB);              // 1 2, and \"evaluated\" printed once\n\nawait file(\"status.mjs\", `export let status = \"starting\"; export const markReady = () => { status = \"ready\"; };`);\nconst live = await load(\"status.mjs\");\nconst before = live.status;\nlive.markReady();\nconsole.log(\"live binding:\", before, \"->\", live.status);\n\nawait file(\"legacy.cjs\", `module.exports = { fee: (total) => (total >= 500 ? 0 : 40) };`);\nconst legacy = await load(\"legacy.cjs\");                            // CommonJS from ESM: the default export\nconsole.log(\"cjs interop:\", legacy.default.fee(300));\n\nawait file(\"x.mjs\", `import { y } from \"./y.mjs\"; export const x = \"x\"; export const both = x + y;`);\nawait file(\"y.mjs\", `import { x } from \"./x.mjs\"; export const y = \"y needs \" + x;`);\ntry { await load(\"x.mjs\"); } catch (err) { console.log(\"cycle:\", err.name, \"-\", err.message); }\n\nawait rm(dir, { recursive: true });"}, {"t": "code", "lang": "text", "title": "A package's public surface", "code": "{\n  \"name\": \"@shop/pricing\",\n  \"version\": \"2.1.0\",\n  \"type\": \"module\",\n  \"exports\": {\n    \".\": { \"types\": \"./dist/index.d.ts\", \"import\": \"./dist/index.js\", \"require\": \"./dist/index.cjs\" },\n    \"./testing\": \"./dist/testing.js\"\n  },\n  \"files\": [\"dist\"]\n}"}, {"t": "steps", "title": "Why the circular import fails", "steps": [{"c": "`x.mjs` is imported. Before running it, Node loads its dependency `y.mjs`.", "cols": [["Evaluating", ["(linking)"]], ["x exports", ["x = uninitialised"]], ["y exports", ["y = uninitialised"]]]}, {"c": "`y.mjs` imports `x.mjs`, which is already being loaded, so Node does not start it again. `y.mjs` runs first.", "cols": [["Evaluating", ["y.mjs"]], ["x exports", ["x = uninitialised"]], ["y exports", ["y = uninitialised"]]]}, {"c": "`y.mjs` reads `x` at its top level. `x.mjs` has not run yet, so `x` is in its dead zone.", "cols": [["Evaluating", ["y.mjs"]], ["x exports", ["x = uninitialised"]], ["y exports", ["!ReferenceError"]]]}, {"c": "Had `y.mjs` only used `x` inside a function called later, it would have worked. Top-level use across a cycle is the problem.", "cols": [["Evaluating", []], ["x exports", []], ["y exports", []]]}]}, {"t": "quiz", "title": "", "items": [["What are the differences between ESM and CommonJS?", "ESM uses `import` / `export`, loads asynchronously, supports top-level `await` and is the language standard. CommonJS uses `require`, loads synchronously and is Node's original system."], ["Is a module run every time it is imported?", "No. It runs once, the first time, and the result is cached. Later imports get the same instance."], ["Named versus default export?", "A file can have many named exports imported by their exact names, and at most one default export imported under any name you choose."], ["How many times is a module evaluated?", "Once per process for a given resolved URL. Later imports reuse the cached module instance and its state."], ["What are live bindings?", "ES module imports refer to the exporting module's variables, not to copies. If the exporter reassigns an exported `let`, importers see the new value."], ["Why are circular dependencies a problem?", "One module in the cycle is evaluated before the other has finished, so it may see uninitialised exports. Top-level use then throws in ESM or yields `undefined` in CommonJS."], ["Can ESM import CommonJS and the reverse?", "ESM can import a CommonJS module, receiving `module.exports` as the default export. CommonJS can load ESM with dynamic `import()`, and recent Node versions also allow `require()` of ES modules that have no top-level await."], ["What does the `exports` field in `package.json` do?", "It defines the package's entry points and blocks imports of any other internal file. It can map different files for `import`, `require` and types."]]}]}, {"id": "node-ts", "title": "TypeScript essentials", "level": "Intermediate", "mins": "35 min", "blocks": [{"t": "plain", "title": "", "text": "TypeScript is JavaScript with types added. A tool called `tsc` checks the types and then removes them, leaving plain JavaScript. Nothing typed exists at run time.\n\nAlmost every professional Node backend is written in TypeScript. It catches the mistakes JavaScript lets through: a misspelled field, a missing `await`, a value that might be `undefined`."}, {"t": "bridge", "title": "", "text": "This will feel like home. `interface` is a protocol or abstract class for data shapes. `string | undefined` is `String?`. Union types with a `kind` field are Swift enums with associated values or Dart sealed classes, and `switch` over them is exhaustively checked."}, {"t": "code", "lang": "ts", "title": "", "code": "type OrderStatus = \"placed\" | \"packed\" | \"shipped\" | \"delivered\";\n\ninterface OrderItem {\n  sku: string;\n  price: number;      // paise\n  qty: number;\n}\n\ninterface Order {\n  id: number;\n  status: OrderStatus;\n  items: OrderItem[];\n  coupon?: string;    // optional: string | undefined\n}\n\nfunction total(order: Order): number {\n  return order.items.reduce((sum, i) => sum + i.price * i.qty, 0);\n}\n\n// A tagged union: every case carries different data.\ntype PaymentResult =\n  | { kind: \"paid\"; transactionId: string }\n  | { kind: \"declined\"; reason: string }\n  | { kind: \"pending\"; retryAfterSeconds: number };\n\nfunction describe(result: PaymentResult): string {\n  switch (result.kind) {\n    case \"paid\": return `Paid, ref ${result.transactionId}`;\n    case \"declined\": return `Declined: ${result.reason}`;\n    case \"pending\": return `Retry in ${result.retryAfterSeconds}s`;\n  }                    // adding a fourth kind makes this a compile error until handled\n}\n\n// Generics: one function, many types, still checked.\nasync function getJson\u003cT>(url: string): Promise\u003cT> {\n  const response = await fetch(url);\n  if (!response.ok) throw new Error(`HTTP ${response.status}`);\n  return (await response.json()) as T;   // a promise about the shape, not a check\n}\n\n// Utility types build new types from old ones.\ntype NewOrder = Omit\u003cOrder, \"id\" | \"status\">;\ntype OrderPatch = Partial\u003cPick\u003cOrder, \"status\" | \"coupon\">>;"}, {"t": "code", "lang": "bash", "title": "", "code": "npm install -D typescript @types/node tsx\nnpx tsc --init --strict\nnpx tsx watch src/server.ts      # run TypeScript directly while developing\nnpx tsc --noEmit                 # type-check only, used in CI"}, {"t": "flow", "title": "Where types exist", "lanes": [{"name": "", "nodes": [{"n": "You write .ts"}, {"a": ""}, {"n": "tsc checks types"}, {"a": ""}, {"n": "Errors stop the build"}]}, {"name": "", "nodes": [{"n": "tsc checks types"}, {"a": ""}, {"n": "Types are erased"}, {"a": ""}, {"n": "Plain .js runs on Node"}]}, {"name": "", "nodes": [{"n": "!At run time"}, {"a": ""}, {"n": "No types exist"}, {"a": ""}, {"n": "Data from outside must be validated (Zod)"}]}]}, {"t": "pitfalls", "title": "", "items": ["Trusting `as T` or `any` on data from a request or an API. A type is a claim, not a check. Validate with a schema at the boundary.", "Turning off `strict`. Most of TypeScript's value comes from strict null checks.", "Writing types for everything by hand. Let the compiler infer local variables and annotate function boundaries."]}, {"t": "deep", "title": "Generics, narrowing and types built from other types", "text": "Three ideas take you from writing interfaces to using TypeScript well.\n\n**Generics** let a function or type work with many types while keeping the link between input and output. A constraint (`T extends { id: number }`) says what the type must at least have.\n\n**Narrowing** is the compiler following your checks. After `if (!result.ok) return`, it knows `result` is the success shape. A **type guard** is a function that performs such a check for a value of unknown origin. Assigning to `never` in a `default` branch makes the compiler prove you handled every case.\n\n**Types from types**: `keyof` gives the union of an object type's keys, mapped types transform every property, and conditional types choose a type by a test. Most utility types (`Partial`, `Pick`, `Omit`, `ReturnType`) are built from these."}, {"t": "code", "lang": "ts", "title": "Compiled with `tsc --strict`", "code": "interface Order {\n  id: number;\n  status: \"placed\" | \"packed\" | \"delivered\";\n  total: number;\n  coupon?: string;\n}\n\n// Generic with a constraint: works for any type that has a numeric id.\nfunction byId\u003cT extends { id: number }>(items: T[]): Map\u003cnumber, T> {\n  return new Map(items.map((item) => [item.id, item]));\n}\nconst orders: Order[] = [{ id: 184, status: \"placed\", total: 70900 }];\nconst found = byId(orders).get(184);                 // Order | undefined\nconst total = found?.total ?? 0;                     // found.total alone would not compile\n\n// keyof and indexed access: the return type follows the key you pass.\nfunction pluck\u003cT, K extends keyof T>(items: T[], key: K): T[K][] {\n  return items.map((item) => item[key]);\n}\nconst statuses = pluck(orders, \"status\");            // (\"placed\" | \"packed\" | \"delivered\")[]\n\n// A result type instead of exceptions, narrowed by a literal field.\ntype ApiResult\u003cT> = { ok: true; data: T } | { ok: false; error: string };\nfunction describe(result: ApiResult\u003cOrder>): string {\n  if (!result.ok) return `failed: ${result.error}`;  // here: the error shape\n  return `order ${result.data.id}`;                  // here: the success shape\n}\n\n// A type guard for data of unknown origin.\nfunction isOrder(value: unknown): value is Order {\n  return typeof value === \"object\" && value !== null\n    && \"id\" in value && typeof (value as { id: unknown }).id === \"number\";\n}\n\n// Exhaustiveness: adding a status makes this function fail to compile until handled.\nfunction label(status: Order[\"status\"]): string {\n  switch (status) {\n    case \"placed\": return \"Placed\";\n    case \"packed\": return \"Packed\";\n    case \"delivered\": return \"Delivered\";\n    default: { const unreachable: never = status; return unreachable; }\n  }\n}\n\n// Mapped and conditional types.\ntype Editable\u003cT> = { -readonly [K in keyof T]: T[K] };\ntype Unwrap\u003cT> = T extends Promise\u003cinfer U> ? U : T;\ntype Loaded = Unwrap\u003cPromise\u003cApiResult\u003cOrder>>>;     // ApiResult\u003cOrder>\ntype OrderPatch = Editable\u003cPartial\u003cPick\u003cOrder, \"status\" | \"coupon\">>>;\n\n// satisfies: check the shape but keep the precise literal types.\nconst FEES = { standard: 4000, express: 9000 } satisfies Record\u003cstring, number>;\ntype Speed = keyof typeof FEES;                      // \"standard\" | \"express\"\nconst feeFor = (speed: Speed): number => FEES[speed];\n\nconst patch: OrderPatch = { status: \"packed\" };\nconst loaded: Loaded = { ok: true, data: orders[0]! };\nconsole.log(total, statuses, describe(loaded), label(\"packed\"), feeFor(\"express\"), isOrder({ id: 1 }), patch);"}, {"t": "flow", "title": "How narrowing follows your code", "lanes": [{"name": "", "nodes": [{"n": "value: ApiResult\u003cOrder>"}, {"a": ""}, {"n": "if (!result.ok)"}, {"a": "true branch"}, {"n": "Type is the error shape"}]}, {"name": "", "nodes": [{"n": "if (!result.ok)"}, {"a": "after the return"}, {"n": "Type is the success shape"}, {"a": ""}, {"n": "result.data is safe to use"}]}]}, {"t": "table", "title": "Utility types you will use weekly", "rows": [["Type", "Result"], ["`Partial\u003cT>`", "Every property optional"], ["`Required\u003cT>`", "Every property required"], ["`Pick\u003cT, K>` / `Omit\u003cT, K>`", "Keep or drop some properties"], ["`Record\u003cK, V>`", "Object with keys K and values V"], ["`ReturnType\u003cF>` / `Parameters\u003cF>`", "Types taken from a function"], ["`Awaited\u003cT>`", "The type a promise resolves to"], ["`NonNullable\u003cT>`", "T without `null` and `undefined`"]]}, {"t": "quiz", "title": "", "items": [["Does TypeScript check types at run time?", "No. Types are removed during compilation. Run-time safety for external data needs a validation library."], ["`interface` versus `type`?", "Both describe object shapes. `interface` can be extended and merged, `type` can also express unions, tuples and mapped types. Use either consistently."], ["`any` versus `unknown`?", "`any` switches type checking off for that value. `unknown` forces you to narrow it (check its type) before using it, so it is the safe choice for external data."], ["What is a discriminated union?", "A union of object types that share a literal field such as `kind`. Checking that field narrows the type, and the compiler can verify every case is handled."], ["What is a generic?", "A type parameter that lets a function, class or type work over many types while preserving the relationship between its inputs and outputs."], ["What is type narrowing?", "The compiler refining a variable's type inside a branch based on a check such as `typeof`, `in`, equality on a literal field or a type guard."], ["What is a type guard?", "A function whose return type is `value is T`. When it returns true the compiler treats the argument as `T` in that branch."], ["How do you make a `switch` exhaustive?", "In the `default` branch assign the value to a variable of type `never`. If a case is missing the assignment does not compile."], ["What does `satisfies` do?", "It checks that a value conforms to a type without widening the value's own inferred type, so literal keys and values stay precise."], ["`unknown` versus `never`?", "`unknown` is the type of any value you have not checked yet. `never` is the type with no values, for code that cannot be reached or functions that never return."]]}]}]}, {"name": "Stage 2 · Async core", "sub": "The model that makes Node, Node", "lessons": [{"id": "node-async", "title": "Callbacks, promises and async/await", "level": "Intermediate", "mins": "35 min", "blocks": [{"t": "plain", "title": "", "text": "In Node, slow operations do not make your code wait. You start the operation and say what should happen when it finishes. There have been three ways to say that.\n\nA **callback** is a function you hand over to be called later. A **promise** is an object that stands for a result that will arrive later. **async / await** is syntax that lets promise code read top to bottom like ordinary code. Write new code with async / await, and understand the other two because libraries and old code use them."}, {"t": "analogy", "title": "", "text": "A callback is \"call this number when it is ready\". A promise is the token you get at a food counter: you hold it, and it turns into food or an apology. `await` is standing aside until your token is called while the counter serves others."}, {"t": "bridge", "title": "", "text": "A `Promise` is a Dart `Future` and behaves like a Swift `Task` value. `Promise.all` is `Future.wait` or `async let`. `try / catch` around `await` works the same in all three."}, {"t": "code", "lang": "js", "title": "", "code": "const wait = (ms, value, fail = false) =>\n  new Promise((resolve, reject) => setTimeout(() => (fail ? reject(new Error(value)) : resolve(value)), ms));\n\n// 1. Callback style (old Node APIs): error first, result second.\nfunction getStockCb(sku, callback) {\n  setTimeout(() => callback(null, { sku, available: 12 }), 20);\n}\ngetStockCb(\"milk\", (err, stock) => console.log(\"callback:\", err, stock.available));\n\n// 2 and 3. Promises with async/await.\nasync function productPage() {\n  const start = Date.now();\n  const price = await wait(100, 62);            // one after another: 100 + 100 ms\n  const stock = await wait(100, 12);\n  console.log(\"sequential\", Date.now() - start, \"ms\", price, stock);\n\n  const again = Date.now();\n  const [p, s, reviews] = await Promise.all([wait(100, 62), wait(100, 12), wait(100, 4.5)]);\n  console.log(\"parallel  \", Date.now() - again, \"ms\", p, s, reviews);\n\n  const results = await Promise.allSettled([wait(30, \"price\"), wait(30, \"reviews down\", true)]);\n  console.log(results.map((r) => r.status));    // partial failure without throwing\n\n  try {\n    await Promise.race([wait(500, \"slow recommendations\"), wait(50, \"timeout\", true)]);\n  } catch (err) {\n    console.log(\"gave up:\", err.message);\n  }\n}\nawait productPage();", "web": 1}, {"t": "steps", "title": "What `await` does to a function", "steps": [{"c": "`productPage()` is called and runs synchronously until the first `await`.", "cols": [["Call stack", ["productPage"]], ["Waiting (not on the stack)", []], ["Other code can run", ["no"]]]}, {"c": "At `await wait(100)` the function is paused and removed from the stack. Its state is saved.", "cols": [["Call stack", ["(empty)"]], ["Waiting (not on the stack)", ["productPage", "timer 100 ms"]], ["Other code can run", ["yes"]]]}, {"c": "The timer fires. The promise resolves and the rest of the function is queued as a microtask.", "cols": [["Call stack", ["(empty)"]], ["Waiting (not on the stack)", ["productPage (ready)"]], ["Other code can run", ["yes"]]]}, {"c": "The function resumes on the stack with the value 62 and runs to the next `await`.", "cols": [["Call stack", ["productPage"]], ["Waiting (not on the stack)", []], ["Other code can run", ["no"]]]}]}, {"t": "flow", "title": "A promise's three states", "lanes": [{"name": "", "nodes": [{"n": "pending"}, {"a": ""}, {"n": "fulfilled with a value"}, {"a": ""}, {"n": ".then / await continues"}]}, {"name": "", "nodes": [{"n": "pending"}, {"a": ""}, {"n": "!rejected with an error"}, {"a": ""}, {"n": ".catch / try-catch handles it"}]}]}, {"t": "table", "title": "Combining promises", "rows": [["Method", "Resolves when", "Use for"], ["`Promise.all`", "All succeed (fails fast on the first error)", "Independent calls you all need"], ["`Promise.allSettled`", "All finish, success or not", "A page that can show partial data"], ["`Promise.race`", "The first one settles", "Timeouts"], ["`Promise.any`", "The first one succeeds", "Trying mirrors"]]}, {"t": "pitfalls", "title": "", "items": ["A missing `await`. The function carries on with a promise instead of a value, and errors vanish.", "`await` inside a `for` loop when the calls are independent. Use `Promise.all` with `map`.", "`array.forEach(async ...)`. `forEach` does not wait for the promises. Use `for...of` or `Promise.all`.", "An unhandled rejection. In current Node it crashes the process."]}, {"t": "deep", "title": "Cancellation, limits, retries and async iteration", "text": "Four patterns turn basic `await` into production code.\n\n**Cancellation** uses `AbortController`. You pass its `signal` into an operation and call `abort()` to stop it. `AbortSignal.timeout(ms)` gives a signal that aborts by itself, which is the standard way to put a deadline on `fetch`.\n\n**Concurrency limits** matter because `Promise.all` over 10,000 items starts 10,000 operations at once. A small worker loop keeps only N running.\n\n**Retries** should back off exponentially and add random jitter, so that many clients do not retry in step and knock a recovering service over again. Retry only errors that can succeed later.\n\n**Async iteration** with `for await` consumes data that arrives in pages or chunks, one piece at a time."}, {"t": "code", "lang": "js", "title": "", "code": "const sleep = (ms, { signal } = {}) => new Promise((resolve, reject) => {\n  if (signal?.aborted) return reject(signal.reason);\n  const timer = setTimeout(resolve, ms);\n  signal?.addEventListener(\"abort\", () => { clearTimeout(timer); reject(signal.reason); }, { once: true });\n});\n\ntry {                                                  // a deadline\n  await sleep(500, { signal: AbortSignal.timeout(40) });\n} catch (err) { console.log(\"deadline hit:\", err.name); }\n\nconst controller = new AbortController();              // manual cancel, e.g. the client disconnected\nsetTimeout(() => controller.abort(new Error(\"user left the screen\")), 20);\ntry { await sleep(500, { signal: controller.signal }); } catch (err) { console.log(\"cancelled:\", err.message); }\n\nasync function mapLimit(items, limit, fn) {            // at most `limit` running at once\n  const results = new Array(items.length);\n  let next = 0, running = 0, peak = 0;\n  const worker = async () => {\n    while (next \u003c items.length) {\n      const index = next++;\n      peak = Math.max(peak, ++running);\n      results[index] = await fn(items[index]);\n      running--;\n    }\n  };\n  await Promise.all(Array.from({ length: limit }, worker));\n  return { results, peak };\n}\nconst { results, peak } = await mapLimit([1, 2, 3, 4, 5, 6, 7], 3, async (n) => { await sleep(10); return n * 2; });\nconsole.log(results, \"peak concurrency:\", peak);\n\nasync function retry(fn, { attempts = 4, baseMs = 10 } = {}) {\n  for (let attempt = 1; ; attempt++) {\n    try { return await fn(attempt); }\n    catch (err) {\n      if (attempt === attempts || !err.retryable) throw err;\n      const delay = Math.random() * baseMs * 2 ** (attempt - 1);     // exponential backoff with full jitter\n      console.log(`attempt ${attempt} failed (${err.message}), retrying`);\n      await sleep(delay);\n    }\n  }\n}\nconst flaky = async (attempt) => {\n  if (attempt \u003c 3) throw Object.assign(new Error(\"503 from inventory\"), { retryable: true });\n  return \"stock: 12\";\n};\nconsole.log(await retry(flaky));\n\nasync function* orderPages(totalPages) {               // an async generator: one page per request\n  for (let page = 1; page \u003c= totalPages; page++) {\n    await sleep(5);\n    yield [`order-${page}a`, `order-${page}b`];\n  }\n}\nlet seen = 0;\nfor await (const page of orderPages(3)) seen += page.length;\nconsole.log(\"orders seen:\", seen);\n\nconsole.log(\"start\");                                  // order of then-callbacks\nPromise.resolve(1).then((v) => { console.log(\"then\", v); return v + 1; }).then((v) => console.log(\"then\", v));\nqueueMicrotask(() => console.log(\"microtask between them\"));\nconsole.log(\"end\");", "web": 1}, {"t": "steps", "title": "Retries with backoff and jitter", "steps": [{"c": "Attempt 1 fails with a 503. The error is marked retryable.", "cols": [["Attempt", ["1 failed"]], ["Wait before next", ["random up to 10 ms"]]]}, {"c": "Attempt 2 fails. The maximum wait doubles.", "cols": [["Attempt", ["2 failed"]], ["Wait before next", ["random up to 20 ms"]]]}, {"c": "Attempt 3 succeeds. The result is returned and no more delay is spent.", "cols": [["Attempt", ["3 succeeded"]], ["Wait before next", ["none"]]]}, {"c": "Had it kept failing, attempt 4 would be the last and its error would be thrown to the caller.", "cols": [["Attempt", ["4 would throw"]], ["Wait before next", ["none"]]]}]}, {"t": "table", "title": "Which errors to retry", "rows": [["Retry", "Do not retry"], ["Timeouts, connection resets", "400 and 422: the request is wrong"], ["502, 503, 504", "401 and 403: retrying will not grant access"], ["429, after the `Retry-After` delay", "404, 409: the state will not change by waiting"], ["Idempotent requests only", "A POST without an idempotency key"]]}, {"t": "quiz", "title": "", "items": [["What is a promise?", "An object representing a value that will be available later. It is pending, then either fulfilled with a value or rejected with an error, and never changes after that."], ["What is callback hell and how was it solved?", "Deeply nested callbacks that are hard to read and to handle errors in. Promises flattened the nesting with chaining, and async / await made it read like sequential code."], ["`Promise.all` versus `Promise.allSettled`?", "`all` rejects as soon as one promise rejects. `allSettled` waits for every promise and reports each outcome."], ["Does `await` block the thread?", "No. It pauses only that function. The event loop keeps running other callbacks until the awaited promise settles."], ["How do you cancel an async operation in Node?", "Pass an `AbortSignal` from an `AbortController` to the operation and call `abort()`. Operations that support signals, such as `fetch`, timers and streams, reject with an abort error."], ["How do you add a timeout to `fetch`?", "Pass `signal: AbortSignal.timeout(ms)`. The request is aborted and the promise rejects with a `TimeoutError` when the time is up."], ["How do you limit concurrency over a large array?", "Run a fixed number of worker loops that each take the next item until none remain, or use a library such as `p-limit`."], ["Why add jitter to retry delays?", "Without it, clients that failed together retry together and create repeated spikes. Randomising the delay spreads them out."], ["What is an async iterator?", "An object whose `next()` returns a promise. `for await` consumes it. Async generators, streams and paginated API clients produce them."]]}]}, {"id": "node-loop", "title": "The event loop", "level": "Advanced", "mins": "40 min", "blocks": [{"t": "plain", "title": "", "text": "Node runs your JavaScript on **one thread**. The **event loop** is the cycle that decides what that thread does next. It picks a callback, runs it to completion, picks the next one and so on, forever.\n\nSlow I/O does not happen on that thread. Network work is handed to the operating system, and file and crypto work goes to a small thread pool. When the work finishes, its callback is put in a queue and the loop runs it when the thread is free.\n\nOne rule follows from this and explains most Node performance bugs: **never do long CPU work on the main thread**, because nothing else can run until it finishes."}, {"t": "analogy", "title": "", "text": "One chef, many timers. The chef starts ten dishes, sets timers and works on whichever timer rings. It works beautifully until the chef decides to peel 500 potatoes by hand. Every dish burns while that happens."}, {"t": "bridge", "title": "", "text": "This is the Dart event loop with its microtask queue and event queue, and the idea behind the main run loop in iOS. \"Do not block the main thread\" is the same rule, except here the main thread serves every user, not one screen."}, {"t": "code", "lang": "js", "title": "", "code": "import { readFile } from \"node:fs\";\n\nconsole.log(\"A  synchronous code runs first\");\nsetTimeout(() => console.log(\"D  timer callback\"), 0);\nPromise.resolve().then(() => console.log(\"C  promise callback (microtask)\"));\nconsole.log(\"B  still synchronous\");\n\nreadFile(new URL(import.meta.url), () => {\n  setTimeout(() => console.log(\"G  timer, next round of the loop\"), 0);\n  setImmediate(() => console.log(\"F  setImmediate, check phase of this round\"));\n  Promise.resolve().then(() => console.log(\"E  microtask, right after this callback\"));\n});"}, {"t": "steps", "title": "Follow the code above through the queues", "steps": [{"c": "Synchronous code runs. `setTimeout` registers a timer, the promise queues a microtask, `readFile` hands work to the thread pool.", "cols": [["Call stack", ["main script"]], ["Microtask queue", ["C"]], ["Timer queue", ["D"]], ["Waiting on I/O", ["readFile"]], ["Printed", ["A", "B"]]]}, {"c": "The script ends. Before anything else, the microtask queue is emptied.", "cols": [["Call stack", ["C"]], ["Microtask queue", []], ["Timer queue", ["D"]], ["Waiting on I/O", ["readFile"]], ["Printed", ["A", "B", "C"]]]}, {"c": "The loop enters the timers phase and runs the expired timer.", "cols": [["Call stack", ["D"]], ["Microtask queue", []], ["Timer queue", []], ["Waiting on I/O", ["readFile"]], ["Printed", ["A", "B", "C", "D"]]]}, {"c": "The file read finishes. In the poll phase its callback runs and schedules three things.", "cols": [["Call stack", ["readFile callback"]], ["Microtask queue", ["E"]], ["Timer queue", ["G"]], ["Waiting on I/O", []], ["Printed", ["A", "B", "C", "D"]]]}, {"c": "Microtasks run immediately after that callback.", "cols": [["Call stack", ["E"]], ["Microtask queue", []], ["Timer queue", ["G"]], ["Waiting on I/O", []], ["Printed", ["A", "B", "C", "D", "E"]]]}, {"c": "Next is the check phase, so `setImmediate` runs before the new timer.", "cols": [["Call stack", ["F"]], ["Microtask queue", []], ["Timer queue", ["G"]], ["Waiting on I/O", []], ["Printed", ["A", "B", "C", "D", "E", "F"]]]}, {"c": "A new round begins. The timers phase runs G. Nothing is left, so the process exits.", "cols": [["Call stack", ["G"]], ["Microtask queue", []], ["Timer queue", []], ["Waiting on I/O", []], ["Printed", ["A", "B", "C", "D", "E", "F", "G"]]]}]}, {"t": "flow", "title": "One round of the loop", "lanes": [{"name": "", "nodes": [{"n": "*Timers (setTimeout, setInterval)"}, {"a": ""}, {"n": "Pending callbacks"}, {"a": ""}, {"n": "*Poll (I/O callbacks, waits here if idle)"}, {"a": ""}, {"n": "*Check (setImmediate)"}, {"a": ""}, {"n": "Close callbacks"}, {"a": ""}, {"n": "Next round"}]}, {"name": "", "nodes": [{"n": "After every single callback"}, {"a": ""}, {"n": "process.nextTick queue"}, {"a": ""}, {"n": "Promise microtasks"}]}]}, {"t": "flow", "title": "Where the work really happens", "lanes": [{"name": "", "nodes": [{"n": "Network I/O"}, {"a": ""}, {"n": "Operating system (epoll, kqueue)"}, {"a": ""}, {"n": "Callback queued"}]}, {"name": "", "nodes": [{"n": "File system, DNS lookup, crypto, zlib"}, {"a": ""}, {"n": "libuv thread pool (4 threads by default)"}, {"a": ""}, {"n": "Callback queued"}]}, {"name": "", "nodes": [{"n": "Your JavaScript"}, {"a": ""}, {"n": "The one main thread"}]}]}, {"t": "real", "title": "", "text": "An endpoint builds a 50 MB report with a synchronous loop that takes 3 seconds. For those 3 seconds the server answers nobody: health checks time out, the load balancer marks the instance dead and other users see errors. The fix is to stream the report in pieces, move the work to a worker thread, or make it a background job."}, {"t": "pitfalls", "title": "", "items": ["Synchronous APIs in request handlers: `readFileSync`, `JSON.parse` on huge strings, big loops, synchronous crypto.", "Believing `async` makes CPU work non-blocking. `async` only helps with waiting.", "A promise chain that keeps queuing microtasks forever. It starves timers and I/O.", "Expecting `setTimeout(fn, 0)` to run immediately. It runs after the current code, all microtasks, and when the timers phase comes round."]}, {"t": "deep", "title": "The thread pool, starvation and yielding", "text": "The libuv **thread pool** has four threads by default. File system calls, DNS lookups through `dns.lookup`, and CPU-heavy built-ins such as `crypto.pbkdf2`, `crypto.scrypt` and `zlib` all share those four. If four slow hashes are running, the fifth waits, and so does an unrelated file read. Network sockets do not use the pool.\n\n**Microtask starvation** is the opposite problem. The microtask queue is emptied completely before the loop moves on. Code that keeps queuing microtasks, such as a promise chain that never waits on real I/O, stops timers and network callbacks from running.\n\nWhen a long calculation must stay on the main thread, split it into chunks and **yield** between them with `setImmediate`, so pending I/O callbacks get a turn.\n\nOne more detail for interviews: in CommonJS files `process.nextTick` callbacks run before promise callbacks. In ES modules the top-level code is itself running inside a promise job, so there the promise callbacks come first."}, {"t": "code", "lang": "js", "title": "", "code": "import { pbkdf2 } from \"node:crypto\";\nimport { setImmediate as yieldToLoop } from \"node:timers/promises\";\n\nconst started = Date.now();\nawait Promise.all(Array.from({ length: 6 }, (_, i) => new Promise((resolve) => {\n  pbkdf2(\"password\", \"salt\", 400_000, 64, \"sha512\", () => {          // runs on the thread pool\n    console.log(`hash ${i + 1} finished at ${Date.now() - started} ms`);\n    resolve();\n  });\n})));\nconsole.log(\"4 threads: hashes 5 and 6 had to wait for a free thread\");\n\nasync function measure(label, job) {\n  let ticks = 0;\n  const timer = setInterval(() => ticks++, 5);\n  const start = Date.now();\n  await job();\n  clearInterval(timer);\n  console.log(`${label}: ${Date.now() - start} ms, timer fired ${ticks} times`);\n}\nconst work = (from, to) => { let sum = 0; for (let i = from; i \u003c to; i++) sum += i % 7; return sum; };\nconst N = 120_000_000;\n\nawait measure(\"one long block\", async () => work(0, N));\nawait measure(\"chunked + yield\", async () => {\n  for (let from = 0; from \u003c N; from += 4_000_000) {\n    work(from, Math.min(N, from + 4_000_000));\n    await yieldToLoop();                                              // let timers and I/O run\n  }\n});\n\nlet spins = 0;\nconst timerFired = new Promise((resolve) => setTimeout(() => resolve(spins), 0));\nawait (async function spin() { while (spins \u003c 200_000) { spins++; await null; } })();   // microtasks only\nconsole.log(`a 0 ms timer could not fire until ${await timerFired} microtasks had run`);"}, {"t": "steps", "title": "Six hashes, four threads", "steps": [{"c": "Six `pbkdf2` calls are made. Four start at once on the pool's four threads. Two wait in the pool's queue.", "cols": [["Thread pool (4)", ["hash 1", "hash 2", "hash 3", "hash 4"]], ["Pool queue", ["hash 5", "hash 6"]], ["Main thread", ["free"]]]}, {"c": "The main thread is not blocked. It could serve network requests now. But any file read would queue behind hashes 5 and 6.", "cols": [["Thread pool (4)", ["hash 1", "hash 2", "hash 3", "hash 4"]], ["Pool queue", ["hash 5", "hash 6", "(a file read would wait here)"]], ["Main thread", ["free"]]]}, {"c": "The first four finish at about the same time. Their callbacks are queued for the main thread.", "cols": [["Thread pool (4)", ["hash 5", "hash 6"]], ["Pool queue", []], ["Main thread", ["running 4 callbacks"]]]}, {"c": "The last two finish one round later, which is the second group of timestamps in the output.", "cols": [["Thread pool (4)", ["idle"]], ["Pool queue", []], ["Main thread", ["running 2 callbacks"]]]}]}, {"t": "table", "title": "What runs where", "rows": [["Work", "Runs on", "Blocks the event loop"], ["Your JavaScript, `JSON.parse`, regular expressions", "Main thread", "Yes, for as long as it runs"], ["TCP, HTTP, database drivers", "OS readiness notifications", "No"], ["`fs.*` async, `dns.lookup`, `crypto.pbkdf2`, `scrypt`, `zlib`", "libuv thread pool (default 4)", "No, but they queue behind each other"], ["`*Sync` functions", "Main thread", "Yes"], ["`worker_threads`", "A thread you create", "No"]]}, {"t": "quiz", "title": "", "items": [["How does Node handle many requests on one thread?", "The thread only runs short callbacks. Waiting on the network, disk and databases happens outside it. When an operation completes, its callback is queued and run. So the thread is rarely idle and rarely busy for long."], ["Microtask versus macrotask?", "Microtasks (promise callbacks, `queueMicrotask`) run right after the current callback, before the loop moves on. Macrotasks (timers, I/O, `setImmediate`) run one per turn in their loop phase."], ["`setImmediate` versus `setTimeout(fn, 0)` versus `process.nextTick`?", "`nextTick` runs before any other queued work, right after the current operation. `setTimeout 0` runs in the next timers phase. `setImmediate` runs in the check phase, right after I/O callbacks."], ["What blocks the event loop?", "Any long synchronous work: heavy computation, synchronous file or crypto calls, parsing very large JSON, catastrophic regular expressions."], ["What is the libuv thread pool used for?", "Operations without a non-blocking OS interface: file system calls, DNS lookups via `getaddrinfo`, and CPU-heavy built-ins such as `crypto.scrypt` and `zlib`. Its size defaults to 4 and is set with `UV_THREADPOOL_SIZE`."], ["How big is the libuv thread pool and how do you change it?", "Four threads by default. Set the `UV_THREADPOOL_SIZE` environment variable before the process starts, up to 1024."], ["Which operations use the thread pool?", "File system operations, `dns.lookup`, and CPU-intensive built-ins in `crypto` and `zlib`. Network I/O does not."], ["What is microtask starvation?", "Continuously queuing microtasks so the queue never empties. The loop cannot advance to timers or I/O, and the process appears frozen even though each callback is short."], ["How do you keep the loop responsive during a long calculation?", "Move it to a worker thread or job queue. If it must stay on the main thread, process it in chunks and yield with `setImmediate` between chunks."], ["Does `process.nextTick` run before promise callbacks?", "In CommonJS, yes: the nextTick queue is drained first. In ES modules, top-level code runs inside a promise job, so already-queued promise callbacks run before nextTick callbacks."]]}]}, {"id": "node-err", "title": "Error handling", "level": "Intermediate", "mins": "25 min", "blocks": [{"t": "plain", "title": "", "text": "Errors in Node come in two kinds. **Operational errors** are expected failures of a correct program: a timeout, invalid input, a missing record. Handle them and give a useful response. **Programmer errors** are bugs: reading a property of `undefined`, a wrong argument. Do not try to recover from them. Log, let the process restart, and fix the code.\n\nWith async / await, `try / catch` handles both synchronous throws and rejected promises, provided every promise is awaited."}, {"t": "bridge", "title": "", "text": "Same model as Swift `do / catch` and Dart `try / catch`. The difference is that nothing forces you to handle a failure. A forgotten `await` is like an unobserved `Task` whose error crashes the app later."}, {"t": "code", "lang": "js", "title": "", "code": "class AppError extends Error {\n  constructor(message, { status = 500, code = \"internal\", cause } = {}) {\n    super(message, { cause });\n    this.name = this.constructor.name;\n    this.status = status;\n    this.code = code;\n  }\n}\nclass OutOfStock extends AppError {\n  constructor(sku, available) {\n    super(`${sku} has only ${available} left`, { status: 409, code: \"out_of_stock\" });\n    this.sku = sku;\n  }\n}\n\nconst STOCK = { milk: 3 };\nasync function reserve(sku, qty) {\n  const available = STOCK[sku] ?? 0;\n  if (qty > available) throw new OutOfStock(sku, available);\n  STOCK[sku] = available - qty;\n}\n\nasync function chargeCard() {\n  try {\n    throw new Error(\"ETIMEDOUT\");                      // low-level failure\n  } catch (err) {\n    throw new AppError(\"Payment provider unavailable\", { status: 503, code: \"payment_down\", cause: err });\n  }\n}\n\nfor (const action of [() => reserve(\"milk\", 2), () => reserve(\"milk\", 5), chargeCard]) {\n  try {\n    await action();\n    console.log(\"ok\");\n  } catch (err) {\n    if (err instanceof AppError) console.log(err.status, err.code, \"-\", err.message, err.cause ? `(cause: ${err.cause.message})` : \"\");\n    else throw err;                                    // a bug: do not hide it\n  } finally {\n    // release locks, close connections\n  }\n}\n\nprocess.on(\"unhandledRejection\", (reason) => {         // last line of defence: log and exit\n  console.error(\"unhandled rejection\", reason);\n  process.exit(1);\n});"}, {"t": "flow", "title": "Where an error ends up in a web app", "lanes": [{"name": "", "nodes": [{"n": "Handler throws or a promise rejects"}, {"a": ""}, {"n": "Is it an AppError?"}, {"a": "yes"}, {"n": "Central error middleware"}, {"a": ""}, {"n": "JSON with status and code"}]}, {"name": "", "nodes": [{"n": "Is it an AppError?"}, {"a": "no, a bug"}, {"n": "Log with stack trace"}, {"a": ""}, {"n": "500 with a generic message"}, {"a": ""}, {"n": "Alert"}]}, {"name": "", "nodes": [{"n": "Nothing caught it"}, {"a": ""}, {"n": "!unhandledRejection"}, {"a": ""}, {"n": "Process exits"}, {"a": ""}, {"n": "Process manager restarts it"}]}]}, {"t": "pitfalls", "title": "", "items": ["An empty `catch {}`. The failure still happened and now nobody knows.", "Throwing strings or plain objects. Throw `Error` instances so there is a stack trace.", "Sending `err.message` or the stack to clients. It leaks internals. Send a stable code and a safe message.", "Trying to keep a process alive after an unknown exception. Its state may be corrupt. Exit and restart."]}, {"t": "deep", "title": "Where errors escape, and returning results instead of throwing", "text": "`try / catch` only catches what happens **while the `try` block is on the call stack**, including promises you `await` inside it. Three kinds of failure get away.\n\nA callback that runs later, such as a timer or an event handler, throws when the `try` block is long gone. That becomes an **uncaught exception**. A promise that rejects without being awaited or given a `.catch` becomes an **unhandled rejection**. An `EventEmitter` that emits `error` with no listener throws on the spot. All three end the process by default.\n\nFor failures that are an expected part of normal operation, such as validation, many codebases **return a result object** instead of throwing: `{ ok: true, value }` or `{ ok: false, error }`. The caller must look at `ok`, and TypeScript enforces that it does."}, {"t": "code", "lang": "js", "title": "", "code": "import { EventEmitter } from \"node:events\";\nimport { setTimeout as sleep } from \"node:timers/promises\";\n\nprocess.once(\"uncaughtException\", (err) => console.log(\"uncaughtException:\", err.message));\ntry {\n  setTimeout(() => { throw new Error(\"thrown inside a timer callback\"); }, 0);\n} catch { console.log(\"never printed: the try block finished long before the timer ran\"); }\nawait sleep(10);\n\nprocess.once(\"unhandledRejection\", (reason) => console.log(\"unhandledRejection:\", reason.message));\nconst saveAudit = async () => { throw new Error(\"audit write failed\"); };\ntry {\n  saveAudit();                                           // missing await: the rejection floats free\n} catch { console.log(\"never printed\"); }\nawait sleep(10);\n\ntry {\n  await saveAudit();                                     // with await, try/catch works\n} catch (err) { console.log(\"caught with await:\", err.message); }\n\ntry {\n  new EventEmitter().emit(\"error\", new Error(\"socket hang up\"));   // no \"error\" listener\n} catch (err) { console.log(\"emitter threw:\", err.message); }\n\nconst ok = (value) => ({ ok: true, value });\nconst fail = (code, message) => ({ ok: false, error: { code, message } });\nfunction parseQuantity(raw) {\n  const qty = Number(raw);\n  if (!Number.isInteger(qty)) return fail(\"not_a_number\", `quantity must be a whole number, got \"${raw}\"`);\n  if (qty \u003c 1 || qty > 20) return fail(\"out_of_range\", \"quantity must be between 1 and 20\");\n  return ok(qty);\n}\nfor (const raw of [\"3\", \"three\", \"99\"]) {\n  const result = parseQuantity(raw);\n  console.log(result.ok ? `qty ${result.value}` : `422 ${result.error.code}`);\n}\n\ntry {\n  await Promise.any([Promise.reject(new Error(\"mirror 1 down\")), Promise.reject(new Error(\"mirror 2 down\"))]);\n} catch (err) { console.log(err.name, err.errors.map((e) => e.message)); }\n\nconst wrapped = new Error(\"could not place order\", { cause: new Error(\"stock service timeout\", { cause: new Error(\"ECONNRESET\") }) });\nfor (let e = wrapped, depth = 0; e; e = e.cause, depth++) console.log(\"  \".repeat(depth) + e.message);"}, {"t": "flow", "title": "Does this error reach my catch block?", "lanes": [{"name": "", "nodes": [{"n": "Thrown synchronously inside try"}, {"a": ""}, {"n": "Caught"}]}, {"name": "", "nodes": [{"n": "Rejected promise that is awaited inside try"}, {"a": ""}, {"n": "Caught"}]}, {"name": "", "nodes": [{"n": "Rejected promise not awaited"}, {"a": ""}, {"n": "!unhandledRejection"}, {"a": ""}, {"n": "Process exits"}]}, {"name": "", "nodes": [{"n": "Thrown in a timer or event callback"}, {"a": ""}, {"n": "!uncaughtException"}, {"a": ""}, {"n": "Process exits"}]}, {"name": "", "nodes": [{"n": "emitter.emit(\"error\") with no listener"}, {"a": ""}, {"n": "!Throws at the emit call"}]}]}, {"t": "table", "title": "Throw or return a result", "rows": [["Situation", "Prefer", "Why"], ["Invalid user input, \"not found\", business rule refused", "Return a result, or throw a typed `AppError` handled centrally", "Expected, part of the contract"], ["A dependency failed (timeout, 5xx)", "Throw, with `cause`", "Callers usually cannot continue"], ["A bug (undefined property, wrong argument)", "Let it throw and crash", "The state is unknown"], ["Deep call chain where only the top can respond", "Throw", "Avoids passing results through every layer"]]}, {"t": "quiz", "title": "", "items": [["Operational versus programmer errors?", "Operational errors are expected run-time failures such as timeouts and bad input, which you handle. Programmer errors are bugs, which you fix. Do not write recovery code for bugs."], ["What happens on an unhandled promise rejection?", "Current Node versions print the error and terminate the process with a non-zero exit code."], ["Why add a `cause` to an error?", "It keeps the original low-level error attached to the higher-level one, so logs show the full chain without losing the meaningful message."], ["How do you handle errors in async Express handlers?", "Express 5 forwards a rejected promise from a handler to the error middleware. In Express 4 you must catch and call `next(err)` or use a wrapper."], ["Why does `try / catch` not catch an error thrown in a `setTimeout` callback?", "The callback runs in a later turn of the event loop, after the `try` block has finished. There is no enclosing frame left to catch it."], ["What causes an unhandled rejection?", "A promise rejects and has no rejection handler attached: usually a missing `await` or `.catch`. Node terminates the process by default."], ["What should an `uncaughtException` handler do?", "Log the error, perhaps flush logs and metrics, and exit. The process state is unknown, so it should not keep serving requests."], ["What is the result pattern?", "Returning an object that says whether the operation succeeded, with either the value or an error, instead of throwing. It makes failure part of the function's type."], ["What is `AggregateError`?", "An error holding several errors in its `errors` array. `Promise.any` rejects with it when every promise fails."]]}]}, {"id": "node-ev", "title": "Events and EventEmitter", "level": "Intermediate", "mins": "20 min", "blocks": [{"t": "plain", "title": "", "text": "Much of Node is built on one pattern: an object **emits** named events and other code **listens** for them. Servers emit `request`, streams emit `data` and `end`, processes emit `exit`. `EventEmitter` is the class behind it, and you can use it for your own events.\n\nIt decouples parts of a program: the code that places an order does not need to know who cares about it."}, {"t": "bridge", "title": "", "text": "It is `NotificationCenter` in iOS or a broadcast `StreamController` in Dart: named events, many listeners, synchronous delivery in registration order."}, {"t": "code", "lang": "js", "title": "", "code": "import { EventEmitter, once } from \"node:events\";\n\nclass OrderService extends EventEmitter {\n  place(order) {\n    const saved = { ...order, id: 184, status: \"placed\" };\n    this.emit(\"order:placed\", saved);        // listeners run synchronously, in order\n    return saved;\n  }\n}\n\nconst orders = new OrderService();\norders.on(\"order:placed\", (order) => console.log(\"send confirmation for\", order.id));\norders.on(\"order:placed\", (order) => console.log(\"reserve stock for\", order.items.join(\", \")));\norders.once(\"order:placed\", () => console.log(\"first order of the day!\"));\norders.on(\"error\", (err) => console.log(\"listener failed:\", err.message));\n\norders.place({ items: [\"milk\", \"bread\"] });\norders.place({ items: [\"ghee\"] });\nconsole.log(\"listeners:\", orders.listenerCount(\"order:placed\"));\n\nconst waiting = once(orders, \"order:shipped\");          // a promise for the next event\nsetTimeout(() => orders.emit(\"order:shipped\", { id: 184 }), 10);\nconst [shipped] = await waiting;\nconsole.log(\"shipped\", shipped.id);"}, {"t": "flow", "title": "Emit and listen", "lanes": [{"name": "", "nodes": [{"n": "orders.place()"}, {"a": ""}, {"n": "emit(\"order:placed\", order)"}, {"a": ""}, {"n": "Listener 1: confirmation"}, {"a": ""}, {"n": "Listener 2: stock"}, {"a": ""}, {"n": "Back to place()"}]}]}, {"t": "real", "title": "", "text": "Inside one process an emitter is fine for decoupling. Across several servers it is not enough, because the event only exists in the memory of one instance. Then the same idea moves to a message broker such as Redis pub/sub, RabbitMQ or Kafka. The pattern is identical and the transport changes."}, {"t": "pitfalls", "title": "", "items": ["Emitting `error` with no listener. Node throws and the process crashes.", "Adding a listener per request and never removing it. Memory grows and Node warns about a possible leak after 10 listeners.", "Assuming listeners run asynchronously. `emit` calls them one by one before returning."]}, {"t": "quiz", "title": "", "items": [["What is EventEmitter?", "A class that lets objects publish named events and lets other code subscribe with `on`, `once` and `off`. Many core APIs extend it."], ["Are listeners called synchronously?", "Yes, in the order they were registered, during the `emit` call."], ["How do emitters cause memory leaks?", "Listeners hold references to their closures. Registering them repeatedly on a long-lived emitter without removing them keeps all of that alive."]]}]}, {"id": "node-stream", "title": "Streams, buffers and backpressure", "level": "Advanced", "mins": "35 min", "blocks": [{"t": "plain", "title": "", "text": "A **stream** handles data piece by piece instead of loading all of it. A **buffer** is a chunk of raw bytes. Files, HTTP requests and responses, compression and encryption are all streams in Node.\n\nThe benefit is constant memory. A 5 GB file can be read, compressed and sent to a client using a few megabytes of RAM.\n\n**Backpressure** is what happens when the receiver is slower than the sender. A correct pipeline makes the sender pause until the receiver catches up. `pipeline()` does that for you."}, {"t": "analogy", "title": "", "text": "Water through pipes instead of buckets. With buckets you need one big enough for the whole lake. With pipes the flow matters, not the size. Backpressure is the tap closing when the sink is full."}, {"t": "bridge", "title": "", "text": "Readable streams are `AsyncSequence` in Swift and `Stream` in Dart, and you can loop over them with `for await`. A transform stream is a `map` over that sequence. `Buffer` is `Data` / `Uint8List`."}, {"t": "code", "lang": "js", "title": "", "code": "import { Readable, Transform } from \"node:stream\";\nimport { pipeline } from \"node:stream/promises\";\nimport { createGzip } from \"node:zlib\";\nimport { createWriteStream } from \"node:fs\";\nimport { stat, rm } from \"node:fs/promises\";\nimport { tmpdir } from \"node:os\";\nimport path from \"node:path\";\n\nasync function* orderRows(count) {                    // a generator is a readable source\n  for (let id = 1; id \u003c= count; id++) yield { id, city: id % 3 ? \"blr\" : \"del\", total: id * 10 };\n}\n\nconst toCsv = new Transform({\n  objectMode: true,\n  transform(row, _encoding, done) {\n    done(null, `${row.id},${row.city},${row.total}\\n`);\n  },\n});\n\nconst file = path.join(tmpdir(), `orders-${process.pid}.csv.gz`);\nawait pipeline(Readable.from(orderRows(50_000)), toCsv, createGzip(), createWriteStream(file));\nconsole.log(\"wrote\", (await stat(file)).size, \"bytes; heap\", Math.round(process.memoryUsage().heapUsed / 1e6), \"MB\");\nawait rm(file);\n\nconst buf = Buffer.from(\"₹ milk\", \"utf8\");\nconsole.log(buf.length, \"bytes for\", [...\"₹ milk\"].length, \"characters\", buf.toString(\"base64\"));\n\nlet lines = 0;\nfor await (const chunk of Readable.from([\"a\\nb\\n\", \"c\\n\"])) lines += chunk.split(\"\\n\").length - 1;\nconsole.log(\"lines\", lines);"}, {"t": "steps", "title": "Backpressure in a pipeline", "steps": [{"c": "The source produces chunks faster than the disk can write them.", "cols": [["Source (database)", ["producing"]], ["Buffer in the writable", ["1 chunk"]], ["Destination (slow disk)", ["writing"]]]}, {"c": "The writable's internal buffer passes its limit (`highWaterMark`). `write()` returns false.", "cols": [["Source (database)", ["producing"]], ["Buffer in the writable", ["FULL"]], ["Destination (slow disk)", ["writing"]]]}, {"c": "`pipeline` pauses the source. Memory stops growing.", "cols": [["Source (database)", ["paused"]], ["Buffer in the writable", ["FULL"]], ["Destination (slow disk)", ["writing"]]]}, {"c": "The disk catches up and the writable emits `drain`.", "cols": [["Source (database)", ["paused"]], ["Buffer in the writable", ["empty"]], ["Destination (slow disk)", ["idle"]]]}, {"c": "The source resumes. This cycle repeats for the whole transfer.", "cols": [["Source (database)", ["producing"]], ["Buffer in the writable", ["1 chunk"]], ["Destination (slow disk)", ["writing"]]]}]}, {"t": "flow", "title": "Exporting a big report", "lanes": [{"name": "", "nodes": [{"n": "Database cursor (Readable)"}, {"a": ""}, {"n": "Row to CSV line (Transform)"}, {"a": ""}, {"n": "gzip (Transform)"}, {"a": ""}, {"n": "HTTP response (Writable)"}, {"a": ""}, {"n": "Browser download"}]}]}, {"t": "table", "title": "The four stream types", "rows": [["Type", "Does", "Example"], ["Readable", "Produces data", "File read, HTTP request body"], ["Writable", "Consumes data", "File write, HTTP response"], ["Duplex", "Both, independently", "TCP socket"], ["Transform", "Changes data passing through", "gzip, encryption, CSV formatting"]]}, {"t": "pitfalls", "title": "", "items": ["`readFile` on a large file inside a request handler. Memory spikes by the file size for every concurrent request.", "Chaining `.pipe()` without error handling. If one stream fails the others are left open. Use `pipeline`.", "Ignoring the return value of `write()` in a manual loop, which removes backpressure and fills memory.", "Using `string.length` for byte size. Use `Buffer.byteLength`."]}, {"t": "deep", "title": "Backpressure by hand, and writing your own streams", "text": "`pipeline` hides the mechanism, so here it is in the open. A writable stream has an internal buffer with a limit called `highWaterMark`. `write()` returns `false` when the buffer is at or over that limit. That is the signal to stop writing and wait for the `drain` event. Ignoring it still works for small data, and for large data it grows the buffer until the process runs out of memory.\n\nYou can create your own streams by implementing one method: `read()` for a source, `write()` for a destination, `transform()` for a step in between. A readable created from an async generator is usually the simplest source. Calling `done()` in a writable is what tells Node you are ready for the next chunk, so a slow destination naturally slows the whole chain."}, {"t": "code", "lang": "js", "title": "", "code": "import { Readable, Writable } from \"node:stream\";\nimport { once } from \"node:events\";\nimport { pipeline } from \"node:stream/promises\";\n\nfunction slowDisk(log) {\n  return new Writable({\n    objectMode: true,\n    highWaterMark: 4,                                    // buffer at most 4 rows\n    write(row, _encoding, done) { log.maxBuffered = Math.max(log.maxBuffered, this.writableLength); setTimeout(done, 2); },\n  });\n}\n\nconst careless = { maxBuffered: 0 };                    // ignores the return value of write()\nconst sink1 = slowDisk(careless);\nfor (let id = 1; id \u003c= 200; id++) sink1.write({ id });\nsink1.end();\nawait once(sink1, \"finish\");\n\nconst careful = { maxBuffered: 0, waits: 0 };           // respects backpressure\nconst sink2 = slowDisk(careful);\nfor (let id = 1; id \u003c= 200; id++) {\n  if (!sink2.write({ id })) { careful.waits++; await once(sink2, \"drain\"); }\n}\nsink2.end();\nawait once(sink2, \"finish\");\nconsole.log(\"ignoring backpressure: up to\", careless.maxBuffered, \"rows held in memory\");\nconsole.log(\"respecting it:         up to\", careful.maxBuffered, \"rows, paused\", careful.waits, \"times\");\n\nclass OrderCursor extends Readable {                    // a source written by hand\n  #next = 1;\n  constructor(total) { super({ objectMode: true, highWaterMark: 2 }); this.total = total; }\n  _read() {                                             // called only when the consumer wants more\n    this.push(this.#next \u003c= this.total ? { id: this.#next++ } : null);     // null ends the stream\n  }\n}\nlet received = 0;\nawait pipeline(new OrderCursor(5), new Writable({ objectMode: true, write(row, _e, done) { received++; done(); } }));\nconsole.log(\"custom readable delivered\", received, \"rows\");"}, {"t": "steps", "title": "`write()` returning false", "steps": [{"c": "The buffer limit is 4. Three rows are waiting to be written to the slow disk.", "cols": [["Writable buffer", ["row 1", "row 2", "row 3"]], ["write() returned", ["true"]], ["Producer", ["keeps writing"]]]}, {"c": "A fourth row arrives and the buffer reaches its limit.", "cols": [["Writable buffer", ["row 1", "row 2", "row 3", "row 4"]], ["write() returned", ["false"]], ["Producer", ["should stop"]]]}, {"c": "A careful producer waits for `drain`. A careless one keeps writing and the buffer grows without limit.", "cols": [["Writable buffer", ["row 1", "row 2", "row 3", "row 4"]], ["write() returned", ["(not called)"]], ["Producer", ["awaiting drain"]]]}, {"c": "The disk catches up, the buffer empties and `drain` is emitted.", "cols": [["Writable buffer", ["(empty)"]], ["write() returned", []], ["Producer", ["resumes"]]]}]}, {"t": "table", "title": "Stream events and methods to recognise", "rows": [["Readable", "Writable"], ["`data`, `end`, `error`, `close` events", "`drain`, `finish`, `error`, `close` events"], ["`for await (const chunk of stream)`", "`write(chunk)` returns a boolean"], ["`pause()` / `resume()`", "`end()` finishes the stream"], ["`readableHighWaterMark`", "`writableLength`, `writableHighWaterMark`"]]}, {"t": "quiz", "title": "", "items": [["Why use streams?", "To process data larger than memory, to start sending output before all input has arrived, and to compose steps such as read, compress and send."], ["What is backpressure?", "A signal from a slow consumer that tells the producer to pause, so data does not pile up in memory. In Node it is `write()` returning false followed by a `drain` event."], ["`pipe` versus `pipeline`?", "`pipe` connects streams but does not forward errors or clean up. `pipeline` connects them, propagates errors, destroys all streams on failure and returns a promise."], ["What is a Buffer?", "A fixed-length sequence of raw bytes outside the normal string type, used for binary data and for text in a specific encoding."], ["What does it mean when `write()` returns false?", "The writable's buffer has reached `highWaterMark`. The producer should stop writing and continue after the `drain` event."], ["What is `highWaterMark`?", "The buffer size threshold of a stream: bytes for binary streams (16 KB by default for most) or a number of objects in object mode. It controls when backpressure starts."], ["What is object mode?", "A stream setting where each chunk is any JavaScript value instead of a Buffer or string, used for rows and records."], ["Flowing versus paused mode in a readable?", "In paused mode data is delivered only when the consumer asks with `read()`. Attaching a `data` handler or piping switches to flowing mode, where chunks are pushed as they arrive."]]}]}]}, {"name": "Stage 3 · Backend", "sub": "From a socket to a tested API", "lessons": [{"id": "node-http", "title": "An HTTP server with no framework", "level": "Intermediate", "mins": "30 min", "blocks": [{"t": "plain", "title": "", "text": "Node has a web server built in. `createServer` takes one function, and Node calls it for every request with two objects: `req` (what came in) and `res` (what you send back). Both are streams.\n\nYou will use a framework for real projects. Writing one server by hand first shows you exactly what a framework does: match the method and path, read and parse the body, set the status and headers, and handle errors."}, {"t": "bridge", "title": "", "text": "`req` is the `URLRequest` you used to build on the client, seen from the receiving end. `res.writeHead(status, headers)` and `res.end(body)` build the `HTTPURLResponse` and data your app receives."}, {"t": "code", "lang": "js", "title": "", "code": "import { createServer } from \"node:http\";\n\nconst ORDERS = new Map();\n\nconst server = createServer(async (req, res) => {\n  const url = new URL(req.url, `http://${req.headers.host}`);\n  const send = (status, body) => {\n    res.writeHead(status, { \"content-type\": \"application/json\" });\n    res.end(JSON.stringify(body));\n  };\n\n  if (req.method === \"GET\" && url.pathname === \"/health\") return send(200, { ok: true });\n\n  if (req.method === \"POST\" && url.pathname === \"/orders\") {\n    let raw = \"\";\n    for await (const chunk of req) raw += chunk;        // the body arrives as a stream\n    let body;\n    try { body = JSON.parse(raw); } catch { return send(400, { error: \"invalid_json\" }); }\n    const order = { id: ORDERS.size + 1, status: \"placed\", ...body };\n    ORDERS.set(order.id, order);\n    return send(201, order);\n  }\n  send(404, { error: \"not_found\" });\n});\n\nawait new Promise((resolve) => server.listen(0, resolve));   // port 0: pick any free port\nconst base = `http://127.0.0.1:${server.address().port}`;\n\nconsole.log(await (await fetch(`${base}/health`)).json());\nconst created = await fetch(`${base}/orders`, { method: \"POST\", body: JSON.stringify({ sku: \"milk\", qty: 2 }) });\nconsole.log(created.status, await created.json());\nconsole.log((await fetch(`${base}/orders`, { method: \"POST\", body: \"{oops\" })).status, (await fetch(`${base}/nope`)).status);\nserver.close();\nserver.closeAllConnections();"}, {"t": "steps", "title": "One POST request through raw Node", "steps": [{"c": "A TCP connection opens. Node parses the request line and headers and calls your function.", "cols": [["Available now", ["method", "path", "headers"]], ["Not yet available", ["body"]]]}, {"c": "The body arrives in chunks. You collect them.", "cols": [["Available now", ["method", "path", "headers", "raw body text"]], ["Not yet available", ["parsed object"]]]}, {"c": "You parse the JSON yourself and handle the failure case.", "cols": [["Available now", ["method", "path", "headers", "body object"]], ["Not yet available", []]]}, {"c": "You write the status line and headers, then the body, then end the response.", "cols": [["Available now", ["response sent"]], ["Not yet available", []]]}]}, {"t": "flow", "title": "What a framework adds on top", "lanes": [{"name": "", "nodes": [{"n": "Raw request"}, {"a": ""}, {"n": "Routing table"}, {"a": ""}, {"n": "Body parsing"}, {"a": ""}, {"n": "Validation"}, {"a": ""}, {"n": "*Your handler"}, {"a": ""}, {"n": "Error handling"}, {"a": ""}, {"n": "Response helpers"}]}]}, {"t": "pitfalls", "title": "", "items": ["No limit on body size. A client can send gigabytes and exhaust memory. Frameworks cap it, and you must too.", "Forgetting to end the response. The client waits until it times out.", "Writing headers after the body has started.", "Listening on `localhost` inside a container. Bind to `0.0.0.0` so the port is reachable."]}, {"t": "quiz", "title": "", "items": [["What are `req` and `res`?", "`req` is an `IncomingMessage`, a readable stream with the method, URL and headers. `res` is a `ServerResponse`, a writable stream you use to send the status, headers and body."], ["Why is the request body not just a property?", "It arrives over the network in pieces and may be large, so Node exposes it as a stream you read or pipe."], ["What does a web framework do for you?", "Routing, body parsing with limits, middleware, error handling and response helpers, on top of the same `http` module."]]}]}, {"id": "node-express", "title": "Express and middleware", "level": "Intermediate", "mins": "40 min", "blocks": [{"t": "plain", "title": "", "text": "Express is the most widely used Node web framework. An Express app is a **chain of middleware**. A middleware is a function `(req, res, next)`. It can read or change the request, send a response, or call `next()` to pass control to the next function in the chain.\n\nLogging, authentication, body parsing, routes and error handling are all middleware. Their **order** is the design of your app."}, {"t": "analogy", "title": "", "text": "Airport security lanes. Each station checks one thing and either waves you on to the next or turns you back. The order of stations matters: you show your ticket before the bag scan, not after boarding."}, {"t": "bridge", "title": "", "text": "Middleware is a Dio interceptor chain or `URLProtocol` stack on the server side. `requireUser` below is the server half of the auth interceptor you have written on the client."}, {"t": "code", "lang": "js", "title": "", "code": "import express from \"express\";\n\nconst app = express();\napp.use(express.json({ limit: \"100kb\" }));               // 1. parse JSON bodies, with a size cap\n\napp.use((req, res, next) => {                             // 2. log every request when it finishes\n  const start = performance.now();\n  res.on(\"finish\", () => console.log(req.method, req.originalUrl, res.statusCode, `${(performance.now() - start).toFixed(1)}ms`));\n  next();\n});\n\nconst requireUser = (req, res, next) => {                 // stands in for real token checking\n  const id = Number(req.get(\"x-user-id\"));\n  if (!id) return res.status(401).json({ error: \"unauthenticated\" });\n  req.userId = id;\n  next();\n};\n\nconst ORDERS = new Map();\nconst orders = express.Router();\norders.post(\"/\", (req, res) => {\n  const order = { id: ORDERS.size + 1, userId: req.userId, status: \"placed\", ...req.body };\n  ORDERS.set(order.id, order);\n  res.status(201).json(order);\n});\norders.get(\"/:id\", (req, res) => {\n  const order = ORDERS.get(Number(req.params.id));\n  if (!order || order.userId !== req.userId) return res.status(404).json({ error: \"not_found\" });\n  res.json(order);\n});\norders.get(\"/:id/explode\", async () => { throw new Error(\"database is down\"); });\n\napp.get(\"/health\", (req, res) => res.json({ ok: true }));\napp.use(\"/orders\", requireUser, orders);                  // 3. routes\napp.use((req, res) => res.status(404).json({ error: \"not_found\" }));   // 4. nothing matched\napp.use((err, req, res, next) => {                        // 5. error middleware: four arguments\n  console.error(\"error:\", err.message);\n  res.status(err.status ?? 500).json({ error: \"internal\" });\n});\n\nconst server = app.listen(0);\nawait new Promise((resolve) => server.once(\"listening\", resolve));\nconst base = `http://127.0.0.1:${server.address().port}`;\nconst call = (path, options = {}) => fetch(base + path, { ...options, headers: { \"content-type\": \"application/json\", ...options.headers } });\n\nawait call(\"/orders\", { method: \"POST\", body: JSON.stringify({ sku: \"milk\" }) });                       // 401\nawait call(\"/orders\", { method: \"POST\", body: JSON.stringify({ sku: \"milk\" }), headers: { \"x-user-id\": \"7\" } });\nawait call(\"/orders/1\", { headers: { \"x-user-id\": \"7\" } });                                             // 200\nawait call(\"/orders/1\", { headers: { \"x-user-id\": \"8\" } });                                             // 404: not yours\nawait call(\"/orders/1/explode\", { headers: { \"x-user-id\": \"7\" } });                                     // 500\nserver.close();\nserver.closeAllConnections();"}, {"t": "steps", "title": "A request walking the middleware chain", "steps": [{"c": "`GET /orders/1` with user 8 arrives. The JSON parser has nothing to parse and calls `next()`.", "cols": [["Has run", ["express.json"]], ["Decision", ["next()"]]]}, {"c": "The logger notes the start time, registers a `finish` listener and calls `next()`.", "cols": [["Has run", ["express.json", "logger"]], ["Decision", ["next()"]]]}, {"c": "The path starts with `/orders`, so `requireUser` runs. The header is present. It sets `req.userId = 8`.", "cols": [["Has run", ["express.json", "logger", "requireUser"]], ["Decision", ["next()"]]]}, {"c": "The router matches `GET /:id`. The order belongs to user 7, not 8.", "cols": [["Has run", ["express.json", "logger", "requireUser", "route handler"]], ["Decision", ["respond 404"]]]}, {"c": "The response is sent. Later middleware never runs. The logger's `finish` listener prints the line.", "cols": [["Has run", ["express.json", "logger", "requireUser", "route handler"]], ["Decision", ["chain ended"]]]}]}, {"t": "flow", "title": "Order of registration", "lanes": [{"name": "", "nodes": [{"n": "express.json"}, {"a": ""}, {"n": "Logger"}, {"a": ""}, {"n": "Auth"}, {"a": ""}, {"n": "Routers"}, {"a": ""}, {"n": "404 handler"}, {"a": ""}, {"n": "Error handler (last)"}]}]}, {"t": "table", "title": "Express, Fastify, NestJS", "rows": [["Framework", "Character", "Pick it when"], ["Express", "Minimal, huge ecosystem, unopinionated", "Small to medium APIs, most tutorials and existing code"], ["Fastify", "Fast, schema-based validation and serialisation built in", "Performance matters, you want structure without a full framework"], ["NestJS", "Full framework: modules, dependency injection, decorators, TypeScript first", "Large teams and codebases that need enforced structure"]]}, {"t": "pitfalls", "title": "", "items": ["Registering the error handler before the routes. It must come last.", "Forgetting `next()` or a response in a middleware. The request hangs.", "Sending two responses (`res.json` twice) because of a missing `return`.", "Returning 403 for someone else's order. It confirms the order exists. Return 404."]}, {"t": "deep", "title": "Middleware is a 25-line idea", "text": "Express feels like a large framework, but its core is small. An app is an array of functions. Handling a request means calling the first one with a `next` function that calls the second, and so on. Calling `next(err)` skips forward to the first function that takes four arguments. Writing this once removes the mystery from every Node framework, because Koa, Fastify hooks and NestJS interceptors are variations of the same loop."}, {"t": "code", "lang": "js", "title": "", "code": "function createApp() {\n  const stack = [];\n  return {\n    use(fn) { stack.push(fn); return this; },\n    async handle(req, res) {\n      let index = 0;\n      const next = async (err) => {\n        while (index \u003c stack.length) {\n          const fn = stack[index++];\n          const handlesErrors = fn.length === 4;           // (err, req, res, next)\n          if (Boolean(err) !== handlesErrors) continue;     // skip the wrong kind\n          try {\n            return await (err ? fn(err, req, res, next) : fn(req, res, next));\n          } catch (thrown) {\n            return next(thrown);                            // a throw becomes next(err)\n          }\n        }\n        if (err) { res.status = 500; res.body = { error: \"unhandled\" }; }\n      };\n      await next();\n      return res;\n    },\n  };\n}\n\nconst app = createApp()\n  .use(async (req, res, next) => {                          // timing: wraps everything after it\n    const start = performance.now();\n    await next();\n    res.ms = Number((performance.now() - start).toFixed(1));\n  })\n  .use((req, res, next) => {                                // auth\n    if (!req.headers.token) { res.status = 401; res.body = { error: \"unauthenticated\" }; return; }\n    req.userId = 7;\n    return next();\n  })\n  .use((req, res, next) => {                                // route\n    if (req.path !== \"/orders/184\") return next();\n    if (req.query.fail) throw new Error(\"database is down\");\n    res.status = 200; res.body = { id: 184, userId: req.userId };\n  })\n  .use((req, res) => { res.status = 404; res.body = { error: \"not_found\" }; })\n  .use((err, req, res, next) => { res.status = 500; res.body = { error: \"internal\", logged: err.message }; });\n\nconst call = (path, extra = {}) => app.handle({ path, headers: { token: \"t\" }, query: {}, ...extra }, {});\nfor (const res of [\n  await call(\"/orders/184\"),\n  await call(\"/orders/184\", { headers: {} }),\n  await call(\"/nope\"),\n  await call(\"/orders/184\", { query: { fail: \"1\" } }),\n]) console.log(res.status, JSON.stringify(res.body), res.ms !== undefined ? \"(timed)\" : \"\");", "web": 1}, {"t": "steps", "title": "The onion: code before and after `next()`", "steps": [{"c": "The timing middleware runs first and records the start time. It awaits `next()`.", "cols": [["Entered", ["timing"]], ["Waiting at next()", []], ["Finished", []]]}, {"c": "Auth runs, sets the user and calls `next()`.", "cols": [["Entered", ["timing", "auth"]], ["Waiting at next()", ["timing"]], ["Finished", []]]}, {"c": "The route handler sets the response and returns.", "cols": [["Entered", ["timing", "auth", "route"]], ["Waiting at next()", ["timing", "auth"]], ["Finished", []]]}, {"c": "Control unwinds. Auth's call to `next()` resolves, then timing's does.", "cols": [["Entered", ["timing"]], ["Waiting at next()", []], ["Finished", ["route", "auth"]]]}, {"c": "Timing computes the duration after everything inside it has finished.", "cols": [["Entered", []], ["Waiting at next()", []], ["Finished", ["route", "auth", "timing"]]]}]}, {"t": "table", "title": "Request lifecycle in a real Express app", "rows": [["Phase", "Typical middleware"], ["Before routing", "Request id, logging, security headers, CORS, body parsing, rate limit"], ["Per router", "Authentication, permission checks, validation"], ["Handler", "Calls a service, sends the response"], ["After", "404 handler, then the error handler"]]}, {"t": "quiz", "title": "", "items": [["What is middleware?", "A function with access to the request, the response and `next`. It runs in registration order and either ends the request or passes it on."], ["How does Express recognise error middleware?", "By its four parameters `(err, req, res, next)`. It is called when a handler throws, rejects (Express 5) or calls `next(err)`."], ["`app.use` versus `app.get`?", "`app.use` runs for every method and for any path starting with its prefix. `app.get` runs only for GET requests matching the exact route pattern."], ["How do you structure routes in a larger app?", "One `express.Router()` per resource in its own file, mounted under a prefix, with handlers calling service functions that hold the business rules."], ["How does `next()` work internally?", "The framework keeps an index into its middleware list. `next()` advances the index and calls the next function, passing itself along. `next(err)` skips to the next error handler."], ["Why is middleware order important?", "Each middleware only affects what comes after it. A body parser must precede handlers that read the body, and the error handler must be last."], ["What is the onion model?", "Each middleware can run code before and after the rest of the chain by awaiting `next()`, so the request passes inward through the layers and the response passes back out."], ["How would you add a request id to every log line?", "A first middleware creates or reads the id, stores it in `AsyncLocalStorage` and on the response header. The logger reads it from the store."]]}]}, {"id": "node-zod", "title": "Validation with Zod and TypeScript", "level": "Intermediate", "mins": "25 min", "blocks": [{"t": "plain", "title": "", "text": "TypeScript types vanish at run time, so a request body typed as `Order` could contain anything. **Zod** closes that gap. You write one schema. It validates and converts real data at run time, and TypeScript derives the static type from the same schema, so the two can never disagree."}, {"t": "bridge", "title": "", "text": "Zod is to Node what Pydantic is to Python, and what `Codable` with validation would be in Swift: declare the shape once, get parsing, conversion and a typed result or a list of errors."}, {"t": "code", "lang": "js", "title": "", "code": "import { z } from \"zod\";\n\nconst Address = z.object({\n  pincode: z.string().regex(/^\\d{6}$/, \"pincode must be 6 digits\"),\n  line1: z.string().min(1),\n});\n\nconst OrderRequest = z.object({\n  userId: z.coerce.number().int().positive(),         // \"7\" becomes 7\n  items: z.array(z.object({ sku: z.string().min(1), qty: z.number().int().min(1).max(20) })).min(1),\n  address: Address,\n  coupon: z.string().transform((c) => c.toUpperCase()).optional(),\n});\n// In TypeScript:  type OrderRequest = z.infer\u003ctypeof OrderRequest>;\n\nconst good = OrderRequest.safeParse({\n  userId: \"7\",\n  items: [{ sku: \"milk\", qty: 2 }],\n  address: { pincode: \"560103\", line1: \"12 MG Road\" },\n  coupon: \"first50\",\n  hackerField: \"ignored\",                              // unknown keys are dropped\n});\nconsole.log(good.success, good.data);\n\nconst bad = OrderRequest.safeParse({ userId: \"x\", items: [], address: { pincode: \"56\", line1: \"\" } });\nconsole.log(bad.success);\nfor (const issue of bad.error.issues) console.log(issue.path.join(\".\"), \"->\", issue.message);\n\nconst validate = (schema) => (req, res, next) => {     // reusable Express middleware\n  const result = schema.safeParse(req.body);\n  if (!result.success) return res.status(422).json({ error: \"validation\", issues: result.error.issues });\n  req.body = result.data;\n  next();\n};\nconsole.log(typeof validate(OrderRequest));"}, {"t": "flow", "title": "One schema, two jobs", "lanes": [{"name": "", "nodes": [{"n": "Zod schema"}, {"a": ""}, {"n": "z.infer gives the TypeScript type (compile time)"}]}, {"name": "", "nodes": [{"n": "Zod schema"}, {"a": ""}, {"n": "safeParse checks real data (run time)"}, {"a": ""}, {"n": "Valid?"}, {"a": "no"}, {"n": "422 with issues"}]}, {"name": "", "nodes": [{"n": "Valid?"}, {"a": "yes"}, {"n": "Typed, cleaned data reaches the handler"}]}]}, {"t": "pitfalls", "title": "", "items": ["Validating the body but not `req.params` and `req.query`. They are user input too and always strings.", "Writing a TypeScript interface and a separate hand-made validator that drift apart.", "Using `.parse` (throws) in a handler without a catch. Use `.safeParse`, or let central error middleware map the error to 422."]}, {"t": "quiz", "title": "", "items": [["Why is TypeScript not enough to validate requests?", "Types are erased when the code is compiled. At run time the body is whatever the client sent."], ["What does `z.infer` do?", "It derives the TypeScript type from a
