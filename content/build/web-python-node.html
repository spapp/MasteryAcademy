ble. The cost is that every insert and update must also update the tree, and a query can only use an index whose leading columns appear in its filter.\n\n**Isolation level** decides what a transaction may see of other transactions running at the same moment. The PostgreSQL default, *read committed*, never shows uncommitted data, but two reads inside one transaction can return different results. For \"check, then update\" logic that is not enough: lock the row with `SELECT ... FOR UPDATE`, or put the check into the `UPDATE` itself.\n\nThe N+1 problem is easy to describe and easy to miss. Count the queries, as below."}, {"t": "code", "lang": "python", "title": "", "code": "from sqlalchemy import ForeignKey, create_engine, event, select\nfrom sqlalchemy.orm import DeclarativeBase, Mapped, Session, mapped_column, relationship, selectinload\n\nclass Base(DeclarativeBase): pass\n\nclass Order(Base):\n    __tablename__ = \"orders\"\n    id: Mapped[int] = mapped_column(primary_key=True)\n    city: Mapped[str] = mapped_column(index=True)\n    items: Mapped[list[\"Item\"]] = relationship()\n\nclass Item(Base):\n    __tablename__ = \"items\"\n    id: Mapped[int] = mapped_column(primary_key=True)\n    order_id: Mapped[int] = mapped_column(ForeignKey(\"orders.id\"), index=True)\n    sku: Mapped[str]\n\nengine = create_engine(\"sqlite://\")\nBase.metadata.create_all(engine)\nwith Session(engine) as session, session.begin():\n    session.add_all(Order(city=\"blr\", items=[Item(sku=\"milk\"), Item(sku=\"bread\")]) for _ in range(50))\n\nqueries = []\n@event.listens_for(engine, \"before_cursor_execute\")\ndef count(conn, cursor, statement, parameters, context, executemany):\n    queries.append(statement.split()[0])\n\nwith Session(engine) as session:\n    orders = session.scalars(select(Order)).all()\n    total = sum(len(o.items) for o in orders)            # each access fires one more SELECT\n    print(f\"lazy loading:  {len(queries)} queries for {len(orders)} orders, {total} items\")\n\nqueries.clear()\nwith Session(engine) as session:\n    orders = session.scalars(select(Order).options(selectinload(Order.items))).all()\n    total = sum(len(o.items) for o in orders)\n    print(f\"selectinload:  {len(queries)} queries for {len(orders)} orders, {total} items\")\n\nwith engine.connect() as conn:\n    plan = conn.exec_driver_sql(\"EXPLAIN QUERY PLAN SELECT * FROM orders WHERE city = 'blr'\").all()\n    print(\"plan:\", plan[0][-1])                          # shows the index being used"}, {"t": "table", "title": "Isolation levels", "rows": [["Level", "Prevents", "Still possible"], ["Read uncommitted", "Nothing", "Reading data another transaction has not committed (dirty read)"], ["Read committed (PostgreSQL default)", "Dirty reads", "A value changing between two reads in one transaction"], ["Repeatable read", "Dirty and non-repeatable reads", "In some databases, new rows appearing (phantoms)"], ["Serializable", "All of the above", "Transactions may be aborted and must be retried"]]}, {"t": "flow", "title": "How an index lookup avoids scanning", "lanes": [{"name": "", "nodes": [{"n": "WHERE city = 'blr'"}, {"a": ""}, {"n": "B-tree root page"}, {"a": ""}, {"n": "Branch page for b..."}, {"a": ""}, {"n": "Leaf page with row pointers"}, {"a": ""}, {"n": "Fetch only matching rows"}]}, {"name": "", "nodes": [{"n": "No index on city"}, {"a": ""}, {"n": "!Read every page of the table"}, {"a": ""}, {"n": "Filter in memory"}]}]}, {"t": "table", "title": "Schema migration, without downtime", "rows": [["Step", "Release"], ["1. Add the new column as nullable", "A"], ["2. Write to both old and new columns", "A"], ["3. Backfill old rows in batches", "Job"], ["4. Read from the new column", "B"], ["5. Drop the old column", "C, after B is stable"]]}, {"t": "quiz", "title": "", "items": [["What is an index and what does it cost?", "A sorted structure (usually a B-tree) that lets the database find rows without scanning the table. It makes reads faster and writes slightly slower, and it uses disk space."], ["What is the N+1 problem?", "One query fetches N parent rows, then one more query runs per parent to fetch its children. Fix it by eager loading the children in one or two queries."], ["What does ACID mean?", "Atomic (all or nothing), Consistent (rules always hold), Isolated (concurrent transactions do not see each other's half-done work), Durable (committed data survives a crash)."], ["ORM versus raw SQL?", "The ORM is faster to write and safer for ordinary create, read, update and delete. Raw SQL is better for complex reports and tuned queries. Most teams use both."], ["What is a connection pool?", "A set of open database connections that requests borrow and return, because opening a connection per request is slow and the database allows only a limited number."], ["How does a B-tree index speed up a query?", "It keeps keys sorted in a shallow tree, so the database descends a few levels to the matching entries instead of scanning every row. It also serves range queries and ordering on the indexed columns."], ["When will the database not use your index?", "When the filter does not use the index's leading column, when a function is applied to the column, when the types do not match, or when the planner estimates that most rows match and a scan is cheaper."], ["What is the default isolation level in PostgreSQL and what does it allow?", "Read committed. A transaction never sees uncommitted data, but repeated reads may return different committed values."], ["How do you prevent two requests from both taking the last item?", "Use one atomic conditional `UPDATE ... WHERE available >= n` and check the affected row count, or lock the row with `SELECT ... FOR UPDATE` inside a transaction."], ["How do you detect N+1 queries?", "Count or log the SQL executed per request in tests or development. A count that grows with the number of rows returned signals N+1."], ["What is a composite index and does column order matter?", "An index on several columns. Order matters: an index on `(user_id, created_at)` serves filters on `user_id` alone or on both, but not on `created_at` alone."]]}]}, {"id": "py-auth", "title": "Authentication and security", "level": "Advanced", "mins": "35 min", "blocks": [{"t": "plain", "title": "", "text": "**Authentication** answers \"who are you\". **Authorisation** answers \"are you allowed to do this\". A login checks a password or an OTP, then gives the client a token. The client sends the token with every request and the server verifies it.\n\nA **JWT** is a token that carries its own data (user id, expiry) and a signature. The server can verify it with a secret key and no database lookup."}, {"t": "bridge", "title": "", "text": "You already store and send this token from the app (Keychain, an `Authorization: Bearer` header in an interceptor) and handle the 401 by refreshing. Here you write the part that issues the token and rejects a bad one."}, {"t": "code", "lang": "python", "title": "", "code": "import hashlib, hmac, os, time\nimport jwt     # pip install pyjwt\n\nSECRET = os.getenv(\"JWT_SECRET\", \"local-demo-only-load-the-real-one-from-env\")\n\ndef hash_password(password: str) -> str:\n    salt = os.urandom(16)                                   # different for every user\n    digest = hashlib.scrypt(password.encode(), salt=salt, n=2**14, r=8, p=1)\n    return salt.hex() + \":\" + digest.hex()\n\ndef verify_password(password: str, stored: str) -> bool:\n    salt_hex, digest_hex = stored.split(\":\")\n    digest = hashlib.scrypt(password.encode(), salt=bytes.fromhex(salt_hex), n=2**14, r=8, p=1)\n    return hmac.compare_digest(digest.hex(), digest_hex)    # constant-time compare\n\ndef make_token(user_id: int, minutes: int = 15) -> str:\n    now = int(time.time())\n    return jwt.encode({\"sub\": str(user_id), \"iat\": now, \"exp\": now + minutes * 60}, SECRET, algorithm=\"HS256\")\n\ndef read_token(token: str) -> int:\n    return int(jwt.decode(token, SECRET, algorithms=[\"HS256\"])[\"sub\"])\n\nstored = hash_password(\"correct horse\")\nprint(verify_password(\"correct horse\", stored), verify_password(\"wrong\", stored))\ntoken = make_token(7)\nprint(\"user\", read_token(token), \"| token parts:\", len(token.split(\".\")))\nfor bad in (make_token(7, minutes=-1), token[:-2] + \"xx\"):\n    try:\n        read_token(bad)\n    except jwt.ExpiredSignatureError:\n        print(\"rejected: expired -> 401, client should refresh\")\n    except jwt.InvalidTokenError:\n        print(\"rejected: tampered -> 401\")"}, {"t": "flow", "title": "Login, then an authenticated call", "lanes": [{"name": "", "nodes": [{"n": "Phone sends phone + OTP"}, {"a": ""}, {"n": "Server verifies"}, {"a": ""}, {"n": "Issues access token (15 min) + refresh token (30 days)"}]}, {"name": "", "nodes": [{"n": "Phone calls GET /orders with Bearer token"}, {"a": ""}, {"n": "Signature and expiry valid?"}, {"a": "no"}, {"n": "401"}]}, {"name": "", "nodes": [{"n": "Signature and expiry valid?"}, {"a": "yes"}, {"n": "Does this order belong to this user?"}, {"a": "no"}, {"n": "403 or 404"}]}, {"name": "", "nodes": [{"n": "Does this order belong to this user?"}, {"a": "yes"}, {"n": "200 with data"}]}]}, {"t": "real", "title": "", "text": "`GET /orders/184` must check that order 184 belongs to the user in the token. Skipping that check lets any logged-in user read anyone's order by changing the number in the URL. This bug (broken object level authorisation) is the most common serious API vulnerability, and no framework prevents it for you."}, {"t": "pitfalls", "title": "", "items": ["Storing passwords in plain text or with a fast hash like SHA-256. Use a slow, salted algorithm: scrypt, bcrypt or argon2.", "Putting secrets in code or in git. Load them from environment variables or a secret manager.", "Putting sensitive data inside a JWT. The payload is only encoded, anyone can read it.", "Long-lived access tokens with no way to revoke them.", "Checking that the user is logged in but not that the resource is theirs."]}, {"t": "deep", "title": "OAuth, refresh rotation, roles and rate limits", "text": "**OAuth 2.0** lets a user allow your app to act for them at another provider without sharing their password. \"Sign in with Google\" adds **OpenID Connect** on top, which returns an identity token describing the user. Mobile apps use the *authorization code flow with PKCE*.\n\n**Refresh token rotation** makes stolen refresh tokens detectable. Each refresh returns a new refresh token and invalidates the old one. If an old one is ever presented again, someone has a copy, so the server revokes the whole chain and forces a new login.\n\nOnce you know who the user is, **authorisation** decides what they may do. Role-based access control (RBAC) attaches permissions to roles. Ownership checks (\"is this order yours\") are separate and always needed."}, {"t": "code", "lang": "python", "title": "", "code": "import secrets, time\nfrom dataclasses import dataclass, field\n\n@dataclass\nclass TokenStore:\n    \"\"\"Refresh-token rotation with reuse detection. Production: a database table.\"\"\"\n    active: dict[str, tuple[int, str]] = field(default_factory=dict)    # token -> (user_id, family)\n    used: dict[str, str] = field(default_factory=dict)                   # spent token -> family\n    revoked_families: set[str] = field(default_factory=set)\n\n    def issue(self, user_id: int, family: str | None = None) -> str:\n        token = secrets.token_urlsafe(16)\n        self.active[token] = (user_id, family or secrets.token_hex(4))\n        return token\n\n    def rotate(self, token: str) -> str:\n        if token in self.used:                              # an old token came back: theft\n            self.revoked_families.add(self.used[token])\n            self.active = {t: v for t, v in self.active.items() if v[1] not in self.revoked_families}\n            raise PermissionError(\"refresh token reuse detected: all sessions revoked\")\n        if token not in self.active:\n            raise PermissionError(\"unknown refresh token\")\n        user_id, family = self.active.pop(token)\n        self.used[token] = family\n        return self.issue(user_id, family)\n\nstore = TokenStore()\nfirst = store.issue(user_id=7)\nsecond = store.rotate(first)                 # normal refresh\nprint(\"rotated:\", first != second)\ntry:\n    store.rotate(first)                      # attacker replays the stolen first token\nexcept PermissionError as err:\n    print(err)\ntry:\n    store.rotate(second)                     # the real user is logged out too, and must sign in again\nexcept PermissionError as err:\n    print(\"legitimate token now:\", err)\n\nPERMISSIONS = {\"customer\": {\"order:read\"}, \"support\": {\"order:read\", \"order:refund\"}, \"admin\": {\"*\"}}\ndef allowed(roles: list[str], permission: str) -> bool:\n    granted = set().union(*(PERMISSIONS[r] for r in roles))\n    return \"*\" in granted or permission in granted\nprint(allowed([\"customer\"], \"order:refund\"), allowed([\"support\"], \"order:refund\"))\n\nclass TokenBucket:                            # rate limiting: steady refill, small bursts allowed\n    def __init__(self, rate_per_second: float, burst: int):\n        self.rate, self.capacity, self.tokens, self.stamp = rate_per_second, burst, float(burst), time.monotonic()\n    def allow(self) -> bool:\n        now = time.monotonic()\n        self.tokens = min(self.capacity, self.tokens + (now - self.stamp) * self.rate)\n        self.stamp = now\n        if self.tokens >= 1:\n            self.tokens -= 1\n            return True\n        return False\nbucket = TokenBucket(rate_per_second=1, burst=3)\nprint([bucket.allow() for _ in range(5)])     # three pass, then 429", "web": 1}, {"t": "flow", "title": "Authorization code flow with PKCE (mobile)", "lanes": [{"name": "", "nodes": [{"n": "App creates a random verifier and its hash"}, {"a": ""}, {"n": "Opens the provider's login page with the hash"}, {"a": ""}, {"n": "User signs in and consents"}, {"a": ""}, {"n": "Provider redirects back with a one-time code"}, {"a": ""}, {"n": "App sends code + verifier to the token endpoint"}, {"a": ""}, {"n": "Provider checks the hash matches"}, {"a": ""}, {"n": "Access token + ID token + refresh token"}]}]}, {"t": "steps", "title": "Refresh rotation catching a thief", "steps": [{"c": "The user logs in and receives refresh token R1.", "cols": [["Valid on server", ["R1"]], ["User holds", ["R1"]], ["Attacker holds", []]]}, {"c": "An attacker copies R1 from a compromised device.", "cols": [["Valid on server", ["R1"]], ["User holds", ["R1"]], ["Attacker holds", ["R1"]]]}, {"c": "The user's app refreshes. R1 is spent and R2 is issued.", "cols": [["Valid on server", ["R2"]], ["User holds", ["R2"]], ["Attacker holds", ["R1 (spent)"]]]}, {"c": "The attacker presents R1. The server sees a spent token being reused.", "cols": [["Valid on server", ["R2"]], ["User holds", ["R2"]], ["Attacker holds", ["R1 (rejected)"]]]}, {"c": "The server revokes the whole family, including R2. Both must log in again, and only the real user can.", "cols": [["Valid on server", ["(none)"]], ["User holds", ["must log in"]], ["Attacker holds", ["nothing useful"]]]}]}, {"t": "quiz", "title": "", "items": [["What is inside a JWT?", "Three base64 parts: a header (algorithm), a payload (claims such as `sub` and `exp`) and a signature over the first two. The signature proves it was not changed. The payload is readable by anyone."], ["Why hash passwords with a slow algorithm?", "If the database leaks, an attacker must guess passwords. A slow hash with a per-user salt makes each guess expensive and stops precomputed tables."], ["Access token versus refresh token?", "The access token is short-lived and sent on every request. The refresh token is long-lived, sent only to the token endpoint to get a new access token, and can be revoked on the server."], ["What is CORS?", "A browser rule: a web page from one origin may call your API only if the API's response headers allow that origin. It protects browser users and does not apply to native mobile apps."], ["How do you prevent SQL injection?", "Never build SQL by joining strings with user input. Use parameterised queries or an ORM, which send the values separately from the SQL text."], ["OAuth 2.0 versus OpenID Connect?", "OAuth 2.0 is for authorisation: granting an app limited access to resources. OpenID Connect is a layer on top for authentication that adds an ID token describing who the user is."], ["What is PKCE and why do mobile apps need it?", "A proof step where the app sends a hash of a secret at the start and the secret itself when exchanging the code. It stops an attacker who intercepts the redirect code from using it, since a mobile app cannot keep a client secret."], ["What is refresh token rotation?", "Each refresh returns a new refresh token and invalidates the previous one. Reuse of an old token signals theft, and the server revokes the session."], ["Authentication versus authorisation?", "Authentication establishes who the caller is. Authorisation decides whether that caller may perform this action on this resource."], ["How does a token bucket rate limiter work?", "A bucket holds up to N tokens and refills at a steady rate. Each request takes one token and is rejected when the bucket is empty, which allows short bursts but limits the average rate."]]}]}, {"id": "py-arch", "title": "Project structure, config and errors", "level": "Advanced", "mins": "35 min", "blocks": [{"t": "plain", "title": "", "text": "A real service needs three habits. **Configuration** comes from environment variables, so the same code runs on your laptop, in staging and in production. **Dependencies** such as the database session or settings are handed to a function instead of created inside it, so tests can swap them. **Errors** are raised as specific exceptions and converted to HTTP responses in one place."}, {"t": "bridge", "title": "", "text": "`Depends(...)` is dependency injection: the same idea as passing a repository into a view model or providing a bloc. An exception handler is a global error interceptor. Environment variables are your build configurations and `.xcconfig` values, decided at run time instead of build time."}, {"t": "code", "lang": "python", "title": "", "code": "import logging, os\nfrom dataclasses import dataclass\nfrom fastapi import Depends, FastAPI, Request\nfrom fastapi.responses import JSONResponse\nfrom fastapi.testclient import TestClient\n\nlogging.basicConfig(level=logging.INFO, format=\"%(levelname)s %(name)s %(message)s\")\nlog = logging.getLogger(\"shop\")\n\n@dataclass(frozen=True)\nclass Settings:\n    database_url: str = os.getenv(\"DATABASE_URL\", \"sqlite://\")\n    free_delivery_above: int = int(os.getenv(\"FREE_DELIVERY_ABOVE\", \"500\"))\n\ndef get_settings() -> Settings:\n    return Settings()\n\nclass OutOfStock(Exception):\n    def __init__(self, sku: str):\n        self.sku = sku\n\napp = FastAPI()\n\n@app.exception_handler(OutOfStock)\nasync def out_of_stock_handler(request: Request, exc: OutOfStock) -> JSONResponse:\n    log.warning(\"out_of_stock sku=%s path=%s\", exc.sku, request.url.path)\n    return JSONResponse(status_code=409, content={\"error\": \"out_of_stock\", \"sku\": exc.sku})\n\n@app.get(\"/fee\")\ndef fee(total: int, settings: Settings = Depends(get_settings)) -> dict:\n    return {\"fee\": 0 if total >= settings.free_delivery_above else 40}\n\n@app.post(\"/reserve/{sku}\")\ndef reserve(sku: str) -> dict:\n    if sku == \"ghee\":\n        raise OutOfStock(sku)          # business code knows nothing about HTTP\n    return {\"reserved\": sku}\n\nclient = TestClient(app)\nprint(client.get(\"/fee\", params={\"total\": 300}).json())\napp.dependency_overrides[get_settings] = lambda: Settings(free_delivery_above=100)   # what a test does\nprint(client.get(\"/fee\", params={\"total\": 300}).json())\nresponse = client.post(\"/reserve/ghee\")\nprint(response.status_code, response.json())"}, {"t": "flow", "title": "Layers and the direction of calls", "lanes": [{"name": "", "nodes": [{"n": "Route (HTTP only)"}, {"a": ""}, {"n": "Service (business rules)"}, {"a": ""}, {"n": "Repository (queries)"}, {"a": ""}, {"n": "Database"}]}, {"name": "", "nodes": [{"n": "Service raises OutOfStock"}, {"a": ""}, {"n": "Central handler"}, {"a": ""}, {"n": "409 JSON"}]}, {"name": "", "nodes": [{"n": "Settings from environment"}, {"a": ""}, {"n": "Injected with Depends"}, {"a": ""}, {"n": "Routes and services"}]}]}, {"t": "table", "title": "Twelve-factor habits worth copying", "rows": [["Habit", "What it means in practice"], ["Config in the environment", "No URLs, keys or flags in code"], ["Stateless processes", "Nothing important kept in memory between requests"], ["Logs as a stream", "Print structured lines to stdout, let the platform collect them"], ["Same build everywhere", "One image goes to staging and then to production"], ["Fast start, clean stop", "Finish in-flight requests on shutdown"]]}, {"t": "pitfalls", "title": "", "items": ["Business rules inside route functions. They become impossible to reuse from a background job or test without HTTP.", "`print` for logging. Use `logging` with levels and include ids (request id, order id) so one request can be traced.", "Logging secrets or personal data such as tokens, phone numbers and addresses."]}, {"t": "quiz", "title": "", "items": [["What is dependency injection and why use it?", "A function receives the things it needs as parameters instead of creating them. Tests can then pass fakes, and real wiring lives in one place."], ["Why should a service be stateless?", "So any instance can serve any request. That allows running many copies behind a load balancer, restarting them and scaling up or down freely. State goes in a database or cache."], ["What belongs in a log line?", "A level, a short event name, and identifying fields such as request id, user id and order id. No secrets and no personal data."]]}]}, {"id": "py-test", "title": "Testing with pytest", "level": "Advanced", "mins": "30 min", "blocks": [{"t": "plain", "title": "", "text": "`pytest` finds files named `test_*.py`, runs every function named `test_*` and reports which `assert` failed and why. A **fixture** is a function that prepares something a test needs, such as a client or a clean database. **Parametrize** runs one test with many inputs.\n\nTest the business rules heavily with plain function tests, and test each endpoint a little through the HTTP layer."}, {"t": "bridge", "title": "", "text": "A fixture is `setUp` you can share and compose. `TestClient` is a widget test for an API: it calls the app in memory with no network. Overriding a dependency is injecting a mock repository."}, {"t": "code", "lang": "python", "title": "tests/test_orders.py", "code": "import pytest\nfrom fastapi import FastAPI\nfrom fastapi.testclient import TestClient\n\ndef delivery_fee(total: int, member: bool = False) -> int:\n    if member or total >= 500:\n        return 0\n    return 20 if total >= 200 else 40\n\napp = FastAPI()\n\n@app.get(\"/fee\")\ndef fee(total: int, member: bool = False) -> dict:\n    return {\"fee\": delivery_fee(total, member)}\n\n@pytest.fixture\ndef client() -> TestClient:\n    return TestClient(app)\n\n@pytest.mark.parametrize(\n    (\"total\", \"member\", \"expected\"),\n    [(100, False, 40), (200, False, 20), (499, False, 20), (500, False, 0), (100, True, 0)],\n)\ndef test_delivery_fee_rules(total: int, member: bool, expected: int) -> None:\n    assert delivery_fee(total, member) == expected\n\ndef test_fee_endpoint(client: TestClient) -> None:\n    response = client.get(\"/fee\", params={\"total\": 300})\n    assert response.status_code == 200\n    assert response.json() == {\"fee\": 20}\n\ndef test_fee_rejects_text(client: TestClient) -> None:\n    assert client.get(\"/fee\", params={\"total\": \"abc\"}).status_code == 422"}, {"t": "code", "lang": "bash", "title": "", "code": "pip install pytest\npytest -q                 # run everything\npytest -k fee -x          # only tests with \"fee\" in the name, stop at first failure"}, {"t": "flow", "title": "The test pyramid", "lanes": [{"name": "", "nodes": [{"n": "Many unit tests (pure functions, milliseconds)"}, {"a": ""}, {"n": "Fewer API tests (TestClient + test database)"}, {"a": ""}, {"n": "A handful of end-to-end tests (real deployed stack)"}]}]}, {"t": "real", "title": "", "text": "Boundary values catch real bugs. The rule says \"free above 500\". Is exactly 500 free? The parametrised test with 499 and 500 forces someone to decide, and it fails loudly if a later change flips the answer."}, {"t": "pitfalls", "title": "", "items": ["Tests that depend on each other or on order. Each test should set up what it needs.", "Calling real payment gateways or AI models in unit tests. Replace them with fakes and test the real thing separately.", "Chasing 100% coverage instead of testing the rules that cost money when wrong."]}, {"t": "deep", "title": "Mocks, fakes and controlling time", "text": "A unit test must not call a payment gateway, send an SMS or depend on today's date. You replace those collaborators with **test doubles**.\n\nA **fake** is a small working implementation, such as an in-memory repository. A **mock** records how it was called so the test can assert on the calls, and can be told what to return or raise. `unittest.mock` in the standard library provides both `Mock` and `AsyncMock`, and `patch` temporarily swaps an attribute.\n\nThe cleanest way to make code testable is to **pass dependencies in** as arguments. Time is the classic case: a function that calls `datetime.now()` inside is hard to test, and one that accepts a clock is trivial.\n\nThis sample uses only the standard library and plain `assert`, so it runs anywhere. In a project you would put the same assertions in test functions."}, {"t": "code", "lang": "python", "title": "", "code": "import asyncio\nfrom dataclasses import dataclass, field\nfrom datetime import datetime, timedelta\nfrom unittest.mock import AsyncMock, Mock, patch\n\n@dataclass\nclass Order:\n    id: int\n    total: int\n    placed_at: datetime\n\ndef can_cancel(order: Order, now: datetime) -> bool:          # the clock is an argument\n    return now - order.placed_at \u003c= timedelta(minutes=5)\n\nplaced = datetime(2026, 11, 11, 9, 0)\nassert can_cancel(Order(1, 500, placed), now=placed + timedelta(minutes=4))\nassert not can_cancel(Order(1, 500, placed), now=placed + timedelta(minutes=6))\n\n@dataclass\nclass FakeOrders:                                              # a fake: real behaviour, in memory\n    rows: dict[int, Order] = field(default_factory=dict)\n    def get(self, order_id: int) -> Order | None:\n        return self.rows.get(order_id)\n\ndef refund(order_id: int, orders, gateway, notifier) -> str:\n    order = orders.get(order_id)\n    if order is None:\n        return \"not_found\"\n    gateway.refund(order_id=order.id, amount=order.total)\n    notifier.send(f\"Refund of {order.total} started\")\n    return \"refunded\"\n\norders = FakeOrders({184: Order(184, 70900, placed)})\ngateway, notifier = Mock(), Mock()                            # mocks: record every call\nassert refund(184, orders, gateway, notifier) == \"refunded\"\ngateway.refund.assert_called_once_with(order_id=184, amount=70900)\nnotifier.send.assert_called_once()\nassert refund(999, orders, gateway, notifier) == \"not_found\"\nassert gateway.refund.call_count == 1                         # no second refund\n\ngateway.refund.side_effect = TimeoutError(\"gateway timeout\")  # make the collaborator fail\ntry:\n    refund(184, orders, gateway, notifier)\nexcept TimeoutError:\n    assert notifier.send.call_count == 1                      # no \"refund started\" message was sent\n\nasync def eta_message(client) -> str:\n    data = await client.get_eta(order_id=184)\n    return f\"Arriving in {data['minutes']} min\"\n\nclient = AsyncMock()\nclient.get_eta.return_value = {\"minutes\": 12}\nassert asyncio.run(eta_message(client)) == \"Arriving in 12 min\"\nclient.get_eta.assert_awaited_once_with(order_id=184)\n\nimport random\nwith patch.object(random, \"random\", return_value=0.5):        # patch: swap, then restore automatically\n    assert random.random() == 0.5\nprint(\"all assertions passed\")"}, {"t": "flow", "title": "Choosing a test double", "lanes": [{"name": "", "nodes": [{"n": "Does the test need working behaviour (save, then read back)?"}, {"a": "yes"}, {"n": "Fake"}]}, {"name": "", "nodes": [{"n": "Does the test check that a call was made with certain arguments?"}, {"a": "yes"}, {"n": "Mock"}]}, {"name": "", "nodes": [{"n": "Does the code read the clock, random numbers or environment?"}, {"a": ""}, {"n": "Pass them in as arguments"}]}, {"name": "", "nodes": [{"n": "Third-party module you cannot inject?"}, {"a": ""}, {"n": "patch, as a last resort"}]}]}, {"t": "table", "title": "What to assert", "rows": [["Assert on", "Example", "Avoid"], ["Returned values", "`refund(...) == \"refunded\"`", "Private helper results"], ["State of a fake", "The order is now cancelled", "The fake's internals"], ["Calls that are the point of the function", "The gateway was asked to refund 70900", "Every internal call in order"], ["Behaviour on failure", "No notification when the gateway times out", "Only the happy path"]]}, {"t": "quiz", "title": "", "items": [["What is a fixture?", "A function that builds something a test needs. pytest passes its result to any test that names it as a parameter and can clean up afterwards."], ["Mock versus fake?", "A mock records how it was called so you can assert on the calls. A fake is a simple working replacement, such as an in-memory repository. Fakes usually make sturdier tests."], ["What should you not unit test?", "Third-party library internals and trivial getters. Test your own decisions and the boundaries between components."], ["Mock versus fake versus stub?", "A stub returns canned answers. A mock additionally records calls so you can assert on them. A fake is a simplified working implementation, such as an in-memory database."], ["How do you test code that depends on the current time?", "Pass the time or a clock function into the code and supply a fixed value in the test, instead of calling `datetime.now()` inside."], ["What does `side_effect` do on a mock?", "It makes the mock raise an exception, or return successive values from an iterable, or call a function when invoked."], ["Why is over-mocking a problem?", "Tests end up asserting how the code is written instead of what it does, so they break on harmless refactoring and pass even when the real integration is wrong."], ["What is `AsyncMock`?", "A mock whose calls return awaitables, for replacing `async` functions, with assertions such as `assert_awaited_once_with`."]]}]}, {"id": "py-jobs", "title": "Caching and background jobs", "level": "Advanced", "mins": "35 min", "blocks": [{"t": "plain", "title": "", "text": "Two tools make an API fast. A **cache** (usually Redis) keeps the answer to an expensive question for a short time so the next request skips the work. A **job queue** moves slow work out of the request: the API puts a message on a queue and answers at once, and a separate **worker** process does the work later.\n\nRule of thumb: anything over about half a second that the user does not need to wait for should be a background job."}, {"t": "analogy", "title": "", "text": "The cache is the answer you wrote on a sticky note so you do not look it up again. The queue is the ticket rail in a restaurant kitchen: the waiter clips a ticket and walks away, and cooks take tickets when free."}, {"t": "bridge", "title": "", "text": "The cache is `NSCache` or an in-memory map with expiry, but shared by every server instance. The queue is a persistent `OperationQueue` that survives restarts and is consumed by other machines."}, {"t": "code", "lang": "python", "title": "", "code": "import asyncio, time\n\nclass TTLCache:\n    def __init__(self, seconds: float):\n        self.seconds, self.store = seconds, {}\n    def get(self, key):\n        hit = self.store.get(key)\n        if hit and hit[1] > time.monotonic():\n            return hit[0]\n        self.store.pop(key, None)\n        return None\n    def set(self, key, value):\n        self.store[key] = (value, time.monotonic() + self.seconds)\n\ncache = TTLCache(seconds=60)\n\nasync def slots_for(pincode: str) -> list[str]:\n    cached = cache.get(pincode)\n    if cached is not None:\n        return cached                         # cache hit: no database work\n    await asyncio.sleep(0.2)                  # the slow query\n    slots = [\"7-9\", \"9-11\"]\n    cache.set(pincode, slots)\n    return slots\n\nasync def worker(name: str, queue: asyncio.Queue) -> None:\n    while True:\n        job = await queue.get()\n        try:\n            await asyncio.sleep(0.1)          # send email, build invoice PDF, ...\n            print(f\"{name} finished {job}\")\n        finally:\n            queue.task_done()\n\nasync def main() -> None:\n    for _ in range(2):\n        start = time.perf_counter()\n        await slots_for(\"560103\")\n        print(f\"slots in {(time.perf_counter() - start) * 1000:.0f} ms\")\n\n    queue: asyncio.Queue = asyncio.Queue()\n    workers = [asyncio.create_task(worker(f\"worker-{i}\", queue)) for i in range(2)]\n    for order_id in (184, 185, 186):\n        queue.put_nowait({\"job\": \"send_invoice\", \"order_id\": order_id})   # API returns immediately\n    await queue.join()\n    for task in workers:\n        task.cancel()\n\nasyncio.run(main())"}, {"t": "flow", "title": "Cache-aside read", "lanes": [{"name": "", "nodes": [{"n": "Request"}, {"a": ""}, {"n": "In cache?"}, {"a": "hit"}, {"n": "Return cached value"}]}, {"name": "", "nodes": [{"n": "In cache?"}, {"a": "miss"}, {"n": "Query database"}, {"a": ""}, {"n": "Store in cache with expiry"}, {"a": ""}, {"n": "Return value"}]}]}, {"t": "flow", "title": "Background job", "lanes": [{"name": "", "nodes": [{"n": "API receives order"}, {"a": ""}, {"n": "Save order"}, {"a": ""}, {"n": "Put \"send_invoice\" on queue"}, {"a": ""}, {"n": "Reply 201 at once"}]}, {"name": "", "nodes": [{"n": "Worker process"}, {"a": ""}, {"n": "Take job from queue"}, {"a": ""}, {"n": "Do the work"}, {"a": ""}, {"n": "Failed?"}, {"a": "yes"}, {"n": "Retry later with backoff, then dead-letter queue"}]}]}, {"t": "table", "title": "The production versions of this lesson", "rows": [["Need", "Common tool"], ["Shared cache, rate limits, short-lived data", "Redis"], ["Task queue with retries and schedules", "Celery, RQ, Arq or Dramatiq on Redis or RabbitMQ"], ["Event stream between services", "Kafka"], ["Scheduled jobs", "Celery beat, cron, cloud scheduler"]]}, {"t": "pitfalls", "title": "", "items": ["Caching without an expiry or without a plan to invalidate on change. Stale prices are worse than slow prices.", "Jobs that are not idempotent. A queue can deliver a job twice, so \"send invoice\" must cope with running again.", "A cache stampede: a popular key expires and 500 requests all recompute it at once. Add jitter to expiry times or lock the recompute."]}, {"t": "deep", "title": "Idempotency keys, single-flight and the outbox", "text": "Three patterns make queues and caches safe under failure.\n\nAn **idempotency key** makes \"do this once\" true even when the request or job is delivered twice. The caller sends a unique key. The first execution stores the key with its result. A repeat with the same key returns the stored result without doing the work again. The check and the store must be atomic, or two simultaneous duplicates both pass the check.\n\n**Single-flight** protects against a cache stampede. When a popular key expires, a hundred concurrent requests would all run the same expensive query. Single-flight lets the first one run it and makes the other ninety-nine wait for that same result.\n\nThe **outbox pattern** solves \"I saved the order but crashed before publishing the event\". The event is written to an `outbox` table in the same database transaction as the order. A separate process reads the table and publishes. The order and its event are saved together or not at all."}, {"t": "code", "lang": "python", "title": "", "code": "import asyncio\n\ncharges = 0\nresults: dict[str, asyncio.Future] = {}                 # production: a table with a unique key column\n\nasync def charge(idempotency_key: str, amount: int) -> str:\n    global charges\n    if idempotency_key in results:                      # seen before: return the first outcome\n        return await results[idempotency_key] + \" (replayed)\"\n    future = results[idempotency_key] = asyncio.get_running_loop().create_future()   # claimed, no await in between\n    await asyncio.sleep(0.05)                           # talk to the payment gateway\n    charges += 1\n    future.set_result(f\"charged {amount}\")\n    return future.result()\n\nclass SingleFlight:\n    def __init__(self) -> None:\n        self.in_flight: dict[str, asyncio.Task] = {}\n    async def do(self, key: str, loader):\n        task = self.in_flight.get(key)\n        if task is None:                                # first caller starts the work\n            task = self.in_flight[key] = asyncio.create_task(loader())\n            task.add_done_callback(lambda _: self.in_flight.pop(key, None))\n        return await task                               # everyone awaits the same task\n\nqueries = 0\nasync def load_slots() -> list[str]:\n    global queries\n    queries += 1\n    await asyncio.sleep(0.05)                           # the expensive query\n    return [\"7-9\", \"9-11\"]\n\nasync def main() -> None:\n    outcomes = await asyncio.gather(*(charge(\"order-184-pay\", 70900) for _ in range(3)))   # retries and duplicates\n    print(outcomes, \"| card charged\", charges, \"time(s)\")\n\n    flight = SingleFlight()\n    answers = await asyncio.gather(*(flight.do(\"slots:560103\", load_slots) for _ in range(100)))\n    print(len(answers), \"requests served by\", queries, \"database query\")\n\nasyncio.run(main())"}, {"t": "code", "lang": "sql", "title": "The outbox table", "code": "BEGIN;\nINSERT INTO orders (id, user_id, status) VALUES (184, 7, 'placed');\nINSERT INTO outbox (id, topic, payload) VALUES (gen_random_uuid(), 'order.placed', '{\"order_id\": 184}');\nCOMMIT;   -- both rows or neither\n\n-- A relay process, in a loop:\nSELECT id, topic, payload FROM outbox WHERE published_at IS NULL ORDER BY created_at LIMIT 100;\n-- publish each to the broker, then:\nUPDATE outbox SET published_at = now() WHERE id = $1;"}, {"t": "steps", "title": "A duplicated payment request", "steps": [{"c": "The app sends \"pay\" with key `order-184-pay`. The network is slow.", "cols": [["Key store", ["order-184-pay = in progress"]], ["Gateway charged", ["0 times"]], ["App sees", []]]}, {"c": "The app times out and retries with the same key while the first is still running.", "cols": [["Key store", ["order-184-pay = in progress"]], ["Gateway charged", ["0 times"]], ["App sees", ["(second request waits on the first)"]]]}, {"c": "The first request finishes. The result is stored under the key.", "cols": [["Key store", ["order-184-pay = charged 70900"]], ["Gateway charged", ["1 time"]], ["App sees", ["charged 70900"]]]}, {"c": "The retry receives the stored result. No second charge.", "cols": [["Key store", ["order-184-pay = charged 70900"]], ["Gateway charged", ["1 time"]], ["App sees", ["charged 70900 (replayed)"]]]}]}, {"t": "table", "title": "Delivery guarantees", "rows": [["Guarantee", "Meaning", "What you must do"], ["At most once", "May be lost, never repeated", "Accept loss"], ["At least once", "Never lost, may repeat", "Make handlers idempotent (the usual choice)"], ["Exactly once", "Neither lost nor repeated", "In practice: at least once plus idempotency"]]}, {"t": "quiz", "title": "", "items": [["What is cache-aside?", "The application checks the cache first. On a miss it reads the database, writes the result into the cache with an expiry and returns it."], ["Why must background jobs be idempotent?", "Queues usually guarantee at-least-once delivery. A worker may crash after doing the work but before acknowledging it, so the job runs again."], ["When do you use a queue instead of doing work in the request?", "When the work is slow, can fail and be retried, or the user does not need the result immediately: emails, notifications, reports, calls to slow third parties."], ["What are the two hard problems of caching?", "Knowing when cached data is stale (invalidation) and choosing how long to keep it (expiry)."], ["What is an idempotency key?", "A unique value the client sends with a request. The server stores it with the outcome and returns that outcome for any repeat, so retries cannot perform the action twice."], ["What is a cache stampede and how do you prevent it?", "Many requests recomputing the same expired cache entry at once. Prevent it with single-flight or a lock so one request recomputes, with jittered expiry, or by refreshing before expiry."], ["What problem does the outbox pattern solve?", "The dual-write problem: saving to the database and publishing to a broker cannot be made atomic. Writing the event to a table in the same transaction and publishing it afterwards guarantees it is never lost."], ["Why is exactly-once delivery hard?", "The sender cannot know whether a message was processed when an acknowledgement is lost, so it must resend. Systems therefore deliver at least once and rely on idempotent processing."]]}]}, {"id": "py-rt", "title": "Real-time updates: SSE and WebSockets", "level": "Advanced", "mins": "30 min", "blocks": [{"t": "plain", "title": "", "text": "Normal HTTP is one question, one answer. Real-time features keep the connection open so the server can push more data when something changes.\n\n**Server-sent events (SSE)** is a one-way stream from server to client over ordinary HTTP. It suits live order status and streamed AI answers. A **WebSocket** is a two-way channel. It suits chat and live location where the client also sends constantly."}, {"t": "bridge", "title": "", "text": "SSE is what you consume when a chat app shows an AI answer word by word, and it is an `AsyncSequence` / Dart `Stream` on the client. On the server it is an async generator, the same `yield` you met earlier."}, {"t": "code", "lang": "python", "title": "", "code": "import asyncio, json\nfrom fastapi import FastAPI\nfrom fastapi.responses import StreamingResponse\nfrom fastapi.testclient import TestClient\n\napp = FastAPI()\nSTAGES = [\"placed\", \"packed\", \"out_for_delivery\", \"delivered\"]\n\nasync def order_events(order_id: int):\n    for stage in STAGES:                      # production: await messages from Redis pub/sub\n        payload = json.dumps({\"order_id\": order_id, \"status\": stage})\n        yield f\"event: status\\ndata: {payload}\\n\\n\"      # the SSE wire format\n        await asyncio.sleep(0.05)\n\n@app.get(\"/orders/{order_id}/events\")\nasync def events(order_id: int) -> StreamingResponse:\n    return StreamingResponse(order_events(order_id), media_type=\"text/event-stream\")\n\nwith TestClient(app).stream(\"GET\", \"/orders/184/events\") as response:\n    for line in response.iter_lines():\n        if line.startswith(\"data:\"):\n            print(\"phone received:\", json.loads(line[5:]))"}, {"t": "code", "lang": "python", "title": "WebSocket version", "code": "from fastapi import FastAPI, WebSocket, WebSocketDisconnect\n\napp = FastAPI()\nriders: dict[int, set[WebSocket]] = {}\n\n@app.websocket(\"/ws/orders/{order_id}\")\nasync def track(websocket: WebSocket, order_id: int) -> None:\n    await websocket.accept()\n    riders.setdefault(order_id, set()).add(websocket)\n    try:\n        while True:\n            location = await websocket.receive_json()          # rider app sends lat/lon\n            for peer in riders[order_id]:\n                await peer.send_json({\"order_id\": order_id, **location})\n    except WebSocketDisconnect:\n        riders[order_id].discard(websocket)"}, {"t": "flow", "title": "Live order tracking", "lanes": [{"name": "", "nodes": [{"n": "Warehouse marks \"packed\""}, {"a": ""}, {"n": "Order service saves status"}, {"a": ""}, {"n": "Publishes event to Redis"}, {"a": ""}, {"n": "*API instance holding the phone's SSE connection"}, {"a": ""}, {"n": "Pushes event"}, {"a": ""}, {"n": "Phone updates the tracking screen"}]}]}, {"t": "table", "title": "Which one", "rows": [["Question", "SSE", "WebSocket"], ["Direction", "Server to client", "Both ways"], ["Runs over", "Plain HTTP", "Upgraded connection"], ["Reconnect", "Automatic in browsers, simple on mobile", "You write it"], ["Good for", "Status updates, AI token streams", "Chat, live location, games"]]}, {"t": "pitfalls", "title": "", "items": ["Keeping connection state only in one server's memory. With several instances the event may arrive at a different instance than the one holding the connection. Use Redis pub/sub or similar between them.", "No heartbeat. Proxies close idle connections after about a minute. Send a comment line or ping regularly.", "Forgetting the phone goes offline. On reconnect, send the current state first, then live updates."]}, {"t": "quiz", "title": "", "items": [["SSE versus WebSocket versus polling?", "Polling asks repeatedly and wastes requests. SSE keeps one HTTP response open for server-to-client events. WebSocket is a two-way channel for when the client also sends frequently."], ["How do you scale real-time connections across many servers?", "Each server holds its own connections, and a shared pub/sub system (Redis, Kafka) delivers each event to every server so the one holding the right connection can push it."], ["Why does async matter here?", "Each open connection is mostly idle. An event loop can hold tens of thousands of idle connections in one process, which threads cannot do cheaply."]]}]}, {"id": "py-deploy", "title": "Deploying and running in production", "level": "Expert", "mins": "35 min", "blocks": [{"t": "plain", "title": "", "text": "Deploying means packaging your code with its exact dependencies and running it somewhere reliable. The package is a **Docker image**. Inside it, a server program (`uvicorn`, often several worker processes) runs your app. A load balancer in front spreads requests over several copies.\n\nRunning in production means you can answer three questions at any moment: is it up, is it fast and what went wrong. Those are health checks, metrics and logs."}, {"t": "bridge", "title": "", "text": "The Docker image is your `.ipa` / app bundle: one artefact, built once by CI, promoted through environments. A rolling deploy is a phased release. Environment variables per environment are your schemes and flavours."}, {"t": "code", "lang": "text", "title": "Dockerfile", "code": "FROM python:3.12-slim\nWORKDIR /app\nCOPY requirements.txt .\nRUN pip install --no-cache-dir -r requirements.txt\nCOPY app ./app\nENV PYTHONUNBUFFERED=1\nEXPOSE 8000\nCMD [\"uvicorn\", \"app.main:app\", \"--host\", \"0.0.0.0\", \"--port\", \"8000\", \"--workers\", \"4\"]"}, {"t": "code", "lang": "bash", "title": "", "code": "docker build -t shop-api:1.4.0 .\ndocker run -p 8000:8000 -e DATABASE_URL=postgresql://... shop-api:1.4.0\ncurl http://localhost:8000/health"}, {"t": "flow", "title": "From commit to traffic", "lanes": [{"name": "", "nodes": [{"n": "git push"}, {"a": ""}, {"n": "CI: lint, type check, tests"}, {"a": ""}, {"n": "Build Docker image"}, {"a": ""}, {"n": "Push to registry"}, {"a": ""}, {"n": "Deploy to staging"}, {"a": ""}, {"n": "Smoke test"}, {"a": ""}, {"n": "Rolling deploy to production"}, {"a": ""}, {"n": "Watch error rate and latency"}]}]}, {"t": "flow", "title": "One request in production", "lanes": [{"name": "", "nodes": [{"n": "Phone"}, {"a": ""}, {"n": "CDN / WAF"}, {"a": ""}, {"n": "Load balancer"}, {"a": ""}, {"n": "Container 1..N (uvicorn workers)"}, {"a": ""}, {"n": "Connection pool"}, {"a": ""}, {"n": "PostgreSQL primary + Redis"}]}]}, {"t": "table", "title": "What to watch", "rows": [["Signal", "Example", "Alert when"], ["Traffic", "Requests per second per route", "Sudden drop or spike"], ["Errors", "Share of 5xx responses", "Above about 1%"], ["Latency", "p50, p95, p99 response time", "p95 above your target"], ["Saturation", "CPU, memory, DB connections in use", "Near the limit"]]}, {"t": "real", "title": "", "text": "A deploy at 6 pm doubles p95 latency on `GET /slots`. Because every request log line carries a request id, route and duration, you find the slow route in a minute, see a new query without an index, roll back the image to the previous tag and fix forward the next morning. Without those logs the same incident takes hours."}, {"t": "pitfalls", "title": "", "items": ["More workers than the database can serve. Workers times pool size must stay under the database connection limit.", "No health endpoint, so the platform sends traffic to an instance that is still starting or already broken.", "Running database migrations that lock a big table during peak traffic.", "Baking secrets into the image."]}, {"t": "deep", "title": "Percentiles, structured logs and a local production-like stack", "text": "Averages hide pain. If nine requests in ten take 50 ms and the tenth takes two seconds, the average is about 250 ms and looks acceptable, while one user in ten waits two seconds. **Percentiles** describe what users feel: p50 is the typical request, p95 and p99 are the slow tail. Set targets and alerts on p95 or p99.\n\n**Structured logs** are one JSON object per line with fixed field names. A machine can then filter by `order_id` or `request_id` across millions of lines. Free-text logs cannot be searched reliably.\n\n**Docker Compose** starts your API, PostgreSQL and Redis together on your laptop with one command, wired the way they are in production. It is the fastest way to reproduce a production problem locally."}, {"t": "code", "lang": "python", "title": "", "code": "import json, logging, statistics, sys\n\nlatencies_ms = [48, 52, 50, 47, 55, 51, 49, 53, 50, 46] * 18 + [900, 1200, 1500, 2100, 2400, 2800, 3000, 3100, 3300, 3500] * 2   # 10% slow\n\ndef percentile(values: list[float], p: float) -> float:\n    ordered = sorted(values)\n    index = min(len(ordered) - 1, round(p / 100 * (len(ordered) - 1)))\n    return ordered[index]\n\nprint(f\"requests {len(latencies_ms)} | mean {statistics.mean(latencies_ms):.0f} ms | \"\n      f\"p50 {percentile(latencies_ms, 50)} | p95 {percentile(latencies_ms, 95)} | p99 {percentile(latencies_ms, 99)} ms\")\n\nclass JsonFormatter(logging.Formatter):\n    def format(self, record: logging.LogRecord) -> str:\n        entry = {\"level\": record.levelname, \"event\": record.getMessage(), \"logger\": record.name}\n        entry.update(getattr(record, \"fields\", {}))\n        if record.exc_info:\n            entry[\"error\"] = repr(record.exc_info[1])\n        return json.dumps(entry)\n\nhandler = logging.StreamHandler(sys.stdout)\nhandler.setFormatter(JsonFormatter())\nlog = logging.getLogger(\"shop.orders\")\nlog.addHandler(handler)\nlog.setLevel(logging.INFO)\n\nlog.info(\"order.placed\", extra={\"fields\": {\"request_id\": \"a1b2c3\", \"order_id\": 184, \"user_id\": 7, \"duration_ms\": 82}})\ntry:\n    1 / 0\nexcept ZeroDivisionError:\n    log.error(\"order.price_failed\", exc_info=True, extra={\"fields\": {\"request_id\": \"a1b2c3\", \"order_id\": 184}})\n\nerror_budget = 1 - 0.999                                   # a 99.9% availability target\nprint(f\"99.9% per 30 days allows {error_budget * 30 * 24 * 60:.0f} minutes of downtime\")", "web": 1}, {"t": "code", "lang": "text", "title": "docker-compose.yml", "code": "services:\n  api:\n    build: .\n    ports: [\"8000:8000\"]\n    environment:\n      DATABASE_URL: postgresql+psycopg://shop:shop@db:5432/shop\n      REDIS_URL: redis://cache:6379/0\n    depends_on:\n      db: { condition: service_healthy }\n      cache: { condition: service_started }\n  worker:\n    build: .\n    command: [\"python\", \"-m\", \"app.worker\"]\n    environment:\n      DATABASE_URL: postgresql+psycopg://shop:shop@db:5432/shop\n      REDIS_URL: redis://cache:6379/0\n    depends_on: [db, cache]\n  db:\n    image: postgres:17\n    environment: { POSTGRES_USER: shop, POSTGRES_PASSWORD: shop, POSTGRES_DB: shop }\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U shop\"]\n      interval: 2s\n      retries: 15\n  cache:\n    image: redis:7"}, {"t": "flow", "title": "From alert to fix", "lanes": [{"name": "", "nodes": [{"n": "Alert: p95 above target"}, {"a": ""}, {"n": "Dashboard: which route, since when"}, {"a": ""}, {"n": "Recent deploy?"}, {"a": "yes"}, {"n": "Roll back first, investigate after"}]}, {"name": "", "nodes": [{"n": "Recent deploy?"}, {"a": "no"}, {"n": "Logs filtered by route and slow duration"}, {"a": ""}, {"n": "Trace of one slow request_id"}, {"a": ""}, {"n": "Query, dependency or CPU"}, {"a": ""}, {"n": "Fix"}, {"a": ""}, {"n": "Add a test and an alert"}]}]}, {"t": "table", "title": "Availability targets in plain numbers", "rows": [["Target", "Downtime allowed per 30 days"], ["99%", "About 7 hours"], ["99.9%", "About 43 minutes"], ["99.99%", "About 4 minutes"]]}, {"t": "quiz", "title": "", "items": [["What is the difference between uvicorn and gunicorn?", "Uvicorn is an ASGI server that runs async apps. Gunicorn is a process manager. A common setup runs several uvicorn workers, either with `uvicorn --workers` or managed by gunicorn."], ["How many workers should you run?", "Roughly one per CPU core for async apps, then measure. Each worker is a separate process with its own memory and its own database connections."], ["What is a rolling deployment?", "New instances are started and checked before old ones are removed, a few at a time, so there is no downtime and a bad release can be stopped early."], ["What does p95 latency mean?", "95% of requests were faster than this value. It shows what slow requests feel like, which averages hide."], ["Liveness versus readiness check?", "Liveness asks \"is the process alive, or should it be restarted\". Readiness asks \"can it take traffic right now\", which is false during startup or when a dependency is down."], ["Why use percentiles instead of the average?", "A small share of very slow requests barely moves the average but is exactly what users complain about. p95 and p99 expose that tail."], ["What is structured logging?", "Emitting logs as machine-readable records with consistent fields, usually JSON, so they can be filtered and aggregated by request id, user or route."], ["What are an SLI, SLO and error budget?", "An SLI is a measured indicator such as the share of successful requests. An SLO is its target, such as 99.9%. The error budget is the allowed failure, 0.1%, which a team can spend on risk such as deploys."], ["What is Docker Compose used for?", "Defining and running several containers together, typically the app with its database and cache, for local development and integration tests."], ["What do you do first when a deploy makes things worse?", "Roll back to the previous version to restore service, then investigate with the evidence you collected."]]}]}]}, {"name": "Stage 6 · AI", "sub": "Putting a model behind your API", "lessons": [{"id": "py-np", "title": "NumPy and pandas in one sitting", "level": "Intermediate", "mins": "30 min", "blocks": [{"t": "plain", "title": "", "text": "**NumPy** gives you arrays of numbers and maths on whole arrays at once, running in fast C code. Every AI library is built on this idea. **pandas** gives you a table (a `DataFrame`) with named columns, for loading, filtering and summarising data.\n\nYou do not need to master either to build AI features on an API. You need to read them, because vectors, embeddings and evaluation results all arrive as arrays and tables."}, {"t": "bridge", "title": "", "text": "A NumPy array is `[Double]` with SIMD-style maths built in: `a * b` multiplies element by element with no loop in your code. A DataFrame is a spreadsheet you query with code, or a SQL table in memory."}, {"t": "code", "lang": "python", "title": "", "code": "import numpy as np\nimport pandas as pd\n\nprices = np.array([62, 45, 540, 189])\nqty = np.array([2, 1, 1, 3])\nprint((prices * qty).sum(), prices[prices > 100], prices.mean())    # no loops\n\na = np.array([1.0, 2.0, 2.0])\nb = np.array([2.0, 4.0, 4.1])\ncosine = a @ b / (np.linalg.norm(a) * np.linalg.norm(b))            # how similar two vectors point\nprint(\"similarity\", round(float(cosine), 4))\n\norders = pd.DataFrame({\n    \"city\": [\"blr\", \"del\", \"blr\", \"mum\", \"blr\"],\n    \"total\": [320, 90, 760, 410, 150],\n    \"status\": [\"delivered\", \"cancelled\", \"delivered\", \"delivered\", \"delivered\"],\n})\ndelivered = orders[orders[\"status\"] == \"delivered\"]\nprint(delivered.groupby(\"city\")[\"total\"].agg([\"count\", \"sum\", \"mean\"]))\nprint(orders[\"status\"].value_counts(normalize=True).round(2).to_dict())"}, {"t": "flow", "title": "Why vectors matter for AI", "lanes": [{"name": "", "nodes": [{"n": "Text \"paneer butter masala\""}, {"a": ""}, {"n": "Embedding model"}, {"a": ""}, {"n": "Vector of about 1,000 numbers"}, {"a": ""}, {"n": "Compare with other vectors by cosine similarity"}, {"a": ""}, {"n": "\"Close\" vectors mean similar meaning"}]}]}, {"t": "real", "title": "", "text": "\"Which city cancels most, and is it getting worse week by week\" is five lines of pandas over an export from the orders table. Analysts and ML engineers live in this tool, so reading it lets you work with them."}, {"t": "pitfalls", "title": "", "items": ["Looping over a NumPy array or DataFrame row by row in Python. Use whole-column operations, which are often 100 times faster.", "Loading a 20 GB table into pandas on a server. Aggregate in SQL first."]}, {"t": "quiz", "title": "", "items": [["Why is NumPy faster than a Python list for maths?", "Values are stored in one contiguous block of a single type, and operations run as compiled loops over that block instead of interpreting Python per element."], ["What is cosine similarity?", "The cosine of the angle between two vectors: their dot product divided by the product of their lengths. 1 means the same direction, 0 means unrelated."], ["What is vectorisation?", "Expressing an operation on whole arrays so the loop happens inside optimised native code."]]}]}, {"id": "py-llm", "title": "Calling a language model", "level": "Intermediate", "mins": "35 min", "blocks": [{"t": "plain", "title": "", "text": "A large language model takes text in and produces text out, one small piece (**token**) at a time. Your code sends a list of **messages** and gets a message back. The model has no memory between calls: every request must contain everything it should know, including earlier turns of the conversation.\n\nYou pay per token, both in and out, and each model has a maximum amount of text it can consider at once, called the **context window**."}, {"t": "analogy", "title": "", "text": "A brilliant temp who has read everything but started work this minute and knows nothing about your company. The prompt is the briefing note you hand over. A vague note gets a vague result."}, {"t": "bridge", "title": "", "text": "From your side it is one more HTTP API: you already call REST endpoints from Dio. The differences are that the response is slow (seconds), costs money per call, is not identical each time and can decline. So you treat it like an unreliable but valuable third-party service."}, {"t": "code", "lang": "bash", "title": "", "code": "pip install anthropic\nexport ANTHROPIC_API_KEY=\"...\"      # from the console; never commit it"}, {"t": "code", "lang": "python", "title": "", "code": "import anthropic\n\nclient = anthropic.Anthropic()      # reads ANTHROPIC_API_KEY from the environment\n\ntry:\n    response = client.beta.messages.create(\n        model=\"claude-opus-5-5\",\n        max_tokens=16000,\n        betas=[\"server-side-fallback-2026-07-01\"],\n        fallbacks=\"default\",        # if the request is declined, retry on a fallback model\n        system=\"You are a grocery assistant. Answer in two short sentences.\",\n        messages=[{\"role\": \"user\", \"content\": \"I have paneer, capsicum and onions. What can I cook?\"}],\n    )\nexcept anthropic.RateLimitError:\n    print(\"Too many requests. The SDK already retried; back off and try later.\")\nexcept anthropic.APIStatusError as err:\n    print(\"The API returned an error:\", err.status_code)\nexcept anthropic.APIConnectionError:\n    print(\"Could not reach the API.\")\nelse:\n    if response.stop_reason == \"refusal\":\n        print(\"The model declined this request.\")\n    for block in response.content:           # content is a list of blocks\n        if block.type == \"text\":\n            print(block.text)\n    print(\"tokens in/out:\", response.usage.input_tokens, response.usage.output_tokens)"}, {"t": "steps", "title": "A conversation is a growing list you resend", "steps": [{"c": "Turn 1. You send the system prompt and one user message.", "cols": [["Sent in this request", ["system", "user: what can I cook?"]], ["Model returns", ["assistant: Paneer capsicum stir fry..."]]]}, {"c": "Turn 2. The model remembers nothing, so you send the whole history plus the new question.", "cols": [["Sent in this request", ["system", "user: what can I cook?", "assistant: Paneer capsicum...", "user: make it less spicy"]], ["Model returns", ["assistant: Skip the green chilli..."]]]}, {"c": "Turn 3. The list keeps growing, and so do input tokens and cost. Long chats need trimming or summarising.", "cols": [["Sent in this request", ["system", "user", "assistant", "user", "assistant", "user: add a shopping list"]], ["Model returns", ["assistant: You need..."]]]}]}, {"t": "flow", "title": "One model call from your API", "lanes": [{"name": "", "nodes": [{"n": "Phone"}, {"a": ""}, {"n": "Your FastAPI endpoint"}, {"a": ""}, {"n": "Build messages (system + history + user)"}, {"a": ""}, {"n": "Model API"}, {"a": ""}, {"n": "Check stop_reason"}, {"a": ""}, {"n": "Save turn"}, {"a": ""}, {"n": "Reply to phone"}]}]}, {"t": "table", "title": "Parts of a request", "rows": [["Field", "What it is"], ["`model`", "Which model answers. Larger models are smarter, slower and cost more"], ["`system`", "Standing instructions: role, tone, rules, format"], ["`messages`", "The conversation so far, alternating user and assistant"], ["`max_tokens`", "Hard ceiling on the length of the answer"], ["`usage` (response)", "Tokens you were billed for"], ["`stop_reason` (response)", "Why it stopped: finished, hit the limit, wants a tool, or declined"]]}, {"t": "pitfalls", "title": "", "items": ["Calling the model from the phone with the API key inside the app. Keys in a mobile binary can be extracted. Always go through your backend.", "Assuming the answer is correct. Models state wrong things confidently. Ground them with your own data (RAG) and check outputs.", "Not reading `stop_reason`. An answer cut off at `max_tokens` looks like a normal answer.", "Putting untrusted text (reviews, web pages) into the prompt and trusting what comes back. That text can contain instructions (prompt injection)."]}, {"t": "deep", "title": "Writing prompts, managing context and caching", "text": "A prompt is a specification. The model does what the text says, so quality comes from being specific. A reliable structure is: who the model is acting as, the task, the context it needs, the rules, and the exact output wanted. Put long documents first and the question last. Show one or two examples of the output you want.\n\nThe context window is a budget. A long chat eventually exceeds it and gets expensive well before that. Common tactics are to keep the system prompt and the most recent turns, and replace older turns with a summary.\n\nMany requests share a long, identical beginning: the system prompt, tool definitions, a policy document. **Prompt caching** lets the provider reuse its work on that prefix, so repeated requests are cheaper and faster. Caching matches on an exact prefix, so keep the stable part first and anything that changes (the user's question, the time) last."}, {"t": "code", "lang": "python", "title": "", "code": "SYSTEM = \"\"\"You are the support assistant for a grocery delivery app.\n\nRules:\n- Answer only from the policy text and tool results you are given.\n- If the answer is not there, say you do not know and offer a human agent.\n- Never state an order status without calling the order tool.\n- Reply in at most three short sentences, in the user's language.\n\nOutput: plain text, no markdown.\"\"\"\n\ndef estimate_tokens(text: str) -> int:\n    return max(1, len(text) // 4)             # rough rule: about 4 characters per token in English\n\ndef trim_history(history: list[dict], budget_tokens: int) -> list[dict]:\n    \"\"\"Keep the newest turns that fit. Older turns become one summary line.\"\"\"\n    kept, used = [], 0\n    for message in reversed(history):\n        cost = estimate_tokens(message[\"content\"])\n        if used + cost > budget_tokens:\n            break\n        kept.append(message)\n        used += cost\n    kept.reverse()\n    dropped = len(history) - len(kept)\n    if dropped:\n        if kept and kept[0][\"role\"] == \"assistant\":       # a conversation must start with the user\n            kept, dropped = kept[1:], dropped + 1\n        summary = {\"role\": \"user\", \"content\": f\"(Summary of {dropped} earlier messages: user asked about a late order and a refund.)\"}\n        ack = {\"role\": \"assistant\", \"content\": \"Understood.\"}\n        kept = [summary, ack] + kept\n    return kept\n\nhistory = []\nfor turn in range(1, 9):\n    history.append({\"role\": \"user\", \"content\": f\"Question {turn}: \" + \"details \" * 30})\n    history.append({\"role\": \"assistant\", \"content\": f\"Answer {turn}: \" + \"explanation \" * 30})\nhistory.append({\"role\": \"user\", \"content\": \"So when will order 184 arrive?\"})\n\ntrimmed = trim_history(history, budget_tokens=400)\nprint(len(history), \"messages ->\", len(trimmed), \"| roles:\", [m[\"role\"][0] for m in trimmed])\nprint(\"system prompt tokens (estimate):\", estimate_tokens(SYSTEM))", "web": 1}, {"t": "code", "lang": "python", "title": "Prompt caching on a stable prefix", "code": "import anthropic\n\nclient = anthropic.Anthropic()\nPOLICY = open(\"refund_policy.md\").read()          # long and identical on every request\n\nresponse = client.messages.create(\n    model=\"claude-opus-5-5\",\n    max_tokens=16000,\n    cache_control={\"type\": \"ephemeral\"},          # cache the stable prefix automatically\n    system=f\"You answer from this policy only.\\n\\n{POLICY}\",\n    messages=[{\"role\": \"user\", \"content\": \"Can I return opened milk?\"}],   # the part that changes goes last\n)\nprint(response.usage.cache_creation_input_tokens, response.usage.cache_read_input_tokens)\n# First call: tokens are written to the cache. Later calls: read from it at a lower price."}, {"t": "flow", "title": "Anatomy of a good prompt", "lanes": [{"name": "", "nodes": [{"n": "Role"}, {"a": ""}, {"n": "Task"}, {"a": ""}, {"n": "Context and documents"}, {"a": ""}, {"n": "Rules and limits"}, {"a": ""}, {"n": "Examples of good output"}, {"a": ""}, {"n": "Output format"}, {"a": ""}, {"n": "The user's question last"}]}]}, {"t": "table", "title": "Fixing a weak prompt", "rows": [["Weak", "Better", "Why"], ["\"Summarise this.\"", "\"Summarise for a delivery partner in 3 bullet points: what to deliver, where, by when.\"", "Audience, length and content are stated"], ["\"Be accurate.\"", "\"Answer only from the sources. If they do not cover it, say so.\"", "A checkable rule instead of a wish"], ["\"Return JSON.\"", "A schema with structured output", "Shape is enforced, not hoped for"], ["\"Don't be wordy.\"", "\"At most three short sentences.\"", "A positive, measurable instruction"]]}, {"t": "quiz", "title": "", "items": [["What is a token?", "A piece of text the model reads and writes, roughly three quarters of an English word. Limits and prices are counted in tokens."], ["Why must you resend the conversation each time?", "The API is stateless. The model only knows what is in the current request."], ["What is a system prompt?", "Instructions that set the model's role and rules for the whole conversation, separate from the user's messages."], ["Why should model calls go through your backend?", "To keep the API key secret, to add your own data and rules, to rate-limit and log, and to swap models without an app release."], ["What is a context window?", "The maximum amount of text, in tokens, the model can take into account in one request: prompt, history, documents and its own answer."], ["What makes a good prompt?", "It states the role, the task, the needed context, explicit rules and the exact output format, gives an example, and tells the model what to do when it lacks information."], ["How do you handle conversations longer than the context window?", "Keep the system prompt and the most recent turns, summarise or drop older ones, and retrieve past details on demand instead of resending everything."], ["What is prompt caching and when does it help?", "The provider stores its processing of a repeated prompt prefix and reuses it on later requests at a lower price and latency. It helps when many requests share a long, identical beginning."], ["Why must cached content come first in the request?", "Caching matches on an exact prefix. Any change early in the prompt, such as a timestamp, invalidates everything after it."], ["What do temperature and similar sampling settings do?", "They control how random the choice of each next token is. Lower means more predictable output. Some current models fix these settings, in which case you steer with instructions instead."]]}]}, {"id": "py-out", "title": "Structured output: text in, typed data out", "level": "Advanced", "mins": "25 min", "blocks": [{"t": "plain", "title": "", "text": "An app cannot use a paragraph. It needs fields. **Structured output** makes the model fill in a schema you define, so you get an object you can validate and store instead of free text you have to parse with guesswork.\n\nYou describe the shape with a Pydantic model, the same tool you used for request bodies."}, {"t": "bridge", "title": "", "text": "It is `Codable` for model answers: you declare the struct and get a decoded instance or an error, instead of scraping strings with regular expressions."}, {"t": "code", "lang": "python", "title": "", "code": "import anthropic\nfrom pydantic import BaseModel\n\nclass CartLine(BaseModel):\n    product: str\n    quantity: float\n    unit: str\n\nclass ParsedList(BaseModel):\n    lines: list[CartLine]\n    unclear: list[str]\n\nclient = anthropic.Anthropic()\nnote = \"2 kg aloo, half litre milk, dhaniya, 6 eggs and that biscuit we had last time\"\n\nresponse = client.messages.parse(\n    model=\"claude-opus-5-5\",\n    max_tokens=16000,\n    system=\"Turn a shopping note into cart lines. Put anything you cannot identify in `unclear`.\",\n    messages=[{\"role\": \"user\", \"content\": note}],\n    output_format=ParsedList,\n)\nparsed = response.parsed_output          # a validated ParsedList instance\nfor line in parsed.lines:\n    print(line.quantity, line.unit, line.product)\nprint(\"ask the user about:\", parsed.unclear)"}, {"t": "flow", "title": "From a voice note to a cart", "lanes": [{"name": "", "nodes": [{"n": "User says or types a list"}, {"a": ""}, {"n": "Model fills the schema"}, {"a": ""}, {"n": "Pydantic validates"}, {"a": ""}, {"n": "Match each product against the catalogue (your code)"}, {"a": ""}, {"n": "Show cart for confirmation"}, {"a": ""}, {"n": "User edits and confirms"}]}]}, {"t": "real", "title": "", "text": "\"Add my usual Sunday list\" becomes cart lines. The model does the language part: \"aloo\" is potato, \"half litre\" is 0.5 l. Your code does the facts: which exact product, the current price, whether it is in stock. The user confirms before anything is ordered. Language to the model, facts and money to your code."}, {"t": "pitfalls", "title": "", "items": ["Asking for \"JSON\" in the prompt and parsing whatever comes back. Use the schema feature so the shape is guaranteed.", "Letting the model invent product ids or prices. It should extract and classify. Lookups come from your database.", "No escape hatch in the schema. Give it an `unclear` or `none` option, or it will guess."]}, {"t": "quiz", "title": "", "items": [["Why use structured output instead of asking for JSON in the prompt?", "The schema is enforced and validated, so you do not get missing fields, extra prose or broken JSON."], ["What should the model decide and what should your code decide?", "The model handles language: understanding, extracting, classifying. Your code handles facts and actions: ids, prices, stock, permissions and anything involving money."]]}]}, {"id": "py-stream", "title": "Streaming answers to the phone", "level": "Advanced", "mins": "30 min", "blocks": [{"t": "plain", "title": "", "text": "A long answer can take ten seconds or more. Waiting for all of it feels broken. **Streaming** sends each piece of text as soon as the model produces it, so the first words appear in under a second.\n\nYour server sits in the middle: it reads the model's stream and forwards each piece to the phone over server-sent events. This is the async generator and SSE from earlier lessons joined together."}, {"t": "bridge", "title": "", "text": "On the client you already consume this as `URLSession.bytes(for:)` or a Dart `Stream` from Dio with `ResponseType.stream`. The server side is the producer of that stream."}, {"t": "code", "lang": "python", "title": "", "code": "import json\nfrom anthropic import AsyncAnthropic\nfrom fastapi import FastAPI\nfrom fastapi.responses import StreamingResponse\nfrom pydantic import BaseModel\n\napp = FastAPI()\nclient = AsyncAnthropic()\n\nclass Ask(BaseModel):\n    question: str\n\nasync def answer_events(question: str):\n    async with client.messages.stream(\n        model=\"claude-opus-5-5\",\n        max_tokens=64000,\n        system=\"You are a cooking assistant for a grocery app.\",\n        messages=[{\"role\": \"user\", \"content\": question}],\n    ) as stream:\n        async for text in stream.text_stream:                 # one small piece at a time\n            yield f\"data: {json.dumps({'text': text})}\\n\\n\"\n        final = await stream.get_final_message()\n    done = {\"output_tokens\": final.usage.output_tokens, \"stop_reason\": final.stop_reason}\n    yield f\"event: done\\ndata: {json.dumps(done)}\\n\\n\"\n\n@app.post(\"/assistant\")\nasync def assistant(body: Ask) -> StreamingResponse:\n    return StreamingResponse(answer_events(body.question), media_type=\"text/event-stream\")"}, {"t": "steps", "title": "Tokens travelling through three machines", "steps": [{"c": "The phone posts the question and keeps the response open.", "cols": [["Model", []], ["Your server", ["waiting"]], ["Phone screen", []]]}, {"c": "The model produces its first piece. Your server forwards it at once.", "cols": [["Model", ["\"Heat\""]], ["Your server", ["forwards \"Heat\""]], ["Phone screen", ["Heat"]]]}, {"c": "More pieces follow, each forwarded as it arrives. Your server holds almost nothing in memory.", "cols": [["Model", ["\" oil in a pan\""]], ["Your server", ["forwards \" oil in a pan\""]], ["Phone screen", ["Heat oil in a pan"]]]}, {"c": "The model finishes. Your server sends a final `done` event with token counts, then closes.", "cols": [["Model", ["(finished)"]], ["Your server", ["sends done event", "logs usage"]], ["Phone screen", ["Heat oil in a pan... (complete)"]]]}]}, {"t": "flow", "title": "Where time goes", "lanes": [{"name": "", "nodes": [{"n": "Request"}, {"a": ""}, {"n": "Time to first token (the wait users notice)"}, {"a": ""}, {"n": "Tokens per second (the reading speed)"}, {"a": ""}, {"n": "Done event"}]}]}, {"t": "pitfalls", "title": "", "items": ["Buffering somewhere in the chain (a proxy, gzip, a framework default) so the user gets everything at the end anyway. Test with a real device on a real network.", "Using the sync client inside an async endpoint. It blocks the event loop for the whole answer.", "Not handling the user closing the screen. Stop reading from the model when the client disconnects, or you pay for an answer nobody sees.", "Saving nothing. Log the final text and usage when the stream ends."]}, {"t": "quiz", "title": "", "items": [["Why stream model output?", "Perceived speed. Total time is the same, but the user sees the first words almost immediately and can start reading or cancel."], ["What is time to first token?", "The delay between sending the request and receiving the first piece of the answer. It is the main latency number for chat-style features."], ["Why is async a good fit for streaming endpoints?", "Each request is a long-lived, mostly idle connection. One event loop can serve many of them without a thread per user."]]}]}, {"id": "py-tools", "title": "Tools and the agent loop", "level": "Advanced", "mins": "40 min", "blocks": [{"t": "plain", "title": "", "text": "A model on its own can only write text. **Tools** let it act. You describe functions it may call (name, purpose, parameters). When the model decides it needs one, it replies with a tool request instead of an answer. Your code runs the function and sends the result back. The model then continues, possibly asking for another tool.\n\nThat repeat-until-done cycle is the **agent loop**. An agent is a model, a set of tools and this loop."}, {"t": "analogy", "title": "", "text": "A manager on the phone who cannot touch the computer. They tell you \"look up order 184\". You look it up and read out the result. They decide what to ask next. You are the hands, they are the planner."}, {"t": "bridge", "title": "", "text": "It is a delegate or callback pattern across a network: the model calls back into your code with a function name and JSON arguments, and you return a result."}, {"t": "code", "lang": "python", "title": "", "code": "import anthropic\nfrom anthropic import beta_tool\n\nclient = anthropic.Anthropic()\nORDERS = {184: {\"status\": \"out_for_delivery\", \"eta_minutes\": 12}, 185: {\"status\": \"delivered\"}}\n\n@beta_tool\ndef get_order_status(order_id: int) -> str:\n    \"\"\"Look up the delivery status of one order.\n\n    Args:\n        order_id: The numeric order id, for example 184.\n    \"\"\"\n    return str(ORDERS.get(order_id, \"no such order\"))\n\n@beta_tool\ndef create_refund_request(order_id: int, reason: str) -> str:\n    \"\"\"Open a refund request for a delivered order. A human agent approves it later.\n\n    Args:\n        order_id: The numeric order id.\n        reason: Short reason given by the customer.\n    \"\"\"\n    return f\"refund request opened for order {order_id}\"\n\nrunner = client.beta.messages.tool_runner(      # the SDK runs the loop for you\n    model=\"claude-opus-5-5\",\n    max_tokens=16000,\n    system=\"You are a support assistant. Use tools for facts. Never guess an order status.\",\n    tools=[get_order_status, create_refund_request],\n    messages=[{\"role\": \"user\", \"content\": \"Where is order 184? Also 185 arrived with a broken egg tray.\"}],\n)\nfinal = runner.until_done()\nfor block in final.content:\n    if block.type == \"text\":\n        print(block.text)"}, {"t": "steps", "title": "The loop, turn by turn", "steps": [{"c": "Your code sends the user's message and the tool descriptions.", "cols": [["Model says", []], ["Your code runs", []], ["Conversation holds", ["user message"]]]}, {"c": "The model answers with tool requests instead of text. `stop_reason` is `tool_use`.
