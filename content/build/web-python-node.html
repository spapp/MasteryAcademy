", "cols": [["Model says", ["call get_order_status(184)", "call get_order_status(185)"]], ["Your code runs", []], ["Conversation holds", ["user message", "assistant tool requests"]]]}, {"c": "Your code runs both functions and appends the results.", "cols": [["Model says", []], ["Your code runs", ["get_order_status(184)", "get_order_status(185)"]], ["Conversation holds", ["user message", "assistant tool requests", "tool results"]]]}, {"c": "The model reads the results and asks for one more tool.", "cols": [["Model says", ["call create_refund_request(185", "broken egg tray)"]], ["Your code runs", []], ["Conversation holds", ["...", "tool results", "assistant tool request"]]]}, {"c": "Your code runs it and returns the result.", "cols": [["Model says", []], ["Your code runs", ["create_refund_request(185", "...)"]], ["Conversation holds", ["...", "tool result"]]]}, {"c": "No more tools needed. The model writes the final answer and the loop ends.", "cols": [["Model says", ["Order 184 arrives in 12 minutes. I opened a refund request for 185."]], ["Your code runs", []], ["Conversation holds", ["...", "final answer"]]]}]}, {"t": "flow", "title": "The agent loop", "lanes": [{"name": "", "nodes": [{"n": "Send messages + tools"}, {"a": ""}, {"n": "stop_reason is tool_use?"}, {"a": "yes"}, {"n": "Run the requested functions"}, {"a": ""}, {"n": "Append results"}, {"a": ""}, {"n": "Send again"}]}, {"name": "", "nodes": [{"n": "stop_reason is tool_use?"}, {"a": "no"}, {"n": "Final answer"}]}]}, {"t": "real", "title": "", "text": "Your tool functions are the security boundary. `create_refund_request` must check, in your code, that the order belongs to the logged-in user and is refundable. The model may ask for anything, including things a malicious message told it to ask for. It can only do what your functions allow."}, {"t": "pitfalls", "title": "", "items": ["Giving a tool more power than the user has. Check permissions inside every tool with the real user's identity.", "Tools that do irreversible things with no confirmation step (payments, cancellations).", "Vague tool descriptions. The description is the only documentation the model has. Say what it does and when to use it.", "No limit on loop iterations or cost."]}, {"t": "deep", "title": "The loop written by hand", "text": "The SDK's tool runner hides the loop. Writing it once by hand shows exactly what travels over the wire, which is what you need when debugging or when an interviewer asks you to explain an agent.\n\nEach round has the same shape. Send the conversation and the tool definitions. If `stop_reason` is `tool_use`, the reply contains one or more `tool_use` blocks, each with an id, a tool name and JSON input. Run them, then send back one user message containing a `tool_result` block per call, matched by id. Repeat until the model stops asking for tools.\n\nTwo rules prevent subtle failures. Append the model's **whole** content list to the conversation, not only its text. And return **all** tool results in a single message."}, {"t": "code", "lang": "python", "title": "", "code": "import json\nimport anthropic\n\nclient = anthropic.Anthropic()\nORDERS = {184: {\"status\": \"out_for_delivery\", \"eta_minutes\": 12}}\n\nTOOLS = [{\n    \"name\": \"get_order_status\",\n    \"description\": \"Look up the delivery status of one order by its numeric id.\",\n    \"input_schema\": {\n        \"type\": \"object\",\n        \"properties\": {\"order_id\": {\"type\": \"integer\", \"description\": \"The order id, for example 184\"}},\n        \"required\": [\"order_id\"],\n        \"additionalProperties\": False,\n    },\n    \"strict\": True,                                  # arguments are guaranteed to match the schema\n}]\n\ndef execute_tool(name: str, tool_input: dict, user_id: int) -> tuple[str, bool]:\n    \"\"\"Returns (result text, is_error). Permission checks belong here.\"\"\"\n    if name == \"get_order_status\":\n        order = ORDERS.get(tool_input[\"order_id\"])\n        return (json.dumps(order), False) if order else (\"no such order\", True)\n    return (f\"unknown tool {name}\", True)\n\nmessages = [{\"role\": \"user\", \"content\": \"Where is order 184?\"}]\nfor _ in range(8):                                   # hard cap on iterations\n    response = client.messages.create(model=\"claude-opus-5-5\", max_tokens=16000, tools=TOOLS, messages=messages)\n    messages.append({\"role\": \"assistant\", \"content\": response.content})    # the whole content list\n    if response.stop_reason != \"tool_use\":\n        break\n    results = []\n    for block in response.content:\n        if block.type == \"tool_use\":\n            text, is_error = execute_tool(block.name, block.input, user_id=7)\n            results.append({\"type\": \"tool_result\", \"tool_use_id\": block.id, \"content\": text, \"is_error\": is_error})\n    messages.append({\"role\": \"user\", \"content\": results})                  # all results in one message\n\nprint(next(b.text for b in response.content if b.type == \"text\"))"}, {"t": "steps", "title": "What the `messages` list looks like as the loop runs", "steps": [{"c": "Start: one user message.", "cols": [["messages", ["user \"Where is order 184?\""]], ["stop_reason", []]]}, {"c": "The model replies with a tool request. Its content list is appended as the assistant turn.", "cols": [["messages", ["user", "assistant [tool_use id=tu_1 get_order_status {order_id: 184}]"]], ["stop_reason", ["tool_use"]]]}, {"c": "Your code runs the tool and appends one user message holding the result, matched by id.", "cols": [["messages", ["user", "assistant [tool_use tu_1]", "user [tool_result tu_1 {\"status\": \"out_for_delivery\"}]"]], ["stop_reason", []]]}, {"c": "The model now has the fact and writes the answer. The loop ends.", "cols": [["messages", ["user", "assistant [tool_use]", "user [tool_result]", "assistant \"It arrives in about 12 minutes.\""]], ["stop_reason", ["end_turn"]]]}]}, {"t": "table", "title": "Workflow or agent", "rows": [["Shape", "Who decides the steps", "Use when"], ["Single call", "Nobody: one step", "Classify, extract, summarise"], ["Workflow (chain, router, parallel)", "Your code, in a fixed order", "Steps are known in advance"], ["Agent (loop with tools)", "The model, at run time", "Steps depend on what is found along the way"]]}, {"t": "quiz", "title": "", "items": [["What is tool use (function calling)?", "The model returns a structured request to call a function you described. Your code executes it and returns the result so the model can continue."], ["What is an agent?", "A model running in a loop with tools, deciding itself which tool to call next until the task is finished."], ["Who executes a tool?", "Your code, on your servers, with your permissions checks. The model only asks."], ["How do you stop an agent from doing damage?", "Narrow tools, permission checks inside each tool, confirmation before irreversible actions, iteration and budget limits, and logs of every call."], ["What is prompt injection?", "Text inside data the model reads (a review, a web page, an email) that tries to give it instructions. Treat everything the model reads as untrusted, and never let it be the only safeguard."], ["Describe the tool-use message cycle.", "Send messages and tool definitions. The model returns `tool_use` blocks with ids and inputs and `stop_reason: tool_use`. Execute them, append the assistant turn, then send a user message with a `tool_result` per id. Repeat until no tool is requested."], ["Why append the full content list instead of just the text?", "The assistant turn contains the `tool_use` blocks that the following `tool_result` blocks refer to by id. Dropping them makes the next request invalid."], ["How do you report a failed tool call to the model?", "Return a `tool_result` for that id with `is_error` set and a short message, so the model can retry, choose another path or tell the user."], ["Workflow versus agent?", "In a workflow your code fixes the sequence of model calls. In an agent the model chooses the next tool in a loop. Prefer the simplest shape that solves the task."]]}]}, {"id": "py-rag", "title": "Embeddings and RAG", "level": "Advanced", "mins": "40 min", "blocks": [{"t": "plain", "title": "", "text": "A model does not know your refund policy or today's catalogue. **Retrieval-augmented generation (RAG)** fixes that: find the few pieces of your own text that relate to the question, paste them into the prompt and tell the model to answer only from them.\n\nFinding relevant text uses **embeddings**. An embedding model turns a piece of text into a list of numbers (a vector) so that texts with similar meaning have vectors that point in similar directions."}, {"t": "analogy", "title": "", "text": "An open-book exam. The model is a strong student, retrieval hands it the right two pages, and the instruction is \"answer from these pages and say so if the answer is not there\"."}, {"t": "code", "lang": "python", "title": "", "code": "import re\nimport numpy as np\n\nDOCS = [\n    \"Refunds for damaged items are issued to the original payment method within 5 days.\",\n    \"Delivery is free for orders above 500 rupees. Below that a fee of 40 rupees applies.\",\n    \"Fresh milk can be returned at the door if the seal is broken.\",\n    \"Membership gives free delivery on every order and early access to slots.\",\n]\n\ndef words(text: str) -> list[str]:\n    return re.findall(r\"[a-z0-9]+\", text.lower())\n\nVOCAB = sorted({w for doc in DOCS for w in words(doc)})\n\ndef embed(text: str) -> np.ndarray:\n    \"\"\"Toy embedding: word counts. A real system calls an embedding model here.\"\"\"\n    counts = np.array([words(text).count(w) for w in VOCAB], dtype=float)\n    length = np.linalg.norm(counts)\n    return counts / length if length else counts\n\nINDEX = np.stack([embed(doc) for doc in DOCS])        # done once, stored in a vector database\n\ndef retrieve(question: str, k: int = 2) -> list[tuple[float, str]]:\n    scores = INDEX @ embed(question)                   # cosine similarity with every chunk\n    best = np.argsort(scores)[::-1][:k]\n    return [(round(float(scores[i]), 2), DOCS[i]) for i in best]\n\nquestion = \"is delivery free above 500 rupees\"\nhits = retrieve(question)\nfor score, doc in hits:\n    print(score, doc)\n\ncontext = \"\\n\".join(f\"[{n}] {doc}\" for n, (_, doc) in enumerate(hits, 1))\nprompt = (\n    \"Answer using only the numbered sources. Cite the source number. \"\n    \"If the sources do not contain the answer, say you do not know.\\n\\n\"\n    f\"Sources:\\n{context}\\n\\nQuestion: {question}\"\n)\nprint(prompt)       # this prompt is what you send to the model"}, {"t": "flow", "title": "Indexing (once, and on every document change)", "lanes": [{"name": "", "nodes": [{"n": "Documents"}, {"a": ""}, {"n": "Split into chunks"}, {"a": ""}, {"n": "Embedding model"}, {"a": ""}, {"n": "Vectors"}, {"a": ""}, {"n": "Store in vector database (pgvector, etc.)"}]}]}, {"t": "flow", "title": "Answering (every question)", "lanes": [{"name": "", "nodes": [{"n": "Question"}, {"a": ""}, {"n": "Embed the question"}, {"a": ""}, {"n": "Find nearest chunks"}, {"a": ""}, {"n": "Build prompt with those chunks"}, {"a": ""}, {"n": "*Model answers with citations"}, {"a": ""}, {"n": "Show answer and sources"}]}]}, {"t": "real", "title": "", "text": "A support assistant answers \"can I return opened milk\" from the actual policy pages, and shows which page it used. When the policy changes, you re-index that page and the answer changes with no retraining. When retrieval finds nothing relevant, the assistant says it does not know and offers a human."}, {"t": "pitfalls", "title": "", "items": ["Blaming the model when the retrieval step returned the wrong chunks. Log the retrieved text and check it first.", "Chunks that are too big (noise, cost) or too small (no context). Start around a few hundred words with some overlap, then measure.", "No \"I do not know\" instruction, so the model fills gaps from its general knowledge.", "Skipping access control. Retrieval must only search documents this user is allowed to see."]}, {"t": "deep", "title": "Chunking, hybrid search and measuring retrieval", "text": "Three decisions determine RAG quality more than the choice of model.\n\n**Chunking**: how documents are split. Chunks should be self-contained units of meaning, a few hundred words long, with a small overlap so a sentence cut at a boundary still appears whole in one chunk. Keep the document title and section heading with every chunk.\n\n**Search method**: vector search finds similar meaning but can miss exact terms such as product codes or names. Keyword search (BM25) is the opposite. **Hybrid search** runs both and merges the rankings. A **reranker** that rescores the top 20 or so against the question usually lifts quality further.\n\n**Measurement**: build a small set of questions with the chunk that should answer each. **Recall@k** is the share of questions whose correct chunk appears in the top k results. If recall is low, no prompt will fix the answers."}, {"t": "code", "lang": "python", "title": "", "code": "import math, re\nfrom collections import Counter\n\ndef chunk(text: str, size: int = 12, overlap: int = 4) -> list[str]:\n    \"\"\"Sliding window over words. Real systems split on headings and paragraphs first.\"\"\"\n    words = text.split()\n    return [\" \".join(words[i:i + size]) for i in range(0, max(1, len(words) - overlap), size - overlap)]\n\nprint(chunk(\"Refunds for damaged items go to the original payment method within five days of the request being approved.\", 8, 3))\n\nCHUNKS = [\n    \"Fresh milk can be returned at the door if the seal is broken.\",\n    \"Delivery is free above 500 rupees and costs 40 rupees below that.\",\n    \"Refunds for damaged items go to the original payment method within five days.\",\n    \"Coupon SAVE50 gives 50 rupees off the first order.\",\n    \"Coupon FRESH20 gives 20 percent off fruit and vegetables.\",\n]\nSTOP = {\"is\", \"the\", \"a\", \"do\", \"i\", \"my\", \"how\", \"what\", \"get\", \"for\", \"at\", \"if\", \"and\", \"of\", \"to\", \"does\"}\nwords = lambda text: [w for w in re.findall(r\"[a-z0-9]+\", text.lower()) if w not in STOP]\ndoc_words = [words(c) for c in CHUNKS]\ndoc_freq = Counter(w for doc in doc_words for w in set(doc))\n\ndef keyword_rank(query: str) -> list[int]:\n    \"\"\"Exact-word matching (a tiny TF-IDF standing in for BM25). Returns only chunks that match.\"\"\"\n    scores = {}\n    for i, doc in enumerate(doc_words):\n        counts = Counter(doc)\n        score = sum(counts[w] * math.log(1 + len(CHUNKS) / doc_freq[w]) for w in words(query) if w in counts)\n        if score:\n            scores[i] = score\n    return sorted(scores, key=lambda i: -scores[i])\n\nCONCEPT = {\"refunds\": \"refund\", \"money\": \"refund\", \"back\": \"refund\", \"returned\": \"return\", \"delivery\": \"delivery\",\n           \"shipping\": \"delivery\", \"free\": \"free\", \"coupon\": \"discount\", \"off\": \"discount\"}\nconcepts = lambda text: {CONCEPT[w] for w in words(text) if w in CONCEPT}\n\ndef vector_rank(query: str) -> list[int]:\n    \"\"\"Meaning matching, simulated with a concept table. A real system compares embedding vectors.\"\"\"\n    overlap = {i: len(concepts(query) & concepts(c)) for i, c in enumerate(CHUNKS)}\n    return sorted((i for i in overlap if overlap[i]), key=lambda i: -overlap[i])\n\ndef hybrid_rank(query: str, k: int = 60) -> list[int]:\n    fused = Counter()                                   # reciprocal rank fusion\n    for ranking in (keyword_rank(query), vector_rank(query)):\n        for position, doc_id in enumerate(ranking):\n            fused[doc_id] += 1 / (k + position + 1)\n    return [doc_id for doc_id, _ in fused.most_common()]\n\nEVAL = [(\"how do I get my money back\", \"refunds\"), (\"is shipping free\", \"delivery is free\"), (\"what does coupon FRESH20 give\", \"fresh20\")]\n\ndef recall_at(k: int, ranker) -> float:\n    hits = sum(any(needle in CHUNKS[i].lower() for i in ranker(question)[:k]) for question, needle in EVAL)\n    return hits / len(EVAL)\n\nfor name, ranker in ((\"keyword\", keyword_rank), (\"vector \", vector_rank), (\"hybrid \", hybrid_rank)):\n    print(f\"{name}: recall@1 = {recall_at(1, ranker):.2f}   top hit per question: {[ranker(q)[:1] for q, _ in EVAL]}\")", "web": 1}, {"t": "flow", "title": "A production retrieval pipeline", "lanes": [{"name": "", "nodes": [{"n": "Question"}, {"a": ""}, {"n": "Rewrite or expand the query"}, {"a": ""}, {"n": "Vector search top 20 + keyword search top 20"}, {"a": ""}, {"n": "Fuse rankings"}, {"a": ""}, {"n": "Rerank to top 5"}, {"a": ""}, {"n": "Filter by user's permissions"}, {"a": ""}, {"n": "Build prompt"}, {"a": ""}, {"n": "Answer with citations"}]}]}, {"t": "table", "title": "When answers are wrong, look here first", "rows": [["Symptom", "Likely cause", "Check"], ["Right document exists, never retrieved", "Chunking or search method", "Recall@k on an eval set"], ["Retrieved but ignored", "Too many or too long chunks", "Send fewer, put the best first"], ["Answer mixes two products", "Chunks lack their heading or product name", "Add title and section to each chunk"], ["Exact code or name not found", "Vector search only", "Add keyword search"], ["Correct last week, wrong now", "Stale index", "Re-index on document change"]]}, {"t": "quiz", "title": "", "items": [["What is RAG?", "Retrieve relevant pieces of your own data for a question, add them to the prompt and have the model answer from them. It grounds answers in current, private information."], ["What is an embedding?", "A vector that represents the meaning of a text, produced by an embedding model. Similar texts get nearby vectors."], ["RAG versus fine-tuning?", "RAG supplies knowledge at question time and is updated by changing documents. Fine-tuning changes the model's behaviour or style through training. For facts that change, use RAG."], ["How do you evaluate a RAG system?", "Separately measure retrieval (did the right chunk come back in the top results) and generation (is the answer supported by the retrieved text and correct)."], ["What is a vector database?", "A store that keeps vectors with their source text and finds the nearest ones quickly. PostgreSQL with the pgvector extension is a common first choice."], ["How do you choose a chunk size?", "Start with self-contained passages of a few hundred words with some overlap, keep headings with each chunk, then tune by measuring recall on real questions."], ["What is hybrid search?", "Running semantic vector search and keyword search together and merging the results, so both paraphrases and exact terms are found."], ["What is recall@k?", "The fraction of test questions for which a relevant chunk appears among the top k retrieved results."], ["What does a reranker do?", "It rescores a small candidate list against the query with a more accurate, slower model and reorders it, improving what ends up in the prompt."], ["How do you keep RAG from leaking data between users?", "Store access metadata with each chunk and filter retrieval by the requesting user's permissions before anything reaches the prompt."]]}]}, {"id": "py-eval", "title": "Evals, cost and safety", "level": "Expert", "mins": "35 min", "blocks": [{"t": "plain", "title": "", "text": "You cannot test an AI feature with one `assert`, because the output varies. An **eval** is a set of realistic inputs with a way to score each output. You run it whenever the prompt, the model or the retrieval changes, and compare the score with the previous run.\n\nWithout evals, every prompt change is a guess. With them, AI work becomes normal engineering: change, measure, keep or revert."}, {"t": "bridge", "title": "", "text": "An eval set is a regression test suite whose assertions are graders instead of exact equality. A score dropping from 92% to 85% is a failing build."}, {"t": "code", "lang": "python", "title": "", "code": "from dataclasses import dataclass\nfrom typing import Callable\n\n@dataclass\nclass Case:\n    question: str\n    must_contain: list[str]\n    must_not_contain: list[str]\n\nCASES = [\n    Case(\"Is delivery free above 500?\", [\"free\"], [\"40\"]),\n    Case(\"What is the delivery fee for a 200 rupee order?\", [\"40\"], [\"free\"]),\n    Case(\"Can I pay with cryptocurrency?\", [\"do not know\"], [\"yes\"]),\n]\n\ndef fake_assistant(question: str) -> str:\n    \"\"\"Stands in for the real model call so this file runs anywhere.\"\"\"\n    if \"500\" in question:\n        return \"Yes, delivery is free above 500 rupees.\"\n    if \"200\" in question:\n        return \"The fee is 40 rupees.\"\n    return \"Yes, you can.\"                       # a wrong, made-up answer\n\ndef grade(case: Case, answer: str) -> bool:\n    text = answer.lower()\n    return all(w in text for w in case.must_contain) and not any(w in text for w in case.must_not_contain)\n\ndef run_eval(assistant: Callable[[str], str]) -> float:\n    passed = 0\n    for case in CASES:\n        answer = assistant(case.question)\n        ok = grade(case, answer)\n        passed += ok\n        print(\"PASS\" if ok else \"FAIL\", \"|\", case.question, \"->\", answer)\n    return passed / len(CASES)\n\nprint(f\"score: {run_eval(fake_assistant):.0%}\")"}, {"t": "flow", "title": "The improvement loop", "lanes": [{"name": "", "nodes": [{"n": "Collect real questions"}, {"a": ""}, {"n": "Write expected behaviour"}, {"a": ""}, {"n": "Run eval, record score"}, {"a": ""}, {"n": "Change one thing (prompt, model, retrieval)"}, {"a": ""}, {"n": "Run eval again"}, {"a": ""}, {"n": "Better?"}, {"a": "yes"}, {"n": "Keep it"}]}, {"name": "", "nodes": [{"n": "Better?"}, {"a": "no"}, {"n": "Revert"}]}]}, {"t": "table", "title": "Three ways to grade", "rows": [["Grader", "How", "Use for"], ["Code", "Exact match, contains, valid JSON, right tool called", "Extraction, classification, tool choice"], ["Model as judge", "A second model scores the answer against a rubric", "Tone, helpfulness, faithfulness to sources"], ["Human", "A person reviews a sample", "Calibrating the other two, high-risk features"]]}, {"t": "table", "title": "Cost and latency levers", "rows": [["Lever", "Effect"], ["Shorter prompts, fewer retrieved chunks", "Fewer input tokens"], ["Prompt caching for the stable prefix", "Repeated prefix billed at a fraction"], ["Smaller model for easy steps", "Lower price and latency per call"], ["Batch API for offline jobs", "Lower price, not instant"], ["Streaming", "Same total time, much better perceived speed"], ["Limit `max_tokens` and loop iterations", "Caps worst-case spend"]]}, {"t": "real", "title": "", "text": "A worked cost estimate. Say a feature sends 2,000 input tokens and gets 500 output tokens per request, one million requests a month. At 4 dollars per million input tokens and 20 per million output tokens that is 8,000 + 10,000 = 18,000 dollars a month. Halving the prompt saves 4,000. Prices change, so always take current numbers from the provider's pricing page, but do this arithmetic before you ship."}, {"t": "pitfalls", "title": "", "items": ["Shipping a prompt change because three hand-tried examples looked good.", "An eval set of only easy cases. Include the questions that should be refused and the ones with no answer.", "No per-user rate limit on an AI endpoint. One script can spend your monthly budget overnight.", "Logging full prompts that contain personal data without a retention plan."]}, {"t": "deep", "title": "Scoring classifiers, model-graded evals and a release gate", "text": "Different features need different scores.\n\nFor a **classifier**, such as \"is this message a complaint\", accuracy alone misleads when one class is rare. **Precision** asks: of the items flagged, how many were right. **Recall** asks: of the items that should have been flagged, how many were found. Which matters more depends on the cost of each mistake.\n\nFor **open-ended answers**, code cannot judge tone or correctness, so a second model grades each answer against a written rubric and returns a structured verdict. Check the judge against human labels on a sample before trusting it.\n\nA **release gate** turns this into engineering. Store the score of the version in production as the baseline. In CI, run the eval on the candidate and fail the build if the score drops by more than the noise you measured."}, {"t": "code", "lang": "python", "title": "", "code": "from dataclasses import dataclass\n\n@dataclass\nclass Example:\n    text: str\n    is_complaint: bool\n\nDATA = [\n    Example(\"My order arrived two hours late\", True), Example(\"The milk was spoiled\", True),\n    Example(\"Half my items are missing!\", True), Example(\"Great service, thanks\", False),\n    Example(\"Where can I change my address?\", False), Example(\"Do you deliver on Sunday?\", False),\n    Example(\"The delivery partner was late but polite\", True), Example(\"Is the late night slot available?\", False),\n]\n\ndef classify_v1(text: str) -> bool:                    # stands in for a prompt + model\n    return any(word in text.lower() for word in (\"late\", \"spoiled\"))\n\ndef classify_v2(text: str) -> bool:\n    lowered = text.lower()\n    return any(w in lowered for w in (\"spoiled\", \"missing\", \"arrived two hours late\", \"was late\"))\n\ndef score(classifier) -> dict[str, float]:\n    tp = sum(classifier(e.text) and e.is_complaint for e in DATA)\n    fp = sum(classifier(e.text) and not e.is_complaint for e in DATA)\n    fn = sum(not classifier(e.text) and e.is_complaint for e in DATA)\n    precision = tp / (tp + fp) if tp + fp else 0.0\n    recall = tp / (tp + fn) if tp + fn else 0.0\n    f1 = 2 * precision * recall / (precision + recall) if precision + recall else 0.0\n    return {\"precision\": round(precision, 2), \"recall\": round(recall, 2), \"f1\": round(f1, 2)}\n\nbaseline, candidate = score(classify_v1), score(classify_v2)\nprint(\"v1 (in production):\", baseline)\nprint(\"v2 (candidate):    \", candidate)\n\ndef gate(baseline: dict, candidate: dict, tolerance: float = 0.02) -> bool:\n    worse = [name for name in baseline if candidate[name] \u003c baseline[name] - tolerance]\n    print(\"GATE:\", \"FAIL, regressed on \" + \", \".join(worse) if worse else \"PASS\")\n    return not worse\n\ngate(baseline, candidate)", "web": 1}, {"t": "code", "lang": "python", "title": "A model as the judge", "code": "import anthropic\nfrom pydantic import BaseModel\n\nclass Verdict(BaseModel):\n    grounded: bool          # every claim is supported by the sources\n    answers_question: bool\n    reason: str\n\nRUBRIC = \"\"\"You grade a support assistant's answer.\ngrounded: true only if every factual claim appears in the sources.\nanswers_question: true only if the user's question is directly answered.\nGive a one-sentence reason.\"\"\"\n\nclient = anthropic.Anthropic()\n\ndef judge(question: str, sources: str, answer: str) -> Verdict:\n    response = client.messages.parse(\n        model=\"claude-opus-5-5\",\n        max_tokens=16000,\n        system=RUBRIC,\n        messages=[{\"role\": \"user\", \"content\": f\"Sources:\\n{sources}\\n\\nQuestion: {question}\\n\\nAnswer: {answer}\"}],\n        output_format=Verdict,\n    )\n    return response.parsed_output"}, {"t": "flow", "title": "Evals in the delivery pipeline", "lanes": [{"name": "", "nodes": [{"n": "Pull request changes a prompt"}, {"a": ""}, {"n": "CI runs the eval set"}, {"a": ""}, {"n": "Compare with stored baseline"}, {"a": ""}, {"n": "Regressed beyond tolerance?"}, {"a": "yes"}, {"n": "Build fails, show failing cases"}]}, {"name": "", "nodes": [{"n": "Regressed beyond tolerance?"}, {"a": "no"}, {"n": "Merge"}, {"a": ""}, {"n": "Deploy"}, {"a": ""}, {"n": "Sample live traffic for review"}, {"a": ""}, {"n": "Add new failures to the eval set"}]}]}, {"t": "table", "title": "Reading precision and recall", "rows": [["Situation", "Favour", "Because"], ["Flagging fraud for manual review", "Recall", "A missed fraud costs more than an extra review"], ["Auto-blocking a customer", "Precision", "A false block loses a good customer"], ["Routing complaints to a human", "Recall, with acceptable precision", "Missing an angry customer is worse"], ["Suggesting products", "Precision at the top few", "Bad suggestions erode trust"]]}, {"t": "quiz", "title": "", "items": [["What is an eval?", "A repeatable test for an AI feature: a fixed set of inputs, a grading method and a score you track across changes."], ["What is a hallucination and how do you reduce it?", "A fluent answer that is not true. Reduce it by grounding in retrieved sources, requiring citations, allowing \"I do not know\" and measuring with evals."], ["How do you control the cost of an AI feature?", "Measure tokens per request, trim prompts, cache stable prefixes, use the smallest model that passes your eval, cap output and iterations, and rate-limit users."], ["What are guardrails?", "Checks around the model: input validation, permission checks in tools, output validation against a schema or policy, and human approval for risky actions."], ["Precision versus recall?", "Precision is the share of positive predictions that are correct. Recall is the share of actual positives that were found. Improving one often lowers the other."], ["Why is accuracy misleading on imbalanced data?", "If 95% of messages are not complaints, a classifier that always says \"not a complaint\" is 95% accurate and useless."], ["How do you trust a model-graded eval?", "Write a specific rubric, ask for a structured verdict with a reason, and compare the judge's verdicts with human labels on a sample. Use it only where they agree well."], ["How do you stop prompt changes from causing regressions?", "Keep an eval set in the repository, record the production score as a baseline and fail CI when a change scores worse beyond the measured noise."], ["Where do eval cases come from?", "Real user inputs, past failures and bug reports, and deliberately hard or adversarial cases, each with the expected behaviour written down."]]}]}]}, {"name": "Stage 7 · Expert", "sub": "Speed, tooling and a capstone", "lessons": [{"id": "py-perf", "title": "Profiling and performance", "level": "Expert", "mins": "30 min", "blocks": [{"t": "plain", "title": "", "text": "Make it correct, then measure, then make the slow part fast. Guessing which part is slow is wrong most of the time. A **profiler** tells you where the time went.\n\nMost speed-ups in backend Python come from three places, in this order: doing less I/O (fewer queries, a cache), choosing the right data structure (a set instead of a list) and moving heavy loops into a library written in C."}, {"t": "bridge", "title": "", "text": "`cProfile` is Instruments' Time Profiler or the Flutter CPU profiler in text form: a table of functions sorted by time."}, {"t": "code", "lang": "python", "title": "", "code": "import cProfile, pstats, timeit\n\nblocked_list = list(range(20_000))\nblocked_set = set(blocked_list)\n\ndef slow(ids):\n    return [i for i in ids if i in blocked_list]      # scans the list each time\n\ndef fast(ids):\n    return [i for i in ids if i in blocked_set]       # one hash lookup each time\n\nids = list(range(0, 40_000, 20))\nprint(f\"list: {timeit.timeit(lambda: slow(ids), number=3):.3f}s\")\nprint(f\"set : {timeit.timeit(lambda: fast(ids), number=3):.5f}s\")\n\nprofiler = cProfile.Profile()\nprofiler.enable()\nslow(ids)\nprofiler.disable()\npstats.Stats(profiler).sort_stats(\"cumulative\").print_stats(3)"}, {"t": "flow", "title": "A performance investigation", "lanes": [{"name": "", "nodes": [{"n": "Users report slow page"}, {"a": ""}, {"n": "Which route? (metrics, p95)"}, {"a": ""}, {"n": "Where in the route? (profiler, query log)"}, {"a": ""}, {"n": "Is it I/O?"}, {"a": "yes"}, {"n": "Fewer queries, add index, cache, run in parallel"}]}, {"name": "", "nodes": [{"n": "Is it I/O?"}, {"a": "no, CPU"}, {"n": "Better data structure"}, {"a": ""}, {"n": "Still slow?"}, {"a": ""}, {"n": "NumPy, worker processes or a compiled extension"}]}]}, {"t": "table", "title": "Cost of common operations", "rows": [["Operation", "list", "dict / set"], ["Lookup by position", "O(1)", "n/a"], ["Is x inside", "O(n)", "O(1) average"], ["Append at end", "O(1)", "O(1) add"], ["Insert or remove at start", "O(n) (use `collections.deque`)", "n/a"]]}, {"t": "pitfalls", "title": "", "items": ["Optimising code that is not on the hot path.", "Micro-tuning Python while the endpoint makes 200 database queries.", "Measuring once. Run several times and look at the spread."]}, {"t": "quiz", "title": "", "items": [["How do you find a bottleneck?", "Measure. Start from production metrics to find the slow route, then profile that code path or inspect its queries, and change only what the measurements point to."], ["Why is `x in list` slower than `x in set`?", "A list is searched item by item, O(n). A set hashes the value and jumps to its slot, O(1) on average."], ["What options exist for CPU-heavy Python?", "Vectorised libraries such as NumPy, multiple processes, a job queue to move work off the request path, or native extensions."]]}]}, {"id": "py-tool", "title": "Packaging, linting and CI", "level": "Expert", "mins": "25 min", "blocks": [{"t": "plain", "title": "", "text": "A professional Python project has one config file, `pyproject.toml`, that lists dependencies and configures the tools. Four tools run on every commit: a **formatter and linter** (`ruff`), a **type checker** (`mypy` or `pyright`), the **tests** (`pytest`) and a **lock file** that pins exact dependency versions.\n\nContinuous integration runs the same four on every pull request, so problems are found before review."}, {"t": "bridge", "title": "", "text": "`pyproject.toml` is `pubspec.yaml` plus `analysis_options.yaml` in one file. `ruff` is `dart format` plus `flutter analyze` or SwiftLint. The lock file is `pubspec.lock`."}, {"t": "code", "lang": "text", "title": "pyproject.toml", "code": "[project]\nname = \"shop-api\"\nversion = \"1.4.0\"\nrequires-python = \">=3.12\"\ndependencies = [\"fastapi[standard]\", \"sqlalchemy\", \"psycopg[binary]\", \"pyjwt\", \"httpx\", \"anthropic\"]\n\n[dependency-groups]\ndev = [\"pytest\", \"ruff\", \"mypy\"]\n\n[tool.ruff]\nline-length = 100\n\n[tool.mypy]\nstrict = true\n\n[tool.pytest.ini_options]\ntestpaths = [\"tests\"]"}, {"t": "code", "lang": "bash", "title": "With uv", "code": "uv sync                  # create .venv and install exactly what uv.lock says\nuv add redis             # add a dependency and update the lock file\nuv run ruff format .\nuv run ruff check .\nuv run mypy app\nuv run pytest -q"}, {"t": "flow", "title": "What CI does on a pull request", "lanes": [{"name": "", "nodes": [{"n": "Push branch"}, {"a": ""}, {"n": "Install from lock file"}, {"a": ""}, {"n": "ruff format --check"}, {"a": ""}, {"n": "ruff check"}, {"a": ""}, {"n": "mypy"}, {"a": ""}, {"n": "pytest"}, {"a": ""}, {"n": "Build image"}, {"a": ""}, {"n": "All green?"}, {"a": "yes"}, {"n": "Ready for review"}]}]}, {"t": "pitfalls", "title": "", "items": ["Unpinned dependencies. A library releases a breaking version on Friday and your Monday deploy fails.", "Lint and type checks that are optional. If CI does not block on them, they decay.", "Arguing about style in review. Let the formatter decide."]}, {"t": "quiz", "title": "", "items": [["What is `pyproject.toml`?", "The standard project file: metadata, dependencies and configuration for build and development tools."], ["Why commit a lock file?", "So every machine and every deploy installs exactly the same versions of every dependency, including indirect ones."], ["What do a linter and a type checker each catch?", "A linter finds suspicious patterns and style issues such as unused imports and shadowed names. A type checker finds mismatched types and unhandled `None` before the code runs."]]}]}, {"id": "py-cap", "title": "Capstone: an order assistant API", "level": "Expert", "mins": "2 to 3 weekends", "blocks": [{"t": "plain", "title": "", "text": "Build one small service that uses every stage of this track. It is a backend for a grocery app with an assistant that answers \"where is my order\" and \"what is your refund policy\" and can open a refund request.\n\nBuild it in the order below. Each milestone is usable by itself and each one maps to lessons you have already done."}, {"t": "flow", "title": "System at the end", "lanes": [{"name": "", "nodes": [{"n": "Phone or curl"}, {"a": ""}, {"n": "FastAPI (auth, validation)"}, {"a": ""}, {"n": "PostgreSQL (users, orders) + Redis (cache, queue)"}]}, {"name": "", "nodes": [{"n": "FastAPI /assistant"}, {"a": ""}, {"n": "Retrieve policy chunks (pgvector)"}, {"a": ""}, {"n": "*Model with tools: get_order_status, create_refund_request"}, {"a": ""}, {"n": "SSE stream to client"}]}, {"name": "", "nodes": [{"n": "Worker process"}, {"a": ""}, {"n": "Takes \"send confirmation\" jobs from the queue"}]}]}, {"t": "table", "title": "Milestones", "rows": [["Milestone", "You build", "Lessons used"], ["1", "`/health`, `/orders` create and read, in memory, with tests", "FastAPI, Pydantic, pytest"], ["2", "PostgreSQL with SQLAlchemy and one migration", "Databases"], ["3", "Login, JWT, \"only my orders\" check", "Auth"], ["4", "Settings from env, error handlers, structured logs", "Structure"], ["5", "Cache delivery slots, background confirmation job", "Caching and jobs"], ["6", "`/orders/{id}/events` live status over SSE", "Real-time"], ["7", "`/assistant` with streaming and two tools", "LLM, streaming, tools"], ["8", "Policy search with embeddings", "RAG"], ["9", "20-case eval set run in CI", "Evals"], ["10", "Dockerfile, deploy, health checks, a dashboard", "Deploy"]]}, {"t": "table", "title": "Definition of done", "rows": [["Check", "How to prove it"], ["A user cannot read another user's order", "A test that expects 404"], ["The assistant never invents an order status", "An eval case with an unknown order id"], ["A slow model call does not block other requests", "Load test the health route during a stream"], ["Secrets are not in the repository", "Search the git history"], ["One command starts everything locally", "`docker compose up`"]]}, {"t": "real", "title": "", "text": "In an interview, walking through this one project answers most backend and AI system questions: how a request flows, where you validate, how you stop one user reading another's data, how you stream, how you ground the model, how you know a prompt change made things better and what you watch in production."}, {"t": "real", "title": "Starter code on your Mac", "text": "A starter project for this capstone is in `~/Documents/Backend-Academy-Starters/python-order-assistant`. Milestone 1 already works, the route, service and repository layers are in place, and every later milestone has a `MILESTONE n` note at the place in the code where it belongs.\n\nStart by running `scripts/smoke.py`, then read the code in the order a request travels: `app/main.py`, `app/routes/orders.py`, `app/services/orders.py`, `app/repos/memory.py`. Your first exercise is milestone 2 in `app/repos/sql.py`."}, {"t": "code", "lang": "bash", "title": "", "code": "cd ~/Documents/Backend-Academy-Starters/python-order-assistant\npython3 -m venv .venv && .venv/bin/pip install -r requirements-dev.txt\n.venv/bin/python scripts/smoke.py\n.venv/bin/uvicorn app.main:app --reload        # then open http://127.0.0.1:8000/docs"}, {"t": "quiz", "title": "", "items": [["Why build one project end to end instead of ten tutorials?", "The hard parts are at the joins between pieces: auth inside tools, streaming through a proxy, tests around a model call. Tutorials skip the joins."], ["What would you add next for scale?", "Read replicas and connection pooling for the database, a queue for all slow work, rate limits, tracing across services, and separate deployments for the API and the workers."]]}]}]}]}, {"id": "node", "name": "Node.js", "tagline": "APIs + real-time", "stages": [{"name": "Stage 0 · Layman", "sub": "What Node is, install it, run one file", "lessons": [{"id": "node-map", "title": "What Node.js is and the whole path", "level": "Layman", "mins": "10 min", "blocks": [{"t": "plain", "title": "", "text": "JavaScript was built to run inside web browsers. **Node.js** is a program that runs JavaScript outside the browser, on a laptop or a server. It takes the JavaScript engine from Chrome (called **V8**) and adds what a server needs: reading files, opening network connections and talking to databases.\n\nNode is popular for backends because it handles a large number of simultaneous connections with very little memory, and because web teams can use one language on both sides."}, {"t": "analogy", "title": "", "text": "V8 is the engine. Node is the car built around it: wheels (file system), steering (network) and a dashboard (the `process` object). The browser is a different car using the same engine."}, {"t": "bridge", "title": "", "text": "Node feels close to Dart. Both are single-threaded with an event loop, both use `async` / `await` and `Future` / `Promise`, both have a package manager with a manifest file (`pubspec.yaml`, `package.json`). TypeScript is to JavaScript roughly what sound null-safe Dart is to early untyped Dart."}, {"t": "flow", "title": "What Node is made of", "lanes": [{"name": "", "nodes": [{"n": "Your JavaScript"}, {"a": ""}, {"n": "*V8 (runs JS, manages memory)"}, {"a": ""}, {"n": "Node APIs (fs, http, crypto)"}, {"a": ""}, {"n": "libuv (event loop + thread pool)"}, {"a": ""}, {"n": "Operating system"}]}]}, {"t": "flow", "title": "The six stages", "lanes": [{"name": "Layman", "nodes": [{"n": "Install"}, {"a": ""}, {"n": "Run a file"}, {"a": ""}, {"n": "npm"}]}, {"name": "Language", "nodes": [{"n": "Values"}, {"a": ""}, {"n": "Functions and closures"}, {"a": ""}, {"n": "Arrays and objects"}, {"a": ""}, {"n": "Modules"}, {"a": ""}, {"n": "TypeScript"}]}, {"name": "Async core", "nodes": [{"n": "Callbacks to await"}, {"a": ""}, {"n": "Event loop"}, {"a": ""}, {"n": "Errors"}, {"a": ""}, {"n": "Events"}, {"a": ""}, {"n": "Streams"}]}, {"name": "Backend", "nodes": [{"n": "HTTP server"}, {"a": ""}, {"n": "Express"}, {"a": ""}, {"n": "Validation"}, {"a": ""}, {"n": "Database"}, {"a": ""}, {"n": "Auth"}, {"a": ""}, {"n": "Tests"}]}, {"name": "Real-time and scale", "nodes": [{"n": "WebSockets"}, {"a": ""}, {"n": "Queues"}, {"a": ""}, {"n": "Workers"}, {"a": ""}, {"n": "Performance"}]}, {"name": "Production", "nodes": [{"n": "Security"}, {"a": ""}, {"n": "Deploy"}, {"a": ""}, {"n": "AI features"}, {"a": ""}, {"n": "Capstone"}]}]}, {"t": "table", "title": "Python or Node for the same job", "rows": [["Job", "Python", "Node.js"], ["REST API", "FastAPI", "Express, Fastify, NestJS"], ["Validation", "Pydantic", "Zod"], ["Database", "SQLAlchemy", "Prisma, Drizzle, `pg`"], ["Tests", "pytest", "`node:test`, Vitest, Jest"], ["Background jobs", "Celery, Arq", "BullMQ"], ["Typed code", "Type hints + mypy", "TypeScript"], ["AI and data libraries", "Very strong", "Good SDKs, fewer data tools"]]}, {"t": "real", "title": "", "text": "A chat feature and live order tracking hold a connection open per user. Ten thousand users online means ten thousand mostly idle connections. Node keeps all of them in one process with one thread, which is the workload it was designed for."}, {"t": "quiz", "title": "", "items": [["What is Node.js?", "A JavaScript runtime built on the V8 engine and the libuv library. It runs JavaScript outside the browser with APIs for files, networking and processes."], ["Is Node a language or a framework?", "Neither. JavaScript is the language, Node is the runtime that executes it, and Express or NestJS are frameworks that run on Node."], ["What is libuv?", "The C library inside Node that provides the event loop, non-blocking network I/O and a small thread pool for work the OS cannot do asynchronously, such as file access."], ["When is Node a poor fit?", "CPU-heavy work such as image processing or large computations, because one long calculation blocks the single JavaScript thread."]]}]}, {"id": "node-setup", "title": "Install Node and understand npm", "level": "Layman", "mins": "20 min", "blocks": [{"t": "plain", "title": "", "text": "Install Node with a version manager so each project can pin its own Node version. `nvm` is the common one. Node ships with `npm`, the package manager.\n\nA project is a folder with a `package.json` file. That file names the project, lists the libraries it needs and defines shortcut commands called **scripts**. Installed libraries go into `node_modules`, and exact versions are recorded in `package-lock.json`."}, {"t": "bridge", "title": "", "text": "`package.json` is `pubspec.yaml` / `Podfile`. `package-lock.json` is the lock file. `node_modules` is `.pub-cache` or `Pods/`, except it lives inside every project and is never committed. `npm run dev` is like a named scheme or a `Makefile` target."}, {"t": "code", "lang": "bash", "title": "", "code": "nvm install 22 && nvm use 22       # an LTS version\nnode --version && npm --version\nmkdir shop-api && cd shop-api\nnpm init -y                        # creates package.json\nnpm pkg set type=module            # use modern import/export syntax\nnpm install express                # runtime dependency\nnpm install -D typescript          # dev-only dependency\nnode index.js                      # run a file\nnode --watch index.js              # rerun on every save"}, {"t": "code", "lang": "text", "title": "package.json", "code": "{\n  \"name\": \"shop-api\",\n  \"version\": \"1.0.0\",\n  \"type\": \"module\",\n  \"engines\": { \"node\": \">=22\" },\n  \"scripts\": {\n    \"dev\": \"node --watch src/server.js\",\n    \"start\": \"node src/server.js\",\n    \"test\": \"node --test\"\n  },\n  \"dependencies\": { \"express\": \"^5.1.0\" },\n  \"devDependencies\": { \"typescript\": \"^5.6.0\" }\n}"}, {"t": "flow", "title": "What `npm install` does", "lanes": [{"name": "", "nodes": [{"n": "Read package.json"}, {"a": ""}, {"n": "Resolve version ranges"}, {"a": ""}, {"n": "Download from the npm registry"}, {"a": ""}, {"n": "Write node_modules"}, {"a": ""}, {"n": "Record exact versions in package-lock.json"}]}]}, {"t": "table", "title": "Version ranges", "rows": [["You write", "npm may install"], ["`5.1.0`", "Exactly that"], ["`^5.1.0`", "5.1.0 up to but not including 6.0.0"], ["`~5.1.0`", "5.1.0 up to but not including 5.2.0"]]}, {"t": "pitfalls", "title": "", "items": ["Committing `node_modules`. Add it to `.gitignore` and commit the lock file instead.", "Using `npm install` in CI. Use `npm ci`, which installs exactly what the lock file says and fails if it is out of date.", "Installing a package after reading only its name. Check downloads, maintenance and the exact spelling: typo-squatted packages exist."]}, {"t": "quiz", "title": "", "items": [["What is the difference between dependencies and devDependencies?", "`dependencies` are needed to run the app in production. `devDependencies` are only needed to build and test it, such as TypeScript and test tools."], ["What is `package-lock.json` for?", "It records the exact version of every direct and indirect dependency so every install is identical."], ["`npm install` versus `npm ci`?", "`npm install` may update the lock file to satisfy ranges. `npm ci` deletes `node_modules` and installs strictly from the lock file, which is what build servers should do."], ["What does `npx` do?", "Runs a package's command without installing it globally, for example `npx prisma migrate dev`."]]}]}]}, {"name": "Stage 1 · Language", "sub": "The JavaScript you need for servers", "lessons": [{"id": "node-js1", "title": "Values, variables and equality", "level": "Beginner", "mins": "25 min", "blocks": [{"t": "plain", "title": "", "text": "Declare variables with `const` by default and `let` only when you must reassign. Never use `var`.\n\nThe basic value types are `number` (one type for integers and decimals), `string`, `boolean`, `null`, `undefined`, `bigint` and `object`. Arrays and functions are objects.\n\nJavaScript converts between types by itself in ways that surprise people. The rule that removes most surprises: always compare with `===`, never `==`."}, {"t": "bridge", "title": "", "text": "`const` is `let` in Swift and `final` in Dart. `let` is `var`. There are two \"nothing\" values: `undefined` means \"never set\" and `null` means \"deliberately empty\". `?.` and `??` work the same as in Swift and Dart."}, {"t": "code", "lang": "js", "title": "", "code": "const name = \"Asha\";\nlet items = 3;\nitems += 1;\n\nconsole.log(typeof name, typeof items, typeof null, typeof undefined, typeof [], typeof (() => 1));\nconsole.log(0.1 + 0.2, 7 / 2, Math.floor(7 / 2), Number(\"42\") + 1, \"42\" + 1);\n\nconsole.log(1 == \"1\", 1 === \"1\", null == undefined, null === undefined);   // == converts, === does not\n\nconst user = { name: \"Asha\", address: null };\nconsole.log(user.address?.pincode, user.address?.pincode ?? \"no pincode\");\nconsole.log(Boolean(\"\"), Boolean(\"0\"), Boolean(0), Boolean([]), Boolean({}));   // empty array is truthy\n\nconst total = 12345.5;\nconsole.log(`${name} pays ₹${total.toFixed(2)}`, total.toLocaleString(\"en-IN\"));\nconsole.log(Number.MAX_SAFE_INTEGER, 2n ** 64n);   // beyond 2^53 use BigInt or strings", "web": 1}, {"t": "flow", "title": "How a variable declaration behaves", "lanes": [{"name": "", "nodes": [{"n": "Can it be reassigned?"}, {"a": "no"}, {"n": "const"}]}, {"name": "", "nodes": [{"n": "Can it be reassigned?"}, {"a": "yes"}, {"n": "let"}]}, {"name": "", "nodes": [{"n": "Old code uses var"}, {"a": ""}, {"n": "Function-scoped and hoisted"}, {"a": ""}, {"n": "Replace with let or const"}]}]}, {"t": "table", "title": "The falsy values (everything else is truthy)", "rows": [["Value", "Note"], ["`false`", "The boolean itself"], ["`0`, `-0`, `0n`, `NaN`", "Numbers"], ["`\"\"`", "Empty string"], ["`null`, `undefined`", "Nothing"]]}, {"t": "real", "title": "", "text": "A price arrives from a form as the string `\"49\"`. `\"49\" + 1` is `\"491\"`, and that bug charges the wrong amount. Convert and validate at the boundary (`Number(value)` plus a schema check), and keep money as whole paise in an integer, since `0.1 + 0.2` is not `0.3` here either."}, {"t": "pitfalls", "title": "", "items": ["Using `==`. `0 == \"\"` and `null == undefined` are both true.", "`const` does not freeze an object. `const cart = []; cart.push(1)` works. Only the binding is constant.", "`typeof null` is `\"object\"`, a historical bug. Check with `value === null`.", "Ids larger than 2^53 lose precision as numbers. Send them as strings."]}, {"t": "deep", "title": "Coercion rules, number limits and dates", "text": "JavaScript converts types for you when an operator gets something unexpected. Three rules explain almost every surprise.\n\n`+` with a string on either side **joins text**. Every other arithmetic operator converts both sides **to numbers**. And a value that cannot become a number becomes `NaN`, a special number that is not equal to anything, including itself.\n\nAll ordinary numbers are 64-bit floating point. Integers are exact only up to 2^53, and decimal fractions such as 0.1 are approximations. Use whole paise for money and `BigInt` or strings for very large ids.\n\nA `Date` stores one thing: milliseconds since 1970 in UTC. Time zones only appear when you format it. Send and store dates as ISO 8601 strings in UTC, and convert to the user's zone at the edge.\n\n`let` and `const` exist from the top of their block but cannot be read until their line runs. That gap is the **temporal dead zone**, and reading inside it throws."}, {"t": "code", "lang": "js", "title": "", "code": "console.log(1 + \"2\", \"3\" * \"4\", \"10\" / 2, 5 - \"2\", true + true, null + 1, undefined + 1);\nconsole.log([] + [], [1, 2] + [3], +\"\", +\" 12 \", +\"12px\", parseInt(\"12px\"), Number(null), Number(undefined));\n\nconsole.log(NaN === NaN, Number.isNaN(NaN), Object.is(NaN, NaN), [NaN].includes(NaN), [NaN].indexOf(NaN));\nconsole.log(0.1 + 0.2, 0.1 + 0.2 === 0.3, Math.abs(0.1 + 0.2 - 0.3) \u003c Number.EPSILON);\nconsole.log(9007199254740992 === 9007199254740993, Number.isSafeInteger(2 ** 53), 2n ** 64n, typeof 10n);\n\nconst priceInPaise = Math.round(19.99 * 100);            // keep money as integers\nconsole.log(19.99 * 100, priceInPaise, (priceInPaise / 100).toFixed(2));\n\nconst orderId = 12345678901234567890n;\ntry { JSON.stringify({ orderId }); } catch (err) { console.log(\"JSON:\", err.message); }\nconsole.log(JSON.stringify({ orderId: orderId.toString() }));\n\nconst placed = new Date(\"2026-11-11T09:30:00+05:30\");    // an instant, stored as UTC milliseconds\nconsole.log(placed.toISOString(), placed.getTime());\nconst inZone = (zone) => new Intl.DateTimeFormat(\"en-IN\", { timeZone: zone, dateStyle: \"medium\", timeStyle: \"short\" }).format(placed);\nconsole.log(inZone(\"Asia/Kolkata\"), \"|\", inZone(\"America/New_York\"));\nconsole.log(new Date(2026, 0, 31).getMonth(), new Date(\"2026-02-30\").toString());   // months start at 0; 30 February silently rolls over to March\n\ntry {\n  console.log(early);                                    // inside the temporal dead zone\n  let early = 1;\n} catch (err) { console.log(err.name + \":\", err.message); }\n\nconsole.log(typeof [], Array.isArray([]), typeof null, null === null, typeof (class {}), typeof Symbol(\"id\"));", "web": 1}, {"t": "table", "title": "What an operator does with mixed types", "rows": [["Expression", "Result", "Rule"], ["`1 + \"2\"`", "`\"12\"`", "`+` with a string joins"], ["`\"3\" * \"4\"`", "`12`", "Other operators convert to numbers"], ["`[] + []`", "`\"\"`", "Arrays become strings first"], ["`null + 1`", "`1`", "`null` converts to 0"], ["`undefined + 1`", "`NaN`", "`undefined` converts to NaN"], ["`\"12px\" * 1`", "`NaN`", "Not a number"], ["`0 == \"\"`, `null == undefined`", "`true`", "Why you use `===`"]]}, {"t": "steps", "title": "The temporal dead zone", "steps": [{"c": "The block starts. `early` is known to exist but is uninitialised.", "cols": [["Variable early", ["exists", "uninitialised (dead zone)"]], ["Reading it", ["throws ReferenceError"]]]}, {"c": "`console.log(early)` runs before the declaration line.", "cols": [["Variable early", ["exists", "uninitialised (dead zone)"]], ["Reading it", ["!ReferenceError thrown"]]]}, {"c": "Had execution reached `let early = 1`, the dead zone would end.", "cols": [["Variable early", ["1"]], ["Reading it", ["works"]]]}, {"c": "A `var` in the same position would have been `undefined` instead of throwing, which hides the mistake.", "cols": [["Variable early", ["(var) undefined"]], ["Reading it", ["silently undefined"]]]}]}, {"t": "quiz", "title": "", "items": [["`==` versus `===`?", "`==` converts the two sides to a common type before comparing. `===` compares without conversion, so different types are never equal. Use `===`."], ["`null` versus `undefined`?", "`undefined` means a value was never assigned. `null` is an explicit \"no value\". `value ?? fallback` treats both as missing."], ["`var` versus `let` versus `const`?", "`var` is function-scoped and hoisted. `let` and `const` are block-scoped. `const` cannot be reassigned."], ["What is hoisting?", "Declarations are processed before code runs. A `var` is usable (as `undefined`) before its line, and function declarations can be called before they appear. `let` and `const` exist but cannot be read before their line."], ["Why is `0.1 + 0.2 !== 0.3`?", "Numbers are binary floating point, and 0.1 and 0.2 have no exact binary representation. The tiny errors add up. Compare with a tolerance or use integers."], ["What is `NaN` and how do you test for it?", "\"Not a number\", the result of an invalid numeric operation. It is not equal to itself, so test with `Number.isNaN(value)`."], ["What is the largest safe integer?", "2^53 - 1, `Number.MAX_SAFE_INTEGER`. Beyond it integers lose precision. Use `BigInt` or strings."], ["What is the temporal dead zone?", "The span from the start of a block to the line where a `let` or `const` is declared. Reading the variable there throws a `ReferenceError`."], ["How should dates be exchanged between client and server?", "As ISO 8601 strings in UTC, or as epoch milliseconds. Convert to a local time zone only for display."]]}]}, {"id": "node-js2", "title": "Functions, closures and `this`", "level": "Beginner", "mins": "30 min", "blocks": [{"t": "plain", "title": "", "text": "Functions are values. You pass them as arguments, return them and store them. An **arrow function** `(x) => x * 2` is the short form used for callbacks.\n\nA **closure** is a function that keeps access to the variables around it after the outer function has returned. Most Node patterns rely on it: middleware, event handlers, factories.\n\n`this` is the object a method was called on. It depends on **how** the function is called, not where it was written. Arrow functions do not have their own `this`, which is why they are safe as callbacks."}, {"t": "bridge", "title": "", "text": "Arrow functions are Swift closures and Dart lambdas. Closures capture variables the same way. The `this` rules are the part with no equivalent: imagine `self` could silently become `nil` when you pass a method as a callback."}, {"t": "code", "lang": "js", "title": "", "code": "const fee = (total, { member = false, surge = 1 } = {}) => (member || total >= 500 ? 0 : Math.round(20 * surge));\nconsole.log(fee(300), fee(300, { surge: 1.5 }), fee(300, { member: true }));\n\nfunction makeCounter(start = 0) {          // closure: count lives on after makeCounter returns\n  let count = start;\n  return { next: () => ++count, reset: () => (count = start) };\n}\nconst orderIds = makeCounter(183);\nconsole.log(orderIds.next(), orderIds.next());\n\nfunction rateLimiter(limit) {              // a factory that returns a configured function\n  const seen = new Map();\n  return (userId) => {\n    const used = (seen.get(userId) ?? 0) + 1;\n    seen.set(userId, used);\n    return used \u003c= limit;\n  };\n}\nconst allow = rateLimiter(2);\nconsole.log(allow(\"u1\"), allow(\"u1\"), allow(\"u1\"));\n\nconst cart = {\n  items: [\"milk\", \"bread\"],\n  describe() { return `${this.items.length} items`; },\n};\nconst loose = cart.describe;               // method pulled off its object\ntry { loose(); } catch (err) { console.log(\"lost this:\", err.constructor.name); }\nconsole.log(cart.describe(), loose.bind(cart)());\n\nconst sum = (...numbers) => numbers.reduce((a, b) => a + b, 0);   // rest parameters\nconsole.log(sum(62, 45, 540));", "web": 1}, {"t": "steps", "title": "A closure keeps its variable alive", "steps": [{"c": "`makeCounter(183)` runs. A variable `count` is created inside it.", "cols": [["Call stack", ["makeCounter"]], ["Kept in memory", ["count = 183"]]]}, {"c": "It returns an object with two arrow functions and finishes. `count` is not destroyed, because the returned functions still refer to it.", "cols": [["Call stack", []], ["Kept in memory", ["count = 183", "next()", "reset()"]]]}, {"c": "`orderIds.next()` runs. It reads and changes the same `count`.", "cols": [["Call stack", ["next"]], ["Kept in memory", ["count = 184", "next()", "reset()"]]]}, {"c": "Called again. The state persisted between calls, and nothing outside can touch `count` directly.", "cols": [["Call stack", ["next"]], ["Kept in memory", ["count = 185", "next()", "reset()"]]]}]}, {"t": "flow", "title": "What is `this`?", "lanes": [{"name": "", "nodes": [{"n": "Called as obj.method()?"}, {"a": "yes"}, {"n": "this is obj"}]}, {"name": "", "nodes": [{"n": "Called as a bare function?"}, {"a": "yes"}, {"n": "this is undefined (modules are strict)"}]}, {"name": "", "nodes": [{"n": "Arrow function?"}, {"a": "yes"}, {"n": "this comes from the surrounding code"}]}, {"name": "", "nodes": [{"n": "Called with new?"}, {"a": "yes"}, {"n": "this is the new object"}]}]}, {"t": "pitfalls", "title": "", "items": ["Passing a method as a callback (`setTimeout(cart.describe, 0)`) and losing `this`. Wrap it: `() => cart.describe()`.", "A closure holding a large object alive for the life of the server. This is a common memory leak.", "Default parameter objects without `= {}`. Calling `fee(300)` would throw on destructuring."]}, {"t": "deep", "title": "Prototypes, classes and two utilities you will be asked to write", "text": "JavaScript objects inherit from other **objects**, not from classes. Every object has a hidden link to another object called its **prototype**. When you read `obj.method` and the object does not have it, JavaScript follows the link and looks there, then follows that object's link, until it finds the property or reaches the end of the chain.\n\nThe `class` keyword is a cleaner way to set those links up. Methods you write in a class body are stored once, on `ClassName.prototype`, and every instance links to it. Fields set in the constructor are stored on each instance.\n\nClasses add a few features of their own: `#private` fields that are inaccessible from outside, `static` members that belong to the class, and getters that compute a value on access."}, {"t": "code", "lang": "js", "title": "", "code": "class Item {\n  #costPaise;                                   // truly private\n  static created = 0;\n\n  constructor(sku, pricePaise, costPaise) {\n    this.sku = sku;\n    this.pricePaise = pricePaise;\n    this.#costPaise = costPaise;\n    Item.created++;\n  }\n  get marginPercent() { return Math.round(((this.pricePaise - this.#costPaise) / this.pricePaise) * 100); }\n  lineTotal(qty) { return this.pricePaise * qty; }\n}\n\nclass PerishableItem extends Item {\n  constructor(sku, pricePaise, costPaise, expiresInDays) {\n    super(sku, pricePaise, costPaise);          // must run before using this\n    this.expiresInDays = expiresInDays;\n  }\n  lineTotal(qty) {                              // override, reusing the parent\n    const full = super.lineTotal(qty);\n    return this.expiresInDays \u003c= 1 ? Math.round(full * 0.7) : full;\n  }\n}\n\nconst milk = new PerishableItem(\"milk\", 6200, 5000, 1);\nconsole.log(milk.lineTotal(2), milk.marginPercent, Item.created, milk instanceof Item);\nconsole.log(Object.hasOwn(milk, \"sku\"), Object.hasOwn(milk, \"lineTotal\"));            // data on the instance, methods not\nconsole.log(Object.getPrototypeOf(milk) === PerishableItem.prototype,\n            Object.getPrototypeOf(PerishableItem.prototype) === Item.prototype, typeof Item);\n\nfunction OldCart() { this.items = []; }         // how it was written before classes: same mechanism\nOldCart.prototype.add = function (item) { this.items.push(item); return this; };\nconsole.log(new OldCart().add(milk).items.length);\n\nfunction debounce(fn, waitMs) {                 // run only after calls stop for waitMs\n  let timer;\n  return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), waitMs); };\n}\nfunction memoize(fn) {                          // remember results by argument\n  const cache = new Map();\n  return (arg) => { if (!cache.has(arg)) cache.set(arg, fn(arg)); return cache.get(arg); };\n}\nlet lookups = 0;\nconst zoneFor = memoize((pincode) => { lookups++; return `zone-${pincode.slice(0, 3)}`; });\nzoneFor(\"560103\"); zoneFor(\"560103\");\nconst search = debounce((text) => console.log(\"search for\", text, \"| zone lookups:\", lookups), 20);\nsearch(\"mil\"); search(\"milk\");                  // only the last call runs\nawait new Promise((resolve) => setTimeout(resolve, 50));", "web": 1}, {"t": "steps", "title": "Looking up `milk.lineTotal` and `milk.toString`", "steps": [{"c": "`milk.sku`: found on the instance itself.", "cols": [["Searching", ["milk (own fields: sku", "pricePaise", "expiresInDays)"]], ["Result", ["found \"milk\""]]]}, {"c": "`milk.lineTotal`: not on the instance. Follow the prototype link.", "cols": [["Searching", ["PerishableItem.prototype (lineTotal)"]], ["Result", ["found", "the overriding version"]]]}, {"c": "Inside it, `super.lineTotal` starts the search one level further up.", "cols": [["Searching", ["Item.prototype (lineTotal", "marginPercent)"]], ["Result", ["found the parent version"]]]}, {"c": "`milk.toString`: not on any of those. One more link up.", "cols": [["Searching", ["Object.prototype (toString", "hasOwnProperty)"]], ["Result", ["found the built-in"]]]}, {"c": "`milk.nothing`: the chain ends at `null`.", "cols": [["Searching", ["null"]], ["Result", ["undefined", "no error"]]]}]}, {"t": "quiz", "title": "", "items": [["What is a closure?", "A function together with the variables from the scope where it was defined. It can read and update them after the outer function has returned."], ["How do arrow functions differ from normal functions?", "They have no own `this`, `arguments` or `new`. They use `this` from the surrounding scope, which makes them predictable as callbacks."], ["What do `call`, `apply` and `bind` do?", "They set `this` explicitly. `call` and `apply` invoke immediately (arguments listed versus as an array). `bind` returns a new function with `this` fixed."], ["What is a higher-order function?", "A function that takes a function as an argument or returns one, such as `map`, `filter` or an Express middleware factory."], ["What is prototypal inheritance?", "Objects delegate to other objects. Each object has a prototype link, and a property that is not found on the object is looked up along that chain."], ["Is `class` in JavaScript a new object model?", "No. It is syntax over prototypes. Methods live on the constructor's `prototype` object and instances link to it. Classes do add private fields, `static` and stricter rules."], ["`__proto__` versus `prototype`?", "`prototype` is a property of a constructor function or class: the object that becomes the prototype of instances it creates. `__proto__` (better read with `Object.getPrototypeOf`) is an instance's actual link to that object."], ["Debounce versus throttle?", "Debounce waits until calls have stopped for a period and then runs once. Throttle runs at most once per period while calls keep coming."], ["What is memoization?", "Caching a function's results keyed by its arguments so repeated calls with the same input skip the computation. It requires a pure function."]]}]}, {"id": "node-js3", "title": "Arrays, objects and immutability", "level": "Beginner", "mins": "30 min", "blocks": [{"t": "plain", "title": "", "text": "Objects (`{}`) are key-value records and arrays (`[]`) are ordered lists. JSON is this same syntax written as text, which is why JavaScript handles API data so naturally.\n\nThree tools are used constantly: **destructuring** pulls fields out into variables, **spread** (`...`) copies and merges, and the array methods `map`, `filter`, `reduce`, `find` and `some` replace most loops."}, {"t": "bridge", "title": "", "text": "`map` / `filter` / `reduce` are the same as in Swift and Dart. Spread `{ ...order, status: \"packed\" }` is `copyWith`. Objects are reference types like Dart `Map` and Swift classes: assigning one does not copy it."}, {"t": "code", "lang": "js", "title": "", "code": "const cart = [\n  { sku: \"milk\", price: 6200, qty: 2, inStock: true },\n  { sku: \"ghee\", price: 54000, qty: 1, inStock: false },\n  { sku: \"bread\", price: 4500, qty: 1, inStock: true },\n];\n\nconst available = cart.filter((item) => item.inStock);\nconst total = available.reduce((sum, { price, qty }) => sum + price * qty, 0);\nconst bySku = Object.fromEntries(cart.map((item) => [item.sku, item]));\nconsole.log(total, Object.keys(bySku), cart.find((i) => i.sku === \"ghee\")?.price, cart.some((i) => !i.inStock));\n\nconst [first, ...rest] = cart;                         // array destructuring\nconst { sku, price: paise, coupon = \"none\" } = first;  // rename and default\nconsole.log(sku, paise, coupon, rest.length);\n\nconst order = { id: 184, status: \"placed\", items: cart };\nconst packed = { ...order, status: \"packed\" };         // new object, one field changed\nconsole.log(order.status, packed.status, packed.items === order.items);   // spread is shallow\n\nconst sorted = cart.toSorted((a, b) => b.price - a.price);   // does not change the original\nconsole.log(sorted.map((i) => i.sku), cart[0].sku);\n\nconst stock = new Map([[\"milk\", 12]]);                 // Map: any key type, keeps order, has size\nstock.set(\"bread\", 4);\nconst tags = new Set([\"staples\", \"dairy\", \"staples\"]);\nconsole.log(stock.get(\"milk\"), stock.size, [...tags]);\n\nconst json = JSON.stringify(packed);\nconsole.log(JSON.parse(json).items.length, structuredClone(order) !== order);", "web": 1}, {"t": "flow", "title": "A data pipeline", "lanes": [{"name": "", "nodes": [{"n": "Raw rows"}, {"a": ""}, {"n": "filter (keep some)"}, {"a": ""}, {"n": "map (reshape each)"}, {"a": ""}, {"n": "reduce (fold into one value)"}, {"a": ""}, {"n": "Result"}]}]}, {"t": "table", "title": "Does it change the original array?", "rows": [["Changes it", "Returns a new one"], ["`push`, `pop`, `shift`, `splice`", "`concat`, `slice`, spread"], ["`sort`, `reverse`", "`toSorted`, `toReversed`"], ["", "`map`, `filter`, `flatMap`"]]}, {"t": "real", "title": "", "text": "A request handler receives a shared configuration object and \"just adds a field\" to it. Every later request now sees that field, because the object was shared, not copied. Treat inputs as read-only and build new objects with spread. This single habit prevents a class of bugs that only appear under load."}, {"t": "pitfalls", "title": "", "items": ["`array.sort()` without a comparator sorts as strings: `[10, 9, 1]` becomes `[1, 10, 9]`.", "Spread and `Object.assign` copy one level only. Nested objects are still shared. Use `structuredClone` for a deep copy.", "`for...in` on arrays. Use `for...of` or the array methods.", "Using a plain object as a map with user-supplied keys. Use `Map`."]}, {"t": "deep", "title": "References, freezing, grouping, iterators and JSON traps", "text": "Primitives (numbers, strings, booleans) are copied when assigned. Objects and arrays are not: a variable holds a **reference**, and two variables can point at the same object. Passing an object to a function passes that reference, so the function can change the caller's data.\n\n`Object.freeze` makes an object read-only: writing to it throws in modules and classes (and is silently ignored in old non-strict scripts). It is only one level deep. Nested objects stay changeable unless you freeze them too.\n\nAny object can be made usable in `for...of` and spread by implementing `[Symbol.iterator]`. A generator method is the short way to write it.\n\n`JSON.stringify` silently changes data. `undefined` and functions vanish, `NaN` becomes `null`, a `Date` becomes a string and never comes back as a `Date`, and a `Map` becomes `{}`."}, {"t": "code", "lang": "js", "title": "", "code": "let a = 10; let b = a; b++;                                  // primitives: copied\nconst first = { qty: 1 }; const second = first; second.qty++;   // objects: shared\nconsole.log(a, b, first.qty, first === second, { qty: 2 } === { qty: 2 });\n\nfunction addFreeItem(cart) { cart.items.push(\"free sample\"); }   // mutates the caller's object\nconst cart = { items: [\"milk\"] };\naddFreeItem(cart);\nconsole.log(cart.items);\n\nconst config = Object.freeze({ fee: 40, limits: { maxItems: 20 } });\ntry { config.fee = 0; } catch (err) { console.log(err.constructor.name + \":\", err.message); }   // modules are strict: this throws\nconfig.limits.maxItems = 999;                                // nested object is not frozen\nconsole.log(config.fee, config.limits.maxItems, Object.isFrozen(config), Object.isFrozen(config.limits));\nconst deepFreeze = (obj) => { Object.values(obj).forEach((v) => typeof v === \"object\" && v !== null && deepFreeze(v)); return Object.freeze(obj); };\nconsole.log(Object.isFrozen(deepFreeze({ a: { b: 1 } }).a));\n\nconst orders = [{ city: \"blr\", total: 320 }, { city: \"del\", total: 90 }, { city: \"blr\", total: 760 }];\nconst byCity = Object.groupBy(orders, (order) => order.city);\nconst revenue = Object.fromEntries(Object.entries(byCity).map(([city, list]) => [city, list.reduce((s, o) => s + o.total, 0)]));\nconsole.log(Object.keys(byCity), revenue, orders.at(-1).total, orders.flatMap((o) => [o.city, o.total]).length);\n\nclass SlotRange {                                            // usable in for...of and spread\n  constructor(startHour, endHour, lengthHours) { Object.assign(this, { startHour, endHour, lengthHours }); }\n  *[Symbol.iterator]() {\n    for (let h = this.startHour; h + this.lengthHours \u003c= this.endHour; h += this.lengthHours) yield `${h}-${h + this.lengthHours}`;\n  }\n}\nconsole.log([...new SlotRange(7, 13, 2)]);\n\nconst original = { id: 184, coupon: undefined, placedAt: new Date(\"2026-11-11T04:00:00Z\"), ratio: NaN, tags: new Set([\"a\"]), meta: new Map([[\"k\", 1]]) };\nconst roundTrip = JSON.parse(JSON.stringify(original));\nconsole.log(roundTrip, typeof roundTrip.placedAt);\nconst revived = JSON.parse(JSON.stringify(original), (key, value) => (key === \"placedAt\" ? new Date(value) : value));\nconst cloned = structuredClone(original);\nconsole.log(revived.placedAt instanceof Date, cloned.placedAt instanceof Date, cloned.tags.has(\"a\"), cloned.meta.get(\"k\"));\n\nconsole.log([\"Zebra\", \"apple\", \"Mango\"].sort(), [\"Zebra\", \"apple\", \"Mango\"].toSorted((x, y) => x.localeCompare(y)));", "web": 1}, {"t": "steps", "title": "Two variables, one object", "steps": [{"c": "`const first = { qty: 1 }` creates an object and stores a reference to it.", "cols": [["Variables", ["first"]], ["Object in memory", ["{ qty: 1 }"]]]}, {"c": "`const second = first` copies the reference, not the object.", "cols": [["Variables", ["first", "second (same object)"]], ["Object in memory", ["{ qty: 1 }"]]]}, {"c": "`second.qty++` changes the one object. Both variables see it.", "cols": [["Variables", ["first", "second (same object)"]], ["Object in memory", ["{ qty: 2 }"]]]}, {"c": "`{ ...first }` would create a second object with the same top-level fields.", "cols": [["Variables", ["first", "second", "copy (new object)"]], ["Object in memory", ["{ qty: 2 } and { qty: 2 }"]]]}]}, {"t": "table", "title": "What survives `JSON.stringify` then `JSON.parse`", "rows": [["Value", "After the round trip"], ["`undefined`, functions, symbols", "Removed (or `null` inside arrays)"], ["`NaN`, `Infinity`", "`null`"], ["`Date`", "An ISO string, not a `Date`"], ["`Map`, `Set`", "`{}`"], ["`BigInt`", "Throws"], ["Class instance", "A plain object: methods are gone"]]}, {"t": "quiz", "title": "", "items": [["`map` versus `forEach`?", "`map` returns a new array of the callback results. `forEach` returns nothing and is only for side effects."], ["Shallow copy versus deep copy?", "A shallow copy duplicates the top level and shares nested objects. A deep copy (`structuredClone`) duplicates everything."], ["`Map` versus plain object?", "`Map` accepts any key type, keeps insertion order, has `size` and has no inherited keys. Plain objects are best for fixed-shape records."], ["How do you remove duplicates from an array?", "`[...new Set(array)]`."], ["Are objects passed by value or by reference?", "The reference is passed by value. The function gets a copy of the reference, so it can mutate the object but reassigning its parameter does not affect the caller."], ["Is `Object.freeze` deep?", "No. It prevents changes to the object's own properties only. Nested objects must be frozen separately."], ["What makes an object iterable?", "A `[Symbol.iterator]` method that returns an iterator: an object with `next()` returning `{ value, done }`. Generators implement it for you."], ["`JSON.parse(JSON.stringify(x))` versus `structuredClone(x)`?", "The JSON trick loses dates, maps, sets and `undefined`, and fails on BigInt and cycles. `structuredClone` preserves those types and handles cycles, but cannot clone functions."], ["Why does `[\"b\", \"a\", \"C\"].sort()` put \"C\" first?", "The default sort compares UTF-16 code units, where capital letters come before lowercase. Pass a comparator such as `localeCompare`."]]}]}, {"id": "node-mod", "title": "Modules: import, export and CommonJS", "level": "Beginner", "mins": "20 min", "blocks": [{"t": "plain", "title": "", "text": "Each file is a module with its own scope. `export` makes something available and `import` brings it in. This standard system is called **ES modules (ESM)**.\n\nNode also has an older system, **CommonJS**, which uses `require()` and `module.exports`. You will meet both. New projects should use ESM by setting `\"type\": \"module\"` in `package.json`."}, {"t": "bridge", "title": "", "text": "A named export is a public top-level declaration in Swift or Dart. `import { fee } from \"./pricing.js\"` is `import 'pricing.dart' show fee;`. A default export is one unnamed main thing per file."}, {"t": "code", "lang": "js", "title": "", "code": "// pricing.js would contain:\nexport const GST_RATE = 0.05;\nexport function withTax(paise) {\n  return Math.round(paise * (1 + GST_RATE));\n}\nexport default class Cart {\n  items = [];\n  add(item) { this.items.push(item); return this; }\n}\n\n// another file would then write:\n//   import Cart, { withTax, GST_RATE } from \"./pricing.js\";\n//   import * as pricing from \"./pricing.js\";\n//   const { default: Cart } = await import(\"./pricing.js\");   // load on demand\n\nimport { readFile } from \"node:fs/promises\";       // built-in modules use the node: prefix\nimport path from \"node:path\";\nimport { fileURLToPath } from \"node:url\";\n\nconst here = path.dirname(fileURLToPath(import.meta.url));   // ESM has no __dirname\nconst text = await readFile(fileURLToPath(import.meta.url), \"utf8\");   // top-level await works in ESM\nconsole.log(withTax(20000), path.basename(here).length > 0, text.length > 100);"}, {"t": "table", "title": "ESM versus CommonJS", "rows": [["Topic", "ES modules", "CommonJS"], ["Syntax", "`import` / `export`", "`require()` / `module.exports`"], ["Loading", "Asynchronous, analysed before running", "Synchronous, at the line that calls it"], ["Top-level `await`", "Yes", "No"], ["`__dirname`", "Not available, use `import.meta.url`", "Available"], ["File extension in imports", "Required (`./pricing.js`)", "Optional"], ["Turned on by", "`\"type\": \"module\"` or `.mjs`", "Default, or `.cjs`"]]}, {"t": "flow", "title": "How an import is resolved", "lanes": [{"name": "", "nodes": [{"n": "import \"x\""}, {"a": ""}, {"n": "Starts with ./ or ../ ?"}, {"a": "yes"}, {"n": "File relative to this file"}]}, {"name": "", "nodes": [{"n": "Starts with node: ?"}, {"a": "yes"}, {"n": "Built-in module"}]}, {"name": "", "nodes": [{"n": "Otherwise"}, {"a": ""}, {"n": "Look in node_modules, walking up folders"}, {"a": ""}, {"n": "Read that package's package.json \"exports\""}]}]}, {"t": "pitfalls", "title": "", "items": ["Leaving the `.js` extension off a relative import in ESM.", "Using `__dirname` or `require` in an ES module.", "Circular imports between two files, which leave one side `undefined` at load time."]}, {"t": "deep", "title": "Module instances, live bindings, cycles and package entry points", "text": "A module is evaluated **once per process**, the first time it is imported. Every other import receives the same instance. That is why a module that exports a database pool or a counter behaves as a singleton, and also why module-level state is shared by every request.\n\nES module exports are **live bindings**. An importer does not get a copy of the value. It sees the exporter's variable, including later changes. CommonJS, in contrast, hands over a snapshot of `module.exports`.\n\n**Circular imports** are legal, but one of the two modules is evaluated first and sees the other's exports before they are initialised. Reading o
