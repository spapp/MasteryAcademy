 promisify } from \"node:util\";\n\nfunction unsafeMerge(target, source) {\n  for (const key in source) {\n    if (typeof source[key] === \"object\" && source[key] !== null) {\n      target[key] ??= {};\n      unsafeMerge(target[key], source[key]);\n    } else target[key] = source[key];\n  }\n  return target;\n}\nfunction safeMerge(target, source) {\n  for (const key of Object.keys(source)) {\n    if (key === \"__proto__\" || key === \"constructor\" || key === \"prototype\") continue;\n    if (typeof source[key] === \"object\" && source[key] !== null) target[key] = safeMerge(target[key] ?? {}, source[key]);\n    else target[key] = source[key];\n  }\n  return target;\n}\nconst attack = JSON.parse('{\"name\": \"Asha\", \"__proto__\": {\"isAdmin\": true}}');\nunsafeMerge({}, attack);\nconsole.log(\"after unsafe merge, a brand new object says isAdmin:\", {}.isAdmin);\ndelete Object.prototype.isAdmin;\nsafeMerge({}, attack);\nconsole.log(\"after safe merge:\", {}.isAdmin);\n\nconst time = (fn) => { const start = performance.now(); fn(); return `${(performance.now() - start).toFixed(1)} ms`; };\nconst evil = /^(a+)+$/;                                   // nested quantifier: catastrophic backtracking\nconst safe = /^a+$/;\nfor (const length of [18, 22, 26]) {\n  const input = \"a\".repeat(length) + \"!\";\n  console.log(`input length ${length + 1}: vulnerable ${time(() => evil.test(input))}, safe ${time(() => safe.test(input))}`);\n}\n\nconst ROOT = \"/srv/uploads\";\nfunction resolveUpload(name) {\n  const full = path.resolve(ROOT, name);\n  if (!full.startsWith(ROOT + path.sep)) throw new Error(\"path escapes the upload folder\");\n  return full;\n}\nfor (const name of [\"invoice-184.pdf\", \"../../etc/passwd\", \"a/../../secret.txt\"]) {\n  try { console.log(name, \"->\", resolveUpload(name)); } catch (err) { console.log(name, \"-> blocked:\", err.message); }\n}\n\nconst run = promisify(execFile);\nconst userInput = \"report.txt; echo INJECTED\";\nconst { stdout } = await run(\"echo\", [\"archiving\", userInput]);   // an argument, never parsed by a shell\nconsole.log(stdout.trim());"}, {"t": "steps", "title": "How `__proto__` in JSON reaches every object", "steps": [{"c": "The request body is parsed. `JSON.parse` creates an ordinary own property literally named `__proto__`.", "cols": [["Request object", ["{ name", "\"__proto__\": { isAdmin: true } }"]], ["Object.prototype", ["(clean)"]]]}, {"c": "The merge loop reaches the key `__proto__`. Reading `target[\"__proto__\"]` returns the real `Object.prototype`.", "cols": [["Request object", ["(being merged)"]], ["Object.prototype", ["(clean", "about to be written)"]]]}, {"c": "The loop recurses into it and assigns `isAdmin = true`.", "cols": [["Request object", ["(being merged)"]], ["Object.prototype", ["isAdmin = true"]]]}, {"c": "Every object in the process now inherits it. A later check `if (user.isAdmin)` passes for everyone.", "cols": [["Request object", ["(done)"]], ["Object.prototype", ["!isAdmin = true", "visible on all objects"]]]}]}, {"t": "table", "title": "Defences", "rows": [["Attack", "Defence"], ["Prototype pollution", "Validate with a schema that drops unknown keys, skip `__proto__` / `constructor` / `prototype`, use `Map` or `Object.create(null)` for dictionaries"], ["ReDoS", "Avoid nested quantifiers, limit input length before matching, use a linear-time engine (`re2`) for user-supplied patterns"], ["Path traversal", "Resolve the path and verify it stays inside the root, or map ids to stored file names"], ["Command injection", "`execFile` or `spawn` with an argument array, never `exec` with interpolated input"], ["Dependency compromise", "Lock file, `npm audit`, review new dependencies, pin and update on a schedule"]]}, {"t": "quiz", "title": "", "items": [["What is the most common API vulnerability?", "Broken object level authorisation: the user is authenticated, but the server does not check that the requested object belongs to them."], ["What is mass assignment?", "Copying a whole request body onto a database record, which lets a client set fields it should not control, such as a role. Pick allowed fields explicitly."], ["How do you store secrets?", "Outside the code and the image: environment variables injected by the platform or a secret manager, with different values per environment and a rotation process."], ["What does helmet do?", "It sets HTTP response headers with safe defaults, such as a content security policy and no MIME sniffing. They matter mainly for browser clients."], ["What is prototype pollution?", "Writing attacker-controlled properties onto `Object.prototype`, usually through an unsafe recursive merge or path-set with keys like `__proto__`. All objects then inherit them."], ["What is ReDoS?", "A regular expression whose matching time grows exponentially on crafted input because of backtracking, blocking the event loop. Nested quantifiers such as `(a+)+` are the classic cause."], ["How do you serve user-named files safely?", "Resolve the requested name against the root directory and confirm the result is still inside it, or avoid user-supplied paths by looking up a stored name by id."], ["`exec` versus `execFile`?", "`exec` runs a string through a shell, so special characters in input are interpreted. `execFile` runs a program with an argument array and no shell, so input stays data."], ["What is a supply-chain attack?", "Malicious code arriving through a dependency: a compromised or typo-squatted package. Mitigate with lock files, audits, minimal dependencies and careful updates."]]}]}, {"id": "node-deploy", "title": "Deploy and operate", "level": "Expert", "mins": "35 min", "blocks": [{"t": "plain", "title": "", "text": "A Node service is packaged as a Docker image and run as several identical copies behind a load balancer. The platform (Kubernetes, ECS, a PaaS) restarts copies that crash and replaces them during a deploy.\n\nTwo behaviours make that safe: a **health endpoint** the platform can poll, and **graceful shutdown**, which means that when told to stop, the process stops accepting new requests, finishes the ones in flight, closes its database connections and then exits."}, {"t": "bridge", "title": "", "text": "Think of app lifecycle callbacks. `SIGTERM` is the server's `applicationWillTerminate`: a short window to finish work and clean up before the process is killed."}, {"t": "code", "lang": "text", "title": "Dockerfile", "code": "FROM node:22-slim AS build\nWORKDIR /app\nCOPY package*.json ./\nRUN npm ci\nCOPY . .\nRUN npm run build && npm prune --omit=dev\n\nFROM node:22-slim\nWORKDIR /app\nENV NODE_ENV=production\nCOPY --from=build /app/node_modules ./node_modules\nCOPY --from=build /app/dist ./dist\nUSER node\nEXPOSE 3000\nCMD [\"node\", \"dist/server.js\"]"}, {"t": "code", "lang": "js", "title": "Graceful shutdown", "code": "import { createServer } from \"node:http\";\n\nlet shuttingDown = false;\nconst server = createServer((req, res) => {\n  if (req.url === \"/health\") {\n    res.writeHead(shuttingDown ? 503 : 200).end();        // 503 tells the load balancer to stop sending traffic\n    return;\n  }\n  res.end(\"ok\");\n});\nserver.listen(process.env.PORT ?? 3000);\n\nasync function shutdown(signal) {\n  if (shuttingDown) return;\n  shuttingDown = true;\n  console.log(JSON.stringify({ level: \"info\", msg: \"shutdown.start\", signal }));\n  const force = setTimeout(() => process.exit(1), 25_000);   // do not hang forever\n  force.unref();\n  await new Promise((resolve) => server.close(resolve));     // stop accepting, finish in-flight requests\n  // await pool.end(); await queue.close();\n  process.exit(0);\n}\nprocess.on(\"SIGTERM\", () => shutdown(\"SIGTERM\"));\nprocess.on(\"SIGINT\", () => shutdown(\"SIGINT\"));"}, {"t": "steps", "title": "A rolling deploy with no dropped requests", "steps": [{"c": "Three copies of version 1 serve traffic.", "cols": [["Running", ["v1", "v1", "v1"]], ["Receiving traffic", ["all three"]]]}, {"c": "The platform starts one copy of version 2 and waits for its health check to pass.", "cols": [["Running", ["v1", "v1", "v1", "v2 (starting)"]], ["Receiving traffic", ["v1", "v1", "v1"]]]}, {"c": "Version 2 is healthy. One v1 copy receives `SIGTERM`. Its health check turns 503 and it finishes in-flight requests.", "cols": [["Running", ["v1", "v1", "v1 (draining)", "v2"]], ["Receiving traffic", ["v1", "v1", "v2"]]]}, {"c": "The drained copy exits. The cycle repeats for the others.", "cols": [["Running", ["v1", "v2", "v2"]], ["Receiving traffic", ["v1", "v2", "v2"]]]}, {"c": "All copies run version 2. No request was cut off.", "cols": [["Running", ["v2", "v2", "v2"]], ["Receiving traffic", ["all three"]]]}]}, {"t": "flow", "title": "Pipeline", "lanes": [{"name": "", "nodes": [{"n": "git push"}, {"a": ""}, {"n": "CI: lint, tsc, tests"}, {"a": ""}, {"n": "docker build"}, {"a": ""}, {"n": "Push image"}, {"a": ""}, {"n": "Deploy to staging"}, {"a": ""}, {"n": "Smoke tests"}, {"a": ""}, {"n": "Rolling deploy to production"}, {"a": ""}, {"n": "Watch errors and p95"}, {"a": ""}, {"n": "Roll back if worse"}]}]}, {"t": "table", "title": "Observability", "rows": [["Pillar", "Tool examples", "Answers"], ["Logs", "pino to stdout, collected by the platform", "What happened in this request"], ["Metrics", "Prometheus client, OpenTelemetry", "How many, how fast, how many failing"], ["Traces", "OpenTelemetry", "Where time went across services"]]}, {"t": "pitfalls", "title": "", "items": ["No graceful shutdown. Every deploy drops in-flight requests and users see errors.", "`NODE_ENV` not set to `production`. Express then skips optimisations and may expose error details.", "Wrapping `node` in `npm start` inside the container. Signals may not reach your process.", "One instance. Any deploy or crash is downtime."]}, {"t": "deep", "title": "Draining requests, readiness and using every core", "text": "The sample below proves what \"graceful\" means. A slow request is in flight when shutdown starts. `server.close()` stops the server from accepting new connections but lets the open one finish. A new request is refused, the slow one completes, and only then does the server report closed.\n\nIn production the sequence is driven by the platform. It sends `SIGTERM`, your process turns its **readiness** check to \"not ready\" so the load balancer stops routing to it, drains, and exits before the grace period ends. **Liveness** is a different question: \"is this process stuck and in need of a restart\". Do not make liveness depend on the database, or a database outage will restart every instance in a loop.\n\nTo use all CPU cores, run one process per core. The container platform usually does that with replicas. On a single machine, the `cluster` module forks workers that share one port."}, {"t": "code", "lang": "js", "title": "", "code": "import { createServer } from \"node:http\";\nimport { setTimeout as sleep } from \"node:timers/promises\";\n\nlet ready = true;\nconst server = createServer(async (req, res) => {\n  if (req.url === \"/ready\") { res.writeHead(ready ? 200 : 503).end(); return; }\n  if (req.url === \"/slow-order\") await sleep(150);        // an in-flight request\n  res.setHeader(\"connection\", \"close\");\n  res.end(`completed ${req.url}`);\n});\nawait new Promise((resolve) => server.listen(0, resolve));\nconst base = `http://127.0.0.1:${server.address().port}`;\nconst started = Date.now();\nconst at = () => `${String(Date.now() - started).padStart(3)} ms`;\n\nconst inFlight = fetch(`${base}/slow-order`).then((r) => r.text());\nawait sleep(30);\n\nconsole.log(at(), \"SIGTERM received: readiness off, stop accepting\");\nready = false;\nconst closed = new Promise((resolve) => server.close(resolve));\n\nconst late = await fetch(`${base}/new-order`).then(() => \"accepted\", (err) => `refused (${err.cause?.code})`);\nconsole.log(at(), \"new request during shutdown:\", late);\nconst finished = await inFlight;\nconsole.log(at(), \"in-flight request:\", finished);\nawait closed;\nconsole.log(at(), \"server closed, safe to exit\");"}, {"t": "code", "lang": "js", "title": "One process per core with cluster", "code": "import cluster from \"node:cluster\";\nimport { availableParallelism } from \"node:os\";\nimport { createServer } from \"node:http\";\n\nif (cluster.isPrimary) {\n  for (let i = 0; i \u003c availableParallelism(); i++) cluster.fork();\n  cluster.on(\"exit\", (worker, code) => {\n    console.log(`worker ${worker.process.pid} exited (${code}), starting a replacement`);\n    cluster.fork();\n  });\n} else {\n  createServer((req, res) => res.end(`handled by ${process.pid}`)).listen(3000);   // all workers share port 3000\n}"}, {"t": "steps", "title": "What the platform and your process do on a deploy", "steps": [{"c": "The platform sends `SIGTERM` to an old instance and starts a grace timer, often 30 seconds.", "cols": [["Instance state", ["serving"]], ["Load balancer", ["routing to it"]], ["In-flight requests", ["12"]]]}, {"c": "Your handler flips readiness to 503 and calls `server.close()`.", "cols": [["Instance state", ["draining"]], ["Load balancer", ["sees not-ready", "stops routing"]], ["In-flight requests", ["12"]]]}, {"c": "Open requests finish. No new ones arrive.", "cols": [["Instance state", ["draining"]], ["Load balancer", ["not routing"]], ["In-flight requests", ["0"]]]}, {"c": "You close the database pool and queue connections, then exit with code 0.", "cols": [["Instance state", ["exited cleanly"]], ["Load balancer", ["not routing"]], ["In-flight requests", ["0"]]]}, {"c": "If the process were still alive when the timer ends, it would be killed with `SIGKILL` and anything in flight would be lost.", "cols": [["Instance state", ["(killed)"]], ["Load balancer", ["not routing"]], ["In-flight requests", ["!dropped"]]]}]}, {"t": "table", "title": "Liveness and readiness", "rows": [["Check", "Question", "Should test", "On failure the platform"], ["Liveness", "Is the process stuck?", "Only that the event loop responds", "Restarts the container"], ["Readiness", "Can it serve traffic now?", "Startup finished, not shutting down, critical dependencies reachable", "Stops routing to it, does not restart"], ["Startup", "Has it finished booting?", "Migrations checked, caches warmed", "Waits before applying the other checks"]]}, {"t": "quiz", "title": "", "items": [["What is graceful shutdown?", "On a termination signal the process stops accepting new work, completes in-flight requests, closes connections and exits within a time limit."], ["Why run several instances of a single-threaded runtime?", "To use all CPU cores, to survive the crash of one instance and to deploy without downtime."], ["What does PM2 do?", "It is a process manager for Node on plain servers: starts several instances, restarts them on crashes and reloads without downtime. Container platforms provide the same things, so PM2 is usually unnecessary there."], ["What would you alert on?", "Error rate, p95 latency, event loop delay, memory growth, restarts and saturation of the database pool."], ["What does `server.close()` do?", "It stops the server from accepting new connections and calls back once existing connections have ended. In-flight requests are allowed to finish."], ["Why separate liveness from readiness?", "A dependency outage should take instances out of rotation, not restart them. Liveness failing restarts the process, so it should only detect a stuck process."], ["What is the cluster module?", "A way to fork several Node processes that share a listening port, so one machine uses all cores. The primary can restart workers that die."], ["Why can long-lived connections break graceful shutdown?", "Keep-alive and WebSocket connections stay open, so `close()` may never complete. Close idle connections, tell clients to reconnect, and enforce a deadline."], ["What exit code should a process use?", "0 for a clean, intended exit and non-zero for failure, so the platform and scripts can tell the difference."]]}]}, {"id": "node-ai", "title": "AI features from Node", "level": "Advanced", "mins": "35 min", "blocks": [{"t": "plain", "title": "", "text": "Node is a good front door for AI features: it is strong at streaming and at holding many slow connections open, which is exactly what model calls need. The model providers ship official TypeScript SDKs, so calling a model looks like any other async client.\n\nThe architecture is the same as in the Python track. The phone talks to your server, your server holds the API key, adds context and rules, calls the model and streams the answer back."}, {"t": "bridge", "title": "", "text": "This is the server that sits behind the chat screen you would build in SwiftUI or Flutter. The SSE events it writes are what your `AsyncSequence` or Dart `Stream` reads on the client."}, {"t": "code", "lang": "bash", "title": "", "code": "npm install @anthropic-ai/sdk zod\nexport ANTHROPIC_API_KEY=\"...\"        # from the console; never ship it in an app"}, {"t": "code", "lang": "js", "title": "One call", "code": "import Anthropic from \"@anthropic-ai/sdk\";\n\nconst client = new Anthropic();       // reads ANTHROPIC_API_KEY from the environment\n\ntry {\n  const response = await client.beta.messages.create({\n    model: \"claude-opus-5-5\",\n    max_tokens: 16000,\n    betas: [\"server-side-fallback-2026-07-01\"],\n    fallbacks: \"default\",             // if the request is declined, retry on a fallback model\n    system: \"You are a grocery assistant. Answer in two short sentences.\",\n    messages: [{ role: \"user\", content: \"I have paneer, capsicum and onions. What can I cook?\" }],\n  });\n  if (response.stop_reason === \"refusal\") console.log(\"The model declined this request.\");\n  for (const block of response.content) {\n    if (block.type === \"text\") console.log(block.text);\n  }\n  console.log(\"tokens in/out:\", response.usage.input_tokens, response.usage.output_tokens);\n} catch (err) {\n  if (err instanceof Anthropic.RateLimitError) console.error(\"Rate limited. Back off and retry later.\");\n  else if (err instanceof Anthropic.APIError) console.error(\"API error\", err.status);\n  else throw err;\n}"}, {"t": "code", "lang": "js", "title": "Streaming to the phone through Express", "code": "import Anthropic from \"@anthropic-ai/sdk\";\nimport express from \"express\";\n\nconst client = new Anthropic();\nconst app = express();\napp.use(express.json({ limit: \"20kb\" }));\n\napp.post(\"/assistant\", async (req, res) => {\n  res.writeHead(200, { \"content-type\": \"text/event-stream\", \"cache-control\": \"no-cache\" });\n  const stream = client.messages.stream({\n    model: \"claude-opus-5-5\",\n    max_tokens: 64000,\n    system: \"You are a cooking assistant for a grocery app.\",\n    messages: [{ role: \"user\", content: String(req.body.question ?? \"\") }],\n  });\n  res.on(\"close\", () => stream.abort());              // user left the screen: stop paying for tokens\n\n  try {\n    for await (const event of stream) {\n      if (event.type === \"content_block_delta\" && event.delta.type === \"text_delta\") {\n        res.write(`data: ${JSON.stringify({ text: event.delta.text })}\\n\\n`);\n      }\n    }\n    const final = await stream.finalMessage();\n    res.write(`event: done\\ndata: ${JSON.stringify({ outputTokens: final.usage.output_tokens })}\\n\\n`);\n  } catch (err) {\n    res.write(`event: error\\ndata: ${JSON.stringify({ message: \"assistant unavailable\" })}\\n\\n`);\n  } finally {\n    res.end();\n  }\n});"}, {"t": "code", "lang": "js", "title": "Tools: the SDK runs the loop", "code": "import Anthropic from \"@anthropic-ai/sdk\";\nimport { betaZodTool } from \"@anthropic-ai/sdk/helpers/beta/zod\";\nimport { z } from \"zod\";\n\nconst client = new Anthropic();\nconst ORDERS = { 184: { status: \"out_for_delivery\", etaMinutes: 12 } };\n\nconst getOrderStatus = betaZodTool({\n  name: \"get_order_status\",\n  description: \"Look up the delivery status of one order by its numeric id.\",\n  inputSchema: z.object({ orderId: z.number().int().describe(\"The order id, for example 184\") }),\n  run: async ({ orderId }) => JSON.stringify(ORDERS[orderId] ?? { error: \"no such order\" }),\n});\n\nconst finalMessage = await client.beta.messages.toolRunner({\n  model: \"claude-opus-5-5\",\n  max_tokens: 16000,\n  system: \"You are a support assistant. Use tools for facts. Never guess an order status.\",\n  tools: [getOrderStatus],\n  messages: [{ role: \"user\", content: \"Where is order 184?\" }],\n});\nfor (const block of finalMessage.content) {\n  if (block.type === \"text\") console.log(block.text);\n}"}, {"t": "steps", "title": "One streamed answer, three machines", "steps": [{"c": "The app posts a question. Express writes the SSE headers and opens a stream to the model.", "cols": [["Model API", ["thinking"]], ["Node server", ["connection open", "0 bytes buffered"]], ["Phone", ["spinner"]]]}, {"c": "The first text delta arrives. Node writes one SSE event immediately.", "cols": [["Model API", ["\"Heat\""]], ["Node server", ["forwards \"Heat\""]], ["Phone", ["Heat"]]]}, {"c": "Deltas keep arriving. The event loop handles other users between them.", "cols": [["Model API", ["\" oil in a pan\""]], ["Node server", ["forwards", "serves other requests"]], ["Phone", ["Heat oil in a pan"]]]}, {"c": "The user leaves the screen. The response closes, and the handler aborts the model stream.", "cols": [["Model API", ["stopped"]], ["Node server", ["stream.abort()"]], ["Phone", ["(closed)"]]]}]}, {"t": "flow", "title": "Request path", "lanes": [{"name": "", "nodes": [{"n": "Phone"}, {"a": ""}, {"n": "POST /assistant"}, {"a": ""}, {"n": "Auth + rate limit"}, {"a": ""}, {"n": "Build messages (system, history, retrieved context)"}, {"a": ""}, {"n": "*Model stream"}, {"a": ""}, {"n": "SSE to phone"}, {"a": ""}, {"n": "Log tokens and latency"}]}]}, {"t": "pitfalls", "title": "", "items": ["Shipping the model API key inside the mobile app or a browser bundle.", "No per-user rate limit or token budget on an AI endpoint.", "Not aborting the model request when the client disconnects.", "Letting the model call tools that act with more authority than the logged-in user. Check permissions inside each tool's `run`.", "Treating the model's text as trusted. Validate structured output with Zod before using it."]}, {"t": "deep", "title": "The tool loop by hand, typed output and cheaper repeated prompts", "text": "Three additions make the earlier examples production-shaped.\n\n**The loop by hand.** The SDK's tool runner is the default, but writing the loop once shows what it does: send messages and tool definitions, run every `tool_use` block the model returns, send back one `tool_result` per block in a single user message, and repeat until the model stops asking.\n\n**Typed output.** A Zod schema describes the object you want. The SDK asks the model to fill it and returns a parsed, validated value, so your code never parses free text.\n\n**Prompt caching.** When every request starts with the same long system prompt or policy document, mark the request for caching. The repeated prefix is then billed at a fraction and answered faster. Keep the stable text first and the changing question last."}, {"t": "code", "lang": "js", "title": "The loop written out", "code": "import Anthropic from \"@anthropic-ai/sdk\";\n\nconst client = new Anthropic();\nconst ORDERS = { 184: { status: \"out_for_delivery\", etaMinutes: 12 } };\n\nconst tools = [{\n  name: \"get_order_status\",\n  description: \"Look up the delivery status of one order by its numeric id.\",\n  input_schema: {\n    type: \"object\",\n    properties: { order_id: { type: \"integer\", description: \"The order id, for example 184\" } },\n    required: [\"order_id\"],\n    additionalProperties: false,\n  },\n  strict: true,\n}];\n\nasync function executeTool(name, input, user) {\n  if (name === \"get_order_status\") {\n    const order = ORDERS[input.order_id];                 // production: also check the order belongs to user\n    return order ? { content: JSON.stringify(order) } : { content: \"no such order\", is_error: true };\n  }\n  return { content: `unknown tool ${name}`, is_error: true };\n}\n\nconst messages = [{ role: \"user\", content: \"Where is order 184?\" }];\nlet response;\nfor (let turn = 0; turn \u003c 8; turn++) {                    // a hard cap on iterations\n  response = await client.messages.create({ model: \"claude-opus-5-5\", max_tokens: 16000, tools, messages });\n  messages.push({ role: \"assistant\", content: response.content });       // the whole content array\n  if (response.stop_reason !== \"tool_use\") break;\n\n  const toolUses = response.content.filter((block) => block.type === \"tool_use\");\n  const results = await Promise.all(toolUses.map(async (block) => ({     // run in parallel\n    type: \"tool_result\",\n    tool_use_id: block.id,\n    ...(await executeTool(block.name, block.input, { id: 7 })),\n  })));\n  messages.push({ role: \"user\", content: results });                     // all results in one message\n}\nconsole.log(response.content.find((block) => block.type === \"text\")?.text);"}, {"t": "code", "lang": "js", "title": "Typed output and caching", "code": "import Anthropic from \"@anthropic-ai/sdk\";\nimport { zodOutputFormat } from \"@anthropic-ai/sdk/helpers/zod\";\nimport { readFile } from \"node:fs/promises\";\nimport { z } from \"zod\";\n\nconst client = new Anthropic();\n\nconst ParsedList = z.object({\n  lines: z.array(z.object({ product: z.string(), quantity: z.number(), unit: z.string() })),\n  unclear: z.array(z.string()),\n});\n\nconst parsed = await client.messages.parse({\n  model: \"claude-opus-5-5\",\n  max_tokens: 16000,\n  system: \"Turn a shopping note into cart lines. Put anything you cannot identify in `unclear`.\",\n  messages: [{ role: \"user\", content: \"2 kg aloo, half litre milk, dhaniya and that biscuit we had last time\" }],\n  output_config: { format: zodOutputFormat(ParsedList) },\n});\nfor (const line of parsed.parsed_output.lines) console.log(line.quantity, line.unit, line.product);\n\nconst policy = await readFile(\"refund_policy.md\", \"utf8\");    // long and identical on every request\nconst answer = await client.messages.create({\n  model: \"claude-opus-5-5\",\n  max_tokens: 16000,\n  cache_control: { type: \"ephemeral\" },                        // cache the stable prefix\n  system: `You answer from this policy only.\\n\\n${policy}`,\n  messages: [{ role: \"user\", content: \"Can I return opened milk?\" }],   // the changing part goes last\n});\nconsole.log(answer.usage.cache_creation_input_tokens, answer.usage.cache_read_input_tokens);"}, {"t": "steps", "title": "Two tool calls in one turn", "steps": [{"c": "The user asks about two orders. The model returns two `tool_use` blocks in one assistant message.", "cols": [["Assistant message", ["tool_use A (order 184)", "tool_use B (order 185)"]], ["Your code", []], ["Next user message", []]]}, {"c": "Your code runs both at the same time with `Promise.all`.", "cols": [["Assistant message", ["tool_use A", "tool_use B"]], ["Your code", ["running A and B in parallel"]], ["Next user message", []]]}, {"c": "Both results go back in a single user message, each matched to its request by id.", "cols": [["Assistant message", ["tool_use A", "tool_use B"]], ["Your code", []], ["Next user message", ["tool_result A", "tool_result B"]]]}, {"c": "The model reads both and writes one answer covering both orders.", "cols": [["Assistant message", ["\"184 arrives in 12 minutes. 185 was delivered.\""]], ["Your code", []], ["Next user message", []]]}]}, {"t": "table", "title": "Limits to put around an AI endpoint", "rows": [["Limit", "Where", "Protects against"], ["Input length", "Validation, before the model call", "Huge prompts and cost"], ["`max_tokens`", "Request parameter", "Runaway output"], ["Loop iterations", "Your loop or the runner's setting", "An agent that never finishes"], ["Requests per user per minute", "Rate limiter", "Abuse and bill shock"], ["Tokens per user per day", "Usage table updated from `response.usage`", "A slow drain"], ["Timeout and abort on disconnect", "`AbortSignal`, `stream.abort()`", "Paying for unread answers"]]}, {"t": "quiz", "title": "", "items": [["Why is Node a good fit for serving model responses?", "Model calls are long, mostly idle network waits with incremental output. The event loop holds many such streams at once with little memory."], ["How do you stream a model answer to a client?", "Open a streaming request to the model, and for each text delta write a server-sent event to the HTTP response. End with a final event carrying usage data, and abort upstream if the client disconnects."], ["Should AI logic live in Python or Node?", "Either can call model APIs. Choose Python when you need its data and ML libraries (pandas, evaluation tools, model training). Choose Node when the AI feature is part of an existing Node or TypeScript product and mostly orchestrates API calls."], ["How do you protect an AI endpoint?", "Authenticate, rate-limit per user, cap input size and `max_tokens`, validate outputs, check permissions inside tools and log usage per user."], ["What must each `tool_result` contain?", "Its type, the `tool_use_id` of the request it answers, and the content. Add `is_error: true` when the tool failed."], ["Why send all tool results in one message?", "The API expects every `tool_use` from an assistant turn to be answered in the next user turn. Splitting them breaks the pairing and discourages the model from calling tools in parallel."], ["How do you get typed data from a model in TypeScript?", "Define a Zod schema and pass it as the output format. The SDK returns a parsed object validated against the schema."], ["When does prompt caching pay off?", "When many requests share a long identical prefix such as a system prompt, tool definitions or a document, and arrive close enough together for the cache to still be warm."], ["Where do you enforce per-user AI budgets?", "On your server: record tokens from each response's usage against the user and refuse or degrade when a limit is reached."]]}]}, {"id": "node-cap", "title": "Capstone: live order tracking service", "level": "Expert", "mins": "2 to 3 weekends", "blocks": [{"t": "plain", "title": "", "text": "Build one service that exercises the whole track: a TypeScript API for orders with live tracking and an assistant. It is the Node twin of the Python capstone, so building both shows you where the two ecosystems differ in practice."}, {"t": "flow", "title": "System at the end", "lanes": [{"name": "", "nodes": [{"n": "App"}, {"a": ""}, {"n": "Express or Fastify (Zod, JWT)"}, {"a": ""}, {"n": "PostgreSQL (Prisma) + Redis (cache, BullMQ, pub/sub)"}]}, {"name": "", "nodes": [{"n": "Rider app"}, {"a": ""}, {"n": "WebSocket"}, {"a": ""}, {"n": "API instance"}, {"a": ""}, {"n": "Redis pub/sub"}, {"a": ""}, {"n": "API instance"}, {"a": ""}, {"n": "Customer app"}]}, {"name": "", "nodes": [{"n": "Worker process"}, {"a": ""}, {"n": "BullMQ jobs: invoice, notification"}]}, {"name": "", "nodes": [{"n": "App"}, {"a": ""}, {"n": "POST /assistant"}, {"a": ""}, {"n": "*Model stream with tools"}, {"a": ""}, {"n": "SSE"}]}]}, {"t": "table", "title": "Milestones", "rows": [["Milestone", "You build", "Lessons used"], ["1", "TypeScript project, `/health`, `/orders` in memory, tests", "Setup, TypeScript, Express, testing"], ["2", "Zod validation and central error middleware", "Zod, errors"], ["3", "PostgreSQL schema, migrations, stock-safe order placement", "Database"], ["4", "Signup, login, JWT middleware, ownership checks", "Auth, security"], ["5", "Config validation, JSON logs with request ids", "Structure"], ["6", "Slot cache and an invoice queue with a worker", "Caching and queues"], ["7", "Live rider location over WebSocket with Redis pub/sub, two instances", "Real-time"], ["8", "CSV export as a stream, PDF generation in a worker thread", "Streams, workers"], ["9", "`/assistant` with streaming and a `get_order_status` tool", "AI"], ["10", "Dockerfile, graceful shutdown, load test, dashboard", "Deploy, performance"]]}, {"t": "table", "title": "Definition of done", "rows": [["Check", "How to prove it"], ["Two buyers cannot both get the last item", "A test that fires 20 concurrent orders at stock 1"], ["A user cannot join another order's tracking room", "A test that expects the socket to be closed"], ["A 200 ms CPU task does not raise p95 for other routes", "Load test with event loop delay on the dashboard"], ["Deploys drop no requests", "Run a load test during a rolling restart"], ["Memory is flat after an hour of load", "Heap graph"]]}, {"t": "real", "title": "", "text": "\"Design live order tracking\" is a standard system design interview question. Having built it, you can talk concretely about where connections live, how updates fan out across instances, how often to send positions, what happens when the phone loses signal and how the whole thing is deployed without dropping connections."}, {"t": "real", "title": "Starter code on your Mac", "text": "A starter project for this capstone is in `~/Documents/Backend-Academy-Starters/node-order-tracking`. Milestones 1, 2 and 5 already work: the TypeScript project, Zod validation with central error handling, and validated config with request-id logs. Every later milestone has a `MILESTONE n` note at the place in the code where it belongs.\n\nIt models the same orders domain as the Python starter, with the same rules and checks, so you can compare the two file by file. Your first exercise is milestone 3 in `src/repos/orders.ts`."}, {"t": "code", "lang": "bash", "title": "", "code": "cd ~/Documents/Backend-Academy-Starters/node-order-tracking\nnpm install\nnpm run smoke\nnpm run dev                                    # then call http://localhost:3000/health"}, {"t": "quiz", "title": "", "items": [["What is the first thing that breaks when this service gets ten times the traffic?", "Usually the database: connection limits and slow queries. Then in-memory state that assumed one instance. Measure before guessing."], ["How would you split this into services later?", "Along lines that scale differently: the real-time gateway (many idle connections), the order API (transactional) and workers (CPU and retries), communicating through a queue or event stream."]]}]}]}]}, {"id": "both", "name": "Side by side", "tagline": "compare + plan", "stages": [{"name": "Big picture", "sub": "What a backend is, in any language", "lessons": [{"id": "both-sys", "title": "How a backend fits together", "level": "Layman", "mins": "20 min", "blocks": [{"t": "plain", "title": "", "text": "A backend is a set of programs that run on computers you control and answer requests from apps. Whatever language you pick, the same boxes appear. Learn the boxes once and every architecture diagram becomes readable.\n\nThe **API server** runs your code. The **database** remembers things. The **cache** remembers recent answers so they are fast. The **queue** holds work to do later, and **workers** do it. The **load balancer** spreads requests over several copies of the API server. **Object storage** holds files such as images."}, {"t": "analogy", "title": "", "text": "A restaurant. The waiter is the API: takes orders, never cooks. The kitchen ticket rail is the queue. Cooks are workers. The pantry is the database. The counter of ready-made snacks is the cache. The host at the door, sending guests to free tables, is the load balancer."}, {"t": "bridge", "title": "", "text": "From the app you only ever saw one box: a base URL. Everything in this lesson sits behind that URL. Timeouts, 5xx errors and \"works on retry\" behaviour you have seen from the client are these boxes being slow, restarting or overloaded."}, {"t": "flow", "title": "The standard picture", "lanes": [{"name": "", "nodes": [{"n": "Phone app"}, {"a": ""}, {"n": "DNS + TLS"}, {"a": ""}, {"n": "Load balancer"}, {"a": ""}, {"n": "*API servers (many copies)"}, {"a": ""}, {"n": "Database (PostgreSQL)"}]}, {"name": "", "nodes": [{"n": "API servers (many copies)"}, {"a": ""}, {"n": "Cache (Redis)"}]}, {"name": "", "nodes": [{"n": "API servers (many copies)"}, {"a": ""}, {"n": "Queue"}, {"a": ""}, {"n": "Workers"}, {"a": ""}, {"n": "Email, push, payments, AI model"}]}, {"name": "", "nodes": [{"n": "API servers (many copies)"}, {"a": ""}, {"n": "Object storage + CDN (images, files)"}]}]}, {"t": "steps", "title": "\"Place order\", box by box", "steps": [{"c": "The app sends `POST /orders` with a token.", "cols": [["Box doing the work", ["Load balancer"]], ["What it does", ["Picks a healthy API server"]]]}, {"c": "The API server verifies the token and validates the body.", "cols": [["Box doing the work", ["API server"]], ["What it does", ["Auth + validation"]]]}, {"c": "Delivery slots for the pincode are needed. They were looked up a minute ago.", "cols": [["Box doing the work", ["Cache"]], ["What it does", ["Returns slots in 1 ms"]]]}, {"c": "The order, its items and the stock change are written together.", "cols": [["Box doing the work", ["Database"]], ["What it does", ["One transaction"]]]}, {"c": "The invoice email and push notification are slow and can be retried.", "cols": [["Box doing the work", ["Queue"]], ["What it does", ["Stores two jobs"]]]}, {"c": "The API answers `201 Created`. Total time about 80 ms.", "cols": [["Box doing the work", ["API server"]], ["What it does", ["Sends the response"]]]}, {"c": "A moment later a worker sends the email and the push.", "cols": [["Box doing the work", ["Worker"]], ["What it does", ["Runs the jobs", "retries on failure"]]]}]}, {"t": "table", "title": "Which box fixes which problem", "rows": [["Problem", "Box"], ["Too many requests for one machine", "Load balancer + more API copies"], ["The same expensive read again and again", "Cache"], ["A slow step the user need not wait for", "Queue + worker"], ["Data must never be half-saved", "Database transaction"], ["Large files", "Object storage + CDN"], ["One part needs to scale differently", "Split it into its own service"]]}, {"t": "pitfalls", "title": "", "items": ["Adding boxes before you need them. Start with an API and a database. Add a cache or queue when a measurement asks for it.", "Keeping important state inside an API server's memory. Copies come and go, so state belongs in the database or cache."]}, {"t": "quiz", "title": "", "items": [["What is the difference between a web server, an API server and a database?", "A web server accepts HTTP connections. An API server runs application code that turns requests into responses. A database stores data durably and answers queries. One program can play the first two roles."], ["Vertical versus horizontal scaling?", "Vertical means a bigger machine. Horizontal means more machines behind a load balancer. Horizontal needs stateless servers and gives redundancy as well as capacity."], ["What is a load balancer?", "A component that distributes incoming requests across healthy server instances and stops sending traffic to ones that fail health checks."], ["Monolith versus microservices?", "A monolith is one deployable application. Microservices are several small ones that communicate over the network. Start with a well-structured monolith and split only where teams or scaling needs force it."], ["What is a CDN?", "A network of servers close to users that caches static content such as images, so it is served quickly and your servers do less work."]]}]}, {"id": "both-pick", "title": "Python or Node: how to choose", "level": "Beginner", "mins": "15 min", "blocks": [{"t": "plain", "title": "", "text": "Both can build any backend you are likely to need. The choice is mostly about the **libraries around the job** and the **team around you**, not raw speed. For most APIs the database is the slow part, and it is the same database in both.\n\nA fair summary: Python is the stronger choice when data or AI work is central. Node is the stronger choice when the workload is real-time, or when the team already writes TypeScript for the web. Learning both, in that order, makes you useful on either kind of team."}, {"t": "table", "title": "Head to head", "rows": [["Topic", "Python", "Node.js"], ["Reads like", "Plain English, indentation", "C-style braces, JavaScript quirks"], ["Types", "Optional hints + mypy / pyright", "TypeScript, used almost everywhere"], ["Concurrency", "asyncio, threads, processes; GIL limits CPU threads", "One event loop; worker threads for CPU"], ["Raw speed of the language", "Slower", "Faster (JIT-compiled by V8)"], ["I/O-heavy API throughput", "Good with async", "Very good by default"], ["Real-time connections", "Good (FastAPI WebSockets)", "Excellent, the home ground"], ["AI, ML and data libraries", "The centre of the ecosystem", "SDKs for model APIs, little beyond that"], ["Web frameworks", "FastAPI, Django, Flask", "Express, Fastify, NestJS"], ["Validation", "Pydantic", "Zod"], ["Package manager", "pip / uv", "npm / pnpm"], ["Shares code with a web front end", "No", "Yes, same language and types"], ["Common in", "AI teams, data platforms, fintech, startups", "Product companies, real-time apps, BFF layers"]]}, {"t": "flow", "title": "A decision path", "lanes": [{"name": "", "nodes": [{"n": "Is training models, data analysis or heavy ML central?"}, {"a": "yes"}, {"n": "Python"}]}, {"name": "", "nodes": [{"n": "Is it mainly real-time (chat, tracking, live dashboards)?"}, {"a": "yes"}, {"n": "Node.js"}]}, {"name": "", "nodes": [{"n": "Does the team already write TypeScript for web or React Native?"}, {"a": "yes"}, {"n": "Node.js"}]}, {"name": "", "nodes": [{"n": "Is it an API that calls model APIs and a database?"}, {"a": "either"}, {"n": "Whichever the team knows"}]}, {"name": "", "nodes": [{"n": "Still unsure?"}, {"a": ""}, {"n": "Python for AI-leaning roles, Node for product-leaning roles"}]}]}, {"t": "real", "title": "", "text": "A common production shape uses both. A Node or TypeScript \"backend for frontend\" serves the apps: auth, aggregation, WebSockets. Python services sit behind it for recommendations, search ranking and AI features. They talk over HTTP or a queue. Knowing both lets you follow a request across that boundary."}, {"t": "bridge", "title": "", "text": "You have lived this choice already: Swift versus Kotlin for native, Flutter for both. The backend version is similar. Each side can do the other's job, each has a home ground, and many companies run both."}, {"t": "pitfalls", "title": "", "items": ["Choosing by benchmark charts. A missing database index costs more than any language difference.", "Rewriting a working service in the other language for taste.", "Learning both at once from zero. Get one to the \"deployed API with tests\" level first."]}, {"t": "quiz", "title": "", "items": [["Is Node faster than Python?", "For CPU-bound JavaScript versus Python code, usually yes, because V8 compiles to machine code. For typical APIs the time is spent in the database and network, so the practical difference is small."], ["When would you choose Python over Node?", "When the service depends on the data and ML ecosystem: pandas, NumPy, model training, evaluation tooling, or when the team is Python-first."], ["When would you choose Node over Python?", "For real-time, connection-heavy services, for a backend-for-frontend sharing TypeScript types with web clients, or when the team is JavaScript-first."], ["Can a company use both?", "Yes, and many do: each service picks the language that suits it, and they communicate through HTTP, gRPC or a message queue."]]}]}, {"id": "both-same", "title": "The same endpoint in both languages", "level": "Intermediate", "mins": "30 min", "blocks": [{"t": "plain", "title": "", "text": "The fastest way to see how alike the two ecosystems are is to build one endpoint twice. The task: `POST /orders` validates a body, applies a pricing rule and returns the created order, with a 422 for bad input.\n\nRead the two versions next to each other. The shape is identical: declare a schema, register a route, call a plain function with the business rule, return JSON."}, {"t": "code", "lang": "python", "title": "FastAPI + Pydantic", "code": "from fastapi import FastAPI\nfrom fastapi.testclient import TestClient\nfrom pydantic import BaseModel, Field\n\nclass Item(BaseModel):\n    sku: str = Field(min_length=1)\n    price: int = Field(gt=0)          # paise\n    qty: int = Field(gt=0, le=20)\n\nclass OrderIn(BaseModel):\n    items: list[Item] = Field(min_length=1)\n    member: bool = False\n\ndef price_order(order: OrderIn) -> dict:            # the business rule: no web code\n    subtotal = sum(i.price * i.qty for i in order.items)\n    fee = 0 if order.member or subtotal >= 50_000 else 4_000\n    return {\"subtotal\": subtotal, \"delivery_fee\": fee, \"total\": subtotal + fee}\n\napp = FastAPI()\n\n@app.post(\"/orders\", status_code=201)\ndef create_order(order: OrderIn) -> dict:\n    return {\"id\": 1, \"status\": \"placed\", **price_order(order)}\n\nclient = TestClient(app)\nprint(client.post(\"/orders\", json={\"items\": [{\"sku\": \"milk\", \"price\": 6200, \"qty\": 2}]}).json())\nprint(client.post(\"/orders\", json={\"items\": []}).status_code)"}, {"t": "code", "lang": "js", "title": "Express + Zod", "code": "import express from \"express\";\nimport { z } from \"zod\";\n\nconst Item = z.object({\n  sku: z.string().min(1),\n  price: z.number().int().positive(),          // paise\n  qty: z.number().int().positive().max(20),\n});\nconst OrderIn = z.object({ items: z.array(Item).min(1), member: z.boolean().default(false) });\n\nfunction priceOrder(order) {                   // the business rule: no web code\n  const subtotal = order.items.reduce((sum, i) => sum + i.price * i.qty, 0);\n  const deliveryFee = order.member || subtotal >= 50_000 ? 0 : 4_000;\n  return { subtotal, deliveryFee, total: subtotal + deliveryFee };\n}\n\nconst app = express();\napp.use(express.json());\napp.post(\"/orders\", (req, res) => {\n  const parsed = OrderIn.safeParse(req.body);\n  if (!parsed.success) return res.status(422).json({ issues: parsed.error.issues });\n  res.status(201).json({ id: 1, status: \"placed\", ...priceOrder(parsed.data) });\n});\n\nconst server = app.listen(0);\nawait new Promise((resolve) => server.once(\"listening\", resolve));\nconst post = (body) => fetch(`http://127.0.0.1:${server.address().port}/orders`, {\n  method: \"POST\", headers: { \"content-type\": \"application/json\" }, body: JSON.stringify(body),\n});\nconsole.log(await (await post({ items: [{ sku: \"milk\", price: 6200, qty: 2 }] })).json());\nconsole.log((await post({ items: [] })).status);\nserver.close();\nserver.closeAllConnections();"}, {"t": "flow", "title": "The shared shape", "lanes": [{"name": "", "nodes": [{"n": "JSON body"}, {"a": ""}, {"n": "Schema validates (Pydantic / Zod)"}, {"a": ""}, {"n": "Invalid?"}, {"a": "yes"}, {"n": "422 with details"}]}, {"name": "", "nodes": [{"n": "Invalid?"}, {"a": "no"}, {"n": "Plain function applies the rule"}, {"a": ""}, {"n": "201 with JSON"}]}]}, {"t": "table", "title": "Phrase book", "rows": [["Idea", "Python", "JavaScript / TypeScript"], ["Variable", "`total = 0`", "`let total = 0` / `const`"], ["Nothing", "`None`", "`null`, `undefined`"], ["String formatting", "`f\"{name} pays {total}\"`", "`${name} pays ${total}` inside backtick quotes"], ["List transform", "`[x * 2 for x in xs if x > 0]`", "`xs.filter(x => x > 0).map(x => x * 2)`"], ["Dictionary", "`{\"id\": 1}`, `d.get(\"id\")`", "`{ id: 1 }`, `d.id`, `d?.id`"], ["Function", "`def fee(total, *, member=False):`", "`const fee = (total, { member = false } = {}) =>`"], ["Anonymous function", "`lambda x: x * 2`", "`x => x * 2`"], ["Class with data", "`@dataclass class Item:`", "`class Item {}` / TS `interface Item {}`"], ["Error handling", "`try / except / finally`, `raise`", "`try / catch / finally`, `throw`"], ["Async call", "`await client.get(url)`", "`await fetch(url)`"], ["Run together", "`asyncio.gather(a(), b())`", "`Promise.all([a(), b()])`"], ["Lazy sequence", "generator with `yield`", "generator `function*`, async iterators"], ["Wrap a function", "decorator `@retry`", "higher-order function, middleware"], ["Import", "`from app.pricing import fee`", "`import { fee } from \"./pricing.js\"`"], ["Dependencies file", "`pyproject.toml`", "`package.json`"], ["Test", "`def test_x(): assert ...`", "`it(\"x\", () => assert.equal(...))`"]]}, {"t": "bridge", "title": "", "text": "Both rows of that table are close to what you write daily. Python's comprehensions and keyword arguments feel like Swift. JavaScript's arrow functions, `async` / `await` and `?.` / `??` feel like Dart."}, {"t": "pitfalls", "title": "", "items": ["Carrying one language's habits into the other: `==` in JavaScript, mutable default arguments in Python.", "Assuming FastAPI's automatic 422 exists in Express. In Node you call the schema yourself or add a validation middleware."]}, {"t": "quiz", "title": "", "items": [["What does FastAPI do automatically that Express does not?", "It reads type hints to parse and validate the body, query and path parameters, returns 422 on failure, and generates OpenAPI documentation. In Express you add a validator and documentation tooling yourself."], ["Why keep the pricing rule in a plain function in both versions?", "It can be unit tested without HTTP and reused from a queue worker, a script or another endpoint."], ["Pydantic versus Zod?", "Both validate and convert untrusted data against a schema and give typed results. Pydantic schemas are classes with type hints. Zod schemas are built with function calls and TypeScript infers the type from them."]]}]}, {"id": "both-conc", "title": "Concurrency compared", "level": "Advanced", "mins": "25 min", "blocks": [{"t": "plain", "title": "", "text": "Both runtimes handle many requests the same basic way: one thread runs your code, and waiting happens somewhere else. The differences are in the details, and interviewers like those details.\n\nIn Node the event loop is always on. Every I/O call is non-blocking by default and you cannot avoid the model. In Python the event loop is opt-in. Normal Python code blocks, and you choose `asyncio` (with async libraries) when you want the same behaviour. Python also has the GIL, which stops threads from running Python code in parallel."}, {"t": "table", "title": "Same question, two answers", "rows": [["Question", "Python", "Node.js"], ["Default style", "Blocking, synchronous", "Non-blocking, asynchronous"], ["Event loop", "`asyncio`, started with `asyncio.run`", "Built in, always running"], ["Blocking libraries exist?", "Many (`requests`, sync DB drivers), must avoid in async code", "Few (`*Sync` functions)"], ["Run I/O together", "`asyncio.gather`", "`Promise.all`"], ["Parallel CPU work", "`multiprocessing`, `ProcessPoolExecutor`", "`worker_threads`"], ["Threads share memory?", "Yes, but the GIL lets one run Python at a time", "Workers have separate heaps"], ["Escape hatch for blocking code", "`asyncio.to_thread(func)`", "Move to a worker or a queue"], ["Scale across cores", "Several worker processes (uvicorn `--workers`)", "Several processes (cluster, replicas)"], ["Typical mistake", "Sync call inside `async def`", "Heavy loop on the main thread"]]}, {"t": "steps", "title": "Three requests arrive at once. Each needs a 100 ms database query.", "steps": [{"c": "Sync Python with one worker: requests are handled one after another.", "cols": [["Sync Python (1 worker)", ["request 1 running"]], ["Async Python / Node", []], ["Done after", []]]}, {"c": "The first finishes at 100 ms, the second at 200 ms, the third at 300 ms. More workers or threads are needed to do better.", "cols": [["Sync Python (1 worker)", ["request 3 finishing"]], ["Async Python / Node", []], ["Done after", ["sync = 300 ms"]]]}, {"c": "Async Python or Node: all three queries are started immediately. The single thread is free while the database works.", "cols": [["Sync Python (1 worker)", []], ["Async Python / Node", ["3 queries in flight", "thread idle"]], ["Done after", []]]}, {"c": "All three results come back at about 100 ms and each handler resumes in turn.", "cols": [["Sync Python (1 worker)", []], ["Async Python / Node", ["3 responses sent"]], ["Done after", ["async = about 100 ms"]]]}, {"c": "Now each request needs 100 ms of CPU instead. Async does not help: one thread, 300 ms total, in both languages.", "cols": [["Sync Python (1 worker)", ["300 ms"]], ["Async Python / Node", ["300 ms", "and everything else is blocked meanwhile"]], ["Done after", ["use processes or worker threads"]]]}]}, {"t": "flow", "title": "Choosing a concurrency tool", "lanes": [{"name": "", "nodes": [{"n": "Waiting on network or disk?"}, {"a": ""}, {"n": "Python: asyncio (or threads) / Node: just await"}]}, {"name": "", "nodes": [{"n": "Heavy computation, short?"}, {"a": ""}, {"n": "Python: process pool / Node: worker thread pool"}]}, {"name": "", "nodes": [{"n": "Heavy computation, long or retryable?"}, {"a": ""}, {"n": "Queue + separate worker processes in both"}]}, {"name": "", "nodes": [{"n": "Need every CPU core for request handling?"}, {"a": ""}, {"n": "Run several processes behind a load balancer in both"}]}]}, {"t": "bridge", "title": "", "text": "Dart isolates and the single UI thread are the closest mental model for both. \"Never block the main thread\" from mobile becomes \"never block the event loop\" here, with the difference that the thread you block is shared by every user."}, {"t": "pitfalls", "title": "", "items": ["Saying \"Node is single-threaded\" or \"Python cannot do concurrency\" without the qualifications. Both statements are half true and interviewers probe the other half.", "Using async for CPU-bound code and expecting a speed-up."]}, {"t": "quiz", "title": "", "items": [["Concurrency versus parallelism?", "Concurrency is dealing with many tasks by interleaving them, possibly on one core. Parallelism is executing several tasks at the same instant on several cores. An event loop gives concurrency. Processes and worker threads give parallelism."], ["How does the GIL compare with Node's single thread?", "Both mean only one thread executes your language-level code at a time. Python can still have many OS threads that take turns and overlap on I/O. Node has one JavaScript thread by design and offloads I/O to the system and libuv."], ["Blocking versus non-blocking I/O?", "A blocking call makes the thread wait until the operation completes. A non-blocking call returns immediately and reports completion later through a callback, promise or awaitable."], ["Why does async code handle more connections with less memory than threads?", "A waiting coroutine or promise is a small object on the heap. A waiting thread holds a full stack and costs a context switch to resume."]]}]}]}, {"name": "Plan and practice", "sub": "From this page to a job-ready skill", "lessons": [{"id": "both-plan", "title": "A 14-week plan", "level": "Beginner", "mins": "10 min", "blocks": [{"t": "plain", "title": "", "text": "The plan assumes about eight hours a week alongside a full-time job: one hour on weekdays and three at the weekend. Python comes first because it is easier to read and it is where the AI work is. Node follows quickly, since half of what you learned (HTTP, SQL, auth, queues, deployment) carries over unchanged.\n\nEach week ends with something that runs. If a week produces only notes, repeat it."}, {"t": "table", "title": "Weeks 1 to 14", "rows": [["Week", "Focus", "Lessons", "You finish with"], ["1", "Python basics", "Stage 0, 1", "A script that totals a cart from a JSON file"], ["2", "Data structures, functions", "Stage 2", "Reports from a CSV of orders using dicts and comprehensions"], ["3", "Modules, errors, classes, types", "Stage 3", "A small typed pricing package with tests"], ["4", "Generators, decorators, async", "Stage 4", "An async script that fetches three URLs together with timeouts"], ["5", "HTTP, FastAPI, Pydantic", "Backend 1 to 3", "Orders API in memory with validation and docs"], ["6", "Database and auth", "Backend 4 to 5", "The API on PostgreSQL with login and ownership checks"], ["7", "Structure, tests, jobs, real-time", "Backend 6 to 9", "Tests in CI, a background job, live status over SSE"], ["8", "Deploy", "Backend 10", "The API running in Docker on a cloud host"], ["9", "AI basics", "AI 1 to 4", "A streaming `/assistant` endpoint"], ["10", "Tools, RAG, evals", "AI 5 to 7", "Assistant with two tools, policy search and a 20-case eval"], ["11", "Node and JavaScript", "Node stages 0 to 1", "The week 1 to 3 exercises redone in TypeScript"], ["12", "Async core and Express", "Node stages 2 to 3", "The orders API rebuilt in Node with Zod and PostgreSQL"], ["13", "Real-time and scale", "Node stage 4", "Live tracking over WebSocket across two instances"], ["14", "Production and review", "Node stage 5", "Both capstones deployed, interview questions rehearsed"]]}, {"t": "flow", "title": "A weekday hour", "lanes": [{"name": "", "nodes": [{"n": "10 min: reread yesterday's quiz answers aloud"}, {"a": ""}, {"n": "35 min: type the lesson's code, change it, break it"}, {"a": ""}, {"n": "15 min: write three lines on what surprised you"}]}]}, {"t": "flow", "title": "A weekend block", "lanes": [{"name": "", "nodes": [{"n": "Pick one milestone of the capstone"}, {"a": ""}, {"n": "Build it without looking at the lesson"}, {"a": ""}, {"n": "Stuck for 20 minutes? Look"}, {"a": ""}, {"n": "Write a test"}, {"a": ""}, {"n": "Commit and push"}]}]}, {"t": "table", "title": "How to know a stage is done", "rows": [["Stage", "You can do this without notes"], ["Language", "Explain mutable defaults (Python) or closures (JS) and write a generator"], ["Async", "Draw the event loop and predict the print order of a snippet"], ["Backend", "Build a validated endpoint with a database write and a test in 30 minutes"], ["Auth", "Explain what stops user A reading user B's order, and show the line of code"], ["Real-time", "Explain how an update reaches a phone connected to a different server"], ["AI", "Explain tokens, context, tools and RAG to a non-developer, then show working code"], ["Production", "Describe what you would look at first when p95 doubles"]]}, {"t": "bridge", "title": "", "text": "You already have the hardest part: years of reading other people's code and debugging against real APIs. Keep relating each backend idea to the client behaviour you have seen, because that link is your advantage over someone learning from zero."}, {"t": "pitfalls", "title": "", "items": ["Watching videos instead of typing code. Recognition is not recall.", "Starting three frameworks at once. One per language until the capstone works.", "Skipping tests and deployment because they feel like chores. They are what interviews and jobs ask about."]}, {"t": "quiz", "title": "", "items": [["Why Python before Node in this plan?", "Python has less syntax to learn, AI material is Python first, and the backend concepts learned once transfer directly to Node."], ["What should every week produce?", "Something that runs: a script, an endpoint, a test suite or a deployment. Running code exposes the gaps that reading hides."]]}]}, {"id": "both-iv", "title": "Backend interview questions that apply to both", "level": "Advanced", "mins": "30 min", "blocks": [{"t": "plain", "title": "", "text": "Language questions are covered inside each lesson. This page holds the questions that are asked whichever language you use: API design, data, reliability and scaling. Answer each aloud in under a minute before opening it.\n\nA good answer has three parts: a one-sentence definition, why it matters, and a concrete example from something you built or used. As a mobile developer, your examples from the client side are valid and often better than textbook ones."}, {"t": "flow", "title": "A structure for system design answers", "lanes": [{"name": "", "nodes": [{"n": "Clarify requirements and scale"}, {"a": ""}, {"n": "Define the API"}, {"a": ""}, {"n": "Sketch the data model"}, {"a": ""}, {"n": "Draw the boxes"}, {"a": ""}, {"n": "Walk one request through"}, {"a": ""}, {"n": "Find the bottleneck"}, {"a": ""}, {"n": "Discuss failure and trade-offs"}]}]}, {"t": "table", "title": "Numbers worth remembering", "rows": [["Thing", "Rough size"], ["Memory read", "Nanoseconds"], ["Redis read on the same network", "About 1 ms"], ["Indexed database query", "1 to 10 ms"], ["Call to another service in the same region", "10 to 50 ms"], ["Mobile network round trip", "100 to 400 ms"], ["Language model first token", "300 ms to a few seconds"], ["One small server", "Hundreds to a few thousand simple requests per second"]]}, {"t": "quiz", "title": "", "items": [["What makes an API RESTful?", "Resources identified by URLs, standard HTTP methods with their usual meanings, stateless requests, and standard status codes. For example `GET /orders/184`, `POST /orders`, `PATCH /orders/184`."], ["REST versus GraphQL versus gRPC?", "REST is resource URLs over HTTP and JSON, simple and cacheable. GraphQL lets the client ask for exactly the fields it needs from one endpoint, useful for varied screens. gRPC uses binary Protocol Buffers over HTTP/2 with generated clients, common between internal services."], ["How do you make a payment endpoint safe to retry?", "The client sends a unique idempotency key. The server stores the key with the result and returns the stored result if the same key arrives again, instead of charging twice."], ["How do you version an API when old app versions stay in use for years?", "Only make additive changes within a version: new optional fields, new endpoints. Never remove or rename fields. For breaking changes add `/v2` or a version header and keep the old one until usage drops."], ["How do you paginate a large list?", "Cursor pagination: return a cursor pointing at the last item and ask for items after it. It stays correct when rows are inserted and stays fast on large tables, unlike large `OFFSET` values."], ["SQL versus NoSQL?", "SQL databases give relations, joins, transactions and a fixed schema, and suit most business data. NoSQL stores (document, key-value, wide-column) trade some of that for flexible schemas or horizontal scale on specific access patterns."], ["What is database replication and what is replication lag?", "Copies of the primary database receive its changes and serve reads. Lag is the delay before a write appears on a replica, which can make a just-written value seem missing if read from a replica."], ["What is the CAP theorem in one sentence?", "When a network partition happens, a distributed system must choose between staying consistent and staying available. It cannot guarantee both."], ["How do you rate-limit an API?", "Count requests per key (user or IP) in a shared store such as Redis using a fixed window, sliding window or token bucket, and return 429 with a `Retry-After` header when the limit is passed."], ["What is a circuit breaker?", "A wrapper around calls to a dependency that stops calling it for a while after repeated failures, failing fast instead, then lets a few test calls through to see if it has recovered."], ["What happens when you type a URL and press enter?", "DNS resolves the name to an IP, a TCP connection and TLS handshake are made, the HTTP request is sent, a load balancer forwards it to a server, the server responds, and the client renders the response."], ["How would you design live order tracking?", "Riders send positions over a WebSocket or frequent posts. The API publishes each update to a pub/sub channel per order. API instances holding customer connections subscribe and push updates. Store the latest position in Redis and send it first on reconnect."], ["How do you deploy a database schema change without downtime?", "In steps that keep old and new code working: add the new column as nullable, deploy code that writes both, backfill, switch reads, then remove the old column in a later release."], ["An endpoint became slow. How do you investigate?", "Confirm with metrics which route and since when. Check recent deploys. Look at traces or logs for where time is spent. If it is a query, read its plan. If it is CPU, profile. Fix, then add an alert."], ["What is eventual consistency?", "Different parts of a system may briefly show different values after a write, and converge to the same value shortly after. It is the price of replicas, caches and asynchronous messaging."], ["How do services communicate asynchronously?", "Through a message broker. One service publishes an event such as \"order placed\", and other services consume it when they can. The publisher does not wait and does not need to know the consumers."]]}]}]}]}]}</script>
<script>
(() => {  // one function scope: the Python engine defines its own globals
const DATA = JSON.parse(document.getElementById('data').textContent);
const LEVELS = ['Layman','Beginner','Intermediate','Advanced','Expert'];
const DOT = {py:'var(--py)', node:'var(--node)', both:'var(--both)'};
const $ = (s, r=document) => r.querySelector(s);
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const inline = s => esc(s).replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');

const flat = [];
DATA.tracks.forEach(t => t.stages.forEach(st => st.lessons.forEach(l => flat.push({t, st, l}))));
const byId = Object.fromEntries(flat.map(x => [x.l.id, x]));

let done = new Set();
try { done = new Set(JSON.parse(localStorage.getItem('pna-done') || '[]')); } catch (e) {}
const saveDone = () => { try { localStorage.setItem('pna-done', JSON.stringify([...done])); } catch (e) {} };

const KW = {
  python: 'False|None|True|and|as|assert|async|await|break|class|continue|def|del|elif|else|except|finally|for|from|global|if|import|in|is|lambda|nonlocal|not|or|pass|raise|return|try|while|with|yield|match|case',
  js: 'async|await|break|case|catch|class|const|continue|default|delete|do|else|export|extends|finally|for|from|function|if|import|in|instanceof|let|new|null|of|return|static|super|switch|this|throw|true|false|try|typeof|undefined|var|void|while|yield|interface|type|implements|readonly|enum',
  sql: 'SELECT|FROM|WHERE|JOIN|ON|GROUP|BY|ORDER|INSERT|INTO|VALUES|UPDATE|SET|DELETE|CREATE|TABLE|INDEX|PRIMARY|KEY|REFERENCES|NOT|NULL|AND|OR|LIMIT|AS|BEGIN|COMMIT|ROLLBACK|EXPLAIN|ANALYZE|COUNT|SUM|DESC|ASC'
};
function highlight(code, lang) {
  let re;
  if (lang === 'python') re = new RegExp('(#.*$)|("""[\\s\\S]*?"""|\'\'\'[\\s\\S]*?\'\'\'|[frb]{0,2}"(?:\\\\.|[^"\\\\\\n])*"|[frb]{0,2}\'(?:\\\\.|[^\'\\\\\\n])*\')|\\b(\\d[\\d_.]*)\\b|\\b(' + KW.python + ')\\b|(@[\\w.]+)', 'gm');
  else if (lang === 'js' || lang === 'ts') re = new RegExp('(\\/\\/.*$|\\/\\*[\\s\\S]*?\\*\\/)|(`(?:\\\\.|[^`\\\\])*`|"(?:\\\\.|[^"\\\\\\n])*"|\'(?:\\\\.|[^\'\\\\\\n])*\')|\\b(\\d[\\d_.]*)\\b|\\b(' + KW.js + ')\\b|(@[\\w.]+)', 'gm');
  else if (lang === 'sql') re = new RegExp('(--.*$)|(\'(?:[^\'])*\')|\\b(\\d[\\d_.]*)\\b|\\b(' + KW.sql + ')\\b|(\\$\\d+)', 'gm');
  else re = /(#.*$)|("(?:\\.|[^"\\\n])*"|'[^'\n]*')|(\b\d+\b)|(\b(?:cd|export|source)\b)|(\$\w+)/gm;
  const cls = ['c','s','n','k','d'];
  let out = '', last = 0, m;
  while ((m = re.exec(code))) {
    out += esc(code.slice(last, m.index));
    const i = [1,2,3,4,5].find(g => m[g] !== undefined);
    out += '<span class="' + cls[i-1] + '">' + esc(m[0]) + '</span>';
    last = m.index + m[0].length;
    if (m[0].length === 0) re.lastIndex++;
  }
  return out + esc(code.slice(last));
}

const paras = text => text.split(/\n\s*\n/).map(p => {
  const lines = p.split('\n');
  if (lines.every(l => l.startsWith('- '))) return '<ul>' + lines.map(l => '<li>' + inline(l.slice(2)) + '</li>').join('') + '</ul>';
  return '<p>' + inline(lines.join(' ')) + '</p>';
}).join('');

function nodeHTML(n) {
  let cls = 'node', text = n;
  if (text.startsWith('*')) { cls += ' hot'; text = text.slice(1); }
  else if (text.startsWith('!')) { cls += ' bad'; text = text.slice(1); }
  if (text.endsWith('?')) cls += ' q';
  return '<div class="' + cls + '">' + inline(text) + '</div>';
}

const LABEL = {analogy:'Picture it', bridge:'You already know this from Swift and Dart', real:'Real-world example', pitfalls:'Mistakes people make', quiz:'Check yourself (also interview questions)'};
const LANGNAME = {python:'Python', js:'JavaScript (Node)', ts:'TypeScript', bash:'Terminal', sql:'SQL', text:'Output'};

function blockHTML(b, i) {
  const title = b.title ? esc(b.title) : '';
  switch (b.t) {
    case 'plain': return '<div class="prose">' + paras(b.text) + '</div>';
    case 'deep': return '<div class="b-deep prose"><div class="b-label">Go deeper' + (title ? ' · ' + title : '') + '</div>' + paras(b.text) + '</div>';
    case 'analogy': return '<div class="b-analogy prose"><div class="b-label">' + LABEL.analogy + '</div>' + paras(b.text) + '</div>';
    case 'bridge': return '<div class="b-bridge prose"><div class="b-label">' + LABEL.bridge + '</div>' + paras(b.text) + '</div>';
    case 'real': return '<div class="b-real prose"><div class="b-label">' + (title || LABEL.real) + '</div>' + paras(b.text) + '</div>';
    case 'pitfalls': return '<div class="b-pit"><div class="b-label">' + LABEL.pitfalls + '</div><ul>' + b.items.map(x => '<li>' + inline(x) + '</li>').join('') + '</ul></div>';
    case 'code': return '<div class="codewrap"><div class="code"><div class="code-h"><span>' + (title || LANGNAME[b.lang] || b.lang) + '</span><span class="acts">' + (b.web ? '<button type="button" class="go" data-run="' + i + '">▶ Run</button>' : '') + (b.lang === 'python' || b.lang === 'js' ? '<button type="button" data-edit="' + i + '">Edit in playground</button>' : '') + '<button type="button" data-copy="' + i + '">Copy</button></span></div><pre>' + highlight(b.code, b.lang) + '</pre></div><div class="runout" data-out="' + i + '" hidden></div></div>';
    case 'table': return '<div>' + (title ? '<div class="b-label">' + title + '</div>' : '') + '<div class="tbl"><table><thead><tr>' + b.rows[0].map(c => '<th>' + inline(c) + '</th>').join('') + '</tr></thead><tbody>' + b.rows.slice(1).map(r => '<tr>' + r.map(c => '<td>' + inline(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div></div>';
    case 'flow': return '<div><div class="b-label">Flow' + (title ? ' · ' + title : '') + '</div><div class="diagram">' + b.lanes.map(l => '<div class="lane">' + (l.name ? '<div class="lane-n">' + esc(l.name) + '</div>' : '') + l.nodes.map(n => n.n !== undefined ? nodeHTML(n.n) : '<div class="arr"><span>' + esc(n.a) + '</span></div>').join('') + '</div>').join('') + '</div></div>';
    case 'steps': return '<div><div class="b-label">Step through' + (title ? ' · ' + title : '') + '</div><div class="diagram stepper" data-steps="' + i + '"></div></div>';
    case 'quiz': return '<div class="quiz"><div class="b-label">' + LABEL.quiz + '</div>' + b.items.map(q => '<details><summary>' + inline(q[0]) + '</summary><p>' + inline(q[1]) + '</p></details>').join('') + '</div>';
  }
  return '';
}

function mountStepper(el, b) {
  let i = 0;
  const draw = () => {
    const s = b.steps[i];
    el.innerHTML = '<div class="cap">' + inline(s.c) + '</div><div class="cols">' + s.cols.map(c => '<div class="col"><h4>' + esc(c[0]) + '</h4>' + c[1].map(x => '<span class="chip">' + esc(x) + '</span>').join('') + '</div>').join('') + '</div><div class="ctl"><button class="btn" type="button" data-d="-1"' + (i === 0 ? ' disabled' : '') + '>Back</button><button class="btn main" type="button" data-d="1"' + (i === b.steps.length - 1 ? ' disabled' : '') + '>Next step</button><small>Step ' + (i + 1) + ' of ' + b.steps.length + '</small></div>';
  };
  el.addEventListener('click', e => { const d = e.target.dataset.d; if (d) { i = Math.max(0, Math.min(b.steps.length - 1, i + +d)); draw(); } });
  draw();
}

let current = null, view = 'lesson';
const NARROW = window.matchMedia('(max-width:860px)');
NARROW.addEventListener('change', () => { $('#side').open = !NARROW.matches; });
function show(id, scroll) {
  if (id === 'playground') { if (!current) current = flat[0]; showPlayground(scroll); return; }
  const x = byId[id] || flat[0];
  current = x; view = 'lesson';
  document.body.classList.remove('pg');
  document.body.dataset.track = x.t.id;
  const idx = flat.indexOf(x), lv = LEVELS.indexOf(x.l.level);
  const prev = flat[idx - 1], next = flat[idx + 1];
  const el = $('#lesson');
  el.innerHTML = '<div class="crumb"><span>' + esc(x.t.name) + ' · ' + esc(x.st.name) + '</span><span><span class="pips">' + LEVELS.map((_, k) => '<b class="' + (k <= lv ? 'on' : '') + '"></b>').join('') + '</span> ' + esc(x.l.level) + '</span><span>' + esc(x.l.mins) + '</span></div><h1>' + inline(x.l.title) + '</h1><div class="blocks">' + x.l.blocks.map(blockHTML).join('') + '</div><div class="foot"><button class="btn" type="button" id="prev"' + (prev ? '' : ' disabled') + '>Previous</button><button class="btn" type="button" id="mark"></button><button class="btn main" type="button" id="next"' + (next ? '' : ' disabled') + '>Next lesson</button></div>';
  el.querySelectorAll('[data-steps]').forEach(s => mountStepper(s, x.l.blocks[+s.dataset.steps]));
  el.querySelectorAll('[data-copy]').forEach(btn => btn.onclick = () => {
    const code = x.l.blocks[+btn.dataset.copy].code;
    (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject()).then(() => btn.textContent = 'Copied', () => btn.textContent = 'Select the code to copy');
    setTimeout(() => btn.textContent = 'Copy', 1600);
  });
  el.querySelectorAll('[data-run]').forEach(btn => btn.onclick = async () => {
    if (PG.isBusy()) return;
    const b = x.l.blocks[+btn.dataset.run];
    btn.disabled = true;
    try { await runInto(el.querySelector('[data-out="' + btn.dataset.run + '"]'), b.lang, b.code); } finally { btn.disabled = false; }
  });
  el.querySelectorAll('[data-edit]').forEach(btn => btn.onclick = () => {
    const b = x.l.blocks[+btn.dataset.edit];
    openInPlayground(b.lang, b.code, x.l.id);
  });
  const mark = $('#mark');
  const paint = () => mark.textContent = done.has(x.l.id) ? 'Done ✓ (undo)' : 'Mark as done';
  mark.onclick = () => { done.has(x.l.id) ? done.delete(x.l.id) : done.add(x.l.id); saveDone(); paint(); drawNav(); };
  paint();
  if (prev) $('#prev').onclick = () => go(prev.l.id);
  if (next) $('#next').onclick = () => go(next.l.id);
  drawTabs(); drawNav();
  $('#side').open = !NARROW.matches;
  if (scroll) window.scrollTo(0, 0);
}
function go(id) { history.pushState(null, '', '#' + id); show(id, true); }

function drawTabs() {
  $('#tabs').innerHTML = DATA.tracks.map(t => '<button class="tab" role="tab" type="button" aria-selected="' + (view === 'lesson' && t === current.t) + '" data-t="' + t.id + '"><i style="background:' + DOT[t.id] + '"></i>' + esc(t.name) + '</button>').join('') + '<button class="tab" role="tab" type="button" aria-selected="' + (view === 'pg') + '" data-t="pg"><i style="background:var(--py-2)"></i>Playground</button>';
  if (view === 'pg') { $('#count').textContent = 'Run Python and JavaScript in the page'; return; }
  const all = current.t.stages.flatMap(s => s.lessons);
  $('#count').textContent = all.filter(l => done.has(l.id)).length + ' of ' + all.length + ' done · ' + current.t.tagline;
}
$('#tabs').addEventListener('click', e => {
  const b = e.target.closest('[data-t]'); if (!b) return;
  if (b.dataset.t === 'pg') { pgState.back = null; go('playground'); return; }
  const t = DATA.tracks.find(t => t.id === b.dataset.t);
  let last = null; try { last = localStorage.getItem('pna-last-' + t.id); } catch (e) {}
  go(byId[last] ? last : t.stages[0].lessons[0].id);
});

function drawNav() {
  const q = $('#search').value.trim().toLowerCase();
  let html = '';
  current.t.stages.forEach(st => {
    const ls = st.lessons.filter(l => !q || (l.title + ' ' + l.blocks.map(b => b.text || b.code || '').join(' ')).toLowerCase().includes(q));
    if (!ls.length) return;
    html += '<div class="stage-h">' + esc(st.name) + '</div><div class="stage-s">' + esc(st.sub) + '</div>' + ls.map(l => '<a href="#' + l.id + '" aria-current="' + (l === current.l) + '"><span class="tick">' + (done.has(l.id) ? '✓' : '') + '</span><span>' + inline(l.title) + '</span></a>').join('');
  });
  $('#nav').innerHTML = html || '<div class="empty">No lesson matches. Try a shorter word.</div>';
  $('#side-sum').textContent = 'Lessons in ' + current.t.name;
  try { localStorage.setItem('pna-last-' + current.t.id, current.l.id); } catch (e) {}
}
$('#search').addEventListener('input', drawNav);
window.addEventListener('hashchange', () => show(location.hash.slice(1), true));
window.addEventListener('popstate', () => show(location.hash.slice(1), true));
/* In-page code runner and Playground view. Inlined into the page by build.py. */
const PG = (() => {
  const BRY = 'https://cdnjs.cloudflare.com/ajax/libs/brython/3.12.4/';
  const LIMIT_MS = 8000;
  let pyReady = null, workerOK = null, stopCurrent = null;

  const loadScript = src => new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('could not load ' + src));
    document.head.appendChild(s);
  });
  const loadPy = () => pyReady || (pyReady = (async () => {
    await loadScript(BRY + 'brython.min.js');
    await loadScript(BRY + 'brython_stdlib.min.js');
    if (!window.__BRYTHON__ || !window.brython) throw new Error('engine missing');

    "    exec(compile(_w.pna_src, '<playground>', 'exec'), _ns)",

    '    pass',
    'except SyntaxError as _e:',
    '    _w.pna_fail()',
    '    _w.pna_err("SyntaxError: " + str(_e.msg) + " (line " + str(_e.lineno) + ")\\n")',

    '    _w.pna_fail()',

  else if (v instanceof RegExp) r = String(v);

const __line = kind => (...a) => __send({ k: kind, t: a.map(x => __fmt(x, true)).join(' ') + '\\n' });
self.console = { log: __line('out'), info: __line('out'), debug: __line('out'), warn: __line('err'), error: __line('err'),
  table: (...a) => __line('out')(...a), time() {}, timeEnd() {} };
let __pending = 0, __mainDone = false;

  const WORKER_HEAD = 'const __send = m => postMessage(m);\n' + JS_PRELUDE + '(async () => { "use strict";\n';

      let failed = false, finished = false, cleanup = () => {};
      const end = note => {
        if (finished) return;

      };

        const id = 'pg' + Math.random().toString(36).slice(2);

          'window.onerror = (msg, src, line) => { __send({ k: "err", t: String(msg).replace(/^Uncaught\\s+/, "") + (line ? " (line " + Math.max(1, line - 1) + ")" : "") + "\\n" }); __send({ k: "fail" }); __send({ k: "idle" }); };\n';

    if (busy) return { ok: false, note: 'Another run is still in progress.' };
