<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>
<title>SwiftUI &amp; iOS Engineering Mastery Academy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: workspace — sticky build bar, left navigator rail, editor-width reading column; rail folds into a scroll strip on phones */
:root {
  --bg: #F1F3F6; --surface: #FFFFFF; --surface-2: #E8ECF1; --ink: #131923; --muted: #586273; --line: #D5DBE3;
  --accent: #B93E0B; --accent-ink: #FFFFFF; --accent-soft: #FBE7DC;
  --ok: #1D7549; --ok-soft: #DCF0E4; --warn: #8A5A00; --warn-soft: #F8EBCF;
  --ph-lang: #3767AE; --ph-ui: #23827A; --ph-arch: #7250AE; --ph-conc: #AE5A17; --ph-ship: #9C3D66; --ph-cap: #4A5568; --ph-now: #8A6A00;
  --code-bg: #F7F8FA; --code-ink: #262A33; --code-kw: #9B2393; --code-str: #C41A16; --code-cm: #5D6C79; --code-ty: #0B4F79; --code-num: #1C00CF; --code-at: #815F03;
  --f-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", sans-serif;
  --f-body: "Public Sans", -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px; --s-7: 48px; --s-8: 72px;
  --t-xs: 0.75rem; --t-sm: 0.875rem; --t-md: 1rem; --t-lg: 1.1875rem; --t-xl: 1.5rem; --t-2xl: 2.125rem; --t-3xl: clamp(2.25rem, 5vw, 3.5rem);
  --radius: 10px; --rail: 232px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0D1117; --surface: #141A22; --surface-2: #1B222C; --ink: #E4E8EE; --muted: #97A1B0; --line: #29323E;
    --accent: #FF8A4F; --accent-ink: #1A0D05; --accent-soft: #3A2318;
    --ok: #4CC287; --ok-soft: #13301F; --warn: #E2B04B; --warn-soft: #33270F;
    --ph-lang: #7EA8E6; --ph-ui: #5EC4B7; --ph-arch: #AD8EE6; --ph-conc: #E79C5C; --ph-ship: #DD7EA6; --ph-cap: #A3AEC0; --ph-now: #E2C25B;
    --code-bg: #1A1C22; --code-ink: #DFDFE0; --code-kw: #FC5FA3; --code-str: #FC6A5D; --code-cm: #7F8C98; --code-ty: #5DD8FF; --code-num: #D0BF69; --code-at: #FD8F3F;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0D1117; --surface: #141A22; --surface-2: #1B222C; --ink: #E4E8EE; --muted: #97A1B0; --line: #29323E;
  --accent: #FF8A4F; --accent-ink: #1A0D05; --accent-soft: #3A2318;
  --ok: #4CC287; --ok-soft: #13301F; --warn: #E2B04B; --warn-soft: #33270F;
  --ph-lang: #7EA8E6; --ph-ui: #5EC4B7; --ph-arch: #AD8EE6; --ph-conc: #E79C5C; --ph-ship: #DD7EA6; --ph-cap: #A3AEC0; --ph-now: #E2C25B;
  --code-bg: #1A1C22; --code-ink: #DFDFE0; --code-kw: #FC5FA3; --code-str: #FC6A5D; --code-cm: #7F8C98; --code-ty: #5DD8FF; --code-num: #D0BF69; --code-at: #FD8F3F;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { margin: 0; color: var(--ink); font: 400 var(--t-md)/1.6 var(--f-body); -webkit-font-smoothing: antialiased; }
a { color: var(--accent); text-underline-offset: 3px; }
code { font-family: var(--f-mono); font-size: 0.86em; background: var(--surface-2); padding: 0.1em 0.35em; border-radius: 4px; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.12; text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.num { font-variant-numeric: tabular-nums; }
.eyebrow { font: 600 var(--t-xs)/1.2 var(--f-body); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }

body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }

/* build bar */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { display: flex; align-items: center; gap: var(--s-4); min-height: 56px; }
.brand { display: flex; align-items: center; gap: var(--s-3); text-decoration: none; color: var(--ink); min-width: 0; }
.brand-mark { width: 30px; height: 30px; flex: none; border-radius: 8px; background: var(--accent); display: grid; place-items: center; }
.brand-name { font: 700 var(--t-md)/1.1 var(--f-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-name span { color: var(--muted); font-weight: 500; }
.status { margin-left: auto; display: flex; align-items: center; gap: var(--s-3); font-family: var(--f-mono); font-size: var(--t-xs); color: var(--muted); white-space: nowrap; }
.status .meter { width: 120px; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.status .meter i { display: block; height: 100%; background: var(--accent); }
.status b { color: var(--ink); font-weight: 500; }

/* workspace */
.ws { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); gap: 0; min-height: calc(100vh - 57px); }
.rail { border-right: 1px solid var(--line); padding-block: var(--s-5); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: var(--s-4); position: sticky; top: calc(57px + env(safe-area-inset-top, 0px)); align-self: start; max-height: calc(100vh - 57px); overflow-y: auto; }
.rail nav { display: flex; flex-direction: column; gap: 2px; }
.rail a { display: flex; justify-content: space-between; align-items: baseline; gap: var(--s-2); padding: 7px 10px; border-radius: 7px; color: var(--ink); text-decoration: none; font-size: var(--t-sm); font-weight: 500; }
.rail a small { font-family: var(--f-mono); font-size: 11px; color: var(--muted); font-weight: 400; }
.rail a:hover { background: var(--surface-2); }
.rail a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); }
.rail a[aria-current="page"] small { color: var(--accent); }
.rail-sec { margin-top: var(--s-5); display: flex; flex-direction: column; gap: var(--s-2); }
.rail-sec .eyebrow { padding-left: 10px; }
.phase-key { display: flex; flex-direction: column; gap: 6px; padding-left: 10px; font-size: var(--t-xs); color: var(--muted); }
.phase-key span { display: flex; align-items: center; gap: var(--s-2); }
.dot { width: 9px; height: 9px; border-radius: 2px; flex: none; }

main { padding-block: var(--s-6) var(--s-8); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); min-width: 0; }
.page { max-width: 980px; margin: 0 auto; display: flex; flex-direction: column; gap: var(--s-7); }
.read { max-width: 70ch; }
section { display: flex; flex-direction: column; gap: var(--s-4); }
.sec-head { display: flex; justify-content: space-between; align-items: end; gap: var(--s-4); flex-wrap: wrap; }
.sec-head h2 { font-size: var(--t-xl); }
.lede { color: var(--muted); font-size: var(--t-lg); line-height: 1.55; max-width: 62ch; }

/* hero */
.hero { display: flex; flex-direction: column; gap: var(--s-4); }
.hero h1 { font-size: var(--t-3xl); font-weight: 800; letter-spacing: -0.025em; max-width: 18ch; }
.hero h1 em { font-style: normal; color: var(--accent); }
.actions { display: flex; flex-wrap: wrap; gap: var(--s-3); margin-top: var(--s-2); }
.btn { display: inline-flex; align-items: center; gap: var(--s-2); border: 1px solid var(--line); background: var(--surface); color: var(--ink); padding: 9px 14px; border-radius: 8px; font-size: var(--t-sm); font-weight: 600; text-decoration: none; cursor: pointer; }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.06); }
.btn.small { padding: 5px 10px; font-size: var(--t-xs); }
.btn[aria-pressed="true"] { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }

/* build log */
.log { font-family: var(--f-mono); font-size: var(--t-sm); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.log-row { display: grid; grid-template-columns: 22px minmax(0, 1fr) auto; gap: var(--s-3); padding: 9px var(--s-4); border-top: 1px solid var(--line); align-items: baseline; }
.log-row:first-child { border-top: 0; }
.log-row .k { color: var(--muted); }
.log-row .v { color: var(--ink); white-space: nowrap; }
.log-row .ico { color: var(--muted); }
.log-row.ok .ico { color: var(--ok); }
.log-row.run .ico { color: var(--accent); }
.log-row .title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.log-row .title b { font-weight: 500; color: var(--ink); }

/* timeline */
.track { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 3px; }
.track a { position: relative; height: 38px; border-radius: 4px; background: color-mix(in srgb, var(--pc) 18%, var(--surface)); border: 1px solid color-mix(in srgb, var(--pc) 40%, transparent); text-decoration: none; display: flex; align-items: end; justify-content: center; padding-bottom: 3px; font: 500 10px/1 var(--f-mono); color: var(--muted); }
.track a.done { background: var(--pc); color: var(--surface); border-color: var(--pc); }
.track a.now { outline: 2px solid var(--ink); outline-offset: 1px; }
.track-legend { display: flex; flex-wrap: wrap; gap: var(--s-2) var(--s-4); font-size: var(--t-xs); color: var(--muted); }
.track-legend span { display: flex; gap: 6px; align-items: center; }

/* metrics */
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.metric { background: var(--surface); padding: var(--s-4); display: flex; flex-direction: column; gap: 6px; }
.metric strong { font: 700 var(--t-xl)/1 var(--f-display); font-variant-numeric: tabular-nums; }
.metric strong small { font: 500 var(--t-sm) var(--f-body); color: var(--muted); }
.bar-sm { height: 4px; background: var(--surface-2); border-radius: 2px; overflow: hidden; }
.bar-sm i { display: block; height: 100%; background: var(--ok); }

/* badges */
.badge { display: inline-flex; align-items: center; gap: 5px; font: 600 11px/1 var(--f-body); letter-spacing: 0.04em; text-transform: uppercase; padding: 4px 7px; border-radius: 5px; white-space: nowrap; }
.badge.authored { background: var(--ok-soft); color: var(--ok); }
.badge.planned { background: transparent; color: var(--warn); border: 1px dashed var(--warn); }
.badge.lvl { background: var(--surface-2); color: var(--muted); }
.badge.done { background: var(--ok); color: var(--surface); }

/* status legend */
.legend { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: var(--s-4); }
.legend > div { display: flex; flex-direction: column; gap: var(--s-2); padding: var(--s-4); border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.legend p { color: var(--muted); font-size: var(--t-sm); }

/* modules */
.mods { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.mod { border-bottom: 1px solid var(--line); }
.mod > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 54px minmax(0, 1fr) 140px; gap: var(--s-4); align-items: center; padding: var(--s-4) var(--s-2); }
.mod > summary::-webkit-details-marker { display: none; }
.mod > summary:hover { background: var(--surface); }
.mod-n { font: 800 var(--t-xl)/1 var(--f-display); color: var(--pc); font-variant-numeric: tabular-nums; }
.mod-t { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.mod-t h3 { font-size: var(--t-lg); font-weight: 700; }
.mod-t p { color: var(--muted); font-size: var(--t-sm); }
.mod-p { display: flex; flex-direction: column; gap: 6px; font-family: var(--f-mono); font-size: var(--t-xs); color: var(--muted); text-align: right; }
.lessons { display: flex; flex-direction: column; padding: 0 var(--s-2) var(--s-4) calc(54px + var(--s-4) + var(--s-2)); }
.lrow { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto auto; gap: var(--s-3); align-items: center; padding: 8px 0; border-top: 1px dashed var(--line); }
.lrow:first-child { border-top: 0; }
.lrow a { color: var(--ink); text-decoration: none; font-weight: 500; }
.lrow a:hover { color: var(--accent); }
.lrow .min { font-family: var(--f-mono); font-size: var(--t-xs); color: var(--muted); }
.check { width: 20px; height: 20px; border-radius: 5px; border: 1.5px solid var(--line); background: var(--surface); display: grid; place-items: center; cursor: pointer; padding: 0; }
.check[aria-checked="true"] { background: var(--ok); border-color: var(--ok); }
.check svg { opacity: 0; }
.check[aria-checked="true"] svg { opacity: 1; }

/* lesson */
.crumbs { display: flex; flex-wrap: wrap; gap: var(--s-2); font-size: var(--t-sm); color: var(--muted); }
.crumbs a { color: var(--muted); }
.lesson-head { display: flex; flex-direction: column; gap: var(--s-3); }
.lesson-head h1 { font-size: var(--t-2xl); font-weight: 800; }
.meta { display: flex; flex-wrap: wrap; gap: var(--s-2); align-items: center; font-size: var(--t-sm); color: var(--muted); }
.prose { display: flex; flex-direction: column; gap: var(--s-4); max-width: 68ch; font-size: 1.0625rem; }
.code { position: relative; background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--radius); }
.code-top { display: flex; justify-content: space-between; align-items: center; padding: 6px 8px 6px 14px; border-bottom: 1px solid var(--line); font: 500 var(--t-xs) var(--f-mono); color: var(--muted); }
.code pre { margin: 0; padding: var(--s-4); overflow-x: auto; font: 400 13px/1.6 var(--f-mono); color: var(--code-ink); tab-size: 4; }
.code .k { color: var(--code-kw); font-weight: 500; } .code .s { color: var(--code-str); } .code .c { color: var(--code-cm); font-style: italic; }
.code .t { color: var(--code-ty); } .code .n { color: var(--code-num); } .code .a { color: var(--code-at); }
.callouts { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: var(--s-4); }
.callout { padding: var(--s-4); border-radius: var(--radius); border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: var(--s-2); }
.callout ul { margin: 0; padding-left: 1.1em; display: flex; flex-direction: column; gap: 6px; font-size: var(--t-sm); }
.callout.ask { border-color: color-mix(in srgb, var(--accent) 45%, var(--line)); }
.callout.ask p { font-weight: 500; }
.outline { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 8px; }
.note { padding: var(--s-4); border: 1px dashed var(--warn); background: var(--warn-soft); border-radius: var(--radius); font-size: var(--t-sm); max-width: 68ch; }
.refs { display: flex; flex-direction: column; gap: 2px; }
.ref { display: grid; grid-template-columns: 116px minmax(0, 1fr); gap: var(--s-3); padding: 7px 0; border-top: 1px solid var(--line); font-size: var(--t-sm); align-items: baseline; }
.ref:first-child { border-top: 0; }
.ref .type { font: 500 var(--t-xs) var(--f-mono); color: var(--muted); }
.pager { display: flex; justify-content: space-between; gap: var(--s-4); flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: var(--s-5); }
.pager a { display: flex; flex-direction: column; gap: 2px; text-decoration: none; color: var(--ink); max-width: 46%; }
.pager a small { color: var(--muted); font-size: var(--t-xs); }
.pager a:last-child { text-align: right; margin-left: auto; }

/* plan */
.plan-tools { display: flex; flex-wrap: wrap; gap: var(--s-3); align-items: center; font-size: var(--t-sm); }
.plan-tools label { display: flex; gap: var(--s-2); align-items: center; color: var(--muted); }
.plan-tools input[type="date"] { border: 1px solid var(--line); background: var(--surface); padding: 5px 8px; border-radius: 6px; }
.weeks { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; }
.wk { display: grid; grid-template-columns: 28px 74px minmax(0, 1.1fr) minmax(0, 1.2fr); gap: var(--s-4); padding: var(--s-3) var(--s-4); border-top: 1px solid var(--line); align-items: start; border-left: 4px solid var(--pc); }
.wk:first-child { border-top: 0; }
.wk.now { background: var(--accent-soft); }
.wk-n { display: flex; flex-direction: column; gap: 2px; }
.wk-n b { font: 700 var(--t-md)/1.2 var(--f-display); }
.wk-n small { font: 400 11px var(--f-mono); color: var(--muted); }
.wk-focus { display: flex; flex-direction: column; gap: 4px; font-size: var(--t-sm); }
.wk-focus .mods-l { display: flex; flex-wrap: wrap; gap: 6px; }
.wk-focus .mods-l a { font: 500 11px var(--f-mono); text-decoration: none; padding: 2px 6px; border-radius: 4px; background: var(--surface-2); color: var(--ink); }
.wk-del { font-size: var(--t-sm); color: var(--muted); }

/* projects */
.projects { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--s-4); }
.proj { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s-5); display: flex; flex-direction: column; gap: var(--s-3); }
.proj.cap { grid-column: 1 / -1; border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); }
.proj-top { display: flex; justify-content: space-between; gap: var(--s-3); align-items: baseline; flex-wrap: wrap; }
.proj h3 { font-size: var(--t-xl); }
.proj .sub { font: 500 var(--t-xs) var(--f-mono); color: var(--muted); }
.proj ul { margin: 0; padding-left: 1.1em; font-size: var(--t-sm); display: flex; flex-direction: column; gap: 4px; }
.ms { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: var(--s-3); }
.ms label { display: flex; gap: var(--s-3); align-items: center; font-size: var(--t-sm); cursor: pointer; }
.ms input { width: 17px; height: 17px; accent-color: var(--ok); }

/* interview */
.filters { display: flex; flex-wrap: wrap; gap: var(--s-3); align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: var(--s-3); }
.filters input[type="search"], .filters select { border: 1px solid var(--line); background: var(--bg); padding: 7px 10px; border-radius: 7px; font-size: var(--t-sm); }
.filters input[type="search"] { flex: 1 1 220px; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; background: transparent; padding: 6px 10px; font-size: var(--t-xs); font-weight: 600; cursor: pointer; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.qcount { font-family: var(--f-mono); font-size: var(--t-xs); color: var(--muted); }
.qs { display: flex; flex-direction: column; border-top: 1px solid var(--line); }
.q { border-bottom: 1px solid var(--line); }
.q > summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: var(--s-3); padding: var(--s-3) var(--s-2); align-items: baseline; }
.q > summary::-webkit-details-marker { display: none; }
.q > summary:hover { background: var(--surface); }
.q .qm { font: 500 var(--t-xs) var(--f-mono); color: var(--muted); }
.q .qt { font-weight: 600; }
.q .qs-st { display: flex; gap: 6px; align-items: center; }
.q-body { padding: 0 var(--s-2) var(--s-4) calc(56px + var(--s-3) + var(--s-2)); display: flex; flex-direction: column; gap: var(--s-3); max-width: calc(70ch + 80px); }
.q-body p { color: var(--ink); }
.q-act { display: flex; gap: var(--s-2); flex-wrap: wrap; }
.mark-got { color: var(--ok); } .mark-rev { color: var(--warn); }

/* resources */
.res-group { display: flex; flex-direction: column; gap: var(--s-2); }
.res-list { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 var(--s-5); }

    code: S`protocol Shape { func area() -> Double }
struct Circle: Shape { var r: Double; func area() -> Double { .pi * r * r } }

// Generic: can be specialised for Circle, calls resolved statically
func totalAreaGeneric<S: Shape>(_ shapes: [S]) -> Double {
    shapes.reduce(0) { $0 + $1.area() }
}

// Existential: each element boxed; area() goes through the witness table
func totalAreaExistential(_ shapes: [any Shape]) -> Double {
    shapes.reduce(0) { $0 + $1.area() }
}

class Animal { func sound() -> String { "…" } }           // overridable: vtable
final class Dog: Animal { override func sound() -> String { "woof" } }  // final: can devirtualise

// A local value moves to the heap when an escaping closure captures it
func makeCounter() -> () -> Int {
    var count = 0                                         // boxed: the closure outlives this frame
    return { count += 1; return count }

            if x > 0, x + size.width > maxWidth { y += row + spacing; x = 0; row = 0 }
            x += size.width + spacing
            row = max(row, size.height)
            widest = max(widest, x - spacing)
        }
        return CGSize(width: widest, height: y + row)
    }

    func placeSubviews(in bounds: CGRect, proposal: ProposedViewSize, subviews: Subviews, cache: inout ()) {
        var x = bounds.minX, y = bounds.minY, row: CGFloat = 0
        for view in subviews {
            let size = view.sizeThatFits(.unspecified)
            if x > bounds.minX, x + size.width > bounds.maxX { y += row + spacing; x = bounds.minX; row = 0 }
            view.place(at: CGPoint(x: x, y: y), proposal: ProposedViewSize(size))
            x += size.width + spacing
            row = max(row, size.height)
        }
    }
}

enum SocketError: Error { case stale, notLive }

actor MachineSession {
    enum State: Sendable, Equatable { case idle, connecting, live, waiting(retryIn: Duration), failed, stopped }

    let events: AsyncStream<MachineEvent>          // one stream, created once
    private let sink: AsyncStream<MachineEvent>.Continuation
    private(set) var state: State = .idle

    private let url: URL
    private let machineID: String
    private let token: @Sendable () async throws -> String
    private var supervisor: Task<Void, Never>?
    private var socket: URLSessionWebSocketTask?
    private var failures = 0
    private var lastFrame = ContinuousClock.now

    init(url: URL, machineID: String, token: @escaping @Sendable () async throws -> String) {
        let (stream, continuation) = AsyncStream.makeStream(of: MachineEvent.self,
                                                            bufferingPolicy: .bufferingNewest(100))
        events = stream; sink = continuation
        self.url = url; self.machineID = machineID; self.token = token
    }

    func start() {
        guard supervisor == nil else { return }
        supervisor = Task { await supervise() }
    }

    func stop() {
        supervisor?.cancel(); supervisor = nil
        socket?.cancel(with: .normalClosure, reason: nil); socket = nil
        state = .stopped
        sink.finish()                              // ends the consumer's for-await loop
    }

    func send(_ command: Command) async throws {
        guard let socket, state == .live else { throw SocketError.notLive }
        try await send(command, on: socket)
    }

    // Owns the lifecycle: connect → run until something fails → back off → repeat
    private func supervise() async {
        while !Task.isCancelled {
            state = .connecting
            let task = URLSession.shared.webSocketTask(with: url)
            socket = task
            lastFrame = .now
            task.resume()
            do { try await run(task) } catch { /* fall through to reconnect */ }
            task.cancel(with: .goingAway, reason: nil)
            guard !Task.isCancelled else { return }

            failures += 1
            if failures > 8 { state = .failed; sink.finish(); return }
            let delay = backoff(failures)
            state = .waiting(retryIn: delay)
            try? await Task.sleep(for: delay)
        }
    }

    private func run(_ task: URLSessionWebSocketTask) async throws {
        try await send(.auth(try await token(), machine: machineID), on: task)
        try await withThrowingTaskGroup(of: Void.self) { group in
            group.addTask { try await self.receiveLoop(task) }
            group.addTask { try await self.heartbeatLoop(task) }
            try await group.next()                 // first child to finish or throw ends both
            group.cancelAll()
        }
    }

    private func receiveLoop(_ task: URLSessionWebSocketTask) async throws {
        while true {
            let frame = try await task.receive()   // throws when the socket closes
            lastFrame = .now
            guard case .string(let text) = frame,
                  let event = try? JSONDecoder().decode(MachineEvent.self, from: Data(text.utf8))
            else { continue }
            if case .authenticated = event { state = .live; failures = 0 }   // reset only on real auth
            sink.yield(event)
        }
    }

    private func heartbeatLoop(_ task: URLSessionWebSocketTask) async throws {
        while true {
            try await Task.sleep(for: .seconds(15))
            if ContinuousClock.now - lastFrame > .seconds(45) { throw SocketError.stale }  // half-open
            try await send(.heartbeat, on: task)   // server replies heartbeat_ack, refreshing lastFrame
        }
    }

    private func send(_ command: Command, on task: URLSessionWebSocketTask) async throws {
        let json = String(decoding: try JSONEncoder().encode(command), as: UTF8.self)
        try await task.send(.string(json))
    }

    private func backoff(_ failures: Int) -> Duration {
        let seconds = min(30.0, pow(2.0, Double(failures)))           // 2, 4, 8, 16, 30…
        return .milliseconds(Int(seconds * 1000 * Double.random(in: 0.5...1)))   // jitter
    }
}

private func scheduleReconnect() {
    guard let machineId = currentMachineId, reconnectTask == nil else { return }

    reconnectAttempt += 1
    guard reconnectAttempt <= maxReconnectAttempts else {
        closeSocket(code: .goingAway)
        reconnectAttempt = 0
        connectionState = .failed("Max reconnect attempts reached")
        return
    }

    let attempt = reconnectAttempt
    connectionState = .reconnecting(attempt: attempt)
    let delay = min(pow(2.0, Double(attempt)), 30.0)

        guard !Task.isCancelled else { return }
        await self.reconnect(machineId: machineId)
    }

@MainActor @Observable
final class Membership {
    private(set) var products: [Product] = []
    private(set) var isMember = false
    private var updates: Task<Void, Never>?

    func start() {
        updates = Task {                                   // renewals, refunds, Ask to Buy, other devices
            for await result in StoreKit.Transaction.updates { await handle(result) }
        }
    }

    func load() async {
        products = (try? await Product.products(for: ["instant.plus.monthly", "instant.plus.yearly"])) ?? []
        for await result in StoreKit.Transaction.currentEntitlements { await handle(result) }
    }

    func buy(_ product: Product) async throws {
        switch try await product.purchase() {
        case .success(let verification): await handle(verification)
        case .pending, .userCancelled: break
        @unknown default: break
        }
    }

    private func handle(_ result: VerificationResult<StoreKit.Transaction>) async {
        guard case .verified(let transaction) = result else { return }   // ignore unverified receipts
        isMember = transaction.revocationDate == nil
        await transaction.finish()                                         // always finish
    }
}

import UIKit

final class PushRouter: NSObject, UNUserNotificationCenterDelegate {
    func register() async throws {
        let center = UNUserNotificationCenter.current()
        center.delegate = self
        let granted = try await center.requestAuthorization(options: [.alert, .sound, .badge])
        if granted { await MainActor.run { UIApplication.shared.registerForRemoteNotifications() } }

        let reorder = UNNotificationAction(identifier: "REORDER", title: "Reorder", options: [.foreground])
        let category = UNNotificationCategory(identifier: "ORDER_DONE", actions: [reorder], intentIdentifiers: [])
        center.setNotificationCategories([category])
    }

    // App in foreground: decide how to show it
    func userNotificationCenter(_ center: UNUserNotificationCenter, willPresent notification: UNNotification) async
        -> UNNotificationPresentationOptions {
        [.banner, .sound]
    }

    // User tapped the notification or an action
    func userNotificationCenter(_ center: UNUserNotificationCenter, didReceive response: UNNotificationResponse) async {
        let info = response.notification.request.content.userInfo
        guard let link = info["deeplink"] as? String, let url = URL(string: link) else { return }
        await MainActor.run { DeepLinks.open(url, action: response.actionIdentifier) }
    }
}

@MainActor enum DeepLinks { static func open(_ url: URL, action: String) {} }

// Notification Service Extension: edit the content before it is shown
// (payload must include "mutable-content": 1)
final class NotificationService: UNNotificationServiceExtension {
    private var contentHandler: ((UNNotificationContent) -> Void)?
    private var bestAttempt: UNMutableNotificationContent?

    override func didReceive(_ request: UNNotificationRequest,
                             withContentHandler contentHandler: @escaping (UNNotificationContent) -> Void) {
        self.contentHandler = contentHandler
        bestAttempt = request.content.mutableCopy() as? UNMutableNotificationContent
        guard let bestAttempt,
              let urlString = request.content.userInfo["image"] as? String,
              let url = URL(string: urlString) else { return contentHandler(request.content) }

        Task {
            if let (location, _) = try? await URLSession.shared.download(from: url) {
                let file = FileManager.default.temporaryDirectory.appending(path: url.lastPathComponent)
                try? FileManager.default.moveItem(at: location, to: file)
                if let image = try? UNNotificationAttachment(identifier: "image", url: file) {
                    bestAttempt.attachments = [image]
                }
            }
            contentHandler(bestAttempt)
        }
    }

    // ~30 s budget exceeded: deliver whatever we have
    override func serviceExtensionTimeWillExpire() {
        if let contentHandler, let bestAttempt { contentHandler(bestAttempt) }
    }
}`,

const Q = [
["m01","J","What is the difference between let and var?","<code>let</code> binds a constant that can't be reassigned; <code>var</code> can be. On a struct, <code>let</code> freezes the whole value. On a class instance only the reference is fixed, and its properties can still change."],
["m01","J","What is an optional and how is it implemented?","<code>Optional&lt;Wrapped&gt;</code> is an enum with <code>.none</code> and <code>.some(Wrapped)</code>. <code>nil</code> is <code>.none</code>. The compiler makes you unwrap it before use, so a missing value is handled explicitly."],
["m01","J","if let vs guard let: when do you use each?","<code>if let</code> scopes the unwrapped value to its block. <code>guard let</code> requires an early exit when nil and keeps the value for the rest of the scope. That suits preconditions at the top of a function."],
["m01","M","map vs compactMap vs flatMap?","<code>map</code> transforms each element. <code>compactMap</code> transforms and drops nils. <code>flatMap</code> flattens a sequence of sequences. On an Optional, <code>flatMap</code> chains a transform that itself returns an optional."],
["m01","M","What is an escaping closure?","A closure that outlives the function call because it is stored or called asynchronously. It must be marked <code>@escaping</code>. Non-escaping is the default: it's cheaper and allows implicit <code>self</code>."],
["m01","M","How do closures capture values?","By reference by default, so they see later changes. A capture list such as <code>[count]</code> copies the value when the closure is created. <code>[weak self]</code> avoids a strong reference to the owner."],
["m01","M","Why avoid Double for currency?","Binary floating point can't represent values like 0.1 exactly, so rounding errors accumulate. Use <code>Decimal</code> or integer minor units (paise), and format with a currency format style."],
["m01","S","What are key paths and where are they useful?","Typed references to properties, such as <code>\\Item.price</code>. They work as functions in <code>map(\\.name)</code>, in sort descriptors, in SwiftData <code>@Query</code> sorts and predicates, in dynamic member lookup, and in SwiftUI bindings."],
["m01","J","What does defer do?","It runs its block when the current scope exits, however it exits (return, throw, break). Multiple defers run in reverse order. Use it for cleanup such as unlocking or closing files."],
["m01","M","throws vs Result vs returning an optional?","<code>throws</code> propagates a reason with <code>try</code>. <code>Result</code> stores success or failure as a value, which is useful for callbacks and caching outcomes. An optional loses the reason for failure."],

["m02","J","struct vs class?","Structs are value types: copied, no inheritance, memberwise init, no deinit. Classes are reference types: shared identity, inheritance, deinit, <code>===</code>. Prefer structs unless you need shared mutable identity."],
["m02","J","When do you choose a class?","When you need shared identity (a socket session), inheritance (UIKit subclasses), Objective-C interop, or deinit-based cleanup. If that shared state is accessed concurrently, consider an actor."],
["m02","M","What is protocol-oriented programming?","Designing around protocols and protocol extensions with default implementations, composing capabilities instead of inheriting from base classes. It works for structs and enums, not just classes."],
["m02","S","Explain dispatch for protocol extension methods.","Methods declared as protocol requirements dispatch dynamically through the witness table. Methods that exist only in an extension dispatch statically on the variable's declared type, so a conformer's own implementation is skipped when called through the protocol."],
["m02","M","some vs any?","<code>some P</code> is an opaque type: one concrete type, known to the compiler, with no box. <code>any P</code> is an existential box that can hold different types at runtime, with dynamic dispatch and possible allocation. Prefer <code>some</code>."],
["m02","M","What is an associated type?","A placeholder type inside a protocol that each conformer fills in, such as <code>Element</code> in <code>Collection</code>. It makes the protocol generic over that type."],
["m02","S","What are primary associated types?","Declared as <code>protocol Repository&lt;Entity&gt;</code>, they let you write constrained types like <code>some Collection&lt;Int&gt;</code> or <code>any Repository&lt;Product&gt;</code> without generic where-clauses."],
["m02","J","What does mutating mean?","A struct or enum method that changes <code>self</code> must be marked <code>mutating</code>. You can't call it on a <code>let</code> constant."],
["m02","M","Why mark classes final?","It prevents subclassing, which lets the compiler use static dispatch and inline calls. It also documents that the class isn't designed for inheritance."],
["m02","S","How does Codable synthesis work?","If every stored property is Codable, the compiler generates <code>CodingKeys</code>, <code>init(from:)</code> and <code>encode(to:)</code>. You can override the key mapping only, or write the initialiser by hand."],
["m02","M","What is a property wrapper?","A type with a <code>wrappedValue</code> (and optionally a <code>projectedValue</code>, exposed as <code>$name</code>) applied with <code>@Name</code> to encapsulate storage logic. <code>@State</code>, <code>@Binding</code> and <code>@AppStorage</code> are property wrappers."],
["m02","S","What is a result builder?","A type marked <code>@resultBuilder</code> that turns a sequence of statements into one value through <code>buildBlock</code>, <code>buildEither</code>, <code>buildOptional</code> and similar methods. <code>@ViewBuilder</code> is the best-known one."],

["m03","J","What is ARC?","Automatic Reference Counting. The compiler inserts retain and release calls, and an object is freed when its strong reference count reaches zero. It is deterministic and not a tracing garbage collector."],
["m03","J","What is a retain cycle?","Two or more objects holding strong references to each other, so no count reaches zero. Typical case: a view model stores a closure on a child object, and the closure captures the view model strongly."],
["m03","M","weak vs unowned?","<code>weak</code> is optional and becomes nil when the object is freed. <code>unowned</code> is non-optional and assumes the object outlives the reference. Accessing it after deallocation crashes."],
["m03","M","Can a Task cause a retain cycle?","A Task strongly captures what it uses until it finishes. That only becomes a cycle when self also stores the task and the task never ends, for example an infinite loop. Use weak captures for long-running loops."],
["m03","M","What is copy-on-write?","Value types such as Array share storage between copies and duplicate it only on mutation when the buffer isn't uniquely referenced, which is checked with <code>isKnownUniquelyReferenced</code>."],
["m03","S","How do you find a memory leak?","Check deinit logs, then use the Xcode Memory Graph to look at retain paths, and Instruments Leaks or Allocations with generational marks while repeating the flow. Look for objects whose count grows every time."],
["m03","M","Why are delegates usually weak?","The owner holds the child strongly. If the child held its delegate (the owner) strongly too, you'd have a cycle. The protocol is constrained to <code>AnyObject</code> so it can be weak."],
["m03","S","Stack vs heap for Swift values?","Value types are often stack-allocated, but they get boxed on the heap when captured by escaping closures, stored in large existentials, or marked indirect. Classes always live on the heap with atomic refcounting."],
["m03","S","What dispatch mechanisms does Swift use?","Static (structs, final, private, extension-only methods), vtable (overridable class methods), witness table (protocol requirements) and Objective-C message send (<code>@objc dynamic</code>)."],

["m04","J","What is a View in SwiftUI?","A lightweight value that describes a piece of UI through its <code>body</code>. SwiftUI keeps the real render tree and diffs new descriptions against it, so creating views is cheap."],
["m04","J","Why does modifier order matter?","Each modifier wraps the view in a new view. <code>.padding().background()</code> paints the padded area; <code>.background().padding()</code> paints only the content and adds space outside."],
["m04","J","What is some View?","An opaque return type. <code>body</code> returns one concrete, often deeply nested generic type that the compiler infers, and you don't have to spell it."],
["m04","M","When does SwiftUI re-evaluate body?","When a dependency it read changes: <code>@State</code>, an observed property, an environment value, or the view's inputs from its parent. It then diffs the result."],
["m04","M","What is @ViewBuilder?","A result builder that lets <code>body</code> and closures contain several views, <code>if</code>/<code>else</code> and <code>switch</code>, producing <code>TupleView</code> or conditional content."],
["m04","M","Why extract small subview structs?","Narrower dependencies, reuse and readability. SwiftUI can skip a subview's body when its inputs haven't changed, which computed properties inside a parent can't offer."],
["m04","J","How do you support Dynamic Type?","Use text styles rather than fixed sizes, use <code>@ScaledMetric</code> for spacing and icons, let text wrap, and test at the largest accessibility sizes."],
["m04","M","Why avoid AnyView?","It erases type information, so SwiftUI loses structural identity and diffs less efficiently. Prefer <code>@ViewBuilder</code>, <code>Group</code> or conditional content."],
["m04","S","Describe SwiftUI's layout process.","The parent proposes a size, the child chooses its own size based on that proposal, and the parent places the child within its coordinate space. Modifiers like <code>frame</code> and <code>padding</code> change the proposal."],

["m05","J","@State vs @Binding?","<code>@State</code> is a source of truth owned by a view and preserved across body runs. <code>@Binding</code> is a read-write reference to state owned by someone else."],
["m05","M","@Observable vs ObservableObject?","<code>@Observable</code> tracks which properties each body reads and invalidates only those views. <code>ObservableObject</code> invalidates every observer on any <code>@Published</code> change and needs <code>@StateObject</code>/<code>@ObservedObject</code>."],
["m05","M","@StateObject vs @ObservedObject?","<code>@StateObject</code> creates and owns the object for the view's lifetime. <code>@ObservedObject</code> only observes one passed in. Creating an object in <code>@ObservedObject</code> can recreate it whenever the parent re-renders."],
["m05","M","What is @Bindable?","It produces bindings to properties of an <code>@Observable</code> object you don't own via <code>@State</code>, for example <code>$model.name</code> in a TextField."],
["m05","M","How does @Environment work?","Values flow down the view tree implicitly. Read them with <code>@Environment(\\.key)</code> or <code>@Environment(Model.self)</code> and set them with <code>.environment(...)</code>. Missing observable objects crash at runtime."],
["m05","S","Structural vs explicit identity?","Structural identity is a view's type and position in the hierarchy, including which branch of an if it's in. Explicit identity comes from <code>ForEach</code> ids or <code>.id()</code>. Identity decides state lifetime and transitions."],
["m05","S","What does .id(x) do?","When <code>x</code> changes, SwiftUI treats the view as a new one: it discards its state, restarts <code>.task</code> and <code>onAppear</code>, and runs transitions. Useful for resetting a form, harmful with unstable values."],
["m05","M","Why is creating a view model in a view's init risky?","The init runs every time the parent re-renders. Even with <code>State(initialValue:)</code> only the first instance is kept, but the object is still constructed each time, along with any side effects."],
["m05","J","What is a single source of truth?","Each piece of data has one owner. Everything else reads it, derives from it or binds to it, so there are no copies to keep in sync."],
["m05","S","How do you share state between unrelated screens?","Lift it into an <code>@Observable</code> model owned by a common ancestor or the App, and pass it by environment or init. For data that outlives the session, back it with a persisted service."],

["m06","J","List vs LazyVStack?","<code>List</code> gives platform styling, cell reuse, swipe actions, selection and refresh. <code>LazyVStack</code> in a ScrollView gives a custom look and lazy creation without the same recycling."],
["m06","J","Why must ForEach data be identifiable?","SwiftUI uses ids to match rows across updates for inserts, deletes, moves, animations and preserved state. Unstable ids cause wrong animations and state bleeding between rows."],
["m06","M","Why avoid ForEach(array.indices)?","Indices shift when items are inserted or removed, so identity is wrong, and bindings to removed indices can crash."],
["m06","M","What are GeometryReader's drawbacks?","It takes all the space offered and reports sizes after layout, which encourages layout feedback loops. Prefer <code>containerRelativeFrame</code>, <code>onGeometryChange</code> or a custom <code>Layout</code>."],
["m06","S","When would you write a custom Layout?","For layouts stacks can't express, such as wrapping tags, radial menus or equal-width buttons. You implement <code>sizeThatFits</code> and <code>placeSubviews</code>, with a cache for expensive measurement."],
["m06","M","Grid vs LazyVGrid?","<code>Grid</code> builds every cell eagerly and aligns real rows and columns. <code>LazyVGrid</code> builds cells lazily for large scrolling collections, with column definitions only."],
["m06","M","How do you paginate a list?","Trigger the next page when the last row (or a threshold row) appears, track a cursor or page, prevent duplicate in-flight loads, and show a footer loading state."],
["m06","J","How do you add pull to refresh?","Attach <code>.refreshable { await reload() }</code> to a List or ScrollView. The spinner stays visible until the async work finishes."],

["m07","J","NavigationView vs NavigationStack?","NavigationView is deprecated. NavigationStack (iOS 16+) supports a data-driven path and <code>navigationDestination(for:)</code>, which enables programmatic navigation and deep links."],
["m07","M","What is NavigationPath?","A type-erased list of Hashable values representing the stack. It has a Codable representation, so you can save and restore it."],
["m07","M","How do you pop to root?","Reset the bound path to empty: <code>path = NavigationPath()</code>, or <code>removeAll()</code> on a typed array path."],
["m07","M","How do you handle deep links?","Receive the URL in <code>onOpenURL</code> (or a notification handler), parse it into your Route enum in one place, then mutate the router's path. Universal links also need associated domains."],
["m07","S","How does a coordinator work in SwiftUI?","A Router or Coordinator object owns the path and presentation state and exposes intent methods (<code>showMachine(id:)</code>). Views call it instead of knowing destinations, so navigation is testable."],
["m07","M","sheet(isPresented:) vs sheet(item:)?","<code>sheet(item:)</code> presents for a specific Identifiable value and dismisses when it becomes nil, which avoids showing stale data. Use it whenever the sheet depends on a selection."],
["m07","M","How does a view dismiss itself?","Read <code>@Environment(\\.dismiss) private var dismiss</code> and call <code>dismiss()</code>. It works for sheets and pushed views."],
["m07","J","What is scenePhase?","An environment value with <code>.active</code>, <code>.inactive</code> and <code>.background</code>, used to react to lifecycle changes such as refreshing a session on foreground."],
["m07","S","How do you restore navigation state?","Encode <code>path.codable</code> into <code>SceneStorage</code> or a file on background, and decode it on launch. Every route value must be Codable."],

["m08","J","Implicit vs explicit animation?","<code>.animation(_:value:)</code> animates a subtree when a given value changes. <code>withAnimation</code> wraps a state change and animates every view that depends on it."],
["m08","M","What is a transition?","How a view animates in when inserted and out when removed (<code>.opacity</code>, <code>.move</code>, <code>.scale</code>, asymmetric). It needs an animated change that inserts or removes the view."],
["m08","M","What does matchedGeometryEffect do?","It matches the frames of two views with the same id in one namespace, so swapping between them animates position and size as if it were one view."],
["m08","M","How do gestures compose?","With <code>simultaneousGesture</code>, <code>.sequenced(before:)</code>, <code>.exclusively(before:)</code> and <code>highPriorityGesture</code>, which decide which recogniser wins."],
["m08","S","Why are springs the default?","Springs are defined by duration and bounce, and they carry velocity through interruptions, so rapid state changes animate continuously instead of jumping."],
["m08","M","How do you respect Reduce Motion?","Read <code>@Environment(\\.accessibilityReduceMotion)</code> and replace movement or scaling with fades, or remove the animation."],
["m08","S","What are PhaseAnimator and KeyframeAnimator?","PhaseAnimator steps through a sequence of discrete phases. KeyframeAnimator drives separate property tracks over time with keyframes and curves."],
["m08","J","Why doesn't my animation run?","Common causes: the state change isn't inside <code>withAnimation</code>, <code>.animation</code> has no matching <code>value</code>, the view gets a new identity instead of updating, or a transition's view isn't inserted inside an animated change."],

["m09","J","What is MVVM?","Model holds data, View renders, and ViewModel holds presentation state and the logic that changes it. The view binds to the view model's state and forwards user intent."],
["m09","M","Is MVVM necessary in SwiftUI?","Not always. Views already hold state. A view model earns its place when a screen has async loading, non-trivial logic or tests. Skip it for simple views."],
["m09","M","How do you make a view model testable?","Inject dependencies through protocols, avoid singletons and global state, expose state as an Equatable enum, and make actions async so tests can await them."],
["m09","M","Why model screen state as an enum?","Impossible combinations such as loading plus error can't exist, and the view's switch is checked for exhaustiveness."],
["m09","S","Explain Clean Architecture on iOS.","Presentation (views, view models), Domain (entities, use cases, repository protocols) and Data (API, database, repository implementations). Dependencies point inward, so the domain knows no frameworks."],
["m09","M","Constructor vs environment injection?","Constructor injection is explicit and compile-checked. Environment injection is convenient for deep trees but resolved at runtime, and missing values crash or fall back to defaults."],
["m09","S","Compare MVC, MVVM, VIPER and TCA.","MVC tends toward massive view controllers. MVVM separates presentation logic. VIPER enforces strict roles at the cost of boilerplate. TCA uses unidirectional reducers with strong testability and a dependency on the library."],
["m09","M","Where does navigation live in MVVM?","In a router or coordinator. The view model calls a router protocol or emits an intent, and views stay unaware of destinations."],
["m09","S","Should view models be @MainActor?","Usually yes. They drive UI state, so main-actor isolation makes every mutation safe and checked. Heavy work goes to nonisolated or <code>@concurrent</code> services."],

["m10","J","What is a singleton and what are its drawbacks?","One shared instance behind a private init. Drawbacks: hidden global state, tight coupling, hard to replace in tests, and stale state across logouts. Mitigate by injecting it through a protocol."],
["m10","M","Explain delegation.","One object hands decisions or events to another through a protocol, as in UITableViewDelegate. The delegate reference is weak to avoid a cycle."],
["m10","M","Observer options in iOS?","NotificationCenter (app-wide, loosely coupled), KVO (Objective-C properties), Combine publishers, Observation (<code>@Observable</code>) and AsyncStream. Choose by scope and coupling."],
["m10","M","Give a Strategy pattern example.","Discount rules behind a <code>DiscountStrategy</code> protocol (none, flat, percent) chosen at runtime from campaign data, with no if-chains in checkout."],
["m10","M","Adapter vs Facade?","An adapter converts one interface into the one your code expects, such as wrapping a vendor SDK. A facade gives a simple interface over a complex subsystem."],
["m10","M","What is the Decorator pattern in Swift?","A type that wraps another conforming to the same protocol and adds behaviour such as logging, caching or auth, which you compose at the composition root."],
["m10","S","What does the Repository pattern give you?","One protocol for data access that hides whether data comes from the network, a cache or a database, so domain and view models don't know about URLSession or SwiftData."],
["m10","M","Is Builder useful in Swift?","Less often than in Java, because default arguments and memberwise inits cover most cases. SwiftUI modifiers and request builders are builder-like."],
["m10","S","How do you implement the State pattern in Swift?","An enum of states with a <code>mutating func handle(_ event:)</code> transition function. Illegal states are unrepresentable, and illegal transitions are handled in one place."],
["m10","M","When use a Factory?","When creation logic depends on configuration (feature flags, region, payment type) and callers should only see a protocol."],

["m11","J","What is GCD?","Grand Central Dispatch: a C-level API for submitting closures to dispatch queues that run on a system-managed thread pool."],
["m11","J","Serial vs concurrent queue?","A serial queue runs one task at a time in FIFO order. A concurrent queue can run several tasks at once. Their start order is FIFO, but completion order isn't guaranteed."],
["m11","J","sync vs async dispatch?","<code>sync</code> blocks the caller until the task completes. <code>async</code> enqueues and returns immediately."],
["m11","M","What causes a GCD deadlock?","Synchronously dispatching onto the serial queue you're already on (for example <code>main.sync</code> from main), or two queues waiting synchronously on each other."],
["m11","M","What are QoS classes?","userInteractive, userInitiated, default, utility and background. They tell the system how important the work is for scheduling priority and energy use."],
["m11","M","What is DispatchGroup for?","Tracking several async tasks and running a completion once all have finished. Every <code>enter()</code> needs exactly one <code>leave()</code>."],
["m11","M","What do barrier blocks do?","On a custom concurrent queue, a barrier waits for earlier tasks, runs alone, and then lets later tasks resume. That makes a reader-writer lock. Barriers do nothing on global queues."],
["m11","M","What are the risks of DispatchSemaphore?","It blocks a thread, which can cause priority inversion and deadlocks on main, and in Swift Concurrency it can starve the fixed-size cooperative pool."],
["m11","S","OperationQueue vs GCD?","Operations add dependencies, cancellation state, KVO-observable status and <code>maxConcurrentOperationCount</code>. GCD is lighter and lower level."],
["m11","S","What is thread explosion?","Many tasks blocking on concurrent queues makes GCD spawn extra threads, wasting memory and context switches. Swift Concurrency's pool is capped at the core count to prevent it."],
["m11","M","How do you make a class thread-safe?","Route all access to mutable state through one mechanism: a serial queue, a lock (NSLock, Mutex) or an actor. Every read and write path must go through it."],
["m11","J","Why must UI updates happen on the main thread?","UIKit and SwiftUI aren't thread-safe, and the main run loop drives event handling and rendering. Background UI updates cause glitches and crashes."],

["m12","J","What does async/await improve over completion handlers?","Linear control flow, error propagation with <code>try</code>, no forgotten or double callbacks, built-in cancellation, and compiler-checked isolation."],
["m12","J","What is a Task?","A unit of asynchronous work. <code>Task { }</code> inherits the current actor, priority and task-locals. <code>Task.detached</code> inherits none of them."],
["m12","M","async let vs TaskGroup?","<code>async let</code> suits a fixed, small number of concurrent child tasks. <code>withTaskGroup</code> suits a dynamic number of children."],
["m12","M","What is structured concurrency?","Child tasks are bound to their parent's scope. The parent waits for them, errors and cancellation propagate, and no task outlives its scope by accident."],
["m12","M","How does cancellation work?","Cooperatively. A cancelled task keeps running until it checks <code>Task.isCancelled</code> or calls <code>Task.checkCancellation()</code>. URLSession and <code>Task.sleep</code> throw <code>CancellationError</code> for you."],
["m12","M","What is an actor?","A reference type that isolates its mutable state and runs one piece of its code at a time. Calls from outside are async and need <code>await</code>."],
["m12","S","What is actor reentrancy?","At each <code>await</code> inside an actor, other calls can run, so state may have changed when you resume. Re-check assumptions after awaits and de-duplicate work with a stored Task."],
["m12","M","What is @MainActor?","A global actor representing the main thread. Annotating a type or function guarantees it runs there, and the compiler enforces the hops."],
["m12","M","What is Sendable?","A marker that a type is safe to pass across concurrency domains: value types with Sendable members, actors, and immutable final classes. <code>@unchecked Sendable</code> is a manual promise."],
["m12","S","What does Swift 6 language mode change?","Data-race checks become errors. You migrate module by module. Swift 6.2 adds approachable concurrency: an option for default MainActor isolation, and <code>@concurrent</code> to opt work onto the concurrent pool."],
["m12","M","How do you bridge a callback API to async?","Use <code>withCheckedContinuation</code> or <code>withCheckedThrowingContinuation</code> and resume exactly once on every path."],
["m12","S","When should you use Task.detached?","Rarely: only when you must not inherit the actor, priority or task-locals. A nonisolated or <code>@concurrent</code> function is usually the better tool."],
["m12","M","What is AsyncStream for?","Turning callback or delegate streams (sockets, BLE, location) into <code>for await</code> loops, with a buffering policy and <code>onTermination</code> cleanup."],
["m12","S","What is a global actor?","A singleton actor you apply as an attribute, like <code>@MainActor</code> or a custom <code>@globalActor</code>, so code across many types shares one isolation domain."],

["m13","J","data vs download vs upload tasks?","Data tasks return the body in memory. Download tasks write to a file and can run in background sessions. Upload tasks send a body or file."],
["m13","M","How do you design a network layer?","A typed Endpoint describing request and response, a generic APIClient protocol, an error enum, decoding, decorators for auth, logging and retry, and injection into features."],
["m13","M","How do you handle 401s and token refresh?","Use a single-flight refresh actor, retry the original request once with the new token, and sign the user out only when the refresh itself is rejected."],
["m13","M","What is a good retry strategy?","Retry only transient, idempotent failures, with exponential backoff and jitter, a cap on attempts, respect for <code>Retry-After</code>, and cancellation-aware sleeps."],
["m13","J","How do you map JSON keys with Codable?","Use a <code>CodingKeys</code> enum with raw values, or <code>keyDecodingStrategy = .convertFromSnakeCase</code>. Don't combine the two."],
["m13","M","How do you handle missing JSON fields?","Use optional properties, or <code>decodeIfPresent</code> with a default in a custom init. Decide for each field whether missing data is an error."],
["m13","S","How do you test networking code?","Fake the APIClient protocol for feature tests. Test the real client with a URLProtocol stub on an ephemeral session, and assert on both the request and the error mapping."],
["m13","M","How do you cancel in-flight requests?","Cancel the Task that awaits them. Async URLSession methods respond to cancellation and throw. In SwiftUI, <code>.task</code> cancels for you."],
["m13","S","What is certificate pinning?","Validating the server's certificate or public-key hash in the URLSession trust challenge. It blocks man-in-the-middle attacks but needs a key rotation plan."],
["m13","M","Which caching strategies do you know?","URLCache honouring Cache-Control and ETags, in-memory NSCache, a disk or database cache, and stale-while-revalidate in a repository."],
["m13","S","How do you build a robust WebSocket client?","Use URLSessionWebSocketTask with a receive loop, pings and heartbeats, reconnect with backoff, and session resume. Expose messages as an AsyncStream."],
["m13","M","Offset vs cursor pagination?","Offset is simple but duplicates or skips rows when data changes. Cursor pagination resumes from a stable marker and is robust to inserts."],
["m13","J","What is App Transport Security?","An iOS policy that requires HTTPS with modern TLS by default. Exceptions are declared in Info.plist and reviewed by Apple."],

["m14","J","UserDefaults vs Keychain?","UserDefaults is an unencrypted plist for small preferences. Keychain is encrypted storage for secrets like tokens, with access-control options."],
["m14","M","SwiftData vs Core Data?","SwiftData (iOS 17+) is Swift-native with <code>@Model</code>, <code>@Query</code> and macros, built on Core Data's store. Core Data is more mature, with finer control and older OS support."],
["m14","M","What is a ModelContext?","The SwiftData object you insert, delete, fetch and save through. The main context comes from the environment, and background work uses a <code>@ModelActor</code>."],
["m14","S","How does Core Data concurrency work?","Each NSManagedObjectContext is bound to its queue. Access objects only inside <code>perform</code>, and pass NSManagedObjectIDs between contexts, never objects."],
["m14","M","Where do you store files?","Documents for user-created data (backed up), Application Support for app data, Caches for re-creatable data (may be purged), tmp for short-lived files."],
["m14","M","What are @AppStorage's pitfalls?","It's backed by UserDefaults, so it suits only small, non-sensitive values. Keys are strings and only property-list types are supported."],
["m14","S","How do you handle data model migrations?","Core Data: lightweight migration for additive changes, staged or custom for the rest. SwiftData: a <code>VersionedSchema</code> per version plus a <code>SchemaMigrationPlan</code>."],
["m14","M","NSCache vs Dictionary?","NSCache is thread-safe, evicts under memory pressure and doesn't copy keys. A Dictionary does none of that."],

["m15","J","What is Combine?","Apple's reactive framework. Publishers emit values over time, operators transform them, and subscribers such as <code>sink</code> or <code>assign</code> receive them."],
["m15","M","What is AnyCancellable?","A token that cancels its subscription when it's deallocated. Store it, usually in a <code>Set</code>, for as long as you want the subscription to live."],
["m15","M","debounce vs throttle?","Debounce waits for a quiet period and then emits the latest value. Throttle emits at most one value per interval."],
["m15","M","What does switchToLatest do?","When a new inner publisher arrives, it cancels the previous one. Typing a new search query cancels the stale request."],
["m15","M","PassthroughSubject vs CurrentValueSubject?","A passthrough subject only forwards new values. A current-value subject stores the latest value and gives it to new subscribers immediately."],
["m15","S","Combine or async/await in 2026?","async/await for one-shot work, AsyncSequence for most streams, Observation for UI state. Combine is still useful for complex time-based operator chains and existing code."],
["m15","M","How do Combine subscriptions leak?","A <code>sink</code> that captures <code>self</code> strongly, stored in <code>self.cancellables</code>, creates a cycle. Use <code>[weak self]</code> or <code>assign(to: &$property)</code>."],
["m15","M","receive(on:) vs subscribe(on:)?","<code>receive(on:)</code> changes where downstream values are delivered. <code>subscribe(on:)</code> changes where the upstream subscription and its work happen."],

["m16","J","Unit vs integration vs UI tests?","Unit tests isolate logic with fakes. Integration tests combine real components such as client and decoder. UI tests drive the running app through XCUITest."],
["m16","M","Swift Testing vs XCTest?","Swift Testing has <code>@Test</code> functions, the <code>#expect</code>/<code>#require</code> macros, parameterised tests, traits, struct suites and parallel runs by default. XCTest remains for UI and performance tests."],
["m16","M","How do you mock dependencies in Swift?","Put dependencies behind protocols (or structs of closures) and write fakes that return scripted results and record calls. No runtime mocking library is needed."],
["m16","M","How do you test async code?","Write async test functions and await the code. Use <code>confirmation()</code> in Swift Testing, or XCTestExpectation with <code>fulfillment(of:)</code>, for callbacks."],
["m16","S","How do you test a view model's state transitions?","Inject fakes you can suspend and resume (for example with continuations), then assert the state at each step: loading, then loaded or failed."],
["m16","M","What is snapshot testing?","Rendering a view to an image and comparing it with a stored reference to catch visual regressions. It's sensitive to OS, fonts and device, so pin those."],
["m16","J","What does @testable import do?","It gives the test target access to the module's internal symbols."],
["m16","S","How do you keep tests deterministic?","Inject clocks, dates, UUID generators and randomness, never hit the real network, and serialise suites that touch shared global state."],
["m16","M","Is 100% code coverage a good goal?","No. Coverage shows untested code, not test quality. Focus on business logic, error paths and regressions you've actually shipped."],

["m17","J","What is a hang?","The main thread is busy long enough that the app can't respond to input, so taps and scrolling freeze."],
["m17","M","Which Instruments do you use?","Time Profiler, Hangs, the SwiftUI instrument, Allocations, Leaks, Network and Energy. Profile Release builds on a real device."],
["m17","M","What are common SwiftUI performance problems?","Heavy work in body, broad dependencies that invalidate large trees, unstable ids, AnyView, decoding large images on main, and GeometryReader inside list rows."],
["m17","M","How do you debug excessive re-renders?","Add <code>let _ = Self._printChanges()</code> in debug builds, use the SwiftUI instrument's cause-and-effect view, then narrow what each body reads."],
["m17","S","How do you improve launch time?","Defer non-essential work until after the first frame, initialise SDKs lazily, reduce dynamic frameworks, avoid heavy static initialisers, and measure with the App Launch template and MetricKit."],
["m17","M","How do you reduce image memory?","Downsample to the display size with ImageIO, cache the decoded thumbnails, and never load full-resolution images into list cells."],
["m17","S","How do you symbolicate a crash?","Match the crash's binary UUID to its dSYM, then use Xcode Organizer, a crash service with uploaded dSYMs, or <code>atos</code>."],
["m17","M","Which LLDB commands do you use?","<code>po</code> and <code>v</code> to inspect values, <code>expr</code> to evaluate, <code>bt</code> for backtraces, conditional breakpoints and watchpoints."],
["m17","S","What is MetricKit?","A framework that delivers daily performance and diagnostic payloads from real devices: hangs, crashes, launch time, memory and energy."],

["m18","J","How do you use a UIKit view in SwiftUI?","Wrap it in <code>UIViewRepresentable</code> or <code>UIViewControllerRepresentable</code>: create it in make, sync it in update, and use a Coordinator for delegates."],
["m18","J","How do you use SwiftUI inside UIKit?","Wrap it in <code>UIHostingController</code> and present or embed it. For cells, use <code>UIHostingConfiguration</code>."],
["m18","M","What is a representable's Coordinator?","An object created by <code>makeCoordinator</code> that acts as the UIKit view's delegate or target and sends events back to SwiftUI through bindings or closures."],
["m18","M","How do Live Activities update?","Locally with <code>activity.update</code>, or remotely through ActivityKit push notifications sent to the activity's push token via APNs. End them with <code>end</code> and a dismissal policy."],
["m18","M","How do widget timelines work?","A TimelineProvider returns dated entries and a reload policy. Widgets render snapshots of those entries; they aren't live views."],
["m18","M","What are the accessibility essentials?","Meaningful labels, traits, combined elements, Dynamic Type, sufficient contrast, VoiceOver testing, and identifiers for UI tests."],
["m18","S","Why modularise an app with SPM?","Feature and core packages with explicit dependencies give faster incremental builds, enforced boundaries through access control, and isolated previews and tests."],
["m18","M","What are the basics of code signing?","A certificate identifies the developer, an App ID identifies the app, and a provisioning profile ties them to devices and entitlements. Xcode can manage this automatically."],
["m18","S","What is a privacy manifest?","A <code>PrivacyInfo.xcprivacy</code> file declaring the data you collect and your reasons for using certain APIs. Apps and third-party SDKs both need one."],
["m18","M","How do you protect sensitive actions with biometrics?","Use LocalAuthentication's <code>LAContext</code> to evaluate a biometrics policy, and store secrets in the Keychain with access-control flags that require user presence."],
["m18","J","What is the SwiftUI app lifecycle?","An <code>@main</code> App struct declares Scenes such as WindowGroup. <code>scenePhase</code> reports state changes, and <code>UIApplicationDelegateAdaptor</code> handles push and other app-delegate callbacks."],
["m18","S","Describe the push notification flow.","Request permission, register for remote notifications, receive the APNs device token, send it to your server, and the server sends payloads through APNs. A notification service extension can modify content on arrival."],
["m19", "J", "What do you get for free when you rebuild with the iOS 26 SDK?", "Standard bars, tab bars, toolbars, sheets and menus adopt Liquid Glass automatically. Your job is mostly removing custom backgrounds that fight it and checking content under the bars."],
["m19", "M", "When should you apply glassEffect yourself?", "For your own floating controls in the navigation layer, such as a custom control cluster or a map overlay. Group nearby ones in a GlassEffectContainer. Don't put glass on content such as rows and cards."],
["m19", "M", "How does the SwiftUI WebView in iOS 26 differ from wrapping WKWebView?", "It's a native SwiftUI view. For control you pair it with an observable WebPage (title, loading, navigation), so there's no UIViewRepresentable and no delegate boilerplate."],
["m19", "M", "How do you check whether the on-device model can be used?", "Read SystemLanguageModel.default.availability, and fall back gracefully when it's unavailable: the device isn't eligible, Apple Intelligence is off, or the model isn't ready."],
["m19", "S", "What does @Generable give you in Foundation Models?", "The model produces a typed Swift value matching the struct's schema, constrained by @Guide descriptions and rules, instead of free text you have to parse."],
["m19", "S", "What are tools in the Foundation Models framework?", "Types conforming to Tool that the model can call during a response to get facts or perform actions. Their arguments are @Generable, and the session decides when to call them."],
["m19", "M", "Why are App Intents important beyond Siri?", "One intent powers Siri, Shortcuts, Spotlight, the Action button, Control Center and interactive widget buttons. It's your app's public API to the system."],
["m19", "M", "What must every StoreKit 2 purchase flow do?", "Verify the transaction, unlock only on .verified, call finish(), and listen to Transaction.updates from launch for renewals, refunds and Ask to Buy."],
["m19", "J", "Why write StoreKit.Transaction in a SwiftUI file?", "SwiftUI has its own Transaction type for animations, so the bare name is ambiguous. The compiler reports it as an error."],
["m19", "M", "How do String Catalogs handle plurals?", "The catalog stores variants per plural category for each language, such as one and other (plus few or many where a language needs them), for one interpolated string like \"\\(count) items\"."],
["m19", "S", "What can a Notification Service Extension do, and what are its limits?", "Modify content before display (attach media, decrypt, localise) when the payload has mutable-content: 1. It has about 30 seconds, and serviceExtensionTimeWillExpire must deliver a best attempt."],
["m19", "M", "How do you route a notification tap to the right screen?", "Handle didReceive in UNUserNotificationCenterDelegate (set early at launch), read the deep link from userInfo, and pass it to the same router used for URLs and Live Activity taps."]
];

    code: S`@MainActor @Observable
final class Store<State, Action: Sendable> {
    private(set) var state: State
    private let reduce: (inout State, Action) -> Effect<Action>

    init(_ initial: State, reduce: @escaping (inout State, Action) -> Effect<Action>) {
        state = initial
        self.reduce = reduce
    }

    func send(_ action: Action) {
        let effect = reduce(&state, action)          // pure, synchronous change
        guard let run = effect.run else { return }
        Task { if let next = await run() { send(next) } }   // effect feeds back an action
    }
}

struct Effect<Action: Sendable> {
    var run: (@Sendable () async -> Action?)?
    static var none: Effect { Effect(run: nil) }
}

    private var inFlight: [URL: Task<UIImage?, Never>] = [:]

    func image(for url: URL) async -> UIImage? {

        if let running = inFlight[url] { return await running.value }   // de-duplicate

    code: S`@MainActor @Observable
final class CartStore {
    private(set) var quantities: [String: Int] = [:]
    private var latest: [String: Int] = [:]               // sku → newest ticket
    private let api: CartAPI
    init(api: CartAPI) { self.api = api }

    func setQuantity(_ quantity: Int, for sku: String) async {
        let previous = quantities[sku, default: 0]
        quantities[sku] = quantity                         // optimistic
        let ticket = latest[sku, default: 0] + 1
        latest[sku] = ticket
        do {
            let confirmed = try await api.setQuantity(sku: sku, quantity: quantity)
            guard latest[sku] == ticket else { return }    // stale response: a newer tap won
            quantities[sku] = confirmed                    // server may clamp to stock
        } catch {
            guard latest[sku] == ticket else { return }
            quantities[sku] = previous                     // roll back, show a toast

    }

    code: S`struct OutgoingMessage: Sendable, Codable, Identifiable {
    let id: UUID                     // client id: lets the server de-duplicate retries
    let chatID: String
    let text: String
    let createdAt: Date
}

actor Outbox {
    private var queue: [OutgoingMessage] = []
    private var flushing = false
    private let send: @Sendable (OutgoingMessage) async throws -> Void

    init(send: @escaping @Sendable (OutgoingMessage) async throws -> Void) { self.send = send }

    func enqueue(_ message: OutgoingMessage) async {
        queue.append(message)                     // persist to SwiftData here as well
        await flush()
    }

    func flush() async {                          // also call when the socket reconnects
        guard !flushing else { return }
        flushing = true
        defer { flushing = false }
        while let next = queue.first {
            do {
                try await send(next)
                queue.removeFirst()               // remove only after the server acks
            } catch {
                return                            // offline: keep order, retry later
            }
        }
    }
}` },

import UIKit

@concurrent
func downsample(_ data: Data, to size: CGSize, scale: CGFloat) async -> UIImage? {
    let sourceOptions = [kCGImageSourceShouldCache: false] as CFDictionary
    guard let source = CGImageSourceCreateWithData(data as CFData, sourceOptions) else { return nil }
    let options = [
        kCGImageSourceCreateThumbnailFromImageAlways: true,
        kCGImageSourceShouldCacheImmediately: true,           // decode now, off main
        kCGImageSourceCreateThumbnailWithTransform: true,     // respect EXIF orientation
        kCGImageSourceThumbnailMaxPixelSize: max(size.width, size.height) * scale
    ] as CFDictionary
    guard let image = CGImageSourceCreateThumbnailAtIndex(source, 0, options) else { return nil }
    return UIImage(cgImage: image)
}` },
