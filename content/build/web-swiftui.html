// Browser simulations of SwiftUI behaviour. Each mount(el) renders into el and wires its own events.
const PG = {};
const pgEsc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
const seg = (name, opts, cur) => `<span class="seg" role="group" aria-label="${name}">${opts.map(([v, t]) => `<button data-v="${v}" data-seg="${name}" aria-pressed="${cur === v}">${t}</button>`).join("")}</span>`;

PG.ufstate = { t: "UI = f(State)", d: "Change the state on the left. In <b>Declarative</b> mode the screen is recomputed from state every time. In <b>Imperative</b> mode only the views a handler remembered to update change. Add an item from an empty cart and look at the badge and the Checkout button.",
  mount(el) {
    const s = { count: 0, signedIn: true, mode: "decl", evals: 1, log: ["body #1 · first render"], ui: { badge: "", badgeHidden: true, checkout: false, greet: "Hi, Satyajit" } };
    const draw = () => {
      const decl = s.mode === "decl";
      const v = decl ? { badge: String(s.count), badgeHidden: s.count === 0, checkout: s.count > 0, greet: s.signedIn ? "Hi, Satyajit" : "Sign in" } : s.ui;
      el.innerHTML = `<div class="pg-ctl">${seg("mode", [["decl", "Declarative (SwiftUI)"], ["imp", "Imperative (UIKit-style)"]], s.mode)}
        <button class="btn small" data-a="add">Add item</button><button class="btn small" data-a="clear">Empty cart</button><button class="btn small" data-a="sign">${s.signedIn ? "Sign out" : "Sign in"}</button></div>
        <div class="pg-split">
          <div class="pg-panel"><span class="eyebrow">State</span><pre class="pg-mono">count    = ${s.count}\nsignedIn = ${s.signedIn}</pre>
            <span class="eyebrow">${decl ? "body evaluations" : "handlers that ran"}</span><ol class="pg-log">${s.log.slice(-6).map(l => `<li>${pgEsc(l)}</li>`).join("")}</ol></div>
          <div class="pg-phone" aria-label="Simulated screen"><div class="pg-bar"><b>${pgEsc(v.greet)}</b><span class="pg-cart">Cart${v.badgeHidden ? "" : `<i class="pg-badge">${pgEsc(v.badge)}</i>`}</span></div>
            <div class="pg-rows"><span>Masala Chips · ₹20</span><span>Cold Coffee · ₹45</span></div>
            <button class="pg-cta" ${v.checkout ? "" : "disabled"}>Checkout</button>
            ${!decl && (s.ui.badgeHidden !== (s.count === 0) || s.ui.checkout !== (s.count > 0) || s.ui.greet !== (s.signedIn ? "Hi, Satyajit" : "Sign in")) ? `<p class="pg-warn">Screen out of sync with state</p>` : ""}</div>
        </div>`;
    };
    el.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.seg === "mode") { s.mode = b.dataset.v; s.ui = { badge: String(s.count), badgeHidden: s.count === 0, checkout: s.count > 0, greet: s.signedIn ? "Hi, Satyajit" : "Sign in" }; s.log = [s.mode === "decl" ? `body #${++s.evals} · mode switched` : "viewDidLoad: set every view once"]; }
      const a = b.dataset.a;
      if (a === "add") { s.count++; if (s.mode === "decl") s.log.push(`body #${++s.evals} · count changed → ${s.count}`); else { s.ui.badge = String(s.count); s.log.push("addTapped: badge.text = count  (forgot isHidden, button)"); } }
      if (a === "clear") { s.count = 0; if (s.mode === "decl") s.log.push(`body #${++s.evals} · count changed → 0`); else { s.ui.badge = "0"; s.log.push("clearTapped: badge.text = \"0\""); } }
      if (a === "sign") { s.signedIn = !s.signedIn; if (s.mode === "decl") s.log.push(`body #${++s.evals} · signedIn changed → ${s.signedIn}`); else { s.ui.greet = s.signedIn ? "Hi, Satyajit" : "Sign in"; s.log.push("authChanged: greeting.text updated"); } }
      draw();
    });
    draw();
  },
  swift: S`struct CartBar: View {
    @State private var count = 0
    var body: some View {
        let _ = Self._printChanges()          // same log as the playground
        HStack {
            if count > 0 { Text("\(count)") }
            Button("Add item") { count += 1 }
            Button("Checkout") { }.disabled(count == 0)
        }
    }
}` };

PG.binding = { t: "@State vs @Binding", d: "The parent owns <code>quantity</code>. Pass it as a <b>Binding</b> and both screens edit one value. Pass a <b>copy</b> into a child's own <code>@State</code> and the two drift apart. A child's <code>@State</code> keeps its first value even when the parent changes.",
  mount(el) {
    const s = { mode: "bind", parent: 1, child: 1 };
    const draw = () => {
      const childVal = s.mode === "bind" ? s.parent : s.child;
      el.innerHTML = `<div class="pg-ctl">${seg("mode", [["bind", "Pass $quantity (Binding)"], ["copy", "Pass quantity into child @State"]], s.mode)}</div>
        <div class="pg-split">
          <div class="pg-panel"><span class="eyebrow">ProductDetail (parent)</span><p class="pg-big num">${s.parent}</p><p>Total ₹${s.parent * 49}</p><div class="pg-ctl"><button class="btn small" data-a="p-">−</button><button class="btn small" data-a="p+">+</button></div></div>
          <div class="pg-panel"><span class="eyebrow">QuantityPicker (child)</span><p class="pg-big num">${childVal}</p><p>${s.mode === "bind" ? "reads the parent's storage" : "its own copy"}</p><div class="pg-ctl"><button class="btn small" data-a="c-">−</button><button class="btn small" data-a="c+">+</button></div></div>
        </div>
        <pre class="pg-mono">${s.mode === "bind" ? "QuantityPicker(quantity: $quantity)   // @Binding var quantity: Int" : "QuantityPicker(start: quantity)       // @State private var quantity: Int = start"}</pre>
        ${s.parent !== childVal ? `<p class="pg-warn">Parent says ${s.parent}, child says ${childVal}: two sources of truth</p>` : `<p class="pg-ok">One source of truth</p>`}`;
    };
    el.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.seg === "mode") { s.mode = b.dataset.v; s.child = s.parent; }
      const a = b.dataset.a, clamp = n => Math.max(1, Math.min(5, n));
      if (a === "p+" || a === "p-") s.parent = clamp(s.parent + (a === "p+" ? 1 : -1));
      if (a === "c+" || a === "c-") { if (s.mode === "bind") s.parent = clamp(s.parent + (a === "c+" ? 1 : -1)); else s.child = clamp(s.child + (a === "c+" ? 1 : -1)); }
      draw();
    });
    draw();
  },
  swift: S`struct QuantityPicker: View {
    @Binding var quantity: Int
    var body: some View { Stepper("Qty \(quantity)", value: $quantity, in: 1...5) }
}`
};

PG.modorder = { t: "Modifier order", d: "Each modifier wraps everything above it. Reorder the list and watch where the orange background and the blue border land.",
  mount(el) {
    const s = { order: ["padding", "background", "frame", "border"] };
    const M = { padding: ".padding(16)", background: ".background(.orange)", frame: ".frame(width: 220)", border: ".border(.blue, width: 2)" };
    const wrap = (inner, m) => m === "padding" ? `<div style="padding:16px">${inner}</div>`
      : m === "background" ? `<div style="background:#F6A04D">${inner}</div>`
      : m === "frame" ? `<div style="width:220px;display:flex;justify-content:center">${inner}</div>`
      : `<div style="outline:2px solid #3A7BE0;outline-offset:-2px">${inner}</div>`;
    const draw = () => {
      let html = `<span class="pg-text">Add to cart</span>`;
      s.order.forEach(m => { html = wrap(html, m); });
      el.innerHTML = `<div class="pg-split">
        <div class="pg-panel"><span class="eyebrow">Modifiers, top to bottom</span>
          <pre class="pg-mono">Text("Add to cart")\n${s.order.map(m => "    " + M[m]).join("\n")}</pre>
          <ol class="pg-order">${s.order.map((m, i) => `<li><code>${M[m]}</code><span><button class="btn small" data-up="${i}" aria-label="Move ${m} up" ${i === 0 ? "disabled" : ""}>↑</button><button class="btn small" data-dn="${i}" aria-label="Move ${m} down" ${i === s.order.length - 1 ? "disabled" : ""}>↓</button></span></li>`).join("")}</ol></div>
        <div class="pg-panel pg-stage"><div style="display:inline-flex;flex-direction:column;align-items:flex-start">${html}</div></div></div>`;
    };
    el.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      const up = b.dataset.up, dn = b.dataset.dn;
      if (up !== undefined) { const i = +up; [s.order[i - 1], s.order[i]] = [s.order[i], s.order[i - 1]]; }
      if (dn !== undefined) { const i = +dn; [s.order[i + 1], s.order[i]] = [s.order[i], s.order[i + 1]]; }
      draw();
    });
    draw();
  },
  swift: S`Text("Add to cart")
    .padding(16)
    .background(.orange)
    .frame(width: 220)
    .border(.blue, width: 2)`
};

PG.identity = { t: "List identity: ids vs indices", d: "Star a show, then delete or insert a row. With <b>stable ids</b> the star stays with its show. With <b>indices</b> the per-row state belongs to a position, so it jumps to whichever show now sits there.",
  mount(el) {
    const base = [["s1", "Dark"], ["s2", "Severance"], ["s3", "The Bear"], ["s4", "Shōgun"], ["s5", "Slow Horses"]];
    const s = { mode: "id", items: base.slice(), starred: new Set(), next: 6 };
    const key = (it, i) => s.mode === "id" ? it[0] : "#" + i;
    const draw = () => {
      el.innerHTML = `<div class="pg-ctl">${seg("mode", [["id", "ForEach(shows) · id"], ["index", "ForEach(shows.indices)"]], s.mode)}<button class="btn small" data-a="ins">Insert at top</button><button class="btn small" data-a="reset">Reset</button></div>
        <div class="pg-list">${s.items.map((it, i) => `<div class="pg-row"><button class="pg-star" data-star="${key(it, i)}" aria-pressed="${s.starred.has(key(it, i))}" aria-label="Star ${pgEsc(it[1])}">${s.starred.has(key(it, i)) ? "★" : "☆"}</button><span>${pgEsc(it[1])}</span><code>${s.mode === "id" ? it[0] : "index " + i}</code><button class="btn small" data-del="${i}">Delete</button></div>`).join("")}</div>
        <p class="pg-note">Row state is keyed by <code>${s.mode === "id" ? "show.id" : "position"}</code>.</p>`;
    };
    el.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.seg === "mode") { s.mode = b.dataset.v; s.starred.clear(); }
      if (b.dataset.star) { const k = b.dataset.star; s.starred.has(k) ? s.starred.delete(k) : s.starred.add(k); }

PG.lifecycle = { t: "View lifecycle in a NavigationStack", d: "Push, pop and switch tabs. The log shows the order SwiftUI calls <code>onAppear</code> and <code>onDisappear</code>, and when a view's <code>.task</code> starts and is cancelled. Popping a view also discards its <code>@State</code>.",
  mount(el) {
    const s = { tab: 0, stacks: [["Home"], ["Profile"]], log: ["Home.onAppear", "Home.task started"] };
    const top = () => s.stacks[s.tab][s.stacks[s.tab].length - 1];
    const hide = v => s.log.push(`${v}.onDisappear`, `${v}.task cancelled`);
    const show = v => s.log.push(`${v}.onAppear`, `${v}.task started`);
    const draw = () => {
      el.innerHTML = `<div class="pg-ctl"><button class="btn small" data-a="push-d">Push VideoDetail</button><button class="btn small" data-a="push-p">Push Player</button><button class="btn small" data-a="pop" ${s.stacks[s.tab].length < 2 ? "disabled" : ""}>Back</button><button class="btn small" data-a="tab">Switch to ${s.tab ? "Home" : "Profile"} tab</button><button class="btn small" data-a="clr">Clear log</button></div>
        <div class="pg-split"><div class="pg-panel"><span class="eyebrow">Stacks</span>${s.stacks.map((st, i) => `<div class="pg-stack ${i === s.tab ? "on" : ""}"><b>Tab ${i + 1}</b> ${st.map((v, j) => `<span class="${j === st.length - 1 ? "top" : ""}">${v}</span>`).join(" › ")}</div>`).join("")}</div>
        <div class="pg-panel"><span class="eyebrow">Log</span><ol class="pg-log">${s.log.slice(-10).map(l => `<li class="${/cancel|Disappear|discarded/.test(l) ? "neg" : ""}">${pgEsc(l)}</li>`).join("")}</ol></div></div>`;
    };
    el.addEventListener("click", e => {
      const a = e.target.closest("button")?.dataset.a; if (!a) return;
      if (a === "push-d" || a === "push-p") { const v = a === "push-d" ? "VideoDetail" : "Player"; hide(top()); s.stacks[s.tab].push(v); show(v); }
      if (a === "pop") { const v = s.stacks[s.tab].pop(); hide(v); s.log.push(`${v} @State discarded`); show(top()); }
      if (a === "tab") { hide(top()); s.tab = 1 - s.tab; show(top()); }
      if (a === "clr") s.log = [];
      draw();
    });
    draw();
  },
  swift: S`DetailView()
    .onAppear { print("appear") }
    .onDisappear { print("disappear") }
    .task { print("task started"); try? await Task.sleep(for: .seconds(60)); print("task cancelled? \(Task.isCancelled)") }`
};

PG.layout = { t: "Layout: propose, choose, place", d: "Drag the proposed width. <code>HStack</code> offers its space, each text picks its ideal width, and <code>Spacer</code> takes what's left down to its minimum. When there isn't room, the label truncates. This is a simplified model of SwiftUI's priority-based division.",
  mount(el) {

      let lw = label, sw;

      el.innerHTML = `<div class="pg-ctl"><label for="pg-w">Proposed width <b class="num">${s.w} pt</b></label><input type="range" id="pg-w" min="140" max="360" value="${s.w}"></div>

          <tr><td>Text("Masala Chips")</td><td class="num">${label}</td><td class="num">${lw}${lw < label ? " (truncated)" : ""}</td></tr>

          <tr><td>Text("₹20")</td><td class="num">${price}</td><td class="num">${price}</td></tr>
          <tr><td>spacing × 2</td><td class="num">${gap * 2}</td><td class="num">${gap * 2}</td></tr></tbody></table>`;
    };
    el.addEventListener("input", e => { if (e.target.id === "pg-w") { s.w = +e.target.value; draw(); el.querySelector("#pg-w").focus(); } });

PG.prefs = { t: "Preference keys: values flowing up", d: "Each card reports its natural height upward. The key's <code>reduce</code> keeps the maximum, and the parent applies it as every card's minimum height. Change a card's content and the parent re-equalises.",
  mount(el) {
    const s = { h: [120, 164, 140], on: true };
    const draw = () => {
      const max = Math.max(...s.h);
      const steps = s.h.reduce((acc, v, i) => { const prev = i === 0 ? 0 : acc.v; acc.t.push(`max(${prev}, ${v}) = ${Math.max(prev, v)}`); acc.v = Math.max(prev, v); return acc; }, { v: 0, t: [] }).t;
      el.innerHTML = `<div class="pg-ctl">${seg("eq", [["on", "Equalise with HeightKey"], ["off", "No preference"]], s.on ? "on" : "off")}${s.h.map((_, i) => `<button class="btn small" data-grow="${i}">Card ${"ABC"[i]} +24</button>`).join("")}<button class="btn small" data-a="reset">Reset</button></div>
        <div class="pg-panel pg-stage"><div class="pg-cards">${s.h.map((h, i) => `<div class="pg-card" style="height:${(s.on ? max : h) * 0.7}px"><b>Plan ${"ABC"[i]}</b><span class="num">natural ${h}</span></div>`).join("")}</div></div>
        <p class="pg-note">reduce: ${steps.join(" → ")} · parent sets minHeight ${s.on ? max : "—"}</p>`;
    };
    el.addEventListener("click", e => {
      const b = e.target.closest("button"); if (!b) return;
      if (b.dataset.seg === "eq") s.on = b.dataset.v === "on";
      if (b.dataset.grow !== undefined) s.h[+b.dataset.grow] += 24;
      if (b.dataset.a === "reset") s.h = [120, 164, 140];
      draw();
    });
    draw();
  },
  swift: S`.onPreferenceChange(HeightKey.self) { cardHeight = $0 }`
};

PG.threads = { t: "Main thread vs background work", d: "A feed scroll triggers six image decodes (35 ms each) and one JSON parse (120 ms). On the <b>main actor</b> they block rendering and frames drop. With <b>@concurrent</b> they run on the cooperative pool and main only spends 1 ms assigning each result. One second is shown at 60 fps.",
  mount(el) {
    const s = { mode: "main" };
    const draw = () => {
      const jobs = [...Array(6)].map((_, i) => ({ t: "decode", d: 35 })).concat([{ t: "parse", d: 120 }]);
      const lanes = { main: [], p1: [], p2: [], p3: [] };
      if (s.mode === "main") { let t = 100; jobs.forEach(j => { lanes.main.push([t, j.d, j.t]); t += j.d; }); }
      else { const free = [100, 100, 100]; jobs.forEach(j => { const k = free.indexOf(Math.min(...free)); lanes["p" + (k + 1)].push([free[k], j.d, j.t]); free[k] += j.d; lanes.main.push([free[k], 1, "assign"]); }); }
      const busy = t => lanes.main.some(([a, d]) => t >= a && t < a + d);
      const frames = [...Array(60)].map((_, i) => { const t0 = i * 1000 / 60; let blocked = false; for (let t = t0; t < t0 + 16.6; t += 2) if (busy(t) && lanes.main.some(([a, d]) => d > 8 && t >= a && t < a + d)) blocked = true; return blocked; });
      const dropped = frames.filter(Boolean).length;
      const W = 760, x = t => 90 + t * 0.66, rows = [["main", "Main actor"], ["p1", "Pool 1"], ["p2", "Pool 2"], ["p3", "Pool 3"]];
      const svg = `<svg viewBox="0 0 ${W} 200" role="img" aria-label="Timeline: ${dropped} of 60 frames dropped" class="dia"><g font-family="var(--f-mono)" font-size="11">
        ${rows.map(([k, n], r) => `<text x="8" y="${48 + r * 34}" fill="currentColor">${n}</text><line x1="90" y1="${52 + r * 34}" x2="${x(1000)}" y2="${52 + r * 34}" stroke="currentColor" stroke-opacity=".15"/>${lanes[k].map(([a, d, t]) => `<rect x="${x(a)}" y="${36 + r * 34}" width="${Math.max(1.5, d * 0.66)}" height="20" rx="3" style="fill:${t === "parse" ? "var(--ph-arch)" : t === "assign" ? "var(--ok)" : "var(--ph-conc)"}" />`).join("")}`).join("")}
        <text x="8" y="14" fill="currentColor">Frames</text>${frames.map((b, i) => `<rect x="${x(i * 1000 / 60) + 0.5}" y="4" width="${16.6 * 0.66 - 1}" height="14" rx="2" style="fill:${b ? "var(--accent)" : "var(--ok)"};opacity:${b ? 1 : .55}"/>`).join("")}
        ${[0, 250, 500, 750, 1000].map(t => `<text x="${x(t)}" y="194" fill="currentColor" text-anchor="middle" opacity=".7">${t} ms</text>`).join("")}</g></svg>`;
      el.innerHTML = `<div class="pg-ctl">${seg("mode", [["main", "Work on main actor"], ["conc", "@concurrent / actor"]], s.mode)}<span class="pg-stat ${dropped ? "bad" : "good"}">${dropped} of 60 frames dropped${dropped ? ` · ~${Math.round(dropped * 16.7)} ms hang` : ""}</span></div>
        <div class="pg-panel" style="overflow-x:auto">${svg}</div>
        <p class="pg-note"><span class="dot" style="background:var(--ph-conc);display:inline-block"></span> image decode · <span class="dot" style="background:var(--ph-arch);display:inline-block"></span> JSON parse · <span class="dot" style="background:var(--ok);display:inline-block"></span> main-actor assignment / rendered frame · <span class="dot" style="background:var(--accent);display:inline-block"></span> dropped frame</p>`;
    };
    el.addEventListener("click", e => { const b = e.target.closest("button"); if (b && b.dataset.seg === "mode") { s.mode = b.dataset.v; draw(); } });
    draw();
  },
  swift: S`@concurrent nonisolated static func decode(_ data: Data) async throws -> [Post] {
    try JSONDecoder().decode([Post].self, from: data)
}`
};

// SwiftPlay: interprets a subset of SwiftUI in the page for the Playground tab. It is not the Swift compiler.
const SwiftPlay = (() => {
  class PlayError extends Error { constructor(msg, line) { super(msg); this.line = line; } }
  const fail = (msg, line) => { throw new PlayError(msg, line); };
  const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");

  /* ---------------- tokens ---------------- */
  const OPS = ["..<", "...", "?.", "==", "!=", "<=", ">=", "&&", "||", "+=", "-=", "*=", "/=", "->", "??",
    "+", "-", "*", "/", "%", "<", ">", "=", "!", "?", ":", ".", ",", ";", "(", ")", "{", "}", "[", "]", "\\", "&"];

  function readString(src, i, line) {
    const multi = src.startsWith('"""', i);
    let j = i + (multi ? 3 : 1), buf = "";
    const parts = [];
    if (multi && src[j] === "\n") { j++; line++; }
    for (;;) {
      if (j >= src.length) fail("A string isn't closed with a quote.", line);
      const c = src[j];
      if (multi ? src.startsWith('"""', j) : c === '"') { j += multi ? 3 : 1; break; }
      if (c === "\n") { if (!multi) fail("A string isn't closed before the end of the line.", line); line++; buf += c; j++; continue; }
      if (c === "\\") {
        const d = src[j + 1];
        if (d === "(") {
          let depth = 1, k = j + 2, inStr = false;
          while (k < src.length && depth > 0) {
            const e = src[k];
            if (e === "\n") fail("A \\( … ) inside a string isn't closed.", line);
            if (inStr) { if (e === "\\") k++; else if (e === '"') inStr = false; }
            else if (e === '"') inStr = true;
            else if (e === "(") depth++;
            else if (e === ")") depth--;
            k++;
          }
          if (depth) fail("A \\( … ) inside a string isn't closed.", line);
          if (buf) parts.push(buf);
          buf = "";
          parts.push({ toks: tokenize(src.slice(j + 2, k - 1), line) });
          j = k;
          continue;
        }
        const map = { n: "\n", t: "\t", '"': '"', "\\": "\\", "0": "\0", "'": "'" };
        if (d in map) { buf += map[d]; j += 2; continue; }
        fail("Unknown escape \\" + d + " in a string.", line);
      }
      buf += c;
      j++;
    }
    if (multi) buf = buf.replace(/\n[ \t]*$/, "");
    if (buf || !parts.length) parts.push(buf);
    return { parts, end: j, line };
  }

  function tokenize(src, startLine = 1) {
    const toks = [];
    let i = 0, line = startLine, nl = true, sp = true;
    const push = (t, v, extra) => { toks.push(Object.assign({ t, v, line, nl, sp }, extra)); nl = false; sp = false; };
    while (i < src.length) {
      const c = src[i];
      if (c === "\n") { line++; nl = true; sp = true; i++; continue; }
      if (c === " " || c === "\t" || c === "\r") { sp = true; i++; continue; }
      if (src.startsWith("//", i)) { while (i < src.length && src[i] !== "\n") i++; continue; }
      if (src.startsWith("/*", i)) {
        const j = src.indexOf("*/", i + 2), end = j < 0 ? src.length : j + 2;
        for (let k = i; k < end; k++) if (src[k] === "\n") { line++; nl = true; }
        i = end; sp = true;
        continue;
      }
      if (c === '"') { const r = readString(src, i, line); push("str", r.parts); i = r.end; line = r.line; continue; }
      const rest = src.slice(i, i + 64);
      if (c >= "0" && c <= "9") {
        const m = /^[0-9][0-9_]*(\.[0-9][0-9_]*)?([eE][-+]?[0-9]+)?/.exec(rest);
        const raw = m[0].replace(/_/g, "");
        push("num", Number(raw), { dbl: /[.eE]/.test(raw) });
        i += m[0].length;
        continue;
      }
      const m = /^\$[0-9]+|^[@#$]?[A-Za-z_][A-Za-z_0-9]*/.exec(src.slice(i, i + 200));
      if (m) { push(m[0][0] === "@" ? "attr" : "id", m[0]); i += m[0].length; continue; }
      const op = OPS.find(o => src.startsWith(o, i));
      if (op) { push("op", op); i += op.length; continue; }
      fail("Unexpected character “" + c + "”.", line);
    }
    toks.push({ t: "eof", v: "", line, nl: true, sp: true });
    return toks;
  }

  /* ---------------- parser ---------------- */
  const PREC = [["??"], ["||"], ["&&"], ["==", "!=", "<", ">", "<=", ">="], ["..<", "..."], ["+", "-"], ["*", "/", "%"]];
  const MODIFIER_WORDS = ["private", "fileprivate", "public", "internal", "final", "nonisolated", "lazy", "mutating"];

  class Parser {
    constructor(toks) { this.toks = toks; this.p = 0; this.noTrail = false; this.calls = new Set(); }
    get cur() { return this.toks[this.p]; }
    peek(n = 1) { return this.toks[Math.min(this.p + n, this.toks.length - 1)]; }
    isOp(v) { return this.cur.t === "op" && this.cur.v === v; }
    isKw(v) { return this.cur.t === "id" && this.cur.v === v; }
    next() { return this.toks[this.p++]; }
    eat(v) { const k = this.cur; if ((k.t === "op" || k.t === "id") && k.v === v) return this.next(); return null; }
    desc() { const k = this.cur; return k.t === "eof" ? "the end of the code" : k.t === "str" ? "a string" : "“" + k.v + "”"; }
    expect(v, what) { if (!this.eat(v)) fail("Expected " + (what || "“" + v + "”") + " but found " + this.desc() + ".", this.cur.line); }
    expectId(what) { if (this.cur.t === "id") return this.next().v; fail("Expected " + (what || "a name") + " but found " + this.desc() + ".", this.cur.line); }
    skipParens() {
      let depth = 0;
      do { if (this.isOp("(")) depth++; else if (this.isOp(")")) depth--; this.next(); } while (depth > 0 && this.cur.t !== "eof");
    }
    skipType() {
      let depth = 0;
      const first = this.cur.line;
      while (this.cur.t !== "eof") {
        const k = this.cur;
        if (depth === 0 && k.nl && k.line !== first) break;
        if (k.t === "op") {
          if (k.v === "(" || k.v === "[" || k.v === "<") depth++;
          else if (k.v === ")" || k.v === "]" || k.v === ">") { if (depth === 0) break; depth--; }
          else if (depth === 0 && ["=", "{", "}", ",", ";"].includes(k.v)) break;
        }
        if (depth === 0 && k.t === "id" && k.v === "in") break;
        this.next();
      }
    }

    parseProgram() {
      const prog = { structs: new Map(), order: [], preview: null, loose: [] };
      while (this.cur.t !== "eof") {
        const k = this.cur;
        if (this.isKw("import")) { const ln = k.line; this.next(); while (this.cur.t !== "eof" && this.cur.line === ln) this.next(); continue; }
        const attrs = [];
        while (this.cur.t === "attr") { attrs.push(this.next().v); if (this.isOp("(")) this.skipParens(); }
        while (this.cur.t === "id" && MODIFIER_WORDS.includes(this.cur.v)) this.next();
        if (this.isKw("struct")) {
          if (attrs.includes("@main")) fail("@main App structs aren't supported in this preview. Write a View and a #Preview instead.", k.line);
          const s = this.parseStruct();
          if (prog.structs.has(s.name)) fail("`" + s.name + "` is declared twice.", s.line);
          prog.structs.set(s.name, s);
          prog.order.push(s.name);
          continue;
        }
        if (attrs.length) fail(attrs[0] + " isn't supported in this preview.", k.line);
        if (this.isKw("#Preview")) {
          this.next();
          if (this.isOp("(")) this.skipParens();
          const pb = this.parseBlock(false).body;
          if (!prog.preview) prog.preview = pb; else prog.extraPreviews = (prog.extraPreviews || 0) + 1;
          continue;
        }
        if (k.t === "id" && ["class", "enum", "func", "extension", "protocol", "actor", "typealias"].includes(k.v))
          fail("A top-level `" + k.v + "` isn't supported in this preview. Write View structs, a #Preview, or view code.", k.line);
        prog.loose.push(this.parseStmt());
      }
      return prog;
    }

    parseStruct() {
      const line = this.next().line;
      const name = this.expectId("a struct name");
      if (this.isOp("<")) fail("Generic views aren't supported in this preview.", line);
      const conf = [];
      if (this.eat(":")) do { conf.push(this.expectId("a protocol name")); } while (this.eat(","));
      if (conf.includes("App")) fail("App structs aren't supported in this preview. Preview a View instead.", line);
      const isView = conf.includes("View");
      this.expect("{");
      const props = [], comp = new Map(), funcs = new Map();
      let body = null;
      const saved = this.calls;
      this.calls = new Set();
      while (!this.isOp("}")) {
        if (this.cur.t === "eof") fail("`" + name + "` isn't closed with “}”.", line);
        const pl = this.cur.line, pattrs = [];
        while (this.cur.t === "attr") { const a = this.next().v; if (this.isOp("(")) this.skipParens(); pattrs.push(a); }
        while (this.cur.t === "id" && MODIFIER_WORDS.includes(this.cur.v)) this.next();
        if (this.isKw("static")) fail("Static properties aren't supported in this preview.", pl);
        if (this.isKw("init")) fail("Custom initialisers aren't supported in this preview. Use the memberwise init.", pl);
        if (this.isKw("func")) { this.next(); const fname = this.expectId("a function name"); funcs.set(fname, this.parseFunc(fname, pl)); continue; }
        if (this.isKw("enum") || this.isKw("struct") || this.isKw("class")) fail("Nested types aren't supported in this preview.", pl);
        if (!this.isKw("var") && !this.isKw("let")) fail("Expected a property (var or let) but found " + this.desc() + ".", pl);
        const mutable = this.next().v === "var";
        const pname = this.expectId("a property name");
        if (this.eat(":")) this.skipType();
        const wrapper = pattrs.find(a => a !== "@MainActor") || null;
        if (wrapper && !isView) fail(wrapper + " only works inside a View in this preview.", pl);
        if (wrapper && wrapper !== "@State" && wrapper !== "@Binding")
          fail(wrapper + " isn't supported in this preview. Use @State or @Binding.", pl);
        if (this.isOp("{")) {
          const blk = this.parseBlock(false);
          if (pname === "body") body = blk.body; else comp.set(pname, blk.body);
          continue;
        }
        let init = null;
        if (this.eat("=")) init = this.parseExpr();
        props.push({ name: pname, wrapper, mutable, init, line: pl });
        this.endStmt();
      }
      this.next();
      const calls = this.calls;
      this.calls = saved;
      calls.forEach(c => saved.add(c));
      if (isView && !body) fail("`" + name + "` has no `body`.", line);
      if (!isView && body) comp.set("body", body);
      return { name, props, body: isView ? body : null, comp, funcs, line, calls, isView };
    }
    parseFunc(name, line) {
      if (this.isOp("<")) fail("Generic functions aren't supported in this preview.", line);
      this.expect("(");
      const params = [];
      while (!this.isOp(")")) {
        const a = this.expectId("a parameter name");
        const b = this.cur.t === "id" ? this.next().v : null;
        this.expect(":");
        if (this.isKw("inout")) fail("`inout` parameters aren't supported in this preview.", line);
        this.skipType();
        const def = this.eat("=") ? this.parseExpr() : null;
        params.push({ label: a === "_" ? null : a, name: b || a, def });
        if (!this.eat(",")) break;
      }
      this.expect(")");
      for (const kw of ["async", "throws", "rethrows"]) if (this.isKw(kw)) fail("`" + kw + "` functions aren't supported in this preview.", line);
      if (this.eat("->")) this.skipType();
      return { name, params, body: this.parseBlock(false).body, line };
    }

    parseBlock(allowParams) {
      const open = this.cur;
      this.expect("{");
      const params = allowParams ? this.tryClosureParams() : null;
      const body = [];
      while (!this.isOp("}")) {
        if (this.cur.t === "eof") fail("A “{” isn't closed with “}”.", open.line);
        body.push(this.parseStmt());
      }
      this.next();
      return { params, body, line: open.line };
    }

    tryClosureParams() {
      const save = this.p;
      if (this.isOp("[")) {
        while (!this.isOp("]") && this.cur.t !== "eof") this.next();
        this.next();
        if (this.isKw("in")) { this.next(); return []; }
      }
      const ps = [];
      if (this.eat("(")) {
        while (this.cur.t === "id") { ps.push(this.next().v); if (this.eat(":")) this.skipType(); if (!this.eat(",")) break; }
        if (this.eat(")") && this.isKw("in")) { this.next(); return ps; }
        this.p = save;
        return null;
      }
      while (this.cur.t === "id" && this.cur.v !== "in") {
        ps.push(this.next().v);
        if (this.eat(":")) this.skipType();
        if (!this.eat(",")) break;
      }
      if (ps.length && this.isKw("in")) { this.next(); return ps; }
      this.p = save;
      return null;
    }

    endStmt() {
      if (this.eat(";")) return;
      const k = this.cur;
      if (k.t === "eof" || k.nl || (k.t === "op" && k.v === "}")) return;
      fail("Unexpected " + this.desc() + ". Start the next statement on a new line.", k.line);
    }

    parseStmt() {
      const k = this.cur, line = k.line;
      if (this.isKw("if")) return this.parseIf();
      if (this.isKw("let") || this.isKw("var")) {
        const mutable = this.next().v === "var";
        const name = this.expectId("a name");
        if (this.eat(":")) this.skipType();
        this.expect("=", "“=” and a value");
        const value = this.parseExpr();
        this.endStmt();
        return { s: "let", name, value, mutable, line };
      }
      if (this.isKw("return")) {
        this.next();
        let value = null;
        if (!this.cur.nl && !this.isOp("}") && this.cur.t !== "eof") value = this.parseExpr();
        this.endStmt();
        return { s: "return", value, line };
      }
      if (this.isKw("for")) {
        this.next();
        const name = this.expectId("a loop variable");
        this.expect("in");
        const seq = this.parseExpr(true);
        const body = this.parseBlock(false).body;
        return { s: "for", name, seq, body, line };
      }
      for (const kw of ["guard", "switch", "while", "repeat", "do", "defer", "throw", "try", "await"])

      const e = this.parseExpr();
      if (this.cur.t === "op" && ["=", "+=", "-=", "*=", "/="].includes(this.cur.v)) {
        const op = this.next().v;
        const value = this.parseExpr();
        this.endStmt();
        return { s: "assign", target: e, op, value, line };
      }
      this.endStmt();
      return { s: "expr", e, line };
    }

    parseIf() {
      const line = this.next().line;
      let cond;
      if (this.isKw("let") || this.isKw("var")) {
        this.next();
        const name = this.expectId();
        const value = this.eat("=") ? this.parseExpr(true) : { k: "id", name, line };
        cond = { k: "iflet", name, value, line };
      } else cond = this.parseExpr(true);
      if (this.isOp(",")) fail("Conditions separated by commas aren't supported in this preview. Use &&.", line);
      const then = this.parseBlock(false).body;
      let els = null;
      if (this.isKw("else")) { this.next(); els = this.isKw("if") ? [this.parseIf()] : this.parseBlock(false).body; }
      return { s: "if", cond, then, els, line };
    }

    parseExpr(noTrail = false) {
      const saved = this.noTrail;
      this.noTrail = noTrail;
      try { return this.parseTernary(); } finally { this.noTrail = saved; }
    }
    parseTernary() {
      const c = this.parseBin(0);
      if (this.isOp("?") && this.cur.sp) {
        const line = this.next().line;
        const a = this.parseTernary();
        this.expect(":", "“:” in a ? : expression");
        const b = this.parseTernary();
        return { k: "tern", c, a, b, line };
      }
      return c;
    }
    parseBin(level) {
      if (level >= PREC.length) return this.parseUnary();
      let l = this.parseBin(level + 1);
      while (this.cur.t === "op" && PREC[level].includes(this.cur.v)) {
        const k = this.next();
        const r = this.parseBin(level + 1);
        l = { k: "bin", op: k.v, l, r, line: k.line };
      }
      return l;
    }
    parseUnary() {
      const k = this.cur;
      if (k.t === "op" && (k.v === "!" || k.v === "-")) { this.next(); return { k: "un", op: k.v, e: this.parseUnary(), line: k.line }; }
      if (k.t === "op" && k.v === "&") { this.next(); return this.parseUnary(); }
      return this.parsePostfix(this.parsePrimary());
    }
    parsePostfix(e) {
      for (;;) {
        const k = this.cur;
        if (k.t === "op" && (k.v === "." || k.v === "?.")) {
          this.next();
          if (this.cur.t === "num") fail("Tuples aren't supported in this preview.", k.line);
          const name = this.expectId("a name after “.”");
          e = { k: "mem", obj: e, name, opt: k.v === "?.", line: k.line };
          continue;
        }
        if (k.t === "op" && k.v === "(" && !k.nl) {
          const args = this.parseArgs();
          if (e.k === "id") this.calls.add(e.name);
          e = { k: "call", fn: e, args, closures: [], line: k.line };
          continue;
        }
        if (k.t === "op" && k.v === "[" && !k.nl) {
          this.next();
          const idx = this.parseExpr();
          if (this.isOp(",")) fail("Dictionary lookups like [key, default: 0] aren't supported in this preview.", k.line);
          this.expect("]");
          e = { k: "idx", obj: e, idx, line: k.line };
          continue;
        }
        if (k.t === "op" && k.v === "{" && !k.nl && !this.noTrail) {
          const closures = [{ label: null, fn: this.parseClosure() }];
          while (this.cur.t === "id" && this.peek().t === "op" && this.peek().v === ":" && this.peek(2).t === "op" && this.peek(2).v === "{") {
            const label = this.next().v;
            this.next();
            closures.push({ label, fn: this.parseClosure() });
          }
          if (e.k === "call" && !e.closures.length) e.closures = closures;
          else { if (e.k === "id") this.calls.add(e.name); e = { k: "call", fn: e, args: [], closures, line: k.line }; }
          continue;
        }
        if (k.t === "op" && (k.v === "!" || k.v === "?") && !k.sp) { this.next(); continue; }
        return e;
      }
    }
    parseArgs() {
      this.expect("(");
      const args = [];
      while (!this.isOp(")")) {
        let label = null;
        if (this.cur.t === "id" && this.peek().t === "op" && this.peek().v === ":") { label = this.next().v; this.next(); }
        const k = this.cur;
        if (k.t === "op" && ["<", ">", "+", "-", "*"].includes(k.v) && this.peek().t === "op" && (this.peek().v === ")" || this.peek().v === ",")) {
          this.next();
          args.push({ label, e: { k: "opref", op: k.v, line: k.line } });
        } else args.push({ label, e: this.parseExpr() });
        if (!this.eat(",")) break;
      }
      this.expect(")", "“)” to close the call");
      return args;
    }
    parseClosure() { const b = this.parseBlock(true); return { k: "closure", params: b.params, body: b.body, line: b.line }; }
    parsePrimary() {
      const k = this.cur;
      if (k.t === "num") { this.next(); return { k: "num", v: k.v, dbl: k.dbl, line: k.line }; }
      if (k.t === "str") { this.next(); return { k: "str", parts: k.v.map(p => typeof p === "string" ? p : this.interp(p.toks)), line: k.line }; }
      if (k.t === "id") {
        if (k.v === "true" || k.v === "false") { this.next(); return { k: "lit", v: k.v === "true", line: k.line }; }
        if (k.v === "nil") { this.next(); return { k: "lit", v: null, line: k.line }; }
        if (["try", "await", "switch", "guard", "Task"].includes(k.v)) fail("`" + k.v + "` isn't supported in this preview.", k.line);
        if (k.v === "#Preview") fail("#Preview can only appear at the top level.", k.line);
        this.next();
        if (/^\$[A-Za-z_]/.test(k.v)) return { k: "dollar", name: k.v.slice(1), line: k.line };
        return { k: "id", name: k.v, line: k.line };
      }
      if (k.t === "op") {
        if (k.v === ".") { this.next(); return { k: "imp", name: this.expectId("a name after “.”"), line: k.line }; }
        if (k.v === "\\") {
          this.next();
          const path = [];
          while (this.eat(".")) path.push(this.expectId());
          if (!path.length) fail("Only key paths like \\.self are supported in this preview.", k.line);
          return { k: "kp", path, line: k.line };
        }
        if (k.v === "(") {
          this.next();
          if (this.eat(")")) return { k: "lit", v: undefined, line: k.line };
          const e = this.parseExpr();
          if (this.isOp(",")) fail("Tuples aren't supported in this preview.", k.line);
          this.expect(")");
          return e;
        }
        if (k.v === "[") {
          this.next();
          if (this.isOp(":")) fail("Dictionaries aren't supported in this preview. Use an array.", k.line);
          const items = [];
          while (!this.isOp("]")) {
            items.push(this.parseExpr());
            if (this.isOp(":")) fail("Dictionaries aren't supported in this preview. Use an array.", k.line);
            if (!this.eat(",")) break;
          }
          this.expect("]");
          return { k: "arr", items, line: k.line };
        }
        if (k.v === "{") return this.parseClosure();
      }
      if (k.t === "attr") fail(k.v + " isn't supported here.", k.line);
      fail("Unexpected " + this.desc() + ".", k.line);
    }
    interp(toks) {
      const p = new Parser(toks), args = [];
      while (p.cur.t !== "eof") {
        let label = null;
        if (p.cur.t === "id" && p.peek().t === "op" && p.peek().v === ":") { label = p.next().v; p.next(); }
        args.push({ label, e: p.parseExpr() });
        if (!p.eat(",")) break;
      }
      if (p.cur.t !== "eof") fail("Couldn't read this \\( … ).", p.cur.line);
      p.calls.forEach(c => this.calls.add(c));
      return { interp: args };
    }
  }

  /* ---------------- values ---------------- */
  class Dbl { constructor(v) { this.v = v; } }
  class Range { constructor(lo, hi, closed) { this.lo = lo; this.hi = hi; this.closed = closed; }
    get end() { return this.closed ? this.hi : this.hi - 1; }
    list(line) { const out = []; if (this.end - this.lo > 5000) fail("This range is too big for the preview.", line); for (let i = this.lo; i <= this.end; i++) out.push(i); return out; } }
  class Imp { constructor(name, args, line) { this.name = name; this.args = args || null; this.chain = []; this.line = line; }
    with(name, args) { const c = new Imp(this.name, this.args, this.line); c.chain = this.chain.concat([{ name, args }]); return c; } }
  class ColorV { constructor(css) { this.css = css; this.chain = []; } }
  class Binding { constructor(get, set) { this.get = get; this.set = set; } }
  class NS { constructor(name) { this.name = name; } }
  class Bound { constructor(recv, name, line, obj) { this.recv = recv; this.name = name; this.line = line; this.obj = obj; } }
  class ViewV {
    constructor(kind, line) { this.kind = kind; this.line = line; this.a = {}; this.kids = []; this.mods = []; }
    mod(name, args, line) { const c = Object.assign(Object.create(ViewV.prototype), this); c.mods = this.mods.concat([{ name, args, line }]); return c; }
  }
  class Method {
    constructor(node, env, run) { this.node = node; this.env = env; this.run = run; }
    invoke(A, line) {
      const env = new Env(this.env), ps = this.node.params;
      let pi = 0;
      const pos = A.pos.concat(A.closures.map(c => c.fn));
      for (const p of ps) {
        let v;
        if (p.label === null) v = pos[pi++];
        else if (p.label in A.named) v = A.named[p.label];
        if (v === undefined && p.def) v = this.run.eval(p.def, env);
        if (v === undefined) fail("`" + this.node.name + "(…)` is missing " + (p.label ? "`" + p.label + ":`" : "an argument") + ".", line);
        env.def(p.name, cell(v));
      }
      for (const n of Object.keys(A.named)) if (!ps.some(p => p.label === n)) fail("`" + this.node.name + "` has no parameter `" + n + ":`.", line);
      const b = this.node.body;
      if (this.run.mode === "action" && !(b.length === 1 && b[0].s === "expr")) { const r = this.run.execBlock(b, env); return r ? r.v : undefined; }
      return this.run.computed(this.node.body, env);
    }
  }
  class Fn {
    constructor(node, env, run) { this.node = node; this.env = env; this.run = run; }
    call(args) {
      const env = new Env(this.env);
      bindParams(env, this.node.params, args);
      const body = this.node.body;
      if (body.length === 1 && body[0].s === "expr") return this.run.eval(body[0].e, env);
      const r = this.run.execBlock(body, env);
      return r ? r.v : undefined;
    }
  }
  function bindParams(env, params, args) {
    if (params) params.forEach((p, i) => { if (p !== "_") env.def(p, cell(args[i])); });
    else args.forEach((v, i) => env.def("$" + i, cell(v)));
  }
  class Env {
    constructor(parent) { this.parent = parent; this.vars = new Map(); }
    def(name, c) { this.vars.set(name, c); }
    find(name) { for (let e = this; e; e = e.parent) if (e.vars.has(name)) return e.vars.get(name); return null; }
  }
  const cell = (v, mutable) => { let x = v; return { kind: "local", get: () => x, set: mutable ? y => { x = y; } : null }; };
  const isNum = x => typeof x === "number" || x instanceof Dbl;
  const nv = x => x instanceof Dbl ? x.v : x;
  class Rec { constructor(def, f) { this.def = def; this.f = f; } }
  const copy = v => Array.isArray(v) ? v.map(copy) : v instanceof Rec ? new Rec(v.def, Object.fromEntries(Object.entries(v.f).map(([k, x]) => [k, copy(x)]))) : v;
  const isGroup = v => v instanceof ViewV && v.kind === "group";
  function typeName(v) {
    if (v === null || v === undefined) return "nil";
    if (typeof v === "string") return "a String";
    if (typeof v === "boolean") return "a Bool";
    if (v instanceof Dbl) return "a Double";
    if (typeof v === "number") return "an Int";
    if (Array.isArray(v)) return "an array";
    if (v instanceof Range) return "a range";
    if (v instanceof ViewV) return "a view";
    if (v instanceof Binding) return "a Binding";
    return "this value";
  }
  function show(v) {
    if (v instanceof Rec) return v.def.name + "(" + Object.entries(v.f).map(([k, x]) => k + ": " + (typeof x === "string" ? JSON.stringify(x) : show(x))).join(", ") + ")";
    if (v instanceof Dbl) return Number.isInteger(v.v) ? v.v.toFixed(1) : String(v.v);
    if (v === null || v === undefined) return "nil";
    if (Array.isArray(v)) return "[" + v.map(x => typeof x === "string" ? JSON.stringify(x) : show(x)).join(", ") + "]";
    if (v instanceof Range) return v.lo + (v.closed ? "..." : "..<") + v.hi;
    if (v instanceof Binding) return "Binding(" + show(v.get()) + ")";
    if (v instanceof ViewV) return v.kind;
    if (v instanceof Imp) return "." + v.name;
    return String(v);
  }
  function eq(a, b) {
    if (a instanceof Rec && b instanceof Rec) return a.def === b.def && Object.keys(a.f).every(k => eq(a.f[k], b.f[k]));
    if (isNum(a) && isNum(b)) return nv(a) === nv(b);
    if (Array.isArray(a) && Array.isArray(b)) return a.length === b.length && a.every((x, i) => eq(x, b[i]));
    return a === b;

        ${LDIA[l.id] ? fig(LDIA[l.id], LDIA[l.id].cap) : ""}
        ${(l.ver || VER[l.id]) ? `<p class="pg-ok" style="max-width:68ch">✓ ${l.ver || VER[l.id]}</p>` : ""}
        ${l.code ? `<div class="code"><div class="code-top"><span>${esc(l.file || l.t.split(":")[0] + ".swift")}</span><span class="code-acts">${playBtn(l.code, l.id)}<button class="btn small" data-copy="${l.id}">Copy</button></span></div><pre><code style="background:none;padding:0">${hl(l.code)}</code></pre></div>` : ""}
        <div class="callouts">
          ${l.pit && l.pit.length ? `<div class="callout"><span class="eyebrow">Pitfalls</span><ul>${l.pit.map(p => `<li>${p}</li>`).join("")}</ul></div>` : ""}
          ${l.cap ? `<div class="callout cap" style="grid-column:1/-1;border-color:color-mix(in srgb, var(--ok) 55%, var(--line))"><span class="eyebrow">Capstone review · BBI_SWIFTUI_APP</span><p style="font-size:var(--t-sm);color:var(--muted)">${l.capNote || ""}</p><ul>${l.cap.map(c => `<li>${c}</li>`).join("")}</ul>${l.capCode ? codeBox(l.capCode, l.id + "-cap", "MachineSocket.swift") : ""}</div>` : ""}
          <div class="callout ask"><span class="eyebrow">Interview angle</span><p>${l.ask}</p><a href="#/interview?m=${m.id}">Practise ${Q.filter(q => q[0] === m.id).length} questions for this module →</a></div>
        </div>`;
    } else {
      body = `<div class="note"><b>Planned lesson.</b> The full explanation and example aren't written yet. Study it from the outline and the official references below.</div>
        <div class="prose"><ol class="outline">${l.out.map(o => `<li>${o}</li>`).join("")}</ol></div>`;
    }
    return `<div class="page"><article style="display:flex;flex-direction:column;gap:var(--s-5)">
      <nav class="crumbs" aria-label="Breadcrumb"><a href="#/curriculum">Curriculum</a><span>/</span><a href="#/curriculum/${m.id}">Module ${m.id.slice(1)} · ${esc(m.t)}</a></nav>
      <header class="lesson-head" style="--pc:${phColor(m.ph)}">
        <span class="eyebrow" style="color:var(--pc)">Lesson ${m.id.slice(1)}.${n} · ${esc(ph(m.ph).name)}</span>
        <h1>${esc(l.t)}</h1>
        <div class="meta">${badge(l)}<span class="num">${l.min} min</span><span>·</span><span>Week ${m.wk}</span>
          <button class="btn small" aria-pressed="${done}" data-lesson-btn="${l.id}">${done ? "✓ Completed" : "Mark complete"}</button></div>
      </header>
      ${body}
      <section><span class="eyebrow">Official &amp; verified references</span><div class="refs">${refRows(l.refs)}</div></section>
      <nav class="pager" aria-label="Lesson navigation">
        ${prev ? `<a href="${lessonHref(prev)}"><small>← Previous</small>${esc(prev.t)}</a>` : "<span></span>"}
        ${next ? `<a href="${lessonHref(next)}"><small>Next →</small>${esc(next.t)}</a>` : ""}
      </nav>
    </article></div>`;
  }

        </div>
      </header>
      <div class="weeks">${W.map(w => `<div class="wk ${w[0] === cw ? "now" : ""}" style="--pc:${phColor(w[1])}">

  function projects() {
    return `<div class="page">
      <header class="hero">
        <span class="eyebrow">Projects</span>
        <h1 style="font-size:var(--t-2xl)">Six builds, each harder than the last</h1>
        <p class="lede">Projects 1–5 come with starter code: a ready Xcode project with fake data, the structure in place, and failing tests that mark each milestone. A completed version of each, with every milestone done, is in <code>_solutions/</code> to compare against once you've tried. Project 6 is your real repository.</p>
        <div class="code"><div class="code-top"><span>Terminal</span><button class="btn small" data-copy="starters-open">Copy</button></div><pre><code style="background:none;padding:0">${esc(SNIP["starters-open"] = "open ~/Documents/SwiftUI-Academy-Starters")}</code></pre></div>

      <div class="projects">${P.map((p, i) => {

          <p>${esc(p.brief)}</p>

          ${DONE[p.id] ? `<p class="${DONE[p.id].verified ? "pg-ok" : "pg-note"}" style="font-size:var(--t-sm)">Completed version, every milestone done: <code>${esc(DONE[p.id].dir)}</code>. ${esc(DONE[p.id].status)}</p>` : ""}
          <div class="ms"><span class="eyebrow">Milestones</span>${p.ms.map((m, j) => { const id = `${p.id}-${j}`; return `<label for="ms-${id}"><input type="checkbox" id="ms-${id}" data-ms="${id}" ${state.ms[id] ? "checked" : ""}>${esc(m)}</label>`; }).join("")}</div>
        </article>`;

  function starterBlock(id) {
    const st = ST[id];
    return `<details class="starter"><summary><span class="eyebrow">Starter code</span> <code>${esc(st.dir)}</code></summary>
      <div class="starter-b">
        <p style="font-size:var(--t-sm)">Open <code>${esc(st.proj)}</code>, run with ⌘R, test with ⌘U. ${st.tests} tests: ${st.failing} fail until you finish the milestones (checked on the iOS 26 simulator). Reference solutions are in <code>_solutions/</code>.</p>
        <pre class="pg-mono">${esc(st.tree)}</pre>
        <div class="tbl-wrap"><table class="tmap"><thead><tr><th>Milestone</th><th>Where to work</th><th>Tests that turn green</th></tr></thead><tbody>${st.ms.map(r => `<tr><td>${esc(r[0])}</td><td>${r[1]}</td><td>${esc(r[2])}</td></tr>`).join("")}</tbody></table></div>

  const qf = { m: "all", lvl: "all", st: "all", s: "", drill: null };
  try { Object.assign(qf, JSON.parse(sessionStorage.getItem("swiftAcademy.qf") || "{}"), { drill: null }); } catch (e) {}
  function filteredQ() {
    const s = qf.s.trim().toLowerCase();
    let list = Q.filter(q => (qf.m === "all" || q[0] === qf.m) && (qf.lvl === "all" || q[1] === qf.lvl)
      && (qf.st === "all" || (qf.st === "new" ? !state.q[q.id] : state.q[q.id] === qf.st))
      && (!s || (q[2] + " " + q[3]).toLowerCase().includes(s)));
    if (qf.drill) list = qf.drill.map(id => Q.find(q => q.id === id)).filter(Boolean);
    return list;
  }


  function diagrams() {
    const lessonFigs = Object.entries(LDIA).map(([id, d]) => {
      const l = ALL.find(x => x.id === id);
      return l ? `<section class="dia-item"><h3 style="font-size:var(--t-lg)"><a href="${lessonHref(l)}">${esc(l.t)}</a> <small class="eyebrow">Module ${l.m.id.slice(1)} · ${esc(d.kind)}</small></h3>${fig(d, d.cap)}</section>` : "";
    }).join("");
    const roadFigs = ROAD.flatMap(r => [[r, r.dia, r.cap], ...(r.dia2 ? [[r, r.dia2, r.cap2]] : [])]).map(([r, k, cap]) =>
      `<section class="dia-item"><h3 style="font-size:var(--t-lg)"><a href="#/roadmap/${r.n}">Phase ${r.n} · ${esc(r.t)}</a></h3>${fig(DIA[k], cap)}</section>`).join("");
    const caseFigs = CASES.map(c => `<section class="dia-item"><h3 style="font-size:var(--t-lg)"><a href="#/case/${c.id}">${esc(c.t)}</a> <small class="eyebrow">thread map</small></h3>${fig(c.dia, "Lanes show where work runs; the highlighted arrow is the hop that most often goes wrong.")}</section>`).join("");
    const total = Object.keys(LDIA).length + ROAD.reduce((n, r) => n + (r.dia2 ? 2 : 1), 0) + CASES.length;
    return `<div class="page">
      <header class="hero"><span class="eyebrow">Diagrams</span><h1 style="font-size:var(--t-2xl)">${total} flowcharts, state machines and architecture maps</h1>
        <p class="lede">Every diagram in the handbook on one page. Diamonds are decisions, highlighted boxes and arrows mark the part that matters most, and each title links to the lesson or page it explains.</p>
        <nav class="qa-jump" aria-label="Jump to section"><a href="#dg-flow" data-jump="dg-flow">Flowcharts &amp; state machines <small>${Object.keys(LDIA).length}</small></a><a href="#dg-road" data-jump="dg-road">Roadmap <small>${total - Object.keys(LDIA).length - CASES.length}</small></a><a href="#dg-case" data-jump="dg-case">Thread maps <small>${CASES.length}</small></a></nav></header>
      <section class="qa-mod" id="dg-flow"><h2 style="font-size:var(--t-xl)">Flowcharts and state machines</h2>${lessonFigs}</section>
      <section class="qa-mod" id="dg-road"><h2 style="font-size:var(--t-xl)">Roadmap diagrams</h2>${roadFigs}</section>
      <section class="qa-mod" id="dg-case"><h2 style="font-size:var(--t-xl)">Case-study thread maps</h2>${caseFigs}</section>
    </div>`;
  }

  function allQA() {
    const lv = { J: "Junior", M: "Mid", S: "Senior" };
    const groups = M.map(m => ({ m, qs: Q.filter(q => q[0] === m.id) })).filter(g => g.qs.length);
    return `<div class="page">
      <header class="hero">
        <span class="eyebrow">All questions and answers</span>
        <h1 style="font-size:var(--t-2xl)">${Q.length} interview questions, answers shown</h1>
        <p class="lede">The whole bank on one page, grouped by module, for reading straight through or revising before an interview. To drill and track what you know, use the <a href="#/interview">Interview bank</a>.</p>
        <div class="filters" role="search">
          <input type="search" id="qa-search" placeholder="Filter questions and answers" aria-label="Filter questions and answers">
          <span class="qcount" id="qa-count">${Q.length} shown</span>
        </div>
        <nav class="qa-jump" aria-label="Jump to module">${groups.map(g => `<a href="#qa-${g.m.id}" data-jump="qa-${g.m.id}">M${g.m.id.slice(1)} <small>${g.qs.length}</small></a>`).join("")}</nav>
      </header>
      ${groups.map(g => `<section class="qa-mod" id="qa-${g.m.id}">
        <h2 style="font-size:var(--t-xl)"><span style="color:var(--ph-${g.m.ph})">${g.m.id.slice(1)}</span> ${esc(g.m.t)}</h2>
        <ol class="qa-list">${g.qs.map(q => `<li class="qa" data-text="${esc((q[2] + " " + q[3]).replace(/<[^>]+>/g, "").toLowerCase())}">
          <div class="qa-q"><b>${q[2].includes("<") ? q[2] : esc(q[2])}</b><span class="badge lvl">${lv[q[1]]}</span></div>
          <p class="qa-a">${q[3]}</p></li>`).join("")}</ol>
      </section>`).join("")}
    </div>`;
  }

  function interview() {
    return `<div class="page">
      <header class="hero">
        <span class="eyebrow">Interview bank</span>
        <h1 style="font-size:var(--t-2xl)">${Q.length} questions, every one answered</h1>
        <p class="lede">Say your answer out loud first, then open the card to compare. Mark it <b>Got it</b> or <b>Review</b>. A drill picks 10 questions you haven't mastered.</p>
      </header>
      <div class="filters" role="search">
        <input type="search" id="q-search" placeholder="Search questions and answers" value="${esc(qf.s)}" aria-label="Search questions">
        <select id="q-mod" aria-label="Module"><option value="all">All modules</option>${M.map(m => `<option value="${m.id}" ${qf.m === m.id ? "selected" : ""}>M${m.id.slice(1)} · ${esc(m.t)}</option>`).join("")}</select>
        <span class="seg" role="group" aria-label="Level">${["all", "J", "M", "S"].map(v => `<button data-lvl="${v}" aria-pressed="${qf.lvl === v}">${v === "all" ? "All levels" : lvlName[v]}</button>`).join("")}</span>
        <span class="seg" role="group" aria-label="Status">${[["all", "Any"], ["new", "Unseen"], ["review", "Review"], ["got", "Got it"]].map(([v, t]) => `<button data-st="${v}" aria-pressed="${qf.st === v}">${t}</button>`).join("")}</span>
        <button class="btn small primary" data-drill>${qf.drill ? "End drill" : "Drill 10"}</button>
      </div>
      <div id="q-list">${qList()}</div>
    </div>`;
  }
  function qList() {
    const list = filteredQ();
    return `<p class="qcount">${qf.drill ? "Drill · " : ""}${list.length} shown · ${qGot()} mastered · ${Q.filter(q => state.q[q.id] === "review").length} to review</p>
      <div class="qs">${list.map(q => { const st = state.q[q.id]; return `<details class="q">
        <summary><span class="qm">M${q[0].slice(1)} · ${q.id.slice(1)}</span><span class="qt">${esc(q[2])}</span><span class="qs-st">${st === "got" ? `<span class="badge done">Got it</span>` : st === "review" ? `<span class="badge planned">Review</span>` : ""}<span class="badge lvl">${lvlName[q[1]]}</span></span></summary>
        <div class="q-body"><p>${q[3]}</p>
          <div class="q-act"><button class="btn small" data-q="${q.id}" data-v="got" aria-pressed="${st === "got"}">Got it</button><button class="btn small" data-q="${q.id}" data-v="review" aria-pressed="${st === "review"}">Review again</button><a class="btn small" href="#/curriculum/${q[0]}">Module ${q[0].slice(1)} lessons</a></div>
        </div></details>`; }).join("") || `<p style="padding:var(--s-4) 0;color:var(--muted)">No questions match these filters. Clear the search or pick “Any” status.</p>`}</div>`;
  }

  function resources() {
    const used = id => M.filter(m => m.L.some(l => l.refs.includes(id))).map(m => "M" + m.id.slice(1));
    const groups = ["Apple docs", "Swift.org", "WWDC", "YouTube channel", "Course & community"];
    return `<div class="page">
      <header class="hero">
        <span class="eyebrow">Resources</span>
        <h1 style="font-size:var(--t-2xl)">${Object.keys(R).length} checked links</h1>

      </header>
      ${groups.map(g => {
        const items = Object.entries(R).filter(([, r]) => r.type === g).sort((a, b) => (b[1].yr || "").localeCompare(a[1].yr || ""));
        return `<section class="res-group"><h2 style="font-size:var(--t-lg)">${g === "WWDC" ? "WWDC sessions" : g === "YouTube channel" ? "YouTube channels" : g}</h2>
          <div class="res-list">${items.map(([id, r]) => `<div class="res"><a href="${r.url}" target="_blank" rel="noopener">${esc(r.t)}</a><span>${r.yr ? r.yr + " · " : ""}${used(id).slice(0, 4).join(" ") || "general"}</span></div>`).join("")}</div></section>`;
      }).join("")}
    </div>`;
  }

  function dataPanel() {
    return `<section class="data" aria-label="Your progress data">
      <div class="sec-head"><h2 style="font-size:var(--t-lg)">Your progress</h2><span class="qcount">Saved in this browser only</span></div>
      <p style="font-size:var(--t-sm);color:var(--muted)">Progress lives in this browser's local storage. To move it to another device, copy the export code and paste it there.</p>
      <div class="row"><button class="btn small" data-export>Show export code</button><button class="btn small" data-import>Import pasted code</button><button class="btn small" data-reset>Reset progress</button><span class="toast" id="data-toast" role="status"></span></div>
      <textarea id="data-box" aria-label="Progress export code" placeholder="Paste an export code here, then press Import"></textarea>
    </section>`;
  }


  // ---------- roadmap, playgrounds, case studies ----------
  const SNIP = {};
  const ROAD_IDS = ROAD.flatMap(p => [...p.ui.map((_, i) => `r${p.n}-ui-${i}`), ...p.logic.map((_, i) => `r${p.n}-logic-${i}`)]);
  const roadDone = () => ROAD_IDS.filter(id => state.road[id]).length;
  const playBtn = (code, id) => code && SwiftPlay.canRun(code) ? `<button class="btn small" data-play="${id}" title="Run this code in the in-page SwiftUI preview">Open in playground</button>` : "";
  function codeBox(code, id, name) {
    SNIP[id] = code;
    return `<div class="code"><div class="code-top"><span>${esc(name || "Example.swift")}</span><span class="code-acts">${playBtn(code, id)}<button class="btn small" data-copy="${id}">Copy</button></span></div><pre><code style="background:none;padding:0">${hl(code)}</code></pre></div>`;
  }
  let diaN = 0;
  function dia(spec) {
    const id = "dm" + (++diaN);
    const lanes = (spec.lanes || []).map(l => `<rect x="2" y="${l.y}" width="${spec.w - 4}" height="${l.h}" rx="8" style="fill:var(--surface-2)" opacity="0.6"/><text x="12" y="${l.y + 16}" font-size="10" font-weight="600" letter-spacing="0.8" style="fill:var(--muted)">${esc(l.label.toUpperCase())}</text>`).join("");
    const nodes = spec.nodes.map(n => `${n.shape === "d" ? `<polygon points="${n.x + n.w / 2},${n.y} ${n.x + n.w},${n.y + n.h / 2} ${n.x + n.w / 2},${n.y + n.h} ${n.x},${n.y + n.h / 2}"` : `<rect x="${n.x}" y="${n.y}" width="${n.w}" height="${n.h}" rx="8"`} style="fill:var(--surface);stroke:${n.hot ? "var(--accent)" : "currentColor"}" stroke-opacity="${n.hot ? 1 : 0.45}" stroke-width="${n.hot ? 1.75 : 1}"/><text x="${n.x + n.w / 2}" y="${n.y + n.h / 2 + (n.s ? -3 : 4)}" text-anchor="middle" font-size="12.5" font-weight="600" fill="currentColor">${esc(n.t)}</text>${n.s ? `<text x="${n.x + n.w / 2}" y="${n.y + n.h / 2 + 13}" text-anchor="middle" font-size="10.5" style="fill:var(--muted)">${esc(n.s)}</text>` : ""}`).join("");
    let labels = "";
    const edges = spec.edges.map(e => {
      const d = e.pts.map((p, i) => (i ? "L" : "M") + p[0] + "," + p[1]).join(" ");
      if (e.label) {
        let best = 0, bl = -1;
        for (let i = 0; i < e.pts.length - 1; i++) { const l = Math.hypot(e.pts[i + 1][0] - e.pts[i][0], e.pts[i + 1][1] - e.pts[i][1]); if (l > bl) { bl = l; best = i; } }
        const f = e.at ?? 0.5, [x1, y1] = e.pts[best], [x2, y2] = e.pts[best + 1];
        const cx = x1 + (x2 - x1) * f, cy = y1 + (y2 - y1) * f, w = e.label.length * 6 + 12;
        labels += `<rect x="${cx - w / 2}" y="${cy - 9}" width="${w}" height="18" rx="4" style="fill:var(--surface)"/><text x="${cx}" y="${cy + 4}" text-anchor="middle" font-size="10.5" font-family="var(--f-mono)" style="fill:${e.hot ? "var(--accent)" : "var(--muted)"}">${esc(e.label)}</text>`;
      }
      return `<path d="${d}" fill="none" style="stroke:${e.hot ? "var(--accent)" : "currentColor"}" stroke-opacity="${e.hot ? 1 : 0.6}" stroke-width="${e.hot ? 1.75 : 1.25}" ${e.dash ? 'stroke-dasharray="5 4"' : ""} marker-end="url(#${id}${e.hot ? "h" : "n"})"/>`;
    }).join("");
    const mk = (suf, fill) => `<marker id="${id}${suf}" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:${fill}"/></marker>`;
    return `<svg class="dia" viewBox="0 0 ${spec.w} ${spec.h}" role="img" aria-label="${esc(spec.label)}" font-family="var(--f-body)"><defs>${mk("n", "currentColor")}${mk("h", "var(--accent)")}</defs>${lanes}${edges}${nodes}${labels}</svg>`;
  }
  const fig = (spec, cap) => `<figure class="fig">${dia(spec)}<figcaption>${cap}</figcaption></figure>`;
  const pgBox = (id, auto) => PG[id] ? `<div class="pg" data-pg="${id}" ${auto ? "data-auto" : ""}><div class="pg-head"><b>Playground · ${esc(PG[id].t)}</b><span class="badge sim">Browser simulation</span></div><p class="pg-d">${PG[id].d}</p><div class="pg-body"></div><details class="pg-swift"><summary>Try the same thing in an Xcode preview</summary>${codeBox(PG[id].swift, "pg-" + id, "Preview.swift")}</details></div>` : "";
  function mountPG(box) {
    if (!box || box.dataset.mounted) return;
    const p = PG[box.dataset.pg]; if (!p) return;
    box.dataset.mounted = "1"; p.mount(box.querySelector(".pg-body"));
  }

  function roadmap(n) {
    n = Math.min(4, Math.max(1, +n || 1));
    const p = ROAD[n - 1];

  // ---------- code playground (SwiftPlay) ----------

  function swiftplay() {
    const groups = [...new Set(SPP.map(p => p.g || "Starter examples"))];
    const opts = groups.map(g => `<optgroup label="${esc(g)}">${SPP.filter(p => (p.g || "Starter examples") === g).map(p => `<option value="${p.id}">${esc(p.t)}</option>`).join("")}</optgroup>`).join("");

        <p class="pg-note">This is an interpreter for a subset of SwiftUI that runs in this page. It is not the Swift compiler. Code that runs here can still fail to compile in Xcode (it doesn't check types strictly), and real SwiftUI code often uses things this preview doesn't support. When that happens it says so instead of guessing.</p></header>
      <div class="sp-wrap">
        <section class="sp-main" aria-label="Editor" style="display:flex;flex-direction:column;gap:var(--s-3);min-width:0">

            <button class="btn small" data-copy="sp-code">Copy</button>

          </div>
          <div class="sp-ed"><pre class="sp-gut" id="sp-gut" aria-hidden="true">1</pre><textarea id="sp-code" class="sp-ta" spellcheck="false" autocapitalize="off" autocomplete="off" aria-label="SwiftUI code"></textarea></div>
          <div class="sp-msgs" id="sp-msgs" aria-live="polite"></div>
          <details class="sp-help"><summary>What this preview supports</summary><div class="read" style="font-size:var(--t-sm)">
            <p><b>Views:</b> Text, Image(systemName:), Label, Button, VStack / HStack / ZStack (and Lazy stacks), Spacer, Divider, Group, GroupBox, ScrollView, NavigationStack with navigationTitle, List, Form, Section, ForEach, LazyVGrid, Grid, Toggle, TextField, SecureField, Stepper, Slider, ProgressView, Circle / Rectangle / RoundedRectangle / Capsule, ContentUnavailableView, LabeledContent.</p>
            <p><b>Modifiers:</b> padding, frame, background, overlay, foregroundStyle, font, bold, italic, opacity, cornerRadius, clipShape, shadow, offset, scaleEffect, rotationEffect, buttonStyle, disabled, tint, onTapGesture, onAppear, onDisappear and a few more. Others (animation, sheet, toolbar…) are listed as ignored.</p>
            <p><b>Swift:</b> View structs with <code>@State</code>, <code>@Binding</code>, plain and computed properties and helper <code>func</code>s; plain data structs with a memberwise init; <code>let</code> / <code>var</code>, <code>if</code> / <code>else</code>, <code>if let</code>, <code>for</code> in actions, closures, string interpolation, arrays and ranges with common methods (append, remove, map, filter, sorted, reduce…), Int / Double / String / Bool, <code>.formatted(.currency(code:))</code>, <code>print</code>.</p>
            <p><b>Not supported:</b> classes and <code>@Observable</code>, enums, protocols, extensions, generics, async / await, <code>@Environment</code>, NavigationLink, sheets, TabView, Picker, animations, networking and images from files or the web. SF Symbols are drawn with close Unicode stand-ins.</p>

  function mountSP() {
    const ta = document.getElementById("sp-code"), sel = document.getElementById("sp-preset"), screen = document.getElementById("sp-screen"), msgs = document.getElementById("sp-msgs"), gut = document.getElementById("sp-gut"), rootNote = document.getElementById("sp-root");
    if (!ta) return;
    let sess = null, timer = null, errLine = 0;
    const linked = SPP.find(p => p.id === parse().a);

    const saved = spLoad();
    let preset = spSeed ? (spSeed.preset || "") : (saved && saved.preset !== undefined ? saved.preset : SPP[0].id);
    ta.value = spSeed ? spSeed.code : saved && saved.code ? saved.code : SPP[0].code;
    if (spSeed) rootNote.dataset.from = spSeed.from || "";

    const gutter = () => { const n = ta.value.split("\n").length; let out = ""; for (let i = 1; i <= n; i++) out += (i === errLine ? `<b>${i}</b>` : i) + "\n"; gut.innerHTML = out; gut.scrollTop = ta.scrollTop; };
    const say = (err, s) => {

        (con.length ? `<div><span class="eyebrow">Console</span><pre class="sp-console">${esc(con.slice(-40).join("\n"))}</pre></div>` : "");
    };
    const paint = () => {
      const focus = document.activeElement && screen.contains(document.activeElement) ? { key: document.activeElement.dataset.key, a: document.activeElement.selectionStart, b: document.activeElement.selectionEnd } : null;
      screen.innerHTML = sess.render();
      screen.classList.remove("stale");
      if (focus && focus.key) { const el = [...screen.querySelectorAll("input[data-key]")].find(x => x.dataset.key === focus.key); if (el) { el.focus(); try { el.setSelectionRange(focus.a, focus.b); } catch (e) {} } }
    };
    const run = () => {
      errLine = 0;
      try {
        sess = SwiftPlay.create(ta.value);
        paint();
        rootNote.textContent = sess.rootDef.struct ? "Previewing " + sess.rootDef.struct + (sess.prog.extraPreviews ? " · first #Preview only" : "") : "Previewing " + sess.rootDef.label + (sess.prog.extraPreviews ? " · first #Preview only" : "");
        say(null, sess);
      } catch (err) {
        if (!(err instanceof SwiftPlay.PlayError)) console.error(err);
        errLine = err.line || 0;
        screen.classList.add("stale");
        if (!sess) screen.innerHTML = "";

      }
      gutter();
    };
    const store = () => spSave({ preset: sel.value, code: ta.value });
    const act = fn => {
      try { fn(); paint(); say(null, sess); errLine = 0; gutter(); }
      catch (err) { errLine = err.line || 0; say(err instanceof SwiftPlay.PlayError ? err : { message: String(err.message || err) }, sess); gutter(); }
    };
    ta.addEventListener("input", () => { if (sel.value) { sel.value = ""; } gutter(); clearTimeout(timer); timer = setTimeout(() => { run(); store(); }, 250); });
    ta.addEventListener("scroll", () => { gut.scrollTop = ta.scrollTop; });
    ta.addEventListener("keydown", e => {
      if (e.key === "Tab" && !e.shiftKey && !e.altKey && !e.metaKey && !e.ctrlKey) { e.preventDefault(); const a = ta.selectionStart; ta.setRangeText("    ", a, ta.selectionEnd, "end"); ta.dispatchEvent(new Event("input")); }
    });
    sel.addEventListener("change", () => { const p = SPP.find(x => x.id === sel.value); if (p) { ta.value = p.code; run(); store(); } });
    const main = ta.closest(".page");
    main.addEventListener("click", e => {
      const b = e.target.closest("[data-sp]");
      if (b) {
        const k = b.dataset.sp;
        if (k === "reset") { const p = SPP.find(x => x.id === (sel.value || preset)) || SPP[0]; sel.value = p.id; ta.value = p.code; run(); store(); }
        if (k === "light" || k === "dark") { document.getElementById("sp-phone").classList.toggle("dark", k === "dark"); b.parentNode.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b)); }
        return;

      if (sb && screen.contains(sb)) { e.preventDefault(); act(() => sess.flip(+sb.dataset.sb)); return; }

    });
    screen.addEventListener("keydown", e => { const sa = e.target.closest(".sw-tap[data-sa]"); if (sa && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); act(() => sess.act(+sa.dataset.sa)); } });
    screen.addEventListener("input", e => {
      const t = e.target; if (!sess || !t.dataset.sb) return;
      if (t.dataset.sk === "text") act(() => sess.setText(+t.dataset.sb, t.value));
      if (t.dataset.sk === "num") act(() => sess.setNumber(+t.dataset.sb, +t.value));
    });
    Object.defineProperty(SNIP, "sp-code", { get: () => ta.value, configurable: true });
    run();
  }

    if (t.hasAttribute("data-import")) {
      const v = document.getElementById("data-box").value.trim();
      try { const parsed = JSON.parse(decodeURIComponent(escape(atob(v)))); state = Object.assign(blank(), parsed); save(); render(true); toast("Progress imported."); }
      catch (err) { toast("That code isn't a valid export. Paste the full code from “Show export code”.", true); }
      return;
    }
    if (t.hasAttribute("data-reset")) {
      if (t.dataset.armed) { state = blank(); save(); render(true); toast("Progress reset."); }
      else { t.dataset.armed = "1"; t.textContent = "Click again to erase everything"; setTimeout(() => { if (t.isConnected) { delete t.dataset.armed; t.textContent = "Reset progress"; } }, 4000); }
      return;
    }
  });
  document.addEventListener("change", e => {
    const t = e.target;
    if (t.dataset.ms) { state.ms[t.dataset.ms] = t.checked; if (!t.checked) delete state.ms[t.dataset.ms]; save(); const pr = t.closest(".proj"); if (pr) { const boxes = pr.querySelectorAll("[data-ms]"); pr.querySelector(".sub").textContent = pr.querySelector(".sub").textContent.replace(/\d+\/\d+$/, `${[...boxes].filter(b => b.checked).length}/${boxes.length}`); } refreshShell(); }
    if (t.id === "start-date") { state.start = t.value; save(); render(true); }
    if (t.id === "q-mod") { qf.m = t.value; qf.drill = null; persistQf(); document.getElementById("q-list").innerHTML = qList(); }
  });
  document.addEventListener("input", e => {
    if (e.target.id === "qa-search") {
      const v = e.target.value.trim().toLowerCase(); let n = 0;
      document.querySelectorAll(".qa").forEach(li => { const show = !v || li.dataset.text.includes(v); li.hidden = !show; if (show) n++; });
      document.querySelectorAll(".qa-mod").forEach(sec => { sec.hidden = !sec.querySelector(".qa:not([hidden])"); });
      document.getElementById("qa-count").textContent = `${n} shown`;
      return;
    }
    if (e.target.id === "q-search") { qf.s = e.target.value; qf.drill = null; persistQf(); document.getElementById("q-list").innerHTML = qList(); }
  });
  function persistQf() { try { sessionStorage.setItem("swiftAcademy.qf", JSON.stringify({ m: qf.m, lvl: qf.lvl, st: qf.st, s: qf.s })); } catch (e) {} }

  document.addEventListener("toggle", e => { if (e.target.matches && e.target.matches("details.topic") && e.target.open) mountPG(e.target.querySelector(".pg")); }, true);
  window.addEventListener("hashchange", () => render(false));
  render(false);
})();
</script>

</body></html>
