<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body>

<style>
/* Layout: sticky tab bar over one working surface; the lesson view is a two-pane bench (Swift listing left, data stage right). */
:root{
  --bg:#f2f4f9; --surface:#ffffff; --sunk:#e9edf5; --ink:#141b2b; --muted:#566076; --line:#d5dbe8;
  --accent:#d9481f; --accent-soft:#fde5db; --on-accent:#ffffff;

  --body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ color-scheme:dark;
  --bg:#0d121c; --surface:#151c2a; --sunk:#0f1522; --ink:#e6eaf3; --muted:#98a2b8; --line:#273148;
  --accent:#ff8257; --accent-soft:#3a2018; --on-accent:#1a0d07;
  --ptr:#45c9c1; --ptr-soft:#11302f; --ok:#55c98a; --ok-soft:#12301f; --warn:#e3ad4f; --warn-soft:#33270e; --bad:#f28474; --bad-soft:#3a1814;
  --code-bg:#101726; --kw:#e58bd0; --str:#7fd3a2; --num:#86b4ff; --com:#7e89a1; } }
:root[data-theme="dark"]{ color-scheme:dark;
  --bg:#0d121c; --surface:#151c2a; --sunk:#0f1522; --ink:#e6eaf3; --muted:#98a2b8; --line:#273148;
  --accent:#ff8257; --accent-soft:#3a2018; --on-accent:#1a0d07;
  --ptr:#45c9c1; --ptr-soft:#11302f; --ok:#55c98a; --ok-soft:#12301f; --warn:#e3ad4f; --warn-soft:#33270e; --bad:#f28474; --bad-soft:#3a1814;
  --code-bg:#101726; --kw:#e58bd0; --str:#7fd3a2; --num:#86b4ff; --com:#7e89a1; }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:8px 20px;flex-wrap:wrap;padding-block:10px}
.brand{font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em;white-space:nowrap}
.brand b{color:var(--accent)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;max-width:100%;scrollbar-width:none}
nav.tabs button{white-space:nowrap}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px}
button:hover{border-color:var(--muted)}
button:focus-visible,select:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.tab{border-color:transparent;background:transparent;color:var(--muted);font-weight:500}
button.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button.ghost{border-color:transparent;background:transparent;padding:4px 8px}
button:disabled{opacity:.45;cursor:default}
input[type=text],input[type=search],select,textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px;min-width:0}
main{padding-block:22px 60px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);letter-spacing:-.01em;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:28px} h2{font-size:20px} h3{font-size:16px}
p{margin:0;max-width:68ch} .muted{color:var(--muted)} .small{font-size:13px}
a{color:var(--accent)} code,.mono{font-family:var(--mono);font-size:.92em}
.eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:14px}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}
ul.plain{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;border-radius:99px;padding:2px 9px;background:var(--sunk);color:var(--muted);max-width:100%}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)} .pill.acc{background:var(--accent-soft);color:var(--accent)} .pill.ptr{background:var(--ptr-soft);color:var(--ptr)}
.notice{border-left:3px solid var(--warn);background:var(--warn-soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:8px}
.filters label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.scroll-x{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-size:12px;text-align:left;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.clickable{cursor:pointer} tr.clickable:hover td{background:var(--sunk)}
td.num{font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:13px;color:var(--muted);white-space:nowrap}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat{background:var(--sunk);border-radius:8px;padding:10px 12px}
.stat b{display:block;font-family:var(--display);font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat span{font-size:12px;color:var(--muted)}
/* bench */
.bench{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px}
@media (max-width:860px){.bench{grid-template-columns:minmax(0,1fr)}}
.code{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--r);overflow-x:auto;padding:10px 0;font-family:var(--mono);font-size:13px;line-height:1.6;margin:0}
.code .ln{display:flex;min-width:max-content;padding-right:14px;border-left:3px solid transparent}
.code .ln i{flex:none;width:38px;text-align:right;padding-right:12px;color:var(--com);font-style:normal;user-select:none}
.code .ln span.t{white-space:pre}
.code .ln.on{background:var(--accent-soft);border-left-color:var(--accent)}
.kw{color:var(--kw)} .st{color:var(--str)} .nu{color:var(--num)} .co{color:var(--com)}
.stage{display:flex;flex-direction:column;gap:12px;min-width:0}
.note{background:var(--sunk);border-radius:8px;padding:10px 12px;min-height:62px;font-weight:500}
.vars{display:flex;flex-wrap:wrap;gap:6px}
.var{font-family:var(--mono);font-size:13px;background:var(--sunk);border-radius:6px;padding:3px 8px}
.var b{color:var(--ptr);font-weight:600}
.viz h4{margin:0 0 4px;font-size:12px;color:var(--muted);font-weight:600;font-family:var(--body)}
.cells{display:flex;gap:4px;overflow-x:auto;padding:22px 2px 4px;align-items:flex-start;min-height:74px}
.cell{flex:none;min-width:40px;text-align:center;position:relative}
.cell .box{border:1.5px solid var(--line);border-radius:7px;padding:6px 8px;font-family:var(--mono);font-size:14px;background:var(--surface);font-variant-numeric:tabular-nums;transition:background .2s,border-color .2s;white-space:nowrap}
.cell .ix{font-size:11px;color:var(--muted);font-family:var(--mono)}
.cell .pt{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:600;color:var(--ptr);font-family:var(--mono);white-space:nowrap}
.cell.act .box{background:var(--accent-soft);border-color:var(--accent)} .cell.ok .box{background:var(--ok-soft);border-color:var(--ok)}
.cell.bad .box{background:var(--bad-soft);border-color:var(--bad)} .cell.dim .box{opacity:.35}
.arrow{flex:none;align-self:flex-start;padding-top:6px;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;font-style:italic;padding:6px 2px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-family:var(--mono);font-size:13px;border:1.5px solid var(--line);border-radius:7px;padding:4px 8px;background:var(--surface)}
.gridviz{display:inline-grid;gap:4px}
.gcell{width:34px;height:34px;display:grid;place-items:center;border-radius:6px;font-family:var(--mono);font-size:13px;border:1.5px solid var(--line);background:var(--surface)}
.gcell.land{background:var(--ptr-soft);border-color:var(--ptr)} .gcell.ok{background:var(--ok-soft);border-color:var(--ok)}
.gcell.queued{background:var(--ptr-soft);border-color:var(--ptr)} .gcell.dim{opacity:.4} .gcell.bad{background:var(--bad-soft);border-color:var(--bad)}
.gcell.act{background:var(--accent-soft);border-color:var(--accent)} .gcell.scan{border-color:var(--ink)}
svg.tree{max-width:100%;height:auto;display:block}
svg.tree line{stroke:var(--line);stroke-width:1.5}
svg.tree circle{fill:var(--surface);stroke:var(--line);stroke-width:1.5}
svg.tree text{fill:var(--ink);font-family:var(--mono);font-size:13px;text-anchor:middle;dominant-baseline:central}
svg.tree g.act circle{fill:var(--accent-soft);stroke:var(--accent)} svg.tree g.ok circle{fill:var(--ok-soft);stroke:var(--ok)} svg.tree g.queued circle{fill:var(--ptr-soft);stroke:var(--ptr)} svg.tree g.bad circle{fill:var(--bad-soft);stroke:var(--bad)} svg.tree g.dim{opacity:.4}
.controls{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.controls input[type=range]{flex:1 1 120px;min-width:100px;accent-color:var(--accent)}
.out{font-family:var(--mono);background:var(--ok-soft);color:var(--ok);border-radius:8px;padding:8px 12px;font-weight:600}
.inputs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:8px;align-items:end}
.inputs label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);font-weight:600}
.err{color:var(--bad);font-size:13px;font-weight:500}
textarea.scratch{width:100%;min-height:150px;font-family:var(--mono);font-size:13px;resize:vertical}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr));gap:10px}
.pick{text-align:left;display:flex;flex-direction:column;gap:2px;padding:10px 12px}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.pick small{color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:6px}
.day{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);font-size:14px}
.day input{margin-top:3px;accent-color:var(--accent)} .day.done{background:var(--ok-soft);border-color:transparent}
.day .dn{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.bar-track{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden} .bar-fill{height:100%;background:var(--accent);border-radius:99px}
.opt{display:flex;flex-wrap:wrap;gap:6px} .opt button.right{background:var(--ok-soft);border-color:var(--ok)} .opt button.wrong{background:var(--bad-soft);border-color:var(--bad)}
.timer{font-family:var(--mono);font-size:30px;font-weight:600;font-variant-numeric:tabular-nums}
.bugline{display:flex;width:100%;text-align:left;border:0;border-radius:0;background:transparent;padding:1px 14px 1px 0;font-family:var(--mono);font-size:13px;line-height:1.6;white-space:pre}
.bugline:hover{background:var(--sunk)} .bugline.right{background:var(--ok-soft)} .bugline.wrong{background:var(--bad-soft)}
.bugline i{flex:none;width:38px;text-align:right;padding-right:12px;color:var(--com);font-style:normal}
details{min-width:0;border:1px solid var(--line);border-radius:8px;padding:8px 12px;background:var(--surface)} summary{cursor:pointer;font-weight:600}
details[open] summary{margin-bottom:8px}
svg.flow{max-width:none;display:block} svg.flow text{font-family:var(--body);font-size:12.5px;fill:var(--ink);text-anchor:middle}
svg.flow .f-step{fill:var(--surface);stroke:var(--line);stroke-width:1.5} svg.flow .f-ask{fill:var(--ptr-soft);stroke:var(--ptr);stroke-width:1.5} svg.flow .f-end{fill:var(--accent-soft);stroke:var(--accent);stroke-width:1.5}
svg.flow .f-line{stroke:var(--muted);stroke-width:1.5;fill:none} svg.flow .f-head{fill:var(--muted)} svg.flow text.f-lab{font-size:11.5px;fill:var(--muted);font-weight:600}
details.qa summary{font-weight:500} details.qa p{max-width:72ch}
[hidden]{display:none!important}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
