// DSA fundamentals and interview-skills questions. [topic, question, answer]. Prose written for this academy; not compiled code.
const QA_DSA = [
["DSA · Complexity analysis","What do Big-O, Big-Omega and Big-Theta mean?","Big-O is an upper bound on growth, Big-Omega a lower bound, and Big-Theta a tight bound (both at once). In interviews 'O(n)' is usually used loosely to mean the tight bound for the worst case; say which case you mean."],
["DSA · Complexity analysis","What is amortised analysis?","The average cost per operation over a worst-case sequence of operations. Appending to a dynamic array is O(1) amortised: most appends are cheap and the occasional O(n) resize is paid for by the cheap ones before it."],
["DSA · Complexity analysis","What is the difference between best, average and worst case?","They describe different inputs of the same size. Quicksort is O(n log n) on average and O(n²) in the worst case. A hash table lookup is O(1) on average and O(n) in the worst case. State the case you are quoting."],
["DSA · Complexity analysis","How do you analyse a recursive algorithm?","Write a recurrence: the number of sub-calls, the size of each, and the extra work per call. T(n) = 2T(n/2) + O(n) gives O(n log n); T(n) = T(n/2) + O(1) gives O(log n); T(n) = 2T(n − 1) + O(1) gives O(2ⁿ). Drawing the recursion tree and summing each level also works."],
["DSA · Complexity analysis","Where does O(log n) come from?","From repeatedly cutting the problem by a constant factor, as in binary search, or from the height of a balanced tree, as in a heap or balanced BST."],
["DSA · Complexity analysis","How do you count space complexity?","Count the extra memory beyond the input: auxiliary arrays, hash tables, and the recursion stack. A recursive DFS on a tree of height h uses O(h) stack even if it allocates nothing else. Say whether you count the output."],
["DSA · Complexity analysis","What does 'in place' mean?","The algorithm uses O(1) extra memory, or at most O(log n) for a recursion stack, and rearranges the input directly rather than building a copy."],
["DSA · Complexity analysis","How do input limits hint at the expected complexity?","As a rule of thumb, n up to about 20 allows exponential search, a few thousand allows O(n²), around 10⁵ to 10⁶ needs O(n log n) or O(n), and larger needs O(n) or O(log n). Use the limits to rule approaches out early."],
["DSA · Complexity analysis","What is a time–space trade-off? Give an example.","Spending memory to save time or the reverse. Two Sum with a dictionary is O(n) time and O(n) space; sorting with two pointers is O(n log n) time and O(1) extra space. Memoisation is the same trade in DP."],
["DSA · Arrays and strings","When would you choose an array over a linked list?","An array gives O(1) access by index and is cache-friendly, but inserting or removing in the middle is O(n). A linked list gives O(1) insert and remove at a known node but O(n) access and worse locality. Arrays win in most practical cases."],
["DSA · Arrays and strings","How does a dynamic array grow?","When full it allocates a larger buffer, typically by a constant factor such as double, and copies the elements across. Geometric growth is what makes append O(1) amortised; growing by a fixed amount would make it O(n)."],
["DSA · Arrays and strings","How do you rotate an array by k positions in place?","Reduce k modulo n. Reverse the whole array, then reverse the first k elements, then reverse the remaining n − k. O(n) time, O(1) space."],
["DSA · Arrays and strings","How do you check whether two strings are anagrams?","Compare character counts: count the characters of one, subtract for the other, and require every count to be zero. O(n) time. Sorting both and comparing is O(n log n)."],
["DSA · Arrays and strings","How do you sort an array containing only 0, 1 and 2 in one pass?","The Dutch national flag method: keep three pointers low, mid and high. Swap 0s to the front and 2s to the back while mid scans. O(n) time, O(1) space."],
["DSA · Arrays and strings","How do you find an element that appears more than n/2 times?","Boyer–Moore voting: keep a candidate and a counter, incrementing on a match and decrementing otherwise, replacing the candidate when the counter reaches zero. O(n) time, O(1) space. Verify the candidate with a second pass if a majority is not guaranteed."],
["DSA · Arrays and strings","How do you find the longest palindromic substring?","Expand around each of the 2n − 1 centres (each character and each gap) while the two sides match, tracking the longest. O(n²) time, O(1) space. Manacher's algorithm achieves O(n) but is rarely expected."],
["DSA · Arrays and strings","How do you decide between two pointers, a sliding window and prefix sums?","Two pointers for sorted data or pairs from both ends. A sliding window for a contiguous range whose validity changes in one direction as it grows. Prefix sums when the range property is a sum and values can be negative, or when there are many range queries."],
["DSA · Arrays and strings","How do you search a row- and column-sorted matrix?","Start at the top-right corner. If the value is too large move left; if too small move down. Each step removes a row or column, so it is O(rows + cols)."],
["DSA · Linked lists","What is the difference between singly and doubly linked lists?","A singly linked node stores one next pointer; a doubly linked node also stores prev. Doubly linked lists allow O(1) removal of a known node and backward traversal, at the cost of more memory and more pointer updates."],
["DSA · Linked lists","Why use a dummy (sentinel) head node?","It removes the special case for inserting or deleting at the head, because every real node then has a predecessor. Return dummy.next at the end."],
["DSA · Linked lists","How do you find the middle of a linked list in one pass?","Move a slow pointer one step and a fast pointer two steps. When fast reaches the end, slow is at the middle."],
["DSA · Linked lists","How do you remove the nth node from the end in one pass?","Advance a lead pointer n steps, then move lead and a trailing pointer together until lead reaches the end. The trailing pointer is then just before the node to remove. A dummy head handles removing the first node."],
["DSA · Linked lists","Why is binary search not useful on a linked list?","Reaching the middle element takes O(n), so the halving saves comparisons but not time. The total is still O(n)."],
["DSA · Linked lists","How would you design an LRU cache?","Combine a hash map from key to node with a doubly linked list ordered by recency. A get moves the node to the front; a put inserts at the front and evicts from the back when over capacity. Both are O(1)."],
["DSA · Linked lists","How do you check whether a linked list is a palindrome in O(1) space?","Find the middle with slow and fast pointers, reverse the second half in place, compare the two halves node by node, and restore the list if required."],
["DSA · Stacks and queues","What is the difference between a stack and a queue?","A stack is last-in-first-out; a queue is first-in-first-out. Stacks suit nested structure, undo and DFS. Queues suit processing in arrival order and BFS."],
["DSA · Stacks and queues","How do you build a queue from two stacks?","Push onto an input stack. To dequeue, pop from an output stack, refilling it by moving everything from the input stack only when it is empty. Each element moves at most once, so operations are O(1) amortised."],
["DSA · Stacks and queues","How do you design a stack that returns its minimum in O(1)?","Keep a second stack of minimums, or store with each element the minimum at the time it was pushed. Pop both together."],
["DSA · Stacks and queues","How do you evaluate an expression in reverse Polish notation?","Scan the tokens. Push numbers; on an operator pop two operands, apply it with the correct order, and push the result. The final stack entry is the answer."],
["DSA · Stacks and queues","What is a deque and when is it useful?","A double-ended queue with O(1) insert and remove at both ends. It supports sliding-window maximum, 0–1 BFS and work-stealing queues."],
["DSA · Stacks and queues","How does recursion relate to the call stack?","Each call pushes a frame holding its parameters, locals and return address. Deep recursion can overflow the stack; converting to an explicit stack on the heap avoids that."],
["DSA · Hash tables","How does a hash table work?","A hash function maps a key to a bucket index in an array. Lookups go straight to that bucket, giving O(1) on average. Different keys can land in the same bucket, which is a collision that must be resolved."],
["DSA · Hash tables","How are collisions handled?","Separate chaining keeps a list of entries in each bucket. Open addressing stores entries in the array itself and probes for another slot, for example linearly. Chaining degrades gently; open addressing is more cache-friendly but sensitive to load."],
["DSA · Hash tables","What is the load factor and why does a table resize?","The load factor is entries divided by buckets. As it rises, collisions rise, so the table grows and rehashes every entry once it passes a threshold. Resizing is O(n) but amortises to O(1) per insert."],
["DSA · Hash tables","Why can a hash table operation take O(n)?","If many keys collide, a single bucket or probe sequence holds most of the entries. That happens with a poor hash function or adversarial keys; randomised hashing reduces the risk."],
["DSA · Hash tables","What makes a good hash key?","It is immutable while stored, equal keys always hash equally, the hash spreads keys evenly, and it is cheap to compute."],
["DSA · Hash tables","When would you use a tree-based map instead of a hash map?","When you need keys in sorted order, range queries, or the nearest key above or below a value, or when you need guaranteed O(log n) rather than average O(1)."],
["DSA · Trees and BSTs","What is the difference between a binary tree and a binary search tree?","A binary tree only limits each node to two children. A BST also orders them: everything in the left subtree is smaller than the node and everything in the right subtree is larger. That ordering gives search, insert and delete in O(height)."],
["DSA · Trees and BSTs","What are the tree traversals and when is each used?","Pre-order (node, left, right) to copy or serialise a tree. In-order (left, node, right) to read a BST in sorted order. Post-order (left, right, node) when a node needs its children's results. Level-order (BFS) for anything by depth."],
["DSA · Trees and BSTs","Why do balanced trees matter?","A BST's operations cost O(height). An unbalanced BST can degrade to a linked list with height n. Self-balancing trees such as AVL and red-black trees keep the height O(log n) with rotations."],
["DSA · Trees and BSTs","How do you validate a BST?","Pass down an allowed range: every node must lie strictly between the bounds inherited from its ancestors. Checking only each node against its direct children is wrong. Alternatively, an in-order traversal must be strictly increasing."],
["DSA · Trees and BSTs","How do you find the lowest common ancestor?","In a BST, walk from the root: go left if both values are smaller, right if both are larger, otherwise the current node is the answer. In a general binary tree, use post-order recursion: a node is the LCA if the two targets are found in different subtrees, or it is one of them."],
["DSA · Trees and BSTs","What is the difference between height and depth?","Depth is the number of edges from the root down to a node. Height is the number of edges on the longest path from a node down to a leaf. Some problems count nodes instead of edges, so confirm the convention."],
["DSA · Trees and BSTs","What are full, complete and perfect binary trees?","Full: every node has 0 or 2 children. Complete: every level is filled except possibly the last, which is filled from the left. Perfect: all internal nodes have 2 children and all leaves are at the same depth."],
["DSA · Trees and BSTs","How do you serialise and deserialise a binary tree?","Write a pre-order or level-order traversal that includes a marker for missing children. Rebuild by reading the values in the same order and consuming a marker wherever a child is absent."],
["DSA · Trees and BSTs","How do you delete a node from a BST?","With no children, remove it. With one child, replace it by that child. With two, copy in its in-order successor (the smallest value in the right subtree) and delete that successor node instead."],
["DSA · Trees and BSTs","How do BFS and DFS differ in memory on a tree?","DFS uses O(height) memory for the stack. BFS uses O(width) for the queue, which can be about n/2 on the last level of a balanced tree."],
["DSA · Heaps and priority queues","What is a binary heap and how is it stored?","A complete binary tree in which every parent is no larger than its children (min-heap) or no smaller (max-heap). It is stored in an array: for index i the children are at 2i + 1 and 2i + 2 and the parent at (i − 1) / 2."],
["DSA · Heaps and priority queues","What are the costs of heap operations?","Peek is O(1). Insert and remove-top are O(log n) because an element sifts along one root-to-leaf path. Building a heap from n elements is O(n) when done bottom-up."],
["DSA · Heaps and priority queues","Why is building a heap O(n) and not O(n log n)?","Bottom-up heapify sifts each node down by at most its height. Most nodes are near the bottom with small heights, and the sum of heights over all nodes is O(n)."],
["DSA · Heaps and priority queues","How does heapsort work?","Build a max-heap, then repeatedly swap the root with the last element, shrink the heap by one and sift the new root down. O(n log n) time, O(1) extra space, not stable."],
["DSA · Heaps and priority queues","How do you find the running median of a stream?","Keep a max-heap for the lower half and a min-heap for the upper half, balanced so their sizes differ by at most one. The median is the top of the larger heap or the average of both tops. O(log n) per insert."],
["DSA · Heaps and priority queues","When would you use a heap rather than a balanced BST?","A heap when you only need the minimum or maximum repeatedly: it is simpler, array-based and has small constants. A balanced BST when you also need search, ordered iteration, or removal of arbitrary elements."],
["DSA · Graphs","How can a graph be represented?","An adjacency list stores each node's neighbours and uses O(V + E) memory. An adjacency matrix uses O(V²) memory and answers 'is there an edge' in O(1). An edge list suits algorithms that sort edges, such as Kruskal's."],
["DSA · Graphs","When do you use BFS and when DFS?","BFS for the shortest path in an unweighted graph and anything level by level. DFS for reachability, cycle detection, topological order, connected components and exhaustive search. Both are O(V + E)."],
["DSA · Graphs","How do you detect a cycle?","Undirected: DFS and look for an edge to a visited node that is not the parent, or use Union Find and look for an edge joining two nodes already connected. Directed: DFS with three states and look for an edge to a node still on the current path, or run Kahn's algorithm and check whether every node was output."],
["DSA · Graphs","What is topological sorting?","An ordering of a directed acyclic graph in which every edge goes from earlier to later. Use Kahn's algorithm with in-degree counts, or DFS and reverse the finishing order. It exists only if there is no cycle."],
["DSA · Graphs","How does Dijkstra's algorithm work, and what is its limitation?","It repeatedly settles the unsettled node with the smallest known distance and relaxes its edges, using a min-heap. O((V + E) log V). It requires non-negative edge weights, because a settled distance is assumed final."],
["DSA · Graphs","What do you use when edge weights can be negative?","Bellman–Ford: relax every edge V − 1 times, O(V · E). One more pass that still improves a distance reveals a negative cycle. For all pairs on a small graph, Floyd–Warshall is O(V³)."],
["DSA · Graphs","What is a minimum spanning tree and how do you build one?","A set of edges connecting all nodes with the smallest total weight and no cycle. Kruskal sorts edges and adds each one that joins two different components, using Union Find: O(E log E). Prim grows a tree from one node using a min-heap: O(E log V)."],
["DSA · Graphs","How do you check whether a graph is bipartite?","Colour it with two colours using BFS or DFS, giving each neighbour the opposite colour. It is bipartite exactly when no edge joins two nodes of the same colour."],
["DSA · Graphs","How do you treat a grid as a graph?","Each cell is a node with edges to its valid neighbours in four (or eight) directions. Use a direction array, check bounds, and mark cells visited in the grid itself or a separate array."],
["DSA · Graphs","How do you count connected components?","Run BFS or DFS from every unvisited node, counting how many times you start. Or use Union Find and count the distinct roots."],
["DSA · Sorting and searching","How do the common sorting algorithms compare?","Bubble, selection and insertion sort are O(n²); insertion sort is fast on small or nearly sorted input. Merge sort is O(n log n) always, stable, O(n) space. Quicksort is O(n log n) average, O(n²) worst, in place. Heapsort is O(n log n) worst, in place, not stable."],
["DSA · Sorting and searching","What does it mean for a sort to be stable, and why does it matter?","Equal elements keep their original relative order. It matters when sorting records by several keys in turn, for example by name and then by date."],
["DSA · Sorting and searching","Can sorting be faster than O(n log n)?","Not by comparisons alone; n log n is a proven lower bound for comparison sorts. Counting sort is O(n + k) for integers in a range of size k, and radix sort is O(d · (n + k)) for d digits, because they do not compare elements."],
["DSA · Sorting and searching","How does quicksort work and how do you avoid its worst case?","Pick a pivot, partition the array into smaller and larger elements, and recurse on both sides. The worst case arises from consistently bad pivots, such as the first element of sorted input. Use a random pivot or median-of-three, and three-way partitioning when there are many duplicates."],
["DSA · Sorting and searching","What is quickselect?","Quicksort's partition step used to find the kth smallest element: after partitioning, recurse only into the side that contains position k. O(n) on average, O(n²) in the worst case."],
["DSA · Sorting and searching","What are the common binary search variants?","Exact match, first position not less than the target (lower bound), first position greater than the target (upper bound), search in a rotated sorted array, peak finding, and binary search over a range of answers using a yes/no test."],
["DSA · Sorting and searching","What are the usual binary search bugs?","Mixing closed and half-open ranges, an update that fails to shrink the range and loops forever, overflow in (lo + hi) / 2 in fixed-width languages, and returning the wrong boundary. Fix an invariant and test with one and two elements."],
["DSA · Recursion and backtracking","What does every recursive function need?","A base case that returns without recursing, and recursive calls that move toward that base case. It helps to state what the function returns and trust that definition for the sub-calls."],
["DSA · Recursion and backtracking","When do you convert recursion to iteration?","When the depth could overflow the stack, as with a skewed tree or long list, or when performance matters. Use an explicit stack, or a loop if the recursion is a simple tail call. Swift does not guarantee tail-call optimisation."],
["DSA · Recursion and backtracking","What is the general backtracking template?","If the partial solution is complete, record it and return. Otherwise, for each valid choice: make the choice, recurse, then undo the choice. Check constraints before recursing to prune."],
["DSA · Recursion and backtracking","How many subsets, permutations and combinations are there?","A set of n distinct items has 2ⁿ subsets, n! permutations, and n! / (k! (n − k)!) combinations of size k. These counts set the minimum cost of generating them."],
["DSA · Recursion and backtracking","What is pruning?","Abandoning a branch as soon as it cannot lead to a valid or better answer, for example when the running sum already exceeds the target. Sorting the input first often makes pruning more effective."],
["DSA · Recursion and backtracking","What is memoisation?","Caching the result of a function for each distinct argument set so that repeated sub-problems are computed once. It turns many exponential recursions into polynomial ones and is top-down dynamic programming."],
["DSA · Dynamic programming","When does dynamic programming apply?","When the problem has optimal substructure, meaning the best answer is built from best answers to sub-problems, and overlapping sub-problems, meaning the same sub-problems recur. Typical signals: count the ways, minimum or maximum cost, or is it possible."],
["DSA · Dynamic programming","How do you design a DP solution?","Define the state precisely in words. Write the transition from smaller states. Set the base cases. Choose an order in which dependencies are computed first. State where the answer is. Then consider reducing space."],
["DSA · Dynamic programming","What is the difference between 0/1 knapsack and unbounded knapsack?","In 0/1 each item is used at most once; with a one-dimensional table, iterate capacity downward so an item is not reused. In unbounded, items can repeat; iterate capacity upward. Coin Change is the unbounded form."],
["DSA · Dynamic programming","How do you find the longest increasing subsequence?","The basic DP lets dp[i] be the longest increasing subsequence ending at i and checks all earlier j: O(n²). The faster method keeps, for each length, the smallest possible tail value and binary-searches where each new element goes: O(n log n)."],
["DSA · Dynamic programming","How do longest common subsequence and edit distance work?","Both fill a two-dimensional table over prefixes of the two strings. For LCS, matching characters extend the diagonal by one; otherwise take the better of dropping a character from either string. Edit distance takes the minimum of insert, delete and replace. Both are O(m · n)."],
["DSA · Dynamic programming","How do DP, greedy and divide and conquer differ?","Divide and conquer splits into independent sub-problems. DP handles overlapping sub-problems by storing results and considers all choices. Greedy commits to one choice at each step and needs a proof that the choice is safe."],
["DSA · Dynamic programming","What are common DP families?","Linear sequences (House Robber), grid paths, knapsack and subset sum, two-string tables (LCS, edit distance), interval DP, DP on trees, and bitmask DP over small sets."],
["DSA · Greedy algorithms","When is a greedy algorithm correct?","When the problem has the greedy-choice property: some optimal solution contains the locally best choice, and what remains is a smaller instance of the same problem. Justify it with an exchange argument or by showing greedy stays ahead."],
["DSA · Greedy algorithms","What is the activity selection problem?","Choose the largest number of non-overlapping intervals. Sort by end time and take each interval that starts no earlier than the last chosen one ends. Finishing earliest leaves the most room for the rest."],
["DSA · Greedy algorithms","What is Huffman coding?","A greedy method for building an optimal prefix code. Repeatedly merge the two least frequent symbols into one node using a min-heap; frequent symbols end up with shorter codes. O(n log n)."],
["DSA · Strings and tries","What is a trie and when is it better than a hash set?","A tree keyed by characters in which shared prefixes share nodes. Use it for prefix queries, autocomplete, and matching many words against a text or board. A hash set is simpler and smaller when only exact lookups are needed."],
["DSA · Strings and tries","How does KMP string matching work?","It precomputes, for each prefix of the pattern, the length of the longest proper prefix that is also a suffix. On a mismatch it uses that table to shift the pattern without re-reading text characters. O(n + m)."],
["DSA · Strings and tries","What is a rolling hash?","A hash of a window that can be updated in O(1) when the window slides by one character, by removing the outgoing character's contribution and adding the incoming one. Rabin–Karp uses it to find substring matches; confirm candidate matches to rule out collisions."],
["DSA · Strings and tries","How do you group words that are anagrams of each other?","Map each word to a canonical key, either its sorted characters or its 26 letter counts, and collect words by key in a dictionary."],
["DSA · Bit manipulation","What are the essential bit operations?","Test bit i with x & (1 << i). Set it with x | (1 << i). Clear it with x & ~(1 << i). Toggle it with x ^ (1 << i). x & (x − 1) clears the lowest set bit and x & −x isolates it."],
["DSA · Bit manipulation","How do you check whether a number is a power of two?","It must be positive and have exactly one set bit: x > 0 and x & (x − 1) equals 0."],
["DSA · Bit manipulation","What properties of XOR are useful?","x ^ x is 0, x ^ 0 is x, and XOR is commutative and associative. Together these cancel pairs, which finds a single unpaired value or a missing number."],
["DSA · Bit manipulation","When do you use a bitmask to represent a set?","When the set has at most about 20 to 30 elements. An integer then stores membership compactly, set operations become single instructions, and the mask can index a DP table."],
["DSA · Union Find","What is Union Find and what does it cost?","A structure that tracks which elements belong to the same group, with find to get a group's representative and union to merge two groups. With path compression and union by size or rank, each operation is near-constant amortised time."],
["DSA · Union Find","What is Union Find used for?","Counting connected components, detecting a cycle in an undirected graph, Kruskal's minimum spanning tree, and answering connectivity queries while edges are being added."],
["Interview · Approach","How should you approach a problem you have not seen before?","Restate it in your own words and confirm with an example. Ask about input size, value ranges and edge cases. Describe a brute-force solution and its cost. Look for the bottleneck and improve it. Agree the approach, then code, then test by hand, then state complexity."],
["Interview · Approach","What clarifying questions are worth asking?","How large is the input? Can values be negative, zero or duplicated? Is the input sorted? Can it be empty? What should be returned when there is no answer? May the input be modified? Is one answer enough or are all needed?"],
["Interview · Approach","Should you start with the brute-force solution?","Yes, state it briefly with its complexity even if you do not code it. It shows you understand the problem, gives a baseline, and often reveals the repeated work that the better solution removes."],
["Interview · Approach","How do you choose a data structure?","Start from the operations you need to be fast. Membership or counting: hash set or map. Most recent first: stack. Arrival order: queue. Repeated minimum or maximum: heap. Ordered or range queries: sorted array or balanced tree. Prefixes: trie. Merging groups: Union Find."],
["Interview · Approach","What do you do when you are stuck?","Say what you have tried and where it fails. Work a small example by hand and look for a pattern. Try sorting the input, a hash map, or solving a simpler version first. Thinking aloud lets the interviewer give a useful hint."],
["Interview · Approach","How do you recognise which pattern a problem needs?","Read the signals: sorted input suggests binary search or two pointers; contiguous range suggests a sliding window or prefix sums; top k suggests a heap; shortest steps suggests BFS; all combinations suggests backtracking; count the ways or best cost suggests DP; dependencies suggest topological sort."],
["Interview · Approach","How do you manage time in a 45-minute interview?","Roughly 5 minutes to understand and clarify, 5 to 10 to settle the approach, 15 to 20 to code, and 5 to 10 to test and discuss complexity. If the best approach is not coming, implement a correct simpler one and explain how you would improve it."],
["Interview · Communication and testing","How should you talk while coding?","Explain the plan before you start, name what each block does as you write it, and say when you are making an assumption or leaving something to fix later. Avoid long silences; a quiet interviewer cannot give you credit for reasoning they did not hear."],
["Interview · Communication and testing","How do you test your code in an interview?","Trace a small normal case line by line, tracking variable values. Then try edge cases: empty input, one element, duplicates, all equal, negatives, and the largest size. Fix bugs you find and say what you changed."],
["Interview · Communication and testing","How do you present complexity?","Give time and space separately, define what n means, state which case you are quoting, and justify it in a sentence, for example 'each element is pushed and popped at most once'. Mention the recursion stack if there is one."],
["Interview · Communication and testing","What should you do when the interviewer points out a bug or gives a hint?","Treat it as information. Acknowledge it, re-trace the relevant case, fix the cause rather than patching the symptom, and re-test. Taking hints well counts in your favour."],
["Interview · Communication and testing","What if you have seen the problem before?","Say so. Most interviewers will either move to a different problem or ask you to go ahead and then extend it. Reciting a memorised answer while pretending to discover it tends to show and reflects badly."],
["Interview · Communication and testing","What are interviewers evaluating?","Problem solving, correct and readable code, communication, testing habits, knowledge of data structures and complexity, and how you respond to hints and changes in requirements. A clear, correct simpler solution usually scores better than an unfinished clever one."],
["Interview · Communication and testing","What Swift-specific points help in a coding interview?","Convert a String to Array(s) before indexing. Remember the standard library has no heap, so be ready to write one. Avoid removeFirst() in loops. Use guard for early exits, dictionary default subscripts for counting, and value semantics to your advantage when copying paths in backtracking."],
["Interview · Communication and testing","What questions can you ask at the end?","Ask about the team's current technical challenges, how work is planned and reviewed, what success looks like in the first months, and how the team handles on-call and quality. Specific questions show real interest."]
];
// Swift language interview questions. [topic, question, answer]. Prose written for this academy; not compiled code.
const QA_SWIFT = [
["Swift · Types and values","What is the difference between a struct and a class?","A struct is a value type: assigning or passing it makes an independent copy. A class is a reference type: assignments share one object. Classes support inheritance, deinit and identity (===) and are managed by ARC. Structs get a memberwise initialiser and have no inheritance. Prefer structs unless you need shared identity or inheritance."],
["Swift · Types and values","What is copy-on-write?","Array, Dictionary, Set and String share their storage after a copy and duplicate it only when one copy is mutated while the storage is shared. Copies are therefore cheap until a write happens. A custom type can do the same using isKnownUniquelyReferenced on a class that holds its storage."],
["Swift · Types and values","What do let and var mean for a struct and for a class instance?","let makes the value constant. For a struct that freezes every property. For a class instance it freezes only the reference; the object's var properties can still change."],
["Swift · Types and values","What does mutating mean?","A method on a struct or enum that changes self must be marked mutating. It cannot be called on a value declared with let."],
["Swift · Types and values","What is the difference between raw values and associated values in an enum?","Raw values are one fixed value of a single type per case, set at compile time, and give you init(rawValue:). Associated values are data attached to a case each time it is created, and can differ in type and count between cases."],
["Swift · Types and values","When would you use a tuple instead of a struct?","For a small, short-lived grouping such as returning two values from a function. Use a struct once the data needs a name, methods, protocol conformances, or is passed around widely."],
["Swift · Types and values","What is the difference between static and class members?","Both belong to the type rather than an instance. A class member can be overridden by a subclass; a static member cannot. Structs and enums only have static."],
["Swift · Types and values","What is a lazy property?","A stored property whose initial value is computed on first access. It must be a var. Its initialisation is not thread-safe by default, so concurrent first access needs protection."],
["Swift · Types and values","What are property observers?","willSet runs just before a stored property changes and didSet just after. They are not called when the property is first set inside its own type's initialiser."],
["Swift · Types and values","What is the difference between a stored and a computed property?","A stored property holds a value in memory. A computed property has no storage; it runs a getter (and optionally a setter) every time it is accessed, so keep it cheap or document its cost."],
["Swift · Types and values","What does inout do?","It lets a function modify the caller's variable. The argument is passed with &. Semantically the value is copied in and copied back out, and Swift's exclusivity rule forbids overlapping access to the same variable during the call."],
["Swift · Types and values","What is the difference between == and ===?","== compares values using Equatable. === checks whether two class references point to the same object. Linked-list and graph problems usually need ===."],
["Swift · Optionals","What is an Optional?","An enum with two cases: none, and some holding a wrapped value. T? is shorthand for Optional<T>. It makes the absence of a value explicit in the type."],
["Swift · Optionals","What are the ways to unwrap an optional?","if let and guard let, the nil-coalescing operator ??, optional chaining with ?., pattern matching in a switch, and force unwrapping with !, which crashes on nil. Since Swift 5.7, 'if let x' can shadow an existing optional x without repeating the name."],
["Swift · Optionals","When do you use guard let instead of if let?","guard let requires the else branch to leave the scope and keeps the unwrapped value available afterwards. It suits early exits and keeps the main path unindented. if let limits the value to its own block."],
["Swift · Optionals","What is an implicitly unwrapped optional?","A type written T!. It is an optional that is force-unwrapped automatically where a non-optional is needed, so it crashes if it is nil at that point. It is used when a value is set shortly after initialisation, such as outlets."],
["Swift · Optionals","What does optional chaining return?","An optional of the final result type. If any link in the chain is nil the whole expression is nil and the rest is not evaluated."],
["Swift · Optionals","What is the difference between map and flatMap on an Optional?","map applies a function to the wrapped value and re-wraps the result. If the function itself returns an optional, map gives a double optional; flatMap flattens it to a single optional."],
["Swift · Collections","What are the costs of common Array, Set and Dictionary operations?","Array: index access O(1), append amortised O(1), insert or remove at the front or middle O(n), contains O(n). Set and Dictionary: insert, lookup and remove O(1) on average, with elements or keys that are Hashable and no defined order."],
["Swift · Collections","Why can you not index a String with an Int?","A Character is a grapheme cluster that can span several Unicode scalars, so characters have variable width. Reaching the nth character means walking from the start, which is O(n). Swift makes that cost visible through String.Index; count is also O(n). For algorithms, convert to Array(s) first."],
["Swift · Collections","What do map, filter, reduce, compactMap and flatMap do?","map transforms each element. filter keeps the elements that pass a test. reduce combines all elements into one value. compactMap transforms and drops nil results. flatMap transforms each element into a sequence and concatenates the results."],
["Swift · Collections","What is an ArraySlice?","A view onto part of an array that shares the array's storage and keeps the original indices, so it may not start at 0. Creating it is O(1). Convert with Array(slice) for long-term storage, because a slice keeps the whole original buffer alive."],
["Swift · Collections","Is a Dictionary ordered?","No. The order is unspecified and can differ between runs because hashing is seeded per process. Sort the keys when order matters, or use OrderedDictionary from swift-collections."],
["Swift · Collections","What is the difference between sort and sorted, and is the sort stable?","sort() reorders in place; sorted() returns a new array. Both are O(n log n). The documentation does not guarantee stability, so do not rely on equal elements keeping their order even though the current implementation behaves stably."],
["Swift · Collections","What does .lazy do?","It defers map, filter and similar operations until elements are actually consumed, so no intermediate arrays are built. It helps when you only need the first few results or the chain is long."],
["Swift · Collections","What is reserveCapacity for?","It allocates room for a known number of elements up front, avoiding repeated reallocation and copying as an array grows."],
["Swift · Collections","Why is removeFirst() a problem in loops, and what do you use instead?","It shifts every remaining element, so each call is O(n). For a queue, keep a head index, swap whole-level arrays in BFS, or use Deque from swift-collections."],
["Swift · Collections","Does Swift have a built-in heap or priority queue?","Not in the standard library. Use Heap from swift-collections, or write a small binary heap over an array, which interviewers often accept or expect."],
["Swift · Collections","What happens on integer overflow?","Arithmetic traps at runtime instead of wrapping silently. Use &+, &- and &* for wrapping arithmetic, or addingReportingOverflow to detect overflow. Computing a midpoint as lo + (hi − lo) / 2 avoids overflow."],
["Swift · Collections","What are Character, Unicode.Scalar and UTF-8 bytes, and which should an algorithm use?","Character is a user-visible character, Unicode.Scalar is one code point, and utf8 exposes raw bytes. For input known to be ASCII, Array(s.utf8) is the fastest to index and compare. Use Array(s) of Character when user-visible characters matter."],
["Swift · Memory management","How does ARC work?","The compiler inserts retain and release calls. An object is freed as soon as its strong reference count reaches zero. It is not a tracing garbage collector and does not detect reference cycles."],
["Swift · Memory management","What is a retain cycle and how do you break it?","Two or more objects hold strong references to each other, so none of their counts reach zero and they leak. Break the cycle by making one of the references weak or unowned."],
["Swift · Memory management","What is the difference between weak and unowned?","A weak reference is an optional var that becomes nil when the object is freed. An unowned reference is non-optional and assumes the object outlives it; using it after the object is freed crashes. Use weak when unsure."],
["Swift · Memory management","When do you need [weak self] in a closure?","When an escaping closure that captures self is stored, directly or indirectly, by something self owns, which would form a cycle. It is not needed for non-escaping closures, and often not for closures that run once and are then released."],
["Swift · Memory management","What is the difference between escaping and non-escaping closures?","A non-escaping closure, the default for parameters, is guaranteed to run before the function returns. An @escaping closure may be stored or run later, so it can extend the lifetime of what it captures and requires explicit self for class instances."],
["Swift · Memory management","How do closures capture variables?","By default a closure captures the variable itself, so it sees later changes. A capture list such as [x] copies the value at the moment the closure is created."],
["Swift · Protocols and generics","What is protocol-oriented programming?","Describing behaviour with protocols and supplying shared implementations through protocol extensions, instead of through a class hierarchy. A type can adopt many protocols, and structs and enums can take part."],
["Swift · Protocols and generics","What is an associated type?","A placeholder type inside a protocol that each conforming type fills in, such as Element in Sequence. Since Swift 5.7 a protocol can declare primary associated types, which lets you write constraints like some Collection<Int>."],
["Swift · Protocols and generics","What is the difference between some and any?","some P is an opaque type: one specific concrete type that the compiler knows and the caller does not. any P is an existential: a box that can hold any conforming type and may change at runtime, at the cost of dynamic dispatch. Prefer some unless you need to mix types."],
["Swift · Protocols and generics","Why use generics instead of Any?","Generics keep full type information at compile time, so there is no casting, errors are caught early, and the compiler can specialise the code for speed."],
["Swift · Protocols and generics","What are Equatable, Hashable, Comparable and Codable?","Equatable provides ==, Hashable allows use in a Set or as a Dictionary key, Comparable provides ordering with <, and Codable provides encoding and decoding. The compiler synthesises Equatable, Hashable and Codable when all stored properties conform; Comparable is synthesised only for enums."],
["Swift · Protocols and generics","What can and cannot an extension do?","It can add methods, computed properties, initialisers, nested types and protocol conformances. It cannot add stored properties or override existing members."],
["Swift · Protocols and generics","What is the difference between static and dynamic dispatch?","With static dispatch the call target is fixed at compile time, as for struct methods and final or private members, which allows inlining. With dynamic dispatch it is looked up at runtime: class methods through a table, protocol requirements through a witness table. A method defined only in a protocol extension, and not declared in the protocol, is dispatched statically."],
["Swift · Error handling","How does error handling work in Swift?","A function marked throws can throw an Error. Call it with try inside do and handle failures in catch. try? converts an error to nil and try! crashes on an error. Swift 6 adds typed throws, written throws(MyError)."],
["Swift · Error handling","What is the Result type for?","An enum with success and failure cases. It stores or passes on an outcome when throwing directly is not possible, such as in completion handlers or collections of outcomes."],
["Swift · Error handling","What does defer do?","It schedules a block to run when the current scope exits, however it exits. Several defer blocks run in reverse order of declaration. It is typical for cleanup."],
["Swift · Error handling","What is the difference between assert, precondition and fatalError?","assert is checked only in debug builds. precondition is checked in debug and normal release builds. fatalError always stops the program and can be used where a value must be returned."],
["Swift · Concurrency","What does async/await do?","An async function can suspend at an await without blocking its thread, and resumes later. Code reads top to bottom, and errors use normal throws."],
["Swift · Concurrency","What is the difference between async let, a task group and Task?","async let starts a fixed number of child tasks in parallel. A task group starts a dynamic number. Both are structured: children finish or are cancelled before the scope ends. Task { } starts unstructured work that is not tied to the current scope."],
["Swift · Concurrency","What is an actor?","A reference type that protects its mutable state by letting only one task run its isolated code at a time. Access from outside uses await. Actors are re-entrant: state can change across an await inside an actor method, so re-check assumptions after suspending."],
["Swift · Concurrency","What is @MainActor?","A global actor that represents the main thread. Marking a type or function with it guarantees it runs on the main thread, which UI code requires."],
["Swift · Concurrency","What is Sendable?","A marker protocol for types that are safe to pass between concurrency domains: value types whose members are Sendable, actors, and immutable final classes. The Swift 6 language mode reports data-race violations as errors."],
["Swift · Concurrency","How does task cancellation work?","It is cooperative. Cancelling sets a flag; the task must check Task.isCancelled or call try Task.checkCancellation() and stop itself. Many system async functions check for you."],
["Swift · Concurrency","How does Swift concurrency differ from GCD?","GCD schedules closures on queues, and correctness is up to you. Swift concurrency adds structured tasks, built-in cancellation and priority handling, and compiler checks for data races. Do not block its cooperative threads with locks or semaphores that wait."]
];
// Answers written for this academy. They describe approaches; they are not compiled code.
const QA_LESSON = {
"two-sum":["Use two pointers, one at each end. Move the left pointer right when the sum is too small and the right pointer left when it is too large. O(n) time, O(1) space, no dictionary.","Do not return at the first hit. Store a list of indices for each value, and for every element emit a pair with each earlier index of its complement. The output itself can hold O(n²) pairs.","For value pairs, sort and use two pointers, skipping over equal neighbours after each hit. Alternatively keep a set of pairs already reported, stored as (smaller, larger).","If the value were stored first, an element equal to half the target would find itself and be paired with its own index."],
"valid-parentheses":["Push indices along with the characters. On a mismatch or a closer with an empty stack, the current index is the error. If openers remain at the end, report the index of the earliest unclosed one.","Skip any character that is neither an opener nor a closer and process the rest exactly as before.","Yes. Keep a counter: add one for an opener, subtract one for a closer, fail if it ever goes negative, and require zero at the end."],
"best-time-to-buy-and-sell-stock":["Add up every positive day-to-day rise. Any longer rise is the sum of its daily rises, so this greedy total is optimal.","Use DP with a small number of states per day, such as holding and not holding (plus a cooling state for cooldown). Update each state from the previous day. O(n) time, O(1) space.","Remember the index of the minimum price. Whenever best improves, record that index and the current day."],
"binary-search":["When nums[mid] equals the target, record mid and keep searching the left half (hi = mid − 1). Equivalently, find the first index whose value is ≥ target and check it.","At every step at least one half is sorted. Check whether the target lies inside the sorted half's value range; if so search there, otherwise search the other half. Still O(log n).","Define a yes/no test that is false up to some value and true after it, for example 'can the work finish at speed x'. Binary search the range of candidate answers for the first value that passes."],
"maximum-subarray":["Keep a candidate start that resets whenever a new run begins. When best improves, record the candidate start and the current index.","The best run lies entirely in the left half, entirely in the right half, or crosses the middle. The crossing case is the best suffix of the left plus the best prefix of the right. That gives O(n log n), or O(n) if each call returns total, best prefix, best suffix and best.","The answer is the larger of the normal maximum and (total − minimum subarray), which represents a run that wraps around. If every value is negative, return the normal maximum."],
"longest-substring-without-repeating-characters":["Record the window's start index whenever best improves, then build the string from that start and length.","Keep a count per character. After adding the right character, shrink from the left while the number of distinct characters exceeds k, decreasing counts and removing zeros.","Swift String cannot be indexed by integer in O(1); reaching offset i costs O(i). An Array<Character> gives O(1) access and still treats each user-visible character as one element."],
"reverse-linked-list":["Reverse the rest of the list first, then make the old second node point back to the head and set head.next to nil. It uses O(n) call stack.","Walk to the node just before position m. Then, n − m times, detach the node after the sublist's first node and re-insert it at the front of the sublist. A dummy head handles m = 1.","Check that k nodes remain. Reverse those k, connect the previous group's tail to the new group head, and continue. A final group shorter than k is left as it is."],
"merge-two-sorted-lists":["Put the head of each list in a min-heap; repeatedly pop the smallest and push its successor. O(N log k). Merging the lists pairwise in rounds gives the same bound.","If either list is empty return the other. Otherwise take the smaller head and set its next to the merge of the remainder. It uses O(n + m) call stack.","On a tie it takes the node from the first list, so equal elements keep their original relative order."],
"maximum-depth-of-binary-tree":["Run a level-order traversal and count the levels.","A node with one child is not a leaf, so do not take the minimum with a missing child's 0. Use 1 + the minimum over existing children, or run BFS and stop at the first leaf.","Recursion depth equals the tree height. A heavily skewed tree with tens of thousands of nodes or more can exhaust the stack; use an iterative version there."],
"binary-tree-level-order-traversal":["Use the same BFS and reverse every second level before appending it.","Take the last value of each level.","removeFirst() on an Array shifts every remaining element, so each call is O(n) and the traversal becomes O(n²). Swap whole-level arrays, keep a head index, or use Deque."],
"number-of-islands":["Replace the recursion with a queue. Mark a cell when it is enqueued, not when it is dequeued, so it is never queued twice.","Treat each land cell as a node. Union each land cell with its right and down land neighbours. The answer is the number of land cells minus the number of successful unions.","Have the flood fill return how many cells it sank and keep the maximum."],
"climbing-stairs":["ways(n) = ways(n − 1) + ways(n − 2) + ways(n − 3). Roll three variables instead of two.","Let dp[i] be the cheapest cost to stand on step i: dp[i] = cost[i] + min(dp[i − 1], dp[i − 2]). The answer is the smaller of the last two.","It recomputes the same sub-problems again and again; the call tree has roughly 1.6ⁿ nodes. Memoising each result makes it O(n)."],
"coin-change":["Set dp[0] = 1. Loop over coins on the outside and amounts on the inside, adding dp[a − coin] to dp[a]. Coins outside counts combinations rather than orderings.","For each amount also store the coin that produced the best value. Walk back from the target subtracting the stored coin each time.","It works for so-called canonical systems such as 1, 5, 10, 25. There is no simple general test, so use DP unless the system is known to be canonical; [1, 3, 4] with amount 6 is a counter-example."],
"merge-intervals":["Copy every interval that ends before the new one starts. Merge all that overlap it by taking the smallest start and largest end. Then copy the rest. O(n).","Sort starts and ends separately and sweep, or keep a min-heap of end times. The answer is the largest number of meetings in progress at once. O(n log n).","Sort by end. Keep an interval when its start is not before the end of the last one kept. The removals are the total minus the number kept."],
"top-k-frequent-elements":["Count, then keep a min-heap of size k ordered by frequency: O(n log k) time and O(k) for the heap. The bucket method is O(n) but allocates n + 1 buckets.","Keep counts in a dictionary and recompute the top k on demand, or maintain an ordered structure. For very large streams use an approximate method such as Space-Saving or a Count-Min Sketch.","Sort by frequency descending and then by value ascending, or sort the values inside each bucket."],
"contains-duplicate":["Keep a set holding only the last k values. Before inserting index i, remove nums[i − k − 1] once the window is full. A dictionary of last-seen index also works.","Sort in place and compare neighbours. O(n log n) time, and it changes the input order.","insert returns whether the value was new, so one hash lookup does the work of contains followed by insert."],
"valid-palindrome":["Use two String.Index values. Advance or retreat past characters that are not letters or digits, then compare the lowercased characters. O(1) extra space.","On the first mismatch, check whether the remainder is a palindrome after skipping the left character or after skipping the right one.","A Character is a whole grapheme cluster, isLetter and isNumber accept non-ASCII characters, and case mapping can change the number of characters in some scripts. For ASCII input none of this matters; say which you assume."],
"two-sum-ii-input-array-is-sorted":["Fix one index and run the two-pointer search on the part to its right. O(n²) overall; skip equal neighbours to avoid repeated triples.","Use the dictionary method in O(n) time and O(n) space, or sort first in O(n log n), keeping the original indices if they are needed.","It needs no extra memory and no hashing, and it uses the sorted order that the input already guarantees."],
"linked-list-cycle":["After the two pointers meet, move one back to the head and advance both one step at a time. They meet again at the first node of the cycle, because the distance from the head to that node equals the distance from the meeting point to it, modulo the cycle length.","From the meeting point, keep one pointer still and step the other until it returns, counting the steps.","=== asks whether two references are the same object. Two different nodes may hold equal values, and a class is not Equatable unless you make it so."],
"subarray-sum-equals-k":["It stands for the empty prefix. Without it, runs that start at index 0, where the running sum itself equals k, would not be counted.","Store only the first index at which each prefix sum appears, starting with [0: −1]. The longest run ending at i has length i − firstIndex[sum − k].","A sliding window then works in O(1) space, because adding an element always increases the sum and removing one always decreases it."],
"daily-temperatures":["Loop over 2n positions using index i % n so that every element also sees the elements before it. Push indices only during the first pass.","The answer needs the distance between two days. An index gives both the position and, through the array, the value; a value alone gives neither position nor distance.","Go from right to left keeping a stack of candidate warmer days. Pop every candidate that is not warmer than today; if one remains, the answer is its index minus today's."],
"subsets":["Sort the input. Inside the loop, skip nums[i] when i > start and it equals nums[i − 1], so equal values are not chosen twice at the same depth.","Record the path only when it has k elements and stop going deeper. Prune when too few elements remain to reach size k.","Array is a value type. Appending path stores its current contents; later changes to path do not affect the stored copy."],
"single-number":["Count the set bits at each bit position modulo 3; the remainders form the answer. O(n) time, O(1) space.","XOR everything to get a ^ b. Pick any set bit of that result, split the numbers by whether they have that bit, and XOR each group separately.","XOR is commutative and associative, so the values can be regrouped into pairs that cancel no matter where they sit."],
"house-robber":["The first and last houses are now neighbours. Solve the row without the first house and the row without the last house, and take the better. Handle a single house separately.","Keep the full dp array. Walk back from the end: if dp[i] differs from dp[i − 1], house i was taken, so jump to i − 2; otherwise step to i − 1.","Do a post-order DFS that returns two values per node: the best total if the node is taken and the best if it is not."],
"number-of-provinces":["Attach the smaller tree under the larger one. Together with path compression this keeps trees almost flat, so each operation is near-constant amortised time.","Keep a visited array. For each unvisited city, add one to the count and DFS through every city its row connects to. O(n²).","That is the natural use of Union Find: union each connection as it arrives, decrement the count when the two leaders differ, and report the count."],
"sliding-window-maximum":["Keep the deque increasing instead: remove values from the back while they are greater than or equal to the new value.","An index tells you when the front has left the window, and the value is still available through the array.","When O(n log n) is acceptable and simplicity matters. Push (value, index) pairs and discard expired tops lazily before reading the maximum."],
"implement-trie-prefix-tree":["At a wildcard, try every child recursively; at a normal character follow the single matching child. The worst case visits many nodes.","Walk to the last node and clear its isWord flag. Optionally walk back up, removing nodes that have no children and are not word ends.","A fixed array of 26 is fast and predictable for lowercase a–z but wastes memory in sparse nodes. A dictionary handles any Character and saves memory when nodes are sparse, at the cost of hashing."],
"sort-an-array":["Merge sort: O(n log n) always, stable, O(n) extra space. Quicksort: O(n log n) on average, O(n²) worst case, in place, usually fastest in practice, not stable. Heapsort: O(n log n) worst case, in place, not stable, weaker cache behaviour.","Use bottom-up merge sort: merge runs of length 1, 2, 4 and so on by relinking nodes, which needs no recursion stack.","Stable means equal elements keep their original order, which matters when sorting records by one key after another. <= takes from the left half on ties, which preserves that order."]

const QA_PATTERN = {
"Two Pointers":["With sorted input, the element at the pointer fails even with the most favourable partner still available, so it cannot be part of any answer.","Sort first. Skip the fixed element when it equals the previous one, and after each hit move both inner pointers past equal values."],
"Sliding Window":["When adding an element does not move the window's property in one direction, for example sums with negative numbers, or when the answer need not be contiguous. Prefix sums with a dictionary usually take over.","Fixed size: each step adds one element and removes one, with no inner loop. Variable size: grow on the right and shrink on the left with a while loop until the rule holds again."],
"Fast/Slow Pointers":["After they meet, move one pointer to the head and advance both one step at a time; they meet at the cycle's first node.","Inside the cycle the gap between them shrinks by exactly one node per round, so it must reach zero; the fast pointer cannot jump over the slow one."],
"Prefix Sum":["A run ending at j sums to k exactly when an earlier prefix equals prefix(j) − k. Keep a dictionary of prefix-sum counts, starting with [0: 1], and add the matching count at each step.","Build pre[r + 1][c + 1] = cell + above + left − diagonal. Any rectangle's sum is then four lookups combined by inclusion and exclusion."],
"Hashing":["It provides hash(into:) and ==, and equal values always produce equal hashes. Structs and enums whose members are Hashable get this synthesised.","When you need order, ranges or nearest-value queries, when memory is tight, when the data is small and static, or when you need worst-case guarantees."],
"Binary Search":["Use a half-open range: lo = 0, hi = n. While lo < hi, test mid; if true set hi = mid, else lo = mid + 1. lo is the first true, or n if there is none.","Find a yes/no test over candidate answers that flips exactly once, then binary search the candidate range for the first value that passes."],
"Monotonic Stack":["Each element is pushed once and popped at most once, so there are at most 2n stack operations in total.","Ask which stored elements become useless when a new one arrives. For next greater, pop smaller values and keep the stack decreasing; for next smaller, pop larger values and keep it increasing."],
"Monotonic Queue":["The index tells you when the front has left the window; the value can always be read from the array.","Import DequeModule from swift-collections and use append, popLast and popFirst, which are all O(1), in place of the array plus head index."],
"BFS":["BFS orders nodes by number of edges. With weights, a path with more edges can be cheaper, so use Dijkstra for non-negative weights.","Put every source in the queue at distance 0 before starting. Each node then receives its distance to the nearest source in one pass."],
"DFS":["Use an explicit stack: push the start, then repeatedly pop, visit, and push unvisited neighbours. Post-order needs a visited flag per stack entry or a second stack.","Pre-order when the parent must be handled before its children, such as copying a tree. In-order for sorted output from a BST. Post-order when a node needs its children's results, such as height."],
"Backtracking":["Sort the input and skip a value that equals the previous one at the same depth.","O(n · 2ⁿ): there are 2ⁿ subsets and copying each one costs up to n."],
"Greedy":["Coins [1, 3, 4] and amount 6: greedy takes 4 + 1 + 1 (three coins) but 3 + 3 (two coins) is optimal.","A proof technique: take any optimal solution, show that swapping its first non-greedy choice for the greedy one never makes it worse, and repeat until it matches the greedy solution."],
"Dynamic Programming":["Top-down (memoised recursion) computes only the states it needs and is natural to write, but risks deep recursion. Bottom-up is iterative, avoids recursion and makes space reduction easy, but you must get the order right.","If a state depends only on the previous row or the previous few entries, keep just those in rolling variables or two arrays."],
"Heap / Top K":["The root is the weakest of the k items kept, so a new item only needs comparing with the root, and the weakest is evicted in O(log k).","A heap is O(n log k), works on streams and needs O(k) memory. Quickselect is O(n) on average but O(n²) in the worst case, and needs all the data in memory."],
"Graph Traversal":["If fewer than n nodes are output, the remaining nodes all still have incoming edges, which is only possible if they lie on or behind a cycle.","A list uses O(V + E) memory and suits sparse graphs. A matrix uses O(V²) memory but answers 'is there an edge' in O(1), which suits dense graphs."],
"Union Find":["Path compression flattens the tree during find. Union by size keeps trees shallow when merging. Together they give near-constant amortised time per operation.","For a fixed graph both are linear and DFS is simpler. Union Find is better when edges arrive over time with connectivity queries in between. It cannot remove edges."],
"Trie":["A sorted array finds a prefix range in O(L log n), is compact and cache-friendly, but inserting is O(n). A trie does lookup and insert in O(L) and uses more memory.","Clear the end-of-word flag on the last node, then optionally remove nodes on the way back up that have no children and end no word."],
"Bit Manipulation":["Subtracting 1 turns the lowest set bit to 0 and the zeros below it to 1. ANDing with the original clears that bit and leaves the higher bits unchanged.","Loop mask from 0 to 2ⁿ − 1; element i is in the subset when bit i of mask is set."],
"Intervals":["Sort by start for merging and inserting. Sort by end when choosing the most non-overlapping intervals, because finishing earliest leaves the most room.","Sweep: +1 at each start and −1 at each end in sorted order, tracking the running maximum. Decide whether an end at the same time as a start counts as overlap."],
"Divide and Conquer":["T(n) = 2T(n/2) + O(n). There are log₂ n levels and each level does O(n) work in total.","Merge sort is stable and always O(n log n) but needs O(n) extra space. Quicksort is in place and usually faster in practice but has an O(n²) worst case and is not stable."]

const QA_SECTIONS = ["DSA fundamentals", "Patterns and problems", "Interview skills", "Swift language"];
const QA_ALL = () => [
  ...QA_DSA.map(x => ({sec: x[0].startsWith("DSA") ? QA_SECTIONS[0] : QA_SECTIONS[2], topic:x[0].replace(/^(DSA|Interview) · /, ""), source: x[0].startsWith("DSA") ? "DSA fundamentals" : "Interview skills", q:x[1], a:x[2]})),
  ...PATTERNS.flatMap(P => P[7].map((q, k) => ({sec:QA_SECTIONS[1], topic:P[0], source:"Pattern: " + P[0], q, a:(QA_PATTERN[P[0]] || [])[k]}))),
  ...Object.keys(LESSONS).flatMap(id => { const p = BY_ID["lc-" + LESSONS[id].lc]; return LESSONS[id].followups.map((q, k) => ({sec:QA_SECTIONS[1], topic:p.patterns[0], source:p.title, pid:p.problemId, q, a:(QA_LESSON[id] || [])[k]})); }),
  ...QA_SWIFT.map(x => ({sec:QA_SECTIONS[3], topic:x[0].replace(/^Swift · /, ""), source:"Swift language", q:x[1], a:x[2]}))];
function drawQA() { const f = store.qf || {}, s = (f.q || "").toLowerCase().trim(), all = QA_ALL(), rows = all.filter(x => (!f.sec || x.sec === f.sec) && (!s || (x.q + " " + x.a + " " + x.source + " " + x.topic).toLowerCase().includes(s)));
  $("#qa-count").textContent = `${rows.length} of ${all.length} questions`;
  $("#qa-list").innerHTML = QA_SECTIONS.map(sec => { const inSec = rows.filter(x => x.sec === sec); if (!inSec.length) return ""; const groups = new Map(); inSec.forEach(x => groups.set(x.topic, (groups.get(x.topic) || []).concat([x]))); const topics = sec === QA_SECTIONS[1] ? [...groups.keys()].sort() : [...groups.keys()];
    return `<div class="stack" style="gap:12px"><div class="row" style="justify-content:space-between;align-items:baseline"><h2>${esc(sec)}</h2><span class="small muted">${inSec.length} questions · ${topics.length} topics</span></div>${topics.map(t => `<section class="panel"><div class="row" style="justify-content:space-between"><h3>${esc(t)}</h3><span class="small muted">${groups.get(t).length}</span></div><div class="stack">${groups.get(t).map(x => `<details class="qa"><summary>${esc(x.q)}</summary><p>${esc(x.a || "No answer written yet.")}</p>${x.pid ? `<p class="small muted">From the lesson <button class="ghost" data-open="${x.pid}" style="padding:0;color:var(--accent)">${esc(x.source)}</button></p>` : ""}</details>`).join("")}</div></section>`).join("")}</div>`; }).join("") || '<p class="muted">No question matches. Clear the search or choose All sections.</p>'; }
function viewQA() { const f = store.qf = store.qf || {}, all = QA_ALL();
  $("#view").innerHTML = `<div class="stack"><h1>Interview questions and answers</h1><p class="muted">Every interview question in this academy in one place, each with a short answer: ${all.length} questions. Click a question to see its answer.</p></div>
  <div class="stats">${QA_SECTIONS.map(sec => `<div class="stat"><b>${all.filter(x => x.sec === sec).length}</b><span>${esc(sec)}</span></div>`).join("")}</div>
  <div class="notice">The answers were written for this academy and describe approaches in words. They are not compiled code and have not been reviewed by a second person. Where a lesson exists, the Swift in that lesson is the validated reference.</div>
  <section class="panel"><div class="filters"><label>Search questions and answers<input type="search" id="qa-q" placeholder="e.g. cycle, heap, stable" value="${esc(f.q || "")}"></label><label>Section<select id="qa-topic">${opt("", "All sections", f.sec || "")}${QA_SECTIONS.map(v => opt(v, v, f.sec)).join("")}</select></label></div>
   <div class="row" style="justify-content:space-between"><span class="small muted" id="qa-count"></span><span class="row"><button id="qa-open">Show all answers</button><button id="qa-close">Hide all answers</button></span></div></section>
  <div class="stack" id="qa-list" style="gap:18px"></div>`;
  $("#qa-q").oninput = e => { f.q = e.target.value; save(); drawQA(); }; $("#qa-topic").onchange = e => { f.sec = e.target.value; save(); drawQA(); };
  $("#qa-open").onclick = () => document.querySelectorAll("#qa-list details").forEach(d => d.open = true); $("#qa-close").onclick = () => document.querySelectorAll("#qa-list details").forEach(d => d.open = false); drawQA(); }
Object.assign(QA_LESSON, {
"course-schedule":["Append each course to a list at the moment it is taken. If the list ends with every course it is a valid order; otherwise there is a cycle and no order exists.","Mark each node as unvisited, in progress or finished. Reaching an in-progress node means a cycle. Appending nodes as they finish and reversing the list gives a valid order.","Process the ready courses one whole layer at a time, like BFS levels. The number of layers is the minimum number of terms; it equals the longest chain of prerequisites."],
"network-delay-time":["Push (time, node) pairs into a min-heap and pop the smallest, skipping entries whose time is worse than the recorded one. The cost becomes O((V + E) log V), which is better on sparse graphs. Swift needs a hand-written heap or swift-collections.","Dijkstra is no longer correct, because a settled time could later be improved. Use Bellman–Ford, which relaxes every link V − 1 times in O(V · E) and can detect a negative cycle.","Record for each node the node it was last improved from. Follow those predecessors back from the target to the source and reverse the list."],
"min-cost-to-connect-all-points":["Generate every pair as an edge with its cost, sort the edges, and add each one whose endpoints are in different groups according to Union Find, until n − 1 edges are added.","When the graph is sparse or the edges are already given as a list, since its cost is O(E log E). On a dense graph such as this one, E is about n², so array-based Prim at O(n²) is faster.","Each round already has to look at every outside point to update its best value, so finding the minimum in the same O(n) scan adds nothing. A heap helps only when there are far fewer edges than n²."],
"validate-binary-search-tree":["A node can be on the correct side of its parent and still break the rule for a grandparent or higher ancestor. In [5, 4, 6, null, null, 3, 7] the 3 is a valid left child of 6 but lies in the right subtree of 5.","Traverse left, node, right while remembering the previous value. The tree is valid exactly when each value is strictly greater than the previous one.","Loosen the comparison on that side only, for example allow node.val equal to the lower bound for the right subtree, and state the convention clearly because definitions differ."],
"kth-largest-element-in-an-array":["Partition around a pivot as in quicksort, then continue only in the side that contains position n − k. O(n) on average and O(1) extra space, but O(n²) in the worst case, it reorders the array, and it needs all the data up front.","With the heap stored in an array from index 0, the children of i are at 2i + 1 and 2i + 2 and the parent is at (i − 1) / 2. Sift up swaps with the parent while smaller; sift down swaps with the smaller child while larger.","The heap approach works unchanged, since it only keeps k values. Quickselect and sorting do not apply because the data never ends."],
"longest-increasing-subsequence":["Keep an array where entry i is the smallest tail value of any increasing subsequence of length i + 1. For each number, binary-search the first entry that is not smaller and overwrite it, or append if there is none. The array's length is the answer.","Alongside dp, store for each index the previous index that gave its best value. Start at the index with the largest dp and follow the stored links backwards.","Keep a second array of counts. When dp[j] + 1 beats dp[i], copy count[j]; when it ties, add count[j]. Sum the counts of all indices whose dp equals the maximum."],
"longest-common-subsequence":["Walk back from the bottom-right cell. If the characters match, take that character and move diagonally. Otherwise move to whichever neighbour, up or left, holds the larger value. Reverse what you collected.","Each row depends only on the row above, so keep two rows, or one row plus a saved diagonal value. Put the shorter string on the column axis.","Edit distance counts the fewest insertions, deletions and replacements to turn one string into the other. Its table takes a minimum over three operations instead of a maximum over two, and its first row and column are 0, 1, 2 and so on rather than zeros."],
"partition-equal-subset-sum":["Scanning upward would let reach[s − x] already include x from earlier in the same pass, so x could be used more than once. That is the unbounded knapsack, which is a different problem.","Keep, for each reachable sum, the number that first made it reachable, or keep the full two-dimensional table. Walk back from target subtracting the recorded number each time.","Both are knapsack problems over sums. Coin Change lets each coin be used any number of times, so its inner loop runs upward and it minimises a count. Here each number is used at most once, so the loop runs downward and the table holds true or false."]

"cheapest-flights-within-k-stops":["Without it, a price improved earlier in the same round could be used by a later flight in that round, chaining two or more flights and breaking the 'at most r flights after round r' guarantee.","Run V − 1 rounds, then one more. If any distance still improves in the extra round, a negative cycle is reachable from the source.","Yes, if the state is (city, flights used) rather than the city alone, so that a dearer route with fewer flights is not discarded. The heap then holds (cost, city, flights) entries."],
"insert-into-a-binary-search-tree":["If the node is nil return a new node. Otherwise assign the result of inserting into the left or right child back to that child, and return the node. It uses O(h) call stack.","They store extra information per node, such as a height or a colour, and after each insert or delete they perform rotations that restore a balance rule. That keeps the height O(log n).","Pick one convention and apply it everywhere, for example send equal values to the right subtree, or store a count in the node instead of adding a second node."],
"delete-node-in-a-bst":["Yes. The largest value in the left subtree works the same way: copy it into the node and delete it from the left subtree. Alternating between the two can help keep the tree from leaning.","The successor is the smallest value larger than the deleted key. Everything in the left subtree is smaller than it and everything remaining in the right subtree is larger, so the ordering still holds at that node.","Walk down keeping a reference to the parent and which side you came from. Handle the zero and one child cases by relinking the parent. For two children, find the successor and its parent, copy the value, and unlink the successor."]
