const SWIFT = {"two-sum": "func twoSum(_ nums: [Int], _ target: Int) -> [Int] {\n    var seen: [Int: Int] = [:]          // value -> index\n    for (i, x) in nums.enumerated() {\n        let need = target - x\n        if let j = seen[need] { return [j, i] }\n        seen[x] = i\n    }\n    return []\n}", "two-sum-brute": "func twoSumBrute(_ nums: [Int], _ target: Int) -> [Int] {\n    for i in 0..<nums.count {\n        for j in (i + 1)..<nums.count where nums[i] + nums[j] == target {\n            return [i, j]\n        }\n    }\n    return []\n}", "valid-parentheses": "func isValid(_ s: String) -> Bool {\n    let pairs: [Character: Character] = [\")\": \"(\", \"]\": \"[\", \"}\": \"{\"]\n    var stack: [Character] = []\n    for ch in s {\n        if let open = pairs[ch] {\n            if stack.popLast() != open { return false }\n        } else {\n            stack.append(ch)\n        }\n    }\n    return stack.isEmpty\n}", "best-time-to-buy-and-sell-stock": "func maxProfit(_ prices: [Int]) -> Int {\n    var minPrice = Int.max\n    var best = 0\n    for p in prices {\n        minPrice = min(minPrice, p)\n        best = max(best, p - minPrice)\n    }\n    return best\n}", "binary-search": "func search(_ nums: [Int], _ target: Int) -> Int {\n    var lo = 0, hi = nums.count - 1\n    while lo <= hi {\n        let mid = lo + (hi - lo) / 2\n        if nums[mid] == target { return mid }\n        if nums[mid] < target { lo = mid + 1 } else { hi = mid - 1 }\n    }\n    return -1\n}", "maximum-subarray": "func maxSubArray(_ nums: [Int]) -> Int {\n    var cur = nums[0], best = nums[0]\n    for x in nums.dropFirst() {\n        cur = max(x, cur + x)\n        best = max(best, cur)\n    }\n    return best\n}", "longest-substring-without-repeating-characters": "func lengthOfLongestSubstring(_ s: String) -> Int {\n    let chars = Array(s)\n    var last: [Character: Int] = [:]    // char -> last index seen\n    var left = 0, best = 0\n    for (right, ch) in chars.enumerated() {\n        if let k = last[ch], k >= left { left = k + 1 }\n        last[ch] = right\n        best = max(best, right - left + 1)\n    }\n    return best\n}", "reverse-linked-list": "func reverseList(_ head: ListNode?) -> ListNode? {\n    var prev: ListNode? = nil\n    var cur = head\n    while let node = cur {\n        let next = node.next\n        node.next = prev\n        prev = node\n        cur = next\n    }\n    return prev\n}", "merge-two-sorted-lists": "func mergeTwoLists(_ l1: ListNode?, _ l2: ListNode?) -> ListNode? {\n    let dummy = ListNode(0)\n    var tail = dummy\n    var a = l1, b = l2\n    while let x = a, let y = b {\n        if x.val <= y.val { tail.next = x; a = x.next }\n        else { tail.next = y; b = y.next }\n        tail = tail.next!\n    }\n    tail.next = a ?? b\n    return dummy.next\n}", "maximum-depth-of-binary-tree": "func maxDepth(_ root: TreeNode?) -> Int {\n    guard let node = root else { return 0 }\n    let l = maxDepth(node.left)\n    let r = maxDepth(node.right)\n    return 1 + max(l, r)\n}", "binary-tree-level-order-traversal": "func levelOrder(_ root: TreeNode?) -> [[Int]] {\n    guard let root = root else { return [] }\n    var result: [[Int]] = []\n    var queue = [root]\n    while !queue.isEmpty {\n        var level: [Int] = []\n        var nextQueue: [TreeNode] = []\n        for node in queue {\n            level.append(node.val)\n            if let l = node.left { nextQueue.append(l) }\n            if let r = node.right { nextQueue.append(r) }\n        }\n        result.append(level)\n        queue = nextQueue\n    }\n    return result\n}", "number-of-islands": "func numIslands(_ grid: [[Character]]) -> Int {\n    var g = grid\n    let rows = g.count, cols = g.first?.count ?? 0\n    func sink(_ r: Int, _ c: Int) {\n        guard r >= 0, r < rows, c >= 0, c < cols, g[r][c] == \"1\" else { return }\n        g[r][c] = \"0\"\n        sink(r + 1, c); sink(r - 1, c); sink(r, c + 1); sink(r, c - 1)\n    }\n    var count = 0\n    for r in 0..<rows {\n        for c in 0..<cols where g[r][c] == \"1\" {\n            count += 1\n            sink(r, c)\n        }\n    }\n    return count\n}", "climbing-stairs": "func climbStairs(_ n: Int) -> Int {\n    var a = 1, b = 1                    // ways(0), ways(1)\n    for _ in 0..<n {\n        (a, b) = (b, a + b)\n    }\n    return a\n}", "coin-change": "func coinChange(_ coins: [Int], _ amount: Int) -> Int {\n    var dp = [Int](repeating: amount + 1, count: amount + 1)\n    dp[0] = 0\n    for a in stride(from: 1, through: amount, by: 1) {\n        for coin in coins where coin <= a {\n            dp[a] = min(dp[a], dp[a - coin] + 1)\n        }\n    }\n    return dp[amount] > amount ? -1 : dp[amount]\n}", "merge-intervals": "func merge(_ intervals: [[Int]]) -> [[Int]] {\n    let sorted = intervals.sorted { $0[0] < $1[0] }\n    var out: [[Int]] = []\n    for iv in sorted {\n        if let last = out.last, iv[0] <= last[1] {\n            out[out.count - 1][1] = max(last[1], iv[1])\n        } else {\n            out.append(iv)\n        }\n    }\n    return out\n}", "top-k-frequent-elements": "func topKFrequent(_ nums: [Int], _ k: Int) -> [Int] {\n    var freq: [Int: Int] = [:]\n    for x in nums { freq[x, default: 0] += 1 }\n    var buckets = [[Int]](repeating: [], count: nums.count + 1)\n    for (x, f) in freq { buckets[f].append(x) }\n    var out: [Int] = []\n    for f in stride(from: nums.count, to: 0, by: -1) {\n        for x in buckets[f] where out.count < k { out.append(x) }\n    }\n    return out\n}", "adapter-leetcode": "// LeetCode calls a method on `Solution`; no input parsing needed.\nclass Solution {\n    func twoSum(_ nums: [Int], _ target: Int) -> [Int] {\n        var seen: [Int: Int] = [:]\n        for (i, x) in nums.enumerated() {\n            if let j = seen[target - x] { return [j, i] }\n            seen[x] = i\n        }\n        return []\n    }\n}", "adapter-hackerrank": "// HackerRank-style programs read stdin and print to stdout.\n// Assumed input here: line 1 = target, line 2 = space-separated numbers.\nfunc runFromStdin() {\n    guard let t = readLine().flatMap({ Int($0) }),\n          let line = readLine() else { return }\n    let nums = line.split(separator: \" \").compactMap { Int($0) }\n    print(twoSum(nums, t).map(String.init).joined(separator: \" \"))\n}", "contains-duplicate": "func containsDuplicate(_ nums: [Int]) -> Bool {\n    var seen = Set<Int>()\n    for x in nums {\n        if !seen.insert(x).inserted { return true }\n    }\n    return false\n}", "valid-palindrome": "func isPalindrome(_ s: String) -> Bool {\n    let chars = Array(s.lowercased()).filter { $0.isLetter || $0.isNumber }\n    var l = 0, r = chars.count - 1\n    while l < r {\n        if chars[l] != chars[r] { return false }\n        l += 1; r -= 1\n    }\n    return true\n}", "two-sum-ii-input-array-is-sorted": "func twoSumSorted(_ numbers: [Int], _ target: Int) -> [Int] {\n    var l = 0, r = numbers.count - 1\n    while l < r {\n        let sum = numbers[l] + numbers[r]\n        if sum == target { return [l + 1, r + 1] }   // answer is 1-indexed\n        if sum < target { l += 1 } else { r -= 1 }\n    }\n    return []\n}", "linked-list-cycle": "func hasCycle(_ head: CycleNode?) -> Bool {\n    var slow = head, fast = head\n    while let next = fast?.next?.next {\n        slow = slow?.next\n        fast = next\n        if slow === fast { return true }\n    }\n    return false\n}", "subarray-sum-equals-k": "func subarraySum(_ nums: [Int], _ k: Int) -> Int {\n    var count = 0, sum = 0\n    var seen: [Int: Int] = [0: 1]       // prefix sum -> times seen\n    for x in nums {\n        sum += x\n        count += seen[sum - k, default: 0]\n        seen[sum, default: 0] += 1\n    }\n    return count\n}", "daily-temperatures": "func dailyTemperatures(_ temps: [Int]) -> [Int] {\n    var answer = [Int](repeating: 0, count: temps.count)\n    var stack: [Int] = []               // indices of days still waiting\n    for (i, t) in temps.enumerated() {\n        while let top = stack.last, temps[top] < t {\n            answer[stack.removeLast()] = i - top\n        }\n        stack.append(i)\n    }\n    return answer\n}", "subsets": "func subsets(_ nums: [Int]) -> [[Int]] {\n    var result: [[Int]] = []\n    var path: [Int] = []\n    func explore(_ start: Int) {\n        result.append(path)\n        for i in start..<nums.count {\n            path.append(nums[i])\n            explore(i + 1)\n            path.removeLast()\n        }\n    }\n    explore(0)\n    return result\n}", "single-number": "func singleNumber(_ nums: [Int]) -> Int {\n    var acc = 0\n    for x in nums {\n        acc ^= x\n    }\n    return acc\n}", "house-robber": "func rob(_ nums: [Int]) -> Int {\n    var prev = 0, cur = 0               // best up to i-2, best up to i-1\n    for x in nums {\n        (prev, cur) = (cur, max(cur, prev + x))\n    }\n    return cur\n}", "number-of-provinces": "func findCircleNum(_ isConnected: [[Int]]) -> Int {\n    let n = isConnected.count\n    var parent = Array(0..<n)\n    func find(_ x: Int) -> Int {\n        var x = x\n        while parent[x] != x {\n            parent[x] = parent[parent[x]]   // path halving\n            x = parent[x]\n        }\n        return x\n    }\n    var count = n\n    for i in 0..<n {\n        for j in (i + 1)..<n where isConnected[i][j] == 1 {\n            let a = find(i), b = find(j)\n            if a != b { parent[a] = b; count -= 1 }\n        }\n    }\n    return count\n}", "sliding-window-maximum": "func maxSlidingWindow(_ nums: [Int], _ k: Int) -> [Int] {\n    var deque: [Int] = [], head = 0     // indices; values decrease from head\n    var out: [Int] = []\n    for i in nums.indices {\n        while deque.count > head, nums[deque.last!] <= nums[i] {\n            deque.removeLast()\n        }\n        deque.append(i)\n        if deque[head] <= i - k { head += 1 }\n        if i >= k - 1 { out.append(nums[deque[head]]) }\n    }\n    return out\n}", "implement-trie-prefix-tree": "final class Trie {\n    private final class Node {\n        var children: [Character: Node] = [:]\n        var isWord = false\n    }\n    private let root = Node()\n    func insert(_ word: String) {\n        var node = root\n        for ch in word {\n            if node.children[ch] == nil { node.children[ch] = Node() }\n            node = node.children[ch]!\n        }\n        node.isWord = true\n    }\n    private func walk(_ text: String) -> Node? {\n        var node = root\n        for ch in text {\n            guard let next = node.children[ch] else { return nil }\n            node = next\n        }\n        return node\n    }\n    func search(_ word: String) -> Bool { walk(word)?.isWord ?? false }\n    func startsWith(_ prefix: String) -> Bool { walk(prefix) != nil }\n}", "sort-an-array": "func sortArray(_ nums: [Int]) -> [Int] {\n    guard nums.count > 1 else { return nums }\n    let mid = nums.count / 2\n    let left = sortArray(Array(nums[..<mid]))\n    let right = sortArray(Array(nums[mid...]))\n    var merged: [Int] = []\n    merged.reserveCapacity(nums.count)\n    var i = 0, j = 0\n    while i < left.count, j < right.count {\n        if left[i] <= right[j] { merged.append(left[i]); i += 1 }\n        else { merged.append(right[j]); j += 1 }\n    }\n    return merged + left[i...] + right[j...]\n}", "course-schedule": "func canFinish(_ numCourses: Int, _ prerequisites: [[Int]]) -> Bool {\n    var adj = [[Int]](repeating: [], count: numCourses)\n    var indegree = [Int](repeating: 0, count: numCourses)\n    for p in prerequisites {\n        adj[p[1]].append(p[0])          // p[1] must come before p[0]\n        indegree[p[0]] += 1\n    }\n    var ready = (0..<numCourses).filter { indegree[$0] == 0 }\n    var taken = 0\n    while let course = ready.popLast() {\n        taken += 1\n        for next in adj[course] {\n            indegree[next] -= 1\n            if indegree[next] == 0 { ready.append(next) }\n        }\n    }\n    return taken == numCourses\n}", "network-delay-time": "func networkDelayTime(_ times: [[Int]], _ n: Int, _ k: Int) -> Int {\n    var adj = [[(to: Int, w: Int)]](repeating: [], count: n + 1)\n    for t in times { adj[t[0]].append((t[1], t[2])) }\n    var dist = [Int](repeating: Int.max, count: n + 1)\n    var done = [Bool](repeating: false, count: n + 1)\n    dist[k] = 0\n    for _ in 0..<n {\n        var u = -1\n        for v in 1...n where !done[v] && dist[v] != Int.max {\n            if u == -1 || dist[v] < dist[u] { u = v }\n        }\n        if u == -1 { break }\n        done[u] = true\n        for e in adj[u] where dist[u] + e.w < dist[e.to] {\n            dist[e.to] = dist[u] + e.w\n        }\n    }\n    let worst = dist[1...].max()!\n    return worst == Int.max ? -1 : worst\n}", "min-cost-to-connect-all-points": "func minCostConnectPoints(_ points: [[Int]]) -> Int {\n    let n = points.count\n    var inTree = [Bool](repeating: false, count: n)\n    var best = [Int](repeating: Int.max, count: n)   // cheapest edge into the tree\n    var total = 0\n    if n > 0 { best[0] = 0 }\n    for _ in 0..<n {\n        var u = -1\n        for v in 0..<n where !inTree[v] {\n            if u == -1 || best[v] < best[u] { u = v }\n        }\n        inTree[u] = true\n        total += best[u]\n        for v in 0..<n where !inTree[v] {\n            let d = abs(points[u][0] - points[v][0]) + abs(points[u][1] - points[v][1])\n            best[v] = min(best[v], d)\n        }\n    }\n    return total\n}", "validate-binary-search-tree": "func isValidBST(_ root: TreeNode?) -> Bool {\n    func check(_ node: TreeNode?, _ low: Int?, _ high: Int?) -> Bool {\n        guard let node = node else { return true }\n        if let low = low, node.val <= low { return false }\n        if let high = high, node.val >= high { return false }\n        return check(node.left, low, node.val)\n            && check(node.right, node.val, high)\n    }\n    return check(root, nil, nil)\n}", "kth-largest-element-in-an-array": "func findKthLargest(_ nums: [Int], _ k: Int) -> Int {\n    var heap: [Int] = []                 // min-heap holding the k largest so far\n    func siftUp(_ start: Int) {\n        var i = start\n        while i > 0, heap[(i - 1) / 2] > heap[i] {\n            heap.swapAt((i - 1) / 2, i)\n            i = (i - 1) / 2\n        }\n    }\n    func siftDown() {\n        var i = 0\n        while true {\n            var m = i\n            for c in [2 * i + 1, 2 * i + 2] where c < heap.count && heap[c] < heap[m] { m = c }\n            if m == i { return }\n            heap.swapAt(i, m)\n            i = m\n        }\n    }\n    for x in nums {\n        if heap.count < k {\n            heap.append(x)\n            siftUp(heap.count - 1)\n        } else if x > heap[0] {\n            heap[0] = x\n            siftDown()\n        }\n    }\n    return heap[0]\n}", "longest-increasing-subsequence": "func lengthOfLIS(_ nums: [Int]) -> Int {\n    var dp = [Int](repeating: 1, count: nums.count)   // longest ending at i\n    for i in nums.indices {\n        for j in 0..<i where nums[j] < nums[i] {\n            dp[i] = max(dp[i], dp[j] + 1)\n        }\n    }\n    return dp.max() ?? 0\n}", "longest-common-subsequence": "func longestCommonSubsequence(_ text1: String, _ text2: String) -> Int {\n    let a = Array(text1), b = Array(text2)\n    var dp = [[Int]](repeating: [Int](repeating: 0, count: b.count + 1), count: a.count + 1)\n    for i in stride(from: 1, through: a.count, by: 1) {\n        for j in stride(from: 1, through: b.count, by: 1) {\n            if a[i - 1] == b[j - 1] {\n                dp[i][j] = dp[i - 1][j - 1] + 1\n            } else {\n                dp[i][j] = max(dp[i - 1][j], dp[i][j - 1])\n            }\n        }\n    }\n    return dp[a.count][b.count]\n}", "partition-equal-subset-sum": "func canPartition(_ nums: [Int]) -> Bool {\n    let total = nums.reduce(0, +)\n    if total % 2 != 0 { return false }\n    let target = total / 2\n    var reach = [Bool](repeating: false, count: target + 1)\n    reach[0] = true\n    for x in nums {\n        for s in stride(from: target, through: x, by: -1) where reach[s - x] {\n            reach[s] = true\n        }\n    }\n    return reach[target]\n}", "kth-largest-element-in-an-array--quickselect": "func findKthLargestQuick(_ nums: [Int], _ k: Int) -> Int {\n    var a = nums\n    let target = a.count - k            // its index in ascending order\n    var lo = 0, hi = a.count - 1\n    while true {\n        let pivot = a[hi]\n        var store = lo\n        for i in lo..<hi where a[i] < pivot {\n            a.swapAt(i, store)\n            store += 1\n        }\n        a.swapAt(store, hi)             // the pivot is now in its final place\n        if store == target { return a[store] }\n        if store < target { lo = store + 1 } else { hi = store - 1 }\n    }\n}", "min-cost-to-connect-all-points--kruskal": "func minCostConnectPointsKruskal(_ points: [[Int]]) -> Int {\n    let n = points.count\n    var edges: [(cost: Int, a: Int, b: Int)] = []\n    for a in 0..<n {\n        for b in (a + 1)..<n {\n            let cost = abs(points[a][0] - points[b][0]) + abs(points[a][1] - points[b][1])\n            edges.append((cost, a, b))\n        }\n    }\n    edges.sort { $0.cost < $1.cost }\n    var parent = Array(0..<n)\n    func find(_ x: Int) -> Int {\n        var x = x\n        while parent[x] != x { parent[x] = parent[parent[x]]; x = parent[x] }\n        return x\n    }\n    var total = 0, used = 0\n    for e in edges where used < n - 1 {\n        let ra = find(e.a), rb = find(e.b)\n        if ra != rb {\n            parent[ra] = rb\n            total += e.cost\n            used += 1\n        }\n    }\n    return total\n}", "cheapest-flights-within-k-stops": "func findCheapestPrice(_ n: Int, _ flights: [[Int]], _ src: Int, _ dst: Int, _ k: Int) -> Int {\n    var cost = [Int](repeating: Int.max, count: n)\n    cost[src] = 0\n    for _ in 0...k {                     // at most k stops = k + 1 flights\n        var next = cost                  // a round reads only the previous round\n        for f in flights where cost[f[0]] != Int.max {\n            next[f[1]] = min(next[f[1]], cost[f[0]] + f[2])\n        }\n        cost = next\n    }\n    return cost[dst] == Int.max ? -1 : cost[dst]\n}", "insert-into-a-binary-search-tree": "func insertIntoBST(_ root: TreeNode?, _ val: Int) -> TreeNode? {\n    guard let root = root else { return TreeNode(val) }\n    var node = root\n    while true {\n        if val < node.val {\n            guard let left = node.left else { node.left = TreeNode(val); break }\n            node = left\n        } else {\n            guard let right = node.right else { node.right = TreeNode(val); break }\n            node = right\n        }\n    }\n    return root\n}", "delete-node-in-a-bst": "func deleteNode(_ root: TreeNode?, _ key: Int) -> TreeNode? {\n    guard let root = root else { return nil }\n    if key < root.val {\n        root.left = deleteNode(root.left, key)\n    } else if key > root.val {\n        root.right = deleteNode(root.right, key)\n    } else {\n        guard let left = root.left else { return root.right }\n        guard let right = root.right else { return left }\n        var successor = right\n        while let next = successor.left { successor = next }\n        root.val = successor.val\n        root.right = deleteNode(right, successor.val)\n    }\n    return root\n}", "product-of-array-except-self": "func productExceptSelf(_ nums: [Int]) -> [Int] {\n    var out = [Int](repeating: 1, count: nums.count)\n    var prefix = 1\n    for i in nums.indices {\n        out[i] = prefix                 // product of everything left of i\n        prefix *= nums[i]\n    }\n    var suffix = 1\n    for i in nums.indices.reversed() {\n        out[i] *= suffix                // times everything right of i\n        suffix *= nums[i]\n    }\n    return out\n}", "container-with-most-water": "func maxArea(_ height: [Int]) -> Int {\n    var l = 0, r = height.count - 1\n    var best = 0\n    while l < r {\n        let area = (r - l) * min(height[l], height[r])\n        best = max(best, area)\n        if height[l] < height[r] { l += 1 } else { r -= 1 }\n    }\n    return best\n}", "group-anagrams": "func groupAnagrams(_ strs: [String]) -> [[String]] {\n    var groups: [String: [String]] = [:]    // sorted letters -> words\n    for word in strs {\n        let key = String(word.sorted())\n        groups[key, default: []].append(word)\n    }\n    return Array(groups.values)\n}", "min-stack": "struct MinStack {\n    private var items: [(val: Int, minSoFar: Int)] = []\n    mutating func push(_ val: Int) {\n        let m = min(val, items.last?.minSoFar ?? val)\n        items.append((val, m))\n    }\n    mutating func pop() { items.removeLast() }\n    func top() -> Int { items.last!.val }\n    func getMin() -> Int { items.last!.minSoFar }\n}", "search-in-rotated-sorted-array": "func searchRotated(_ nums: [Int], _ target: Int) -> Int {\n    var lo = 0, hi = nums.count - 1\n    while lo <= hi {\n        let mid = lo + (hi - lo) / 2\n        if nums[mid] == target { return mid }\n        if nums[lo] <= nums[mid] {          // left half is sorted\n            if nums[lo] <= target && target < nums[mid] { hi = mid - 1 } else { lo = mid + 1 }\n        } else {                            // right half is sorted\n            if nums[mid] < target && target <= nums[hi] { lo = mid + 1 } else { hi = mid - 1 }\n        }\n    }\n    return -1\n}", "rotting-oranges": "func orangesRotting(_ grid: [[Int]]) -> Int {\n    var g = grid\n    let rows = g.count, cols = g.first?.count ?? 0\n    var queue: [(Int, Int)] = []\n    var fresh = 0\n    for r in 0..<rows {\n        for c in 0..<cols {\n            if g[r][c] == 2 { queue.append((r, c)) }\n            if g[r][c] == 1 { fresh += 1 }\n        }\n    }\n    var minutes = 0\n    while fresh > 0, !queue.isEmpty {\n        var next: [(Int, Int)] = []\n        for (r, c) in queue {\n            for (dr, dc) in [(1, 0), (-1, 0), (0, 1), (0, -1)] {\n                let nr = r + dr, nc = c + dc\n                guard nr >= 0, nr < rows, nc >= 0, nc < cols, g[nr][nc] == 1 else { continue }\n                g[nr][nc] = 2\n                fresh -= 1\n                next.append((nr, nc))\n            }\n        }\n        queue = next\n        minutes += 1\n    }\n    return fresh == 0 ? minutes : -1\n}", "permutations": "func permute(_ nums: [Int]) -> [[Int]] {\n    var result: [[Int]] = []\n    var path: [Int] = []\n    var used = [Bool](repeating: false, count: nums.count)\n    func build() {\n        if path.count == nums.count { result.append(path); return }\n        for i in nums.indices where !used[i] {\n            used[i] = true\n            path.append(nums[i])\n            build()\n            path.removeLast()\n            used[i] = false\n        }\n    }\n    build()\n    return result\n}", "jump-game": "func canJump(_ nums: [Int]) -> Bool {\n    var farthest = 0\n    for (i, jump) in nums.enumerated() {\n        if i > farthest { return false }\n        farthest = max(farthest, i + jump)\n    }\n    return true\n}", "valid-anagram": "func isAnagram(_ s: String, _ t: String) -> Bool {\n    var counts: [Character: Int] = [:]\n    for ch in s { counts[ch, default: 0] += 1 }\n    for ch in t {\n        guard let c = counts[ch], c > 0 else { return false }\n        counts[ch] = c - 1\n    }\n    return counts.values.allSatisfy { $0 == 0 }\n}", "longest-consecutive-sequence": "func longestConsecutive(_ nums: [Int]) -> Int {\n    let set = Set(nums)\n    var best = 0\n    for x in set where !set.contains(x - 1) {    // x starts a run\n        var length = 1\n        while set.contains(x + length) { length += 1 }\n        best = max(best, length)\n    }\n    return best\n}", "3sum": "func threeSum(_ nums: [Int]) -> [[Int]] {\n    let a = nums.sorted()\n    var out: [[Int]] = []\n    for i in a.indices {\n        if i > 0 && a[i] == a[i - 1] { continue }\n        var l = i + 1, r = a.count - 1\n        while l < r {\n            let sum = a[i] + a[l] + a[r]\n            if sum < 0 { l += 1 }\n            else if sum > 0 { r -= 1 }\n            else {\n                out.append([a[i], a[l], a[r]])\n                l += 1; r -= 1\n                while l < r && a[l] == a[l - 1] { l += 1 }\n            }\n        }\n    }\n    return out\n}", "evaluate-reverse-polish-notation": "func evalRPN(_ tokens: [String]) -> Int {\n    var stack: [Int] = []\n    for token in tokens {\n        if let number = Int(token) {\n            stack.append(number)\n            continue\n        }\n        let b = stack.removeLast(), a = stack.removeLast()\n        switch token {\n        case \"+\": stack.append(a + b)\n        case \"-\": stack.append(a - b)\n        case \"*\": stack.append(a * b)\n        default: stack.append(a / b)     // Swift's / truncates toward zero\n        }\n    }\n    return stack[0]\n}", "middle-of-the-linked-list": "func middleNode(_ head: ListNode?) -> ListNode? {\n    var slow = head, fast = head\n    while let next = fast?.next {\n        slow = slow?.next\n        fast = next.next\n    }\n    return slow\n}", "invert-binary-tree": "func invertTree(_ root: TreeNode?) -> TreeNode? {\n    guard let node = root else { return nil }\n    let left = invertTree(node.left)\n    let right = invertTree(node.right)\n    node.left = right\n    node.right = left\n    return node\n}", "unique-paths": "func uniquePaths(_ m: Int, _ n: Int) -> Int {\n    var row = [Int](repeating: 1, count: n)   // one way along the top edge\n    for _ in 1..<m {\n        for c in 1..<n {\n            row[c] += row[c - 1]              // from above + from the left\n        }\n    }\n    return row[n - 1]\n}", "number-of-1-bits": "func hammingWeight(_ n: Int) -> Int {\n    var x = n, count = 0\n    while x != 0 {\n        x &= x - 1                  // clears the lowest set bit\n        count += 1\n    }\n    return count\n}", "trapping-rain-water": "func trap(_ height: [Int]) -> Int {\n    var l = 0, r = height.count - 1\n    var leftMax = 0, rightMax = 0, water = 0\n    while l < r {\n        if height[l] < height[r] {\n            leftMax = max(leftMax, height[l])\n            water += leftMax - height[l]\n            l += 1\n        } else {\n            rightMax = max(rightMax, height[r])\n            water += rightMax - height[r]\n            r -= 1\n        }\n    }\n    return water\n}", "remove-nth-node-from-end-of-list": "func removeNthFromEnd(_ head: ListNode?, _ n: Int) -> ListNode? {\n    let dummy = ListNode(0, head)\n    var lead: ListNode? = dummy, trail: ListNode? = dummy\n    for _ in 0..<n { lead = lead?.next }\n    while lead?.next != nil {\n        lead = lead?.next\n        trail = trail?.next\n    }\n    trail?.next = trail?.next?.next\n    return dummy.next\n}", "find-minimum-in-rotated-sorted-array": "func findMin(_ nums: [Int]) -> Int {\n    var lo = 0, hi = nums.count - 1\n    while lo < hi {\n        let mid = lo + (hi - lo) / 2\n        if nums[mid] > nums[hi] {\n            lo = mid + 1            // the minimum is right of mid\n        } else {\n            hi = mid                // mid could be the minimum\n        }\n    }\n    return nums[lo]\n}", "diameter-of-binary-tree": "func diameterOfBinaryTree(_ root: TreeNode?) -> Int {\n    var best = 0\n    func height(_ node: TreeNode?) -> Int {\n        guard let node = node else { return 0 }\n        let l = height(node.left)\n        let r = height(node.right)\n        best = max(best, l + r)     // longest path through this node\n        return 1 + max(l, r)\n    }\n    _ = height(root)\n    return best\n}", "combination-sum": "func combinationSum(_ candidates: [Int], _ target: Int) -> [[Int]] {\n    var result: [[Int]] = []\n    var path: [Int] = []\n    func explore(_ start: Int, _ remaining: Int) {\n        if remaining == 0 { result.append(path); return }\n        for i in start..<candidates.count where candidates[i] <= remaining {\n            path.append(candidates[i])\n            explore(i, remaining - candidates[i])   // i, not i + 1: reuse allowed\n            path.removeLast()\n        }\n    }\n    explore(0, target)\n    return result\n}", "word-break": "func wordBreak(_ s: String, _ wordDict: [String]) -> Bool {\n    let chars = Array(s)\n    let words = Set(wordDict)\n    var dp = [Bool](repeating: false, count: chars.count + 1)\n    dp[0] = true                    // the empty prefix can be built\n    for end in stride(from: 1, through: chars.count, by: 1) {\n        for start in 0..<end where dp[start] {\n            if words.contains(String(chars[start..<end])) {\n                dp[end] = true\n                break\n            }\n        }\n    }\n    return dp[chars.count]\n}", "maximum-product-subarray": "func maxProduct(_ nums: [Int]) -> Int {\n    var hi = nums[0], lo = nums[0], best = nums[0]\n    for x in nums.dropFirst() {\n        let candidates = [x, hi * x, lo * x]\n        hi = candidates.max()!\n        lo = candidates.min()!\n        best = max(best, hi)\n    }\n    return best\n}", "insert-interval": "func insert(_ intervals: [[Int]], _ newInterval: [Int]) -> [[Int]] {\n    var out: [[Int]] = []\n    var cur = newInterval\n    var i = 0\n    while i < intervals.count, intervals[i][1] < cur[0] {\n        out.append(intervals[i]); i += 1          // ends before cur starts\n    }\n    while i < intervals.count, intervals[i][0] <= cur[1] {\n        cur = [min(cur[0], intervals[i][0]), max(cur[1], intervals[i][1])]\n        i += 1                                    // overlaps: absorb it\n    }\n    out.append(cur)\n    out.append(contentsOf: intervals[i...])\n    return out\n}", "search-a-2d-matrix": "func searchMatrix(_ matrix: [[Int]], _ target: Int) -> Bool {\n    let rows = matrix.count, cols = matrix.first?.count ?? 0\n    var lo = 0, hi = rows * cols - 1\n    while lo <= hi {\n        let mid = lo + (hi - lo) / 2\n        let value = matrix[mid / cols][mid % cols]\n        if value == target { return true }\n        if value < target { lo = mid + 1 } else { hi = mid - 1 }\n    }\n    return false\n}", "koko-eating-bananas": "func minEatingSpeed(_ piles: [Int], _ h: Int) -> Int {\n    var lo = 1, hi = piles.max() ?? 1\n    while lo < hi {\n        let speed = lo + (hi - lo) / 2\n        let hours = piles.reduce(0) { $0 + ($1 + speed - 1) / speed }\n        if hours <= h {\n            hi = speed              // fast enough: try slower\n        } else {\n            lo = speed + 1          // too slow\n        }\n    }\n    return lo\n}", "implement-queue-using-stacks": "struct MyQueue {\n    private var inbox: [Int] = [], outbox: [Int] = []\n    mutating func push(_ x: Int) { inbox.append(x) }\n    private mutating func refill() {\n        if outbox.isEmpty {\n            while let x = inbox.popLast() { outbox.append(x) }\n        }\n    }\n    mutating func pop() -> Int { refill(); return outbox.removeLast() }\n    mutating func peek() -> Int { refill(); return outbox.last! }\n    var empty: Bool { inbox.isEmpty && outbox.isEmpty }\n}", "balanced-binary-tree": "func isBalanced(_ root: TreeNode?) -> Bool {\n    func height(_ node: TreeNode?) -> Int? {     // nil means unbalanced\n        guard let node = node else { return 0 }\n        guard let l = height(node.left), let r = height(node.right) else { return nil }\n        if abs(l - r) > 1 { return nil }\n        return 1 + max(l, r)\n    }\n    return height(root) != nil\n}", "redundant-connection": "func findRedundantConnection(_ edges: [[Int]]) -> [Int] {\n    var parent = Array(0...edges.count)\n    func find(_ x: Int) -> Int {\n        var x = x\n        while parent[x] != x {\n            parent[x] = parent[parent[x]]\n            x = parent[x]\n        }\n        return x\n    }\n    for edge in edges {\n        let a = find(edge[0]), b = find(edge[1])\n        if a == b { return edge }       // already connected: this edge closes a cycle\n        parent[a] = b\n    }\n    return []\n}", "missing-number": "func missingNumber(_ nums: [Int]) -> Int {\n    var acc = nums.count\n    for (i, x) in nums.enumerated() {\n        acc ^= i ^ x\n    }\n    return acc\n}", "jump-game-ii": "func jump(_ nums: [Int]) -> Int {\n    var jumps = 0, end = 0, farthest = 0\n    for i in 0..<max(nums.count - 1, 0) {\n        farthest = max(farthest, i + nums[i])\n        if i == end {               // used up the current jump's range\n            jumps += 1\n            end = farthest\n        }\n    }\n    return jumps\n}", "non-overlapping-intervals": "func eraseOverlapIntervals(_ intervals: [[Int]]) -> Int {\n    let sorted = intervals.sorted { $0[1] < $1[1] }\n    var removed = 0\n    var lastEnd = Int.min\n    for iv in sorted {\n        if iv[0] >= lastEnd {\n            lastEnd = iv[1]         // keep it\n        } else {\n            removed += 1            // overlaps the last kept interval\n        }\n    }\n    return removed\n}", "same-tree": "func isSameTree(_ p: TreeNode?, _ q: TreeNode?) -> Bool {\n    guard let p = p, let q = q else { return p == nil && q == nil }\n    if p.val != q.val { return false }\n    return isSameTree(p.left, q.left)\n        && isSameTree(p.right, q.right)\n}", "counting-bits": "func countBits(_ n: Int) -> [Int] {\n    var bits = [Int](repeating: 0, count: n + 1)\n    for i in stride(from: 1, through: n, by: 1) {\n        bits[i] = bits[i >> 1] + (i & 1)\n    }\n    return bits\n}", "max-area-of-island": "func maxAreaOfIsland(_ grid: [[Int]]) -> Int {\n    var g = grid\n    let rows = g.count, cols = g.first?.count ?? 0\n    func area(_ r: Int, _ c: Int) -> Int {\n        guard r >= 0, r < rows, c >= 0, c < cols, g[r][c] == 1 else { return 0 }\n        g[r][c] = 0\n        return 1 + area(r + 1, c) + area(r - 1, c) + area(r, c + 1) + area(r, c - 1)\n    }\n    var best = 0\n    for r in 0..<rows {\n        for c in 0..<cols where g[r][c] == 1 {\n            best = max(best, area(r, c))\n        }\n    }\n    return best\n}", "course-schedule-ii": "func findOrder(_ numCourses: Int, _ prerequisites: [[Int]]) -> [Int] {\n    var adj = [[Int]](repeating: [], count: numCourses)\n    var indegree = [Int](repeating: 0, count: numCourses)\n    for p in prerequisites {\n        adj[p[1]].append(p[0])\n        indegree[p[0]] += 1\n    }\n    var queue = (0..<numCourses).filter { indegree[$0] == 0 }\n    var head = 0\n    while head < queue.count {\n        let course = queue[head]; head += 1\n        for next in adj[course] {\n            indegree[next] -= 1\n            if indegree[next] == 0 { queue.append(next) }\n        }\n    }\n    return queue.count == numCourses ? queue : []\n}", "kth-smallest-element-in-a-bst": "func kthSmallest(_ root: TreeNode?, _ k: Int) -> Int {\n    var stack: [TreeNode] = []\n    var node = root\n    var remaining = k\n    while true {\n        while let n = node {\n            stack.append(n)             // go as far left as possible\n            node = n.left\n        }\n        let top = stack.removeLast()    // next value in sorted order\n        remaining -= 1\n        if remaining == 0 { return top.val }\n        node = top.right\n    }\n}", "longest-palindromic-substring": "func longestPalindrome(_ s: String) -> String {\n    let chars = Array(s)\n    var start = 0, length = 0\n    for center in 0..<max(2 * chars.count - 1, 0) {\n        var l = center / 2, r = l + center % 2\n        while l >= 0, r < chars.count, chars[l] == chars[r] {\n            l -= 1; r += 1\n        }\n        if r - l - 1 > length {\n            length = r - l - 1\n            start = l + 1\n        }\n    }\n    return String(chars[start..<start + length])\n}", "gas-station": "func canCompleteCircuit(_ gas: [Int], _ cost: [Int]) -> Int {\n    var total = 0, tank = 0, start = 0\n    for i in gas.indices {\n        let gain = gas[i] - cost[i]\n        total += gain\n        tank += gain\n        if tank < 0 {               // cannot reach i + 1 from the current start\n            start = i + 1\n            tank = 0\n        }\n    }\n    return total >= 0 ? start : -1\n}", "range-sum-query-immutable": "struct NumArray {\n    private var prefix: [Int] = [0]     // prefix[i] = sum of the first i values\n    init(_ nums: [Int]) {\n        for x in nums { prefix.append(prefix.last! + x) }\n    }\n    func sumRange(_ left: Int, _ right: Int) -> Int {\n        prefix[right + 1] - prefix[left]\n    }\n}", "subtree-of-another-tree": "func isSubtree(_ root: TreeNode?, _ subRoot: TreeNode?) -> Bool {\n    func same(_ a: TreeNode?, _ b: TreeNode?) -> Bool {\n        guard let a = a, let b = b else { return a == nil && b == nil }\n        return a.val == b.val && same(a.left, b.left) && same(a.right, b.right)\n    }\n    guard let root = root else { return subRoot == nil }\n    if same(root, subRoot) { return true }\n    return isSubtree(root.left, subRoot) || isSubtree(root.right, subRoot)\n}", "lowest-common-ancestor-of-a-binary-search-tree": "func lowestCommonAncestor(_ root: TreeNode?, _ p: Int, _ q: Int) -> TreeNode? {\n    var node = root\n    while let n = node {\n        if p < n.val && q < n.val {\n            node = n.left               // both targets are smaller\n        } else if p > n.val && q > n.val {\n            node = n.right              // both targets are larger\n        } else {\n            return n                    // they split here, or one is this node\n        }\n    }\n    return nil\n}", "house-robber-ii": "func robCircle(_ nums: [Int]) -> Int {\n    if nums.count == 1 { return nums[0] }\n    func robLine(_ houses: ArraySlice<Int>) -> Int {\n        var prev = 0, cur = 0\n        for x in houses {\n            (prev, cur) = (cur, max(cur, prev + x))\n        }\n        return cur\n    }\n    return max(robLine(nums.dropLast()), robLine(nums.dropFirst()))\n}", "decode-ways": "func numDecodings(_ s: String) -> Int {\n    let d = s.compactMap { $0.wholeNumberValue }\n    guard !d.isEmpty, d[0] != 0 else { return 0 }\n    var prev = 1, cur = 1               // ways for the prefixes one shorter and current\n    for i in 1..<d.count {\n        var next = 0\n        if d[i] != 0 { next += cur }                    // decode one digit\n        let two = d[i - 1] * 10 + d[i]\n        if two >= 10 && two <= 26 { next += prev }      // decode two digits\n        (prev, cur) = (cur, next)\n    }\n    return cur\n}", "find-the-duplicate-number": "func findDuplicate(_ nums: [Int]) -> Int {\n    var slow = nums[0], fast = nums[nums[0]]\n    while slow != fast {\n        slow = nums[slow]\n        fast = nums[nums[fast]]\n    }\n    slow = 0\n    while slow != fast {\n        slow = nums[slow]\n        fast = nums[fast]\n    }\n    return slow\n}", "kth-largest-element-in-a-stream": "struct KthLargest {\n    private var heap: [Int] = []        // min-heap of the k largest values\n    private let k: Int\n    init(_ k: Int, _ nums: [Int]) {\n        self.k = k\n        for x in nums { _ = add(x) }\n    }\n    mutating func add(_ val: Int) -> Int {\n        heap.append(val)\n        var i = heap.count - 1\n        while i > 0, heap[(i - 1) / 2] > heap[i] {      // sift up\n            heap.swapAt((i - 1) / 2, i); i = (i - 1) / 2\n        }\n        if heap.count > k { removeMin() }\n        return heap[0]\n    }\n    private mutating func removeMin() {\n        heap.swapAt(0, heap.count - 1)\n        heap.removeLast()\n        var i = 0\n        while true {                                     // sift down\n            var m = i\n            for c in [2 * i + 1, 2 * i + 2] where c < heap.count && heap[c] < heap[m] { m = c }\n            if m == i { return }\n            heap.swapAt(i, m); i = m\n        }\n    }\n}", "longest-repeating-character-replacement": "func characterReplacement(_ s: String, _ k: Int) -> Int {\n    let chars = Array(s)\n    var count: [Character: Int] = [:]\n    var left = 0, maxCount = 0, best = 0\n    for right in chars.indices {\n        count[chars[right], default: 0] += 1\n        maxCount = max(maxCount, count[chars[right]]!)\n        while (right - left + 1) - maxCount > k {\n            count[chars[left]]! -= 1\n            left += 1\n        }\n        best = max(best, right - left + 1)\n    }\n    return best\n}", "reverse-bits": "func reverseBits(_ n: Int) -> Int {\n    var x = n, result = 0\n    for _ in 0..<32 {\n        result = (result << 1) | (x & 1)\n        x >>= 1\n    }\n    return result\n}", "word-search": "func exist(_ board: [[Character]], _ word: String) -> Bool {\n    var b = board\n    let w = Array(word)\n    let rows = b.count, cols = b.first?.count ?? 0\n    func search(_ r: Int, _ c: Int, _ i: Int) -> Bool {\n        if i == w.count { return true }\n        guard r >= 0, r < rows, c >= 0, c < cols, b[r][c] == w[i] else { return false }\n        b[r][c] = \"#\"                   // mark as used on this path\n        let found = search(r + 1, c, i + 1) || search(r - 1, c, i + 1)\n            || search(r, c + 1, i + 1) || search(r, c - 1, i + 1)\n        b[r][c] = w[i]                  // restore for other paths\n        return found\n    }\n    for r in 0..<rows {\n        for c in 0..<cols where search(r, c, 0) { return true }\n    }\n    return false\n}", "reorder-list": "func reorderList(_ head: ListNode?) {\n    var slow = head, fast = head\n    while let next = fast?.next?.next {\n        slow = slow?.next\n        fast = next\n    }\n    var prev: ListNode? = nil\n    var cur = slow?.next\n    slow?.next = nil                    // cut the list in two\n    while let node = cur {\n        let next = node.next\n        node.next = prev\n        prev = node\n        cur = next\n    }\n    var first = head, second = prev\n    while let a = first, let b = second {\n        let an = a.next, bn = b.next\n        a.next = b\n        b.next = an\n        first = an\n        second = bn\n    }\n}", "lru-cache": "final class LRUCache {\n    private final class Node {\n        let key: Int; var value: Int\n        weak var prev: Node?\n        var next: Node?\n        init(_ k: Int, _ v: Int) { key = k; value = v }\n    }\n    private var map: [Int: Node] = [:]\n    private let head = Node(0, 0), tail = Node(0, 0)   // sentinels\n    private let capacity: Int\n    init(_ capacity: Int) {\n        self.capacity = capacity\n        head.next = tail; tail.prev = head\n    }\n    private func unlink(_ n: Node) {\n        n.prev?.next = n.next; n.next?.prev = n.prev\n    }\n    private func pushFront(_ n: Node) {\n        n.next = head.next; n.prev = head\n        head.next?.prev = n; head.next = n\n    }\n    func get(_ key: Int) -> Int {\n        guard let n = map[key] else { return -1 }\n        unlink(n); pushFront(n)          // now the most recently used\n        return n.value\n    }\n    func put(_ key: Int, _ value: Int) {\n        if let n = map[key] {\n            n.value = value\n            unlink(n); pushFront(n)\n            return\n        }\n        if map.count == capacity, let old = tail.prev {\n            unlink(old); map[old.key] = nil      // evict the least recently used\n        }\n        let n = Node(key, value)\n        map[key] = n; pushFront(n)\n    }\n}", "binary-tree-maximum-path-sum": "func maxPathSum(_ root: TreeNode?) -> Int {\n    var best = Int.min\n    func gain(_ node: TreeNode?) -> Int {\n        guard let node = node else { return 0 }\n        let l = max(gain(node.left), 0)     // ignore a side that would lose value\n        let r = max(gain(node.right), 0)\n        best = max(best, node.val + l + r)  // path that bends at this node\n        return node.val + max(l, r)         // best single branch for the parent\n    }\n    _ = gain(root)\n    return best\n}", "largest-rectangle-in-histogram": "func largestRectangleArea(_ heights: [Int]) -> Int {\n    var stack: [Int] = []               // indices with increasing heights\n    var best = 0\n    for i in 0...heights.count {\n        let h = i == heights.count ? 0 : heights[i]   // 0 flushes the stack at the end\n        while let top = stack.last, heights[top] > h {\n            stack.removeLast()\n            let left = stack.last ?? -1\n            best = max(best, heights[top] * (i - left - 1))\n        }\n        stack.append(i)\n    }\n    return best\n}", "minimum-window-substring": "func minWindow(_ s: String, _ t: String) -> String {\n    let chars = Array(s)\n    var need: [Character: Int] = [:]\n    for ch in t { need[ch, default: 0] += 1 }\n    var missing = t.count               // characters of t not yet covered\n    var left = 0, bestStart = 0, bestLen = Int.max\n    for right in chars.indices {\n        if need[chars[right], default: 0] > 0 { missing -= 1 }\n        need[chars[right], default: 0] -= 1\n        while missing == 0 {\n            if right - left + 1 < bestLen {\n                bestLen = right - left + 1\n                bestStart = left\n            }\n            need[chars[left]]! += 1\n            if need[chars[left]]! > 0 { missing += 1 }\n            left += 1\n        }\n    }\n    return bestLen == Int.max ? \"\" : String(chars[bestStart..<bestStart + bestLen])\n}", "merge-k-sorted-lists": "func mergeKLists(_ lists: [ListNode?]) -> ListNode? {\n    var heap: [ListNode] = []           // min-heap ordered by node value\n    func siftUp(_ start: Int) {\n        var i = start\n        while i > 0, heap[(i - 1) / 2].val > heap[i].val {\n            heap.swapAt((i - 1) / 2, i); i = (i - 1) / 2\n        }\n    }\n    func siftDown() {\n        var i = 0\n        while true {\n            var m = i\n            for c in [2 * i + 1, 2 * i + 2] where c < heap.count && heap[c].val < heap[m].val { m = c }\n            if m == i { return }\n            heap.swapAt(i, m); i = m\n        }\n    }\n    for case let node? in lists { heap.append(node); siftUp(heap.count - 1) }\n    let dummy = ListNode(0)\n    var tail = dummy\n    while let smallest = heap.first {\n        tail.next = smallest\n        tail = smallest\n        if let next = smallest.next {\n            heap[0] = next               // replace the root with its successor\n        } else {\n            heap[0] = heap[heap.count - 1]\n            heap.removeLast()\n        }\n        if !heap.isEmpty { siftDown() }\n    }\n    return dummy.next\n}", "construct-binary-tree-from-preorder-and-inorder-traversal": "func buildTree(_ preorder: [Int], _ inorder: [Int]) -> TreeNode? {\n    var position: [Int: Int] = [:]      // value -> index in inorder\n    for (i, v) in inorder.enumerated() { position[v] = i }\n    var next = 0                        // next root in preorder\n    func build(_ lo: Int, _ hi: Int) -> TreeNode? {\n        if lo > hi { return nil }\n        let node = TreeNode(preorder[next])\n        next += 1\n        let mid = position[node.val]!\n        node.left = build(lo, mid - 1)      // everything left of it in inorder\n        node.right = build(mid + 1, hi)\n        return node\n    }\n    return build(0, inorder.count - 1)\n}", "serialize-and-deserialize-binary-tree": "final class Codec {\n    func serialize(_ root: TreeNode?) -> String {\n        var parts: [String] = []\n        func write(_ node: TreeNode?) {\n            guard let node = node else { parts.append(\"#\"); return }\n            parts.append(String(node.val))\n            write(node.left)\n            write(node.right)\n        }\n        write(root)\n        return parts.joined(separator: \",\")\n    }\n    func deserialize(_ data: String) -> TreeNode? {\n        let parts = data.split(separator: \",\")\n        var i = 0\n        func read() -> TreeNode? {\n            let token = parts[i]; i += 1\n            if token == \"#\" { return nil }\n            let node = TreeNode(Int(token)!)\n            node.left = read()\n            node.right = read()\n            return node\n        }\n        return read()\n    }\n}", "word-ladder": "func ladderLength(_ beginWord: String, _ endWord: String, _ wordList: [String]) -> Int {\n    var remaining = Set(wordList)\n    guard remaining.contains(endWord) else { return 0 }\n    var queue = [beginWord]\n    var steps = 1\n    let letters = Array(\"abcdefghijklmnopqrstuvwxyz\")\n    while !queue.isEmpty {\n        var next: [String] = []\n        for word in queue {\n            if word == endWord { return steps }\n            var chars = Array(word)\n            for i in chars.indices {\n                let original = chars[i]\n                for letter in letters where letter != original {\n                    chars[i] = letter\n                    let candidate = String(chars)\n                    if remaining.remove(candidate) != nil { next.append(candidate) }\n                }\n                chars[i] = original\n            }\n        }\n        queue = next\n        steps += 1\n    }\n    return 0\n}", "n-queens": "func solveNQueens(_ n: Int) -> [[String]] {\n    var result: [[String]] = []\n    var queens: [Int] = []              // queens[row] = column\n    var cols = Set<Int>(), diag = Set<Int>(), anti = Set<Int>()\n    func place(_ row: Int) {\n        if row == n {\n            result.append(queens.map { c in (0..<n).map { $0 == c ? \"Q\" : \".\" }.joined() })\n            return\n        }\n        for c in 0..<n where !cols.contains(c) && !diag.contains(row - c) && !anti.contains(row + c) {\n            queens.append(c); cols.insert(c); diag.insert(row - c); anti.insert(row + c)\n            place(row + 1)\n            queens.removeLast(); cols.remove(c); diag.remove(row - c); anti.remove(row + c)\n        }\n    }\n    place(0)\n    return result\n}", "median-of-two-sorted-arrays": "func findMedianSortedArrays(_ nums1: [Int], _ nums2: [Int]) -> Double {\n    let (a, b) = nums1.count <= nums2.count ? (nums1, nums2) : (nums2, nums1)\n    let half = (a.count + b.count + 1) / 2\n    var lo = 0, hi = a.count\n    while true {\n        let i = (lo + hi) / 2           // how many elements the left part takes from a\n        let j = half - i                // and from b\n        let aLeft = i > 0 ? a[i - 1] : Int.min, aRight = i < a.count ? a[i] : Int.max\n        let bLeft = j > 0 ? b[j - 1] : Int.min, bRight = j < b.count ? b[j] : Int.max\n        if aLeft > bRight {\n            hi = i - 1                  // took too many from a\n        } else if bLeft > aRight {\n            lo = i + 1                  // took too few from a\n        } else {\n            let leftMax = max(aLeft, bLeft)\n            if (a.count + b.count) % 2 == 1 { return Double(leftMax) }\n            return Double(leftMax + min(aRight, bRight)) / 2\n        }\n    }\n}", "find-median-from-data-stream": "struct Heap {\n    private var items: [Int] = []\n    private let before: (Int, Int) -> Bool      // true if a belongs nearer the top than b\n    init(_ before: @escaping (Int, Int) -> Bool) { self.before = before }\n    var count: Int { items.count }\n    var top: Int? { items.first }\n    mutating func push(_ x: Int) {\n        items.append(x)\n        var i = items.count - 1\n        while i > 0, before(items[i], items[(i - 1) / 2]) {\n            items.swapAt(i, (i - 1) / 2); i = (i - 1) / 2\n        }\n    }\n    mutating func pop() -> Int? {\n        guard !items.isEmpty else { return nil }\n        items.swapAt(0, items.count - 1)\n        let top = items.removeLast()\n        var i = 0\n        while true {\n            var m = i\n            for c in [2 * i + 1, 2 * i + 2] where c < items.count && before(items[c], items[m]) { m = c }\n            if m == i { break }\n            items.swapAt(i, m); i = m\n        }\n        return top\n    }\n}\nstruct MedianFinder {\n    private var low = Heap(>)           // max-heap: the smaller half\n    private var high = Heap(<)          // min-heap: the larger half\n    mutating func addNum(_ num: Int) {\n        low.push(num)\n        high.push(low.pop()!)           // pass the largest of low across\n        if high.count > low.count { low.push(high.pop()!) }\n    }\n    func findMedian() -> Double {\n        low.count > high.count ? Double(low.top!) : Double(low.top! + high.top!) / 2\n    }\n}", "word-search-ii": "func findWords(_ board: [[Character]], _ words: [String]) -> [String] {\n    final class Node { var next: [Character: Node] = [:]; var word: String? }\n    let root = Node()\n    for w in words {\n        var n = root\n        for ch in w {\n            if n.next[ch] == nil { n.next[ch] = Node() }\n            n = n.next[ch]!\n        }\n        n.word = w\n    }\n    var b = board\n    let rows = b.count, cols = b.first?.count ?? 0\n    var found: [String] = []\n    func search(_ r: Int, _ c: Int, _ node: Node) {\n        guard r >= 0, r < rows, c >= 0, c < cols, let child = node.next[b[r][c]] else { return }\n        if let w = child.word { found.append(w); child.word = nil }   // report each word once\n        let ch = b[r][c]\n        b[r][c] = \"#\"\n        search(r + 1, c, child); search(r - 1, c, child)\n        search(r, c + 1, child); search(r, c - 1, child)\n        b[r][c] = ch\n    }\n    for r in 0..<rows { for c in 0..<cols { search(r, c, root) } }\n    return found\n}", "sort-list": "func sortList(_ head: ListNode?) -> ListNode? {\n    guard let head = head, head.next != nil else { return head }\n    var slow = head, fast = head.next\n    while let next = fast?.next {\n        slow = slow.next!\n        fast = next.next\n    }\n    let second = slow.next\n    slow.next = nil                     // split into two halves\n    var a = sortList(head), b = sortList(second)\n    let dummy = ListNode(0)\n    var tail = dummy\n    while let x = a, let y = b {\n        if x.val <= y.val { tail.next = x; a = x.next } else { tail.next = y; b = y.next }\n        tail = tail.next!\n    }\n    tail.next = a ?? b\n    return dummy.next\n}", "clone-graph": "func cloneGraph(_ node: GraphNode?) -> GraphNode? {\n    var copies: [Int: GraphNode] = [:]      // original value -> its copy\n    func clone(_ original: GraphNode) -> GraphNode {\n        if let done = copies[original.val] { return done }\n        let copy = GraphNode(original.val)\n        copies[original.val] = copy             // register before visiting neighbours\n        for neighbour in original.neighbors {\n            copy.neighbors.append(clone(neighbour))\n        }\n        return copy\n    }\n    return node.map(clone)\n}", "pacific-atlantic-water-flow": "func pacificAtlantic(_ heights: [[Int]]) -> [[Int]] {\n    let rows = heights.count, cols = heights.first?.count ?? 0\n    var pacific = [[Bool]](repeating: [Bool](repeating: false, count: cols), count: rows)\n    var atlantic = pacific\n    func climb(_ r: Int, _ c: Int, _ seen: inout [[Bool]], _ from: Int) {\n        guard r >= 0, r < rows, c >= 0, c < cols, !seen[r][c], heights[r][c] >= from else { return }\n        seen[r][c] = true\n        for (dr, dc) in [(1, 0), (-1, 0), (0, 1), (0, -1)] {\n            climb(r + dr, c + dc, &seen, heights[r][c])\n        }\n    }\n    for r in 0..<rows {\n        climb(r, 0, &pacific, 0)\n        climb(r, cols - 1, &atlantic, 0)\n    }\n    for c in 0..<cols {\n        climb(0, c, &pacific, 0)\n        climb(rows - 1, c, &atlantic, 0)\n    }\n    var result: [[Int]] = []\n    for r in 0..<rows {\n        for c in 0..<cols where pacific[r][c] && atlantic[r][c] { result.append([r, c]) }\n    }\n    return result\n}", "design-add-and-search-words-data-structure": "final class WordDictionary {\n    private final class Node { var next: [Character: Node] = [:]; var isWord = false }\n    private let root = Node()\n    func addWord(_ word: String) {\n        var node = root\n        for ch in word {\n            if node.next[ch] == nil { node.next[ch] = Node() }\n            node = node.next[ch]!\n        }\n        node.isWord = true\n    }\n    func search(_ word: String) -> Bool {\n        let chars = Array(word)\n        func match(_ node: Node, _ i: Int) -> Bool {\n            if i == chars.count { return node.isWord }\n            if chars[i] == \".\" {\n                return node.next.values.contains { match($0, i + 1) }\n            }\n            guard let child = node.next[chars[i]] else { return false }\n            return match(child, i + 1)\n        }\n        return match(root, 0)\n    }\n}", "meeting-rooms": "func canAttendMeetings(_ intervals: [[Int]]) -> Bool {\n    let sorted = intervals.sorted { $0[0] < $1[0] }\n    for i in sorted.indices.dropFirst() {\n        if sorted[i][0] < sorted[i - 1][1] { return false }\n    }\n    return true\n}", "meeting-rooms-ii": "func minMeetingRooms(_ intervals: [[Int]]) -> Int {\n    let starts = intervals.map { $0[0] }.sorted()\n    let ends = intervals.map { $0[1] }.sorted()\n    var rooms = 0, best = 0, e = 0\n    for s in starts {\n        while e < ends.count, ends[e] <= s {\n            rooms -= 1; e += 1          // a meeting has ended: its room is free\n        }\n        rooms += 1\n        best = max(best, rooms)\n    }\n    return best\n}", "number-of-connected-components-in-an-undirected-graph": "func countComponents(_ n: Int, _ edges: [[Int]]) -> Int {\n    var parent = Array(0..<n)\n    func find(_ x: Int) -> Int {\n        var x = x\n        while parent[x] != x { parent[x] = parent[parent[x]]; x = parent[x] }\n        return x\n    }\n    var count = n\n    for e in edges {\n        let a = find(e[0]), b = find(e[1])\n        if a != b { parent[a] = b; count -= 1 }\n    }\n    return count\n}", "p-two-pointers": "func pairWithSum(_ sorted: [Int], _ target: Int) -> (Int, Int)? {\n    var l = 0, r = sorted.count - 1\n    while l < r {\n        let sum = sorted[l] + sorted[r]\n        if sum == target { return (l, r) }\n        if sum < target { l += 1 } else { r -= 1 }\n    }\n    return nil\n}", "p-sliding-window": "func shortestWindow(_ nums: [Int], atLeast target: Int) -> Int {\n    var left = 0, sum = 0, best = Int.max\n    for right in nums.indices {\n        sum += nums[right]                 // grow\n        while sum >= target {              // shrink while still valid\n            best = min(best, right - left + 1)\n            sum -= nums[left]; left += 1\n        }\n    }\n    return best == Int.max ? 0 : best\n}", "p-fast-slow": "func hasCycle(_ head: PNode?) -> Bool {\n    var slow = head, fast = head\n    while let f = fast?.next?.next {\n        slow = slow?.next\n        fast = f\n        if slow === fast { return true }\n    }\n    return false\n}", "p-prefix-sum": "struct PrefixSum {\n    private var pre: [Int] = [0]           // pre[i] = sum of first i items\n    init(_ nums: [Int]) { for x in nums { pre.append(pre.last! + x) } }\n    func sum(_ lo: Int, _ hi: Int) -> Int { pre[hi + 1] - pre[lo] }  // inclusive\n}", "p-hashing": "func firstDuplicate(_ nums: [Int]) -> Int? {\n    var seen = Set<Int>()\n    for x in nums where !seen.insert(x).inserted { return x }\n    return nil\n}", "p-binary-search": "func firstIndex(in range: Range<Int>, where ok: (Int) -> Bool) -> Int {\n    var lo = range.lowerBound, hi = range.upperBound   // answer in [lo, hi]\n    while lo < hi {\n        let mid = lo + (hi - lo) / 2\n        if ok(mid) { hi = mid } else { lo = mid + 1 }\n    }\n    return lo                                          // == upperBound if none\n}", "p-monotonic-stack": "func nextGreater(_ nums: [Int]) -> [Int] {\n    var ans = [Int](repeating: -1, count: nums.count)\n    var stack: [Int] = []                  // indices, values decreasing\n    for (i, x) in nums.enumerated() {\n        while let top = stack.last, nums[top] < x {\n            ans[stack.removeLast()] = x\n        }\n        stack.append(i)\n    }\n    return ans\n}", "p-monotonic-queue": "func windowMax(_ nums: [Int], _ k: Int) -> [Int] {\n    var dq: [Int] = [], head = 0, out: [Int] = []      // indices, values decreasing\n    for i in nums.indices {\n        while dq.count > head, nums[dq.last!] <= nums[i] { dq.removeLast() }\n        dq.append(i)\n        if dq[head] <= i - k { head += 1 }             // front left the window\n        if i >= k - 1 { out.append(nums[dq[head]]) }\n    }\n    return out\n}", "p-bfs": "func shortestPath(_ adj: [[Int]], from s: Int, to t: Int) -> Int {\n    var dist = [Int](repeating: -1, count: adj.count)\n    var queue = [s], head = 0\n    dist[s] = 0\n    while head < queue.count {\n        let u = queue[head]; head += 1\n        if u == t { return dist[u] }\n        for v in adj[u] where dist[v] == -1 {\n            dist[v] = dist[u] + 1\n            queue.append(v)\n        }\n    }\n    return -1\n}", "p-dfs": "func reachable(_ adj: [[Int]], from s: Int) -> Set<Int> {\n    var seen = Set<Int>()\n    func visit(_ u: Int) {\n        guard seen.insert(u).inserted else { return }\n        for v in adj[u] { visit(v) }\n    }\n    visit(s)\n    return seen\n}", "p-backtracking": "func subsets(_ nums: [Int]) -> [[Int]] {\n    var out: [[Int]] = [], path: [Int] = []\n    func go(_ start: Int) {\n        out.append(path)\n        for i in start..<nums.count {\n            path.append(nums[i])           // choose\n            go(i + 1)                      // explore\n            path.removeLast()              // un-choose\n        }\n    }\n    go(0)\n    return out\n}", "p-greedy": "func canReachEnd(_ jumps: [Int]) -> Bool {\n    var farthest = 0\n    for (i, j) in jumps.enumerated() {\n        if i > farthest { return false }   // stuck before i\n        farthest = max(farthest, i + j)\n    }\n    return true\n}", "p-dp": "func maxLoot(_ houses: [Int]) -> Int {\n    var skip = 0, take = 0                 // best without / with previous house\n    for h in houses {\n        (skip, take) = (max(skip, take), skip + h)\n    }\n    return max(skip, take)\n}", "p-heap": "struct MinHeap<T: Comparable> {\n    private var a: [T] = []\n    var count: Int { a.count }\n    var peek: T? { a.first }\n    mutating func push(_ x: T) {\n        a.append(x)\n        var i = a.count - 1\n        while i > 0, a[(i - 1) / 2] > a[i] {\n            a.swapAt((i - 1) / 2, i); i = (i - 1) / 2\n        }\n    }\n    mutating func pop() -> T? {\n        guard !a.isEmpty else { return nil }\n        a.swapAt(0, a.count - 1)\n        let top = a.removeLast()\n        var i = 0\n        while true {\n            let l = 2 * i + 1, r = l + 1\n            var m = i\n            if l < a.count, a[l] < a[m] { m = l }\n            if r < a.count, a[r] < a[m] { m = r }\n            if m == i { break }\n            a.swapAt(i, m); i = m\n        }\n        return top\n    }\n}\nfunc kLargest(_ nums: [Int], _ k: Int) -> [Int] {\n    var heap = MinHeap<Int>()\n    for x in nums {\n        heap.push(x)\n        if heap.count > k { _ = heap.pop() }   // drop the smallest\n    }\n    var out: [Int] = []\n    while let x = heap.pop() { out.append(x) }\n    return out\n}", "p-graph": "func topoOrder(_ n: Int, _ edges: [(from: Int, to: Int)]) -> [Int]? {\n    var adj = [[Int]](repeating: [], count: n)\n    var indeg = [Int](repeating: 0, count: n)\n    for e in edges { adj[e.from].append(e.to); indeg[e.to] += 1 }\n    var ready = (0..<n).filter { indeg[$0] == 0 }, order: [Int] = []\n    while let u = ready.popLast() {\n        order.append(u)\n        for v in adj[u] {\n            indeg[v] -= 1\n            if indeg[v] == 0 { ready.append(v) }\n        }\n    }\n    return order.count == n ? order : nil  // nil means a cycle exists\n}", "p-union-find": "struct UnionFind {\n    private var parent: [Int], size: [Int]\n    init(_ n: Int) { parent = Array(0..<n); size = Array(repeating: 1, count: n) }\n    mutating func find(_ x: Int) -> Int {\n        if parent[x] != x { parent[x] = find(parent[x]) }   // path compression\n        return parent[x]\n    }\n    @discardableResult\n    mutating func union(_ a: Int, _ b: Int) -> Bool {\n        var (ra, rb) = (find(a), find(b))\n        if ra == rb { return false }\n        if size[ra] < size[rb] { swap(&ra, &rb) }\n        parent[rb] = ra; size[ra] += size[rb]               // small under large\n        return true\n    }\n}", "p-trie": "final class Trie {\n    private final class Node { var next: [Character: Node] = [:]; var isWord = false }\n    private let root = Node()\n    func insert(_ word: String) {\n        var n = root\n        for ch in word {\n            if n.next[ch] == nil { n.next[ch] = Node() }\n            n = n.next[ch]!\n        }\n        n.isWord = true\n    }\n    func words(withPrefix prefix: String, limit: Int = 5) -> [String] {\n        var n = root\n        for ch in prefix { guard let m = n.next[ch] else { return [] }; n = m }\n        var out: [String] = []\n        func collect(_ node: Node, _ cur: String) {\n            if out.count == limit { return }\n            if node.isWord { out.append(cur) }\n            for (ch, child) in node.next.sorted(by: { $0.key < $1.key }) {\n                collect(child, cur + String(ch))\n            }\n        }\n        collect(n, prefix)\n        return out\n    }\n}", "p-bit": "func singleNumber(_ nums: [Int]) -> Int { nums.reduce(0, ^) }   // pairs cancel\nfunc bitCount(_ x: UInt) -> Int {\n    var n = x, c = 0\n    while n != 0 { n &= n - 1; c += 1 }    // clears the lowest set bit\n    return c\n}", "p-intervals": "func mergeRanges(_ ranges: [ClosedRange<Int>]) -> [ClosedRange<Int>] {\n    var out: [ClosedRange<Int>] = []\n    for r in ranges.sorted(by: { $0.lowerBound < $1.lowerBound }) {\n        if let last = out.last, r.lowerBound <= last.upperBound {\n            out[out.count - 1] = last.lowerBound...max(last.upperBound, r.upperBound)\n        } else {\n            out.append(r)\n        }\n    }\n    return out\n}", "p-divide-conquer": "func mergeSort(_ a: [Int]) -> [Int] {\n    guard a.count > 1 else { return a }\n    let mid = a.count / 2\n    let l = mergeSort(Array(a[..<mid])), r = mergeSort(Array(a[mid...]))\n    var out: [Int] = [], i = 0, j = 0\n    out.reserveCapacity(a.count)\n    while i < l.count, j < r.count {\n        if l[i] <= r[j] { out.append(l[i]); i += 1 } else { out.append(r[j]); j += 1 }\n    }\n    return out + l[i...] + r[j...]\n}", "a-cart": "struct CartLine { let sku: String; var qty: Int }\nstruct Cart {\n    private(set) var lines: [String: CartLine] = [:]     // sku -> line\n    mutating func add(_ sku: String, qty: Int = 1) {\n        lines[sku, default: CartLine(sku: sku, qty: 0)].qty += qty\n    }\n    func quantity(of sku: String) -> Int { lines[sku]?.qty ?? 0 }\n}", "a-dedupe": "func uniqueInOrder<T: Hashable>(_ items: [T]) -> [T] {\n    var seen = Set<T>()\n    return items.filter { seen.insert($0).inserted }\n}", "a-queue": "struct Queue<T> {\n    private var items: [T] = [], head = 0\n    var isEmpty: Bool { head == items.count }\n    mutating func enqueue(_ x: T) { items.append(x) }\n    mutating func dequeue() -> T? {\n        guard head < items.count else { return nil }\n        defer {\n            head += 1\n            if head > 64, head * 2 > items.count { items.removeFirst(head); head = 0 }\n        }\n        return items[head]\n    }\n}", "a-history": "struct History<Page> {\n    private var back: [Page] = [], forward: [Page] = []\n    private(set) var current: Page\n    init(start: Page) { current = start }\n    mutating func visit(_ p: Page) { back.append(current); current = p; forward.removeAll() }\n    mutating func goBack() { if let p = back.popLast() { forward.append(current); current = p } }\n    mutating func goForward() { if let p = forward.popLast() { back.append(current); current = p } }\n}", "a-lru": "final class LRUCache<Key: Hashable, Value> {\n    private final class Node {\n        let key: Key; var value: Value; var prev: Node?; var next: Node?\n        init(_ k: Key, _ v: Value) { key = k; value = v }\n    }\n    private var map: [Key: Node] = [:]\n    private var head: Node?, tail: Node?                 // head = most recent\n    private let capacity: Int\n    init(capacity: Int) { self.capacity = max(1, capacity) }\n    private func detach(_ n: Node) {\n        n.prev?.next = n.next; n.next?.prev = n.prev\n        if head === n { head = n.next }\n        if tail === n { tail = n.prev }\n        n.prev = nil; n.next = nil\n    }\n    private func pushFront(_ n: Node) {\n        n.next = head; head?.prev = n; head = n\n        if tail == nil { tail = n }\n    }\n    func get(_ key: Key) -> Value? {\n        guard let n = map[key] else { return nil }\n        detach(n); pushFront(n)\n        return n.value\n    }\n    func set(_ key: Key, _ value: Value) {\n        if let n = map[key] { n.value = value; detach(n); pushFront(n); return }\n        if map.count == capacity, let old = tail { detach(old); map[old.key] = nil }\n        let n = Node(key, value)\n        map[key] = n; pushFront(n)\n    }\n}", "a-route": "struct Stop: Comparable {\n    let cost: Int, node: Int\n    static func < (a: Stop, b: Stop) -> Bool { a.cost < b.cost }\n}\nfunc cheapestCosts(_ adj: [[(to: Int, cost: Int)]], from s: Int) -> [Int] {\n    var dist = [Int](repeating: Int.max, count: adj.count)\n    var heap = MinHeap<Stop>()\n    dist[s] = 0; heap.push(Stop(cost: 0, node: s))\n    while let cur = heap.pop() {\n        if cur.cost > dist[cur.node] { continue }        // stale entry\n        for e in adj[cur.node] where cur.cost + e.cost < dist[e.to] {\n            dist[e.to] = cur.cost + e.cost\n            heap.push(Stop(cost: dist[e.to], node: e.to))\n        }\n    }\n    return dist\n}", "a-tasks": "struct Job: Comparable {\n    let priority: Int, name: String                      // lower number = sooner\n    static func < (a: Job, b: Job) -> Bool { a.priority < b.priority }\n}\nfunc runOrder(_ jobs: [Job]) -> [String] {\n    var heap = MinHeap<Job>()\n    jobs.forEach { heap.push($0) }\n    var out: [String] = []\n    while let j = heap.pop() { out.append(j.name) }\n    return out\n}", "a-ranking": "struct Scored: Comparable {\n    let score: Double, id: String\n    static func < (a: Scored, b: Scored) -> Bool { a.score < b.score }\n}\nfunc topRecommendations(_ items: [Scored], _ k: Int) -> [String] {\n    var heap = MinHeap<Scored>()                         // keeps the k best\n    for it in items {\n        heap.push(it)\n        if heap.count > k { _ = heap.pop() }\n    }\n    var out: [String] = []\n    while let it = heap.pop() { out.append(it.id) }\n    return out.reversed()                                // best first\n}", "a-index": "struct SearchIndex {\n    private var postings: [String: Set<Int>] = [:]       // word -> document ids\n    mutating func add(_ id: Int, _ text: String) {\n        for w in text.lowercased().split(whereSeparator: { !$0.isLetter && !$0.isNumber }) {\n            postings[String(w), default: []].insert(id)\n        }\n    }\n    func search(_ query: String) -> Set<Int> {\n        let sets = query.lowercased().split(separator: \" \").map { postings[String($0)] ?? [] }\n        guard var hit = sets.first else { return [] }\n        for s in sets.dropFirst() { hit.formIntersection(s) }\n        return hit\n    }\n}", "a-rate": "struct TokenBucket {\n    let capacity: Double, refillPerSecond: Double\n    private var tokens: Double, last: Double\n    init(capacity: Double, refillPerSecond: Double, now: Double) {\n        self.capacity = capacity; self.refillPerSecond = refillPerSecond\n        tokens = capacity; last = now\n    }\n    mutating func allow(now: Double) -> Bool {\n        tokens = min(capacity, tokens + (now - last) * refillPerSecond)\n        last = now\n        guard tokens >= 1 else { return false }\n        tokens -= 1\n        return true\n    }\n}", "a-ring": "struct RingBuffer<T> {\n    private var slots: [T?], head = 0, count = 0\n    init(capacity: Int) { slots = Array(repeating: nil, count: max(1, capacity)) }\n    mutating func write(_ x: T) {                        // overwrites the oldest when full\n        slots[(head + count) % slots.count] = x\n        if count == slots.count { head = (head + 1) % slots.count } else { count   run(gas, cost) { const S = [], gain = gas.map((g, i) => g - cost[i]); let total = 0, tank = 0, start = 0; const P = i => { const h = {}; gain.forEach((_, k) => { if (k < start) h[k] = "dim"; }); if (i !== null) h[i] = "act"; const ptr = {}; if (start < gain.length) ptr.start = start; if (i !== null && i !== start) ptr.i = i; return [cells("gas", gas), cells("cost", cost), cells("gain = gas − cost (dimmed = ruled out as a start)", gain, ptr, h)]; };

      if (tank < 0) { start = i + 1; tank = 0; S.push({l:8, n:`The tank went negative, so no station up to ${i} can be the start. Try station ${i + 1} with an empty tank.`, v:{i, total, tank, start}, p:P(i)}); } }
    const res = total >= 0 ? start : -1; S.push({l:12, n: res < 0 ? `total is ${total}, below 0: there is not enough fuel for a lap. Return -1.` : `total is ${total}, so a lap is possible. Return start = ${start}.`, v:{total, start}, p:P(null), out:String(res)}); return {steps:S, result:res}; } },

  parse: v => { const a = ints(v.nums, 10); if (!a.length) throw new Error("Enter at least one number."); const q = [...String(v.q).matchAll(/(\d+)\s*[,\-]\s*(\d+)/g)].map(m => [Number(m[1]), Number(m[2])]); if (q.length > 5) throw new Error("Use at most 5 queries."); if (q.some(x => x[0] > x[1] || x[1] >= a.length)) throw new Error("Each query needs left ≤ right and both inside the array."); return [a, q]; },

  run(nums, queries) { const S = [], prefix = [0], out = []; const P = (i, q) => { const hn = {}, hp = {}; if (i !== undefined) hn[i] = "act"; if (q) { for (let k = q[0]; k <= q[1]; k++) hn[k] = "ok"; hp[q[1] + 1] = "act"; hp[q[0]] = "act"; } return [cells("nums", nums, {}, hn), cells("prefix (prefix[i] = sum of the first i values)", [...prefix], {}, hp), cells("answers", [...out])]; };

});

  run(k, nums, adds) { const S = [], heap = [], out = []; const P = hi => [treeP(`min-heap of the ${k} largest`, buildTree([...heap]), hi || {}), cells("heap as an array", [...heap], {}, hi || {}), cells("returned by add", [...out])];

      b[r][c] = "#"; path.push([r, c]); if (S.length < 380) S.push({l:8, n:`(${r}, ${c}) holds "${w[i]}", letter ${i + 1} of ${w.length}. Mark it and look at its neighbours.`, v:{r, c, i}, p:P()});
