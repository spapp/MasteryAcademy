Object.assign(QA_LESSON, {
"product-of-array-except-self":["Division fails when any element is zero, and the problem usually forbids it. It can also lose precision or overflow differently with other number types.","Count the zeros. With two or more, every answer is 0. With exactly one, only that position is non-zero and equals the product of the others. With none, divide the total by each element.","Yes. Any operation that combines a left part and a right part works the same way: keep a running maximum from the left and another from the right."],
"container-with-most-water":["The shorter line caps the water level. Keeping it and moving the taller line makes the container narrower without raising that cap, so the area can only shrink.","Either pointer may move. Neither line can form a larger container with a line further in unless that line is taller, and moving one of them will find it.","Here you choose two lines and ignore the ones between. In Trapping Rain Water every bar holds water above itself, limited by the tallest bars on both sides, and the amounts are summed."],
"group-anagrams":["Count the 26 letters of each word and use the counts as the key, for example as an array of 26 integers, which is Hashable. That costs O(L) per word.","Sorting Characters still gives a correct key. A fixed 26-slot count no longer works, so use a dictionary of character counts or the sorted string. Decide whether accents and case should be treated as equal.","Remember the order in which keys first appear in a separate array and output the groups in that order, or sort the groups at the end."],
"min-stack":["Push onto the second stack only when the new value is less than or equal to its top, and pop it only when the value removed equals its top. It stores fewer entries when the minimum rarely changes.","Yes, by storing an encoded value such as 2 × value − min when a new minimum is pushed and decoding on pop. It is fragile because of overflow and is rarely worth it.","Store the maximum so far in each entry as well. Each entry becomes (value, min so far, max so far) and every operation stays O(1)."],
"search-in-rotated-sorted-array":["When nums[lo], nums[mid] and nums[hi] are all equal you cannot tell which half is sorted. Shrink the range by one from each end and continue. The worst case becomes O(n).","Compare nums[mid] with nums[hi]. If nums[mid] is larger the minimum is to the right of mid; otherwise it is at mid or to its left. Stop when lo equals hi.","When lo equals mid, which happens with two elements, the left half is a single element and counts as sorted. Using < would send that case to the wrong branch."],
"rotting-oranges":["Each fresh orange rots at the time of its nearest rotten orange. Starting them all at level 0 gives that minimum directly in one pass, instead of running a separate search from each.","Keep a grid of times. When an orange is added to the next queue, record the current minute plus one in its cell.","Use eight direction pairs instead of four. Nothing else changes."],
"permutations":["Sort the input. At each position skip a number when it equals the previous number and that previous one is not currently used, so equal values are placed in one fixed order only.","From the right, find the first element smaller than its right neighbour. Swap it with the smallest larger element to its right, then reverse the part after it. If no such element exists, the sequence is the last permutation.","Subsets decide for each element whether to include it, and order does not matter, so the loop moves forward from a start index. Permutations use every element and order matters, so each level scans all unused elements."],
"jump-game":["Track the end of the range reachable with the current number of jumps and the farthest index reachable with one more. When the scan reaches the end of the current range, add a jump and extend the range. O(n).","Keep the leftmost index known to reach the end, starting at the last index. Moving left, an index becomes the new goal if it can jump at least that far. The answer is whether the goal reaches index 0.","The only fact needed about the past is the farthest reachable index, and it can be updated in O(1). Remembering reachability for each index separately adds nothing."]

Object.assign(QA_LESSON, {
"valid-anagram":["Use an array of 26 integers indexed by the letter's distance from \"a\", reading the strings as UTF-8 bytes. Increment for s, decrement for t, and require all zeros.","Without it, a t that is shorter than s would pass, because the loop only detects characters that t has too many of. Comparing lengths first is an equivalent fix.","Slide a window of the word's length across the text, keeping letter counts for the window, and compare with the word's counts at each position. O(n) overall."],
"longest-consecutive-sequence":["The counting loop starts only at the smallest value of each run. Every value belongs to one run and is stepped over once, so the inner loops total at most n steps.","Remember the starting value along with the best length, then produce start, start + 1 and so on.","Union each value with value + 1 when that is also present, tracking component sizes. The largest component is the answer. It works but is heavier than the set method."],
"3sum":["Add an outer loop that fixes one more value and run the three-number method on the rest, skipping duplicates at each level. That is O(n³).","Use the same sorted two-pointer scan, but instead of testing for zero keep the sum with the smallest distance to the target, and move the pointers by comparing the sum with the target.","After a hit both pointers move. Once the left value differs from the previous one, the required right value differs too, so the same triple cannot be formed again."],
"evaluate-reverse-polish-notation":["The right operand was pushed last, so it comes off first. For subtraction and division the order changes the result.","Use the shunting-yard method: output numbers directly, keep operators on a stack, and pop operators of higher or equal precedence before pushing a new one. Parentheses are pushed and popped as markers.","Check that at least two values are on the stack before applying an operator, that a divisor is not zero, and that exactly one value remains at the end. Throw or return nil otherwise."],
"middle-of-the-linked-list":["Stop one step earlier: loop while fast.next?.next exists. Slow then rests on the first of the two middle nodes.","Keep a reference to the node before slow, and at the end link it past slow. A list with one node becomes empty.","fast is advanced by two, so it may land on the last node or on nil. Testing fast.next covers both: optional chaining makes it nil in either case, and the loop stops."],
"invert-binary-tree":["Put the root in a queue. Repeatedly take a node, swap its two children, and add the non-nil children to the queue.","Compare the left and right subtrees as mirror images: the two roots must be equal, and each one's left subtree must mirror the other's right subtree.","No. Swapping and then recursing into both children gives the same result as recursing first, as long as both subtrees are processed exactly once."],
"unique-paths":["Set a blocked cell's count to 0 instead of adding. The first row and column can no longer be assumed to be 1; a block there cuts off everything after it.","Every route is a sequence of m − 1 downs and n − 1 rights. Choosing which positions are downs gives C(m + n − 2, m − 1).","Use the same table but take the minimum of the cell above and the cell to the left, plus the current cell's value."],
"number-of-1-bits":["Every integer type has nonzeroBitCount, along with leadingZeroBitCount and trailingZeroBitCount.","Use DP: bits[i] = bits[i >> 1] + (i & 1), or bits[i] = bits[i & (i − 1)] + 1. O(n) in total.","It must be positive and satisfy x & (x − 1) == 0, meaning it has exactly one set bit."]

"trapping-rain-water":["Build leftMax[i], the tallest bar from the start to i, and rightMax[i], the tallest from i to the end. The water over bar i is min(leftMax[i], rightMax[i]) − height[i]. O(n) time and O(n) space.","Keep a stack of indices with decreasing heights. When a taller bar arrives, pop the top as the floor of a basin; the water added is the distance between the new bar and the new top, times the height difference above the floor.","Use a min-heap seeded with all border cells. Repeatedly pop the lowest boundary cell and visit its neighbours: a lower neighbour holds water up to the boundary height and is then pushed with that height."],
"remove-nth-node-from-end-of-list":["When the head itself is removed there is no real node before it. The dummy node gives every node, including the head, a predecessor, so one piece of code handles all cases.","Stop while advancing the lead pointer if it reaches nil, and return the list unchanged or report an error, depending on what is agreed.","Recurse to the end and count on the way back. Each call returns its distance from the end; the call whose next node has distance n unlinks it. It uses O(n) call stack."],
"find-minimum-in-rotated-sorted-array":["mid may itself be the minimum. Setting hi = mid − 1 could discard it. Because the loop runs while lo < hi and mid is always below hi, hi = mid still shrinks the range.","When nums[mid] equals nums[hi] you cannot tell which side holds the minimum, so reduce hi by one. The worst case becomes O(n).","It is the index of the minimum element, which this search already locates in lo."],
"diameter-of-binary-tree":["Have each call also return the deepest leaf of its subtree, or store parent links. When best improves, record the node and the two leaves, then join the two root-to-leaf paths.","Return the largest weighted depth instead of a count of levels, adding each edge's weight, and update best with the sum of the two largest weighted depths.","The longest path may sit entirely within one subtree, far from the root. Only checking every node as a possible bending point finds it."],
"combination-sum":["Sort the candidates, recurse with i + 1 instead of i, and skip a candidate equal to the previous one at the same depth so equal values do not produce repeated combinations.","Passing i lets the same candidate be chosen again at the next level. Passing i + 1 would allow each candidate at most once.","Use DP as in the coin-change counting problem: ways[0] = 1, and for each candidate add ways[a − candidate] to ways[a] for a from the candidate up to the target."],
"word-break":["Store, for each reachable end, the start that made it reachable. Walk back from the end of the string following those starts to read off the words.","Use backtracking with memoisation: for each start position return every list of words that segments the rest. The number of results can be exponential.","Insert the dictionary into a trie. From each reachable start, walk the trie along the string and mark every position where a word ends. This avoids building and hashing substrings."],
"maximum-product-subarray":["A large negative product becomes a large positive one when multiplied by another negative. If only the maximum is kept, that information is lost.","Track the start index of the runs behind hi and lo along with their values. When best improves, record the start of the hi run and the current index.","After a zero, both hi and lo become 0, and the next element starts a fresh run because the candidate 'x alone' wins or ties. So a zero splits the array into independent parts."],

"search-a-2d-matrix":["Start at the top-right corner. Move left when the value is too large and down when it is too small. Each step discards a row or a column, giving O(rows + cols).","First binary-search the rows for the last row whose first value is ≤ target, then binary-search inside that row. The cost is log rows + log cols, the same total.","A row holds cols values, so position p is in row p / cols at column p % cols. Dividing by rows would only be right for a square grid."],
"koko-eating-bananas":["The middle speed may itself be the smallest that works, so it must stay in the range. Because the loop runs while lo < hi and speed is below hi, the range still shrinks.","Compute (pile + speed − 1) / speed. Adding speed − 1 before dividing pushes any remainder up to the next whole number.","Examples: the smallest ship capacity to deliver packages within d days, splitting an array so the largest part is minimal, and the smallest divisor keeping a sum under a threshold."],
"implement-queue-using-stacks":["If elements were poured while the outbox still held some, the newer elements would land on top of older ones and leave first, breaking arrival order.","Charge each element three units when it is pushed: one for the push, one for its single move to the outbox, one for its pop. No element is moved twice, so n operations cost O(n) in total.","Use one queue. After each push, rotate the queue by moving the elements in front of the new one to the back, so the newest is at the front. Push is O(n) and pop is O(1)."],
"balanced-binary-tree":["The two subtrees can have equal heights while one of them is badly unbalanced inside. The rule must hold at every node.","guard let with two bindings evaluates them in order and stops at the first nil. If the left result is nil, the right subtree is never visited.","An AVL tree stores a height or balance factor in each node and restores this property after every insert or delete by rotating nodes, keeping operations O(log n)."],
"redundant-connection":["A directed version has two failure cases: a node with two parents, and a cycle. You record the two candidate edges for the double parent and use Union Find to see which one must go.","Before adding each edge, run DFS from one end to see whether the other end is already reachable. If it is, that edge is the answer. This is O(n²) overall.","Until the cycle closes, the edges form a forest. The first edge whose ends are already connected completes the cycle, so every other edge of that cycle came earlier in the input."],
"missing-number":["Subtract the sum of the array from n(n + 1) / 2. In languages with fixed-width integers watch for overflow on large n.","XOR alone gives a ^ b. Use the sum and the sum of squares to form two equations, or split the numbers by a set bit of a ^ b and XOR each group separately.","The loop covers indices 0 to n − 1, but the range of numbers goes up to n. Starting acc at n includes that last number."],
"jump-game-ii":["Reaching the last index needs no further jump. If the loop included it and it happened to equal end, an extra jump would be counted.","Remember for each index the index it was best reached from, updating whenever farthest improves, then walk back from the end.","Check whether i ever exceeds farthest, as in Jump Game, and return −1 or nil in that case."],

"same-tree":["For every node of the larger tree, run the same-tree check against the smaller tree's root; return true if any succeeds. That is O(n · m) in the worst case.","Keep a queue or stack of node pairs. Pop a pair, apply the same nil and value checks, and push the two pairs of children.","Compare the left and right subtrees as mirror images: the roots must be equal, and each one's left must mirror the other's right."],
"counting-bits":["bits[i] = bits[i & (i − 1)] + 1, because i & (i − 1) is i with its lowest set bit removed.","Each answer is built from the answer to a smaller sub-problem that was stored earlier, which is the definition of bottom-up DP.","Sum the list, or count per bit position: for each position, full cycles of 2^(p+1) contribute 2^p ones each, plus the remainder."],

"course-schedule-ii":["Replace the queue with a min-heap so the smallest available course number is always taken next.","Run a DFS with three states per node. Append a node after all the nodes that depend on it are finished, then reverse the list. Meeting an in-progress node means a cycle.","Courses are appended only when all their prerequisites are already in the queue, and nothing is ever removed, so the final contents are in a valid order."],
"kth-smallest-element-in-a-bst":["Store in each node the size of its left subtree. Then go left if k is at most that size, return the node if k is one more, otherwise go right with k reduced. That is O(h) per query.","Do an in-order recursion with a counter captured from the outer function; record the value when the counter reaches k and stop descending.","Do the mirrored traversal: go right first, then the node, then left."],
"longest-palindromic-substring":["dp[i][j] is true when s[i...j] is a palindrome: the end characters match and dp[i + 1][j − 1] is true (or the length is under 3). Fill by increasing length. O(n²) time and space.","Use the same centre expansion and add 1 for every successful match instead of tracking the longest.","It reuses the palindrome radii already computed to the left of the current position, using symmetry inside the widest palindrome found so far, so most expansions start from a known length. Total O(n)."],

"subtree-of-another-tree":["Serialise both trees with markers for missing children and a separator before each value, then search for one string in the other with a linear-time matcher such as KMP. Alternatively hash every subtree bottom-up and compare hashes.","Different trees can share the same in-order sequence. Without markers for missing children, and without separators between values, the sequence does not determine the shape.","Here the match must include every descendant down to the leaves. A containment check would allow the larger tree to continue below the matched part."],
"lowest-common-ancestor-of-a-binary-search-tree":["Use post-order recursion: return the node if it is one of the targets, otherwise search both children. If both sides return something, the current node is the answer; otherwise pass up whichever side found one.","First confirm that both values exist with two ordinary BST searches, or have the search report how many targets were found, and return nil if either is missing.","If both values are smaller, return the result for the left child; if both are larger, for the right child; otherwise return the node. It uses O(h) call stack."],
"house-robber-ii":["Every valid plan leaves out the first house or the last house. Solving once without each covers all plans, and a plan that leaves out both is included in either pass.","With one house both slices are empty and would give 0, but the house can be taken. With two or more houses the slices handle everything.","Use DFS returning two values per node: the best total taking the node and the best not taking it."],
"decode-ways":["Count the choices per position: a wildcard alone has 9 options; as the first of two digits it can be 1 or 2 depending on the second; as the second it has 9 options after 1 and 6 after 2. Multiply the earlier counts by those factors.","Use backtracking: at each position try one digit and, if valid, two digits, appending the letter and recursing. The number of results can be exponential.","0 has no letter of its own. It is valid only as the second digit of 10 or 20, so a 0 after any other digit, or at the start, makes the count 0."],
"find-the-duplicate-number":["Values are between 1 and n, so nothing points to index 0. That guarantees index 0 is outside the cycle, which the second phase of Floyd's method requires.","Pick a middle value and count how many numbers are less than or equal to it. If the count exceeds the middle value, the duplicate is in the lower half; otherwise in the upper half. O(n log n) time, O(1) space.","Mark visits by negating the value at the index each number points to; meeting an already negative value reveals the duplicate. Or place each value at its own index by swapping."],
"kth-largest-element-in-a-stream":["The value needed is the smallest of the k largest. A min-heap has exactly that at its root, and it is also the one to discard when a larger number arrives.","Keep all values in two heaps or a balanced tree so the boundary can move, since a heap of size k has discarded what a larger k would need.","Keep a max-heap for the lower half and a min-heap for the upper half, balanced in size. The median is the top of the larger heap or the average of both tops."],
"longest-repeating-character-replacement":["The answer only improves when a window has a higher most-common count than any before. A stale value can make the window keep its size instead of shrinking, but it never lets the window grow beyond what a real count justified.","After removing the left character, recompute the maximum over the 26 counts. That costs O(26 · n), which is still linear.","Then the cost of fixing a window depends on which letters it contains, so track the cost per target letter separately, for example by running the window once per allowed target."],
"reverse-bits":["Precompute the reversal of every byte in a 256-entry table, then reverse a 32-bit value by reversing its four bytes and swapping their order.","Swap the two 16-bit halves, then the 8-bit halves of each, then 4-bit, 2-bit and 1-bit groups, using a mask and two shifts at each stage. Five steps in total.","Stopping when x reaches 0 would leave the result short by the number of leading zeros, which must appear as trailing zeros in the answer."]

"word-search":["Check first that the board contains every letter of the word often enough. Searching from the rarer end of the word also cuts branches.","Put the words in a trie and run one DFS per cell that walks the trie along with the board, collecting every word reached. That is the approach for Word Search II.","The mark means 'used on the current path'. If it stayed after a failed attempt, later paths that legitimately need that cell would be blocked."],
"reorder-list":["Without the cut, the first half still links into the second half, so the weave would create a cycle or lose track of where the first half ends.","Push every node on a stack, then walk from the head taking n / 2 nodes from the stack and inserting each after the current front node. It uses O(n) extra memory.","Finding the middle of a list, reversing a list, and merging two lists alternately."],
"lru-cache":["Removing a node needs its predecessor. With a doubly linked list that is one step; a singly linked list would need a search from the head.","Each node's next reference already owns the following node. If prev were also strong, neighbouring nodes would own each other and ARC could never free them.","Guard get and put with a lock or run them on a serial queue, or make the cache an actor. Even get must be guarded because it changes the order."],
"binary-tree-maximum-path-sum":["A branch with a negative total would lower the sum, and a path is free to stop at the node instead of going down that side.","A path through the parent can continue into only one child's side. Using both would make the path fork, which is not a path.","Have each call also return the nodes of its best branch, and when best improves, store the left branch reversed, the node, and the right branch."],
"largest-rectangle-in-histogram":["It is lower than every bar, so it pops everything still on the stack and their rectangles get measured. Without it, increasing bars would never be resolved.","The width of a rectangle comes from positions. An index gives the position and, through the array, the height.","Treat each row as the base of a histogram whose bar heights count consecutive 1s above it, and run this algorithm on every row. O(rows × cols)."],
"minimum-window-substring":["A negative value records a surplus: the window holds more of that character than required. It lets the shrink step know that removing one does not break the window.","When a window ties the best length, add its start to a list instead of ignoring it; clear the list when a strictly shorter window is found.","Then it is a subsequence problem. Track for each position the latest start from which t can be matched in order, using DP or a forward and backward scan."],
"merge-k-sorted-lists":["Merge lists in pairs so the number of lists halves each round. There are log k rounds and each touches all N nodes: O(N log k), with no heap.","The growing result is rescanned for every list, so early nodes are compared again and again: O(N · k) in total.","Read one block from each file, keep the current smallest items in a heap, and write output in blocks. This is the merge phase of external sorting."],
"construct-binary-tree-from-preorder-and-inorder-traversal":["The last value in post-order is the root. Process post-order from the end and build the right subtree before the left.","Both list the root at an end but neither shows where the left subtree stops, so a node with a single child could be on either side.","A value's position in the in-order list is no longer unique, so the split point is ambiguous and several trees fit."]

"serialize-and-deserialize-binary-tree":["Write values in BFS order with a marker for each missing child. To read, keep a queue of parents and give each the next two tokens as its children.","Drop trailing markers, use a compact binary encoding, or for a BST store pre-order alone, since the ordering rule recovers the shape.","Without them, different trees give the same sequence of values. The markers record where each subtree ends."],
"word-ladder":["Run BFS from the start and from the end alternately, always expanding the smaller frontier, and stop when the two meet. It explores far fewer words.","Record for each discovered word the word it came from, then walk back from the end word to the start and reverse the list.","If removal waited until processing, the same word could be queued several times from different parents within one level, wasting work."],
"n-queens":["Keep the same search but increment a counter at row n instead of building the board strings.","Moving one step down-right adds 1 to both row and column, so row − col stays the same. Moving down-left adds 1 to the row and subtracts 1 from the column, so row + col stays the same.","Represent the attacked columns and diagonals as three integers. The free squares in a row are the zero bits of their combination, and shifting the diagonal masks moves them to the next row."],
"median-of-two-sorted-arrays":["The split in the other array is half − i. Searching the shorter one keeps that value from going negative or past the end, and makes the cost log of the smaller length.","Use the same partition idea with k in place of half, or repeatedly discard k / 2 elements from whichever array has the smaller value at that offset.","They mean 'nothing on this side of the split'. Int.min never exceeds a right-hand value and Int.max is never below a left-hand value, so the comparisons still work at the ends."],
"find-median-from-data-stream":["It guarantees the ordering between the halves: the value that crosses to high is the largest of low after the new number joined, so nothing in low exceeds anything in high.","Use two balanced trees or heaps with lazy deletion: mark removed values and discard them when they reach a top, tracking the real sizes separately.","Keep 101 counters. Adding is O(1), and the median is found by walking the counters to the middle position, which is a constant amount of work."],
"word-search-ii":["When a word is reported and its node has no children left, delete the node from its parent. Dead branches then stop attracting the search.","The DFS then knows the word as soon as it reaches the node, without rebuilding it from the path, and clearing it marks the word as already reported.","Word Search looks for one word, guided by its letters. Here many words are searched in a single pass, guided by the trie, so shared prefixes are walked once."],
"sort-list":["Use bottom-up merge sort: merge runs of length 1, then 2, then 4, relinking nodes with a loop instead of recursion. No call stack is needed.","With fast one ahead, slow stops at the last node of the first half, which is the node whose next must be cut. For two nodes this splits them one and one instead of looping forever.","Merging relinks nodes without extra arrays, and splitting needs no random access. Quicksort and heapsort both rely on indexing."],
"clone-graph":["Put the start node in a queue and its copy in the dictionary. For each node taken from the queue, look at its neighbours: create and queue copies for unseen ones, and append each neighbour's copy to the current copy.","A cycle leads back to a node whose neighbours are still being copied. If its copy were not yet registered, the recursion would create another copy and never finish.","Use a dictionary from original node to copy in two passes: first create all the copies, then set each copy's next and random through the dictionary."],
"pacific-atlantic-water-flow":["A search from each cell repeats work for neighbouring cells. Two searches from the edges visit every cell at most twice in total.","Put all of one ocean's edge cells in a queue and expand to unmarked neighbours that are at least as high; repeat for the other ocean.","Use eight directions in the climb. Nothing else changes."],
"design-add-and-search-words-data-structure":["Group stored words by length so a pattern only meets words of its own length, or keep counts of what lies below each node so impossible branches can be skipped.","At a star, try matching zero letters (stay on this node and advance the pattern) or one letter (move to each child and keep the star). Memoise on node and pattern position.","A hash set answers exact lookups only. A pattern with dots would have to be compared with every stored word."],
"meeting-rooms":["That is Meeting Rooms II: the answer is the largest number of meetings running at the same time.","Return the two neighbours at the point where the check fails; after sorting they are a genuine overlapping pair.","Keep the meetings in a structure ordered by start time. On insertion, compare only with the neighbour before and the neighbour after."],
"meeting-rooms-ii":["Sort by start. Keep a min-heap of end times of rooms in use. For each meeting, pop the earliest end if it is not later than the start, then push this meeting's end. The largest heap size is the answer.","Only the number of meetings in progress matters, not which start pairs with which end. Sorted separately, the two lists still give the correct count at every moment.","Keep a heap of (end time, room) pairs and a pool of free room numbers; when a room's end time passes, return its number to the pool."],

  $("#tc-start").onclick = () => { const d = $("#tc-diff").value, pool = CAT.filter(p => p.platform === "LeetCode" && p.difficulty === d && statusOf(p.problemId) !== "solved" && !/subscription/.test(p.contentAccess)); const p = pick(pool.length ? pool : CAT.filter(x => x.difficulty === d)); iv.tc = {pid:p.problemId, end:Date.now() + {Easy:15, Medium:25, Hard:40}[d] * 60000}; viewInterview(); };
  $("#mk-start").onclick = () => { iv.mock = {pid:pick(CAT.filter(p => p.platform === "LeetCode" && p.rank === 1 && !/subscription/.test(p.contentAccess))).problemId, start:Date.now()}; viewInterview(); };
  if ($("#mk-stop")) $("#mk-stop").onclick = () => { iv.mock = null; viewInterview(); }; }
// ---- progress & coverage
function viewProgress() { const c = counts(), plats = uniq(CAT.map(p => p.platform)), pats = uniq(CAT.map(p => p.patterns[0]));
  $("#view").innerHTML = `<div class="stack"><h1>Progress and coverage</h1><p class="muted">Your progress is stored only in this browser. The coverage report states exactly what this academy contains and what it does not.</p></div>
  <div class="stats"><div class="stat"><b>${c.solved}</b><span>solved</span></div><div class="stat"><b>${c.rev}</b><span>need revision</span></div><div class="stat"><b>${c.bm}</b><span>bookmarked</span></div><div class="stat"><b>${ROADMAP.filter((_, i) => store.days[dkey(i)]).length}/180</b><span>roadmap days</span></div><div class="stat"><b>${store.quiz.right}/${store.quiz.total}</b><span>quiz answers right</span></div></div>
  <div class="grid2"><section class="panel"><h2>Progress by pattern</h2><div class="stack">${pats.map(x => { const ps = CAT.filter(p => p.patterns[0] === x), s = ps.filter(p => statusOf(p.problemId) === "solved").length; return `<div><div class="row" style="justify-content:space-between"><span>${esc(x)}</span><span class="small muted mono">${s}/${ps.length}</span></div><div class="bar-track"><div class="bar-fill" style="width:${100 * s / ps.length}%"></div></div></div>`; }).join("")}</div></section>
  <div class="stack"><section class="panel"><h2>Catalog coverage report</h2><div class="scroll-x"><table><thead><tr><th>Platform</th><th>Catalogued</th><th>Complete lessons</th><th>Metadata only</th><th>Checked against the live site</th></tr></thead><tbody>${plats.map(pl => { const ps = CAT.filter(p => p.platform === pl), l = ps.filter(p => p.lessonId).length; return `<tr><td>${esc(pl)}</td><td class="num">${ps.length}</td><td class="num">${l}</td><td class="num">${ps.length - l}</td><td class="num">${ps.filter(p => p.verified).length} of ${ps.length}</td></tr>`; }).join("")}<tr><td><b>Total</b></td><td class="num">${c.total}</td><td class="num">${c.lessons}</td><td class="num">${c.meta}</td><td class="num">${CAT.filter(p => p.verified).length} of ${c.total}</td></tr></tbody></table></div>
   <ul class="plain"><li>This is a small starter catalog, not a full copy of any platform. Each platform lists thousands of problems; ${c.total} are catalogued here.</li><li>NeetCode and GeeksforGeeks are linked as hubs only. None of their pages are catalogued individually.</li><li><b>Checked on 2026-11-10:</b> all 5 Codeforces entries (title, URL and rating, against the official API), all 10 HackerRank entries and all 5 AtCoder entries (the official page loads and its title matches). No mismatch was found. HackerRank and AtCoder difficulty labels were not checked.</li><li><b>Not checked: the LeetCode entries.</b> LeetCode answered the automated check with a bot challenge, which was not bypassed. Their numbers, titles, difficulty labels and URLs are written from memory of public listings; follow the official link to confirm.</li><li>No problem statement or editorial text is reproduced. Explanations are original.</li><li>Three LeetCode entries are marked as needing a platform subscription.</li></ul></section>
  <section class="panel"><h2>What was validated</h2><ul class="plain"><li>108 lesson solutions and 2 alternative approaches: compiled and run with Swift 6.2 on macOS, 453 checks passed.</li><li>20 pattern templates and 11 application snippets (two applications reuse a pattern template): compiled and run, 33 checks passed.</li><li>110 trace mirrors (JavaScript): 450 results match the Swift test expectations; every highlighted line maps to the statement it describes.</li><li>Flowcharts: hand-written summaries of each solution's control flow. They were read against the Swift but are not generated from it.</li><li>Not validated: LeetCode catalog metadata against the live site, submission on any judge, the HackerRank input format assumed in the Two Sum adapter, and the deliberately broken snippets in the bug drill.</li></ul></section></div></div>
  <section class="panel"><h2>Catalog record format</h2><p>Each entry carries these fields so the catalog can grow one verified record at a time. A new record starts as metadata only; <code>solutionStatus</code> and <code>visualizationStatus</code> change only after the Swift passes its tests and a trace exists.</p><pre class="code" style="padding:10px 14px;white-space:pre">${esc(JSON.stringify((({lessonId, rank, verified, ...r}) => r)(BY_ID["lc-1"]), null, 2))}</pre><p class="small muted">Provenance is recorded in <code>verificationStatus</code> and <code>lastUpdated</code>. Sources may only be public listings and official pages; nothing behind a login, paywall or rate limit is collected.</p></section>
  <section class="panel"><h2>Your data</h2><p class="small muted">Copy this to keep a backup. It never leaves your browser unless you copy it.</p><textarea class="scratch" id="export" readonly style="min-height:90px">${esc(JSON.stringify({status:store.status, bm:store.bm, days:store.days, quiz:store.quiz}))}</textarea><div class="row"><button id="reset-ask">Reset all progress</button><span id="reset-confirm" hidden>This clears statuses, bookmarks, roadmap ticks and scratchpads. <button class="primary" id="reset-yes">Yes, reset</button> <button id="reset-no">Cancel</button></span></div></section>`;
  $("#reset-ask").onclick = () => $("#reset-confirm").hidden = false; $("#reset-no").onclick = () => $("#reset-confirm").hidden = true;
  $("#reset-yes").onclick = () => { store = {status:{}, bm:{}, days:{}, scratch:{}, at:{}, quiz:{right:0, total:0}, f:{}}; save(); viewProgress(); }; }
// ---- router
const VIEWS = {explorer:viewExplorer, patterns:viewPatterns, roadmap:viewRoadmap, apps:viewApps, playground:viewPlayground, interview:viewInterview, qa:viewQA, progress:viewProgress};
function render(scroll) { stopPlay(); clearTicker();
  $("#tabs").innerHTML = TABS.map(t => `<button class="tab" role="tab" aria-selected="${state.tab === t[0] && !state.pid}" data-tab="${t[0]}">${t[1]}</button>`).join("");
  if (state.pid) viewProblem(state.pid); else VIEWS[state.tab]();
  if (scroll) window.scrollTo(0, 0); }
const openProblem = pid => { state.pid = pid; state.variant = null; try { history.replaceState(null, "", "#" + pid); } catch (e) {} render(true); };
const openTab = t => { state.tab = t; state.pid = null; try { history.replaceState(null, "", "#" + t); } catch (e) {} render(true); };
$("#tabs").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) openTab(b.dataset.tab); });
$("#view").addEventListener("change", e => { const d = e.target.dataset.day; if (d !== undefined) { if (e.target.checked) store.days[dkey(Number(d))] = 1; else delete store.days[dkey(Number(d))]; save(); viewRoadmap(); } });
$("#view").addEventListener("click", e => { const t = e.target; if (t.closest("[data-stop]")) return; let el;
  if ((el = t.closest("[data-variant]"))) { state.variant = el.dataset.variant || null; return viewProblem(state.pid); }
  if ((el = t.closest("[data-st]"))) { setStatus(state.pid, el.dataset.st); return void ($("#pc").outerHTML = statusControls(BY_ID[state.pid])); }
  if (t.closest("[data-bm]")) { if (store.bm[state.pid]) delete store.bm[state.pid]; else store.bm[state.pid] = 1; save(); return void ($("#pc").outerHTML = statusControls(BY_ID[state.pid])); }
  if ((el = t.closest("[data-tc]"))) { setStatus(iv.tc.pid, el.dataset.tc); iv.tc = null; return viewInterview(); }
  if ((el = t.closest("[data-ans]"))) { const o = iv[el.dataset.ans]; o.chosen = el.dataset.v; score(o.chosen === o.answer); return viewInterview(); }
  if ((el = t.closest("[data-new]"))) { el.dataset.new === "pq" ? newPatternQ() : newComplexityQ(); return viewInterview(); }
  if ((el = t.closest("[data-drill]"))) { if (el.dataset.drill === "show") iv.drill.shown = true; else newDrill(); return viewInterview(); }
  if ((el = t.closest("[data-bug]"))) { if (iv.bugPick === null) { iv.bugPick = Number(el.dataset.bug); score(iv.bugPick === BUGS[iv.bug].bug); } return viewInterview(); }
  if (t.closest("[data-bugnext]")) { iv.bug = (iv.bug + 1) % BUGS.length; iv.bugPick = null; return viewInterview(); }
  if ((el = t.closest("[data-pat]"))) { state.pat = Number(el.dataset.pat); viewPatterns(); const d = $("#pat-detail"); if (d && d.scrollIntoView) d.scrollIntoView({block:"start", behavior:"auto"}); return; }
  if ((el = t.closest("[data-pattern]"))) { const i = PATTERNS.findIndex(x => x[0] === el.dataset.pattern); if (i >= 0) { state.pat = i; openTab("patterns"); } return; }
  if ((el = t.closest("[data-go]"))) return openTab(el.dataset.go);
  if ((el = t.closest("[data-open]"))) return openProblem(el.dataset.open); });
(() => { const h = (location.hash || "").slice(1); if (BY_ID[h]) state.pid = h; else if (VIEWS[h]) state.tab = h; render(false); })();
</script>
